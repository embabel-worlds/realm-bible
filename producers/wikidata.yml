# Saints from Wikidata, fetched live: https://query.wikidata.org/sparql — CC0 data, no key, no account.
#
# Every producer is keyed by the saint's (or country's) Wikidata entity IRI, never by a name: a name
# search finds a church as readily as a saint ("Saint Agnes of Rome church in Lublin"), which is why
# the calendar's saints are matched to Wikidata once, at build time, and reviewed
# (scripts/saints/calendar-saints.json). The keys arrive in one VALUES clause per request.
#
# Wikidata asks for a descriptive User-Agent with a contact URL, and the public endpoint is shared:
# batches stay modest and answers are cached for a week, misses included.

# ── A saint's card ───────────────────────────────────────────────────────────────────────────
# One row per saint: GROUP BY with SAMPLE, because a saint with two recorded birthplaces (or two
# images) would otherwise return two rows and the card would MERGE onto an arbitrary one. Places come
# with coordinates (P625) and their country, so the app can draw a map without a second call. The
# English Wikipedia article is carried with underscores for spaces — the form the page-summary API
# takes in its path.
- name: saintCardByEntity
  kind: sparql
  endpoint: "https://query.wikidata.org/sparql"
  query: |
    SELECT ?wd (SAMPLE(?label) AS ?wdLabel) (SAMPLE(?desc) AS ?wdDescription)
           (SAMPLE(?born) AS ?birthDate) (SAMPLE(?died) AS ?deathDate)
           (SAMPLE(?bpLabel) AS ?birthPlace) (SAMPLE(?bpCoord) AS ?birthCoord) (SAMPLE(?bcLabel) AS ?birthCountry)
           (SAMPLE(?dpLabel) AS ?deathPlace) (SAMPLE(?dpCoord) AS ?deathCoord) (SAMPLE(?dcLabel) AS ?deathCountry)
           (SAMPLE(?burLabel) AS ?burialPlace) (SAMPLE(?burCoord) AS ?burialCoord)
           (SAMPLE(?img) AS ?image) (SAMPLE(?canonLabel) AS ?canonization) (SAMPLE(?orderLabel) AS ?religiousOrder)
           (SAMPLE(?feastLabel) AS ?feastDay) (SAMPLE(?articleKey) AS ?article)
    WHERE {
      VALUES ?wd { {{keys}} }
      OPTIONAL { ?wd rdfs:label ?label FILTER(LANG(?label) = "en") }
      OPTIONAL { ?wd schema:description ?desc FILTER(LANG(?desc) = "en") }
      OPTIONAL { ?wd wdt:P569 ?born }
      OPTIONAL { ?wd wdt:P570 ?died }
      OPTIONAL { ?wd wdt:P19 ?bp . ?bp rdfs:label ?bpLabel FILTER(LANG(?bpLabel) = "en")
                 OPTIONAL { ?bp wdt:P625 ?bpCoord } OPTIONAL { ?bp wdt:P17 ?bc . ?bc rdfs:label ?bcLabel FILTER(LANG(?bcLabel) = "en") } }
      OPTIONAL { ?wd wdt:P20 ?dp . ?dp rdfs:label ?dpLabel FILTER(LANG(?dpLabel) = "en")
                 OPTIONAL { ?dp wdt:P625 ?dpCoord } OPTIONAL { ?dp wdt:P17 ?dc . ?dc rdfs:label ?dcLabel FILTER(LANG(?dcLabel) = "en") } }
      OPTIONAL { ?wd wdt:P119 ?bur . ?bur rdfs:label ?burLabel FILTER(LANG(?burLabel) = "en") OPTIONAL { ?bur wdt:P625 ?burCoord } }
      OPTIONAL { ?wd wdt:P18 ?img }
      OPTIONAL { ?wd wdt:P411 ?canon . ?canon rdfs:label ?canonLabel FILTER(LANG(?canonLabel) = "en") }
      OPTIONAL { ?wd wdt:P611 ?order . ?order rdfs:label ?orderLabel FILTER(LANG(?orderLabel) = "en") }
      OPTIONAL { ?wd wdt:P841 ?feast . ?feast rdfs:label ?feastLabel FILTER(LANG(?feastLabel) = "en") }
      OPTIONAL { ?art schema:about ?wd ; schema:isPartOf <https://en.wikipedia.org/> ; schema:name ?artName .
                 BIND(REPLACE(STR(?artName), " ", "_") AS ?articleKey) }
    }
    GROUP BY ?wd
  keyVar: wd
  keyForm: iri
  fetch:
    maxKeysPerCall: 25
    timeoutSeconds: 60
    userAgent: "EmbabelRealmBible/0.1 (https://github.com/embabel-worlds/realm-bible)"
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 604800 }

# ── What a saint is patron of ────────────────────────────────────────────────────────────────
# Wikidata records patronage on the PATRONISED thing (P417 "patron saint", on a city or a trade), so
# this reads the inverse. Churches, convents and chapels dedicated to the saint carry the same
# property and outnumber everything else (Francis of Assisi: 65 church buildings alone), so every
# architectural structure (Q811979) is excluded, with disambiguation pages, and the rest capped.
- name: saintPatronageByEntity
  kind: sparql
  endpoint: "https://query.wikidata.org/sparql"
  query: |
    SELECT ?wd ?thing ?thingLabel ?kindLabel ?patronKey WHERE {
      VALUES ?wd { {{keys}} }
      ?thing wdt:P417 ?wd .
      FILTER NOT EXISTS { ?thing wdt:P31/wdt:P279* wd:Q811979 }
      FILTER NOT EXISTS { ?thing wdt:P31 wd:Q4167410 }
      ?thing rdfs:label ?thingLabel FILTER(LANG(?thingLabel) = "en")
      OPTIONAL { ?thing wdt:P31 ?kind . ?kind rdfs:label ?kindLabel FILTER(LANG(?kindLabel) = "en") }
      BIND(CONCAT(STR(?wd), "|", STR(?thing)) AS ?patronKey)
    }
    LIMIT 400
  keyVar: wd
  keyForm: iri
  fetch:
    maxKeysPerCall: 5
    timeoutSeconds: 60
    userAgent: "EmbabelRealmBible/0.1 (https://github.com/embabel-worlds/realm-bible)"
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 604800 }

# ── The saints and blessed of a country ──────────────────────────────────────────────────────
# Keyed by the country's entity IRI (reference/catholic-countries.yml maps ISO 3166 codes to it, so
# the app can start from the reader's locale). A person counts when either their citizenship or their
# birthplace's country is that country, and Wikidata gives Catholic evidence for their sanctity.
# A bare canonization status is not that evidence: P411 also carries other churches' saints — the
# African Orthodox Church's John Coltrane, the Episcopal Church's Thurgood Marshall, the Orthodox
# hieromartyrs. So a person counts on one of: a status only the Catholic process confers (Catholic
# saint, blessed, Venerable, servant of God — not "The Venerable", which Wikidata also uses for the
# Orthodox prepodobni); an entry in a Catholic hagiography (Santi e Beati,
# Nominis, the Dicastery's causesanti.va); a status a pope conferred; or a plain "saint" who died
# before 1054, venerated by the undivided Church. And never when the status names a conferring body
# with no pope or Catholic body beside it — a stray qualifier must not undo a pope's own. `fame` is the number of Wikipedias with an article on them
# (Wikidata's sitelink count): a fair proxy for "famous", so Patrick comes before a 5th-century
# bishop known from one martyrology. The 600 most famous are kept.
- name: saintsOfCountryByFame
  kind: sparql
  endpoint: "https://query.wikidata.org/sparql"
  query: |
    SELECT ?country ?wd (SAMPLE(?label) AS ?wdLabel) (SAMPLE(?desc) AS ?wdDescription)
           (SAMPLE(?canonLabel) AS ?canonization) (SAMPLE(?born) AS ?birthDate) (SAMPLE(?died) AS ?deathDate)
           (SAMPLE(?feastLabel) AS ?feastDay) (SAMPLE(?articleKey) AS ?article) (SAMPLE(?links) AS ?fame)
           (CONCAT(STR(?country), "|", STR(?wd)) AS ?memberKey)
    WHERE {
      VALUES ?country { {{keys}} }
      { ?wd wdt:P27 ?country } UNION { ?wd wdt:P19/wdt:P17 ?country }
      ?wd wdt:P411 ?canon .
      {
        ?wd wdt:P411 ?catholicStatus
        VALUES ?catholicStatus { wd:Q3464126 wd:Q2369287 wd:Q51620 wd:Q869974 wd:Q51619 }
      } UNION {
        ?wd wdt:P6126|wdt:P4286|wdt:P9588 []
      } UNION {
        ?wd wdt:P411 ?plainSaint VALUES ?plainSaint { wd:Q43115 wd:Q123110154 }
        ?wd wdt:P570 ?undivided FILTER(YEAR(?undivided) < 1054)
      } UNION {
        ?wd p:P411/pq:P1027 ?pope . ?pope wdt:P39 wd:Q19546
      }
      FILTER(EXISTS { ?wd p:P411/pq:P1027 ?catholicBody .
                      { ?catholicBody wdt:P39 wd:Q19546 } UNION { VALUES ?catholicBody { wd:Q9592 wd:Q159583 wd:Q1131466 } } }
             || NOT EXISTS { ?wd p:P411/pq:P1027 [] })
      ?canon rdfs:label ?canonLabel FILTER(LANG(?canonLabel) = "en")
      ?wd rdfs:label ?label FILTER(LANG(?label) = "en")
      ?wd wikibase:sitelinks ?links .
      OPTIONAL { ?wd schema:description ?desc FILTER(LANG(?desc) = "en") }
      OPTIONAL { ?wd wdt:P569 ?born }
      OPTIONAL { ?wd wdt:P570 ?died }
      OPTIONAL { ?wd wdt:P841 ?feast . ?feast rdfs:label ?feastLabel FILTER(LANG(?feastLabel) = "en") }
      OPTIONAL { ?art schema:about ?wd ; schema:isPartOf <https://en.wikipedia.org/> ; schema:name ?artName .
                 BIND(REPLACE(STR(?artName), " ", "_") AS ?articleKey) }
    }
    GROUP BY ?country ?wd
    ORDER BY DESC(?fame)
    LIMIT 600
  keyVar: country
  keyForm: iri
  fetch:
    maxKeysPerCall: 1
    timeoutSeconds: 60
    userAgent: "EmbabelRealmBible/0.1 (https://github.com/embabel-worlds/realm-bible)"
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 604800 }

# ── A saint's life, from Wikipedia ────────────────────────────────────────────────────────────
# The page-summary endpoint: the article's opening paragraphs as plain text, its thumbnail and URL.
# CC BY-SA 4.0 — fetched live and shown with its link, never stored. Wikipedia answers redirects for
# the canonical title, so the key is whatever title Wikidata's sitelink names. A week's cache: the
# summary of a saint's life is not news.
- name: wikipediaSummary
  kind: remote
  operation: pageSummary
  records: "$"
  keyArgs: [title]
  echoKeyAs: key
  maxKeysPerCall: 1
  project:
    title: title
    extract: extract
    thumbnail: thumbnail.source
    pageUrl: content_urls.desktop.page
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 86400 }
