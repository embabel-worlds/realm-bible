# Saints from Wikidata, fetched live: https://query.wikidata.org/sparql — CC0 data, no key, no account.
#
# Every producer is keyed by the saint's (or country's) Wikidata entity IRI, never by a name: a name
# search finds a church as readily as a saint ("Saint Agnes of Rome church in Lublin"), which is why
# the calendar's saints are matched to Wikidata once, at build time, and reviewed
# (scripts/saints/calendar-saints.json). The keys arrive in one VALUES clause per request.
#
# Wikidata asks for a descriptive User-Agent with a contact URL, and the public endpoint is shared:
# batches stay modest and answers are cached for a week, misses included.

# ── A saint's card ───────────────────────────────────────────────────────────────────────────
# One row per saint: GROUP BY with SAMPLE, because a saint with two recorded birthplaces (or two
# images) would otherwise return two rows and the card would MERGE onto an arbitrary one. Places come
# with coordinates (P625) and their country, so the app can draw a map without a second call. The
# English Wikipedia article is carried with underscores for spaces — the form the page-summary API
# takes in its path.
- name: saintCardByEntity
  kind: sparql
  endpoint: "https://query.wikidata.org/sparql"
  query: |
    SELECT ?wd (SAMPLE(?label) AS ?wdLabel) (SAMPLE(?desc) AS ?wdDescription)
           (SAMPLE(?born) AS ?birthDate) (SAMPLE(?died) AS ?deathDate)
           (SAMPLE(?bpLabel) AS ?birthPlace) (SAMPLE(?bpCoord) AS ?birthCoord) (SAMPLE(?bcLabel) AS ?birthCountry)
           (SAMPLE(?dpLabel) AS ?deathPlace) (SAMPLE(?dpCoord) AS ?deathCoord) (SAMPLE(?dcLabel) AS ?deathCountry)
           (SAMPLE(?burLabel) AS ?burialPlace) (SAMPLE(?burCoord) AS ?burialCoord)
           (SAMPLE(?img) AS ?image) (SAMPLE(?canonLabel) AS ?canonization) (SAMPLE(?orderLabel) AS ?religiousOrder)
           (SAMPLE(?feastLabel) AS ?feastDay) (SAMPLE(?articleKey) AS ?article)
    WHERE {
      VALUES ?wd { {{keys}} }
      OPTIONAL { ?wd rdfs:label ?label FILTER(LANG(?label) = "en") }
      OPTIONAL { ?wd schema:description ?desc FILTER(LANG(?desc) = "en") }
      OPTIONAL { ?wd wdt:P569 ?born }
      OPTIONAL { ?wd wdt:P570 ?died }
      OPTIONAL { ?wd wdt:P19 ?bp . ?bp rdfs:label ?bpLabel FILTER(LANG(?bpLabel) = "en")
                 OPTIONAL { ?bp wdt:P625 ?bpCoord } OPTIONAL { ?bp wdt:P17 ?bc . ?bc rdfs:label ?bcLabel FILTER(LANG(?bcLabel) = "en") } }
      OPTIONAL { ?wd wdt:P20 ?dp . ?dp rdfs:label ?dpLabel FILTER(LANG(?dpLabel) = "en")
                 OPTIONAL { ?dp wdt:P625 ?dpCoord } OPTIONAL { ?dp wdt:P17 ?dc . ?dc rdfs:label ?dcLabel FILTER(LANG(?dcLabel) = "en") } }
      OPTIONAL { ?wd wdt:P119 ?bur . ?bur rdfs:label ?burLabel FILTER(LANG(?burLabel) = "en") OPTIONAL { ?bur wdt:P625 ?burCoord } }
      OPTIONAL { ?wd wdt:P18 ?img }
      OPTIONAL { ?wd wdt:P411 ?canon . ?canon rdfs:label ?canonLabel FILTER(LANG(?canonLabel) = "en") }
      OPTIONAL { ?wd wdt:P611 ?order . ?order rdfs:label ?orderLabel FILTER(LANG(?orderLabel) = "en") }
      OPTIONAL { ?wd wdt:P841 ?feast . ?feast rdfs:label ?feastLabel FILTER(LANG(?feastLabel) = "en") }
      OPTIONAL { ?art schema:about ?wd ; schema:isPartOf <https://en.wikipedia.org/> ; schema:name ?artName .
                 BIND(REPLACE(STR(?artName), " ", "_") AS ?articleKey) }
    }
    GROUP BY ?wd
  keyVar: wd
  keyForm: iri
  fetch:
    maxKeysPerCall: 25
    timeoutSeconds: 60
    userAgent: "EmbabelRealmBible/0.1 (https://github.com/embabel-worlds/realm-bible)"
  cache: { kind: ttl, seconds: 2592000, negativeTtlSeconds: 604800 }

# ── What a saint is patron of ────────────────────────────────────────────────────────────────
# Wikidata records patronage on the PATRONISED thing (P417 "patron saint", on a city or a trade), so
# this reads the inverse. Churches, convents and chapels dedicated to the saint carry the same
# property and outnumber everything else (Francis of Assisi: 65 church buildings alone), so every
# architectural structure (Q811979) is excluded, with disambiguation pages, and the rest capped.
- name: saintPatronageByEntity
  kind: sparql
  endpoint: "https://query.wikidata.org/sparql"
  query: |
    SELECT ?wd ?thing ?thingLabel ?kindLabel ?patronKey WHERE {
      VALUES ?wd { {{keys}} }
      ?thing wdt:P417 ?wd .
      # Not a church, chapel or other building — the patronage of a place you can visit is not what a
      # reader asks for. Climbed three superclass steps to known ancestors, not the open-ended P279*:
      # walking every superclass of every candidate cost Wikidata 40-50 s for Francis or Anthony and
      # timed out for Mary, and three steps excludes exactly the same things (checked against P279*
      # for Francis, Anthony, Thérèse, Patrick).
      FILTER NOT EXISTS { ?thing wdt:P31/wdt:P279?/wdt:P279?/wdt:P279? ?built .
                          VALUES ?built { wd:Q811979 wd:Q41176 wd:Q16970 wd:Q24398318 } }
      FILTER NOT EXISTS { ?thing wdt:P31 wd:Q4167410 }
      ?thing rdfs:label ?thingLabel FILTER(LANG(?thingLabel) = "en")
      OPTIONAL { ?thing wdt:P31 ?kind . ?kind rdfs:label ?kindLabel FILTER(LANG(?kindLabel) = "en") }
      BIND(CONCAT(STR(?wd), "|", STR(?thing)) AS ?patronKey)
    }
    LIMIT 400
  keyVar: wd
  keyForm: iri
  fetch:
    maxKeysPerCall: 5
    timeoutSeconds: 60
    userAgent: "EmbabelRealmBible/0.1 (https://github.com/embabel-worlds/realm-bible)"
  cache: { kind: ttl, seconds: 2592000, negativeTtlSeconds: 604800 }

# The three saint producers cache for 30 days: a saint's card, patronage and country change on
# Wikidata over months, and a cold query to the public endpoint costs seconds to a minute depending
# on its load — measured 3-60 s for the same country query within an hour.
#
# ── The saints and blessed of a country ──────────────────────────────────────────────────────
# Keyed by the country's entity IRI (reference/catholic-countries.yml maps ISO 3166 codes to it, so
# the app can start from the reader's locale). A person counts when either their citizenship or their
# birthplace's country is that country, and Wikidata gives Catholic evidence for their sanctity.
# A bare canonization status is not that evidence: P411 also carries other churches' saints — the
# African Orthodox Church's John Coltrane, the Episcopal Church's Thurgood Marshall, the Orthodox
# hieromartyrs. So a person counts on one of: a status only the Catholic process confers (Catholic
# saint, blessed, Venerable, servant of God — not "The Venerable", which Wikidata also uses for the
# Orthodox prepodobni); an entry in a Catholic hagiography (Santi e Beati,
# Nominis, the Dicastery's causesanti.va); a status a pope conferred; or a plain "saint" who died
# before 1054, venerated by the undivided Church. And never when the status names a conferring body
# with no pope or Catholic body beside it — a stray qualifier must not undo a pope's own. Nor when
# their religion is Orthodoxy and not also the Catholic Church, unless they died before 1054: Santi e
# Beati and Nominis list some Orthodox saints (Peter the Aleut), and the hagiographies are editorial.
# A person with several statuses is reported by the highest — Edith Stein is a Catholic saint, not
# "The Venerable" — because the view ranks saints first by that one value. `fame` is the number of Wikipedias with an article on them
# (Wikidata's sitelink count): a fair proxy for "famous", so Patrick comes before a 5th-century
# bishop known from one martyrology. The 600 most famous are kept.
- name: saintsOfCountryByFame
  kind: sparql
  endpoint: "https://query.wikidata.org/sparql"
  query: |
    SELECT ?country ?wd (SAMPLE(?label) AS ?wdLabel) (SAMPLE(?desc) AS ?wdDescription)
           (SUBSTR(MIN(?rankedStatus), 3) AS ?canonization)
           (SAMPLE(?born) AS ?birthDate) (SAMPLE(?died) AS ?deathDate)
           (SAMPLE(?feastLabel) AS ?feastDay) (SAMPLE(?articleKey) AS ?article) (SAMPLE(?links) AS ?fame)
           (CONCAT(STR(?country), "|", STR(?wd)) AS ?memberKey)
    WHERE {
      VALUES ?country { {{keys}} }
      { ?wd wdt:P27 ?country } UNION { ?wd wdt:P19/wdt:P17 ?country }
      ?wd wdt:P411 ?canon .
      {
        ?wd wdt:P411 ?catholicStatus
        VALUES ?catholicStatus { wd:Q3464126 wd:Q2369287 wd:Q51620 wd:Q869974 wd:Q51619 }
      } UNION {
        ?wd wdt:P6126|wdt:P4286|wdt:P9588 []
      } UNION {
        ?wd wdt:P411 ?plainSaint VALUES ?plainSaint { wd:Q43115 wd:Q123110154 }
        ?wd wdt:P570 ?undivided FILTER(YEAR(?undivided) < 1054)
      } UNION {
        ?wd p:P411/pq:P1027 ?pope . ?pope wdt:P39 wd:Q19546
      }
      FILTER(EXISTS { ?wd p:P411/pq:P1027 ?catholicBody .
                      { ?catholicBody wdt:P39 wd:Q19546 } UNION { VALUES ?catholicBody { wd:Q9592 wd:Q159583 wd:Q1131466 } } }
             || NOT EXISTS { ?wd p:P411/pq:P1027 [] })
      FILTER NOT EXISTS {
        ?wd wdt:P140 ?orthodoxy VALUES ?orthodoxy { wd:Q3333484 wd:Q35032 }
        FILTER NOT EXISTS { ?wd wdt:P140 wd:Q9592 }
        FILTER NOT EXISTS { ?wd wdt:P570 ?schism FILTER(YEAR(?schism) < 1054) }
      }
      ?canon rdfs:label ?canonLabel FILTER(LANG(?canonLabel) = "en")
      # Each status prefixed with its rank as TEXT, so MIN picks the highest and keeps its own label.
      # Wikidata's engine fails a query with a numeric constant in IF, or any constant inside an
      # aggregate ("Headless value factory"), so neither a numeric rank nor choosing the label
      # after grouping will run.
      BIND(CONCAT(IF(?canon IN (wd:Q3464126, wd:Q43115, wd:Q123110154), "0",
                  IF(?canon IN (wd:Q2369287, wd:Q51620), "1",
                  IF(?canon IN (wd:Q51619, wd:Q12774503), "2",
                  IF(?canon = wd:Q869974, "3", "4")))), "|", ?canonLabel) AS ?rankedStatus)
      ?wd rdfs:label ?label FILTER(LANG(?label) = "en")
      ?wd wikibase:sitelinks ?links .
      OPTIONAL { ?wd schema:description ?desc FILTER(LANG(?desc) = "en") }
      OPTIONAL { ?wd wdt:P569 ?born }
      OPTIONAL { ?wd wdt:P570 ?died }
      OPTIONAL { ?wd wdt:P841 ?feast . ?feast rdfs:label ?feastLabel FILTER(LANG(?feastLabel) = "en") }
      OPTIONAL { ?art schema:about ?wd ; schema:isPartOf <https://en.wikipedia.org/> ; schema:name ?artName .
                 BIND(REPLACE(STR(?artName), " ", "_") AS ?articleKey) }
    }
    GROUP BY ?country ?wd
    ORDER BY DESC(?fame)
    LIMIT 600
  keyVar: country
  keyForm: iri
  fetch:
    maxKeysPerCall: 1
    timeoutSeconds: 60
    userAgent: "EmbabelRealmBible/0.1 (https://github.com/embabel-worlds/realm-bible)"
  cache: { kind: ttl, seconds: 2592000, negativeTtlSeconds: 604800 }

# ── How many saints a country has ────────────────────────────────────────────────────────────
# The same people as saintsOfCountryByFame — the same Catholic-evidence filter, so the two agree —
# but counted, not listed: `total` (saints, blessed, venerable, servants of God) and `canonized`
# (those with a saint-level status). Uncapped, which the list is not: the list keeps the 600 most
# famous, so a country with more (Italy 1,277, France 934, Spain 885) cannot be ranked from it.
# Counting needs no labels or fame, so it is cheap: ten countries a call, about ten seconds cold.
# The list also requires an English label, so it can come out a few short of `total` (Poland: 240
# listed, 245 counted).
- name: saintCountsOfCountry
  kind: sparql
  endpoint: "https://query.wikidata.org/sparql"
  query: |
    SELECT ?country (COUNT(DISTINCT ?wd) AS ?total) (COUNT(DISTINCT ?saint) AS ?canonized)
           (CONCAT(STR(?country), "|count") AS ?countKey)
    WHERE {
      VALUES ?country { {{keys}} }
      { ?wd wdt:P27 ?country } UNION { ?wd wdt:P19/wdt:P17 ?country }
      ?wd wdt:P411 ?canon .
      {
        ?wd wdt:P411 ?catholicStatus
        VALUES ?catholicStatus { wd:Q3464126 wd:Q2369287 wd:Q51620 wd:Q869974 wd:Q51619 }
      } UNION {
        ?wd wdt:P6126|wdt:P4286|wdt:P9588 []
      } UNION {
        ?wd wdt:P411 ?plainSaint VALUES ?plainSaint { wd:Q43115 wd:Q123110154 }
        ?wd wdt:P570 ?undivided FILTER(YEAR(?undivided) < 1054)
      } UNION {
        ?wd p:P411/pq:P1027 ?pope . ?pope wdt:P39 wd:Q19546
      }
      FILTER(EXISTS { ?wd p:P411/pq:P1027 ?catholicBody .
                      { ?catholicBody wdt:P39 wd:Q19546 } UNION { VALUES ?catholicBody { wd:Q9592 wd:Q159583 wd:Q1131466 } } }
             || NOT EXISTS { ?wd p:P411/pq:P1027 [] })
      FILTER NOT EXISTS {
        ?wd wdt:P140 ?orthodoxy VALUES ?orthodoxy { wd:Q3333484 wd:Q35032 }
        FILTER NOT EXISTS { ?wd wdt:P140 wd:Q9592 }
        FILTER NOT EXISTS { ?wd wdt:P570 ?schism FILTER(YEAR(?schism) < 1054) }
      }
      OPTIONAL { ?wd wdt:P411 ?saintly VALUES ?saintly { wd:Q3464126 wd:Q43115 wd:Q123110154 } BIND(?wd AS ?saint) }
    }
    GROUP BY ?country
  keyVar: country
  keyForm: iri
  fetch:
    maxKeysPerCall: 10
    timeoutSeconds: 90
    userAgent: "EmbabelRealmBible/0.1 (https://github.com/embabel-worlds/realm-bible)"
  cache: { kind: ttl, seconds: 2592000, negativeTtlSeconds: 604800 }

# ── Every cause: the whole roll of saints, blessed, venerable and servants of God ─────────────
# The same people as the country producers — the same Catholic-evidence filter — but all of them at
# once, for the questions that range over everyone: canonizations per year, the most recent martyr,
# who lived longest. One row per person, with the date of each stage the Church's process has
# reached (servant of God, venerable, beatification, canonization), birth and death, and the
# evidence that they died a martyr.
#
# Served by QLever's copy of Wikidata (https://qlever.dev, University of Freiburg), not the Wikidata
# Query Service: this sweeps all ~7,700 people, and the public WDQS answered it in 23 to 65 s on the
# same afternoon — past its own 60 s limit as often as not, with sharding no help because each shard
# still evaluates the whole population first. QLever answers it in ~6 s. Its copy lags Wikidata by
# days, which a 30-day cache makes immaterial; checked against WDQS field by field, the two agreed
# on every date and differed on two descriptions edited that week. QLever has no predeclared
# prefixes, so the query declares its own.
#
# What the dates are, and are not:
#   - A stage's date is the `point in time` qualifier on that canonization-status statement (P411 /
#     P585), or failing that the date of the event it is `part of` (P361) — a group canonization is
#     often recorded as an event. Only about 1 in 9 saints has a canonization date on Wikidata, and
#     the mass canonizations dominate what there is (2000: 120 Martyrs of China; 1988: 117 Vietnamese
#     Martyrs; 1984: 103 Korean Martyrs). A count per year is a count of what Wikidata dates.
#   - "unknown value" dates are blank nodes, not literals, and are dropped.
#   - Birth and death years count only at year precision or finer (Wikidata precision ≥ 9): a
#     saint "born in the 4th century" has no birth year here rather than a guessed one.
#     `exactAgeAtDeath` is computed only when both dates are known to the day.
#   - `kind` separates people from what the roll also holds: biblical figures (Adam's 930 years),
#     people whose existence is disputed or legendary, and groups (the Martyrs of Otranto).
#     Disambiguation and list pages carry statuses on Wikidata too and are dropped outright.
#
# Martyr evidence, strongest first: manner of death `martyrdom` (P1196), an instance or occupation
# of `Christian martyr`, or an English description that says so. `killedEvidence` is carried beside it, because
# Wikidata records far more saints as killed than as martyrs: Óscar Romero, canonized a martyr in
# 2018, has cause of death "assassination" and a description that says "assassinated", never
# "martyr"; Titus Brandsma's is "lethal injection" (Dachau), Edith Stein's "hydrogen cyanide"
# (Auschwitz). A killing is read from manner of death (P1196), cause of death (P509) or the
# description, from fixed lists of what Wikidata uses for killings among these people (counted:
# decapitation 516, gunshot wound 218, the Armenian Genocide 157, ...). The views read it as the
# weakest evidence, labelled as such: it is not proof — Joan of Arc was executed and is not
# venerated as a martyr. Membership of a martyr group
# (P463) is not read: scanning group labels cost 16 s on WDQS and found ~25 people the description
# already named.
#
# Each status is prefixed with a sort letter so MIN picks the highest and keeps its own label, the
# rank chosen in the query rather than by label collation (WDQS and QLever collate "Catholic saint"
# and "canonized saint" differently). `stage` is the same rank in plain words.
- name: saintCausesAll
  kind: sparql
  endpoint: "https://qlever.dev/api/wikidata"
  query: |
    PREFIX wd: <http://www.wikidata.org/entity/>
    PREFIX wdt: <http://www.wikidata.org/prop/direct/>
    PREFIX p: <http://www.wikidata.org/prop/>
    PREFIX ps: <http://www.wikidata.org/prop/statement/>
    PREFIX pq: <http://www.wikidata.org/prop/qualifier/>
    PREFIX psv: <http://www.wikidata.org/prop/statement/value/>
    PREFIX wikibase: <http://wikiba.se/ontology#>
    PREFIX schema: <http://schema.org/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?scope ?wd (SAMPLE(?label) AS ?name) (SAMPLE(?desc) AS ?description)
           (SUBSTR(MIN(?rankedStatus), 3) AS ?status) (SUBSTR(MIN(?rankedStage), 3) AS ?stage)
           (SAMPLE(?kindOf) AS ?kind)
           (MIN(?sogDate) AS ?servantOfGodDate) (MIN(?venDate) AS ?venerableDate)
           (MIN(?beatDate) AS ?beatificationDate) (MIN(?canonDate) AS ?canonizationDate)
           (MIN(YEAR(?sogDate)) AS ?servantOfGodYear) (MIN(YEAR(?venDate)) AS ?venerableYear)
           (MIN(YEAR(?beatDate)) AS ?beatificationYear) (MIN(YEAR(?canonDate)) AS ?canonizationYear)
           (MIN(?bornY) AS ?birthYear) (MIN(?diedY) AS ?deathYear)
           (MIN(?bornD) AS ?birthDate) (MIN(?diedD) AS ?deathDate)
           (MIN(?exactAge) AS ?exactAgeAtDeath)
           (MAX(?martyrMark) AS ?martyrEvidence)
           (GROUP_CONCAT(DISTINCT ?mannerLabel; SEPARATOR=", ") AS ?mannerOfDeath)
           (GROUP_CONCAT(DISTINCT ?causeLabel; SEPARATOR=", ") AS ?causeOfDeath)
           (MAX(?killMark) AS ?killedEvidence)
           (CONCAT(?scope, "|", STR(?wd)) AS ?causeKey)
    WHERE {
      VALUES ?scope { {{keys}} }
      ?wd wdt:P411 ?canon .
      {
        ?wd wdt:P411 ?catholicStatus
        VALUES ?catholicStatus { wd:Q3464126 wd:Q2369287 wd:Q51620 wd:Q869974 wd:Q51619 }
      } UNION {
        ?wd wdt:P6126|wdt:P4286|wdt:P9588 []
      } UNION {
        ?wd wdt:P411 ?plainSaint VALUES ?plainSaint { wd:Q43115 wd:Q123110154 }
        ?wd wdt:P570 ?undivided FILTER(YEAR(?undivided) < 1054)
      } UNION {
        ?wd p:P411/pq:P1027 ?pope . ?pope wdt:P39 wd:Q19546
      }
      FILTER(EXISTS { ?wd p:P411/pq:P1027 ?catholicBody .
                      { ?catholicBody wdt:P39 wd:Q19546 } UNION { VALUES ?catholicBody { wd:Q9592 wd:Q159583 wd:Q1131466 } } }
             || NOT EXISTS { ?wd p:P411/pq:P1027 [] })
      FILTER NOT EXISTS {
        ?wd wdt:P140 ?orthodoxy VALUES ?orthodoxy { wd:Q3333484 wd:Q35032 }
        FILTER NOT EXISTS { ?wd wdt:P140 wd:Q9592 }
        FILTER NOT EXISTS { ?wd wdt:P570 ?schism FILTER(YEAR(?schism) < 1054) }
      }
      FILTER NOT EXISTS { ?wd wdt:P31 ?page VALUES ?page { wd:Q4167410 wd:Q22808320 wd:Q13406463 } }
      ?canon rdfs:label ?canonLabel FILTER(LANG(?canonLabel) = "en")
      BIND(CONCAT(IF(?canon = wd:Q3464126, "a", IF(?canon = wd:Q123110154, "b", IF(?canon = wd:Q43115, "c",
                  IF(?canon IN (wd:Q2369287, wd:Q51620), "d",
                  IF(?canon IN (wd:Q51619, wd:Q12774503), "e",
                  IF(?canon = wd:Q869974, "f", "g")))))), "|", ?canonLabel) AS ?rankedStatus)
      BIND(IF(?canon IN (wd:Q3464126, wd:Q123110154, wd:Q43115), "a|saint",
           IF(?canon IN (wd:Q2369287, wd:Q51620), "b|blessed",
           IF(?canon IN (wd:Q51619, wd:Q12774503), "c|venerable",
           IF(?canon = wd:Q869974, "d|servant of God", "e|other")))) AS ?rankedStage)
      BIND(IF(EXISTS { ?wd wdt:P31 wd:Q20643955 }, "biblical figure",
           IF(EXISTS { ?wd wdt:P31 ?legend VALUES ?legend { wd:Q21070568 wd:Q13002315 wd:Q4271324 } }, "existence disputed",
           IF(EXISTS { ?wd wdt:P31 wd:Q5 }, "person", "group or other"))) AS ?kindOf)
      ?wd rdfs:label ?label FILTER(LANG(?label) = "en")
      OPTIONAL { ?wd schema:description ?desc FILTER(LANG(?desc) = "en") }
      OPTIONAL { ?wd p:P411 ?st1 . ?st1 ps:P411 wd:Q869974 ; pq:P585 ?sogDate FILTER(isLiteral(?sogDate)) }
      OPTIONAL { ?wd p:P411 ?st2 . ?st2 ps:P411 wd:Q51619 ; pq:P585 ?venDate FILTER(isLiteral(?venDate)) }
      OPTIONAL { ?wd p:P411 ?st3 . ?st3 ps:P411 ?b VALUES ?b { wd:Q2369287 wd:Q51620 }
                 OPTIONAL { ?st3 pq:P585 ?bd1 FILTER(isLiteral(?bd1)) } OPTIONAL { ?st3 pq:P361/wdt:P585 ?bd2 FILTER(isLiteral(?bd2)) }
                 BIND(COALESCE(?bd1, ?bd2) AS ?beatDate) }
      OPTIONAL { ?wd p:P411 ?st4 . ?st4 ps:P411 ?s VALUES ?s { wd:Q3464126 wd:Q43115 wd:Q123110154 }
                 OPTIONAL { ?st4 pq:P585 ?cd1 FILTER(isLiteral(?cd1)) } OPTIONAL { ?st4 pq:P361/wdt:P585 ?cd2 FILTER(isLiteral(?cd2)) }
                 BIND(COALESCE(?cd1, ?cd2) AS ?canonDate) }
      OPTIONAL { ?wd p:P569/psv:P569 ?bv . ?bv wikibase:timeValue ?bornD ; wikibase:timePrecision ?bp
                 FILTER(isLiteral(?bornD) && ?bp >= 9) BIND(YEAR(?bornD) AS ?bornY) }
      OPTIONAL { ?wd p:P570/psv:P570 ?dv . ?dv wikibase:timeValue ?diedD ; wikibase:timePrecision ?dp
                 FILTER(isLiteral(?diedD) && ?dp >= 9) BIND(YEAR(?diedD) AS ?diedY) }
      BIND(IF(?bp >= 11 && ?dp >= 11,
              ?diedY - ?bornY - IF(MONTH(?diedD) < MONTH(?bornD)
                                   || (MONTH(?diedD) = MONTH(?bornD) && DAY(?diedD) < DAY(?bornD)), 1, 0),
              ?noExactAge) AS ?exactAge)
      OPTIONAL { ?wd wdt:P1196 ?manner . ?manner rdfs:label ?mannerLabel FILTER(LANG(?mannerLabel) = "en") }
      OPTIONAL { ?wd wdt:P509 ?cause . ?cause rdfs:label ?causeLabel FILTER(LANG(?causeLabel) = "en") }
      BIND(IF(COALESCE(STR(?mannerLabel), "") IN ("capital punishment", "homicide", "extra-judicial killing", "murder", "deliberate murder",
                               "torture", "crucifixion", "execution by firing squad", "execution by shooting",
                               "summary execution", "strangling", "stab wound", "gunshot", "mass murder", "mutilation"),
              CONCAT("manner of death: ", ?mannerLabel),
           IF(COALESCE(STR(?causeLabel), "") IN ("decapitation", "gunshot wound", "Armenian Genocide", "hanged, drawn, quartered and decapitated",
                              "death by burning", "hanging to death", "crucifixion", "stoning", "torture",
                              "execution by drowning", "Spanish martyrs of the 20th century", "stab wound", "blunt trauma",
                              "execution by shooting", "lethal injection", "execution", "flaying", "assassination",
                              "hydrogen cyanide"),
              CONCAT("cause of death: ", ?causeLabel),
           IF(REGEX(COALESCE(?desc, ""), "assassinat|murdered|executed|beheaded|killed by|was killed", "i"),
              CONCAT("described as: ", ?desc), ?notKilled))) AS ?killMark)
      BIND(IF(EXISTS { ?wd wdt:P1196 wd:Q46999986 }, "manner of death: martyrdom",
           IF(EXISTS { ?wd wdt:P31|wdt:P106 wd:Q107013 }, "Christian martyr",
           IF(CONTAINS(LCASE(COALESCE(?desc, "")), "martyr"), CONCAT("described as: ", ?desc), ?noEvidence))) AS ?martyrMark)
    }
    GROUP BY ?scope ?wd
  keyVar: scope
  keyForm: literal
  fetch:
    maxKeysPerCall: 1
    timeoutSeconds: 90
    maxRows: 15000
    userAgent: "EmbabelRealmBible/0.1 (https://github.com/embabel-worlds/realm-bible)"
  cache: { kind: ttl, seconds: 2592000, negativeTtlSeconds: 604800 }

# ── A saint's life, from Wikipedia ────────────────────────────────────────────────────────────
# The page-summary endpoint: the article's opening paragraphs as plain text, its thumbnail and URL.
# CC BY-SA 4.0 — fetched live and shown with its link, never stored. Wikipedia answers redirects for
# the canonical title, so the key is whatever title Wikidata's sitelink names. A week's cache: the
# summary of a saint's life is not news.
- name: wikipediaSummary
  kind: remote
  operation: pageSummary
  records: "$"
  keyArgs: [title]
  echoKeyAs: key
  maxKeysPerCall: 1
  project:
    title: title
    extract: extract
    thumbnail: thumbnail.source
    pageUrl: content_urls.desktop.page
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 86400 }
