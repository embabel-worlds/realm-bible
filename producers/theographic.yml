# The whole file, for questions over everyone: how many women, who has the most verses, who lived
# longest by Theographic's estimates. No key column, so the table itself is the answer, stamped with
# the roll's scope. It reads the file the other producers already download and cache, so sweeping
# all ~3,070 people costs one parse — the same scan a lookup by name already does. maxRowsPerKey is
# above the file's size, so the roll is never silently cut short.
- name: biblePeopleAll
  kind: tabular
  url: "https://raw.githubusercontent.com/robertrouse/theographic-bible-metadata/master/CSV/People.csv"
  format: csv
  keyAs: rollScope
  fileCacheSeconds: 604800
  maxRowsPerKey: 5000
  pushdown:
    - { property: gender, ops: [EQUALS, IN] }
    - { property: name, ops: [EQUALS, CONTAINS], match: ci }
    - { property: father, ops: [EQUALS, IN] }
    - { property: mother, ops: [EQUALS, IN] }
  project:
    personLookup: "slug"
    name: "name"
    displayTitle: "displayTitle"
    gender: "gender"
    birthYear: "birthYear"
    deathYear: "deathYear"
    verseCount: "verseCount"
    verses: "verses"
    father: "father"
    mother: "mother"
    partners: "partners"
    children: "children"
    siblings: "siblings"
    dictionary: "dictText"
  compute:
    childIds: "[c IN split(r.children, ',') WHERE trim(c) <> '' | trim(c)]"

# The same file read from the parent's side: everyone whose `father` (or `mother`) is the id asked
# for. These back the reverse FATHER and MOTHER joins, so `(p)<-[:FATHER]-(c)` finds p's children by
# asking the table who names p, rather than reading each child's own row. A Theographic id is exact.
- name: biblePeopleByFather
  kind: tabular
  url: "https://raw.githubusercontent.com/robertrouse/theographic-bible-metadata/master/CSV/People.csv"
  format: csv
  keyColumn: "father"
  keyMatch: exact
  keyAs: fatherQueried
  fileCacheSeconds: 604800
  maxRowsPerKey: 100
  pushdown:
    - { property: gender, ops: [EQUALS, IN] }
    - { property: name, ops: [EQUALS, CONTAINS], match: ci }
    - { property: father, ops: [EQUALS, IN] }
    - { property: mother, ops: [EQUALS, IN] }
  project:
    personLookup: "slug"
    name: "name"
    displayTitle: "displayTitle"
    gender: "gender"
    birthYear: "birthYear"
    deathYear: "deathYear"
    verseCount: "verseCount"
    verses: "verses"
    father: "father"
    mother: "mother"
    partners: "partners"
    children: "children"
    siblings: "siblings"
    dictionary: "dictText"
  # Theographic stores a person's children as one comma-separated cell of ids. Split here, so the CHILD
  # join is keyed on a list and reaches every child, at every hop of a walk.
  compute:
    childIds: "[c IN split(r.children, ',') WHERE trim(c) <> '' | trim(c)]"

