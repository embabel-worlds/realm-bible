  data:
    osis: Nah.2.11
    name: Nahum 2:11
    apiRef: Nahum2:11
    book: Nah
    chapter: 2
    verse: 11
    text: Where is the dwelling of the lions, and the feedingplace of the young lions, where the lion, even the old lion, walked, and the lion’s whelp, and none made them afraid?
    web: Where is the den of the lions, and the feeding place of the young lions, where the lion and the lioness walked with the lion’s cubs, and no one made them afraid?
    event: Prophecies of Nahum
  relations:
