    name: Nahum 2:2
    apiRef: Nahum2:2
    book: Nah
    chapter: 2
    verse: 2
    text: 'For the LORD hath turned away the excellency of Jacob, as the excellency of Israel: for the emptiers have emptied them out, and marred their vine branches.'
    web: For the LORD restores the excellency of Jacob as the excellency of Israel, for the destroyers have destroyed them and ruined their vine branches.
