  data:
    osis: Nah.2.10
    name: Nahum 2:10
    apiRef: Nahum2:10
    book: Nah
    chapter: 2
    verse: 10
    text: 'She is empty, and void, and waste: and the heart melteth, and the knees smite together, and much pain is in all loins, and the faces of them all gather blackness.'
    web: She is empty, void, and waste. The heart melts, the knees knock together, their bodies and faces have grown pale.
