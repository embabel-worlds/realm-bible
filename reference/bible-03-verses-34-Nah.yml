    apiRef: Nahum3:6
    book: Nah
    chapter: 3
    verse: 6
    text: And I will cast abominable filth upon thee, and make thee vile, and will set thee as a gazingstock.
    web: I will throw abominable filth on you and make you vile, and will make you a spectacle.
    event: Prophecies of Nahum
