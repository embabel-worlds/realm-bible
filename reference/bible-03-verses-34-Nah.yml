    apiRef: Nahum2:7
    book: Nah
    chapter: 2
    verse: 7
    text: And Huzzab shall be led away captive, she shall be brought up, and her maids shall lead her as with the voice of doves, tabering upon their breasts.
    web: 'It is decreed: she is uncovered, she is carried away; and her servants moan as with the voice of doves, beating on their breasts.'
