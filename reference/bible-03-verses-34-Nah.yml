    name: Nahum 3:10
    apiRef: Nahum3:10
    book: Nah
    chapter: 3
    verse: 10
    text: 'Yet was she carried away, she went into captivity: her young children also were dashed in pieces at the top of all the streets: and they cast lots for her honourable men, and all her great men were bound in chains.'
    web: Yet was she carried away. She went into captivity. Her young children also were dashed in pieces at the head of all the streets, and they cast lots for her honorable men, and all her great men were bound in chains.
    event: Prophecies of Nahum
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Nah.3
