    apiRef: Nahum1:2
    book: Nah
    chapter: 1
    verse: 2
    text: God is jealous, and the LORD revengeth; the LORD revengeth, and is furious; the LORD will take vengeance on his adversaries, and he reserveth wrath for his enemies.
    web: The LORD is a jealous God and avenges. The LORD avenges and is full of wrath. The LORD takes vengeance on his adversaries, and he maintains wrath against his enemies.
