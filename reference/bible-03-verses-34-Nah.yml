    apiRef: Nahum3:5
    book: Nah
    chapter: 3
    verse: 5
    text: Behold, I am against thee, saith the LORD of hosts; and I will discover thy skirts upon thy face, and I will shew the nations thy nakedness, and the kingdoms thy shame.
    web: “Behold, I am against you,” says the LORD of Armies, “and I will lift your skirts over your face. I will show the nations your nakedness, and the kingdoms your shame.
