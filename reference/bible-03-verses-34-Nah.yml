  data:
    osis: Nah.3.8
    name: Nahum 3:8
    apiRef: Nahum3:8
    book: Nah
    chapter: 3
    verse: 8
    text: Art thou better than populous No, that was situate among the rivers, that had the waters round about it, whose rampart was the sea, and her wall was from the sea?
    web: Are you better than No-Amon, who was situated among the rivers, who had the waters around her, whose rampart was the sea, and her wall was of the sea?
    event: Prophecies of Nahum
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Nah.3
