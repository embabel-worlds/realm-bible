  data:
    osis: Nah.3.9
    name: Nahum 3:9
    apiRef: Nahum3:9
    book: Nah
    chapter: 3
    verse: 9
    text: Ethiopia and Egypt were her strength, and it was infinite; Put and Lubim were thy helpers.
    web: Cush and Egypt were her boundless strength. Put and Libya were her helpers.
    event: Prophecies of Nahum
  relations:
