  data:
    osis: Nah.3.11
    name: Nahum 3:11
    apiRef: Nahum3:11
    book: Nah
    chapter: 3
    verse: 11
    text: 'Thou also shalt be drunken: thou shalt be hid, thou also shalt seek strength because of the enemy.'
    web: You also will be drunken. You will be hidden. You also will seek a stronghold because of the enemy.
    event: Prophecies of Nahum
  relations:
