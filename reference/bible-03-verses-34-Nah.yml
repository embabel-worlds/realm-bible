  data:
    osis: Nah.2.9
    name: Nahum 2:9
    apiRef: Nahum2:9
    book: Nah
    chapter: 2
    verse: 9
    text: 'Take ye the spoil of silver, take the spoil of gold: for there is none end of the store and glory out of all the pleasant furniture.'
    web: Take the plunder of silver. Take the plunder of gold, for there is no end of treasure, an abundance of every precious thing.
