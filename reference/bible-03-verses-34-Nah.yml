  data:
    osis: Nah.2.3
    name: Nahum 2:3
    apiRef: Nahum2:3
    book: Nah
    chapter: 2
    verse: 3
    text: 'The shield of his mighty men is made red, the valiant men are in scarlet: the chariots shall be with flaming torches in the day of his preparation, and the fir trees shall be terribly shaken.'
    web: The shield of his mighty men is made red. The valiant men are in scarlet. The chariots flash with steel in the day of his preparation, and the pine spears are brandished.
    event: Prophecies of Nahum
  relations:
