  data:
    osis: Nah.1.14
    name: Nahum 1:14
    apiRef: Nahum1:14
    book: Nah
    chapter: 1
    verse: 14
    text: 'And the LORD hath given a commandment concerning thee, that no more of thy name be sown: out of the house of thy gods will I cut off the graven image and the molten image: I will make thy grave; for thou art vile.'
    web: 'The LORD has commanded concerning you: “No more descendants will bear your name. Out of the house of your gods, I will cut off the engraved image and the molten image. I will make your grave, for you are vile.”'
    people:
    - god_1324
    event: Prophecies of Nahum
