  data:
    osis: Nah.2.8
    name: Nahum 2:8
    apiRef: Nahum2:8
    book: Nah
    chapter: 2
    verse: 8
    text: 'But Nineveh is of old like a pool of water: yet they shall flee away. Stand, stand, shall they cry; but none shall look back.'
    web: But Nineveh has been from of old like a pool of water, yet they flee away. “Stop! Stop!” they cry, but no one looks back.
    event: Prophecies of Nahum
  relations:
