  data:
    osis: Nah.2.12
    name: Nahum 2:12
    apiRef: Nahum2:12
    book: Nah
    chapter: 2
    verse: 12
    text: The lion did tear in pieces enough for his whelps, and strangled for his lionesses, and filled his holes with prey, and his dens with ravin.
    web: The lion tore in pieces enough for his cubs, and strangled prey for his lionesses, and filled his caves with the kill and his dens with prey.
    event: Prophecies of Nahum
  relations:
