    name: Nahum 3:14
    apiRef: Nahum3:14
    book: Nah
    chapter: 3
    verse: 14
    text: 'Draw thee waters for the siege, fortify thy strong holds: go into clay, and tread the morter, make strong the brickkiln.'
    web: Draw water for the siege. Strengthen your fortresses. Go into the clay, and tread the mortar. Make the brick kiln strong.
