    apiRef: Nahum2:5
    book: Nah
    chapter: 2
    verse: 5
    text: 'He shall recount his worthies: they shall stumble in their walk; they shall make haste to the wall thereof, and the defence shall be prepared.'
    web: He summons his picked troops. They stumble on their way. They dash to its wall, and the protective shield is put in place.
    event: Prophecies of Nahum
