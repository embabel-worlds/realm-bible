  data:
    osis: Nah.1.15
    name: Nahum 1:15
    apiRef: Nahum1:15
    book: Nah
    chapter: 1
    verse: 15
    text: 'Behold upon the mountains the feet of him that bringeth good tidings, that publisheth peace! O Judah, keep thy solemn feasts, perform thy vows: for the wicked shall no more pass through thee; he is utterly cut off.'
    web: Behold, on the mountains the feet of him who brings good news, who publishes peace! Keep your feasts, Judah! Perform your vows, for the wicked one will no more pass through you. He is utterly cut off.
    event: Prophecies of Nahum
  relations:
