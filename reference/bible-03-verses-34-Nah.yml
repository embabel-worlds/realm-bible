  data:
    osis: Nah.2.13
    name: Nahum 2:13
    apiRef: Nahum2:13
    book: Nah
    chapter: 2
    verse: 13
    text: 'Behold, I am against thee, saith the LORD of hosts, and I will burn her chariots in the smoke, and the sword shall devour thy young lions: and I will cut off thy prey from the earth, and the voice of thy messengers shall no more be heard.'
    web: “Behold, I am against you,” says the LORD of Armies, “and I will burn her chariots in the smoke, and the sword will devour your young lions; and I will cut off your prey from the earth, and the voice of your messengers will no longer be heard.”
    people:
