  data:
    osis: Nah.2.4
    name: Nahum 2:4
    apiRef: Nahum2:4
    book: Nah
    chapter: 2
    verse: 4
    text: 'The chariots shall rage in the streets, they shall justle one against another in the broad ways: they shall seem like torches, they shall run like the lightnings.'
    web: The chariots rage in the streets. They rush back and forth in the wide ways. Their appearance is like torches. They run like the lightnings.
    event: Prophecies of Nahum
  relations:
