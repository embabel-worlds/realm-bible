    apiRef: Nahum1:12
    book: Nah
    chapter: 1
    verse: 12
    text: Thus saith the LORD; Though they be quiet, and likewise many, yet thus shall they be cut down, when he shall pass through. Though I have afflicted thee, I will afflict thee no more.
    web: 'The LORD says: “Though they are in full strength and likewise many, even so they will be cut down and pass away. Though I have afflicted you, I will afflict you no more.'
    people:
    - god_1324
    event: Prophecies of Nahum
