    apiRef: Nahum3:13
    book: Nah
    chapter: 3
    verse: 13
    text: 'Behold, thy people in the midst of thee are women: the gates of thy land shall be set wide open unto thine enemies: the fire shall devour thy bars.'
    web: Behold, your troops among you are women. The gates of your land are set wide open to your enemies. The fire has devoured your bars.
