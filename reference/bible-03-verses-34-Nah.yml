- type: Verse
  data:
    osis: Nah.2.1
    name: Nahum 2:1
    apiRef: Nahum2:1
    book: Nah
    chapter: 2
    verse: 1
    text: 'He that dasheth in pieces is come up before thy face: keep the munition, watch the way, make thy loins strong, fortify thy power mightily.'
    web: He who dashes in pieces has come up against you. Keep the fortress! Watch the way! Strengthen your waist! Fortify your power mightily!
    event: Prophecies of Nahum
  relations:
