    name: Nahum 1:3
    apiRef: Nahum1:3
    book: Nah
    chapter: 1
    verse: 3
    text: 'The LORD is slow to anger, and great in power, and will not at all acquit the wicked: the LORD hath his way in the whirlwind and in the storm, and the clouds are the dust of his feet.'
    web: The LORD is slow to anger, and great in power, and will by no means leave the guilty unpunished. The LORD has his way in the whirlwind and in the storm, and the clouds are the dust of his feet.
