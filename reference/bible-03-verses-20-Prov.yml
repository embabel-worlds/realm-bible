  data:
    osis: Prov.18.4
    name: Proverbs 18:4
    apiRef: Proverbs18:4
    book: Prov
    chapter: 18
    verse: 4
    text: The words of a man’s mouth are as deep waters, and the wellspring of wisdom as a flowing brook.
    web: The words of a man’s mouth are like deep waters. The fountain of wisdom is like a flowing brook.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
