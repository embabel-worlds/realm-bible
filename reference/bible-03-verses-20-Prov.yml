    name: Proverbs 18:22
    apiRef: Proverbs18:22
    book: Prov
    chapter: 18
    verse: 22
    text: Whoso findeth a wife findeth a good thing, and obtaineth favour of the LORD.
    web: Whoever finds a wife finds a good thing, and obtains favor of the LORD.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
