    name: Proverbs 18:10
    apiRef: Proverbs18:10
    book: Prov
    chapter: 18
    verse: 10
    text: 'The name of the LORD is a strong tower: the righteous runneth into it, and is safe.'
    web: 'The LORD’s name is a strong tower: the righteous run to him, and are safe.'
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
