  data:
    osis: Prov.19.1
    name: Proverbs 19:1
    apiRef: Proverbs19:1
    book: Prov
    chapter: 19
    verse: 1
    text: Better is the poor that walketh in his integrity, than he that is perverse in his lips, and is a fool.
    web: Better is the poor who walks in his integrity than he who is perverse in his lips and is a fool.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
