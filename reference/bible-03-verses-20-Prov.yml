    name: Proverbs 18:3
    apiRef: Proverbs18:3
    book: Prov
    chapter: 18
    verse: 3
    text: When the wicked cometh, then cometh also contempt, and with ignominy reproach.
    web: When wickedness comes, contempt also comes, and with shame comes disgrace.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
