    name: Proverbs 19:8
    apiRef: Proverbs19:8
    book: Prov
    chapter: 19
    verse: 8
    text: 'He that getteth wisdom loveth his own soul: he that keepeth understanding shall find good.'
    web: He who gets wisdom loves his own soul. He who keeps understanding shall find good.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
