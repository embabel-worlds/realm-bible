  data:
    osis: Prov.18.5
    name: Proverbs 18:5
    apiRef: Proverbs18:5
    book: Prov
    chapter: 18
    verse: 5
    text: It is not good to accept the person of the wicked, to overthrow the righteous in judgment.
    web: To be partial to the faces of the wicked is not good, nor to deprive the innocent of justice.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
