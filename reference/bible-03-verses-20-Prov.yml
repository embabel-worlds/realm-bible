    osis: Prov.19.11
    name: Proverbs 19:11
    apiRef: Proverbs19:11
    book: Prov
    chapter: 19
    verse: 11
    text: The discretion of a man deferreth his anger; and it is his glory to pass over a transgression.
    web: The discretion of a man makes him slow to anger. It is his glory to overlook an offense.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
