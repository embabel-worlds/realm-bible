    name: Proverbs 18:14
    apiRef: Proverbs18:14
    book: Prov
    chapter: 18
    verse: 14
    text: The spirit of a man will sustain his infirmity; but a wounded spirit who can bear?
    web: A man’s spirit will sustain him in sickness, but a crushed spirit, who can bear?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
- type: Verse
  data:
    osis: Prov.18.15
    name: Proverbs 18:15
    apiRef: Proverbs18:15
    book: Prov
    chapter: 18
    verse: 15
    text: The heart of the prudent getteth knowledge; and the ear of the wise seeketh knowledge.
    web: The heart of the discerning gets knowledge. The ear of the wise seeks knowledge.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
