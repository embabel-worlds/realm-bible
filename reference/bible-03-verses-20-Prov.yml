    osis: Prov.18.20
    name: Proverbs 18:20
    apiRef: Proverbs18:20
    book: Prov
    chapter: 18
    verse: 20
    text: A man’s belly shall be satisfied with the fruit of his mouth; and with the increase of his lips shall he be filled.
    web: A man’s stomach is filled with the fruit of his mouth. With the harvest of his lips he is satisfied.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
