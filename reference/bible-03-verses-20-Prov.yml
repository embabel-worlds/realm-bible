    name: Proverbs 19:5
    apiRef: Proverbs19:5
    book: Prov
    chapter: 19
    verse: 5
    text: A false witness shall not be unpunished, and he that speaketh lies shall not escape.
    web: A false witness shall not be unpunished. He who pours out lies shall not go free.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
