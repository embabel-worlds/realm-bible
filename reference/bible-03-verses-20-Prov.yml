    apiRef: Proverbs18:11
    book: Prov
    chapter: 18
    verse: 11
    text: The rich man’s wealth is his strong city, and as an high wall in his own conceit.
    web: The rich man’s wealth is his strong city, like an unscalable wall in his own imagination.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
