    name: Proverbs 18:9
    apiRef: Proverbs18:9
    book: Prov
    chapter: 18
    verse: 9
    text: He also that is slothful in his work is brother to him that is a great waster.
    web: One who is slack in his work is brother to him who is a master of destruction.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
