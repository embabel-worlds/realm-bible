    name: Proverbs 18:23
    apiRef: Proverbs18:23
    book: Prov
    chapter: 18
    verse: 23
    text: The poor useth intreaties; but the rich answereth roughly.
    web: The poor plead for mercy, but the rich answer harshly.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
