    apiRef: Proverbs19:4
    book: Prov
    chapter: 19
    verse: 4
    text: Wealth maketh many friends; but the poor is separated from his neighbour.
    web: Wealth adds many friends, but the poor is separated from his friend.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
