    name: Proverbs 18:7
    apiRef: Proverbs18:7
    book: Prov
    chapter: 18
    verse: 7
    text: A fool’s mouth is his destruction, and his lips are the snare of his soul.
    web: A fool’s mouth is his destruction, and his lips are a snare to his soul.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
