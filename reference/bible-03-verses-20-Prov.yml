    osis: Prov.19.15
    name: Proverbs 19:15
    apiRef: Proverbs19:15
    book: Prov
    chapter: 19
    verse: 15
    text: Slothfulness casteth into a deep sleep; and an idle soul shall suffer hunger.
    web: Slothfulness casts into a deep sleep. The idle soul shall suffer hunger.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
  data:
    osis: Prov.19.16
    name: Proverbs 19:16
    apiRef: Proverbs19:16
    book: Prov
    chapter: 19
    verse: 16
    text: He that keepeth the commandment keepeth his own soul; but he that despiseth his ways shall die.
    web: He who keeps the commandment keeps his soul, but he who is contemptuous in his ways shall die.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
  data:
    osis: Prov.19.17
    name: Proverbs 19:17
    apiRef: Proverbs19:17
    book: Prov
    chapter: 19
    verse: 17
    text: He that hath pity upon the poor lendeth unto the LORD; and that which he hath given will he pay him again.
    web: He who has pity on the poor lends to the LORD; he will reward him.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
  data:
    osis: Prov.19.18
    name: Proverbs 19:18
    apiRef: Proverbs19:18
    book: Prov
    chapter: 19
    verse: 18
    text: Chasten thy son while there is hope, and let not thy soul spare for his crying.
    web: Discipline your son, for there is hope; don’t be a willing party to his death.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
