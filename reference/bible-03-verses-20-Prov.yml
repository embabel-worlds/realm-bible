    osis: Prov.18.17
    name: Proverbs 18:17
    apiRef: Proverbs18:17
    book: Prov
    chapter: 18
    verse: 17
    text: He that is first in his own cause seemeth just; but his neighbour cometh and searcheth him.
    web: He who pleads his cause first seems right— until another comes and questions him.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
