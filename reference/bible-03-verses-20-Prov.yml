    osis: Prov.19.7
    name: Proverbs 19:7
    apiRef: Proverbs19:7
    book: Prov
    chapter: 19
    verse: 7
    text: 'All the brethren of the poor do hate him: how much more do his friends go far from him? he pursueth them with words, yet they are wanting to him.'
    web: All the relatives of the poor shun him; how much more do his friends avoid him! He pursues them with pleas, but they are gone.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
