    name: Proverbs 19:10
    apiRef: Proverbs19:10
    book: Prov
    chapter: 19
    verse: 10
    text: Delight is not seemly for a fool; much less for a servant to have rule over princes.
    web: Delicate living is not appropriate for a fool, much less for a servant to have rule over princes.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
