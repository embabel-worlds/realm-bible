    osis: Prov.18.21
    name: Proverbs 18:21
    apiRef: Proverbs18:21
    book: Prov
    chapter: 18
    verse: 21
    text: 'Death and life are in the power of the tongue: and they that love it shall eat the fruit thereof.'
    web: Death and life are in the power of the tongue; those who love it will eat its fruit.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
