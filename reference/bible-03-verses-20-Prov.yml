    osis: Prov.19.27
    name: Proverbs 19:27
    apiRef: Proverbs19:27
    book: Prov
    chapter: 19
    verse: 27
    text: Cease, my son, to hear the instruction that causeth to err from the words of knowledge.
    web: If you stop listening to instruction, my son, you will stray from the words of knowledge.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
