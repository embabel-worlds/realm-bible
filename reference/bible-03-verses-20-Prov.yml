    osis: Prov.19.3
    name: Proverbs 19:3
    apiRef: Proverbs19:3
    book: Prov
    chapter: 19
    verse: 3
    text: 'The foolishness of man perverteth his way: and his heart fretteth against the LORD.'
    web: The foolishness of man subverts his way; his heart rages against the LORD.
