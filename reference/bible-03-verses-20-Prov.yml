  data:
    osis: Prov.18.19
    name: Proverbs 18:19
    apiRef: Proverbs18:19
    book: Prov
    chapter: 18
    verse: 19
    text: 'A brother offended is harder to be won than a strong city: and their contentions are like the bars of a castle.'
    web: A brother offended is more difficult than a fortified city. Disputes are like the bars of a fortress.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
