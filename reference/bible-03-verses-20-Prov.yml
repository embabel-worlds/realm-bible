  data:
    osis: Prov.19.12
    name: Proverbs 19:12
    apiRef: Proverbs19:12
    book: Prov
    chapter: 19
    verse: 12
    text: The king’s wrath is as the roaring of a lion; but his favour is as dew upon the grass.
    web: The king’s wrath is like the roaring of a lion, but his favor is like dew on the grass.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
