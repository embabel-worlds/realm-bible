  data:
    osis: Prov.18.1
    name: Proverbs 18:1
    apiRef: Proverbs18:1
    book: Prov
    chapter: 18
    verse: 1
    text: Through desire a man, having separated himself, seeketh and intermeddleth with all wisdom.
    web: A man who isolates himself pursues selfishness, and defies all sound judgment.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
