  data:
    osis: Prov.18.6
    name: Proverbs 18:6
    apiRef: Proverbs18:6
    book: Prov
    chapter: 18
    verse: 6
    text: A fool’s lips enter into contention, and his mouth calleth for strokes.
    web: A fool’s lips come into strife, and his mouth invites beatings.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
