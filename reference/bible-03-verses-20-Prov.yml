    name: Proverbs 18:18
    apiRef: Proverbs18:18
    book: Prov
    chapter: 18
    verse: 18
    text: The lot causeth contentions to cease, and parteth between the mighty.
    web: The lot settles disputes, and keeps strong ones apart.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
