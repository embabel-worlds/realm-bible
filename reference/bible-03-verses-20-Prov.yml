    name: Proverbs 19:9
    apiRef: Proverbs19:9
    book: Prov
    chapter: 19
    verse: 9
    text: A false witness shall not be unpunished, and he that speaketh lies shall perish.
    web: A false witness shall not be unpunished. He who utters lies shall perish.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
