    osis: Prov.18.2
    name: Proverbs 18:2
    apiRef: Proverbs18:2
    book: Prov
    chapter: 18
    verse: 2
    text: A fool hath no delight in understanding, but that his heart may discover itself.
    web: A fool has no delight in understanding, but only in revealing his own opinion.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
