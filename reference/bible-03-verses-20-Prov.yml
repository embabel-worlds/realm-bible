  - predicate: IN
    to:
      type: Passage
      osis: Prov.17
- type: Verse
  data:
    osis: Prov.17.27
    name: Proverbs 17:27
    apiRef: Proverbs17:27
    book: Prov
    chapter: 17
    verse: 27
    text: 'He that hath knowledge spareth his words: and a man of understanding is of an excellent spirit.'
    web: He who spares his words has knowledge. He who is even tempered is a man of understanding.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.17
- type: Verse
  data:
    osis: Prov.17.28
    name: Proverbs 17:28
    apiRef: Proverbs17:28
    book: Prov
    chapter: 17
    verse: 28
    text: 'Even a fool, when he holdeth his peace, is counted wise: and he that shutteth his lips is esteemed a man of understanding.'
    web: Even a fool, when he keeps silent, is counted wise. When he shuts his lips, he is thought to be discerning.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.17
