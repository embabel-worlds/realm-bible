    apiRef: Proverbs18:12
    book: Prov
    chapter: 18
    verse: 12
    text: Before destruction the heart of man is haughty, and before honour is humility.
    web: Before destruction the heart of man is proud, but before honor is humility.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
