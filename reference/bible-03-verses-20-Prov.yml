    osis: Prov.19.2
    name: Proverbs 19:2
    apiRef: Proverbs19:2
    book: Prov
    chapter: 19
    verse: 2
    text: Also, that the soul be without knowledge, it is not good; and he that hasteth with his feet sinneth.
    web: It isn’t good to have zeal without knowledge, nor to be hasty with one’s feet and miss the way.
