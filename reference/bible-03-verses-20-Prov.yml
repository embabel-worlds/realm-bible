    osis: Prov.19.20
    name: Proverbs 19:20
    apiRef: Proverbs19:20
    book: Prov
    chapter: 19
    verse: 20
    text: Hear counsel, and receive instruction, that thou mayest be wise in thy latter end.
    web: Listen to counsel and receive instruction, that you may be wise in your latter end.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
