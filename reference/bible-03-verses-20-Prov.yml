    osis: Prov.19.19
    name: Proverbs 19:19
    apiRef: Proverbs19:19
    book: Prov
    chapter: 19
    verse: 19
    text: 'A man of great wrath shall suffer punishment: for if thou deliver him, yet thou must do it again.'
    web: A hot-tempered man must pay the penalty, for if you rescue him, you must do it again.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
