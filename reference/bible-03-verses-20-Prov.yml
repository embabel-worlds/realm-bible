    name: Proverbs 18:24
    apiRef: Proverbs18:24
    book: Prov
    chapter: 18
    verse: 24
    text: 'A man that hath friends must shew himself friendly: and there is a friend that sticketh closer than a brother.'
    web: A man of many companions may be ruined, but there is a friend who sticks closer than a brother.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
