    osis: Prov.19.21
    name: Proverbs 19:21
    apiRef: Proverbs19:21
    book: Prov
    chapter: 19
    verse: 21
    text: There are many devices in a man’s heart; nevertheless the counsel of the LORD, that shall stand.
    web: There are many plans in a man’s heart, but the LORD’s counsel will prevail.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
  data:
    osis: Prov.19.22
    name: Proverbs 19:22
    apiRef: Proverbs19:22
    book: Prov
    chapter: 19
    verse: 22
    text: 'The desire of a man is his kindness: and a poor man is better than a liar.'
    web: That which makes a man to be desired is his kindness. A poor man is better than a liar.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
  data:
    osis: Prov.19.23
    name: Proverbs 19:23
    apiRef: Proverbs19:23
    book: Prov
    chapter: 19
    verse: 23
    text: 'The fear of the LORD tendeth to life: and he that hath it shall abide satisfied; he shall not be visited with evil.'
    web: The fear of the LORD leads to life, then contentment; he rests and will not be touched by trouble.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
  data:
    osis: Prov.19.24
    name: Proverbs 19:24
    apiRef: Proverbs19:24
    book: Prov
    chapter: 19
    verse: 24
    text: A slothful man hideth his hand in his bosom, and will not so much as bring it to his mouth again.
    web: The sluggard buries his hand in the dish; he will not so much as bring it to his mouth again.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
  data:
    osis: Prov.19.25
    name: Proverbs 19:25
    apiRef: Proverbs19:25
    book: Prov
    chapter: 19
    verse: 25
    text: 'Smite a scorner, and the simple will beware: and reprove one that hath understanding, and he will understand knowledge.'
    web: Flog a scoffer, and the simple will learn prudence; rebuke one who has understanding, and he will gain knowledge.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
