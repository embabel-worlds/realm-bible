    osis: Prov.19.26
    name: Proverbs 19:26
    apiRef: Proverbs19:26
    book: Prov
    chapter: 19
    verse: 26
    text: He that wasteth his father, and chaseth away his mother, is a son that causeth shame, and bringeth reproach.
    web: He who robs his father and drives away his mother is a son who causes shame and brings reproach.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
