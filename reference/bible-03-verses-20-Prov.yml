  data:
    osis: Prov.19.13
    name: Proverbs 19:13
    apiRef: Proverbs19:13
    book: Prov
    chapter: 19
    verse: 13
    text: 'A foolish son is the calamity of his father: and the contentions of a wife are a continual dropping.'
    web: A foolish son is the calamity of his father. A wife’s quarrels are a continual dripping.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
  data:
    osis: Prov.19.14
    name: Proverbs 19:14
    apiRef: Proverbs19:14
    book: Prov
    chapter: 19
    verse: 14
    text: 'House and riches are the inheritance of fathers: and a prudent wife is from the LORD.'
    web: House and riches are an inheritance from fathers, but a prudent wife is from the LORD.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
