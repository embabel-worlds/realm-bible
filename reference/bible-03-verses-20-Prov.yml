    name: Proverbs 18:13
    apiRef: Proverbs18:13
    book: Prov
    chapter: 18
    verse: 13
    text: He that answereth a matter before he heareth it, it is folly and shame unto him.
    web: He who answers before he hears, that is folly and shame to him.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
