    name: Proverbs 18:16
    apiRef: Proverbs18:16
    book: Prov
    chapter: 18
    verse: 16
    text: A man’s gift maketh room for him, and bringeth him before great men.
    web: A man’s gift makes room for him, and brings him before great men.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.18
