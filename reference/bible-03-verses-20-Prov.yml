    osis: Prov.19.28
    name: Proverbs 19:28
    apiRef: Proverbs19:28
    book: Prov
    chapter: 19
    verse: 28
    text: 'An ungodly witness scorneth judgment: and the mouth of the wicked devoureth iniquity.'
    web: A corrupt witness mocks justice, and the mouth of the wicked gulps down iniquity.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Prov.19
- type: Verse
  data:
    osis: Prov.19.29
    name: Proverbs 19:29
    apiRef: Proverbs19:29
    book: Prov
