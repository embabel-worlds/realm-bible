    name: "Psalm 105"
    latin: ""
    verseCount: 45
    verses:
    - "1 Give thanks to the LORD and call upon his Name; *\n  make known his deeds among the peoples."
    - "2 Sing to him, sing praises to him, *\n  and speak of all his marvelous works."
    - "3 Glory in his holy Name; *\n  let the hearts of those who seek the LORD rejoice."
    - "4 Search for the LORD and his strength; *\n  continually seek his face."
    - "5 Remember the marvels he has done, *\n  his wonders and the judgments of his mouth,"
    - "6 O offspring of Abraham his servant, *\n  O children of Jacob his chosen."
    - "7 He is the LORD our God; *\n  his judgments prevail in all the world."
    - "8 He has always been mindful of his covenant, *\n  the promise he made for a thousand generations:"
    - "9 The covenant he made with Abraham, *\n  the oath that he swore to Isaac,"
    - "10 Which he established as a statute for Jacob, *\n  an everlasting covenant for Israel,"
    - "11 Saying, \"To you will I give the land of Canaan *\n  to be your allotted inheritance.\""
    - "12 When they were few in number, *\n  of little account, and sojourners in the land,"
    - "13 Wandering from nation to nation *\n  and from one kingdom to another,"
    - "14 He let no one oppress them *\n  and rebuked kings for their sake,"
    - "15 Saying, \"Do not touch my anointed *\n  and do my prophets no harm.\""
    - "16 Then he called for a famine in the land *\n  and destroyed the supply of bread."
    - "17 He sent a man before them, *\n  Joseph, who was sold as a slave."
    - "18 They bruised his feet in fetters; *\n  his neck they put in an iron collar."
    - "19 Until his prediction came to pass, *\n  the word of the LORD tested him."
    - "20 The king sent and released him; *\n  the ruler of the peoples set him free."
    - "21 He set him as a master over his household, *\n  as a ruler over all his possessions,"
    - "22 To instruct his princes according to his will *\n  and to teach his elders wisdom."
    - "23 Israel came into Egypt, *\n  and Jacob became a sojourner in the land of Ham."
    - "24 The LORD made his people exceedingly fruitful; *\n  he made them stronger than their enemies;"
    - "25 Whose heart he turned, so that they hated his people, *\n  and dealt unjustly with his servants."
    - "26 He sent Moses his servant, *\n  and Aaron whom he had chosen."
    - "27 They worked his signs among them, *\n  and portents in the land of Ham."
    - "28 He sent darkness, and it grew dark; *\n  but the Egyptians rebelled against his words."
    - "29 He turned their waters into blood *\n  and caused their fish to die."
    - "30 Their land was overrun by frogs, *\n  in the very chambers of their kings."
    - "31 He spoke, and there came swarms of insects *\n  and gnats within all their borders."
    - "32 He gave them hailstones instead of rain, *\n  and flames of fire throughout their land."
    - "33 He blasted their vines and their fig trees *\n  and shattered every tree in their country."
    - "34 He spoke, and the locust came, *\n  and young locusts without number,"
    - "35 Which ate up all the green plants in their land *\n  and devoured the fruit of their soil."
    - "36 He struck down the firstborn of their land, *\n  the firstfruits of all their strength."
    - "37 He led out his people with silver and gold; *\n  in all their tribes there was not one that stumbled."
    - "38 Egypt was glad of their going, *\n  because they were afraid of them."
    - "39 He spread out a cloud for a covering *\n  and a fire to give light in the night season."
    - "40 They asked, and quails appeared, *\n  and he satisfied them with bread from heaven."
    - "41 He opened the rock, and water flowed, *\n  so the river ran in the dry places."
    - "42 For God remembered his holy word *\n  and Abraham his servant."
    - "43 So he led forth his people with gladness, *\n  his chosen with shouts of joy."
    - "44 He gave his people the lands of the nations, *\n  and they took the fruit of others' toil,"
    - "45 That they might keep his statutes *\n  and observe his laws.\n  Hallelujah!"
