    - "33 The LORD changed rivers into deserts, *\n  and water-springs into thirsty ground,"
    - "34 A fruitful land into salt flats, *\n  because of the wickedness of those who dwell there."
    - "35 He changed deserts into pools of water *\n  and dry land into water-springs."
    - "36 He settled the hungry there, *\n  and they founded a city to dwell in."
    - "37 They sowed fields, and planted vineyards, *\n  and brought in a fruitful harvest."
    - "38 He blessed them, so that they increased greatly; *\n  he did not let their herds decrease."
    - "39 Yet when they were diminished and brought low, *\n  through stress of adversity and sorrow,"
    - "40 (He pours contempt on princes *\n  and makes them wander in trackless wastes)"
    - "41 He lifted up the poor out of misery *\n  and multiplied their families like flocks of sheep."
    - "42 The upright will see this and rejoice, *\n  but all wickedness will shut its mouth."
    - "43 Whoever is wise will ponder these things, *\n  and consider well the mercies of the LORD."
