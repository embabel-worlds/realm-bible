  data:
    key: "psalm-134"
    number: 134
    name: "Psalm 134"
    latin: "Ecce nunc"
    verseCount: 2
    verses:
    - "1 Behold now, bless the LORD, all you servants of the LORD, *\n  you that stand by night in the house of the LORD."
    - "2 Lift up your hands in the holy place and bless the LORD; *\n  the LORD who made heaven and earth bless\n  you out of Zion."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.134"
- type: "BcpPsalm"
  data:
    key: "psalm-135"
    number: 135
    name: "Psalm 135"
    latin: "Laudate nomen"
    verseCount: 21
    verses:
    - "1 Hallelujah!\n  Praise the Name of the LORD; *\n  give praise, you servants of the LORD."
    - "2 You who stand in the house of the LORD, *\n  in the courts of the house of our God."
    - "3 Praise the LORD, for the LORD is good; *\n  sing praises to his Name, for it is lovely."
    - "4 For the LORD has chosen Jacob for himself *\n  and Israel for his own possession."
    - "5 For I know that the LORD is great, *\n  and that our Lord is above all gods."
    - "6 The LORD does whatever pleases him, in heaven and on earth, *\n  in the seas and all the deeps."
    - "7 He brings up rain clouds from the ends of the earth; *\n  he sends out lightning with the rain,\n  and brings the winds out of his storehouse."
    - "8 It was he who struck down the firstborn of Egypt, *\n  the firstborn both of man and beast."
    - "9 He sent signs and wonders into the midst of you, O Egypt, *\n  against Pharaoh and all his servants."
    - "10 He overthrew many nations *\n  and put mighty kings to death:"
    - "11 Sihon, king of the Amorites,\n  and Og, the king of Bashan, *\n  and all the kingdoms of Canaan."
    - "12 He gave their land to be an inheritance, *\n  an inheritance for Israel his people."
    - "13 O LORD, your Name is everlasting; *\n  your renown, O LORD, endures from age to age."
    - "14 For the LORD gives his people justice *\n  and shows compassion to his servants."
    - "15 The idols of the heathen are silver and gold, *\n  the work of human hands."
    - "16 They have mouths, but they cannot speak; *\n  eyes have they, but they cannot see."
    - "17 They have ears, but they cannot hear; *\n  neither is there any breath in their mouth."
    - "18 Those who make them are like them, *\n  and so are all who put their trust in them."
    - "19 Bless the LORD, O house of Israel; *\n  O house of Aaron, bless the LORD."
    - "20 Bless the LORD, O house of Levi; *\n  you who fear the LORD, bless the LORD."
    - "21 Blessed be the LORD out of Zion, *\n  who dwells in Jerusalem.\n  Hallelujah!"
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.135"
- type: "BcpPsalm"
  data:
    key: "psalm-136"
    number: 136
    name: "Psalm 136"
    latin: "Confitemini"
    verseCount: 26
    verses:
    - "1 Give thanks to the LORD, for he is good, *\n  for his mercy endures for ever."
    - "2 Give thanks to the God of gods, *\n  for his mercy endures for ever."
    - "3 Give thanks to the Lord of lords, *\n  for his mercy endures for ever."
    - "4 Who only does great wonders, *\n  for his mercy endures for ever;"
    - "5 Who by wisdom made the heavens, *\n  for his mercy endures for ever;"
    - "6 Who spread out the earth upon the waters, *\n  for his mercy endures for ever;"
    - "7 Who created great lights, *\n  for his mercy endures for ever;"
    - "8 The sun to rule the day, *\n  for his mercy endures for ever;"
    - "9 The moon and the stars to govern the night, *\n  for his mercy endures for ever."
    - "10 Who struck down the firstborn of Egypt, *\n  for his mercy endures for ever;"
    - "11 And brought out Israel from among them, *\n  for his mercy endures for ever;"
    - "12 With a mighty hand and a stretched-out arm, *\n  for his mercy endures for ever;"
    - "13 Who divided the Red Sea in two, *\n  for his mercy endures for ever;"
    - "14 And made Israel to pass through the midst of it, *\n  for his mercy endures for ever;"
    - "15 But swept Pharaoh and his army into the Red Sea, *\n  for his mercy endures for ever;"
    - "16 Who led his people through the wilderness, *\n  for his mercy endures for ever."
    - "17 Who struck down great kings, *\n  for his mercy endures for ever;"
    - "18 And slew mighty kings, *\n  for his mercy endures for ever;"
    - "19 Sihon, king of the Amorites, *\n  for his mercy endures for ever;"
    - "20 And Og, the king of Bashan, *\n  for his mercy endures for ever;"
    - "21 And gave away their lands for an inheritance, *\n  for his mercy endures for ever;"
    - "22 An inheritance for Israel his servant, *\n  for his mercy endures for ever."
    - "23 Who remembered us in our low estate, *\n  for his mercy endures for ever;"
    - "24 And delivered us from our enemies, *\n  for his mercy endures for ever;"
    - "25 Who gives food to all creatures, *\n  for his mercy endures for ever."
    - "26 Give thanks to the God of heaven, *\n  for his mercy endures for ever."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.136"
- type: "BcpPsalm"
  data:
    key: "psalm-137"
    number: 137
    name: "Psalm 137"
    latin: "Super flumina"
    verseCount: 9
    verses:
    - "1 By the waters of Babylon we sat down and wept, *\n  when we remembered you, O Zion."
    - "2 As for our harps, we hung them up *\n  on the trees in the midst of that land."
    - "3 For those who led us away captive asked us for a song,\n  and our oppressors called for mirth: *\n  \"Sing us one of the songs of Zion.\""
    - "4 How shall we sing the LORD'S song *\n  upon an alien soil?"
    - "5 If I forget you, O Jerusalem, *\n  let my right hand forget its skill."
    - "6 Let my tongue cleave to the roof of my mouth\n  if I do not remember you, *\n  if I do not set Jerusalem above my highest joy."
    - "7 Remember the day of Jerusalem, O LORD,\n  against the people of Edom, *\n  who said, \"Down with it! down with it!\n  even to the ground!\""
    - "8 O Daughter of Babylon, doomed to destruction, *\n  happy the one who pays you back\n  for what you have done to us!"
    - "9 Happy shall he be who takes your little ones, *\n  and dashes them against the rock!"
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.137"
- type: "BcpPsalm"
  data:
    key: "psalm-138"
    number: 138
    name: "Psalm 138"
    latin: "Confitebor tibi"
    verseCount: 9
    verses:
    - "1 I will give thanks to you, O LORD, with my whole heart; *\n  before the gods I will sing your praise."
    - "2 I will bow down toward your holy temple\n  and praise your Name, *\n  because of your love and faithfulness;"
    - "3 For you have glorified your Name *\n  and your word above all things."
    - "4 When I called, you answered me; *\n  you increased my strength within me."
    - "5 All the kings of the earth will praise you, O LORD, *\n  when they have heard the words of your mouth."
    - "6 They will sing of the ways of the LORD, *\n  that great is the glory of the LORD."
    - "7 Though the LORD be high, he cares for the lowly; *\n  he perceives the haughty from afar."
    - "8 Though I walk in the midst of trouble, you keep me safe; *\n  you stretch forth your hand against the fury of my enemies;\n  your right hand shall save me."
    - "9 The LORD will make good his purpose for me; *\n  O LORD, your love endures for ever;\n  do not abandon the works of your hands."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.138"
- type: "BcpPsalm"
  data:
    key: "psalm-139"
    number: 139
    name: "Psalm 139"
    latin: "Domine, probasti"
    verseCount: 23
    verses:
    - "1 LORD, you have searched me out and known me; *\n  you know my sitting down and my rising up;\n  you discern my thoughts from afar."
    - "2 You trace my journeys and my resting-places *\n  and are acquainted with all my ways."
    - "3 Indeed, there is not a word on my lips, *\n  but you, O LORD, know it altogether."
    - "4 You press upon me behind and before *\n  and lay your hand upon me."
    - "5 Such knowledge is too wonderful for me; *\n  it is so high that I cannot attain to it."
    - "6 Where can I go then from your Spirit? *\n  where can I flee from your presence?"
    - "7 If I climb up to heaven, you are there; *\n  if I make the grave my bed, you are there also."
    - "8 If I take the wings of the morning *\n  and dwell in the uttermost parts of the sea,"
    - "9 Even there your hand will lead me *\n  and your right hand hold me fast."
    - "10 If I say, \"Surely the darkness will cover me, *\n  and the light around me turn to night,\""
    - "11 Darkness is not dark to you;\n  the night is as bright as the day; *\n  darkness and light to you are both alike."
    - "12 For you yourself created my inmost parts; *\n  you knit me together in my mother's womb."
    - "13 I will thank you because I am marvelously made; *\n  your works are wonderful, and I know it well."
    - "14 My body was not hidden from you, *\n  while I was being made in secret\n  and woven in the depths of the earth."
    - "15 Your eyes beheld my limbs, yet unfinished in the womb;\n  all of them were written in your book; *\n  they were fashioned day by day,\n  when as yet there was none of them."
    - "16 How deep I find your thoughts, O God! *\n  how great is the sum of them!"
    - "17 If I were to count them, they would be more in number\n  than the sand; *\n  to count them all, my life span would need to\n  be like yours."
    - "18 Oh, that you would slay the wicked, O God! *\n  You that thirst for blood, depart from me."
    - "19 They speak despitefully against you; *\n  your enemies take your Name in vain."
    - "20 Do I not hate those, O LORD, who hate you? *\n  and do I not loathe those who rise up against you?"
    - "21 I hate them with a perfect hatred; *\n  they have become my own enemies."
    - "22 Search me out, O God, and know my heart; *\n  try me and know my restless thoughts."
    - "23 Look well whether there be any wickedness in me *\n  and lead me in the way that is everlasting."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.139"
- type: "BcpPsalm"
  data:
    key: "psalm-140"
    number: 140
    name: "Psalm 140"
    latin: "Eripe me, Domine"
    verseCount: 13
    verses:
    - "1 Deliver me, O LORD, from evildoers; *\n  protect me from the violent,"
    - "2 Who devise evil in their hearts *\n  and stir up strife all day long."
    - "3 They have sharpened their tongues like a serpent; *\n  adder's poison is under their lips."
    - "4 Keep me, O LORD, from the hands of the wicked; *\n  protect me from the violent,\n  who are determined to trip me up."
    - "5 The proud have hidden a snare for me\n  and stretched out a net of cords; *\n  they have set traps for me along the path."
    - "6 I have said to the LORD, \"You are my God; *\n  listen, O LORD, to my supplication."
    - "7 O Lord GOD, the strength of my salvation, *\n  you have covered my head in the day of battle."
    - "8 Do not grant the desires of the wicked, O LORD, *\n  nor let their evil plans prosper."
    - "9 Let not those who surround me lift up their heads; *\n  let the evil of their lips overwhelm them."
    - "10 Let hot burning coals fall upon them; *\n  let them be cast into the mire, never to rise up again.\""
    - "11 A slanderer shall not be established on the earth, *\n  and evil shall hunt down the lawless."
    - "12 I know that the LORD will maintain the cause of the poor *\n  and render justice to the needy."
    - "13 Surely, the righteous will give thanks to your Name, *\n  and the upright shall continue in your sight."
  relations:
