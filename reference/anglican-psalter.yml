  data:
    key: "psalm-95"
    number: 95
    name: "Psalm 95"
    latin: "Venite, exultemus"
    verseCount: 11
    verses:
    - "1 Come, let us sing to the LORD; *\n  let us shout for joy to the Rock of our salvation."
    - "2 Let us come before his presence with thanksgiving *\n  and raise a loud shout to him with psalms."
    - "3 For the LORD is a great God, *\n  and a great King above all gods."
    - "4 In his hand are the caverns of the earth, *\n  and the heights of the hills are his also."
    - "5 The sea is his, for he made it, *\n  and his hands have molded the dry land."
    - "6 Come, let us bow down, and bend the knee, *\n  and kneel before the LORD our Maker."
    - "7 For he is our God,\n  and we are the people of his pasture and the sheep of his hand. *\n  Oh, that today you would hearken to his voice!"
    - "8 Harden not your hearts,\n  as your forebears did in the wilderness, *\n  at Meribah, and on that day at Massah,\n  when they tempted me."
    - "9 They put me to the test, *\n  though they had seen my works."
    - "10 Forty years long I detested that generation and said, *\n  \"This people are wayward in their hearts;\n  they do not know my ways.\""
    - "11 So I swore in my wrath, *\n  \"They shall not enter into my rest.\""
  relations:
