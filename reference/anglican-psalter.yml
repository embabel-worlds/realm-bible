  data:
    key: "psalm-101"
    number: 101
    name: "Psalm 101"
    latin: "Misericordiam et judicium"
    verseCount: 8
    verses:
    - "1 I will sing of mercy and justice; *\n  to you, O LORD, will I sing praises."
    - "2 I will strive to follow a blameless course;\n  oh, when will you come to me? *\n  I will walk with sincerity of heart within my house."
    - "3 I will set no worthless thing before my eyes; *\n  I hate the doers of evil deeds;\n  they shall not remain with me."
    - "4 A crooked heart shall be far from me; *\n  I will not know evil."
    - "5 Those who in secret slander their neighbors I will destroy; *\n  those who have a haughty look and a proud\n  heart I cannot abide."
    - "6 My eyes are upon the faithful in the land, that they may\n  dwell with me, *\n  and only those who lead a blameless life shall\n  be my servants."
    - "7 Those who act deceitfully shall not dwell in my house, *\n  and those who tell lies shall not continue in my sight."
    - "8 I will soon destroy all the wicked in the land, *\n  that I may root out all evildoers from the city of the LORD."
  relations:
