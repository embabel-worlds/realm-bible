  data:
    key: "psalm-92"
    number: 92
    name: "Psalm 92"
    latin: "Bonum est confiteri"
    verseCount: 14
    verses:
    - "1 It is a good thing to give thanks to the LORD, *\n  and to sing praises to your Name, O Most High;"
    - "2 To tell of your loving-kindness early in the morning *\n  and of your faithfulness in the night season;"
    - "3 On the psaltery, and on the lyre, *\n  and to the melody of the harp."
    - "4 For you have made me glad by your acts, O LORD; *\n  and I shout for joy because of the works of your hands."
    - "5 LORD, how great are your works! *\n  your thoughts are very deep."
    - "6 The dullard does not know,\n  nor does the fool understand, *\n  that though the wicked grow like weeds,\n  and all the workers of iniquity flourish,"
    - "7 They flourish only to be destroyed for ever; *\n  but you, O LORD, are exalted for evermore."
    - "8 For lo, your enemies, O LORD,\n  lo, your enemies shall perish, *\n  and all the workers of iniquity shall be scattered."
    - "9 But my horn you have exalted like the horns of wild bulls; *\n  I am anointed with fresh oil."
    - "10 My eyes also gloat over my enemies, *\n  and my ears rejoice to hear the doom of the wicked who\n  rise up against me."
    - "11 The righteous shall flourish like a palm tree, *\n  and shall spread abroad like a cedar of Lebanon."
    - "12 Those who are planted in the house of the LORD *\n  shall flourish in the courts of our God;"
    - "13 They shall still bear fruit in old age; *\n  they shall be green and succulent;"
    - "14 That they may show how upright the LORD is, *\n  my Rock, in whom there is no fault."
  relations:
