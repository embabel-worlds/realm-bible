  data:
    key: "psalm-90"
    number: 90
    name: "Psalm 90"
    latin: "Domine, refugium"
    verseCount: 17
    verses:
    - "1 Lord, you have been our refuge *\n  from one generation to another."
    - "2 Before the mountains were brought forth,\n  or the land and the earth were born, *\n  from age to age you are God."
    - "3 You turn us back to the dust and say, *\n  \"Go back, O child of earth.\""
    - "4 For a thousand years in your sight are like yesterday\n  when it is past *\n  and like a watch in the night."
    - "5 You sweep us away like a dream; *\n  we fade away suddenly like the grass."
    - "6 In the morning it is green and flourishes; *\n  in the evening it is dried up and withered."
    - "7 For we consume away in your displeasure; *\n  we are afraid because of your wrathful indignation."
    - "8 Our iniquities you have set before you, *\n  and our secret sins in the light of your countenance."
    - "9 When you are angry, all our days are gone; *\n  we bring our years to an end like a sigh."
    - "10 The span of our life is seventy years,\n  perhaps in strength even eighty; *\n  yet the sum of them is but labor and sorrow,\n  for they pass away quickly and we are gone."
    - "11 Who regards the power of your wrath? *\n  who rightly fears your indignation?"
    - "12 So teach us to number our days *\n  that we may apply our hearts to wisdom."
    - "13 Return, O LORD; how long will you tarry? *\n  be gracious to your servants."
    - "14 Satisfy us by your loving-kindness in the morning; *\n  so shall we rejoice and be glad all the days of our life."
    - "15 Make us glad by the measure of the days that you afflicted us *\n  and the years in which we suffered adversity."
    - "16 Show your servants your works *\n  and your splendor to their children."
    - "17 May the graciousness of the LORD our God be upon us; *\n  prosper the work of our hands;\n  prosper our handiwork."
