  data:
    key: "psalm-34"
    number: 34
    name: "Psalm 34"
    latin: "Benedicam Dominum"
    verseCount: 21
    verses:
    - "1 I will bless the LORD at all times; *\n  his praise shall ever be in my mouth."
    - "2 I will glory in the LORD; *\n  let the humble hear and rejoice."
    - "4 I sought the LORD, and he answered me *\n  and delivered me out of all my terror."
    - "5 Look upon him and be radiant, *\n  and let not your faces be ashamed."
    - "6 I called in my affliction and the LORD heard me *\n  and saved me from all my troubles."
    - "7 The angel of the LORD encompasses those who fear him, *\n  and he will deliver them."
    - "8 Taste and see that the LORD is good; *\n  happy are they who trust in him!"
    - "9 Fear the LORD, you that are his saints, *\n  for those who fear him lack nothing."
    - "10 The young lions lack and suffer hunger, *\n  but those who seek the LORD lack nothing that is good."
    - "11 Come, children, and listen to me; *\n  I will teach you the fear of the LORD."
    - "12 Who among you loves life *\n  and desires long life to enjoy prosperity?"
    - "13 Keep your tongue from evil-speaking *\n  and your lips from lying words."
    - "14 Turn from evil and do good; *\n  seek peace and pursue it."
    - "15 The eyes of the LORD are upon the righteous, *\n  and his ears are open to their cry."
    - "16 The face of the LORD is against those who do evil, *\n  to root out the remembrance of them from the earth."
    - "17 The righteous cry, and the LORD hears them *\n  and delivers them from all their troubles."
    - "18 The LORD is near to the brokenhearted *\n  and will save those whose spirits are crushed."
    - "19 Many are the troubles of the righteous, *\n  but the LORD will deliver him out of them all."
    - "20 He will keep safe all his bones; *\n  not one of them shall be broken."
    - "21 Evil shall slay the wicked, *\n  and those who hate the righteous will be punished."
    - "22 The LORD ransoms the life of his servants, *\n  and none will be punished who trust in him."
