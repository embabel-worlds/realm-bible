  data:
    key: "psalm-84"
    number: 84
    name: "Psalm 84"
    latin: "Quam dilecta!"
    verseCount: 12
    verses:
    - "1 How dear to me is your dwelling, O LORD of hosts! *\n  My soul has a desire and longing for the courts of\n  the LORD;\n  my heart and my flesh rejoice in the living God."
    - "2 The sparrow has found her a house\n  and the swallow a nest where she may lay her young; *\n  by the side of your altars, O LORD of hosts,\n  my King and my God."
    - "3 Happy are they who dwell in your house! *\n  they will always be praising you."
    - "4 Happy are the people whose strength is in you! *\n  whose hearts are set on the pilgrims' way."
    - "5 Those who go through the desolate valley will find\n  it a place of springs, *\n  for the early rains have covered it with pools of water."
    - "6 They will climb from height to height, *\n  and the God of gods will reveal himself in Zion."
    - "7 LORD God of hosts, hear my prayer; *\n  hearken, O God of Jacob."
    - "8 Behold our defender, O God; *\n  and look upon the face of your Anointed."
    - "9 For one day in your courts is better than\n  a thousand in my own room, *\n  and to stand at the threshold of the house of my God\n  than to dwell in the tents of the wicked."
    - "10 For the LORD God is both sun and shield; *\n  he will give grace and glory;"
    - "11 No good thing will the LORD withhold *\n  from those who walk with integrity."
    - "12 O LORD of hosts, *\n  happy are they who put their trust in you!"
