  data:
    key: "psalm-74"
    number: 74
    name: "Psalm 74"
    latin: "Ut quid, Deus?"
    verseCount: 22
    verses:
    - "1 O God, why have you utterly cast us off? *\n  why is your wrath so hot against the sheep of your pasture?"
    - "2 Remember your congregation that you purchased long ago, *\n  the tribe you redeemed to be your inheritance,\n  and Mount Zion where you dwell."
    - "3 Turn your steps toward the endless ruins; *\n  the enemy has laid waste everything in your sanctuary."
    - "4 Your adversaries roared in your holy place; *\n  they set up their banners as tokens of victory."
    - "5 They were like men coming up with axes to a grove of trees; *\n  they broke down all your carved work with hatchets\n  and hammers."
    - "6 They set fire to your holy place; *\n  they defiled the dwelling-place of your Name\n  and razed it to the ground."
    - "7 They said to themselves, \"Let us destroy them altogether.\" *\n  They burned down all the meeting-places of God\n  in the land."
    - "8 There are no signs for us to see;\n  there is no prophet left; *\n  there is not one among us who knows how long."
    - "9 How long, O God, will the adversary scoff? *\n  will the enemy blaspheme your Name for ever?"
    - "10 Why do you draw back your hand? *\n  why is your right hand hidden in your bosom?"
    - "11 Yet God is my King from ancient times, *\n  victorious in the midst of the earth."
    - "12 You divided the sea by your might *\n  and shattered the heads of the dragons upon the waters;"
    - "13 You crushed the heads of Leviathan *\n  and gave him to the people of the desert for food."
    - "14 You split open spring and torrent; *\n  you dried up ever-flowing rivers."
    - "15 Yours is the day, yours also the night; *\n  you established the moon and the sun."
    - "16 You fixed all the boundaries of the earth; *\n  you made both summer and winter."
    - "17 Remember, O LORD, how the enemy scoffed, *\n  how a foolish people despised your Name."
    - "18 Do not hand over the life of your dove to wild beasts; *\n  never forget the lives of your poor."
    - "19 Look upon your covenant; *\n  the dark places of the earth are haunts of violence."
    - "20 Let not the oppressed turn away ashamed; *\n  let the poor and needy praise your Name."
    - "21 Arise, O God, maintain your cause; *\n  remember how fools revile you all day long."
    - "22 Forget not the clamor of your adversaries, *\n  the unending tumult of those who rise up against you."
