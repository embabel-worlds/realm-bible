    to:
      type: "Passage"
      osis: "Ps.19"
- type: "BcpPsalm"
  data:
    key: "psalm-20"
    number: 20
    name: "Psalm 20"
    latin: "Exaudiat te Dominus"
    verseCount: 9
    verses:
    - "1 May the LORD answer you in the day of trouble, *\n  the Name of the God of Jacob defend you;"
    - "2 Send you help from his holy place *\n  and strengthen you out of Zion;"
    - "3 Remember all your offerings *\n  and accept your burnt sacrifice;"
    - "4 Grant you your heart's desire *\n  and prosper all your plans."
    - "5 We will shout for joy at your victory\n  and triumph in the Name of our God; *\n  may the LORD grant all your requests."
    - "6 Now I know that the LORD gives victory to his anointed; *\n  he will answer him out of his holy heaven,\n  with the victorious strength of his right hand."
    - "7 Some put their trust in chariots and some in horses, *\n  but we will call upon the Name of the LORD our God."
    - "8 They collapse and fall down, *\n  but we will arise and stand upright."
    - "9 O LORD, give victory to the king *\n  and answer us when we call."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.20"
- type: "BcpPsalm"
  data:
    key: "psalm-21"
    number: 21
    name: "Psalm 21"
    latin: "Domine, in virtute tua"
    verseCount: 14
    verses:
    - "1 The king rejoices in your strength, O LORD; *\n  how greatly he exults in your victory!"
    - "2 You have given him his heart's desire; *\n  you have not denied him the request of his lips."
    - "3 For you meet him with blessings of prosperity, *\n  and set a crown of fine gold upon his head."
    - "4 He asked you for life, and you gave it to him: *\n  length of days, for ever and ever."
    - "5 His honor is great, because of your victory; *\n  splendor and majesty have you bestowed upon him."
    - "6 For you will give him everlasting felicity *\n  and will make him glad with the joy of your presence."
    - "7 For the king puts his trust in the LORD; *\n  because of the loving-kindness of the Most High, he\n  will not fall."
    - "8 Your hand will lay\n  hold upon all your enemies; *\n  your right hand will seize all those who hate you."
    - "9 You will make them like a fiery furnace *\n  at the time of your appearing, O LORD;"
    - "10 You will swallow them up in your wrath, *\n  and fire shall consume them."
    - "11 You will destroy their offspring from the land *\n  and their descendants from among the peoples of the earth."
    - "12 Though they intend evil against you\n  and devise wicked schemes, *\n  yet they shall not prevail."
    - "13 For you will put them to flight *\n  and aim your arrows at them."
    - "14 Be exalted, O LORD, in your might; *\n  we will sing and praise your power."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.21"
- type: "BcpPsalm"
  data:
    key: "psalm-22"
    number: 22
    name: "Psalm 22"
    latin: "Deus, Deus meu"
    verseCount: 30
    verses:
    - "1 My God, my God, why have you forsaken me? *\n  and are so far from my cry\n  and from the words of my distress?"
    - "2 O my God, I cry in the daytime, but you do not answer; *\n  by night as well, but I find no rest."
    - "3 Yet you are the Holy One, *\n  enthroned upon the praises of Israel."
    - "4 Our forefathers put their trust in you; *\n  they trusted, and you delivered them."
    - "5 They cried out to you and were delivered; *\n  they trusted in you and were not put to shame."
    - "6 But as for me, I am a worm and no man, *\n  scorned by all and despised by the people."
    - "7 All who see me laugh me to scorn; *\n  they curl their lips and wag their heads, saying,"
    - "8 \"He trusted in the LORD; let him deliver him; *\n  let him rescue him, if he delights in him.\""
    - "9 Yet you are he who took me out of the womb, *\n  and kept me safe upon my mother's breast."
    - "10 I have been entrusted to you ever since I was born; *\n  you were my God when I was still in my\n  mother's womb."
    - "11 Be not far from me, for trouble is near, *\n  and there is none to help."
    - "12 Many young bulls encircle me; *\n  strong bulls of Bashan surround me."
    - "13 They open wide their jaws at me, *\n  like a ravening and a roaring lion."
    - "14 I am poured out like water;\n  all my bones are out of joint; *\n  my heart within my breast is melting wax."
    - "15 My mouth is dried out like a pot-sherd;\n  my tongue sticks to the roof of my mouth; *\n  and you have laid me in the dust of the grave."
    - "16 Packs of dogs close me in,\n  and gangs of evildoers circle around me; *\n  they pierce my hands and my feet;\n  I can count all my bones."
    - "17 They stare and gloat over me; *\n  they divide my garments among them;\n  they cast lots for my clothing."
    - "18 Be not far away, O LORD; *\n  you are my strength; hasten to help me."
    - "19 Save me from the sword, *\n  my life from the power of the dog."
    - "20 Save me from the lion's mouth, *\n  my wretched body from the horns of wild bulls."
    - "21 I will declare your Name to my brethren; *\n  in the midst of the congregation I will praise you."
    - "22 Praise the LORD, you that fear him; *\n  stand in awe of him, O offspring of Israel;\n  all you of Jacob's line, give glory."
    - "23 For he does not despise nor abhor the poor in their poverty;\n  neither does he hide his face from them; *\n  but when they cry to him he hears them."
    - "24 My praise is of him in the great assembly; *\n  I will perform my vows in the presence of those who\n  worship him."
    - "25 The poor shall eat and be satisfied,\n  and those who seek the LORD shall praise him: *\n  \"May your heart live for ever!\""
    - "26 All the ends of the earth shall remember and turn to\n  the LORD, *\n  and all the families of the nations bow before him."
    - "27 For kingship belongs to the LORD; *\n  he rules over the nations."
    - "28 To him alone all who sleep in the earth bow down\n  in worship; *\n  all who go down to the dust fall before him."
    - "29 My soul shall live for him;\n  my descendants shall serve him; *\n  they shall be known as the LORD'S for ever."
    - "30 They shall come and make known to a people yet unborn *\n  the saving deeds that he has done."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.22"
