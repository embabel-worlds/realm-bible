- type: "BcpPsalm"
  data:
    key: "psalm-1"
    number: 1
    name: "Psalm 1"
    latin: "Beatus vir qui non abiit"
    verseCount: 6
    verses:
    - "1 Happy are they who have not walked in the counsel of\n  the wicked, *\n  nor lingered in the way of sinners,\n  nor sat in the seats of the scornful!"
    - "2 Their delight is in the law of the LORD, *\n  and they meditate on his law day and night."
    - "3 They are like trees planted by streams of water,\n  bearing fruit in due season, with leaves that do not wither; *\n  everything they do shall prosper."
    - "4 It is not so with the wicked; *\n  they are like chaff which the wind blows away."
    - "5 Therefore the wicked shall not stand upright when\n  judgment comes, *\n  nor the sinner in the council of the righteous."
    - "6 For the LORD knows the way of the righteous, *\n  but the way of the wicked is doomed."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.1"
- type: "BcpPsalm"
  data:
    key: "psalm-2"
    number: 2
    name: "Psalm 2"
    latin: "Quare fremuerunt gentes?"
    verseCount: 13
    verses:
    - "1 Why are the nations in an uproar? *\n  Why do the peoples mutter empty threats?"
    - "2 Why do the kings of the earth rise up in revolt,\n  and the princes plot together, *\n  against the LORD and against his Anointed?"
    - "3 \"Let us break their yoke,\" they say; *\n  \"let us cast off their bonds from us.\""
    - "4 He whose throne is in heaven is laughing; *\n  the Lord has them in derision."
    - "5 Then he speaks to them in his wrath, *\n  and his rage fills them with terror."
    - "6 \"I myself have set my king *\n  upon my holy hill of Zion.\""
    - "7 Let me announce the decree of the LORD: *\n  he said to me, \"You are my Son;\n  this day have I begotten you."
    - "8 Ask of me, and I will give you the nations for\n  your inheritance *\n  and the ends of the earth for your possession."
    - "9 You shall crush them with an iron rod *\n  and shatter them like a piece of pottery.\""
    - "10 And now, you kings, be wise; *\n  be warned, you rulers of the earth."
    - "11 Submit to the LORD with fear, *\n  and with trembling bow before him;"
    - "12 Lest he be angry and you perish; *\n  for his wrath is quickly kindled."
    - "13 Happy are they all *\n  who take refuge in him!"
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.2"
- type: "BcpPsalm"
  data:
    key: "psalm-3"
    number: 3
    name: "Psalm 3"
    latin: "Domine, quid multiplicati"
    verseCount: 8
    verses:
    - "1 LORD, how many adversaries I have! *\n  how many there are who rise up against me!"
    - "2 How many there are who say of me, *\n  \"There is no help for him in his God.\""
    - "3 But you, O LORD, are a shield about me; *\n  you are my glory, the one who lifts up my head."
    - "4 I call aloud upon the LORD, *\n  and he answers me from his holy hill;"
    - "5 I lie down and go to sleep; *\n  I wake again, because the LORD sustains me."
    - "6 I do not fear the multitudes of people *\n  who set themselves against me all around."
    - "7 Rise up, O LORD; set me free, O my God; *\n  surely, you will strike all my enemies across the face,\n  you will break the teeth of the wicked."
    - "8 Deliverance belongs to the LORD. *\n  Your blessing be upon your people!"
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.3"
- type: "BcpPsalm"
  data:
    key: "psalm-4"
    number: 4
    name: "Psalm 4"
    latin: "Cum invocarem"
    verseCount: 8
    verses:
    - "1 Answer me when I call, O God, defender of my cause; *\n  you set me free when I am hard-pressed;\n  have mercy on me and hear my prayer."
    - "2 \"You mortals, how long will you dishonor my glory; *\n  how long will you worship dumb idols\n  and run after false gods?\""
    - "3 Know that the LORD does wonders for the faithful; *\n  when I call upon the LORD, he will hear me."
    - "4 Tremble, then, and do not sin; *\n  speak to your heart in silence upon your bed."
    - "5 Offer the appointed sacrifices *\n  and put your trust in the LORD."
    - "6 Many are saying,\n  \"Oh, that we might see better times!\" *\n  Lift up the light of your countenance upon us, O LORD."
    - "7 You have put gladness in my heart, *\n  more than when grain and wine and oil increase."
    - "8 I lie down in peace; at once I fall asleep; *\n  for only you, LORD, make me dwell in safety."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.4"
- type: "BcpPsalm"
  data:
    key: "psalm-5"
    number: 5
    name: "Psalm 5"
    latin: "Verba mea auribus"
    verseCount: 15
    verses:
    - "1 Give ear to my words, O LORD; *\n  consider my meditation."
    - "2 Hearken to my cry for help, my King and my God, *\n  for I make my prayer to you."
    - "3 In the morning, LORD, you hear my voice; *\n  early in the morning I make my appeal and watch for you."
    - "4 For you are not a God who takes pleasure in wickedness, *\n  and evil cannot dwell with you."
    - "5 Braggarts cannot stand in your sight; *\n  you hate all those who work wickedness."
    - "6 You destroy those who speak lies; *\n  the bloodthirsty and deceitful, O LORD, you abhor."
    - "7 But as for me, through the greatness of your mercy I will\n  go into your house; *\n  I will bow down toward your holy temple in awe of you."
    - "8 Lead me, O LORD, in your righteousness,\n  because of those who lie in wait for me; *\n  make your way straight before me."
    - "9 For there is no truth in their mouth; *\n  there is destruction in their heart;"
    - "10 Their throat is an open grave; *\n  they flatter with their tongue."
    - "11 Declare them guilty, O God; *\n  let them fall, because of their schemes."
    - "12 Because of their many transgressions cast them out, *\n  for they have rebelled against you."
    - "13 But all who take refuge in you will be glad; *\n  they will sing out their joy for ever."
    - "14 You will shelter them, *\n  so that those who love your Name may exult in you."
    - "15 For you, O LORD, will bless the righteous; *\n  you will defend them with your favor as with a shield."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.5"
- type: "BcpPsalm"
  data:
    key: "psalm-6"
    number: 6
    name: "Psalm 6"
    latin: "Domine, ne in furore"
    verseCount: 10
    verses:
    - "1 LORD, do not rebuke me in your anger; *\n  do not punish me in your wrath."
    - "2 Have pity on me, LORD, for I am weak; *\n  heal me, LORD, for my bones are racked."
    - "3 My spirit shakes with terror; *\n  how long, O LORD, how long?"
    - "4 Turn, O LORD, and deliver me; *\n  save me for your mercy's sake."
    - "5 For in death no one remembers you; *\n  and who will give you thanks in the grave?"
    - "6 I grow weary because of my groaning; *\n  every night I drench my bed\n  and flood my couch with tears."
    - "7 My eyes are wasted with grief *\n  and worn away because of all my enemies."
    - "8 Depart from me, all evildoers, *\n  for the LORD has heard the sound of my weeping."
    - "9 The LORD has heard my supplication; *\n  the LORD accepts my prayer."
    - "10 All my enemies shall be confounded and quake with fear; *\n  they shall turn back and suddenly be put to shame."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.6"
- type: "BcpPsalm"
  data:
    key: "psalm-7"
    number: 7
    name: "Psalm 7"
    latin: "Domine, Deus meus"
    verseCount: 18
    verses:
    - "1 O LORD my God, I take refuge in you; *\n  save and deliver me from all who pursue me;"
    - "2 Lest like a lion they tear me in pieces *\n  and snatch me away with none to deliver me."
    - "3 O LORD my God, if I have done these things: *\n  if there is any wickedness in my hands,"
    - "4 If I have repaid my friend with evil, *\n  or plundered him who without cause is my enemy;"
    - "5 Then let my enemy pursue and overtake me, *\n  trample my life into the ground,\n  and lay my honor in the dust."
    - "6 Stand up, O LORD, in your wrath; *\n  rise up against the fury of my enemies."
    - "7 Awake, O my God, decree justice; *\n  let the assembly of the peoples gather round you."
    - "8 Be seated on your lofty throne, O Most High; *\n  O LORD, judge the nations."
    - "9 Give judgment for me according to my\n  righteousness, O LORD, *\n  and according to my innocence, O Most High."
    - "10 Let the malice of the wicked come to an end,\n  but establish the righteous; *\n  for you test the mind and heart, O righteous God."
    - "11 God is my shield and defense; *\n  he is the savior of the true in heart."
    - "12 God is a righteous judge; *\n  God sits in judgment every day."
    - "13 If they will not repent, God will whet his sword; *\n  he will bend his bow and make it ready."
    - "14 He has prepared his weapons of death; *\n  he makes his arrows shafts of fire."
    - "15 Look at those who are in labor with wickedness, *\n  who conceive evil, and give birth to a lie."
    - "16 They dig a pit and make it deep *\n  and fall into the hole that they have made."
    - "17 Their malice turns back upon their own head; *\n  their violence falls on their own scalp."
    - "18 I will bear witness that the LORD is righteous; *\n  I will praise the Name of the LORD Most High."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.7"
- type: "BcpPsalm"
  data:
    key: "psalm-8"
    number: 8
    name: "Psalm 8"
    latin: "Domine, Dominus noster"
    verseCount: 10
    verses:
    - "1 O LORD our Governor, *\n  how exalted is your Name in all the world!"
    - "2 Out of the mouths of infants and children *\n  your majesty is praised above the heavens."
    - "3 You have set up a stronghold against your adversaries, *\n  to quell the enemy and the avenger."
    - "4 When I consider your heavens, the work of your fingers, *\n  the moon and the stars you have set in their courses,"
    - "5 What is man that you should be mindful of him? *\n  the son of man that you should seek him out?"
    - "6 You have made him but little lower than the angels; *\n  you adorn him with glory and honor;"
    - "7 You give him mastery over the works of your hands; *\n  you put all things under his feet:"
    - "8 All sheep and oxen, *\n  even the wild beasts of the field,"
    - "9 The birds of the air, the fish of the sea, *\n  and whatsoever walks in the paths of the sea."
    - "10 O LORD our Governor, *\n  how exalted is your Name in all the world!"
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.8"
- type: "BcpPsalm"
  data:
    key: "psalm-9"
    number: 9
    name: "Psalm 9"
    latin: "Confitebor tibi"
    verseCount: 20
    verses:
    - "1 I will give thanks to you, O LORD, with my whole heart; *\n  I will tell of all your marvelous works."
    - "2 I will be glad and rejoice in you; *\n  I will sing to your Name, O Most High."
    - "3 When my enemies are driven back, *\n  they will stumble and perish at your presence."
    - "4 For you have maintained my right and my cause; *\n  you sit upon your throne judging right."
    - "5 You have rebuked the ungodly and destroyed the wicked; *\n  you have blotted out their name for ever and ever."
    - "6 As for the enemy, they are finished, in perpetual ruin, *\n  their cities plowed under, the memory of them perished;"
    - "7 But the LORD is enthroned for ever; *\n  he has set up his throne for judgment."
    - "8 It is he who rules the world with righteousness; *\n  he judges the peoples with equity."
    - "9 The LORD will be a refuge for the oppressed, *\n  a refuge in time of trouble."
    - "10 Those who know your Name will put their trust in you, *\n  for you never forsake those who seek you, O LORD."
    - "11 Sing praise to the LORD who dwells in Zion; *\n  proclaim to the peoples the things he has done."
    - "12 The Avenger of blood will remember them; *\n  he will not forget the cry of the afflicted."
    - "13 Have pity on me, O LORD; *\n  see the misery I suffer from those who hate me,\n  O you who lift me up from the gate of death;"
    - "14 So that I may tell of all your praises\n  and rejoice in your salvation *\n  in the gates of the city of Zion."
    - "15 The ungodly have fallen into the pit they dug, *\n  and in the snare they set is their own foot caught."
    - "16 The LORD is known by his acts of justice; *\n  the wicked are trapped in the works of their own hands."
    - "17 The wicked shall be given over to the grave, *\n  and also all the people that forget God."
    - "18 For the needy shall not always be forgotten, *\n  and the hope of the poor shall not perish for ever."
    - "19 Rise up, O LORD, let not the ungodly have the upper hand; *\n  let them be judged before you."
    - "20 Put fear upon them, O LORD; *\n  let the ungodly know they are but mortal."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.9"
- type: "BcpPsalm"
  data:
    key: "psalm-10"
    number: 10
    name: "Psalm 10"
    latin: "Ut quid, Domine?"
    verseCount: 19
    verses:
    - "1 Why do you stand so far off, O LORD, *\n  and hide yourself in time of trouble?"
    - "2 The wicked arrogantly persecute the poor, *\n  but they are trapped in the schemes they have devised."
    - "3 The wicked boast of their heart's desire; *\n  the covetous curse and revile the LORD."
    - "4 The wicked are so proud that they care not for God; *\n  their only thought is, \"God does not matter.\""
    - "5 Their ways are devious at all times;\n  your judgments are far above out of their sight; *\n  they defy all their enemies."
    - "6 They say in their heart, \"I shall not be shaken; *\n  no harm shall happen to me ever.\""
    - "7 Their mouth is full of cursing, deceit, and oppression; *\n  under their tongue are mischief and wrong."
    - "8 They lurk in ambush in public squares\n  and in secret places they murder the innocent; *\n  they spy out the helpless."
    - "9 They lie in wait, like a lion in a covert;\n  they lie in wait to seize upon the lowly; *\n  they seize the lowly and drag them away in their net."
    - "10 The innocent are broken and humbled before them; *\n  the helpless fall before their power."
    - "11 They say in their heart, \"God has forgotten; *\n  he hides his face; he will never notice.\""
    - "12 Rise up, O LORD;\n  lift up your hand, O God; *\n  do not forget the afflicted."
    - "13 Why should the wicked revile God? *\n  why should they say in their heart, \"You do not care\"?"
    - "14 Surely, you behold trouble and misery; *\n  you see it and take it into your own hand."
    - "15 The helpless commit themselves to you, *\n  for you are the helper of orphans."
    - "16 Break the power of the wicked and evil; *\n  search out their wickedness until you find none."
    - "17 The LORD is King for ever and ever; *\n  the ungodly shall perish from his land."
    - "18 The LORD will hear the desire of the humble; *\n  you will strengthen their heart and your ears shall hear;"
    - "19 To give justice to the orphan and oppressed, *\n  so that mere mortals may strike terror no more."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.10"
- type: "BcpPsalm"
  data:
    key: "psalm-11"
    number: 11
    name: "Psalm 11"
    latin: "In Domino confido"
    verseCount: 8
    verses:
    - "1 In the LORD have I taken refuge; *\n  how then can you say to me,\n  \"Fly away like a bird to the hilltop;"
    - "2 For see how the wicked bend the bow\n  and fit their arrows to the string, *\n  to shoot from ambush at the true of heart."
    - "3 When the foundations are being destroyed, *\n  what can the righteous do?\""
    - "4 The LORD is in his holy temple; *\n  the LORD'S throne is in heaven."
    - "5 His eyes behold the inhabited world; *\n  his piercing eye weighs our worth."
    - "6 The LORD weighs the righteous as well as the wicked, *\n  but those who delight in violence he abhors."
    - "7 Upon the wicked he shall rain coals of fire and\n  burning sulphur; *\n  a scorching wind shall be their lot."
    - "8 For the LORD is righteous;\n  he delights in righteous deeds; *\n  and the just shall see his face."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.11"
- type: "BcpPsalm"
  data:
    key: "psalm-12"
    number: 12
    name: "Psalm 12"
    latin: "Salvum me fac"
    verseCount: 8
    verses:
    - "1 Help me, LORD, for there is no godly one left; *\n  the faithful have vanished from among us."
    - "2 Everyone speaks falsely with his neighbor; *\n  with a smooth tongue they speak from a double heart."
    - "3 Oh, that the LORD would cut off all smooth tongues, *\n  and close the lips that utter proud boasts!"
    - "4 Those who say, \"With our tongue will we prevail; *\n  our lips are our own; who is lord over us?\""
    - "5 \"Because the needy are oppressed,\n  and the poor cry out in misery, *\n  I will rise up,\" says the LORD,\n  \"and give them the help they long for.\""
    - "6 The words of the LORD are pure words, *\n  like silver refined from ore\n  and purified seven times in the fire."
    - "7 O LORD, watch over us *\n  and save us from this generation for ever."
    - "8 The wicked prowl on every side, *\n  and that which is worthless is highly prized by everyone."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.12"
- type: "BcpPsalm"
  data:
    key: "psalm-13"
    number: 13
    name: "Psalm 13"
    latin: "Usquequo, Domine?"
    verseCount: 6
    verses:
    - "1 How long, O LORD?\n  will you forget me for ever? *\n  how long will you hide your face from me?"
    - "2 How long shall I have perplexity in my mind,\n  and grief in my heart, day after day? *\n  how long shall my enemy triumph over me?"
    - "3 Look upon me and answer me, O LORD my God; *\n  give light to my eyes, lest I sleep in death;"
    - "4 Lest my enemy say, \"I have prevailed over him,\" *\n  and my foes rejoice that I have fallen."
    - "5 But I put my trust in your mercy; *\n  my heart is joyful because of your saving help."
    - "6 I will sing to the LORD, for he has dealt with me richly; *\n  I will praise the Name of the Lord Most High."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.13"
- type: "BcpPsalm"
  data:
    key: "psalm-14"
    number: 14
    name: "Psalm 14"
    latin: "Dixit insipiens"
    verseCount: 7
    verses:
    - "1 The fool has said in his heart, \"There is no God.\" *\n  All are corrupt and commit abominable acts;\n  there is none who does any good."
    - "2 The LORD looks down from heaven upon us all, *\n  to see if there is any who is wise,\n  if there is one who seeks after God."
    - "3 Every one has proved faithless;\n  all alike have turned bad; *\n  there is none who does good; no, not one."
    - "4 Have they no knowledge, all those evildoers *\n  who eat up my people like bread\n  and do not call upon the LORD?"
    - "5 See how they tremble with fear, *\n  because God is in the company of the righteous."
    - "6 Their aim is to confound the plans of the afflicted, *\n  but the LORD is their refuge."
    - "7 Oh, that Israel's deliverance would come out of Zion! *\n  when the LORD restores the fortunes of his people,\n  Jacob will rejoice and Israel be glad."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.14"
- type: "BcpPsalm"
  data:
    key: "psalm-15"
    number: 15
    name: "Psalm 15"
    latin: "Domine, quis habitabit?"
    verseCount: 7
    verses:
    - "1 LORD, who may dwell in your tabernacle? *\n  who may abide upon your holy hill?"
    - "2 Whoever leads a blameless life and does what is right, *\n  who speaks the truth from his heart."
    - "3 There is no guile upon his tongue;\n  he does no evil to his friend; *\n  he does not heap contempt upon his neighbor."
    - "4 In his sight the wicked is rejected, *\n  but he honors those who fear the LORD."
    - "5 He has sworn to do no wrong *\n  and does not take back his word."
    - "6 He does not give his money in hope of gain, *\n  nor does he take a bribe against the innocent."
    - "7 Whoever does these things *\n  shall never be overthrown."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.15"
- type: "BcpPsalm"
  data:
    key: "psalm-16"
    number: 16
    name: "Psalm 16"
    latin: "Conserva me, Domine"
    verseCount: 11
    verses:
    - "1 Protect me, O God, for I take refuge in you; *\n  I have said to the LORD, \"You are my Lord,\n  my good above all other.\""
    - "2 All my delight is upon the godly that are in the land, *\n  upon those who are noble among the people."
    - "3 But those who run after other gods *\n  shall have their troubles multiplied."
    - "4 Their libations of blood I will not offer, *\n  nor take the names of their gods upon my lips."
    - "5 O LORD, you are my portion and my cup; *\n  it is you who uphold my lot."
    - "6 My boundaries enclose a pleasant land; *\n  indeed, I have a goodly heritage."
    - "7 I will bless the LORD who gives me counsel; *\n  my heart teaches me, night after night."
    - "8 I have set the LORD always before me; *\n  because he is at my right hand I shall not fall."
    - "9 My heart, therefore, is glad, and my spirit rejoices; *\n  my body also shall rest in hope."
    - "10 For you will not abandon me to the grave, *\n  nor let your holy one see the Pit."
    - "11 You will show me the path of life; *\n  in your presence there is fullness of joy,\n  and in your right hand are pleasures for evermore."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.16"
- type: "BcpPsalm"
  data:
    key: "psalm-17"
    number: 17
    name: "Psalm 17"
    latin: "Exaudi, Domine"
    verseCount: 16
    verses:
    - "1 Hear my plea of innocence, O LORD;\n  give heed to my cry; *\n  listen to my prayer, which does not come from lying lips."
    - "2 Let my vindication come forth from your presence; *\n  let your eyes be fixed on justice."
    - "3 Weigh my heart, summon me by night, *\n  melt me down; you will find no impurity in me."
    - "4 I give no offense with my mouth as others do; *\n  I have heeded the words of your lips."
    - "5 My footsteps hold fast to the ways of your law; *\n  in your paths my feet shall not stumble."
    - "6 I call upon you, O God, for you will answer me; *\n  incline your ear to me and hear my words."
    - "7 Show me your marvelous loving-kindness, *\n  O Savior of those who take refuge at your right hand\n  from those who rise up against them."
    - "8 Keep me as the apple of your eye; *\n  hide me under the shadow of your wings,"
    - "9 From the wicked who assault me, *\n  from my deadly enemies who surround me."
    - "10 They have closed their heart to pity, *\n  and their mouth speaks proud things."
    - "11 They press me hard,\n  now they surround me, *\n  watching how they may cast me to the ground,"
    - "12 Like a lion, greedy for its prey, *\n  and like a young lion lurking in secret places."
    - "13 Arise, O LORD; confront them and bring them down; *\n  deliver me from the wicked by your sword."
    - "14 Deliver me, O LORD, by your hand *\n  from those whose portion in life is this world;"
    - "15 Whose bellies you fill with your treasure, *\n  who are well supplied with children\n  and leave their wealth to their little ones."
    - "16 But at my vindication I shall see your face; *\n  when I awake, I shall be satisfied, beholding\n  your likeness."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.17"
- type: "BcpPsalm"
  data:
    key: "psalm-18"
    number: 18
    name: "Psalm 18"
    latin: ""
    verseCount: 50
    verses:
    - "1 I love you, O LORD my strength, *\n  O LORD my stronghold, my crag, and my haven."
    - "2 My God, my rock in whom I put my trust, *\n  my shield, the horn of my salvation, and my refuge;\n  you are worthy of praise."
    - "3 I will call upon the LORD, *\n  and so shall I be saved from my enemies."
    - "4 The breakers of death rolled over me, *\n  and the torrents of oblivion made me afraid."
    - "5 The cords of hell entangled me, *\n  and the snares of death were set for me."
    - "6 I called upon the LORD in my distress *\n  and cried out to my God for help."
    - "7 He heard my voice from his heavenly dwelling; *\n  my cry of anguish came to his ears."
    - "8 The earth reeled and rocked; *\n  the roots of the mountains shook;\n  they reeled because of his anger."
    - "9 Smoke rose from his nostrils\n  and a consuming fire out of his mouth; *\n  hot burning coals blazed forth from him."
    - "10 He parted the heavens and came down *\n  with a storm cloud under his feet."
    - "11 He mounted on cherubim and flew; *\n  he swooped on the wings of the wind."
    - "12 He wrapped darkness about him; *\n  he made dark waters and thick clouds his pavilion."
    - "13 From the brightness of his presence, through the clouds, *\n  burst hailstones and coals of fire."
    - "14 The LORD thundered out of heaven; *\n  the Most High uttered his voice."
    - "15 He loosed his arrows and scattered them; *\n  he hurled thunderbolts and routed them."
    - "16 The beds of the seas were uncovered,\n  and the foundations of the world laid bare, *\n  at your battle cry, O LORD,\n  at the blast of the breath of your nostrils."
    - "17 He reached down from on high and grasped me; *\n  he drew me out of great waters."
    - "18 He delivered me from my strong enemies\n  and from those who hated me; *\n  for they were too mighty for me."
    - "19 They confronted me in the day of my disaster; *\n  but the LORD was my support."
    - "20 He brought me out into an open place; *\n  he rescued me because he delighted in me."
    - "21 The LORD rewarded me because of my righteous dealing; *\n  because my hands were clean he rewarded me;"
    - "22 For I have kept the ways of the LORD *\n  and have not offended against my God;"
    - "23 For all his judgments are before my eyes, *\n  and his decrees I have not put away from me;"
    - "24 For I have been blameless with him *\n  and have kept myself from iniquity;"
    - "25 Therefore the LORD rewarded me according to my\n  righteous dealing, *\n  because of the cleanness of my hands in his sight."
    - "26 With the faithful you show yourself faithful, O God; *\n  with the forthright you show yourself forthright."
    - "27 With the pure you show yourself pure, *\n  but with the crooked you are wily."
    - "28 You will save a lowly people, *\n  but you will humble the haughty eyes."
    - "29 You, O LORD, are my lamp; *\n  my God, you make my darkness bright."
    - "30 With you I will break down an enclosure; *\n  with the help of my God I will scale any wall."
    - "31 As for God, his ways are perfect;\n  the words of the LORD are tried in the fire; *\n  he is a shield to all who trust in him."
    - "32 For who is God, but the LORD? *\n  who is the Rock, except our God?"
    - "33 It is God who girds me about with strength *\n  and makes my way secure."
    - "34 He makes me sure-footed like a deer *\n  and lets me stand firm on the heights."
    - "35 He trains my hands for battle *\n  and my arms for bending even a bow of bronze."
    - "36 You have given me your shield of victory; *\n  your right hand also sustains me;\n  your loving care makes me great."
    - "37 You lengthen my stride beneath me, *\n  and my ankles do not give way."
    - "38 I pursue my enemies and overtake them; *\n  I will not turn back till I have destroyed them."
    - "39 I strike them down, and they cannot rise; *\n  they fall defeated at my feet."
    - "40 You have girded me with strength for the battle; *\n  you have cast down my adversaries beneath me;\n  you have put my enemies to flight."
    - "41 I destroy those who hate me;\n  they cry out, but there is none to help them; *\n  they cry to the LORD, but he does not answer."
    - "42 I beat them small like dust before the wind; *\n  I trample them like mud in the streets."
    - "43 You deliver me from the strife of the peoples; *\n  you put me at the head of the nations."
    - "44 A people I have not known shall serve me;\n  no sooner shall they hear than they shall obey me; *\n  strangers will cringe before me."
    - "45 The foreign peoples will lose heart; *\n  they shall come trembling out of their strongholds."
    - "46 The LORD lives! Blessed is my Rock! *\n  Exalted is the God of my salvation!"
    - "47 He is the God who gave me victory *\n  and cast down the peoples beneath me."
    - "48 You rescued me from the fury of my enemies;\n  you exalted me above those who rose against me; *\n  you saved me from my deadly foe."
    - "49 Therefore will I extol you among the nations, O LORD, *\n  and sing praises to your Name."
    - "50 He multiplies the victories of his king; *\n  he shows loving-kindness to his anointed,\n  to David and his descendants for ever."
