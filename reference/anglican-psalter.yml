  data:
    key: "psalm-24"
    number: 24
    name: "Psalm 24"
    latin: "Domini est terra"
    verseCount: 10
    verses:
    - "1 The earth is the LORD'S and all that is in it, *\n  the world and all who dwell therein."
    - "2 For it is he who founded it upon the seas *\n  and made it firm upon the rivers of the deep."
    - "3 \"Who can ascend the hill of the LORD? *\n  and who can stand in his holy place?\""
    - "4 \"Those who have clean hands and a pure heart, *\n  who have not pledged themselves to falsehood,\n  nor sworn by what is a fraud."
    - "5 They shall receive a blessing from the LORD *\n  and a just reward from the God of their salvation.\""
    - "6 Such is the generation of those who seek him, *\n  of those who seek your face, O God of Jacob."
    - "7 Lift up your heads, O gates;\n  lift them high, O everlasting doors; *\n  and the King of glory shall come in."
    - "8 \"Who is this King of glory?\" *\n  \"The LORD, strong and mighty,\n  the LORD, mighty in battle.\""
    - "9 Lift up your heads, O gates;\n  lift them high, O everlasting doors; *\n  and the King of glory shall come in."
    - "10 \"Who is he, this King of glory?\" *\n  \"The LORD of hosts,\n  he is the King of glory.\""
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.24"
- type: "BcpPsalm"
  data:
    key: "psalm-25"
    number: 25
    name: "Psalm 25"
    latin: "Ad te, Domine, levavi"
    verseCount: 21
    verses:
    - "1 To you, O LORD, I lift up my soul;\n  my God, I put my trust in you; *\n  let me not be humiliated,\n  nor let my enemies triumph over me."
    - "2 Let none who look to you be put to shame; *\n  let the treacherous be disappointed in their schemes."
    - "3 Show me your ways, O LORD, *\n  and teach me your paths."
    - "4 Lead me in your truth and teach me, *\n  for you are the God of my salvation;\n  in you have I trusted all the day long."
    - "5 Remember, O LORD, your compassion and love, *\n  for they are from everlasting."
    - "6 Remember not the sins of my youth and my transgressions; *\n  remember me according to your love\n  and for the sake of your goodness, O LORD."
    - "7 Gracious and upright is the LORD; *\n  therefore he teaches sinners in his way."
    - "8 He guides the humble in doing right *\n  and teaches his way to the lowly."
    - "9 All the paths of the LORD are love and faithfulness *\n  to those who keep his covenant and his testimonies."
    - "10 For your Name's sake, O LORD, *\n  forgive my sin, for it is great."
    - "11 Who are they who fear the LORD? *\n  he will teach them the way that they should choose."
    - "12 They shall dwell in prosperity, *\n  and their offspring shall inherit the land."
    - "13 The LORD is a friend to those who fear him *\n  and will show them his covenant."
    - "14 My eyes are ever looking to the LORD, *\n  for he shall pluck my feet out of the net."
    - "15 Turn to me and have pity on me, *\n  for I am left alone and in misery."
    - "16 The sorrows of my heart have increased; *\n  bring me out of my troubles."
    - "17 Look upon my adversity and misery *\n  and forgive me all my sin."
    - "18 Look upon my enemies, for they are many, *\n  and they bear a violent hatred against me."
    - "19 Protect my life and deliver me; *\n  let me not be put to shame, for I have trusted in you."
    - "20 Let integrity and uprightness preserve me, *\n  for my hope has been in you."
    - "21 Deliver Israel, O God, *\n  out of all his troubles."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.25"
- type: "BcpPsalm"
  data:
    key: "psalm-26"
    number: 26
    name: "Psalm 26"
    latin: "Judica me, Domine"
    verseCount: 11
    verses:
    - "1 Give judgment for me, O LORD,\n  for I have lived with integrity; *\n  I have trusted in the Lord and have not faltered."
    - "2 Test me, O\n  LORD, and try me; *\n  examine my heart and my mind."
    - "3 For your love is before my eyes; *\n  I have walked faithfully with you."
    - "4 I have not sat with the worthless, *\n  nor do I consort with the deceitful."
    - "5 I have hated the company of evildoers; *\n  I will not sit down with the wicked."
    - "6 I will wash my hands in innocence, O LORD, *\n  that I may go in procession round your altar,"
    - "7 Singing aloud a song of thanksgiving *\n  and recounting all your wonderful deeds."
    - "8 LORD, I love the house in which you dwell *\n  and the place where your glory abides."
    - "10 Whose hands are full of evil plots, *\n  and their right hand full of bribes."
    - "11 As for me, I will live with integrity; *\n  redeem me, O LORD, and have pity on me."
    - "12 My foot stands on level ground; *\n  in the full assembly I will bless the LORD."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.26"
- type: "BcpPsalm"
  data:
    key: "psalm-27"
    number: 27
    name: "Psalm 27"
    latin: "Dominus illuminatio"
    verseCount: 18
    verses:
    - "1 The LORD is my light and my salvation;\n  whom then shall I fear? *\n  the LORD is the strength of my life;\n  of whom then shall I be afraid?"
    - "2 When evildoers came upon me to eat up my flesh, *\n  it was they, my foes and my adversaries, who\n  stumbled and fell."
    - "3 Though an army should encamp against me, *\n  yet my heart shall not be afraid;"
    - "4 And though war should rise up against me, *\n  yet will I put my trust in him."
    - "5 One thing have I asked of the LORD;\n  one thing I seek; *\n  that I may dwell in the house of the LORD all the days\n  of my life;"
    - "6 To behold the fair beauty of the LORD *\n  and to seek him in his temple."
    - "7 For in the day of trouble he shall keep me safe\n  in his shelter; *\n  he shall hide me in the secrecy of his dwelling\n  and set me high upon a rock."
    - "8 Even now he lifts up my head *\n  above my enemies round about me."
    - "9 Therefore I will offer in his dwelling an oblation\n  with sounds of great gladness; *\n  I will sing and make music to the LORD."
    - "10 Hearken to my voice, O LORD, when I call; *\n  have mercy on me and answer me."
    - "11 You speak in my heart and say, \"Seek my face.\" *\n  Your face, LORD, will I seek."
    - "12 Hide not your face from me, *\n  nor turn away your servant in displeasure."
    - "13 You have been my helper;\n  cast me not away; *\n  do not forsake me, O God of my salvation."
    - "14 Though my father and my mother forsake me, *\n  the LORD will sustain me."
    - "15 Show me your way, O LORD; *\n  lead me on a level path, because of my enemies."
    - "16 Deliver me not into the hand of my adversaries, *\n  for false witnesses have risen up against me,\n  and also those who speak malice."
    - "17 What if I had not believed\n  that I should see the goodness of the LORD *\n  in the land of the living!"
    - "18 O tarry and await the LORD'S pleasure;\n  be strong, and he shall comfort your heart; *\n  wait patiently for the LORD."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.27"
- type: "BcpPsalm"
  data:
    key: "psalm-28"
    number: 28
    name: "Psalm 28"
    latin: "Ad te, Domine"
    verseCount: 11
    verses:
    - "1 O LORD, I call to you;\n  my Rock, do not be deaf to my cry; *\n  lest, if you do not hear me,\n  I become like those who go down to the Pit."
    - "2 Hear the voice of my prayer when I cry out to you, *\n  when I lift up my hands to your holy of holies."
    - "3 Do not snatch me away with the wicked or with the\n  evildoers, *\n  who speak peaceably with their neighbors,\n  while strife is in their hearts."
    - "4 Repay them according to their deeds, *\n  and according to the wickedness of their actions."
    - "5 According to the work of their hands repay them, *\n  and give them their just deserts."
    - "6 They have no understanding of the LORD'S doings,\n  nor of the works of his hands; *\n  therefore he will break them down and not\n  build them up."
    - "7 Blessed is the LORD! *\n  for he has heard the voice of my prayer."
    - "8 The LORD is my strength and my shield; *\n  my heart trusts in him, and I have been helped;"
    - "9 Therefore my heart dances for joy, *\n  and in my song will I praise him."
    - "10 The LORD is the strength of his people, *\n  a safe refuge for his anointed."
    - "11 Save your people and bless your inheritance; *\n  shepherd them and carry them for ever."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.28"
- type: "BcpPsalm"
  data:
    key: "psalm-29"
    number: 29
    name: "Psalm 29"
    latin: "Afferte Domino"
    verseCount: 11
    verses:
    - "1 Ascribe to the LORD, you gods, *\n  ascribe to the LORD glory and strength."
    - "2 Ascribe to the LORD the glory due his Name; *\n  worship the LORD in the beauty of holiness."
    - "3 The voice of the LORD is upon the waters;\n  the God of glory thunders; *\n  the LORD is upon the mighty waters."
    - "4 The voice of the LORD is a powerful voice; *\n  the voice of the LORD is a voice of splendor."
    - "5 The voice of the LORD breaks the cedar trees; *\n  the LORD breaks the cedars of Lebanon;"
    - "6 He makes Lebanon skip like a calf, *\n  and Mount Hermon like a young wild ox."
    - "7 The voice of the LORD splits the flames of fire;\n  the voice of the LORD shakes the wilderness; *\n  the LORD shakes the wilderness of Kadesh."
    - "8 The voice of the LORD makes the oak trees writhe *\n  and strips the forests bare."
    - "9 And in the temple of the LORD *\n  all are crying, \"Glory!\""
    - "10 The LORD sits enthroned above the flood; *\n  the LORD sits enthroned as King for evermore."
    - "11 The LORD shall give strength to his people; *\n  the LORD shall give his people the blessing of peace."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.29"
- type: "BcpPsalm"
  data:
    key: "psalm-30"
    number: 30
    name: "Psalm 30"
    latin: "Exaltabo te, Domine"
    verseCount: 13
    verses:
    - "1 I will exalt you, O LORD,\n  because you have lifted me up *\n  and have not let my enemies triumph over me."
    - "2 O LORD my God, I cried out to you, *\n  and you restored me to health."
    - "3 You brought me up, O LORD, from the dead; *\n  you restored my life as I was going down to the grave."
    - "4 Sing to the LORD, you servants of his; *\n  give thanks for the remembrance of his holiness."
    - "5 For his wrath endures but the twinkling of an eye, *\n  his favor for a lifetime."
    - "6 Weeping may spend the night, *\n  but joy comes in the morning."
    - "7 While I felt secure, I said,\n  \"I shall never be disturbed. *\n  You, LORD, with your favor, made me as strong as\n  the mountains.\""
    - "8 Then you hid your face, *\n  and I was filled with fear."
    - "9 I cried to you, O LORD; *\n  I pleaded with the Lord, saying,"
    - "10 \"What profit is there in my blood, if I go down to the Pit? *\n  will the dust praise you or declare your faithfulness?"
    - "11 Hear, O LORD, and have mercy upon me; *\n  O LORD, be my helper.\""
    - "12 You have turned my wailing into dancing; *\n  you have put off my sack-cloth and clothed me with joy."
    - "13 Therefore my heart sings to you without ceasing; *\n  O LORD my God, I will give you thanks for ever."
