  data:
    key: "psalm-70"
    number: 70
    name: "Psalm 70"
    latin: "Deus, in adjutorium"
    verseCount: 6
    verses:
    - "1 Be pleased, O God, to deliver me; *\n  O LORD, make haste to help me."
    - "2 Let those who seek my life be ashamed\n  and altogether dismayed; *\n  let those who take pleasure in my misfortune\n  draw back and be disgraced."
    - "3 Let those who say to me \"Aha!\" and gloat over me turn back, *\n  because they are ashamed."
    - "4 Let all who seek you rejoice and be glad in you; *\n  let those who love your salvation say for ever,\n  \"Great is the LORD!\""
    - "5 But as for me, I am poor and needy; *\n  come to me speedily, O God."
    - "6 You are my helper and my deliverer; *\n  O LORD, do not tarry."
  relations:
