    to:
      type: "Passage"
      osis: "Ps.140"
- type: "BcpPsalm"
  data:
    key: "psalm-141"
    number: 141
    name: "Psalm 141"
    latin: "Domine, clamavi"
    verseCount: 10
    verses:
    - "1 O LORD, I call to you; come to me quickly; *\n  hear my voice when I cry to you."
    - "2 Let my prayer be set forth in your sight as incense, *\n  the lifting up of my hands as the evening sacrifice."
    - "3 Set a watch before my mouth, O LORD,\n  and guard the door of my lips; *\n  let not my heart incline to any evil thing."
    - "4 Let me not be occupied in wickedness with evildoers, *\n  nor eat of their choice foods."
    - "5 Let the righteous smite me in friendly rebuke;\n  let not the oil of the unrighteous anoint my head; *\n  for my prayer is continually against their wicked deeds."
    - "6 Let their rulers be overthrown in stony places, *\n  that they may know my words are true."
    - "7 As when a plowman turns over the earth in furrows, *\n  let their bones be scattered at the mouth of the grave."
    - "8 But my eyes are turned to you, Lord GOD; *\n  in you I take refuge;\n  do not strip me of my life."
    - "9 Protect me from the snare which they have laid for me *\n  and from the traps of the evildoers."
    - "10 Let the wicked fall into their own nets, *\n  while I myself escape."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.141"
- type: "BcpPsalm"
  data:
    key: "psalm-142"
    number: 142
    name: "Psalm 142"
    latin: "Voce mea ad Dominum"
    verseCount: 7
    verses:
    - "1 I cry to the LORD with my voice; *\n  to the LORD I make loud supplication."
    - "2 I pour out my complaint before him *\n  and tell him all my trouble."
    - "3 When my spirit languishes within me, you know my path; *\n  in the way wherein I walk they have hidden a trap for me."
    - "4 I look to my right hand and find no one who knows me; *\n  I have no place to flee to, and no one cares for me."
    - "5 I cry out to you, O LORD; *\n  I say, \"You are my refuge,\n  my portion in the land of the living.\""
    - "6 Listen to my cry for help, for I have been brought very low; *\n  save me from those who pursue me,\n  for they are too strong for me."
    - "7 Bring me out of prison, that I may give thanks to your Name; *\n  when you have dealt bountifully with me,\n  the righteous will gather around me."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.142"
- type: "BcpPsalm"
  data:
    key: "psalm-143"
    number: 143
    name: "Psalm 143"
    latin: "Domine, exaudi"
    verseCount: 12
    verses:
    - "1 LORD, hear my prayer,\n  and in your faithfulness heed my supplications; *\n  answer me in your righteousness."
    - "2 Enter not into judgment with your servant, *\n  for in your sight shall no one living be justified."
    - "3 For my enemy has sought my life;\n  he has crushed me to the ground; *\n  he has made me live in dark places like those who\n  are long dead."
    - "4 My spirit faints within me; *\n  my heart within me is desolate."
    - "5 I remember the time past;\n  I muse upon all your deeds; *\n  I consider the works of your hands."
    - "6 I spread out my hands to you; *\n  my soul gasps to you like a thirsty land."
    - "7 O LORD, make haste to answer me; my spirit fails me; *\n  do not hide your face from me\n  or I shall be like those who go down to the Pit."
    - "8 Let me hear of your loving-kindness in the morning,\n  for I put my trust in you; *\n  show me the road that I must walk,\n  for I lift up my soul to you."
    - "9 Deliver me from my enemies, O LORD, *\n  for I flee to you for refuge."
    - "10 Teach me to do what pleases you, for you are my God; *\n  let your good Spirit lead me on level ground."
    - "11 Revive me, O LORD, for your Name's sake; *\n  for your righteousness' sake, bring me out of trouble."
    - "12 Of your goodness, destroy my enemies\n  and bring all my foes to naught, *\n  for truly I am your servant."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.143"
- type: "BcpPsalm"
  data:
    key: "psalm-144"
    number: 144
    name: "Psalm 144"
    latin: "Benedictus Dominus"
    verseCount: 16
    verses:
    - "1 Blessed be the LORD my rock! *\n  who trains my hands to fight and my fingers to battle;"
    - "2 My help and my fortress, my stronghold and my deliverer, *\n  my shield in whom I trust,\n  who subdues the peoples under me."
    - "3 O LORD, what are we that you should care for us? *\n  mere mortals that you should think of us?"
    - "4 We are like a puff of wind; *\n  our days are like a passing shadow."
    - "5 Bow your heavens, O LORD, and come down; *\n  touch the mountains, and they shall smoke."
    - "6 Hurl the lightning and scatter them; *\n  shoot out your arrows and rout them."
    - "7 Stretch out your hand from on high; *\n  rescue me and deliver me from the great waters,\n  from the hand of foreign peoples,"
    - "8 Whose mouths speak deceitfully *\n  and whose right hand is raised in falsehood."
    - "9 O God, I will sing to you a new song; *\n  I will play to you on a ten-stringed lyre."
    - "10 You give victory to kings *\n  and have rescued David your servant."
    - "11 Rescue me from the hurtful sword *\n  and deliver me from the hand of foreign peoples,"
    - "12 Whose mouths speak deceitfully *\n  and whose right hand is raised in falsehood."
    - "13 May our sons be like plants well nurtured from their youth, *\n  and our daughters like sculptured corners of a palace."
    - "14 May our barns be filled to overflowing with all manner\n  of crops; *\n  may the flocks in our pastures increase by thousands\n  and tens of thousands;\n  may our cattle be fat and sleek."
    - "15 May there be no breaching of the walls, no going into exile, *\n  no wailing in the public squares."
    - "16 Happy are the people of whom this is so! *\n  happy are the people whose God is the LORD!"
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.144"
- type: "BcpPsalm"
  data:
    key: "psalm-145"
    number: 145
    name: "Psalm 145"
    latin: "Exaltabo te, Deus"
    verseCount: 22
    verses:
    - "1 I will exalt you, O God my King, *\n  and bless your Name for ever and ever."
    - "2 Every day will I bless you *\n  and praise your Name for ever and ever."
    - "3 Great is the LORD and greatly to be praised; *\n  there is no end to his greatness."
    - "4 One generation shall praise your works to another *\n  and shall declare your power."
    - "5 I will ponder the glorious splendor of your majesty *\n  and all your marvelous works."
    - "6 They shall speak of the might of your wondrous acts, *\n  and I will tell of your greatness."
    - "7 They shall publish the remembrance of your great goodness; *\n  they shall sing of your righteous deeds."
    - "8 The LORD is gracious and full of compassion, *\n  slow to anger and of great kindness."
    - "9 The LORD is loving to everyone *\n  and his compassion is over all his works."
    - "10 All your works praise you, O LORD, *\n  and your faithful servants bless you."
    - "11 They make known the glory of your kingdom *\n  and speak of your power;"
    - "12 That the peoples may know of your power *\n  and the glorious splendor of your kingdom."
    - "13 Your kingdom is an everlasting kingdom; *\n  your dominion endures throughout all ages."
    - "14 The LORD is faithful in all his words *\n  and merciful in all his deeds."
    - "15 The LORD upholds all those who fall; *\n  he lifts up those who are bowed down."
    - "16 The eyes of all wait upon you, O LORD, *\n  and you give them their food in due season."
    - "17 You open wide your hand *\n  and satisfy the needs of every living creature."
    - "18 The LORD is righteous in all his ways *\n  and loving in all his works."
    - "19 The LORD is near to those who call upon him, *\n  to all who call upon him faithfully."
    - "20 He fulfills the desire of those who fear him; *\n  he hears their cry and helps them."
    - "21 The LORD preserves all those who love him, *\n  but he destroys all the wicked."
    - "22 My mouth shall speak the praise of the LORD; *\n  let all flesh bless his holy Name for ever and ever."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.145"
- type: "BcpPsalm"
  data:
    key: "psalm-146"
    number: 146
    name: "Psalm 146"
    latin: "Lauda, anima mea"
    verseCount: 9
    verses:
    - "1 Hallelujah!\n  Praise the LORD, O my soul! *\n  I will praise the LORD as long as I live;\n  I will sing praises to my God while I have my being."
    - "2 Put not your trust in rulers, nor in any child of earth, *\n  for there is no help in them."
    - "3 When they breathe their last, they return to earth, *\n  and in that day their thoughts perish."
    - "4 Happy are they who have the God of Jacob for their help! *\n  whose hope is in the LORD their God;"
    - "5 Who made heaven and earth, the seas, and all that is in them; *\n  who keeps his promise for ever;"
    - "6 Who gives justice to those who are oppressed, *\n  and food to those who hunger."
    - "7 The LORD sets the prisoners free;\n  the LORD opens the eyes of the blind; *\n  the LORD lifts up those who are bowed down;"
    - "8 The LORD loves the righteous;\n  the LORD cares for the stranger; *\n  he sustains the orphan and widow,\n  but frustrates the way of the wicked."
    - "9 The LORD shall reign for ever, *\n  your God, O Zion, throughout all generations.\n  Hallelujah!"
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.146"
- type: "BcpPsalm"
  data:
    key: "psalm-147"
    number: 147
    name: "Psalm 147"
    latin: "Laudate Dominum"
    verseCount: 21
    verses:
    - "1 Hallelujah!\n  How good it is to sing praises to our God! *\n  how pleasant it is to honor him with praise!"
    - "2 The LORD rebuilds Jerusalem; *\n  he gathers the exiles of Israel."
    - "3 He heals the brokenhearted *\n  and binds up their wounds."
    - "4 He counts the number of the stars *\n  and calls them all by their names."
    - "5 Great is our LORD and mighty in power; *\n  there is no limit to his wisdom."
    - "6 The LORD lifts up the lowly, *\n  but casts the wicked to the ground."
    - "7 Sing to the LORD with thanksgiving; *\n  make music to our God upon the harp."
    - "8 He covers the heavens with clouds *\n  and prepares rain for the earth;"
    - "9 He makes grass to grow upon the mountains *\n  and green plants to serve mankind."
    - "10 He provides food for flocks and herds *\n  and for the young ravens when they cry."
    - "11 He is not impressed by the might of a horse; *\n  he has no pleasure in the strength of a man;"
    - "12 But the LORD has pleasure in those who fear him, *\n  in those who await his gracious favor."
    - "13 Worship the LORD, O Jerusalem; *\n  praise your God, O Zion;"
    - "14 For he has strengthened the bars of your gates; *\n  he has blessed your children within you."
    - "15 He has established peace on your borders; *\n  he satisfies you with the finest wheat."
    - "16 He sends out his command to the earth, *\n  and his word runs very swiftly."
    - "17 He gives snow like wool; *\n  he scatters hoarfrost like ashes."
    - "18 He scatters his hail like bread crumbs; *\n  who can stand against his cold?"
    - "19 He sends forth his word and melts them; *\n  he blows with his wind, and the waters flow."
    - "20 He declares his word to Jacob, *\n  his statutes and his judgments to Israel."
    - "21 He has not done so to any other nation; *\n  to them he has not revealed his judgments.\n  Hallelujah!"
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.147"
- type: "BcpPsalm"
  data:
    key: "psalm-148"
    number: 148
    name: "Psalm 148"
    latin: "Laudate Dominum"
    verseCount: 14
    verses:
    - "1 Hallelujah!\n  Praise the LORD from the heavens; *\n  praise him in the heights."
    - "2 Praise him, all you angels of his; *\n  praise him, all his host."
    - "3 Praise him, sun and moon; *\n  praise him, all you shining stars."
    - "4 Praise him, heaven of heavens, *\n  and you waters above the heavens."
    - "5 Let them praise the Name of the LORD; *\n  for he commanded, and they were created."
    - "6 He made them stand fast for ever and ever; *\n  he gave them a law which shall not pass away."
    - "7 Praise the LORD from the earth, *\n  you sea-monsters and all deeps;"
    - "8 Fire and hail, snow and fog, *\n  tempestuous wind, doing his will;"
    - "9 Mountains and all hills, *\n  fruit trees and all cedars;"
    - "10 Wild beasts and all cattle, *\n  creeping things and wingèd birds;"
    - "11 Kings of the earth and all peoples, *\n  princes and all rulers of the world;"
    - "12 Young men and maidens, *\n  old and young together."
    - "13 Let them praise the Name of the LORD, *\n  for his Name only is exalted,\n  his splendor is over earth and heaven."
    - "14 He has raised up strength for his people\nand praise for all his loyal servants, *\n  the children of Israel, a people who are near him.\n  Hallelujah!"
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.148"
- type: "BcpPsalm"
  data:
    key: "psalm-149"
    number: 149
    name: "Psalm 149"
    latin: "Cantate Domino"
    verseCount: 9
    verses:
    - "1 Hallelujah!\n  Sing to the LORD a new song; *\n  sing his praise in the congregation of the faithful."
    - "2 Let Israel rejoice in his Maker; *\n  let the children of Zion be joyful in their King."
    - "3 Let them praise his Name in the dance; *\n  let them sing praise to him with timbrel and harp."
    - "4 For the LORD takes pleasure in his people *\n  and adorns the poor with victory."
    - "5 Let the faithful rejoice in triumph; *\n  let them be joyful on their beds."
    - "6 Let the praises of God be in their throat *\n  and a two-edged sword in their hand;"
    - "7 To wreak vengeance on the nations *\n  and punishment on the peoples;"
    - "8 To bind their kings in chains *\n  and their nobles with links of iron;"
    - "9 To inflict on them the judgment decreed; *\n  this is glory for all his faithful people.\n  Hallelujah!"
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.149"
