  data:
    key: "psalm-23"
    number: 23
    name: "Psalm 23"
    latin: "Dominus regit me"
    verseCount: 6
    verses:
    - "1 The LORD is my shepherd; *\n  I shall not be in want."
    - "2 He makes me lie down in green pastures *\n  and leads me beside still waters."
    - "3 He revives my soul *\n  and guides me along right pathways for his Name's sake."
    - "4 Though I walk through the valley of the shadow of death,\n  I shall fear no evil; *\n  for you are with me;\n  your rod and your staff, they comfort me."
    - "5 You spread a table before me in the presence of those\n  who trouble me; *\n  you have anointed my head with oil,\n  and my cup is running over."
    - "6 Surely your goodness and mercy shall follow me all the days\n  of my life, *\n  and I will dwell in the house of the LORD for ever."
  relations:
