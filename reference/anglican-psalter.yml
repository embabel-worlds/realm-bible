  data:
    key: "psalm-97"
    number: 97
    name: "Psalm 97"
    latin: "Dominus regnavit"
    verseCount: 12
    verses:
    - "1 The LORD is King;\n  let the earth rejoice; *\n  let the multitude of the isles be glad."
    - "2 Clouds and darkness are round about him, *\n  righteousness and justice are the foundations of his throne."
    - "3 A fire goes before him *\n  and burns up his enemies on every side."
    - "4 His lightnings light up the world; *\n  the earth sees it and is afraid."
    - "5 The mountains melt like wax at the presence of the LORD, *\n  at the presence of the Lord of the whole earth."
    - "6 The heavens declare his righteousness, *\n  and all the peoples see his glory."
    - "7 Confounded be all who worship carved images\n  and delight in false gods! *\n  Bow down before him, all you gods."
    - "8 Zion hears and is glad, and the cities of Judah rejoice, *\n  because of your judgments, O LORD."
    - "9 For you are the LORD,\n  most high over all the earth; *\n  you are exalted far above all gods."
    - "10 The LORD loves those who hate evil; *\n  he preserves the lives of his saints\n  and delivers them from the hand of the wicked."
    - "11 Light has sprung up for the righteous, *\n  and joyful gladness for those who are truehearted."
    - "12 Rejoice in the LORD, you righteous, *\n  and give thanks to his holy Name."
