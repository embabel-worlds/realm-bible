  data:
    key: "psalm-81"
    number: 81
    name: "Psalm 81"
    latin: "Exultate Deo"
    verseCount: 16
    verses:
    - "1 Sing with joy to God our strength *\n  and raise a loud shout to the God of Jacob."
    - "2 Raise a song and sound the timbrel, *\n  the merry harp, and the lyre."
    - "3 Blow the ram's-horn at the new moon, *\n  and at the full moon, the day of our feast."
    - "4 For this is a statute for Israel, *\n  a law of the God of Jacob."
    - "5 He laid it as a solemn charge upon Joseph, *\n  when he came out of the land of Egypt."
    - "6 I heard an unfamiliar voice saying, *\n  \"I eased his shoulder from the burden;\n  his hands were set free from bearing the load.\""
    - "7 You called on me in trouble, and I saved you; *\n  I answered you from the secret place of thunder\n  and tested you at the waters of Meribah."
    - "8 Hear, O my people, and I will admonish you: *\n  O Israel, if you would but listen to me!"
    - "9 There shall be no strange god among you; *\n  you shall not worship a foreign god."
    - "10 I am the LORD your God,\n  who brought you out of the land of Egypt and said, *\n  \"Open your mouth wide, and I will fill it.\""
    - "11 And yet my people did not hear my voice, *\n  and Israel would not obey me."
    - "12 So I gave them over to the stubbornness of their hearts, *\n  to follow their own devices."
    - "13 Oh, that my people would listen to me! *\n  that Israel would walk in my ways!"
    - "14 I should soon subdue their enemies *\n  and turn my hand against their foes."
    - "15 Those who hate the LORD would cringe before him, *\n  and their punishment would last for ever."
    - "16 But Israel would I feed with the finest wheat *\n  and satisfy him with honey from the rock."
