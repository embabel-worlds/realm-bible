    to:
      type: "Passage"
      osis: "Ps.38"
- type: "BcpPsalm"
  data:
    key: "psalm-39"
    number: 39
    name: "Psalm 39"
    latin: "Dixi, Custodiam"
    verseCount: 15
    verses:
    - "1 I said, \"I will keep watch upon my ways, *\n  so that I do not offend with my tongue."
    - "2 I will put a muzzle on my mouth *\n  while the wicked are in my presence.\""
    - "3 So I held my tongue and said nothing; *\n  I refrained from rash words;\n  but my pain became unbearable."
    - "4 My heart was hot within me;\n  while I pondered, the fire burst into flame; *\n  I spoke out with my tongue:"
    - "5 LORD, let me know my end and the number of my days, *\n  so that I may know how short my life is."
    - "6 You have given me a mere handful of days,\n  and my lifetime is as nothing in your sight; *\n  truly, even those who stand erect are but a puff of wind."
    - "7 We walk about like a shadow,\n  and in vain we are in turmoil; *\n  we heap up riches and cannot tell who will gather them."
    - "8 And now, what is my hope? *\n  O Lord, my hope is in you."
    - "9 Deliver me from all my transgressions *\n  and do not make me the taunt of the fool."
    - "10 I fell silent and did not open my mouth, *\n  for surely it was you that did it."
    - "11 Take your affliction from me; *\n  I am worn down by the blows of your hand."
    - "12 With rebukes for sin you punish us;\n  like a moth you eat away all that is dear to us; *\n  truly, everyone is but a puff of wind."
    - "13 Hear my prayer, O LORD,\n  and give ear to my cry; *\n  hold not your peace at my tears."
    - "14 For I am but a sojourner with you, *\n  a wayfarer, as all my forebears were."
    - "15 Turn your gaze from me, that I may be glad again, *\n  before I go my way and am no more."
  relations:
