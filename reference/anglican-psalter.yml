  data:
    key: "psalm-89"
    number: 89
    name: "Psalm 89"
    latin: ""
    verseCount: 52
    verses:
    - "1 Your love, O LORD, for ever will I sing; *\n  from age to age my mouth will proclaim your faithfulness."
    - "2 For I am persuaded that your love is established for ever; *\n  you have set your faithfulness firmly in the heavens."
    - "3 \"I have made a covenant with my chosen one; *\n  I have sworn an oath to David my servant:"
    - "4 'I will establish your line for ever, *\n  and preserve your throne for all generations.'\""
    - "5 The heavens bear witness to your wonders, O LORD, *\n  and to your faithfulness in the assembly of the holy ones;"
    - "6 For who in the skies can be compared to the LORD? *\n  who is like the LORD among the gods?"
    - "7 God is much to be feared in the council of the holy ones, *\n  great and terrible to all those round about him."
    - "8 Who is like you, LORD God of hosts? *\n  O mighty LORD, your faithfulness is all around you."
    - "9 You rule the raging of the sea *\n  and still the surging of its waves."
    - "10 You have crushed Rahab of the deep with a deadly wound; *\n  you have scattered your enemies with your mighty arm."
    - "11 Yours are the heavens; the earth also is yours; *\n  you laid the foundations of the world and all that is in it."
    - "12 You have made the north and the south; *\n  Tabor and Hermon rejoice in your Name."
    - "13 You have a mighty arm; *\n  strong is your hand and high is your right hand."
    - "14 Righteousness and justice are the foundations of your throne; *\n  love and truth go before your face."
    - "15 Happy are the people who know the festal shout! *\n  they walk, O LORD, in the light of your presence."
    - "16 They rejoice daily in your Name; *\n  they are jubilant in your righteousness."
    - "17 For you are the glory of their strength, *\n  and by your favor our might is exalted."
    - "18 Truly, the LORD is our ruler; *\n  The Holy One of Israel is our King."
    - "19 You spoke once in a vision and said to your faithful people: *\n  \"I have set the crown upon a warrior\n  and have exalted one chosen out of the people."
    - "20 I have found David my servant; *\n  with my holy oil have I anointed him."
    - "21 My hand will hold him fast *\n  and my arm will make him strong."
    - "22 No enemy shall deceive him, *\n  nor any wicked man bring him down."
    - "23 I will crush his foes before him *\n  and strike down those who hate him."
    - "24 My faithfulness and love shall be with him, *\n  and he shall be victorious through my Name."
    - "25 I shall make his dominion extend *\n  from the Great Sea to the River."
    - "26 He will say to me, 'You are my Father, *\n  my God, and the rock of my salvation.'"
    - "27 I will make him my firstborn *\n  and higher than the kings of the earth."
    - "28 I will keep my love for him for ever, *\n  and my covenant will stand firm for him."
    - "29 I will establish his line for ever *\n  and his throne as the days of heaven.\""
    - "30 \"If his children forsake my law *\n  and do not walk according to my judgments;"
    - "31 If they break my statutes *\n  and do not keep my commandments;"
    - "32 I will punish their transgressions with a rod *\n  and their iniquities with the lash;"
    - "33 But I will not take my love from him, *\n  nor let my faithfulness prove false."
    - "34 I will not break my covenant, *\n  nor change what has gone out of my lips."
    - "35 Once for all I have sworn by my holiness: *\n  'I will not lie to David."
    - "36 His line shall endure for ever *\n  and his throne as the sun before me;"
    - "37 It shall stand fast for evermore like the moon, *\n  the abiding witness in the sky.'\""
    - "38 But you have cast off and rejected your anointed; *\n  you have become enraged at him."
    - "39 You have broken your covenant with your servant, *\n  defiled his crown, and hurled it to the ground."
    - "40 You have breached all his walls *\n  and laid his strongholds in ruins."
    - "41 All who pass by despoil him; *\n  he has become the scorn of his neighbors."
    - "42 You have exalted the right hand of his foes *\n  and made all his enemies rejoice."
    - "43 You have turned back the edge of his sword *\n  and have not sustained him in battle."
    - "44 You have put an end to his splendor *\n  and cast his throne to the ground."
    - "45 You have cut short the days of his youth *\n  and have covered him with shame."
    - "46 How long will you hide yourself, O LORD?\n  will you hide yourself for ever? *\n  how long will your anger burn like fire?"
    - "47 Remember, LORD, how short life is, *\n  how frail you have made all flesh."
    - "48 Who can live and not see death? *\n  who can save himself from the power of the grave?"
    - "49 Where, Lord, are your loving-kindnesses of old, *\n  which you promised David in your faithfulness?"
    - "50 Remember, Lord, how your servant is mocked, *\n  how I carry in my bosom the taunts of many peoples,"
    - "51 The taunts your enemies have hurled, O LORD, *\n  which they hurled at the heels of your anointed."
    - "52 Blessed be the LORD for evermore! *\n  Amen, I say, Amen."
