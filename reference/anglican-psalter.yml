- type: "BcpPsalm"
  data:
    key: "psalm-76"
    number: 76
    name: "Psalm 76"
    latin: "Notus in Judæa"
    verseCount: 12
    verses:
    - "1 In Judah is God known; *\n  his Name is great in Israel."
    - "2 At Salem is his tabernacle, *\n  and his dwelling is in Zion."
    - "3 There he broke the flashing arrows, *\n  the shield, the sword, and the weapons of battle."
    - "4 How glorious you are! *\n  more splendid than the everlasting mountains!"
    - "5 The strong of heart have been despoiled;\n  they sink into sleep; *\n  none of the warriors can lift a hand."
    - "6 At your rebuke, O God of Jacob, *\n  both horse and rider lie stunned."
    - "7 What terror you inspire! *\n  who can stand before you when you are angry?"
    - "8 From heaven you pronounced judgment; *\n  the earth was afraid and was still;"
    - "9 When God rose up to judgment *\n  and to save all the oppressed of the earth."
    - "10 Truly, wrathful Edom will give you thanks, *\n  and the remnant of Hamath will keep your feasts."
    - "11 Make a vow to the LORD your God and keep it; *\n  let all around him bring gifts to him who is worthy\n  to be feared."
    - "12 He breaks the spirit of princes, *\n  and strikes terror in the kings of the earth."
  relations:
