    number: 98
    name: "Psalm 98"
    latin: "Cantate Domino"
    verseCount: 10
    verses:
    - "1 Sing to the LORD a new song, *\n  for he has done marvelous things."
    - "2 With his right hand and his holy arm *\n  has he won for himself the victory."
    - "3 The LORD has made known his victory; *\n  his righteousness has he openly shown in\n  the sight of the nations."
    - "4 He remembers his mercy and faithfulness to\n  the house of Israel, *\n  and all the ends of the earth have seen the\n  victory of our God."
    - "5 Shout with joy to the LORD, all you lands; *\n  lift up your voice, rejoice, and sing."
    - "6 Sing to the LORD with the harp, *\n  with the harp and the voice of song."
    - "7 With trumpets and the sound of the horn *\n  shout with joy before the King, the LORD."
    - "8 Let the sea make a noise and all that is in it, *\n  the lands and those who dwell therein."
    - "9 Let the rivers clap their hands, *\n  and let the hills ring out with joy before the LORD,\n  when he comes to judge the earth."
    - "10 In righteousness shall he judge the world *\n  and the peoples with equity."
