    number: 100
    name: "Psalm 100"
    latin: "Jubilate Deo"
    verseCount: 4
    verses:
    - "1 Be joyful in the LORD, all you lands; *\n  serve the LORD with gladness\n  and come before his presence with a song."
    - "2 Know this: The LORD himself is God; *\n  he himself has made us, and we are his;\n  we are his people and the sheep of his pasture."
    - "3 Enter his gates with thanksgiving;\n  go into his courts with praise; *\n  give thanks to him and call upon his Name."
    - "4 For the LORD is good;\n  his mercy is everlasting; *\n  and his faithfulness endures from age to age."
  relations:
