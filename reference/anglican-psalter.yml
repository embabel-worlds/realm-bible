  data:
    key: "psalm-93"
    number: 93
    name: "Psalm 93"
    latin: "Dominus regnavit"
    verseCount: 6
    verses:
    - "1 The LORD is King;\n  he has put on splendid apparel; *\n  the LORD has put on his apparel\n  and girded himself with strength."
    - "2 He has made the whole world so sure *\n  that it cannot be moved;"
    - "3 Ever since the world began, your throne has been established; *\n  you are from everlasting."
    - "4 The waters have lifted up, O LORD,\n  the waters have lifted up their voice; *\n  the waters have lifted up their pounding waves."
    - "5 Mightier than the sound of many waters,\n  mightier than the breakers of the sea, *\n  mightier is the LORD who dwells on high."
    - "6 Your testimonies are very sure, *\n  and holiness adorns your house, O LORD,\n  for ever and for evermore."
