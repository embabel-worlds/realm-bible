  data:
    key: "psalm-96"
    number: 96
    name: "Psalm 96"
    latin: "Cantate Domino"
    verseCount: 13
    verses:
    - "1 Sing to the LORD a new song; *\n  sing to the LORD, all the whole earth."
    - "2 Sing to the LORD and bless his Name; *\n  proclaim the good news of his salvation from day to day."
    - "3 Declare his glory among the nations *\n  and his wonders among all peoples."
    - "4 For great is the LORD and greatly to be praised; *\n  he is more to be feared than all gods."
    - "5 As for all the gods of the nations, they are but idols; *\n  but it is the LORD who made the heavens."
    - "6 Oh, the majesty and magnificence of his presence! *\n  Oh, the power and the splendor of his sanctuary!"
    - "7 Ascribe to the LORD, you families of the peoples; *\n  ascribe to the LORD honor and power."
    - "8 Ascribe to the LORD the honor due his Name; *\n  bring offerings and come into his courts."
    - "9 Worship the LORD in the beauty of holiness; *\n  let the whole earth tremble before him."
    - "10 Tell it out among the nations: \"The LORD is King! *\n  he has made the world so firm that it cannot be moved;\n  he will judge the peoples with equity.\""
    - "11 Let the heavens rejoice, and let the earth be glad;\n  let the sea thunder and all that is in it; *\n  let the field be joyful and all that is therein."
    - "12 Then shall all the trees of the wood shout for joy\n  before the LORD when he comes, *\n  when he comes to judge the earth."
    - "13 He will judge the world with righteousness *\n  and the peoples with his truth."
