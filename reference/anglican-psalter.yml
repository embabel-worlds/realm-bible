  data:
    key: "psalm-150"
    number: 150
    name: "Psalm 150"
    latin: "Laudate Dominum"
    verseCount: 6
    verses:
    - "1 Hallelujah!\n  Praise God in his holy temple; *\n  praise him in the firmament of his power."
    - "2 Praise him for his mighty acts; *\n  praise him for his excellent greatness."
    - "3 Praise him with the blast of the ram's-horn; *\n  praise him with lyre and harp."
    - "4 Praise him with timbrel and dance; *\n  praise him with strings and pipe."
    - "5 Praise him with resounding cymbals; *\n  praise him with loud-clanging cymbals."
    - "6 Let everything that has breath *\n  praise the Lord.\n  Hallelujah!"
