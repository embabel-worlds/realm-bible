  data:
    key: "psalm-133"
    number: 133
    name: "Psalm 133"
    latin: "Ecce, quam bonum!"
    verseCount: 5
    verses:
    - "1 Oh, how good and pleasant it is, *\n  when brethren live together in unity!"
    - "2 It is like fine oil upon the head *\n  that runs down upon the beard,"
    - "3 Upon the beard of Aaron, *\n  and runs down upon the collar of his robe."
    - "4 It is like the dew of Hermon *\n  that falls upon the hills of Zion."
    - "5 For there the LORD has ordained the blessing: *\n  life for evermore."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.133"
