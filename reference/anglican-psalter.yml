- type: "BcpPsalm"
  data:
    key: "psalm-120"
    number: 120
    name: "Psalm 120"
    latin: "Ad Dominum"
    verseCount: 7
    verses:
    - "1 When I was in trouble, I called to the LORD; *\n  I called to the LORD, and he answered me."
    - "2 Deliver me, O LORD, from lying lips *\n  and from the deceitful tongue."
    - "3 What shall be done to you, and what more besides, *\n  O you deceitful tongue?"
    - "4 The sharpened arrows of a warrior, *\n  along with hot glowing coals."
    - "5 How hateful it is that I must lodge in Meshech *\n  and dwell among the tents of Kedar!"
    - "6 Too long have I had to live *\n  among the enemies of peace."
    - "7 I am on the side of peace, *\n  but when I speak of it, they are for war."
  relations:
