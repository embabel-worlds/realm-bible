      type: "Passage"
      osis: "Ps.101"
- type: "BcpPsalm"
  data:
    key: "psalm-102"
    number: 102
    name: "Psalm 102"
    latin: "Domine, exaudi"
    verseCount: 28
    verses:
    - "1 LORD, hear my prayer, and let my cry come before you; *\n  hide not your face from me in the day of my trouble."
    - "2 Incline your ear to me; *\n  when I call, make haste to answer me,"
    - "3 For my days drift away like smoke, *\n  and my bones are hot as burning coals."
    - "4 My heart is smitten like grass and withered, *\n  so that I forget to eat my bread."
    - "5 Because of the voice of my groaning *\n  I am but skin and bones."
    - "6 I have become like a vulture in the wilderness, *\n  like an owl among the ruins."
    - "7 I lie awake and groan; *\n  I am like a sparrow, lonely on a house-top."
    - "8 My enemies revile me all day long, *\n  and those who scoff at me have taken an oath against me."
    - "9 For I have eaten ashes for bread *\n  and mingled my drink with weeping."
    - "10 Because of your indignation and wrath *\n  you have lifted me up and thrown me away."
    - "11 My days pass away like a shadow, *\n  and I wither like the grass."
    - "12 But you, O LORD, endure for ever, *\n  and your Name from age to age."
    - "13 You will arise and have compassion on Zion,\n  for it is time to have mercy upon her; *\n  indeed, the appointed time has come."
    - "14 For your servants love her very rubble, *\n  and are moved to pity even for her dust."
    - "15 The nations shall fear your Name, O LORD, *\n  and all the kings of the earth your glory."
    - "16 For the LORD will build up Zion, *\n  and his glory will appear."
    - "17 He will look with favor on the prayer of the homeless; *\n  he will not despise their plea."
    - "18 Let this be written for a future generation, *\n  so that a people yet unborn may praise the LORD."
    - "19 For the LORD looked down from his holy place on high; *\n  from the heavens he beheld the earth;"
    - "20 That he might hear the groan of the captive *\n  and set free those condemned to die;"
    - "21 That they may declare in Zion the Name of the LORD, *\n  and his praise in Jerusalem;"
    - "22 When the peoples are gathered together, *\n  and the kingdoms also, to serve the LORD."
    - "23 He has brought down my strength before my time; *\n  he has shortened the number of my days;"
    - "24 And I said, \"O my God,\n  do not take me away in the midst of my days; *\n  your years endure throughout all generations."
    - "25 In the beginning, O LORD, you laid the foundations\n  of the earth, *\n  and the heavens are the work of your hands;"
    - "26 They shall perish, but you will endure;\n  they all shall wear out like a garment; *\n  as clothing you will change them,\n  and they shall be changed;"
    - "27 But you are always the same, *\n  and your years will never end."
    - "28 The children of your servants shall continue, *\n  and their offspring shall stand fast in your sight.\""
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.102"
- type: "BcpPsalm"
  data:
    key: "psalm-103"
    number: 103
    name: "Psalm 103"
    latin: "Benedic, anima mea"
    verseCount: 22
    verses:
    - "1 Bless the LORD, O my soul, *\n  and all that is within me, bless his holy Name."
    - "2 Bless the LORD, O my soul, *\n  and forget not all his benefits."
    - "3 He forgives all your sins *\n  and heals all your infirmities;"
    - "4 He redeems your life from the grave *\n  and crowns you with mercy and loving-kindness;"
    - "5 He satisfies you with good things, *\n  and your youth is renewed like an eagle's."
    - "6 The LORD executes righteousness *\n  and judgment for all who are oppressed."
    - "7 He made his ways known to Moses *\n  and his works to the children of Israel."
    - "8 The LORD is full of compassion and mercy, *\n  slow to anger and of great kindness."
    - "9 He will not always accuse us, *\n  nor will he keep his anger for ever."
    - "10 He has not dealt with us according to our sins, *\n  nor rewarded us according to our wickedness."
    - "11 For as the heavens are high above the earth, *\n  so is his mercy great upon those who fear him."
    - "12 As far as the east is from the west, *\n  so far has he removed our sins from us."
    - "13 As a father cares for his children, *\n  so does the LORD care for those who fear him."
    - "14 For he himself knows whereof we are made; *\n  he remembers that we are but dust."
    - "15 Our days are like the grass; *\n  we flourish like a flower of the field;"
    - "16 When the wind goes over it, it is gone, *\n  and its place shall know it no more."
    - "17 But the merciful goodness of the LORD endures for ever\n  on those who fear him, *\n  and his righteousness on children's children;"
    - "18 On those who keep his covenant *\n  and remember his commandments and do them."
    - "19 The LORD has set his throne in heaven, *\n  and his kingship has dominion over all."
    - "20 Bless the LORD, you angels of his,\n  you mighty ones who do his bidding, *\n  and hearken to the voice of his word."
    - "21 Bless the LORD, all you his hosts, *\n  you ministers of his who do his will."
    - "22 Bless the LORD, all you works of his,\n  in all places of his dominion; *\n  bless the LORD, O my soul."
