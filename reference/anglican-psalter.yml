  data:
    key: "psalm-36"
    number: 36
    name: "Psalm 36"
    latin: "Dixit injustus"
    verseCount: 12
    verses:
    - "1 There is a voice of rebellion deep in the heart of the wicked; *\n  there is no fear of God before his eyes."
    - "2 He flatters himself in his own eyes *\n  that his hateful sin will not be found out."
    - "3 The words of his mouth are wicked and deceitful; *\n  he has left off acting wisely and doing good."
    - "4 He thinks up wickedness upon his bed\n  and has set himself in no good way; *\n  he does not abhor that which is evil."
    - "5 Your love, O LORD, reaches to the heavens, *\n  and your faithfulness to the clouds."
    - "6 Your righteousness is like the strong mountains,\n  your justice like the great deep; *\n  you save both man and beast, O LORD."
    - "7 How priceless is your love, O God! *\n  your people take refuge under the\n  shadow of your wings."
    - "8 They feast upon the abundance of your house; *\n  you give them drink from the river of your delights."
    - "9 For with you is the well of life, *\n  and in your light we see light."
    - "10 Continue your loving-kindness to those who know you, *\n  and your favor to those who are true of heart."
    - "11 Let not the foot of the proud come near me, *\n  nor the hand of the wicked push me aside."
    - "12 See how they are fallen, those who work wickedness! *\n  they are cast down and shall not be able to rise."
