  data:
    key: "psalm-87"
    number: 87
    name: "Psalm 87"
    latin: "Fundamenta ejus"
    verseCount: 6
    verses:
    - "1 On the holy mountain stands the city he has founded; *\n  the LORD loves the gates of Zion\n  more than all the dwellings of Jacob."
    - "2 Glorious things are spoken of you, *\n  O city of our God."
    - "3 I count Egypt and Babylon among those who know me; *\n  behold Philistia, Tyre, and Ethiopia:\n  in Zion were they born."
    - "4 Of Zion it shall be said, \"Everyone was born in her, *\n  and the Most High himself shall sustain her.\""
    - "5 The LORD will record as he enrolls the peoples, *\n  \"These also were born there.\""
    - "6 The singers and the dancers will say, *\n  \"All my fresh springs are in you.\""
