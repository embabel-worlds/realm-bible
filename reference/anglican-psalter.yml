      type: "Passage"
      osis: "Ps.76"
- type: "BcpPsalm"
  data:
    key: "psalm-77"
    number: 77
    name: "Psalm 77"
    latin: "Voce mea ad Dominum"
    verseCount: 20
    verses:
    - "1 I will cry aloud to God; *\n  I will cry aloud, and he will hear me."
    - "2 In the day of my trouble I sought the Lord; *\n  my hands were stretched out by night and did not tire;\n  I refused to be comforted."
    - "3 I think of God, I am restless, *\n  I ponder, and my spirit faints."
    - "4 You will not let my eyelids close; *\n  I am troubled and I cannot speak."
    - "5 I consider the days of old; *\n  I remember the years long past;"
    - "6 I commune with my heart in the night; *\n  I ponder and search my mind."
    - "7 Will the Lord cast me off for ever? *\n  will he no more show his favor?"
    - "8 Has his loving-kindness come to an end for ever? *\n  has his promise failed for evermore?"
    - "9 Has God forgotten to be gracious? *\n  has he, in his anger, withheld his compassion?"
    - "10 And I said, \"My grief is this: *\n  the right hand of the Most High has lost its power.\""
    - "11 I will remember the works of the LORD, *\n  and call to mind your wonders of old time."
    - "12 I will meditate on all your acts *\n  and ponder your mighty deeds."
    - "13 Your way, O God, is holy; *\n  who is so great a god as our God?"
    - "14 You are the God who works wonders *\n  and have declared your power among the peoples."
    - "15 By your strength you have redeemed your people, *\n  the children of Jacob and Joseph."
    - "16 The waters saw you, O God;\n  the waters saw you and trembled; *\n  the very depths were shaken."
    - "17 The clouds poured out water;\n  the skies thundered; *\n  your arrows flashed to and fro;"
    - "18 The sound of your thunder was in the whirlwind;\n  your lightnings lit up the world; *\n  the earth trembled and shook."
    - "19 Your way was in the sea,\n  and your paths in the great waters, *\n  yet your footsteps were not seen."
    - "20 You led your people like a flock *\n  by the hand of Moses and Aaron."
  relations:
