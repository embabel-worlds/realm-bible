  data:
    key: "psalm-132"
    number: 132
    name: "Psalm 132"
    latin: "Memento, Domine"
    verseCount: 19
    verses:
    - "1 LORD, remember David, *\n  and all the hardships he endured;"
    - "2 How he swore an oath to the LORD *\n  and vowed a vow to the Mighty One of Jacob:"
    - "3 \"I will not come under\n  the roof of my house, *\n  nor climb up into my bed;"
    - "4 I will not allow my\n  eyes to sleep, *\n  nor let my eyelids slumber;"
    - "5 Until I find a place\n  for the LORD, *\n  a dwelling for the Mighty One of Jacob.\""
    - "6 \"The ark! We heard it\n  was in Ephratah; *\n  we found it in the fields of Jearim."
    - "7 Let us go to God's\n  dwelling place; *\n  let us fall upon our knees before his footstool.\""
    - "8 Arise, O LORD, into\n  your resting-place, *\n  you and the ark of your strength."
    - "9 Let your priests be\n  clothed with righteousness; *\n  let your faithful people sing with joy."
    - "10 For your servant\n  David's sake, *\n  do not turn away the face of your Anointed."
    - "11 The LORD has sworn an\n  oath to David; *\n  in truth, he will not break it:"
    - "12 \"A son, the fruit of\n  your body *\n  will I set upon your throne."
    - "13 If your children keep\n  my covenant\nand my testimonies that I shall teach them, *\n  their children will sit upon your throne for evermore.\""
    - "14 For the LORD has\n  chosen Zion; *\n  he has desired her for his habitation:"
    - "15 \"This shall be my\n  resting-place for ever; *\n  here will I dwell, for I delight in her."
    - "16 I will surely bless\n  her provisions, *\n  and satisfy her poor with bread."
    - "17 I will clothe her priests with salvation, *\n  and her faithful people will rejoice and sing."
    - "18 There will I make the horn of David flourish; *\n  I have prepared a lamp for my Anointed."
    - "19 As for his enemies, I will clothe them with shame; *\n  but as for him, his crown will shine.\""
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.132"
