  data:
    key: "psalm-82"
    number: 82
    name: "Psalm 82"
    latin: "Deus stetit"
    verseCount: 8
    verses:
    - "1 God takes his stand in the council of heaven; *\n  he gives judgment in the midst of the gods:"
    - "2 \"How long will you judge unjustly, *\n  and show favor to the wicked?"
    - "3 Save the weak and the orphan; *\n  defend the humble and needy;"
    - "4 Rescue the weak and the poor; *\n  deliver them from the power of the wicked."
    - "5 They do not know, neither do they understand;\n  they go about in darkness; *\n  all the foundations of the earth are shaken."
    - "6 Now I say to you, 'You are gods, *\n  and all of you children of the Most High;"
    - "7 Nevertheless, you shall die like mortals, *\n  and fall like any prince.'\""
    - "8 Arise, O God, and rule the earth, *\n  for you shall take all nations for your own."
