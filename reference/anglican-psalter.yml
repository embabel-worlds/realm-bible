    to:
      type: "Passage"
      osis: "Ps.121"
- type: "BcpPsalm"
  data:
    key: "psalm-122"
    number: 122
    name: "Psalm 122"
    latin: "Lætatus sum"
    verseCount: 9
    verses:
    - "1 I was glad when they said to me, *\n  \"Let us go to the house of the LORD.\""
    - "2 Now our feet are standing *\n  within your gates, O Jerusalem."
    - "3 Jerusalem is built as a city *\n  that is at unity with itself;"
    - "4 To which the tribes go up,\n  the tribes of the LORD, *\n  the assembly of Israel,\n  to praise the Name of the LORD."
    - "5 For there are the thrones of judgment, *\n  the thrones of the house of David."
    - "6 Pray for the peace of Jerusalem: *\n  \"May they prosper who love you."
    - "7 Peace be within your walls *\n  and quietness within your towers."
    - "8 For my brethren and companions' sake, *\n  I pray for your prosperity."
    - "9 Because of the house of the LORD our God, *\n  I will seek to do you good.\""
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.122"
- type: "BcpPsalm"
  data:
