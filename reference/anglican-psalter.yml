    to:
      type: "Passage"
      osis: "Ps.120"
- type: "BcpPsalm"
  data:
    key: "psalm-121"
    number: 121
    name: "Psalm 121"
    latin: "Levavi oculos"
    verseCount: 8
    verses:
    - "1 I lift up my eyes to the hills; *\n  from where is my help to come?"
    - "2 My help comes from the LORD, *\n  the maker of heaven and earth."
    - "3 He will not let your foot be moved *\n  and he who watches over you will not fall asleep."
    - "4 Behold, he who keeps watch over Israel *\n  shall neither slumber nor sleep;"
    - "5 The LORD himself watches over you; *\n  the LORD is your shade at your right hand,"
    - "6 So that the sun shall not strike you by day, *\n  nor the moon by night."
    - "7 The LORD shall preserve you from all evil; *\n  it is he who shall keep you safe."
    - "8 The LORD shall watch over your going out and\n  your coming in, *\n  from this time forth for evermore."
  relations:
