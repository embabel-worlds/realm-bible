- type: "BcpPsalm"
  data:
    key: "psalm-41"
    number: 41
    name: "Psalm 41"
    latin: "Beatus qui intelligit"
    verseCount: 13
    verses:
    - "1 Happy are they who consider the poor and needy! *\n  the LORD will deliver them in the time of trouble."
    - "2 The LORD preserves them and keeps them alive,\n  so that they may be happy in the land; *\n  he does not hand them over to the will of their enemies."
    - "3 The LORD sustains them on their sickbed *\n  and ministers to them in their illness."
    - "4 I said, \"LORD, be merciful to me; *\n  heal me, for I have sinned against you.\""
    - "5 My enemies are saying wicked things about me: *\n  When will he die, and his name perish?\""
    - "6 Even if they come to see me, they speak empty words; *\n  their heart collects false rumors;\n  they go outside and spread them."
    - "7 All my enemies whisper together about me *\n  and devise evil against me."
    - "8 \"A deadly thing,\" they say, \"has fastened on him; *\n  he has taken to his bed and will never get up again.\""
    - "9 Even my best friend, whom I trusted,\n  who broke bread with me, *\n  has lifted up his heel and turned against me."
    - "10 But you, O LORD, be merciful to me and raise me up, *\n  and I shall repay them."
    - "11 By this I know you are pleased with me, *\n  that my enemy does not triumph over me."
    - "12 In my integrity you hold me fast, *\n  and shall set me before your face for ever."
    - "13 Blessed be the LORD God of Israel, *\n  from age to age. Amen. Amen."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.41"
- type: "BcpPsalm"
  data:
    key: "psalm-42"
    number: 42
    name: "Psalm 42"
    latin: "Quemadmodum"
    verseCount: 15
    verses:
    - "1 As the deer longs for the water-brooks, *\n  so longs my soul for you, O God."
    - "2 My soul is athirst for God, athirst for the living God; *\n  when shall I come to appear before the presence of God?"
    - "3 My tears have been my food day and night, *\n  while all day long they say to me,\n  \"Where now is your God?\""
    - "4 I pour out my soul when I think on these things; *\n  how I went with the multitude and led them into the\n  house of God,"
    - "5 With the voice of praise and thanksgiving, *\n  among those who keep holy-day."
    - "6 Why are you so full of heaviness, O my soul? *\n  and why are you so disquieted within me?"
    - "7 Put your trust in God; *\n  for I will yet give thanks to him,\n  who is the help of my countenance, and my God."
    - "8 My soul is heavy within me; *\n  therefore I will remember you from the land of Jordan,\n  and from the peak of Mizar among the heights of Hermon."
    - "9 One deep calls to another in the noise of your cataracts; *\n  all your rapids and floods have gone over me."
    - "10 The LORD grants his loving-kindness in the daytime; *\n  in the night season his song is with me,\n  a prayer to the God of my life."
    - "11 I will say to the God of my strength,\n  \"Why have you forgotten me? *\n  and why do I go so heavily while the enemy\n  oppresses me?\""
    - "12 While my bones are being broken, *\n  my enemies mock me to my face;"
    - "13 All day long they mock me *\n  and say to me, \"Where now is your God?\""
    - "14 Why are you so full of heaviness, O my soul? *\n  and why are you so disquieted within me?"
    - "15 Put your trust in God; *\n  for I will yet give thanks to him,\n  who is the help of my countenance, and my God."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.42"
- type: "BcpPsalm"
  data:
    key: "psalm-43"
    number: 43
    name: "Psalm 43"
    latin: "Judica me, Deus"
    verseCount: 6
    verses:
    - "1 Give judgment for me, O God,\n  and defend my cause against an ungodly people; *\n  deliver me from the deceitful and the wicked."
    - "2 For you are the God of my strength;\n  why have you put me from you? *\n  and why do I go so heavily while the enemy\n  oppresses me?"
    - "3 Send out your light and your truth, that they may lead me, *\n  and bring me to your holy hill\n  and to your dwelling;"
    - "4 That I may go to the altar of God,\n  to the God of my joy and gladness; *\n  and on the harp I will give thanks to you, O God my God."
    - "5 Why are you so full of heaviness, O my soul? *\n  and why are you so disquieted within me?"
    - "6 Put your trust in God; *\n  for I will yet give thanks to him,\n  who is the help of my countenance, and my God."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.43"
- type: "BcpPsalm"
  data:
    key: "psalm-44"
    number: 44
    name: "Psalm 44"
    latin: "Deus, auribus"
    verseCount: 26
    verses:
    - "1 We have heard with our ears, O God,\n  our forefathers have told us, *\n  the deeds you did in their days,\n  in the days of old."
    - "2 How with your hand you drove the peoples out\n  and planted our forefathers in the land; *\n  how you destroyed nations and made your people flourish."
    - "3 For they did not take the land by their sword,\n  nor did their arm win the victory for them; *\n  but your right hand, your arm, and the\n  light of your countenance,\n  because you favored them."
    - "4 You are my King and my God; *\n  you command victories for Jacob."
    - "5 Through you we pushed back our adversaries; *\n  through your Name we trampled on those who\n  rose up against us."
    - "6 For I do not rely on my bow, *\n  and my sword does not give me the victory."
    - "7 Surely, you gave us victory over our adversaries *\n  and put those who hate us to shame."
    - "8 Every day we gloried in God, *\n  and we will praise your Name for ever."
    - "9 Nevertheless, you have rejected and humbled us *\n  and do not go forth with our armies."
    - "10 You have made us fall back before our adversary, *\n  and our enemies have plundered us."
    - "11 You have made us like sheep to be eaten *\n  and have scattered us among the nations."
    - "12 You are selling your people for a trifle *\n  and are making no profit on the sale of them."
    - "13 You have made us the scorn of our neighbors, *\n  a mockery and derision to those around us."
    - "14 You have made us a byword among the nations, *\n  a laughing-stock among the peoples."
    - "15 My humiliation is daily before me, *\n  and shame has covered my face;"
    - "16 Because of the taunts of the mockers and blasphemers, *\n  because of the enemy and avenger."
    - "17 All this has come upon us; *\n  yet we have not forgotten you,\n  nor have we betrayed your covenant."
    - "18 Our heart never turned back, *\n  nor did our footsteps stray from your path;"
    - "19 Though you thrust us down into a place of misery, *\n  and covered us over with deep darkness."
    - "20 If we have forgotten the Name of our God, *\n  or stretched out our hands to some strange god,"
    - "21 Will not God find it out? *\n  for he knows the secrets of the heart."
    - "22 Indeed, for your sake we are killed all the day long; *\n  we are accounted as sheep for the slaughter."
    - "23 Awake, O Lord! why are you sleeping? *\n  Arise! do not reject us for ever."
    - "24 Why have you hidden your face *\n  and forgotten our affliction and oppression?"
    - "25 We sink down into the dust; *\n  our body cleaves to the ground."
    - "26 Rise up, and help us, *\n  and save us, for the sake of your steadfast love."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.44"
- type: "BcpPsalm"
  data:
    key: "psalm-45"
    number: 45
    name: "Psalm 45"
    latin: "Eructavit cor meum"
    verseCount: 18
    verses:
    - "1 My heart is stirring with a noble song;\n  let me recite what I have fashioned for the king; *\n  my tongue shall be the pen of a skilled writer."
    - "2 You are the fairest of men; *\n  grace flows from your lips,\n  because God has blessed you for ever."
    - "3 Strap your sword upon your thigh, O mighty warrior, *\n  in your pride and in your majesty."
    - "4 Ride out and conquer in the cause of truth *\n  and for the sake of justice."
    - "5 Your right hand will show you marvelous things; *\n  your arrows are very sharp, O mighty warrior."
    - "6 The peoples are falling at your feet, *\n  and the king's enemies are losing heart."
    - "7 Your throne, O God, endures for ever and ever, *\n  a scepter of righteousness is the scepter of your kingdom;\n  you love righteousness and hate iniquity."
    - "8 Therefore God, your God, has anointed you *\n  with the oil of gladness above your fellows."
    - "9 All your garments are fragrant with myrrh, aloes, and cassia, *\n  and the music of strings from ivory palaces makes you glad."
    - "10 Kings' daughters stand among the ladies of the court; *\n  on your right hand is the queen,\n  adorned with the gold of Ophir."
    - "11 \"Hear, O daughter; consider and listen closely; *\n  forget your people and your father's house."
    - "12 The king will have pleasure in your beauty; *\n  he is your master; therefore do him honor."
    - "13 The people of Tyre are here with a gift; *\n  the rich among the people seek your favor.\""
    - "14 All glorious is the princess as she enters; *\n  her gown is cloth-of-gold."
    - "15 In embroidered apparel she is brought to the king; *\n  after her the bridesmaids follow in procession."
    - "16 With joy and gladness they are brought, *\n  and enter into the palace of the king."
    - "17 \"In place of fathers, O king, you shall have sons; *\n  you shall make them princes over all the earth."
    - "18 I will make your name to be remembered\n  from one generation to another; *\n  therefore nations will praise you for ever and ever.\""
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.45"
- type: "BcpPsalm"
  data:
    key: "psalm-46"
    number: 46
    name: "Psalm 46"
    latin: "Deus noster refugium"
    verseCount: 12
    verses:
    - "1 God is our refuge and strength, *\n  a very present help in trouble."
    - "2 Therefore we will not fear, though the earth be moved, *\n  and though the mountains be toppled into the\n  depths of the sea;"
    - "3 Though its waters rage and foam, *\n  and though the mountains tremble at its tumult."
    - "4 The LORD of hosts is with us; *\n  the God of Jacob is our stronghold."
    - "5 There is a river whose streams make glad the city of God, *\n  the holy habitation of the Most High."
    - "6 God is in the midst of her;\n  she shall not be overthrown; *\n  God shall help her at the break of day."
    - "7 The nations make much ado, and the kingdoms are shaken; *\n  God has spoken, and the earth shall melt away."
    - "8 The LORD of hosts is with us; *\n  the God of Jacob is our stronghold."
    - "9 Come now and look upon the works of the LORD, *\n  what awesome things he has done on earth."
    - "10 It is he who makes war to cease in all the world; *\n  he breaks the bow, and shatters the spear,\n  and burns the shields with fire."
    - "11 \"Be still, then, and know that I am God; *\n  I will be exalted among the nations;\n  I will be exalted in the earth.\""
    - "12 The LORD of hosts is with us; *\n  the God of Jacob is our stronghold."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.46"
- type: "BcpPsalm"
  data:
    key: "psalm-47"
    number: 47
    name: "Psalm 47"
    latin: "Omnes gentes, plaudite"
    verseCount: 10
    verses:
    - "1 Clap your hands, all you peoples; *\n  shout to God with a cry of joy."
    - "2 For the LORD Most High is to be feared; *\n  he is the great King over all the earth."
    - "3 He subdues the peoples under us, *\n  and the nations under our feet."
    - "4 He chooses our inheritance for us, *\n  the pride of Jacob whom he loves."
    - "5 God has gone up with a shout, *\n  the LORD with the sound of the ram's-horn."
    - "6 Sing praises to God, sing praises; *\n  sing praises to our King, sing praises."
    - "7 For God is King of all the earth; *\n  sing praises with all your skill."
    - "8 God reigns over the nations; *\n  God sits upon his holy throne."
    - "9 The nobles of the peoples have gathered together *\n  with the people of the God of Abraham."
    - "10 The rulers of the earth belong to God, *\n  and he is highly exalted."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.47"
- type: "BcpPsalm"
  data:
    key: "psalm-48"
    number: 48
    name: "Psalm 48"
    latin: "Magnus Dominus"
    verseCount: 13
    verses:
    - "1 Great is the LORD, and highly to be praised; *\n  in the city of our God is his holy hill."
    - "2 Beautiful and lofty, the joy of all the earth, is the\n  hill of Zion, *\n  the very center of the world and the city of the great King."
    - "3 God is in her citadels; *\n  he is known to be her sure refuge."
    - "4 Behold, the kings of the earth assembled *\n  and marched forward together."
    - "5 They looked and were astounded; *\n  they retreated and fled in terror."
    - "6 Trembling seized them there; *\n  they writhed like a woman in childbirth,\n  like ships of the sea when the east wind shatters them."
    - "7 As we have heard, so have we seen,\n  in the city of the LORD of hosts, in the city of our God; *\n  God has established her for ever."
    - "8 We have waited in silence on your loving-kindness, O God, *\n  in the midst of your temple."
    - "9 Your praise, like your Name, O God, reaches to\n  the world's end; *\n  your right hand is full of justice."
    - "10 Let Mount Zion be glad\n  and the cities of Judah rejoice, *\n  because of your judgments."
    - "11 Make the circuit of Zion;\n  walk round about her; *\n  count the number of her towers."
    - "12 Consider well her bulwarks;\n  examine her strongholds; *\n  that you may tell those who come after."
    - "13 This God is our God for ever and ever; *\n  he shall be our guide for evermore."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.48"
- type: "BcpPsalm"
  data:
    key: "psalm-49"
    number: 49
    name: "Psalm 49"
    latin: "Audite hæc, omnes"
    verseCount: 20
    verses:
    - "1 Hear this, all you peoples;\n  hearken, all you who dwell in the world, *\n  you of high degree and low, rich and poor together."
    - "2 My mouth shall speak of wisdom, *\n  and my heart shall meditate on understanding."
    - "3 I will incline my ear to a proverb *\n  and set forth my riddle upon the harp."
    - "4 Why should I be afraid in evil days, *\n  when the wickedness of those at my heels surrounds me,"
    - "5 The wickedness of those who put their trust in their goods, *\n  and boast of their great riches?"
    - "6 We can never ransom ourselves, *\n  or deliver to God the price of our life;"
    - "7 For the ransom of our life is so great, *\n  that we should never have enough to pay it,"
    - "8 In order to live for ever and ever, *\n  and never see the grave."
    - "9 For we see that the wise die also;\n  like the dull and stupid they perish *\n  and leave their wealth to those who come after them."
    - "10 Their graves shall be their homes for ever,\n  their dwelling places from generation to generation, *\n  though they call the lands after their own names."
    - "11 Even though honored, they cannot live for ever; *\n  they are like the beasts that perish."
    - "12 Such is the way of those who foolishly trust in themselves, *\n  and the end of those who delight in their own words."
    - "13 Like a flock of sheep they are destined to die;\n  Death is their shepherd; *\n  they go down straightway to the grave."
    - "14 Their form shall waste away, *\n  and the land of the dead shall be their home."
    - "15 But God will ransom my life; *\n  he will snatch me from the grasp of death."
    - "16 Do not be envious when some become rich, *\n  or when the grandeur of their house increases;"
    - "17 For they will carry nothing away at their death, *\n  nor will their grandeur follow them."
    - "18 Though they thought highly of themselves while they lived, *\n  and were praised for their success,"
    - "19 They shall join the company of their forebears, *\n  who will never see the light again."
    - "20 Those who are honored, but have no understanding, *\n  are like the beasts that perish."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.49"
- type: "BcpPsalm"
  data:
    key: "psalm-50"
    number: 50
    name: "Psalm 50"
    latin: "Deus deorum"
    verseCount: 24
    verses:
    - "1 The LORD, the God of gods, has spoken; *\n  he has called the earth from the rising of the sun to\n  its setting."
    - "2 Out of Zion, perfect in its beauty, *\n  God reveals himself in glory."
    - "3 Our God will come and will not keep silence; *\n  before him there is a consuming flame,\n  and round about him a raging storm."
    - "4 He calls the heavens and the earth from above *\n  to witness the judgment of his people."
    - "5 \"Gather before me my loyal followers, *\n  those who have made a covenant with me\n  and sealed it with sacrifice.\""
    - "6 Let the heavens declare the rightness of his cause; *\n  for God himself is judge."
    - "7 Hear, O my people, and I will speak:\n  \"O Israel, I will bear witness against you; *\n  for I am God, your God."
    - "8 I do not accuse you because of your sacrifices; *\n  your offerings are always before me."
    - "9 I will take no bull-calf from your stalls, *\n  nor he-goats out of your pens;"
    - "10 For all the beasts of the forest are mine, *\n  the herds in their thousands upon the hills."
    - "11 I know every bird in the sky, *\n  and the creatures of the fields are in my sight."
    - "12 If I were hungry, I would not tell you, *\n  for the whole world is mine and all that is in it."
    - "13 Do you think I eat the flesh of bulls, *\n  or drink the blood of goats?"
    - "14 Offer to God a sacrifice of thanksgiving *\n  and make good your vows to the Most High."
    - "15 Call upon me in the day of trouble; *\n  I will deliver you, and you shall honor me.\""
    - "16 But to the wicked God says: *\n  Why do you recite my statutes,\n  and take my covenant upon your lips;"
    - "17 Since you refuse discipline, *\n  and toss my words behind your back?"
    - "18 When you see a thief, you make him your friend, *\n  and you cast in your lot with adulterers."
    - "19 You have loosed your lips for evil, *\n  and harnessed your tongue to a lie."
    - "20 You are always speaking evil of your brother *\n  and slandering your own mother's son."
    - "21 These things you have done, and I kept still, *\n  and you thought that I am like you.\""
    - "22 \"I have made my accusation; *\n  I have put my case in order before your eyes."
    - "23 Consider this well, you who forget God, *\n  lest I rend you and there be none to deliver you."
    - "24 Whoever offers me the sacrifice of thanksgiving\n  honors me; *\n  but to those who keep in my way will I show\n  the salvation of God.\""
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.50"
- type: "BcpPsalm"
  data:
    key: "psalm-51"
    number: 51
    name: "Psalm 51"
    latin: "Miserere mei, Deus"
    verseCount: 20
    verses:
    - "1 Have mercy on me, O God, according to your\n  loving-kindness; *\n  in your great compassion blot out my offenses."
    - "2 Wash me through and through from my wickedness *\n  and cleanse me from my sin."
    - "3 For I know my transgressions, *\n  and my sin is ever before me."
    - "4 Against you only have I sinned *\n  and done what is evil in your sight."
    - "5 And so you are justified when you speak *\n  and upright in your judgment."
    - "6 Indeed, I have been wicked from my birth, *\n  a sinner from my mother's womb."
    - "7 For behold, you look for truth deep within me, *\n  and will make me understand wisdom secretly."
    - "8 Purge me from my sin, and I shall be pure; *\n  wash me, and I shall be clean indeed."
    - "9 Make me hear of joy and gladness, *\n  that the body you have broken may rejoice."
    - "10 Hide your face from my sins *\n  and blot out all my iniquities."
    - "11 Create in me a clean heart, O God, *\n  and renew a right spirit within me."
    - "12 Cast me not away from your presence *\n  and take not your holy Spirit from me."
    - "13 Give me the joy of your saving help again *\n  and sustain me with your bountiful Spirit."
    - "14 I shall teach your ways to the wicked, *\n  and sinners shall return to you."
    - "15 Deliver me from death, O God, *\n  and my tongue shall sing of your righteousness,\n  O God of my salvation."
    - "16 Open my lips, O Lord, *\n  and my mouth shall proclaim your praise."
    - "17 Had you desired it, I would have offered sacrifice, *\n  but you take no delight in burnt-offerings."
    - "18 The sacrifice of God is a troubled spirit; *\n  a broken and contrite heart, O God, you will not despise."
    - "19 Be favorable and gracious to Zion, *\n  and rebuild the walls of Jerusalem."
    - "20 Then you will be pleased with the appointed sacrifices,\n  with burnt-offerings and oblations; *\n  then shall they offer young bullocks upon your altar."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.51"
- type: "BcpPsalm"
  data:
    key: "psalm-52"
    number: 52
    name: "Psalm 52"
    latin: "Quid gloriaris?"
    verseCount: 9
    verses:
    - "1 You tyrant, why do you boast of wickedness *\n  against the godly all day long?"
    - "2 You plot ruin;\n  your tongue is like a sharpened razor, *\n  O worker of deception."
    - "3 You love evil more than good *\n  and lying more than speaking the truth."
    - "4 You love all words that hurt, *\n  O you deceitful tongue."
    - "5 Oh, that God would demolish you utterly, *\n  topple you, and snatch you from your dwelling,\n  and root you out of the land of the living!"
    - "6 The righteous shall see and tremble, *\n  and they shall laugh at him, saying,"
    - "7 \"This is the one who did not take God for a refuge, *\n  but trusted in great wealth\n  and relied upon wickedness.\""
    - "8 But I am like a green olive tree in the house of God; *\n  I trust in the mercy of God for ever and ever."
    - "9 I will give you thanks for what you have done *\n  and declare the goodness of your Name in the presence\n  of the godly."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.52"
- type: "BcpPsalm"
  data:
    key: "psalm-53"
    number: 53
    name: "Psalm 53"
    latin: "Dixit insipiens"
    verseCount: 6
    verses:
    - "1 The fool has said in his heart, \"There is no God.\" *\n  All are corrupt and commit abominable acts;\n  there is none who does any good."
    - "2 God looks down from heaven upon us all, *\n  to see if there is any who is wise,\n  if there is one who seeks after God."
    - "3 Every one has proved faithless;\n  all alike have turned bad; *\n  there is none who does good; no, not one."
    - "4 Have they no knowledge, those evildoers *\n  who eat up my people like bread\n  and do not call upon God?"
    - "5 See how greatly they tremble,\n  such trembling as never was; *\n  for God has scattered the bones of the enemy;\n  they are put to shame, because God has rejected them."
    - "6 Oh, that Israel's deliverance would come out of Zion! *\n  when God restores the fortunes of his people\n  Jacob will rejoice and Israel be glad."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.53"
- type: "BcpPsalm"
  data:
    key: "psalm-54"
    number: 54
    name: "Psalm 54"
    latin: "Deus, in nomine"
    verseCount: 7
    verses:
    - "1 Save me, O God, by your Name; *\n  in your might, defend my cause."
    - "2 Hear my prayer, O God; *\n  give ear to the words of my mouth."
    - "3 For the arrogant have risen up against me,\n  and the ruthless have sought my life, *\n  those who have no regard for God."
    - "4 Behold, God is my helper; *\n  it is the Lord who sustains my life."
    - "5 Render evil to those who spy on me; *\n  in your faithfulness, destroy them."
    - "6 I will offer you a freewill sacrifice *\n  and praise your Name, O LORD, for it is good."
    - "7 For you have rescued me from every trouble, *\n  and my eye has seen the ruin of my foes."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.54"
- type: "BcpPsalm"
  data:
    key: "psalm-55"
    number: 55
    name: "Psalm 55"
    latin: "Exaudi, Deus"
    verseCount: 26
    verses:
    - "1 Hear my prayer, O God; *\n  do not hide yourself from my petition."
    - "2 Listen to me and answer me; *\n  I have no peace, because of my cares."
    - "3 I am shaken by the noise of the enemy *\n  and by the pressure of the wicked;"
    - "4 For they have cast an evil spell upon me *\n  and are set against me in fury."
    - "5 My heart quakes within me, *\n  and the terrors of death have fallen upon me."
    - "6 Fear and trembling have come over me, *\n  and horror overwhelms me."
    - "7 And I said, \"Oh, that I had wings like a dove! *\n  I would fly away and be at rest."
    - "8 I would flee to a far-off place *\n  and make my lodging in the wilderness."
    - "9 I would hasten to escape *\n  from the stormy wind and tempest.\""
    - "10 Swallow them up, O Lord;\n  confound their speech; *\n  for I have seen violence and strife in the city."
    - "11 Day and night the watchmen make their rounds\n  upon her walls, *\n  but trouble and misery are in the midst of her."
    - "12 There is corruption at her heart; *\n  her streets are never free of oppression and deceit."
    - "13 For had it been an adversary who taunted me,\n  then I could have borne it; *\n  or had it been an enemy who vaunted himself against me,\n  then I could have hidden from him."
    - "14 But it was you, a man after my own heart, *\n  my companion, my own familiar friend."
    - "15 We took sweet counsel together, *\n  and walked with the throng in the house of God."
    - "16 Let death come upon them suddenly;\n  let them go down alive to the grave; *\n  for wickedness is in their dwellings, in their very midst."
    - "17 But I will call upon God, *\n  and the LORD will deliver me."
    - "18 In the evening, in the morning, and at noonday,\n  I will complain and lament, *\n  and he will hear my voice."
    - "19 He will bring me safely back from the battle\n  waged against me; *\n  for there are many who fight me."
    - "20 God, who is enthroned of old, will hear me and\n  bring them down; *\n  they never change; they do not fear God."
    - "21 My companion stretched forth his hand against his comrade; *\n  he has broken his covenant."
    - "22 His speech is softer than butter, *\n  but war is in his heart."
    - "23 His words are smoother than oil, *\n  but they are drawn swords."
    - "24 Cast your burden upon the LORD,\n  and he will sustain you; *\n  he will never let the righteous stumble."
    - "25 For you will bring the bloodthirsty and deceitful *\n  down to the pit of destruction, O God."
    - "26 They shall not live out half their days, *\n  but I will put my trust in you."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.55"
- type: "BcpPsalm"
  data:
    key: "psalm-56"
    number: 56
    name: "Psalm 56"
    latin: "Miserere mei, Deus"
    verseCount: 12
    verses:
    - "1 Have mercy on me, O God,\n  for my enemies are hounding me; *\n  all day long they assault and oppress me."
    - "2 They hound me all the day long; *\n  truly there are many who fight against me, O Most High."
    - "3 Whenever I am afraid, *\n  I will put my trust in you."
    - "4 In God, whose word I praise,\n  in God I trust and will not be afraid, *\n  for what can flesh do to me?"
    - "5 All day long they damage my cause; *\n  their only thought is to do me evil."
    - "6 They band together; they lie in wait; *\n  they spy upon my footsteps;\n  because they seek my life."
    - "7 Shall they escape despite their wickedness? *\n  O God, in your anger, cast down the peoples."
    - "8 You have noted my lamentation;\n  put my tears into your bottle; *\n  are they not recorded in your book?"
    - "9 Whenever I call upon you, my enemies will be put to flight; *\n  this I know, for God is on my side."
    - "10 In God the LORD, whose word I praise,\n  in God I trust and will not be afraid, *\n  for what can mortals do to me?"
    - "11 I am bound by the vow I made to you, O God; *\n  I will present to you thank-offerings;"
    - "12 For you have rescued my soul from death and my feet\n  from stumbling, *\n  that I may walk before God in the light of the living."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.56"
- type: "BcpPsalm"
  data:
    key: "psalm-57"
    number: 57
    name: "Psalm 57"
    latin: "Miserere mei, Deus"
    verseCount: 11
    verses:
    - "1 Be merciful to me, O God, be merciful,\n  for I have taken refuge in you; *\n  in the shadow of your wings will I take refuge\n  until this time of trouble has gone by."
    - "2 I will call upon the Most High God, *\n  the God who maintains my cause."
    - "3 He will send from heaven and save me;\n  he will confound those who trample upon me; *\n  God will send forth his love and his faithfulness."
    - "4 I lie in the midst of lions that devour the people; *\n  their teeth are spears and arrows,\n  their tongue a sharp sword."
    - "5 They have laid a net for my feet,\n  and I am bowed low; *\n  they have dug a pit before me,\n  but have fallen into it themselves."
    - "6 Exalt yourself above the heavens, O God, *\n  and your glory over all the earth."
    - "7 My heart is firmly fixed, O God, my heart is fixed; *\n  I will sing and make melody."
    - "8 Wake up, my spirit;\n  awake, lute and harp; *\n  I myself will waken the dawn."
    - "9 I will confess you among the peoples, O LORD; *\n  I will sing praise to you among the nations."
    - "10 For your loving-kindness is greater than the heavens, *\n  and your faithfulness reaches to the clouds."
    - "11 Exalt yourself above the heavens, O God, *\n  and your glory over all the earth."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.57"
- type: "BcpPsalm"
  data:
    key: "psalm-58"
    number: 58
    name: "Psalm 58"
    latin: "Si vere utique"
    verseCount: 11
    verses:
    - "1 Do you indeed decree righteousness, you rulers? *\n  do you judge the peoples with equity?"
    - "2 No; you devise evil in your hearts, *\n  and your hands deal out violence in the land."
    - "3 The wicked are perverse from the womb; *\n  liars go astray from their birth."
    - "4 They are as venomous as a serpent, *\n  they are like the deaf adder which stops its ears,"
    - "5 Which does not heed the voice of the charmer, *\n  no matter how skillful his charming."
    - "6 O God, break their teeth in their mouths; *\n  pull the fangs of the young lions, O LORD."
    - "7 Let them vanish like water that runs off; *\n  let them wither like trodden grass."
    - "8 Let them be like the snail that melts away, *\n  like a stillborn child that never sees the sun."
    - "9 Before they bear fruit, let them be cut down like a brier; *\n  like thorns and thistles let them be swept away."
    - "10 The righteous will be glad when they see the vengeance; *\n  they will bathe their feet in the blood of the wicked."
    - "11 And they will say,\n  \"Surely, there is a reward for the righteous; *\n  surely, there is a God who rules in the earth.\""
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.58"
- type: "BcpPsalm"
  data:
    key: "psalm-59"
    number: 59
    name: "Psalm 59"
    latin: "Eripe me de inimicis"
    verseCount: 20
    verses:
    - "1 Rescue me from my enemies, O God; *\n  protect me from those who rise up against me."
    - "2 Rescue me from evildoers *\n  and save me from those who thirst for my blood."
    - "3 See how they lie in wait for my life,\n  how the mighty gather together against me; *\n  not for any offense or fault of mine, O LORD."
    - "4 Not because of any guilt of mine *\n  they run and prepare themselves for battle."
    - "5 Rouse yourself, come to my side, and see; *\n  for you, LORD God of hosts, are Israel's God."
    - "6 Awake, and punish all the ungodly; *\n  show no mercy to those who are faithless and evil."
    - "7 They go to and fro in the evening; *\n  they snarl like dogs and run about the city."
    - "8 Behold, they boast with their mouths,\n  and taunts are on their lips; *\n  \"For who,\" they say, \"will hear us?\""
    - "9 But you, O LORD, you laugh at them; *\n  you laugh all the ungodly to scorn."
    - "10 My eyes are fixed on you, O my Strength; *\n  for you, O God, are my stronghold."
    - "11 My merciful God comes to meet me; *\n  God will let me look in triumph on my enemies."
    - "12 Slay them, O God, lest my people forget; *\n  send them reeling by your might\n  and put them down, O Lord our shield."
    - "13 For the sins of their mouths, for the words of their lips,\n  for the cursing and lies that they utter, *\n  let them be caught in their pride."
    - "14 Make an end of them in your wrath; *\n  make an end of them, and they shall be no more."
    - "15 Let everyone know that God rules in Jacob, *\n  and to the ends of the earth."
    - "16 They go to and fro in the evening; *\n  they snarl like dogs and run about the city."
    - "17 They forage for food, *\n  and if they are not filled, they howl."
    - "18 For my part, I will sing of your strength; *\n  I will celebrate your love in the morning;"
    - "19 For you have become my stronghold, *\n  a refuge in the day of my trouble."
    - "20 To you, O my Strength, will I sing; *\n  for you, O God, are my stronghold and my merciful God."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.59"
- type: "BcpPsalm"
  data:
    key: "psalm-60"
    number: 60
    name: "Psalm 60"
    latin: "Deus, repulisti nos"
    verseCount: 12
    verses:
    - "1 O God, you have cast us off and broken us; *\n  you have been angry;\n  oh, take us back to you again."
    - "2 You have shaken the earth and split it open; *\n  repair the cracks in it, for it totters."
    - "3 You have made your people know hardship; *\n  you have given us wine that makes us stagger."
    - "4 You have set up a banner for those who fear you, *\n  to be a refuge from the power of the bow."
    - "5 Save us by your right hand and answer us, *\n  that those who are dear to you may be delivered."
    - "6 God spoke from his holy place and said: *\n  \"I will exult and parcel out Shechem;\n  I will divide the valley of Succoth."
    - "7 Gilead is mine and Manasseh is mine; *\n  Ephraim is my helmet and Judah my scepter."
    - "8 Moab is my wash-basin,\n  on Edom I throw down my sandal to claim it, *\n  and over Philistia will I shout in triumph.\""
    - "9 Who will lead me into the strong city? *\n  who will bring me to Edom?"
    - "10 Have you not cast us off, O God? *\n  you no longer go out, O God, with our armies."
    - "11 Grant us your help against the enemy, *\n  for vain is the help of man."
    - "12 With God we will do valiant deeds, *\n  and he shall tread our enemies under foot."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.60"
- type: "BcpPsalm"
  data:
    key: "psalm-61"
    number: 61
    name: "Psalm 61"
    latin: "Exaudi, Deus"
    verseCount: 8
    verses:
    - "1 Hear my cry, O God, *\n  and listen to my prayer."
    - "2 I call upon you from the ends of the earth\n  with heaviness in my heart; *\n  set me upon the rock that is higher than I."
    - "3 For you have been my refuge, *\n  a strong tower against the enemy."
    - "4 I will dwell in your house for ever; *\n  I will take refuge under the cover of your wings."
    - "5 For you, O God, have heard my vows; *\n  you have granted me the heritage of those\n  who fear your Name."
    - "6 Add length of days to the king's life; *\n  let his years extend over many generations."
    - "7 Let him sit enthroned before God for ever; *\n  bid love and faithfulness watch over him."
    - "8 So will I always sing the praise of your Name, *\n  and day by day I will fulfill my vows."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.61"
- type: "BcpPsalm"
  data:
    key: "psalm-62"
    number: 62
    name: "Psalm 62"
    latin: "Nonne Deo?"
    verseCount: 14
    verses:
    - "1 For God alone my soul in silence waits; *\n  from him comes my salvation."
    - "2 He alone is my rock and my salvation, *\n  my stronghold, so that I shall not be greatly shaken."
    - "3 How long will you assail me to crush me,\n  all of you together, *\n  as if you were a leaning fence, a toppling wall?"
    - "4 They seek only to bring me down from my place of honor; *\n  lies are their chief delight."
    - "5 They bless with their lips, *\n  but in their hearts they curse."
    - "6 For God alone my soul in silence waits; *\n  truly, my hope is in him."
    - "7 He alone is my rock and my salvation, *\n  my stronghold, so that I shall not be shaken."
    - "8 In God is my safety and my honor; *\n  God is my strong rock and my refuge."
    - "9 Put your trust in him always, O people, *\n  pour out your hearts before him, for God is our refuge."
    - "10 Those of high degree are but a fleeting breath, *\n  even those of low estate cannot be trusted."
    - "11 On the scales they are lighter than a breath, *\n  all of them together."
    - "12 Put no trust in extortion;\n  in robbery take no empty pride; *\n  though wealth increase, set not your heart upon it."
    - "13 God has spoken once, twice have I heard it, *\n  that power belongs to God."
    - "14 Steadfast love is yours, O Lord, *\n  for you repay everyone according to his deeds."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.62"
- type: "BcpPsalm"
  data:
    key: "psalm-63"
    number: 63
    name: "Psalm 63"
    latin: "Deus, Deus meus"
    verseCount: 11
    verses:
    - "1 O God, you are my God; eagerly I seek you; *\n  my soul thirsts for you, my flesh faints for you,\n  as in a barren and dry land where there is no water."
    - "2 Therefore I have gazed upon you in your holy place, *\n  that I might behold your power and your glory."
    - "3 For your loving-kindness is better than life itself; *\n  my lips shall give you praise."
    - "4 So will I bless you as long as I live *\n  and lift up my hands in your Name."
    - "5 My soul is content, as with marrow and fatness, *\n  and my mouth praises you with joyful lips,"
    - "6 When I remember you upon my bed, *\n  and meditate on you in the night watches."
    - "7 For you have been my helper, *\n  and under the shadow of your wings I will rejoice."
    - "8 My soul clings to you; *\n  your right hand holds me fast."
    - "9 May those who seek my life to destroy it *\n  go down into the depths of the earth;"
    - "10 Let them fall upon the edge of the sword, *\n  and let them be food for jackals."
    - "11 But the king will rejoice in God;\n  all those who swear by him will be glad; *\n  for the mouth of those who speak lies shall be stopped."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.63"
- type: "BcpPsalm"
  data:
    key: "psalm-64"
    number: 64
    name: "Psalm 64"
    latin: "Exaudi, Deus"
    verseCount: 10
    verses:
    - "1 Hear my voice, O God, when I complain; *\n  protect my life from fear of the enemy."
    - "2 Hide me from the conspiracy of the wicked, *\n  from the mob of evildoers."
    - "3 They sharpen their tongue like a sword, *\n  and aim their bitter words like arrows,"
    - "4 That they may shoot down the blameless from ambush; *\n  they shoot without warning and are not afraid."
    - "5 They hold fast to their evil course; *\n  they plan how they may hide their snares."
    - "6 They say, \"Who will see us?\n  who will find out our crimes? *\n  we have thought out a perfect plot.\""
    - "7 The human mind and heart are a mystery; *\n  but God will loose an arrow at them,\n  and suddenly they will be wounded."
    - "8 He will make them trip over their tongues, *\n  and all who see them will shake their heads."
    - "9 Everyone will stand in awe and declare God's deeds; *\n  they will recognize his works."
    - "10 The righteous will rejoice in the LORD and put their trust in him, *\n  and all who are true of heart will glory."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.64"
- type: "BcpPsalm"
  data:
    key: "psalm-65"
    number: 65
    name: "Psalm 65"
    latin: "Te decet hymnus"
    verseCount: 14
    verses:
    - "1 You are to be praised, O God, in Zion; *\n  to you shall vows be performed in Jerusalem."
    - "2 To you that hear prayer shall all flesh come, *\n  because of their transgressions."
    - "3 Our sins are stronger than we are, *\n  but you will blot them out."
    - "4 Happy are they whom you choose\n  and draw to your courts to dwell there! *\n  they will be satisfied by the beauty of your house,\n  by the holiness of your temple."
    - "5 Awesome things will you show us in your righteousness,\n  O God of our salvation, *\n  O Hope of all the ends of the earth\n  and of the seas that are far away."
    - "6 You make fast the mountains by your power; *\n  they are girded about with might."
    - "7 You still the roaring of the seas, *\n  the roaring of their waves,\n  and the clamor of the peoples."
    - "8 Those who dwell at the ends of the earth will tremble at your\n  marvelous signs; *\n  you make the dawn and the dusk to sing for joy."
    - "9 You visit the earth and water it abundantly;\n  you make it very plenteous; *\n  the river of God is full of water."
    - "10 You prepare the grain, *\n  for so you provide for the earth."
    - "11 You drench the furrows and smooth out the ridges; *\n  with heavy rain you soften the ground and bless its increase."
    - "12 You crown the year with your goodness, *\n  and your paths overflow with plenty."
    - "13 May the fields of the wilderness be rich for grazing, *\n  and the hills be clothed with joy."
    - "14 May the meadows cover themselves with flocks,\n  and the valleys cloak themselves with grain; *\n  let them shout for joy and sing."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.65"
- type: "BcpPsalm"
  data:
    key: "psalm-66"
    number: 66
    name: "Psalm 66"
    latin: "Jubilate Deo"
    verseCount: 18
    verses:
    - "1 Be joyful in God, all you lands; *\n  sing the glory of his Name;\n  sing the glory of his praise."
    - "2 Say to God, \"How awesome are your deeds! *\n  because of your great strength your enemies\n  cringe before you."
    - "3 All the earth bows down before you, *\n  sings to you, sings out your Name.\""
    - "4 Come now and see the works of God, *\n  how wonderful he is in his doing toward all people."
    - "5 He turned the sea into dry land,\n  so that they went through the water on foot, *\n  and there we rejoiced in him."
    - "6 In his might he rules for ever;\n  his eyes keep watch over the nations; *\n  let no rebel rise up against him."
    - "7 Bless our God, you peoples; *\n  make the voice of his praise to be heard;"
    - "8 Who holds our souls in life, *\n  and will not allow our feet to slip."
    - "9 For you, O God, have proved us; *\n  you have tried us just as silver is tried."
    - "10 You brought us into\n  the snare; *\n  you laid heavy burdens upon our backs."
    - "11 You let enemies ride over our heads;\n  we went through fire and water; *\n  but you brought us out into a place of refreshment."
    - "12 I will enter your house with burnt-offerings\n  and will pay you my vows, *\n  which I promised with my lips\n  and spoke with my mouth when I was in trouble."
    - "13 I will offer you sacrifices of fat beasts\n  with the smoke of rams; *\n  I will give you oxen and goats."
    - "14 Come and listen, all you who fear God, *\n  and I will tell you what he has done for me."
    - "15 I called out to him with my mouth, *\n  and his praise was on my tongue."
    - "16 If I had found evil in my heart, *\n  the Lord would not have heard me;"
    - "17 But in truth God has heard me; *\n  he has attended to the voice of my prayer."
    - "18 Blessed be God, who has not rejected my prayer, *\n  nor withheld his love from me."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.66"
- type: "BcpPsalm"
  data:
    key: "psalm-67"
    number: 67
    name: "Psalm 67"
    latin: "Deus misereatur"
    verseCount: 7
    verses:
    - "1 May God be merciful to us and bless us, *\n  show us the light of his countenance and come to us."
    - "2 Let your ways be known upon earth, *\n  your saving health among all nations."
    - "3 Let the peoples praise you, O God; *\n  let all the peoples praise you."
    - "4 Let the nations be glad and sing for joy, *\n  for you judge the peoples with equity\n  and guide all the nations upon earth."
    - "5 Let the peoples praise you, O God; *\n  let all the peoples praise you."
    - "6 The earth has brought forth her increase; *\n  may God, our own God, give us his blessing."
    - "7 May God give us his blessing, *\n  and may all the ends of the earth stand in awe of him."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.67"
- type: "BcpPsalm"
  data:
    key: "psalm-68"
    number: 68
    name: "Psalm 68"
    latin: "Exsurgat Deus"
    verseCount: 36
    verses:
    - "1 Let God arise, and let his enemies be scattered; *\n  let those who hate him flee before him."
    - "2 Let them vanish like smoke when the wind drives it away; *\n  as the wax melts at the fire, so let the wicked perish at\n  the presence of God."
    - "3 But let the righteous be glad and rejoice before God; *\n  let them also be merry and joyful."
    - "4 Sing to God, sing praises to his Name;\n  exalt him who rides upon the heavens; *\n  YAHWEH is his Name, rejoice before him!"
    - "5 Father of orphans, defender of widows, *\n  God in his holy habitation!"
    - "6 God gives the solitary a home and brings forth prisoners\n  into freedom; *\n  but the rebels shall live in dry places."
    - "7 O God, when you went forth before your people, *\n  when you marched through the wilderness,"
    - "8 The earth shook, and the skies poured down rain,\n  at the presence of God, the God of Sinai, *\n  at the presence of God, the God of Israel."
    - "9 You sent a gracious rain, O God, upon your inheritance; *\n  you refreshed the land when it was weary."
    - "10 Your people found their home in it; *\n  in your goodness, O God, you have made provision\n  for the poor."
    - "11 The Lord gave the word; *\n  great was the company of women who bore the tidings:"
    - "12 \"Kings with their armies are fleeing away; *\n  the women at home are dividing the spoils.\""
    - "13 Though you lingered among the sheepfolds, *\n  you shall be like a dove whose wings are covered with silver,\n  whose feathers are like green gold."
    - "14 When the Almighty scattered kings, *\n  it was like snow falling in Zalmon."
    - "15 O mighty mountain, O hill of Bashan! *\n  O rugged mountain, O hill of Bashan!"
    - "16 Why do you look with envy, O rugged mountain,\n  at the hill which God chose for his resting place? *\n  truly, the LORD will dwell there for ever."
    - "17 The chariots of God are twenty thousand,\n  even thousands of thousands; *\n  the Lord comes in holiness from Sinai."
    - "18 You have gone up on high and led captivity captive;\n  you have received gifts even from your enemies, *\n  that the LORD God might dwell among them."
    - "19 Blessed be the Lord day by day, *\n  the God of our salvation, who bears our burdens."
    - "20 He is our God, the God of our salvation; *\n  God is the LORD, by whom we escape death."
    - "21 God shall crush the heads of his enemies, *\n  and the hairy scalp of those who go on still in their\n  wickedness."
    - "22 The Lord has said, \"I will bring them back from Bashan; *\n  I will bring them back from the depths of the sea;"
    - "23 That your foot may be dipped in blood, *\n  the tongues of your dogs in the blood of your enemies.\""
    - "24 They see your procession, O God, *\n  your procession into the sanctuary, my God and my King."
    - "25 The singers go before, musicians follow after, *\n  in the midst of maidens playing upon the hand-drums."
    - "26 Bless God in the congregation; *\n  bless the LORD, you that are of the fountain of Israel."
    - "27 There is Benjamin, least of the tribes, at the head;\n  the princes of Judah in a company; *\n  and the princes of Zebulon and Naphtali."
    - "28 Send forth your strength, O God; *\n  establish, O God, what you have wrought for us."
    - "29 Kings shall bring gifts to you, *\n  for your temple's sake at Jerusalem."
    - "30 Rebuke the wild beast of the reeds, *\n  and the peoples, a herd of wild bulls with its calves."
    - "31 Trample down those who lust after silver; *\n  scatter the peoples that delight in war."
    - "32 Let tribute be brought out of Egypt; *\n  let Ethiopia stretch out her hands to God."
    - "33 Sing to God, O kingdoms of the earth; *\n  sing praises to the Lord."
    - "34 He rides in the heavens, the ancient heavens; *\n  he sends forth his voice, his mighty voice."
    - "35 Ascribe power to God; *\n  his majesty is over Israel;\n  his strength is in the skies."
    - "36 How wonderful is God in his holy places! *\n  the God of Israel giving strength and power to his people!\n  Blessed be God!"
