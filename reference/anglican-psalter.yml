  data:
    key: "psalm-32"
    number: 32
    name: "Psalm 32"
    latin: "Beati quorum"
    verseCount: 12
    verses:
    - "1 Happy are they whose transgressions are forgiven, *\n  and whose sin is put away!"
    - "2 Happy are they to whom the LORD imputes no guilt, *\n  and in whose spirit there is no guile!"
    - "3 While I held my tongue, my bones withered away, *\n  because of my groaning all day long."
    - "4 For your hand was heavy upon me day and night; *\n  my moisture was dried up as in the heat of summer."
    - "5 Then I acknowledged my sin to you, *\n  and did not conceal my guilt."
    - "6 I said, \"I will confess my transgressions to the LORD.\" *\n  Then you forgave me the guilt of my sin."
    - "7 Therefore all the faithful will make their prayers to you in\n  time of trouble; *\n  when the great waters overflow, they shall not reach them."
    - "8 You are my hiding-place;\n  you preserve me from trouble; *\n  you surround me with shouts of deliverance."
    - "9 \"I will instruct you and teach you in the way that you\n  should go; *\n  I will guide you with my eye."
    - "10 Do not be like horse or mule, which have no understanding; *\n  who must be fitted with bit and bridle,\n  or else they will not stay near you.\""
    - "11 Great are the tribulations of the wicked; *\n  but mercy embraces those who trust in the LORD."
    - "12 Be glad, you righteous, and rejoice in the LORD; *\n  shout for joy, all who are true of heart."
