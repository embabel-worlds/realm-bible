    number: 123
    name: "Psalm 123"
    latin: "Ad te levavi oculos meos"
    verseCount: 5
    verses:
    - "1 To you I lift up my eyes, *\n  to you enthroned in the heavens."
    - "2 As the eyes of servants look to the hand of their masters, *\n  and the eyes of a maid to the hand of her mistress,"
    - "3 So our eyes look to the LORD our God, *\n  until he show us his mercy."
    - "4 Have mercy upon us, O LORD, have mercy, *\n  for we have had more than enough of contempt,"
    - "5 Too much of the scorn of the indolent rich, *\n  and of the derision of the proud."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.123"
- type: "BcpPsalm"
  data:
    key: "psalm-124"
    number: 124
    name: "Psalm 124"
    latin: "Nisi quia Dominus"
    verseCount: 8
    verses:
    - "1 If the LORD had not been on our side, *\n  let Israel now say;"
    - "2 If the LORD had not been on our side, *\n  when enemies rose up against us;"
    - "3 Then would they have swallowed us up alive *\n  in their fierce anger toward us;"
    - "4 Then would the waters have overwhelmed us *\n  and the torrent gone over us;"
    - "5 Then would the raging waters *\n  have gone right over us."
    - "6 Blessed be the LORD! *\n  he has not given us over to be a prey for their teeth."
    - "7 We have escaped like a bird from the snare of the fowler; *\n  the snare is broken, and we have escaped."
    - "8 Our help is in the Name of the LORD, *\n  the maker of heaven and earth."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.124"
- type: "BcpPsalm"
  data:
    key: "psalm-125"
    number: 125
    name: "Psalm 125"
    latin: "Qui confidunt"
    verseCount: 5
    verses:
    - "1 Those who trust in the LORD are like Mount Zion, *\n  which cannot be moved, but stands fast for ever."
    - "2 The hills stand about Jerusalem; *\n  so does the LORD stand round about his people,\n  from this time forth for evermore."
    - "3 The scepter of the wicked shall not hold sway over the\n  land allotted to the just, *\n  so that the just shall not put their hands to evil."
    - "4 Show your goodness, O LORD, to those who are good *\n  and to those who are true of heart."
    - "5 As for those who turn aside to crooked ways,\n  the LORD will lead them away with the evildoers; *\n  but peace be upon Israel."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.125"
- type: "BcpPsalm"
  data:
    key: "psalm-126"
    number: 126
    name: "Psalm 126"
    latin: "In convertendo"
    verseCount: 7
    verses:
    - "1 When the LORD restored the fortunes of Zion, *\n  then were we like those who dream."
    - "2 Then was our mouth filled with laughter, *\n  and our tongue with shouts of joy."
    - "3 Then they said among the nations, *\n  \"The LORD has done great things for them.\""
    - "4 The LORD has done great things for us, *\n  and we are glad indeed."
    - "5 Restore our fortunes, O LORD, *\n  like the watercourses of the Negev."
    - "6 Those who sowed with tears *\n  will reap with songs of joy."
    - "7 Those who go out weeping, carrying the seed, *\n  will come again with joy, shouldering their sheaves."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.126"
- type: "BcpPsalm"
  data:
    key: "psalm-127"
    number: 127
    name: "Psalm 127"
    latin: "Nisi Dominus"
    verseCount: 6
    verses:
    - "1 Unless the LORD builds the house, *\n  their labor is in vain who build it."
    - "2 Unless the LORD watches over the city, *\n  in vain the watchman keeps his vigil."
    - "3 It is in vain that you rise so early and go to bed so late; *\n  vain, too, to eat the bread of toil,\n  for he gives to his beloved sleep."
    - "4 Children are a heritage from the LORD, *\n  and the fruit of the womb is a gift."
    - "5 Like arrows in the hand of a warrior *\n  are the children of one's youth."
    - "6 Happy is the man who has his quiver full of them! *\n  he shall not be put to shame\n  when he contends with his enemies in the gate."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.127"
- type: "BcpPsalm"
  data:
    key: "psalm-128"
    number: 128
    name: "Psalm 128"
    latin: "Beati omnes"
    verseCount: 6
    verses:
    - "1 Happy are they all who fear the LORD, *\n  and who follow in his ways!"
    - "2 You shall eat the fruit of your labor; *\n  happiness and prosperity shall be yours."
    - "3 Your wife shall be like a fruitful vine within your house, *\n  your children like olive shoots round about your table."
    - "4 The man who fears the LORD *\n  shall thus indeed be blessed."
    - "5 The LORD bless you from Zion, *\n  and may you see the prosperity of Jerusalem all the days\n  of your life."
    - "6 May you live to see your children's children; *\n  may peace be upon Israel."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.128"
- type: "BcpPsalm"
  data:
    key: "psalm-129"
    number: 129
    name: "Psalm 129"
    latin: "Sæpe expugnaverunt"
    verseCount: 8
    verses:
    - "1 \"Greatly have they oppressed me since my youth,\" *\n  let Israel now say;"
    - "2 \"Greatly have they oppressed me since my youth, *\n  but they have not prevailed against me.\""
    - "3 The plowmen plowed upon my back *\n  and made their furrows long."
    - "4 The LORD, the Righteous One, *\n  has cut the cords of the wicked."
    - "5 Let them be put to shame and thrown back, *\n  all those who are enemies of Zion."
    - "6 Let them be like grass upon the housetops, *\n  which withers before it can be plucked;"
    - "7 Which does not fill the hand of the reaper, *\n  nor the bosom of him who binds the sheaves;"
    - "8 So that those who go by say not so much as,\n  \"The LORD prosper you. *\n  We wish you well in the Name of the LORD.\""
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.129"
- type: "BcpPsalm"
  data:
    key: "psalm-130"
    number: 130
    name: "Psalm 130"
    latin: "De profundis"
    verseCount: 7
    verses:
    - "1 Out of the depths have I called to you, O LORD;\n  LORD, hear my voice; *\n  let your ears consider well the voice of my supplication."
    - "2 If you, LORD, were to note what is done amiss, *\n  O LORD, who could stand?"
    - "3 For there is forgiveness with you; *\n  therefore you shall be feared."
    - "4 I wait for the LORD; my soul waits for him; *\n  in his word is my hope."
    - "5 My soul waits for the LORD,\n  more than watchmen for the morning, *\n  more than watchmen for the morning."
    - "6 O Israel, wait for the LORD, *\n  for with the LORD there is mercy;"
    - "7 With him there is plenteous redemption, *\n  and he shall redeem Israel from all their sins."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.130"
