  data:
    key: "psalm-38"
    number: 38
    name: "Psalm 38"
    latin: "Domine, ne in furore"
    verseCount: 22
    verses:
    - "1 O LORD, do not rebuke me in your anger; *\n  do not punish me in your wrath."
    - "2 For your arrows have already pierced me, *\n  and your hand presses hard upon me."
    - "3 There is no health in my flesh,\n  because of your indignation; *\n  there is no soundness in my body, because of my sin."
    - "4 For my iniquities overwhelm me; *\n  like a heavy burden they are too much for me to bear."
    - "5 My wounds stink and fester *\n  by reason of my foolishness."
    - "6 I am utterly bowed down and prostrate; *\n  I go about in mourning all the day long."
    - "7 My loins are filled with searing pain; *\n  there is no health in my body."
    - "8 I am utterly numb and crushed; *\n  I wail, because of the groaning of my heart."
    - "9 O Lord, you know all my desires, *\n  and my sighing is not hidden from you."
    - "10 My heart is pounding, my strength has failed me, *\n  and the brightness of my eyes is gone from me."
    - "11 My friends and companions draw back from my affliction; *\n  my neighbors stand afar off."
    - "12 Those who seek after my life lay snares for me; *\n  those who strive to hurt me speak of my ruin\n  and plot treachery all the day long."
    - "13 But I am like the deaf who do not hear, *\n  like those who are mute and who do not open their mouth."
    - "14 I have become like one who does not hear *\n  and from whose mouth comes no defense."
    - "15 For in you, O LORD, have I fixed my hope; *\n  you will answer me, O Lord my God."
    - "16 For I said, \"Do not let them rejoice at my expense, *\n  those who gloat over me when my foot slips.\""
    - "17 Truly, I am on the verge of falling, *\n  and my pain is always with me."
    - "18 I will confess my iniquity *\n  and be sorry for my sin."
    - "19 Those who are my enemies without cause are mighty, *\n  and many in number are those who wrongfully hate me."
    - "20 Those who repay evil for good slander me, *\n  because I follow the course that is right."
    - "21 O LORD, do not forsake me; *\n  be not far from me, O my God."
    - "22 Make haste to help me, *\n  O Lord of my salvation."
  relations:
