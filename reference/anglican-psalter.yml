  data:
    key: "psalm-131"
    number: 131
    name: "Psalm 131"
    latin: "Domine, non est"
    verseCount: 4
    verses:
    - "1 O LORD, I am not proud; *\n  I have no haughty looks."
    - "2 I do not occupy myself with great matters, *\n  or with things that are too hard for me."
    - "3 But I still my soul and make it quiet,\n  like a child upon its mother's breast; *\n  my soul is quieted within me."
    - "4 O Israel, wait upon the LORD, *\n  from this time forth for evermore."
  relations:
  - predicate: "SAME_AS"
    to:
      type: "Passage"
      osis: "Ps.131"
