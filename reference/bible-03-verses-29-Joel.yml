    apiRef: Joel2:19
    book: Joel
    chapter: 2
    verse: 19
    text: 'Yea, the LORD will answer and say unto his people, Behold, I will send you corn, and wine, and oil, and ye shall be satisfied therewith: and I will no more make you a reproach among the heathen:'
    web: The LORD answered his people, “Behold, I will send you grain, new wine, and oil, and you will be satisfied with them; and I will no more make you a reproach among the nations.
