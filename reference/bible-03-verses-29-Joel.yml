  data:
    osis: Joel.2.20
    name: Joel 2:20
    apiRef: Joel2:20
    book: Joel
    chapter: 2
    verse: 20
    text: But I will remove far off from you the northern army, and will drive him into a land barren and desolate, with his face toward the east sea, and his hinder part toward the utmost sea, and his stink shall come up, and his ill savour shall come up, because he hath done great things.
    web: But I will remove the northern army far away from you, and will drive it into a barren and desolate land, its front into the eastern sea, and its back into the western sea; and its stench will come up, and its bad smell will rise.” Surely he has done great things.
    event: Prophecies of Joel
  relations:
