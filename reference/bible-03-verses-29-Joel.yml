  data:
    osis: Joel.2.2
    name: Joel 2:2
    apiRef: Joel2:2
    book: Joel
    chapter: 2
    verse: 2
    text: 'A day of darkness and of gloominess, a day of clouds and of thick darkness, as the morning spread upon the mountains: a great people and a strong; there hath not been ever the like, neither shall be any more after it, even to the years of many generations.'
    web: A day of darkness and gloominess, a day of clouds and thick darkness. As the dawn spreading on the mountains, a great and strong people; there has never been the like, neither will there be any more after them, even to the years of many generations.
    event: Prophecies of Joel
  relations:
