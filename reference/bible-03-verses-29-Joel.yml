    verse: 11
    text: 'And the LORD shall utter his voice before his army: for his camp is very great: for he is strong that executeth his word: for the day of the LORD is great and very terrible; and who can abide it?'
    web: The LORD thunders his voice before his army, for his forces are very great; for he is strong who obeys his command; for the day of the LORD is great and very awesome, and who can endure it?
