    apiRef: Joel2:8
    book: Joel
    chapter: 2
    verse: 8
    text: 'Neither shall one thrust another; they shall walk every one in his path: and when they fall upon the sword, they shall not be wounded.'
    web: One doesn’t jostle another. They each march in their own path. They burst through the defenses and don’t break ranks.
