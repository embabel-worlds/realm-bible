    apiRef: Joel2:21
    book: Joel
    chapter: 2
    verse: 21
    text: 'Fear not, O land; be glad and rejoice: for the LORD will do great things.'
    web: Land, don’t be afraid. Be glad and rejoice, for the LORD has done great things.
