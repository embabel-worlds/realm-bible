    apiRef: Joel2:23
    book: Joel
    chapter: 2
    verse: 23
    text: 'Be glad then, ye children of Zion, and rejoice in the LORD your God: for he hath given you the former rain moderately, and he will cause to come down for you the rain, the former rain, and the latter rain in the first month.'
    web: “Be glad then, you children of Zion, and rejoice in the LORD, your God; for he gives you the early rain in just measure, and he causes the rain to come down for you, the early rain and the latter rain, as before.
