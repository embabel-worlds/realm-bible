    apiRef: Joel2:3
    book: Joel
    chapter: 2
    verse: 3
    text: 'A fire devoureth before them; and behind them a flame burneth: the land is as the garden of Eden before them, and behind them a desolate wilderness; yea, and nothing shall escape them.'
    web: A fire devours before them, and behind them, a flame burns. The land is as the garden of Eden before them, and behind them, a desolate wilderness. Yes, and no one has escaped them.
    event: Prophecies of Joel
