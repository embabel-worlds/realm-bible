    name: Joel 2:22
    apiRef: Joel2:22
    book: Joel
    chapter: 2
    verse: 22
    text: 'Be not afraid, ye beasts of the field: for the pastures of the wilderness do spring, for the tree beareth her fruit, the fig tree and the vine do yield their strength.'
    web: Don’t be afraid, you animals of the field; for the pastures of the wilderness spring up, for the tree bears its fruit. The fig tree and the vine yield their strength.
