- type: Verse
  data:
    osis: Joel.2.17
    name: Joel 2:17
    apiRef: Joel2:17
    book: Joel
    chapter: 2
    verse: 17
    text: 'Let the priests, the ministers of the LORD, weep between the porch and the altar, and let them say, Spare thy people, O LORD, and give not thine heritage to reproach, that the heathen should rule over them: wherefore should they say among the people, Where is their God?'
    web: Let the priests, the ministers of the LORD, weep between the porch and the altar, and let them say, “Spare your people, LORD, and don’t give your heritage to reproach, that the nations should rule over them. Why should they say among the peoples, ‘Where is their God?’”
    people:
