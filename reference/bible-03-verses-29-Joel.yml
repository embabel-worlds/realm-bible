  data:
    osis: Joel.2.7
    name: Joel 2:7
    apiRef: Joel2:7
    book: Joel
    chapter: 2
    verse: 7
    text: 'They shall run like mighty men; they shall climb the wall like men of war; and they shall march every one on his ways, and they shall not break their ranks:'
    web: They run like mighty men. They climb the wall like warriors. They each march in his line, and they don’t swerve off course.
