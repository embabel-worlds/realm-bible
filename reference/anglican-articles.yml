- type: "ArticleOfReligion"
  data:
    key: "article-39"
    number: 39
    roman: "XXXIX"
    title: "Of a Christian Man's Oath."
    text: "As we confess that vain and rash Swearing is forbidden Christian men by our Lord Jesus Christ, and James his Apostle, so we judge, that Christian Religion doth not prohibit, but that a man may swear when the Magistrate requireth, in a cause of faith and charity, so it be done according to the Prophet's teaching in justice, judgment, and truth."
