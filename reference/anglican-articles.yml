- type: "ArticleOfReligion"
  data:
    key: "article-37"
    number: 37
    roman: "XXXVII"
    title: "Of the Power of the Civil Magistrates."
    text: "The Power of the Civil Magistrate extendeth to all men, as well Clergy as Laity, in all things temporal; but hath no authority in things purely spiritual. And we hold it to be the duty of all men who are professors of the Gospel, to pay respectful obedience to the Civil Authority, regularly and legitimately constituted. The original 1571, 1662 text of this Article reads as follows: \"The King's Majesty hath the chief power in this Realm of England, and other his Dominions, unto whom the chief Government of all Estates of this Realm, whether they be Ecclesiastical or Civil, in all causes doth appertain, and is not, nor ought to be, subject to any foreign Jurisdiction. Where we attribute to the King's Majesty the chief government, by which Titles we understand the minds of some slanderous folks to be offended; we give not our Princes the\n\nministering either of God's Word, or of the Sacraments, the which thing the Injunctions also lately set forth by Elizabeth our Queen do most plainly testify; but that only prerogative, which we see to have been given always to all godly Princes in holy Scriptures by God himself; that is, that they should rule all estates and degrees committed to their charge by God, whether they be Ecclesiastical or Temporal, and restrain with the civil sword the stubborn and evil-doers. The Bishop of Rome hath no jurisdiction in this Realm of England. The Laws of the Realm may punish Christian men with death, for heinous and grievous offences. It is lawful for Christian men, at the commandment of the Magistrate, to wear weapons, and serve in the wars.\""
