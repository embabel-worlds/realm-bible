- type: "ArticleOfReligion"
  data:
    key: "article-9"
    number: 9
    roman: "IX"
    title: "Of Original or Birth Sin."
    text: "Original sin standeth not in the following of Adam, (as the Pelagians do vainly talk;) but it is the fault and corruption of the Nature of every man, that naturally is engendered of the offspring of Adam; whereby man is very far gone from original righteousness, and is of his own nature inclined to evil, so that the flesh lusteth always contrary to the Spirit; and therefore in every person born into this world, it deserveth God's wrath and damnation. And this infection of nature doth remain, yea in them that are regenerated; whereby the lust of the flesh, called in Greek, Φρόνημα σαρκός, (which some do expound the wisdom, some sensuality, some the affection, some the desire, of the flesh), is not subject to the Law of God. And although there is no condemnation for them that believe and are baptized; yet the Apostle doth confess, that concupiscence and lust hath of itself the nature of sin."
