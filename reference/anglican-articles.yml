- type: "ArticleOfReligion"
  data:
    key: "article-2"
    number: 2
    roman: "II"
    title: "Of the Word or Son of God, which was made very Man."
    text: "The Son, which is the Word of the Father, begotten from everlasting of the Father, the very and eternal God, and of one substance with the Father, took Man's nature in the womb of the blessed Virgin, of her substance: so that two whole and perfect Natures, that is to say, the Godhead and Manhood, were joined together in one Person, never to be divided, whereof is one Christ, very God, and very Man; who truly suffered, was crucified, dead, and buried, to reconcile his Father to us, and to be a sacrifice, not only for original guilt, but also for actual sins of men."
    original1571: ""
    omitted: false
