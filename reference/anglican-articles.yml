- type: "ArticleOfReligion"
  data:
    key: "article-13"
    number: 13
    roman: "XIII"
    title: "Of Works before Justification."
    text: "Works done before the grace of Christ, and the Inspiration of the Spirit, are not pleasant to God, forasmuch as they spring not of faith in Jesus Christ; neither do they make men meet to receive grace, or (as the School-authors say) deserve grace of congruity: yea rather, for that they are not done as God hath willed and commanded them to be done, we doubt not but they have the nature of sin."
