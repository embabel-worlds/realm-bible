- type: "ArticleOfReligion"
  data:
    key: "article-6"
    number: 6
    roman: "VI"
    title: "Of the Sufficiency of the Holy Scriptures for Salvation."
    text: "Holy Scripture containeth all things necessary to salvation: so that whatsoever is not read therein, nor may be proved thereby, is not to be required of any man, that it should be believed as an article of the Faith, or be thought requisite or necessary to salvation. In the name of the Holy Scripture we do understand those canonical Books of the Old and New Testament, of whose authority was never any doubt in the Church.\n\nOf the Names and Number of the Canonical Books\n\nGenesis, Exodus, Leviticus, Numbers, Deuteronomy, Joshua, Judges, Ruth, The First Book of Samuel, The Second Book of Samuel, The First Book of Kings, The Second Book of Kings, The First Book of Chronicles, The Second Book of Chronicles, The First Book of Esdras, The Second Book of Esdras, The Book of Esther, The Book of Job, The Psalms, The Proverbs, Ecclesiastes or Preacher, Cantica, or Songs of Solomon, Four Prophets the greater, Twelve Prophets the less.\n\nAnd the other Books (as Hierome saith) the Church doth read for example of life and instruction of manners; but yet doth it not apply them to establish any doctrine; such are these following:\n\nThe Third Book of Esdras, The Fourth Book of Esdras, The Book of Tobias, The Book of Judith, The rest of the Book of Esther, The Book of Wisdom, Jesus the Son of Sirach, Baruch the Prophet,\n\nThe Song of the Three Children, The Story of Susanna, Of Bel and the Dragon, The Prayer of Manasses, The First Book of Maccabees, The Second Book of Maccabees.\n\nAll the Books of the New Testament, as they are commonly received, we do receive, and account them Canonical."
    original1571: ""
    omitted: false
