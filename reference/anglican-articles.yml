- type: "ArticleOfReligion"
  data:
    key: "article-20"
    number: 20
    roman: "XX"
    title: "Of the Authority of the Church."
    text: "The Church hath power to decree Rites or Ceremonies, and authority in Controversies of Faith: and yet it is not lawful for the Church to ordain anything that is contrary to God's Word written, neither may it so expound one place of Scripture, that it be repugnant to another. Wherefore, although the Church be a witness and a keeper of Holy Writ, yet, as it ought not to decree any thing against the same, so besides the same ought not to enforce any thing to be believed for necessity of Salvation."
