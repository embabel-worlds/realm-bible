- type: "ArticleOfReligion"
  data:
    key: "article-35"
    number: 35
    roman: "XXXV"
    title: "Of the Homilies."
    text: "The Second Book of Homilies, the several titles whereof we have joined under this Article, doth contain a godly and wholesome Doctrine, and necessary for these times, as doth the former Book of Homilies, which were set forth in the time of Edward the Sixth; and therefore we judge them to be read in Churches by the Ministers, diligently and distinctly, that they may be understanded of the people.\n\nOf the Names of the Homilies\n\n1 Of the right Use of the Church. 2 Against Peril of Idolatry. 3 Of repairing and keeping clean of Churches. 4 Of good Works: first of Fasting. 5 Against Gluttony and Drunkenness. 6 Against Excess of Apparel. 7 Of Prayer. 8 Of the Place and Time of Prayer. 9 That Common Prayers and Sacraments ought to be ministered in a known tongue. 10 Of the reverend Estimation of God's Word. 11 Of Alms-doing. 12 Of the Nativity of Christ. 13 Of the Passion of Christ. 14 Of the Resurrection of Christ. 15 Of the worthy receiving of the Sacrament of the Body and Blood of Christ. 16 Of the Gifts of the Holy Ghost. 17 For the Rogation-days. 18 Of the State of Matrimony. 19 Of Repentance. 20 Against Idleness. 21 Against Rebellion.\n\n[This Article is received in this Church, so far as it declares the Book of Homilies to be an explication of Christian doctrine, and instructive in piety and morals. But all references to the constitution and laws of England are considered as inapplicable to the circumstances of this Church; which also suspends the order for the reading of said Homilies in churches, until a revision of them may be conveniently made, for the clearing of them, as well from obsolete words and phrases, as from the local references.]"
