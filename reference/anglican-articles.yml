- type: "ArticleOfReligion"
  data:
    key: "article-12"
    number: 12
    roman: "XII"
    title: "Of Good Works."
    text: "Albeit that Good Works, which are the fruits of Faith, and follow after Justification, cannot put away our sins, and endure the severity of God's judgment; yet are they pleasing and acceptable to God in Christ, and do spring out necessarily of a true and lively Faith; insomuch that by them a lively Faith may be as evidently known as a tree discerned by the fruit."
