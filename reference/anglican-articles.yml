- type: "ArticleOfReligion"
  data:
    key: "article-17"
    number: 17
    roman: "XVII"
    title: "Of Predestination and Election."
    text: "Predestination to Life is the everlasting purpose of God, whereby (before the foundations of the world were laid) he hath constantly decreed by his counsel secret to us, to deliver from curse and damnation those whom he hath chosen in Christ out of mankind, and to bring them by Christ to everlasting salvation, as vessels made to honour. Wherefore, they which be endued with so excellent a benefit of God, be called according to God's purpose by his Spirit working in due season: they through Grace obey the calling: they be justified freely: they be made sons of God by adoption: they be made like the image of his only-begotten Son Jesus Christ: they walk religiously in good works, and at length, by God's mercy, they attain to everlasting felicity. As the godly consideration of Predestination, and our Election in Christ, is full of sweet, pleasant, and unspeakable comfort to godly persons, and such as feel in themselves the working of the Spirit of Christ, mortifying the works of the flesh, and their earthly mem- bers, and drawing up their mind to high and heavenly things, as well because it doth greatly establish and confirm their faith of eternal Salvation to be enjoyed through Christ, as because it doth fervently kindle their love towards God: So, for curious and carnal persons, lacking the Spirit of Christ, to have continually before their eyes the sentence of God's Predestination, is a most dangerous downfall, whereby the Devil doth thrust them either into desperation, or into wrethchlessness of most unclean living, no less perilous than desperation. Furthermore, we must receive God's promises in such wise, as they be generally set forth to us in Holy Scripture: and, in our doings, that Will of God is to be followed, which we have expressly declared unto us in the word of God."
    original1571: ""
    omitted: false
    proofTexts:
