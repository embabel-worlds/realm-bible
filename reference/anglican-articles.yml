  data:
    key: "article-19"
    number: 19
    roman: "XIX"
    title: "Of the Church."
    text: "The visible Church of Christ is a congregation of faithful men, in which the pure Word of God is preached, and the Sacraments be duly ministered according to Christ's ordinance, in all those things that of necessity are requisite to the same. As the Church of Jerusalem, Alexandria, and Antioch, have erred; so also the Church of Rome hath erred, not only in their living and manner of Ceremonies, but also in matters of Faith."
