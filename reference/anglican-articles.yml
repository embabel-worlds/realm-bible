    roman: "XXXIV"
    title: "Of the Traditions of the Church."
    text: "It is not necessary that the Traditions and Ceremonies be in all places one, or utterly like; for at all times they have been divers, and may be changed according to the diversity of countries, times, and men's manners, so that nothing be ordained against God's Word. Whosoever, through his private judgment, willingly and purposely, doth openly break the Traditions and Ceremonies of the Church, which be not repugnant to the Word of God, and be ordained and approved by common authority, ought to be rebuked openly, (that others may fear to do the like,) as he that offendeth against the common order of the Church, and hurteth the authority of the Magistrate, and woundeth the consciences of the weak brethren. Every particular or national Church hath authority to ordain, change, and abolish, Ceremonies or Rites of the Church ordained only by man's authority, so that all things be done to edifying."
