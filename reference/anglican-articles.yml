- type: "ArticleOfReligion"
  data:
    key: "article-36"
    number: 36
    roman: "XXXVI"
    title: "Of Consecration of Bishops and Ministers."
    text: "The Book of Consecration of Bishops, and Ordering of Priests and Deacons, as set forth by the General Convention of this Church in 1792, doth contain all things necessary to such Consecration and Ordering; neither hath it any thing that, of itself, is superstitious and ungodly. And, therefore, whosoever are consecrated or ordered according to said Form, we decree all such to be rightly, orderly, and lawfully consecrated and ordered. The original 1571, 1662 text of this Article reads as follows: \"The Book of Consecration of Archbishops and Bishops, and Ordering of Priests and Deacons, lately set forth in the time of Edward the Sixth, and confirmed at the same time by authority of Parliament, doth contain all things necessary to such Consecration and Ordering; neither hath it any thing, that of itself is superstitious and ungodly. And therefore whosoever are consecrated or ordered according to the Rites of that Book, since the second year of the forenamed King Edward unto this time, or hereafter shall be consecrated or ordered according to the same Rites; we decree all such to be rightly, orderly, and lawfully consecrated and ordered.\""
