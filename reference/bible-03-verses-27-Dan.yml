    chapter: 11
    verse: 19
    text: 'Then he shall turn his face toward the fort of his own land: but he shall stumble and fall, and not be found.'
    web: Then he will turn his face toward the fortresses of his own land; but he will stumble and fall, and won’t be found.
    event: Prophecies of Daniel
