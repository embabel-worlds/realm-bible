    chapter: 11
    verse: 16
    text: 'But he that cometh against him shall do according to his own will, and none shall stand before him: and he shall stand in the glorious land, which by his hand shall be consumed.'
    web: But he who comes against him will do according to his own will, and no one will stand before him. He will stand in the glorious land, and destruction will be in his hand.
    event: Prophecies of Daniel
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Dan.11
