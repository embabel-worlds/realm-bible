    apiRef: Daniel11:17
    book: Dan
    chapter: 11
    verse: 17
    text: 'He shall also set his face to enter with the strength of his whole kingdom, and upright ones with him; thus shall he do: and he shall give him the daughter of women, corrupting her: but she shall not stand on his side, neither be for him.'
    web: He will set his face to come with the strength of his whole kingdom, and with him equitable conditions. He will perform them. He will give him the daughter of women, to destroy the kingdom, but she will not stand, and won’t be for him.
    event: Prophecies of Daniel
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Dan.11
