    web: “In his place a contemptible person will stand up, to whom they had not given the honor of the kingdom; but he will come in a time of security, and will obtain the kingdom by flatteries.
    event: Prophecies of Daniel
  relations:
  - predicate: IN
    to:
      type: Passage
