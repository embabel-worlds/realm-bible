    text: And the king of the south shall be strong, and one of his princes; and he shall be strong above him, and have dominion; his dominion shall be a great dominion.
    web: “The king of the south will be strong. One of his princes will become stronger than him, and have dominion. His dominion will be a great dominion.
    event: Prophecies of Daniel
