    name: Nehemiah 10:38
    apiRef: Nehemiah10:38
    book: Neh
    chapter: 10
    verse: 38
    text: 'And the priest the son of Aaron shall be with the Levites, when the Levites take tithes: and the Levites shall bring up the tithe of the tithes unto the house of our God, to the chambers, into the treasure house.'
    web: The priest, the descendent of Aaron, shall be with the Levites when the Levites take tithes. The Levites shall bring up the tithe of the tithes to the house of our God, to the rooms, into the treasure house.
    people:
    - aaron_1
    - god_1324
  relations:
  - predicate: IN
    to:
