  data:
    osis: Neh.10.34
    name: Nehemiah 10:34
    apiRef: Nehemiah10:34
    book: Neh
    chapter: 10
    verse: 34
    text: 'And we cast the lots among the priests, the Levites, and the people, for the wood offering, to bring it into the house of our God, after the houses of our fathers, at times appointed year by year, to burn upon the altar of the LORD our God, as it is written in the law:'
    web: We, the priests, the Levites, and the people, cast lots for the wood offering, to bring it into the house of our God, according to our fathers’ houses, at times appointed year by year, to burn on the LORD our God’s altar, as it is written in the law;
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Neh.10
