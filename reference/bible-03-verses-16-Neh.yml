    name: Nehemiah 10:36
    apiRef: Nehemiah10:36
    book: Neh
    chapter: 10
    verse: 36
    text: 'Also the firstborn of our sons, and of our cattle, as it is written in the law, and the firstlings of our herds and of our flocks, to bring to the house of our God, unto the priests that minister in the house of our God:'
    web: also the firstborn of our sons and of our livestock, as it is written in the law, and the firstborn of our herds and of our flocks, to bring to the house of our God, to the priests who minister in the house of our God;
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Neh.10
