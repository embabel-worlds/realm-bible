  data:
    osis: Neh.10.33
    name: Nehemiah 10:33
    apiRef: Nehemiah10:33
    book: Neh
    chapter: 10
    verse: 33
    text: For the shewbread, and for the continual meat offering, and for the continual burnt offering, of the sabbaths, of the new moons, for the set feasts, and for the holy things, and for the sin offerings to make an atonement for Israel, and for all the work of the house of our God.
    web: for the show bread, for the continual meal offering, for the continual burnt offering, for the Sabbaths, for the new moons, for the set feasts, for the holy things, for the sin offerings to make atonement for Israel, and for all the work of the house of our God.
    people:
    - god_1324
