    apiRef: Nehemiah5:3
    book: Neh
    chapter: 5
    verse: 3
    text: Some also there were that said, We have mortgaged our lands, vineyards, and houses, that we might buy corn, because of the dearth.
    web: There were also some who said, “We are mortgaging our fields, our vineyards, and our houses. Let us get grain, because of the famine.”
