    apiRef: Nehemiah5:10
    book: Neh
    chapter: 5
    verse: 10
    text: 'I likewise, and my brethren, and my servants, might exact of them money and corn: I pray you, let us leave off this usury.'
    web: I likewise, my brothers and my servants, lend them money and grain. Please let us stop this usury.
  relations:
