    apiRef: Nehemiah5:16
    book: Neh
    chapter: 5
    verse: 16
    text: 'Yea, also I continued in the work of this wall, neither bought we any land: and all my servants were gathered thither unto the work.'
    web: Yes, I also continued in the work of this wall. We didn’t buy any land. All my servants were gathered there to the work.
