  data:
    osis: Neh.5.8
    name: Nehemiah 5:8
    apiRef: Nehemiah5:8
    book: Neh
    chapter: 5
    verse: 8
    text: And I said unto them, We after our ability have redeemed our brethren the Jews, which were sold unto the heathen; and will ye even sell your brethren? or shall they be sold unto us? Then held they their peace, and found nothing to answer.
    web: I said to them, “We, after our ability, have redeemed our brothers the Jews that were sold to the nations; and would you even sell your brothers, and should they be sold to us?” Then they held their peace, and found not a word to say.
  relations:
