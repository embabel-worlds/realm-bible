    apiRef: Nehemiah10:35
    book: Neh
    chapter: 10
    verse: 35
    text: 'And to bring the firstfruits of our ground, and the firstfruits of all fruit of all trees, year by year, unto the house of the LORD:'
    web: and to bring the first fruits of our ground and the first fruits of all fruit of all kinds of trees, year by year, to the LORD’s house;
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Neh.10
