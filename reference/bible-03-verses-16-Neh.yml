    apiRef: Nehemiah6:6
    book: Neh
    chapter: 6
    verse: 6
    text: 'Wherein was written, It is reported among the heathen, and Gashmu saith it, that thou and the Jews think to rebel: for which cause thou buildest the wall, that thou mayest be their king, according to these words.'
    web: in which was written, “It is reported among the nations, and Gashmu says it, that you and the Jews intend to rebel. Because of that, you are building the wall. You would be their king, according to these words.
    people:
    - geshem_1307
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Neh.6
