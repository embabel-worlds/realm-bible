  data:
    osis: Neh.6.7
    name: Nehemiah 6:7
    apiRef: Nehemiah6:7
    book: Neh
    chapter: 6
    verse: 7
    text: 'And thou hast also appointed prophets to preach of thee at Jerusalem, saying, There is a king in Judah: and now shall it be reported to the king according to these words. Come now therefore, and let us take counsel together.'
    web: You have also appointed prophets to proclaim of you at Jerusalem, saying, ‘There is a king in Judah!’ Now it will be reported to the king according to these words. Come now therefore, and let’s take counsel together.”
  relations:
