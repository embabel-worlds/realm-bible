  data:
    osis: Neh.5.5
    name: Nehemiah 5:5
    apiRef: Nehemiah5:5
    book: Neh
    chapter: 5
    verse: 5
    text: 'Yet now our flesh is as the flesh of our brethren, our children as their children: and, lo, we bring into bondage our sons and our daughters to be servants, and some of our daughters are brought unto bondage already: neither is it in our power to redeem them; for other men have our lands and vineyards.'
    web: Yet now our flesh is as the flesh of our brothers, our children as their children. Behold, we bring our sons and our daughters into bondage to be servants, and some of our daughters have been brought into bondage. It is also not in our power to help it, because other men have our fields and our vineyards.”
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Neh.5
- type: Verse
  data:
    osis: Neh.5.6
    name: Nehemiah 5:6
    apiRef: Nehemiah5:6
    book: Neh
    chapter: 5
    verse: 6
