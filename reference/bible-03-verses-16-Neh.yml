    osis: Neh.6.8
    name: Nehemiah 6:8
    apiRef: Nehemiah6:8
    book: Neh
    chapter: 6
    verse: 8
    text: Then I sent unto him, saying, There are no such things done as thou sayest, but thou feignest them out of thine own heart.
    web: Then I sent to him, saying, “There are no such things done as you say, but you imagine them out of your own heart.”
  relations:
