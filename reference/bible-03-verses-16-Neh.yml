    apiRef: Nehemiah5:7
    book: Neh
    chapter: 5
    verse: 7
    text: Then I consulted with myself, and I rebuked the nobles, and the rulers, and said unto them, Ye exact usury, every one of his brother. And I set a great assembly against them.
    web: Then I consulted with myself, and contended with the nobles and the rulers, and said to them, “You exact usury, everyone of his brother.” I held a great assembly against them.
  relations:
