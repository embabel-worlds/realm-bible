  data:
    osis: Neh.10.37
    name: Nehemiah 10:37
    apiRef: Nehemiah10:37
    book: Neh
    chapter: 10
    verse: 37
    text: And that we should bring the firstfruits of our dough, and our offerings, and the fruit of all manner of trees, of wine and of oil, unto the priests, to the chambers of the house of our God; and the tithes of our ground unto the Levites, that the same Levites might have the tithes in all the cities of our tillage.
    web: and that we should bring the first fruits of our dough, our wave offerings, the fruit of all kinds of trees, and the new wine and the oil, to the priests, to the rooms of the house of our God; and the tithes of our ground to the Levites; for they, the Levites, take the tithes in all our farming villages.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Neh.10
