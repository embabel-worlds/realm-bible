- type: Verse
  data:
    osis: 1John.5.13
    name: 1 John 5:13
    apiRef: 1John5:13
    book: 1John
    chapter: 5
    verse: 13
    text: These things have I written unto you that believe on the name of the Son of God; that ye may know that ye have eternal life, and that ye may believe on the name of the Son of God.
    web: These things I have written to you who believe in the name of the Son of God, that you may know that you have eternal life, and that you may continue to believe in the name of the Son of God.
    people:
    - god_1324
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: 1John.5
