- type: Verse
  data:
    osis: 1John.5.15
    name: 1 John 5:15
    apiRef: 1John5:15
    book: 1John
    chapter: 5
    verse: 15
    text: And if we know that he hear us, whatsoever we ask, we know that we have the petitions that we desired of him.
    web: And if we know that he listens to us, whatever we ask, we know that we have the petitions which we have asked of him.
  relations:
  - predicate: IN
    to:
