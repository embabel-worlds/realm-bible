    osis: 1John.5.10
    name: 1 John 5:10
    apiRef: 1John5:10
    book: 1John
    chapter: 5
    verse: 10
    text: 'He that believeth on the Son of God hath the witness in himself: he that believeth not God hath made him a liar; because he believeth not the record that God gave of his Son.'
    web: He who believes in the Son of God has the testimony in himself. He who doesn’t believe God has made him a liar, because he has not believed in the testimony that God has given concerning his Son.
    people:
    - god_1324
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: 1John.5
- type: Verse
  data:
    osis: 1John.5.11
    name: 1 John 5:11
    apiRef: 1John5:11
    book: 1John
    chapter: 5
    verse: 11
    text: And this is the record, that God hath given to us eternal life, and this life is in his Son.
    web: 'The testimony is this: that God gave to us eternal life, and this life is in his Son.'
    people:
    - god_1324
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: 1John.5
