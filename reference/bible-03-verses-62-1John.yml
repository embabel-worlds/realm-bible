    apiRef: 1John5:18
    book: 1John
    chapter: 5
    verse: 18
    text: We know that whosoever is born of God sinneth not; but he that is begotten of God keepeth himself, and that wicked one toucheth him not.
    web: We know that whoever is born of God doesn’t sin, but he who was born of God keeps himself, and the evil one doesn’t touch him.
