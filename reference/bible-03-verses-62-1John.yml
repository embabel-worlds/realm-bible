      osis: 1John.5
- type: Verse
  data:
    osis: 1John.5.16
    name: 1 John 5:16
    apiRef: 1John5:16
    book: 1John
    chapter: 5
    verse: 16
    text: 'If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death: I do not say that he shall pray for it.'
    web: If anyone sees his brother sinning a sin not leading to death, he shall ask, and God will give him life for those who sin not leading to death. There is sin leading to death. I don’t say that he should make a request concerning this.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: 1John.5
