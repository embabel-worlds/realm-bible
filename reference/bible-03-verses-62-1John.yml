    apiRef: 1John5:12
    book: 1John
    chapter: 5
    verse: 12
    text: He that hath the Son hath life; and he that hath not the Son of God hath not life.
    web: He who has the Son has the life. He who doesn’t have God’s Son doesn’t have the life.
