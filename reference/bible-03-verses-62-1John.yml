  data:
    osis: 1John.5.14
    name: 1 John 5:14
    apiRef: 1John5:14
    book: 1John
    chapter: 5
    verse: 14
    text: 'And this is the confidence that we have in him, that, if we ask any thing according to his will, he heareth us:'
    web: This is the boldness which we have toward him, that if we ask anything according to his will, he listens to us.
  relations:
