  data:
    osis: Jas.4.7
    name: James 4:7
    apiRef: James4:7
    book: Jas
    chapter: 4
    verse: 7
    text: Submit yourselves therefore to God. Resist the devil, and he will flee from you.
    web: Be subject therefore to God. Resist the devil, and he will flee from you.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.8
    name: James 4:8
    apiRef: James4:8
    book: Jas
    chapter: 4
    verse: 8
    text: Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners; and purify your hearts, ye double minded.
    web: Draw near to God, and he will draw near to you. Cleanse your hands, you sinners. Purify your hearts, you double-minded.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.9
    name: James 4:9
    apiRef: James4:9
    book: Jas
    chapter: 4
    verse: 9
    text: 'Be afflicted, and mourn, and weep: let your laughter be turned to mourning, and your joy to heaviness.'
    web: Lament, mourn, and weep. Let your laughter be turned to mourning and your joy to gloom.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.10
    name: James 4:10
    apiRef: James4:10
    book: Jas
    chapter: 4
    verse: 10
    text: Humble yourselves in the sight of the Lord, and he shall lift you up.
    web: Humble yourselves in the sight of the Lord, and he will exalt you.
    people:
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.11
    name: James 4:11
    apiRef: James4:11
    book: Jas
    chapter: 4
    verse: 11
    text: 'Speak not evil one of another, brethren. He that speaketh evil of his brother, and judgeth his brother, speaketh evil of the law, and judgeth the law: but if thou judge the law, thou art not a doer of the law, but a judge.'
    web: Don’t speak against one another, brothers. He who speaks against a brother and judges his brother, speaks against the law and judges the law. But if you judge the law, you are not a doer of the law but a judge.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.12
    name: James 4:12
    apiRef: James4:12
    book: Jas
    chapter: 4
    verse: 12
    text: 'There is one lawgiver, who is able to save and to destroy: who art thou that judgest another?'
    web: Only one is the lawgiver, who is able to save and to destroy. But who are you to judge another?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.13
    name: James 4:13
    apiRef: James4:13
    book: Jas
    chapter: 4
    verse: 13
    text: 'Go to now, ye that say, To day or to morrow we will go into such a city, and continue there a year, and buy and sell, and get gain:'
    web: Come now, you who say, “Today or tomorrow let’s go into this city and spend a year there, trade, and make a profit.”
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.14
    name: James 4:14
    apiRef: James4:14
    book: Jas
    chapter: 4
    verse: 14
    text: Whereas ye know not what shall be on the morrow. For what is your life? It is even a vapour, that appeareth for a little time, and then vanisheth away.
    web: Yet you don’t know what your life will be like tomorrow. For what is your life? For you are a vapor that appears for a little time and then vanishes away.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.15
    name: James 4:15
    apiRef: James4:15
    book: Jas
    chapter: 4
    verse: 15
    text: For that ye ought to say, If the Lord will, we shall live, and do this, or that.
    web: For you ought to say, “If the Lord wills, we will both live, and do this or that.”
    people:
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.16
    name: James 4:16
    apiRef: James4:16
    book: Jas
    chapter: 4
    verse: 16
    text: 'But now ye rejoice in your boastings: all such rejoicing is evil.'
    web: But now you glory in your boasting. All such boasting is evil.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.17
    name: James 4:17
    apiRef: James4:17
    book: Jas
    chapter: 4
    verse: 17
    text: Therefore to him that knoweth to do good, and doeth it not, to him it is sin.
    web: To him therefore who knows to do good and doesn’t do it, to him it is sin.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.5.1
    name: James 5:1
    apiRef: James5:1
    book: Jas
    chapter: 5
    verse: 1
    text: Go to now, ye rich men, weep and howl for your miseries that shall come upon you.
    web: Come now, you rich, weep and howl for your miseries that are coming on you.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.2
    name: James 5:2
    apiRef: James5:2
    book: Jas
    chapter: 5
    verse: 2
    text: Your riches are corrupted, and your garments are motheaten.
    web: Your riches are corrupted and your garments are moth-eaten.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.3
    name: James 5:3
    apiRef: James5:3
    book: Jas
    chapter: 5
    verse: 3
    text: Your gold and silver is cankered; and the rust of them shall be a witness against you, and shall eat your flesh as it were fire. Ye have heaped treasure together for the last days.
    web: Your gold and your silver are corroded, and their corrosion will be for a testimony against you and will eat your flesh like fire. You have laid up your treasure in the last days.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.4
    name: James 5:4
    apiRef: James5:4
    book: Jas
    chapter: 5
    verse: 4
    text: 'Behold, the hire of the labourers who have reaped down your fields, which is of you kept back by fraud, crieth: and the cries of them which have reaped are entered into the ears of the Lord of sabaoth.'
    web: Behold, the wages of the laborers who mowed your fields, which you have kept back by fraud, cry out; and the cries of those who reaped have entered into the ears of the Lord of Armies.
    people:
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.5
    name: James 5:5
    apiRef: James5:5
    book: Jas
    chapter: 5
    verse: 5
    text: Ye have lived in pleasure on the earth, and been wanton; ye have nourished your hearts, as in a day of slaughter.
    web: You have lived in luxury on the earth, and taken your pleasure. You have nourished your hearts as in a day of slaughter.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.6
    name: James 5:6
    apiRef: James5:6
    book: Jas
    chapter: 5
    verse: 6
    text: Ye have condemned and killed the just; and he doth not resist you.
    web: You have condemned and you have murdered the righteous one. He doesn’t resist you.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.7
    name: James 5:7
    apiRef: James5:7
    book: Jas
    chapter: 5
    verse: 7
    text: Be patient therefore, brethren, unto the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, and hath long patience for it, until he receive the early and latter rain.
    web: Be patient therefore, brothers, until the coming of the Lord. Behold, the farmer waits for the precious fruit of the earth, being patient over it, until it receives the early and late rain.
    people:
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.8
    name: James 5:8
    apiRef: James5:8
    book: Jas
    chapter: 5
    verse: 8
    text: 'Be ye also patient; stablish your hearts: for the coming of the Lord draweth nigh.'
    web: You also be patient. Establish your hearts, for the coming of the Lord is at hand.
    people:
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.9
    name: James 5:9
    apiRef: James5:9
    book: Jas
    chapter: 5
    verse: 9
    text: 'Grudge not one against another, brethren, lest ye be condemned: behold, the judge standeth before the door.'
    web: Don’t grumble, brothers, against one another, so that you won’t be judged. Behold, the judge stands at the door.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.10
    name: James 5:10
    apiRef: James5:10
    book: Jas
    chapter: 5
    verse: 10
    text: Take, my brethren, the prophets, who have spoken in the name of the Lord, for an example of suffering affliction, and of patience.
    web: Take, brothers, for an example of suffering and of perseverance, the prophets who spoke in the name of the Lord.
    people:
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.11
    name: James 5:11
    apiRef: James5:11
    book: Jas
    chapter: 5
    verse: 11
    text: Behold, we count them happy which endure. Ye have heard of the patience of Job, and have seen the end of the Lord; that the Lord is very pitiful, and of tender mercy.
    web: Behold, we call them blessed who endured. You have heard of the perseverance of Job and have seen the Lord in the outcome, and how the Lord is full of compassion and mercy.
    people:
    - job_1639
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
  data:
    osis: Jas.5.12
    name: James 5:12
    apiRef: James5:12
    book: Jas
    chapter: 5
    verse: 12
    text: 'But above all things, my brethren, swear not, neither by heaven, neither by the earth, neither by any other oath: but let your yea be yea; and your nay, nay; lest ye fall into condemnation.'
    web: But above all things, my brothers, don’t swear—not by heaven, or by the earth, or by any other oath; but let your “yes” be “yes”, and your “no”, “no”, so that you don’t fall into hypocrisy.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.5
- type: Verse
