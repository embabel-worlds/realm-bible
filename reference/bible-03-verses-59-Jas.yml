  data:
    osis: Jas.2.26
    name: James 2:26
    apiRef: James2:26
    book: Jas
    chapter: 2
    verse: 26
    text: For as the body without the spirit is dead, so faith without works is dead also.
    web: For as the body apart from the spirit is dead, even so faith apart from works is dead.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.2
- type: Verse
  data:
    osis: Jas.3.1
    name: James 3:1
    apiRef: James3:1
    book: Jas
    chapter: 3
    verse: 1
    text: My brethren, be not many masters, knowing that we shall receive the greater condemnation.
    web: Let not many of you be teachers, my brothers, knowing that we will receive heavier judgment.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.2
    name: James 3:2
    apiRef: James3:2
    book: Jas
    chapter: 3
    verse: 2
    text: For in many things we offend all. If any man offend not in word, the same is a perfect man, and able also to bridle the whole body.
    web: For we all stumble in many things. Anyone who doesn’t stumble in word is a perfect person, able to bridle the whole body also.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.3
    name: James 3:3
    apiRef: James3:3
    book: Jas
    chapter: 3
    verse: 3
    text: Behold, we put bits in the horses’ mouths, that they may obey us; and we turn about their whole body.
    web: Indeed, we put bits into the horses’ mouths so that they may obey us, and we guide their whole body.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.4
    name: James 3:4
    apiRef: James3:4
    book: Jas
    chapter: 3
    verse: 4
    text: Behold also the ships, which though they be so great, and are driven of fierce winds, yet are they turned about with a very small helm, whithersoever the governor listeth.
    web: Behold, the ships also, though they are so big and are driven by fierce winds, are yet guided by a very small rudder, wherever the pilot desires.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.5
    name: James 3:5
    apiRef: James3:5
    book: Jas
    chapter: 3
    verse: 5
    text: Even so the tongue is a little member, and boasteth great things. Behold, how great a matter a little fire kindleth!
    web: So the tongue is also a little member, and boasts great things. See how a small fire can spread to a large forest!
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.6
    name: James 3:6
    apiRef: James3:6
    book: Jas
    chapter: 3
    verse: 6
    text: 'And the tongue is a fire, a world of iniquity: so is the tongue among our members, that it defileth the whole body, and setteth on fire the course of nature; and it is set on fire of hell.'
    web: And the tongue is a fire. The world of iniquity among our members is the tongue, which defiles the whole body, and sets on fire the course of nature, and is set on fire by Gehenna.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.7
    name: James 3:7
    apiRef: James3:7
    book: Jas
    chapter: 3
    verse: 7
    text: 'For every kind of beasts, and of birds, and of serpents, and of things in the sea, is tamed, and hath been tamed of mankind:'
    web: For every kind of animal, bird, creeping thing, and sea creature is tamed, and has been tamed by mankind;
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.8
    name: James 3:8
    apiRef: James3:8
    book: Jas
    chapter: 3
    verse: 8
    text: But the tongue can no man tame; it is an unruly evil, full of deadly poison.
    web: but nobody can tame the tongue. It is a restless evil, full of deadly poison.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.9
    name: James 3:9
    apiRef: James3:9
    book: Jas
    chapter: 3
    verse: 9
    text: Therewith bless we God, even the Father; and therewith curse we men, which are made after the similitude of God.
    web: With it we bless our God and Father, and with it we curse men who are made in the image of God.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.10
    name: James 3:10
    apiRef: James3:10
    book: Jas
    chapter: 3
    verse: 10
    text: Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be.
    web: Out of the same mouth comes blessing and cursing. My brothers, these things ought not to be so.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.11
    name: James 3:11
    apiRef: James3:11
    book: Jas
    chapter: 3
    verse: 11
    text: Doth a fountain send forth at the same place sweet water and bitter?
    web: Does a spring send out from the same opening fresh and bitter water?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.12
    name: James 3:12
    apiRef: James3:12
    book: Jas
    chapter: 3
    verse: 12
    text: Can the fig tree, my brethren, bear olive berries? either a vine, figs? so can no fountain both yield salt water and fresh.
    web: Can a fig tree, my brothers, yield olives, or a vine figs? Thus no spring yields both salt water and fresh water.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.13
    name: James 3:13
    apiRef: James3:13
    book: Jas
    chapter: 3
    verse: 13
    text: Who is a wise man and endued with knowledge among you? let him shew out of a good conversation his works with meekness of wisdom.
    web: Who is wise and understanding among you? Let him show by his good conduct that his deeds are done in gentleness of wisdom.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.14
    name: James 3:14
    apiRef: James3:14
    book: Jas
    chapter: 3
    verse: 14
    text: But if ye have bitter envying and strife in your hearts, glory not, and lie not against the truth.
    web: But if you have bitter jealousy and selfish ambition in your heart, don’t boast and don’t lie against the truth.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.15
    name: James 3:15
    apiRef: James3:15
    book: Jas
    chapter: 3
    verse: 15
    text: This wisdom descendeth not from above, but is earthly, sensual, devilish.
    web: This wisdom is not that which comes down from above, but is earthly, sensual, and demonic.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.16
    name: James 3:16
    apiRef: James3:16
    book: Jas
    chapter: 3
    verse: 16
    text: For where envying and strife is, there is confusion and every evil work.
    web: For where jealousy and selfish ambition are, there is confusion and every evil deed.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.17
    name: James 3:17
    apiRef: James3:17
    book: Jas
    chapter: 3
    verse: 17
    text: But the wisdom that is from above is first pure, then peaceable, gentle, and easy to be intreated, full of mercy and good fruits, without partiality, and without hypocrisy.
    web: But the wisdom that is from above is first pure, then peaceful, gentle, reasonable, full of mercy and good fruits, without partiality, and without hypocrisy.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.3.18
    name: James 3:18
    apiRef: James3:18
    book: Jas
    chapter: 3
    verse: 18
    text: And the fruit of righteousness is sown in peace of them that make peace.
    web: Now the fruit of righteousness is sown in peace by those who make peace.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.3
- type: Verse
  data:
    osis: Jas.4.1
    name: James 4:1
    apiRef: James4:1
    book: Jas
    chapter: 4
    verse: 1
    text: From whence come wars and fightings among you? come they not hence, even of your lusts that war in your members?
    web: Where do wars and fightings among you come from? Don’t they come from your pleasures that war in your members?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.2
    name: James 4:2
    apiRef: James4:2
    book: Jas
    chapter: 4
    verse: 2
    text: 'Ye lust, and have not: ye kill, and desire to have, and cannot obtain: ye fight and war, yet ye have not, because ye ask not.'
    web: You lust, and don’t have. You murder and covet, and can’t obtain. You fight and make war. You don’t have, because you don’t ask.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.3
    name: James 4:3
    apiRef: James4:3
    book: Jas
    chapter: 4
    verse: 3
    text: Ye ask, and receive not, because ye ask amiss, that ye may consume it upon your lusts.
    web: You ask, and don’t receive, because you ask with wrong motives, so that you may spend it on your pleasures.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.4
    name: James 4:4
    apiRef: James4:4
    book: Jas
    chapter: 4
    verse: 4
    text: Ye adulterers and adulteresses, know ye not that the friendship of the world is enmity with God? whosoever therefore will be a friend of the world is the enemy of God.
    web: You adulterers and adulteresses, don’t you know that friendship with the world is hostility toward God? Whoever therefore wants to be a friend of the world makes himself an enemy of God.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.5
    name: James 4:5
    apiRef: James4:5
    book: Jas
    chapter: 4
    verse: 5
    text: Do ye think that the scripture saith in vain, The spirit that dwelleth in us lusteth to envy?
    web: Or do you think that the Scripture says in vain, “The Spirit who lives in us yearns jealously”?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
- type: Verse
  data:
    osis: Jas.4.6
    name: James 4:6
    apiRef: James4:6
    book: Jas
    chapter: 4
    verse: 6
    text: But he giveth more grace. Wherefore he saith, God resisteth the proud, but giveth grace unto the humble.
    web: But he gives more grace. Therefore it says, “God resists the proud, but gives grace to the humble.”
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.4
