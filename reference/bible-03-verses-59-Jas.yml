  data:
    osis: Jas.2.25
    name: James 2:25
    apiRef: James2:25
    book: Jas
    chapter: 2
    verse: 25
    text: Likewise also was not Rahab the harlot justified by works, when she had received the messengers, and had sent them out another way?
    web: In the same way, wasn’t Rahab the prostitute also justified by works when she received the messengers and sent them out another way?
    people:
    - rahab_2388
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Jas.2
