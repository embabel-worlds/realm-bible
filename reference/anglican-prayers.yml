
# The Prayers and Thanksgivings of the Prayer Book (pages 814-841): seventy prayers and eleven
# thanksgivings, by number, with the heading each stands under. The Book of Common Prayer (1979), the Episcopal Church — public domain.
# Source: https://www.bcponline.org/Misc/Prayers.html and Thanksgivings.html . Generated by scripts/anglican/build_texts.py.

- type: "BcpPrayer"
  data:
    key: "prayer-1"
    kind: "prayer"
    number: 1
    name: "For Joy in God's Creation"
    category: "Prayers for the World"
    text: "O heavenly Father, who hast filled the world with beauty: Open our eyes to behold thy gracious hand in all thy works; that, rejoicing in thy whole creation, we may learn to serve thee with gladness; for the sake of him through whom all things were made, thy Son Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-2"
    kind: "prayer"
    number: 2
    name: "For All Sorts and Conditions of Men"
    category: "Prayers for the World"
    text: "O God, the creator and preserver of all mankind, we humbly beseech thee for all sorts and conditions of men; that thou wouldest be pleased to make thy ways known unto them, thy"
- type: "BcpPrayer"
  data:
    key: "prayer-3"
    kind: "prayer"
    number: 3
    name: "For the Human Family"
    category: "Prayers for the World"
    text: "O God, you made us in your own image and redeemed us through Jesus your Son: Look with compassion on the whole human family; take away the arrogance and hatred which infect our hearts; break down the walls that separate us; unite us in bonds of love; and work through our struggle and confusion to accomplish your purposes on earth; that, in your good time, all nations and races may serve you in harmony around your heavenly throne; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-4"
    kind: "prayer"
    number: 4
    name: "For Peace"
    category: "Prayers for the World"
    text: "Eternal God, in whose perfect kingdom no sword is drawn but the sword of righteousness, no strength known but the strength of love: So mightily spread abroad your Spirit, that all peoples may be gathered under the banner of the Prince of Peace, as children of one Father; to whom be dominion and glory, now and for ever. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-5"
    kind: "prayer"
    number: 5
    name: "For Peace Among the Nations"
    category: "Prayers for the World"
    text: "Almighty God our heavenly Father, guide the nations of the world into the way of justice and truth, and establish among them that peace which is the fruit of righteousness, that they may become the kingdom of our Lord and Savior Jesus Christ. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-6"
    kind: "prayer"
    number: 6
    name: "For our Enemies"
    category: "Prayers for the World"
    text: "O God, the Father of all, whose Son commanded us to love our enemies: Lead them and us from prejudice to truth: deliver them and us from hatred, cruelty, and revenge; and in your good time enable us all to stand reconciled before you, through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-7"
    kind: "prayer"
    number: 7
    name: "For the Church"
    category: "Prayers for the Church"
    text: "Gracious Father, we pray for thy holy Catholic Church. Fill it with all truth, in all truth with all peace. Where it is corrupt, purify it; where it is in error, direct it; where in any thing it is amiss, reform it. Where it is right, strengthen it; where it is in want, provide for it; where it is divided, reunite it; for the sake of Jesus Christ thy Son our Savior. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-8"
    kind: "prayer"
    number: 8
    name: "For the Mission of the Church"
    category: "Prayers for the Church"
    text: "Everliving God, whose will it is that all should come to you through your Son Jesus Christ: Inspire our witness to him, that all may know the power of his forgiveness and the hope"
- type: "BcpPrayer"
  data:
    key: "prayer-9"
    kind: "prayer"
    number: 9
    name: "Clergy and People"
    category: "Prayers for the Church"
    text: "Almighty and everlasting God, from whom cometh every good and perfect gift: Send down upon our bishops, and other clergy, and upon the congregations committed to their charge, the healthful Spirit of thy grace: and, that they may truly please thee, pour upon them the continual dew of thy blessing. Grant this, O Lord, for the honor of our Advocate and Mediator, Jesus Christ. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-10"
    kind: "prayer"
    number: 10
    name: "For the Diocese"
    category: "Prayers for the Church"
    text: "O God, by your grace you have called us in this Diocese to a goodly fellowship of faith. Bless our Bishops(s) N. [and N.], and other clergy, and all our people. Grant that your Word may be truly preached and truly heard, your Sacraments faithfully administered and faithfully received. By your Spirit, fashion our lives according to the example of your Son, and grant that we may show the power of your love to all among whom we live; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-11"
    kind: "prayer"
    number: 11
    name: "For the Parish"
    category: "Prayers for the Church"
    text: "Almighty and everliving God, ruler of all things in heaven and earth, hear our prayers for this parish family. Strengthen the faithful, arouse the careless, and restore the penitent. Grant us all things necessary for our common life, and bring us all to be of one heart and mind within your holy Church; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-12"
    kind: "prayer"
    number: 12
    name: "For a Church Convention or Meeting"
    category: "Prayers for the Church"
    text: "Almighty and everliving God, source of all wisdom and understanding, be present with those who take counsel [in ___________] for the renewal and mission of your Church. Teach us in all things to seek first your honor and glory. Guide us to perceive what is right, and grant us both the courage to pursue it and the grace to accomplish it; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-13"
    kind: "prayer"
    number: 13
    name: "For the Election of a Bishop or other Minister"
    category: "Prayers for the Church"
    text: "Almighty God, giver of every good gift: Look graciously on your Church, and so guide the minds of those who shall choose a bishop for this Diocese (or, rector for this parish), that we may receive a faithful pastor, who will care for your people and equip us for our ministries; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-14"
    kind: "prayer"
    number: 14
    name: "For the Unity of the Church"
    category: "Prayers for the Church"
    text: "O God the Father of our Lord Jesus Christ, our only Savior, the Prince of Peace: Give us grace seriously to lay to heart the great dangers we are in by our unhappy divisions; take away all hatred and prejudice, and whatever else may hinder us from godly union and concord; that, as there is but one Body and one Spirit, one hope of our calling, one Lord, one Faith, one Baptism, one God and Father of us all, so we may be all of one heart and of one soul, united in one holy bond of truth and peace, of faith and charity, and may with one mind and one mouth glorify thee; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-15"
    kind: "prayer"
    number: 15
    name: "For those about to be Baptized or to renew their Baptismal Covenant"
    category: "Prayers for the Church"
    text: "O God, you prepared your disciples for the coming of the Spirit through the teaching of your Son Jesus Christ: Make the hearts and minds of your servants ready to receive the blessing of the Holy Spirit, that they may be filled with the strength of his presence; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-16"
    kind: "prayer"
    number: 16
    name: "For Monastic Orders and Vocations"
    category: "Prayers for the Church"
    text: "O Lord Jesus Christ, you became poor for our sake, that we might be made rich through your poverty: Guide and sanctify, we pray, those whom you call to follow you under the vows of poverty, chastity, and obedience, that by their prayer and service they may enrich your Church, and by their life and worship may glorify your Name; for you reign with the Father and the Holy Spirit, one God, now and for ever. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-17"
    kind: "prayer"
    number: 17
    name: "For Church Musicians and Artists"
    category: "Prayers for the Church"
    text: "O God, whom saints and angels delight to worship in heaven: Be ever present with your servants who seek through art and music to perfect the praises offered by your people on earth; and grant to them even now glimpses of your beauty, and make them worthy at length to behold it unveiled for evermore; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-18"
    kind: "prayer"
    number: 18
    name: "For our Country"
    category: "Prayers for National Life"
    text: "Almighty God, who hast given us this good land for our heritage: We humbly beseech thee that we may always prove ourselves a people mindful of thy favor and glad to do thy will. Bless our land with honorable industry, sound learning, and pure manners. Save us from violence, discord, and confusion; from pride and arrogance, and from every evil way. Defend our liberties, and fashion into one united people the multitudes brought hither out of many kindreds and tongues. Endue with the spirit of wisdom those to whom in thy Name we entrust the authority of government, that there may be justice and peace at home, and that, through obedience to thy law, we may show forth thy praise among the nations of the earth. In the time of prosperity, fill our hearts with thankfulness, and in the day of trouble, suffer not our trust in thee to fail; all which we ask through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-19"
    kind: "prayer"
    number: 19
    name: "For the President of the United States and all in Civil Authority"
    category: "Prayers for National Life"
    text: "O Lord our Governor, whose glory is in all the world: We commend this nation to thy merciful care, that, being guided by thy Providence, we may dwell secure in thy peace. Grant to the President of the United States, the Governor of this State (or Commonwealth), and to all in authority, wisdom and strength to know and to do thy will. Fill them with the love of truth and righteousness, and make them ever mindful of their calling to serve this people in thy fear; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, world without end. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-20"
    kind: "prayer"
    number: 20
    name: "For Congress or a State Legislature"
    category: "Prayers for National Life"
    text: "O God, the fountain of wisdom, whose will is good and gracious, and whose law is truth: We beseech thee so to guide and bless our Senators and Representatives in Congress assembled (or in the Legislature of this State, or Commonwealth), that they may enact such laws as shall please thee, to the glory of thy Name and the welfare of this people; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-21"
    kind: "prayer"
    number: 21
    name: "For Courts of Justice"
    category: "Prayers for National Life"
    text: "Almighty God, who sittest in the throne judging right: We humbly beseech thee to bless the courts of justice and the magistrates in all this land; and give unto them the spirit of wisdom and understanding, that they may discern the truth, and impartially administer the law in the fear of thee alone; through him who shall come to be our Judge, thy Son our Savior Jesus Christ. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-22"
    kind: "prayer"
    number: 22
    name: "For Sound Government"
    category: "Prayers for National Life"
    text: "O Lord our Governor, bless the leaders of our land, that we may be a people at peace among ourselves and a blessing to other nations of the earth. Lord, keep this nation under your care.\nTo the President and members of the Cabinet, to Governors of States, Mayors of Cities, and to all in administrative authority, grant wisdom and grace in the exercise of their duties. Give grace to your servants, O Lord."
- type: "BcpPrayer"
  data:
    key: "prayer-23"
    kind: "prayer"
    number: 23
    name: "For Local Government"
    category: "Prayers for National Life"
    text: "Almighty God our heavenly Father, send down upon those who hold office in this State (Commonwealth, City, County, Town, ____________) the spirit of wisdom, charity, and justice; that with steadfast purpose they may faithfully serve in their offices to promote the well-being of all people; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-24"
    kind: "prayer"
    number: 24
    name: "For an Election"
    category: "Prayers for National Life"
    text: "Almighty God, to whom we must account for all our powers and privileges: Guide the people of the United States (or of this community) in the election of officials and representatives; that, by faithful administration and wise laws, the rights of all may be protected and our nation be enabled to fulfill your purposes; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-25"
    kind: "prayer"
    number: 25
    name: "For those in the Armed Forces of our Country"
    category: "Prayers for National Life"
    text: "Almighty God, we commend to your gracious care and keeping all the men and women of our armed forces at home and abroad. Defend them day by day with your heavenly grace; strengthen them in their trials and temptations; give them courage to face the perils which beset them; and grant them a sense of your abiding presence wherever they may be; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-26"
    kind: "prayer"
    number: 26
    name: "For those who suffer for the sake of Conscience"
    category: "Prayers for National Life"
    text: "O God our Father, whose Son forgave his enemies while he was suffering shame and death: Strengthen those who suffer for the sake of conscience; when they are accused, save them from speaking in hate; when they are rejected, save them from bitterness; when they are imprisoned, save them from despair; and to us your servants, give grace to respect their witness and to discern the truth, that our society may be cleansed and strengthened. This we ask for the sake of Jesus Christ, our merciful and righteous Judge. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-27"
    kind: "prayer"
    number: 27
    name: "For Social Justice"
    category: "Prayers for the Social Order"
    text: "Grant, O God, that your holy and life-giving Spirit may so move every human heart [and especially the hearts of the people of this land], that barriers which divide us may crumble, suspicions disappear, and hatreds cease; that our divisions being healed, we may live in justice and peace; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-28"
    kind: "prayer"
    number: 28
    name: "In Times of Conflict"
    category: "Prayers for the Social Order"
    text: "O God, you have bound us together in a common life. Help us, in the midst of our struggles for justice and truth, to confront one another without hatred or bitterness, and to work together with mutual forbearance and respect; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-29"
    kind: "prayer"
    number: 29
    name: "For Agriculture"
    category: "Prayers for the Social Order"
    text: "Almighty God, we thank you for making the earth fruitful, so that it might produce what is needed for life: Bless those who work in the fields; give us seasonable weather; and grant that we may all share the fruits of the earth, rejoicing in your goodness; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-30"
    kind: "prayer"
    number: 30
    name: "For the Unemployed"
    category: "Prayers for the Social Order"
    text: "Heavenly Father, we remember before you those who suffer want and anxiety from lack of work. Guide the people of this land so to use our public and private wealth that all may find suitable and fulfilling employment, and receive just payment for their labor; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-31"
    kind: "prayer"
    number: 31
    name: "For Schools and Colleges"
    category: "Prayers for the Social Order"
    text: "O Eternal God, bless all schools, colleges, and universities [and especially ___________], that they may be lively centers for sound learning, new discovery, and the pursuit of wisdom; and grant that those who teach and those who learn may find you to be the source of all truth; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-32"
    kind: "prayer"
    number: 32
    name: "For the Good Use of Leisure"
    category: "Prayers for the Social Order"
    text: "O God, in the course of this busy life, give us times of refreshment and peace; and grant that we may so use our leisure to rebuild our bodies and renew our minds, that our spirits may be opened to the goodness of your creation; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-33"
    kind: "prayer"
    number: 33
    name: "For Cities"
    category: "Prayers for the Social Order"
    text: "Heavenly Father, in your Word you have given us a vision of that holy City to which the nations of the world bring their glory: Behold and visit, we pray, the cities of the earth. Renew the ties of mutual regard which form our civic life. Send us honest and able leaders. Enable us to eliminate poverty, prejudice, and oppression, that peace may prevail with righteousness, and justice with order, and that men and women from different cultures and with differing talents may find with one another the fulfillment of their humanity; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-34"
    kind: "prayer"
    number: 34
    name: "For Towns and Rural Areas"
    category: "Prayers for the Social Order"
    text: "Lord Christ, when you came among us, you proclaimed the kingdom of God in villages, towns, and lonely places: Grant that your presence and power may be known throughout this land. Have mercy upon all of us who live and work in rural areas [especially ___________]; and grant that all the people of our nation may give thanks to you for food and drink and all other bodily necessities of life, respect those who labor to produce them, and honor the land and the water from which these good things come. All this we ask in your holy Name. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-35"
    kind: "prayer"
    number: 35
    name: "For the Poor and the Neglected"
    category: "Prayers for the Social Order"
    text: "Almighty and most merciful God, we remember before you all poor and neglected persons whom it would be easy for us to forget: the homeless and the destitute, the old and the sick, and all who have none to care for them. Help us to heal those who are broken in body or spirit, and to turn their sorrow into joy. Grant this, Father, for the love of your Son, who for our sake became poor, Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-36"
    kind: "prayer"
    number: 36
    name: "For the Oppressed"
    category: "Prayers for the Social Order"
    text: "Look with pity, O heavenly Father, upon the people in this land who live with injustice, terror, disease, and death as their constant companions. Have mercy upon us. Help us to eliminate our cruelty to these our neighbors. Strengthen those who spend their lives establishing equal protection of the law and equal opportunities for all. And grant that every one of us may enjoy a fair portion of the riches of this land; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-37"
    kind: "prayer"
    number: 37
    name: "For Prisons and Correctional Institutions"
    category: "Prayers for the Social Order"
    text: "Lord Jesus, for our sake you were condemned as a criminal: Visit our jails and prisons with your pity and judgment. Remember all prisoners, and bring the guilty to repentance and amendment of life according to your will, and give them hope for their future. When any are held unjustly, bring them release; forgive us, and teach us to improve our justice. Remember those who work in these institutions; keep them humane and compassionate; and save them from becoming brutal or callous. And since what we do for those in prison, O Lord, we do for you, constrain us to improve their lot. All this we ask for your mercy's sake. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-38"
    kind: "prayer"
    number: 38
    name: "For the Right Use of God's Gifts"
    category: "Prayers for the Social Order"
    text: "Almighty God, whose loving hand hath given us all that we possess: Grant us grace that we may honor thee with our substance, and, remembering the account which we must one day give, may be faithful stewards of thy bounty, through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-39"
    kind: "prayer"
    number: 39
    name: "For those who Influence Public Opinion"
    category: "Prayers for the Social Order"
    text: "Almighty God, you proclaim your truth in every age by many voices: Direct, in our time, we pray, those who speak where many listen and write what many read; that they may do their part in making the heart of this people wise, its mind sound, and its will righteous; to the honor of Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-40"
    kind: "prayer"
    number: 40
    name: "For Knowledge of God's Creation"
    category: "Prayers for the Natural Order"
    text: "Almighty and everlasting God, you made the universe with all its marvelous order, its atoms, worlds, and galaxies, and the infinite complexity of living creatures: Grant that, as we probe the mysteries of your creation, we may come to know you more truly, and more surely fulfill our role in your eternal purpose; in the name of Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-41"
    kind: "prayer"
    number: 41
    name: "For the Conservation of Natural Resources"
    category: "Prayers for the Natural Order"
    text: "Almighty God, in giving us dominion over things on earth, you made us fellow workers in your creation: Give us wisdom and reverence so to use the resources of nature, that no one may suffer from our abuse of them, and that generations yet to come may continue to praise you for your bounty; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-42"
    kind: "prayer"
    number: 42
    name: "For the Harvest of Lands and Waters"
    category: "Prayers for the Natural Order"
    text: "O gracious Father, who openest thine hand and fillest all things living with plenteousness: Bless the lands and waters, and multiply the harvests of the world; let thy Spirit go forth, that it may renew the face of the earth; show thy loving-kindness, that our land may give her increase; and save us from selfish use of what thou givest, that men and women everywhere may give thee thanks; through Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-43"
    kind: "prayer"
    number: 43
    name: "For Rain"
    category: "Prayers for the Natural Order"
    text: "O God, heavenly Father, who by thy Son Jesus Christ hast promised to all those who seek thy kingdom and its righteousness all things necessary to sustain their life: Send us, we entreat thee, in this time of need, such moderate rain and showers, that we may receive the fruits of the earth, to our comfort and to thy honor; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-44"
    kind: "prayer"
    number: 44
    name: "For the Future of the Human Race"
    category: "Prayers for the Natural Order"
    text: "O God our heavenly Father, you have blessed us and given us dominion over all the earth: Increase our reverence before the mystery of life; and give us new insight into your purposes for the human race, and new wisdom and determination in making provision for its future in accordance with your will; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-45"
    kind: "prayer"
    number: 45
    name: "For Families"
    category: "Prayers for Family and Personal Life"
    text: "Almighty God, our heavenly Father, who settest the solitary in families: We commend to thy continual care the homes in which thy people dwell. Put far from them, we beseech thee,"
- type: "BcpPrayer"
  data:
    key: "prayer-46"
    kind: "prayer"
    number: 46
    name: "For the Care of Children"
    category: "Prayers for Family and Personal Life"
    text: "Almighty God, heavenly Father, you have blessed us with the joy and care of children: Give us calm strength and patient wisdom as we bring them up, that we may teach them to love whatever is just and true and good, following the example of our Savior Jesus Christ. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-47"
    kind: "prayer"
    number: 47
    name: "For Young Persons"
    category: "Prayers for Family and Personal Life"
    text: "God our Father, you see your children growing up in an unsteady and confusing world: Show them that your ways give more life than the ways of the world, and that following you is better than chasing after selfish goals. Help them to take failure, not as a measure of their worth, but as a chance for a new start. Give them strength to hold their faith in you, and to keep alive their joy in your creation; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-48"
    kind: "prayer"
    number: 48
    name: "For Those Who Live Alone"
    category: "Prayers for Family and Personal Life"
    text: "Almighty God, whose Son had nowhere to lay his head: Grant that those who live alone may not be lonely in their solitude, but that, following in his steps, they may find fulfillment in loving you and their neighbors; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-49"
    kind: "prayer"
    number: 49
    name: "For the Aged"
    category: "Prayers for Family and Personal Life"
    text: "Look with mercy, O God our Father, on all whose increasing years bring them weakness, distress, or isolation. Provide for them homes of dignity and peace; give them understanding helpers, and the willingness to accept help; and, as their strength diminishes, increase their faith and their assurance of your love. This we ask in the name of Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-50"
    kind: "prayer"
    number: 50
    name: "For a Birthday"
    category: "Prayers for Family and Personal Life"
    text: "O God, our times are in your hand: Look with favor, we pray, on your servant N. as he begins another year. Grant that he may grow in wisdom and grace, and strengthen his trust in your goodness all the days of his life; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-51"
    kind: "prayer"
    number: 51
    name: "For a Birthday"
    category: "Prayers for Family and Personal Life"
    text: "Watch over thy child, O Lord, as his days increase; bless and guide him wherever he may be. Strengthen him when he stands; comfort him when discouraged or sorrowful; raise him up if he fall; and in his heart may thy peace which passeth understanding abide all the days of his life; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-52"
    kind: "prayer"
    number: 52
    name: "For the Absent"
    category: "Prayers for Family and Personal Life"
    text: "O God, whose fatherly care reacheth to the uttermost parts of the earth: We humbly beseech thee graciously to behold and bless those whom we love, now absent from us. Defend them from all dangers of soul and body; and grant that both they and we, drawing nearer to thee, may be bound together by thy love in the communion of thy Holy Spirit, and in the fellowship of thy saints; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-53"
    kind: "prayer"
    number: 53
    name: "For Travelers"
    category: "Prayers for Family and Personal Life"
    text: "O God, our heavenly Father, whose glory fills the whole creation, and whose presence we find wherever we go: Preserve those who travel [in particular _______________]; surround them with your loving care; protect them from every danger; and bring them in safety to their journey's end; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-54"
    kind: "prayer"
    number: 54
    name: "For those we Love"
    category: "Prayers for Family and Personal Life"
    text: "Almighty God, we entrust all who are dear to us to thy never-failing care and love, for this life and the life to come, knowing that thou art doing for them better things than we can desire or pray for; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-55"
    kind: "prayer"
    number: 55
    name: "For a Person in Trouble or Bereavement"
    category: "Prayers for Family and Personal Life"
    text: "O merciful Father, who hast taught us in thy holy Word that thou dost not willingly afflict or grieve the children of men: Look with pity upon the sorrows of thy servant for whom our prayers are offered. Remember him, O Lord, in mercy, nourish his soul with patience, comfort him with a sense of thy goodness, lift up thy countenance upon him, and give him peace; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-56"
    kind: "prayer"
    number: 56
    name: "For the Victims of Addiction"
    category: "Prayers for Family and Personal Life"
    text: "O blessed Lord, you ministered to all who came to you: Look with compassion upon all who through addiction have lost their health and freedom. Restore to them the assurance of your unfailing mercy; remove from them the fears that beset them; strengthen them in the work of their recovery; and to those who care for them, give patient understanding and persevering love. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-57"
    kind: "prayer"
    number: 57
    name: "For Guidance"
    category: "Prayers for Family and Personal Life"
    text: "Direct us, O Lord, in all our doings with thy most gracious favor, and further us with thy continual help; that in all our works begun, continued, and ended in thee, we may glorify thy holy Name, and finally, by thy mercy, obtain everlasting life; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-58"
    kind: "prayer"
    number: 58
    name: "For Guidance"
    category: "Prayers for Family and Personal Life"
    text: "O God, by whom the meek are guided in judgment, and light riseth up in darkness for the godly: Grant us, in all our doubts and uncertainties, the grace to ask what thou wouldest have us to do, that the Spirit of wisdom may save us from all false choices, and that in thy light we may see light, and in thy straight path may not stumble; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-59"
    kind: "prayer"
    number: 59
    name: "For Quiet Confidence"
    category: "Prayers for Family and Personal Life"
    text: "O God of peace, who hast taught us that in returning and rest we shall be saved, in quietness and confidence shall be our strength: By the might of thy Spirit lift us, we pray thee, to thy presence, where we may be still and know that thou art God; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-60"
    kind: "prayer"
    number: 60
    name: "For Protection"
    category: "Prayers for Family and Personal Life"
    text: "Assist us mercifully, O Lord, in these our supplications and prayers, and dispose the way of thy servants towards the attainment of everlasting salvation; that, among all the changes and chances of this mortal life, they may ever be defended by thy gracious and ready help; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-61"
    kind: "prayer"
    number: 61
    name: "A Prayer of Self-Dedication"
    category: "Prayers for Family and Personal Life"
    text: "Almighty and eternal God, so draw our hearts to thee, so guide our minds, so fill our imaginations, so control our"
- type: "BcpPrayer"
  data:
    key: "prayer-62"
    kind: "prayer"
    number: 62
    name: "A Prayer attributed to St. Francis"
    category: "Prayers for Family and Personal Life"
    text: "Lord, make us instruments of your peace. Where there is hatred, let us sow love; where there is injury, pardon; where there is discord, union; where there is doubt, faith; where there is despair, hope; where there is darkness, light; where there is sadness, joy. Grant that we may not so much seek to be consoled as to console; to be understood as to understand; to be loved as to love. For it is in giving that we receive; it is in pardoning that we are pardoned; and it is in dying that we are born to eternal life. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-63"
    kind: "prayer"
    number: 63
    name: "In the Evening"
    category: "Other Prayers"
    text: "O Lord, support us all the day long, until the shadows lengthen, and the evening comes, and the busy world is hushed, and the fever of life is over, and our work is done. Then in thy mercy, grant us a safe lodging, and a holy rest, and peace at the last. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-64"
    kind: "prayer"
    number: 64
    name: "Before Worship"
    category: "Other Prayers"
    text: "O Almighty God, who pourest out on all who desire it the spirit of grace and of supplication: Deliver us, when we draw near to thee, from coldness of heart and wanderings of mind, that with steadfast thoughts and kindled affections we may worship thee in spirit and in truth; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-65"
    kind: "prayer"
    number: 65
    name: "For the Answering of Prayer"
    category: "Other Prayers"
    text: "Almighty God, who hast promised to hear the petitions of those who ask in thy Son's Name: We beseech thee mercifully to incline thine ear to us who have now made our prayers and supplications unto thee; and grant that those things which we have faithfully asked according to thy will, may effectually be obtained, to the relief of our necessity, and to the setting forth of thy glory; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-66"
    kind: "prayer"
    number: 66
    name: "Before Receiving Communion"
    category: "Other Prayers"
    text: "Be present, be present, O Jesus, our great High Priest, as you were present with your disciples, and be known to us in the breaking of bread; who live and reign with the Father and the Holy Spirit, now and for ever. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-67"
    kind: "prayer"
    number: 67
    name: "After Receiving Communion"
    category: "Other Prayers"
    text: "O Lord Jesus Christ, who in a wonderful Sacrament hast left unto us a memorial of thy passion: Grant us, we beseech thee, so to venerate the sacred mysteries of thy Body and Blood, that we may ever perceive within ourselves the fruit of thy redemption; who livest and reignest with the Father and the Holy Spirit, one God, for ever and ever. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-68"
    kind: "prayer"
    number: 68
    name: "After Worship"
    category: "Other Prayers"
    text: "Grant, we beseech thee, Almighty God, that the words which we have heard this day with our outward ears, may, through thy grace, be so grafted inwardly in our hearts, that they may bring forth in us the fruit of good living, to the honor and praise of thy Name; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-69"
    kind: "prayer"
    number: 69
    name: "On Sunday"
    category: "Other Prayers"
    text: "O God our King, by the resurrection of your Son Jesus Christ on the first day of the week, you conquered sin, put death to flight, and gave us the hope of everlasting life: Redeem all our days by this victory; forgive our sins, banish our fears, make us bold to praise you and to do your will; and steel us to wait for the consummation of your kingdom on the last great Day; through the same Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "prayer-70"
    kind: "prayer"
    number: 70
    name: "Grace at Meals"
    category: "Other Prayers"
    text: "Give us grateful hearts, our Father, for all thy mercies, and make us mindful of the needs of others; through Jesus Christ our Lord. Amen.\nor this\nBless, O Lord, thy gifts to our use and us to thy service; for Christ's sake. Amen.\nor this\nBlessed are you, O Lord God, King of the Universe, for you give us food to sustain our lives and make our hearts glad; through Jesus Christ our Lord. Amen.\nor this\nFor these and all his mercies, God's holy Name be blessed and praised; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "thanksgiving-1"
    kind: "thanksgiving"
    number: 1
    name: "A General Thanksgiving (1979 Version)"
    category: "General Thanksgivings"
    text: "Accept, O Lord, our thanks and praise for all that you have done for us. We thank you for the splendor of the whole creation, for the beauty of this world, for the wonder of life, and for the mystery of love.\nWe thank you for the blessing of family and friends, and for the loving care which surrounds us on every side.\nWe thank you for setting us at tasks which demand our best efforts, and for leading us to accomplishments which satisfy and delight us.\nWe thank you also for those disappointments and failures that lead us to acknowledge our dependence on you alone.\nAbove all, we thank you for your Son Jesus Christ; for the truth of his Word and the example of his life; for his steadfast obedience, by which he overcame temptation; for his dying, through which he overcame death; and for his rising to life again, in which we are raised to the life of your kingdom.\nGrant us the gift of your Spirit, that we may know him and make him known; and through him, at all times and in all places, may give thanks to you in all things. Amen.\n1. A General Thanksgiving (2007 Version)\nAccept, O Lord, our thanks and praise for all that you have done for us. We thank you for the splendor of the whole creation, for the beauty of this world, for the wonder of life, and for the mystery of love.\nWe thank you for the blessing of family and friends, and for the loving care which surrounds us on every side.\nWe thank you for setting us at tasks which demand our best efforts, and for leading us to accomplishments which satisfy and delight us.\nWe thank you also for those disappointments and failures that lead us to acknowledge our dependence on you alone.\nAbove all, we thank you for your Son Jesus Christ; for the truth of his Word and the example of his life; for his steadfast obedience, by which he overcame temptation; for his dying, through which he overcame death; and for his rising to life again, in which we are raised to the life of your kingdom.\nGrant us the gift of your Spirit, that we may know Christ and make him known; and through him, at all times and in all places, may give thanks to you in all things. Amen."
- type: "BcpPrayer"
  data:
    key: "thanksgiving-2"
    kind: "thanksgiving"
    number: 2
    name: "A Litany of Thanksgiving"
    category: "General Thanksgivings"
    text: ""
- type: "BcpPrayer"
  data:
    key: "thanksgiving-3"
    kind: "thanksgiving"
    number: 3
    name: "For the Mission of the Church"
    category: "Thanksgivings for the Church"
    text: "Almighty God, you sent your Son Jesus Christ to reconcile the world to yourself: We praise and bless you for those whom you have sent in the power of the Spirit to preach the Gospel to all nations. We thank you that in all parts of the earth a community of love has been gathered together by their prayers and labors, and that in every place your servants call upon your Name; for the kingdom and the power and the glory are yours for ever. Amen."
- type: "BcpPrayer"
  data:
    key: "thanksgiving-4"
    kind: "thanksgiving"
    number: 4
    name: "For the Saints and Faithful Departed"
    category: "Thanksgivings for the Church"
    text: "We give thanks to you, O Lord our God, for all your servants and witnesses of time past: for Abraham, the father of believers, and Sarah his wife; for Moses, the lawgiver, and Aaron, the priest; for Miriam and Joshua, Deborah and Gideon, and Samuel with Hannah his mother; for Isaiah and all the prophets; for Mary, the mother of our Lord; for Peter and Paul and all the apostles; for Mary and Martha, and Mary Magdalene; for Stephen, the first martyr, and all the martyrs and saints in every age and in every land. In your mercy, O Lord our God, give us, as you gave to them, the hope of salvation and the promise of eternal life; through Jesus Christ our Lord, the first-born of many from the dead. Amen."
- type: "BcpPrayer"
  data:
    key: "thanksgiving-5"
    kind: "thanksgiving"
    number: 5
    name: "For the Nation"
    category: "Thanksgivings for National Life"
    text: "Almighty God, giver of all good things: We thank you for the natural majesty and beauty of this land. They restore us, though we often destroy them. Heal us."
- type: "BcpPrayer"
  data:
    key: "thanksgiving-6"
    kind: "thanksgiving"
    number: 6
    name: "For Heroic Service"
    category: "Thanksgivings for National Life"
    text: "O Judge of the nations, we remember before you with grateful hearts the men and women of our country who in the day of decision ventured much for the liberties we now enjoy. Grant that we may not rest until all the people of this land share the benefits of true freedom and gladly accept its disciplines. This we ask in the Name of Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "thanksgiving-7"
    kind: "thanksgiving"
    number: 7
    name: "For the Diversity of Races and Cultures"
    category: "Thanksgiving for the Social Order"
    text: "O God, who created all peoples in your image, we thank you for the wonderful diversity of races and cultures in this world. Enrich our lives by ever-widening circles of fellowship, and show us your presence in those who differ most from us, until our knowledge of your love is made perfect in our love for all your children; through Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "thanksgiving-8"
    kind: "thanksgiving"
    number: 8
    name: "For the Beauty of the Earth"
    category: "Thanksgivings for the Natural Order"
    text: "We give you thanks, most gracious God, for the beauty of earth and sky and sea; for the richness of mountains, plains, and rivers; for the songs of birds and the loveliness of flowers. We praise you for these good gifts, and pray that we may safeguard them for our posterity. Grant that we may continue to grow in our grateful enjoyment of your abundant creation, to the honor and glory of your Name, now and for ever. Amen."
- type: "BcpPrayer"
  data:
    key: "thanksgiving-9"
    kind: "thanksgiving"
    number: 9
    name: "For the Harvest"
    category: "Thanksgivings for the Natural Order"
    text: "Most gracious God, by whose knowledge the depths are broken up and the clouds drop down the dew: We yield thee hearty thanks and praise for the return of seed time and harvest, for the increase of the ground and the gathering in of its fruits, and for all other blessings of thy merciful providence bestowed upon this nation and people. And, we beseech thee, give us a just sense of these great mercies, such as may appear in our lives by a humble, holy, and obedient walking before thee all our days; through Jesus Christ our Lord, to whom, with thee and the Holy Ghost be all glory and honor, world without end. Amen."
- type: "BcpPrayer"
  data:
    key: "thanksgiving-10"
    kind: "thanksgiving"
    number: 10
    name: "For the Gift of a Child"
    category: "Thanksgivings for Family and Personal Life"
    text: "Heavenly Father, you sent; your own Son into this world. We thank you for the life of this child, N., entrusted to our care. Help us to remember that we are all your children, and so to love and nurture him, that he may attain to that full stature intended for him in your eternal kingdom; for the sake of your dear Son, Jesus Christ our Lord. Amen."
- type: "BcpPrayer"
  data:
    key: "thanksgiving-11"
    kind: "thanksgiving"
    number: 11
    name: "For the Restoration of Health"
    category: "Thanksgivings for Family and Personal Life"
    text: "Almighty God and heavenly Father, we give thee humble thanks because thou hast been graciously pleased to deliver from his sickness thy servant N., in whose behalf we bless and praise thy Name. Grant, O gracious Father, that he, through thy help, may live in this world according to thy will, and also be partaker of everlasting glory in the life to come; through Jesus Christ our Lord. Amen."
