  data:
    osis: Rom.8.12
    name: Romans 8:12
    apiRef: Romans8:12
    book: Rom
    chapter: 8
    verse: 12
    text: Therefore, brethren, we are debtors, not to the flesh, to live after the flesh.
    web: So then, brothers, we are debtors, not to the flesh, to live after the flesh.
