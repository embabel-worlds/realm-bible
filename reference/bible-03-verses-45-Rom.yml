  data:
    osis: Rom.8.10
    name: Romans 8:10
    apiRef: Romans8:10
    book: Rom
    chapter: 8
    verse: 10
    text: And if Christ be in you, the body is dead because of sin; but the Spirit is life because of righteousness.
    web: If Christ is in you, the body is dead because of sin, but the spirit is alive because of righteousness.
    people:
    - holy_spirit_7400
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
- type: Verse
  data:
    osis: Rom.8.11
    name: Romans 8:11
    apiRef: Romans8:11
    book: Rom
    chapter: 8
    verse: 11
    text: But if the Spirit of him that raised up Jesus from the dead dwell in you, he that raised up Christ from the dead shall also quicken your mortal bodies by his Spirit that dwelleth in you.
    web: But if the Spirit of him who raised up Jesus from the dead dwells in you, he who raised up Christ Jesus from the dead will also give life to your mortal bodies through his Spirit who dwells in you.
    people:
    - holy_spirit_7400
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
