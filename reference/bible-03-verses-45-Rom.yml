  data:
    osis: Rom.8.5
    name: Romans 8:5
    apiRef: Romans8:5
    book: Rom
    chapter: 8
    verse: 5
    text: For they that are after the flesh do mind the things of the flesh; but they that are after the Spirit the things of the Spirit.
    web: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, the things of the Spirit.
    people:
    - holy_spirit_7400
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
- type: Verse
  data:
    osis: Rom.8.6
    name: Romans 8:6
    apiRef: Romans8:6
    book: Rom
    chapter: 8
    verse: 6
    text: For to be carnally minded is death; but to be spiritually minded is life and peace.
    web: For the mind of the flesh is death, but the mind of the Spirit is life and peace;
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
- type: Verse
  data:
    osis: Rom.8.7
    name: Romans 8:7
    apiRef: Romans8:7
    book: Rom
    chapter: 8
    verse: 7
    text: 'Because the carnal mind is enmity against God: for it is not subject to the law of God, neither indeed can be.'
    web: because the mind of the flesh is hostile toward God, for it is not subject to God’s law, neither indeed can it be.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
- type: Verse
  data:
    osis: Rom.8.8
    name: Romans 8:8
    apiRef: Romans8:8
    book: Rom
    chapter: 8
    verse: 8
    text: So then they that are in the flesh cannot please God.
    web: Those who are in the flesh can’t please God.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
- type: Verse
  data:
    osis: Rom.8.9
    name: Romans 8:9
    apiRef: Romans8:9
    book: Rom
    chapter: 8
    verse: 9
    text: But ye are not in the flesh, but in the Spirit, if so be that the Spirit of God dwell in you. Now if any man have not the Spirit of Christ, he is none of his.
    web: But you are not in the flesh but in the Spirit, if it is so that the Spirit of God dwells in you. But if any man doesn’t have the Spirit of Christ, he is not his.
    people:
    - god_1324
    - holy_spirit_7400
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
