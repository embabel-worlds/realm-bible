    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.13
    name: Romans 6:13
    apiRef: Romans6:13
    book: Rom
    chapter: 6
    verse: 13
    text: 'Neither yield ye your members as instruments of unrighteousness unto sin: but yield yourselves unto God, as those that are alive from the dead, and your members as instruments of righteousness unto God.'
    web: Also, do not present your members to sin as instruments of unrighteousness, but present yourselves to God as alive from the dead, and your members as instruments of righteousness to God.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.14
    name: Romans 6:14
    apiRef: Romans6:14
    book: Rom
    chapter: 6
    verse: 14
    text: 'For sin shall not have dominion over you: for ye are not under the law, but under grace.'
    web: For sin will not have dominion over you, for you are not under law, but under grace.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.15
    name: Romans 6:15
    apiRef: Romans6:15
    book: Rom
    chapter: 6
    verse: 15
    text: What then? shall we sin, because we are not under the law, but under grace? God forbid.
    web: What then? Shall we sin because we are not under law but under grace? May it never be!
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.16
    name: Romans 6:16
    apiRef: Romans6:16
    book: Rom
    chapter: 6
    verse: 16
    text: Know ye not, that to whom ye yield yourselves servants to obey, his servants ye are to whom ye obey; whether of sin unto death, or of obedience unto righteousness?
    web: Don’t you know that when you present yourselves as servants and obey someone, you are the servants of whomever you obey, whether of sin to death, or of obedience to righteousness?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.17
    name: Romans 6:17
    apiRef: Romans6:17
    book: Rom
    chapter: 6
    verse: 17
    text: But God be thanked, that ye were the servants of sin, but ye have obeyed from the heart that form of doctrine which was delivered you.
    web: But thanks be to God that, whereas you were bondservants of sin, you became obedient from the heart to that form of teaching to which you were delivered.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.18
    name: Romans 6:18
    apiRef: Romans6:18
    book: Rom
    chapter: 6
    verse: 18
    text: Being then made free from sin, ye became the servants of righteousness.
    web: Being made free from sin, you became bondservants of righteousness.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.19
    name: Romans 6:19
    apiRef: Romans6:19
    book: Rom
    chapter: 6
    verse: 19
    text: 'I speak after the manner of men because of the infirmity of your flesh: for as ye have yielded your members servants to uncleanness and to iniquity unto iniquity; even so now yield your members servants to righteousness unto holiness.'
    web: I speak in human terms because of the weakness of your flesh; for as you presented your members as servants to uncleanness and to wickedness upon wickedness, even so now present your members as servants to righteousness for sanctification.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.20
    name: Romans 6:20
    apiRef: Romans6:20
    book: Rom
    chapter: 6
    verse: 20
    text: For when ye were the servants of sin, ye were free from righteousness.
    web: For when you were servants of sin, you were free from righteousness.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.21
    name: Romans 6:21
    apiRef: Romans6:21
    book: Rom
    chapter: 6
    verse: 21
    text: What fruit had ye then in those things whereof ye are now ashamed? for the end of those things is death.
    web: What fruit then did you have at that time in the things of which you are now ashamed? For the end of those things is death.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.22
    name: Romans 6:22
    apiRef: Romans6:22
    book: Rom
    chapter: 6
    verse: 22
    text: But now being made free from sin, and become servants to God, ye have your fruit unto holiness, and the end everlasting life.
    web: But now, being made free from sin and having become servants of God, you have your fruit of sanctification and the result of eternal life.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.6.23
    name: Romans 6:23
    apiRef: Romans6:23
    book: Rom
    chapter: 6
    verse: 23
    text: For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord.
    web: For the wages of sin is death, but the free gift of God is eternal life in Christ Jesus our Lord.
    people:
    - god_1324
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.6
- type: Verse
  data:
    osis: Rom.7.1
    name: Romans 7:1
    apiRef: Romans7:1
    book: Rom
    chapter: 7
    verse: 1
    text: Know ye not, brethren, (for I speak to them that know the law,) how that the law hath dominion over a man as long as he liveth?
    web: Or don’t you know, brothers (for I speak to men who know the law), that the law has dominion over a man for as long as he lives?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.2
    name: Romans 7:2
    apiRef: Romans7:2
    book: Rom
    chapter: 7
    verse: 2
    text: For the woman which hath an husband is bound by the law to her husband so long as he liveth; but if the husband be dead, she is loosed from the law of her husband.
    web: For the woman that has a husband is bound by law to the husband while he lives, but if the husband dies, she is discharged from the law of the husband.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.3
    name: Romans 7:3
    apiRef: Romans7:3
    book: Rom
    chapter: 7
    verse: 3
    text: 'So then if, while her husband liveth, she be married to another man, she shall be called an adulteress: but if her husband be dead, she is free from that law; so that she is no adulteress, though she be married to another man.'
    web: So then if, while the husband lives, she is joined to another man, she would be called an adulteress. But if the husband dies, she is free from the law, so that she is no adulteress, though she is joined to another man.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.4
    name: Romans 7:4
    apiRef: Romans7:4
    book: Rom
    chapter: 7
    verse: 4
    text: Wherefore, my brethren, ye also are become dead to the law by the body of Christ; that ye should be married to another, even to him who is raised from the dead, that we should bring forth fruit unto God.
    web: Therefore, my brothers, you also were made dead to the law through the body of Christ, that you would be joined to another, to him who was raised from the dead, that we might produce fruit to God.
    people:
    - god_1324
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.5
    name: Romans 7:5
    apiRef: Romans7:5
    book: Rom
    chapter: 7
    verse: 5
    text: For when we were in the flesh, the motions of sins, which were by the law, did work in our members to bring forth fruit unto death.
    web: For when we were in the flesh, the sinful passions which were through the law worked in our members to bring out fruit to death.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.6
    name: Romans 7:6
    apiRef: Romans7:6
    book: Rom
    chapter: 7
    verse: 6
    text: But now we are delivered from the law, that being dead wherein we were held; that we should serve in newness of spirit, and not in the oldness of the letter.
    web: But now we have been discharged from the law, having died to that in which we were held; so that we serve in newness of the spirit, and not in oldness of the letter.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.7
    name: Romans 7:7
    apiRef: Romans7:7
    book: Rom
    chapter: 7
    verse: 7
    text: 'What shall we say then? Is the law sin? God forbid. Nay, I had not known sin, but by the law: for I had not known lust, except the law had said, Thou shalt not covet.'
    web: What shall we say then? Is the law sin? May it never be! However, I wouldn’t have known sin except through the law. For I wouldn’t have known coveting unless the law had said, “You shall not covet.”
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.8
    name: Romans 7:8
    apiRef: Romans7:8
    book: Rom
    chapter: 7
    verse: 8
    text: But sin, taking occasion by the commandment, wrought in me all manner of concupiscence. For without the law sin was dead.
    web: But sin, finding occasion through the commandment, produced in me all kinds of coveting. For apart from the law, sin is dead.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.9
    name: Romans 7:9
    apiRef: Romans7:9
    book: Rom
    chapter: 7
    verse: 9
    text: 'For I was alive without the law once: but when the commandment came, sin revived, and I died.'
    web: I was alive apart from the law once, but when the commandment came, sin revived and I died.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.10
    name: Romans 7:10
    apiRef: Romans7:10
    book: Rom
    chapter: 7
    verse: 10
    text: And the commandment, which was ordained to life, I found to be unto death.
    web: The commandment which was for life, this I found to be for death;
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.11
    name: Romans 7:11
    apiRef: Romans7:11
    book: Rom
    chapter: 7
    verse: 11
    text: For sin, taking occasion by the commandment, deceived me, and by it slew me.
    web: for sin, finding occasion through the commandment, deceived me, and through it killed me.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.12
    name: Romans 7:12
    apiRef: Romans7:12
    book: Rom
    chapter: 7
    verse: 12
    text: Wherefore the law is holy, and the commandment holy, and just, and good.
    web: Therefore the law indeed is holy, and the commandment holy, righteous, and good.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.13
    name: Romans 7:13
    apiRef: Romans7:13
    book: Rom
    chapter: 7
    verse: 13
    text: Was then that which is good made death unto me? God forbid. But sin, that it might appear sin, working death in me by that which is good; that sin by the commandment might become exceeding sinful.
    web: Did then that which is good become death to me? May it never be! But sin, that it might be shown to be sin, was producing death in me through that which is good; that through the commandment sin might become exceedingly sinful.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.14
    name: Romans 7:14
    apiRef: Romans7:14
    book: Rom
    chapter: 7
    verse: 14
    text: 'For we know that the law is spiritual: but I am carnal, sold under sin.'
    web: For we know that the law is spiritual, but I am fleshly, sold under sin.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.15
    name: Romans 7:15
    apiRef: Romans7:15
    book: Rom
    chapter: 7
    verse: 15
    text: 'For that which I do I allow not: for what I would, that do I not; but what I hate, that do I.'
    web: For I don’t understand what I am doing. For I don’t practice what I desire to do; but what I hate, that I do.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
