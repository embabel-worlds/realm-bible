  data:
    osis: Rom.7.24
    name: Romans 7:24
    apiRef: Romans7:24
    book: Rom
    chapter: 7
    verse: 24
    text: O wretched man that I am! who shall deliver me from the body of this death?
    web: What a wretched man I am! Who will deliver me out of the body of this death?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.25
    name: Romans 7:25
    apiRef: Romans7:25
    book: Rom
    chapter: 7
    verse: 25
    text: I thank God through Jesus Christ our Lord. So then with the mind I myself serve the law of God; but with the flesh the law of sin.
    web: I thank God through Jesus Christ, our Lord! So then with the mind, I myself serve God’s law, but with the flesh, sin’s law.
    people:
    - god_1324
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
