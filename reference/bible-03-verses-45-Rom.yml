    osis: Rom.7.23
    name: Romans 7:23
    apiRef: Romans7:23
    book: Rom
    chapter: 7
    verse: 23
    text: But I see another law in my members, warring against the law of my mind, and bringing me into captivity to the law of sin which is in my members.
    web: but I see a different law in my members, warring against the law of my mind, and bringing me into captivity under the law of sin which is in my members.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
