    apiRef: Romans8:1
    book: Rom
    chapter: 8
    verse: 1
    text: There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit.
    web: There is therefore now no condemnation to those who are in Christ Jesus, who don’t walk according to the flesh, but according to the Spirit.
    people:
    - holy_spirit_7400
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
