  data:
    osis: Rom.8.2
    name: Romans 8:2
    apiRef: Romans8:2
    book: Rom
    chapter: 8
    verse: 2
    text: For the law of the Spirit of life in Christ Jesus hath made me free from the law of sin and death.
    web: For the law of the Spirit of life in Christ Jesus made me free from the law of sin and of death.
    people:
    - holy_spirit_7400
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
- type: Verse
  data:
    osis: Rom.8.3
    name: Romans 8:3
    apiRef: Romans8:3
    book: Rom
    chapter: 8
    verse: 3
    text: 'For what the law could not do, in that it was weak through the flesh, God sending his own Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh:'
    web: For what the law couldn’t do, in that it was weak through the flesh, God did, sending his own Son in the likeness of sinful flesh and for sin, he condemned sin in the flesh,
    people:
    - god_1324
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
- type: Verse
  data:
    osis: Rom.8.4
    name: Romans 8:4
    apiRef: Romans8:4
    book: Rom
    chapter: 8
    verse: 4
    text: That the righteousness of the law might be fulfilled in us, who walk not after the flesh, but after the Spirit.
    web: that the ordinance of the law might be fulfilled in us who don’t walk according to the flesh, but according to the Spirit.
    people:
    - holy_spirit_7400
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.8
