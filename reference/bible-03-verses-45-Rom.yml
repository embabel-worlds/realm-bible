  data:
    osis: Rom.7.16
    name: Romans 7:16
    apiRef: Romans7:16
    book: Rom
    chapter: 7
    verse: 16
    text: If then I do that which I would not, I consent unto the law that it is good.
    web: But if what I don’t desire, that I do, I consent to the law that it is good.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.17
    name: Romans 7:17
    apiRef: Romans7:17
    book: Rom
    chapter: 7
    verse: 17
    text: Now then it is no more I that do it, but sin that dwelleth in me.
    web: So now it is no more I that do it, but sin which dwells in me.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.18
    name: Romans 7:18
    apiRef: Romans7:18
    book: Rom
    chapter: 7
    verse: 18
    text: 'For I know that in me (that is, in my flesh,) dwelleth no good thing: for to will is present with me; but how to perform that which is good I find not.'
    web: For I know that in me, that is, in my flesh, dwells no good thing. For desire is present with me, but I don’t find it doing that which is good.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.19
    name: Romans 7:19
    apiRef: Romans7:19
    book: Rom
    chapter: 7
    verse: 19
    text: 'For the good that I would I do not: but the evil which I would not, that I do.'
    web: For the good which I desire, I don’t do; but the evil which I don’t desire, that I practice.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.20
    name: Romans 7:20
    apiRef: Romans7:20
    book: Rom
    chapter: 7
    verse: 20
    text: Now if I do that I would not, it is no more I that do it, but sin that dwelleth in me.
    web: But if what I don’t desire, that I do, it is no more I that do it, but sin which dwells in me.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.21
    name: Romans 7:21
    apiRef: Romans7:21
    book: Rom
    chapter: 7
    verse: 21
    text: I find then a law, that, when I would do good, evil is present with me.
    web: I find then the law that, while I desire to do good, evil is present.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
- type: Verse
  data:
    osis: Rom.7.22
    name: Romans 7:22
    apiRef: Romans7:22
    book: Rom
    chapter: 7
    verse: 22
    text: 'For I delight in the law of God after the inward man:'
    web: For I delight in God’s law after the inward person,
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Rom.7
