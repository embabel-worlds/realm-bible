  data:
    osis: Zech.9.9
    name: Zechariah 9:9
    apiRef: Zechariah9:9
    book: Zech
    chapter: 9
    verse: 9
    text: 'Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy King cometh unto thee: he is just, and having salvation; lowly, and riding upon an ass, and upon a colt the foal of an ass.'
    web: Rejoice greatly, daughter of Zion! Shout, daughter of Jerusalem! Behold, your King comes to you! He is righteous, and having salvation; lowly, and riding on a donkey, even on a colt, the foal of a donkey.
    people:
