    apiRef: Zechariah10:1
    book: Zech
    chapter: 10
    verse: 1
    text: Ask ye of the LORD rain in the time of the latter rain; so the LORD shall make bright clouds, and give them showers of rain, to every one grass in the field.
    web: Ask of the LORD rain in the spring time, the LORD who makes storm clouds, and he gives rain showers to everyone for the plants in the field.
    people:
