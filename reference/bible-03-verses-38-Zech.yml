    apiRef: Zechariah9:14
    book: Zech
    chapter: 9
    verse: 14
    text: 'And the LORD shall be seen over them, and his arrow shall go forth as the lightning: and the Lord GOD shall blow the trumpet, and shall go with whirlwinds of the south.'
    web: The LORD will be seen over them. His arrow will flash like lightning. The Lord GOD will blow the trumpet, and will go with whirlwinds of the south.
