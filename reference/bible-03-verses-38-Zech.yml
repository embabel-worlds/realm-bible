    name: Zechariah 9:8
    apiRef: Zechariah9:8
    book: Zech
    chapter: 9
    verse: 8
    text: 'And I will encamp about mine house because of the army, because of him that passeth by, and because of him that returneth: and no oppressor shall pass through them any more: for now have I seen with mine eyes.'
    web: 'I will encamp around my house against the army, that no one pass through or return; and no oppressor will pass through them any more: for now I have seen with my eyes.'
    event: Prophecies of Zechariah
  relations:
