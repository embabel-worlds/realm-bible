  data:
    osis: Zech.11.5
    name: Zechariah 11:5
    apiRef: Zechariah11:5
    book: Zech
    chapter: 11
    verse: 5
    text: 'Whose possessors slay them, and hold themselves not guilty: and they that sell them say, Blessed be the LORD; for I am rich: and their own shepherds pity them not.'
    web: Their buyers slaughter them and go unpunished. Those who sell them say, ‘Blessed be the LORD, for I am rich;’ and their own shepherds don’t pity them.
    people:
    - god_1324
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.11
- type: Verse
  data:
    osis: Zech.11.6
    name: Zechariah 11:6
    apiRef: Zechariah11:6
    book: Zech
    chapter: 11
    verse: 6
    text: 'For I will no more pity the inhabitants of the land, saith the LORD: but, lo, I will deliver the men every one into his neighbour’s hand, and into the hand of his king: and they shall smite the land, and out of their hand I will not deliver them.'
    web: For I will no more pity the inhabitants of the land,” says the LORD; “but, behold, I will deliver every one of the men into his neighbor’s hand and into the hand of his king. They will strike the land, and out of their hand I will not deliver them.”
    people:
    - god_1324
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.11
- type: Verse
  data:
    osis: Zech.11.7
    name: Zechariah 11:7
    apiRef: Zechariah11:7
    book: Zech
    chapter: 11
    verse: 7
    text: And I will feed the flock of slaughter, even you, O poor of the flock. And I took unto me two staves; the one I called Beauty, and the other I called Bands; and I fed the flock.
    web: So I fed the flock to be slaughtered, especially the oppressed of the flock. I took for myself two staffs. The one I called “Favor” and the other I called “Union”, and I fed the flock.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.11
- type: Verse
  data:
    osis: Zech.11.8
    name: Zechariah 11:8
    apiRef: Zechariah11:8
    book: Zech
    chapter: 11
    verse: 8
    text: Three shepherds also I cut off in one month; and my soul lothed them, and their soul also abhorred me.
    web: I cut off the three shepherds in one month; for my soul was weary of them, and their soul also loathed me.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.11
- type: Verse
  data:
    osis: Zech.11.9
    name: Zechariah 11:9
    apiRef: Zechariah11:9
    book: Zech
    chapter: 11
    verse: 9
    text: 'Then said I, I will not feed you: that that dieth, let it die; and that that is to be cut off, let it be cut off; and let the rest eat every one the flesh of another.'
    web: Then I said, “I will not feed you. That which dies, let it die; and that which is to be cut off, let it be cut off; and let those who are left eat each other’s flesh.”
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.11
