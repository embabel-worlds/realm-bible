    name: Zechariah 9:11
    apiRef: Zechariah9:11
    book: Zech
    chapter: 9
    verse: 11
    text: As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water.
    web: As for you also, because of the blood of your covenant, I have set free your prisoners from the pit in which is no water.
    event: Prophecies of Zechariah
