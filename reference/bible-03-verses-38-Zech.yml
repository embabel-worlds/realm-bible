  data:
    osis: Zech.10.9
    name: Zechariah 10:9
    apiRef: Zechariah10:9
    book: Zech
    chapter: 10
    verse: 9
    text: 'And I will sow them among the people: and they shall remember me in far countries; and they shall live with their children, and turn again.'
    web: I will sow them among the peoples. They will remember me in far countries. They will live with their children and will return.
    event: Prophecies of Zechariah
  relations:
