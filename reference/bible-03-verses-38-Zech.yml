  data:
    osis: Zech.10.8
    name: Zechariah 10:8
    apiRef: Zechariah10:8
    book: Zech
    chapter: 10
    verse: 8
    text: 'I will hiss for them, and gather them; for I have redeemed them: and they shall increase as they have increased.'
    web: I will signal for them and gather them, for I have redeemed them. They will increase as they were before.
    event: Prophecies of Zechariah
  relations:
