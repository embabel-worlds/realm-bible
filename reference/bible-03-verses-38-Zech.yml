    name: Zechariah 10:6
    apiRef: Zechariah10:6
    book: Zech
    chapter: 10
    verse: 6
    text: 'And I will strengthen the house of Judah, and I will save the house of Joseph, and I will bring them again to place them; for I have mercy upon them: and they shall be as though I had not cast them off: for I am the LORD their God, and will hear them.'
    web: “I will strengthen the house of Judah, and I will save the house of Joseph. I will bring them back, for I have mercy on them. They will be as though I had not cast them off, for I am the LORD their God, and I will hear them.
    people:
    - joseph_1710
    - god_1324
