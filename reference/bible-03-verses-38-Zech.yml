    name: Zechariah 11:11
    apiRef: Zechariah11:11
    book: Zech
    chapter: 11
    verse: 11
    text: 'And it was broken in that day: and so the poor of the flock that waited upon me knew that it was the word of the LORD.'
    web: It was broken in that day; and thus the poor of the flock that listened to me knew that it was the LORD’s word.
