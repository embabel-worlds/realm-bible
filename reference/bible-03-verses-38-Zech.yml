    apiRef: Zechariah9:17
    book: Zech
    chapter: 9
    verse: 17
    text: For how great is his goodness, and how great is his beauty! corn shall make the young men cheerful, and new wine the maids.
    web: For how great is his goodness, and how great is his beauty! Grain will make the young men flourish, and new wine the virgins.
