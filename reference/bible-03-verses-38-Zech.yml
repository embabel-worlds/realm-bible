  data:
    osis: Zech.10.10
    name: Zechariah 10:10
    apiRef: Zechariah10:10
    book: Zech
    chapter: 10
    verse: 10
    text: I will bring them again also out of the land of Egypt, and gather them out of Assyria; and I will bring them into the land of Gilead and Lebanon; and place shall not be found for them.
    web: I will bring them again also out of the land of Egypt, and gather them out of Assyria. I will bring them into the land of Gilead and Lebanon; and there won’t be room enough for them.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.10
- type: Verse
  data:
    osis: Zech.10.11
    name: Zechariah 10:11
    apiRef: Zechariah10:11
    book: Zech
    chapter: 10
    verse: 11
    text: 'And he shall pass through the sea with affliction, and shall smite the waves in the sea, and all the deeps of the river shall dry up: and the pride of Assyria shall be brought down, and the sceptre of Egypt shall depart away.'
    web: He will pass through the sea of affliction, and will strike the waves in the sea, and all the depths of the Nile will dry up; and the pride of Assyria will be brought down, and the scepter of Egypt will depart.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.10
