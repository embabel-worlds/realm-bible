    name: Zechariah 14:11
    apiRef: Zechariah14:11
    book: Zech
    chapter: 14
    verse: 11
    text: And men shall dwell in it, and there shall be no more utter destruction; but Jerusalem shall be safely inhabited.
    web: Men will dwell therein, and there will be no more curse; but Jerusalem will dwell safely.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.14
- type: Verse
  data:
    osis: Zech.14.12
    name: Zechariah 14:12
    apiRef: Zechariah14:12
    book: Zech
    chapter: 14
    verse: 12
    text: And this shall be the plague wherewith the LORD will smite all the people that have fought against Jerusalem; Their flesh shall consume away while they stand upon their feet, and their eyes shall consume away in their holes, and their tongue shall consume away in their mouth.
    web: 'This will be the plague with which the LORD will strike all the peoples who have fought against Jerusalem: their flesh will consume away while they stand on their feet, and their eyes will consume away in their sockets, and their tongue will consume away in their mouth.'
    people:
    - god_1324
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.14
- type: Verse
  data:
    osis: Zech.14.13
    name: Zechariah 14:13
    apiRef: Zechariah14:13
    book: Zech
    chapter: 14
    verse: 13
    text: And it shall come to pass in that day, that a great tumult from the LORD shall be among them; and they shall lay hold every one on the hand of his neighbour, and his hand shall rise up against the hand of his neighbour.
    web: It will happen in that day that a great panic from the LORD will be among them; and they will each seize the hand of his neighbor, and his hand will rise up against the hand of his neighbor.
    people:
    - god_1324
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.14
- type: Verse
  data:
    osis: Zech.14.14
    name: Zechariah 14:14
    apiRef: Zechariah14:14
    book: Zech
    chapter: 14
    verse: 14
    text: And Judah also shall fight at Jerusalem; and the wealth of all the heathen round about shall be gathered together, gold, and silver, and apparel, in great abundance.
    web: 'Judah also will fight at Jerusalem; and the wealth of all the surrounding nations will be gathered together: gold, silver, and clothing, in great abundance.'
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.14
- type: Verse
  data:
    osis: Zech.14.15
    name: Zechariah 14:15
    apiRef: Zechariah14:15
    book: Zech
    chapter: 14
    verse: 15
    text: And so shall be the plague of the horse, of the mule, of the camel, and of the ass, and of all the beasts that shall be in these tents, as this plague.
    web: A plague like this will fall on the horse, on the mule, on the camel, on the donkey, and on all the animals that will be in those camps.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.14
- type: Verse
  data:
    osis: Zech.14.16
    name: Zechariah 14:16
    apiRef: Zechariah14:16
    book: Zech
    chapter: 14
    verse: 16
    text: And it shall come to pass, that every one that is left of all the nations which came against Jerusalem shall even go up from year to year to worship the King, the LORD of hosts, and to keep the feast of tabernacles.
    web: It will happen that everyone who is left of all the nations that came against Jerusalem will go up from year to year to worship the King, the LORD of Armies, and to keep the feast of booths.
    people:
    - god_1324
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.14
- type: Verse
  data:
    osis: Zech.14.17
    name: Zechariah 14:17
    apiRef: Zechariah14:17
    book: Zech
    chapter: 14
    verse: 17
    text: And it shall be, that whoso will not come up of all the families of the earth unto Jerusalem to worship the King, the LORD of hosts, even upon them shall be no rain.
    web: It will be that whoever of all the families of the earth doesn’t go up to Jerusalem to worship the King, the LORD of Armies, on them there will be no rain.
    people:
    - god_1324
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.14
- type: Verse
  data:
    osis: Zech.14.18
    name: Zechariah 14:18
    apiRef: Zechariah14:18
    book: Zech
    chapter: 14
    verse: 18
    text: And if the family of Egypt go not up, and come not, that have no rain; there shall be the plague, wherewith the LORD will smite the heathen that come not up to keep the feast of tabernacles.
    web: If the family of Egypt doesn’t go up and doesn’t come, neither will it rain on them. This will be the plague with which the LORD will strike the nations that don’t go up to keep the feast of booths.
    people:
    - god_1324
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.14
