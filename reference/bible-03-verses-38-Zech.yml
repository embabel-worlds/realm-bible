    name: Zechariah 9:12
    apiRef: Zechariah9:12
    book: Zech
    chapter: 9
    verse: 12
    text: 'Turn you to the strong hold, ye prisoners of hope: even to day do I declare that I will render double unto thee;'
    web: Turn to the stronghold, you prisoners of hope! Even today I declare that I will restore double to you.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.9
