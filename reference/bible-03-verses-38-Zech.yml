    name: Zechariah 10:3
    apiRef: Zechariah10:3
    book: Zech
    chapter: 10
    verse: 3
    text: 'Mine anger was kindled against the shepherds, and I punished the goats: for the LORD of hosts hath visited his flock the house of Judah, and hath made them as his goodly horse in the battle.'
    web: My anger is kindled against the shepherds, and I will punish the male goats, for the LORD of Armies has visited his flock, the house of Judah, and will make them as his majestic horse in the battle.
