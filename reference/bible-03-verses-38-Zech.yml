    name: Zechariah 10:7
    apiRef: Zechariah10:7
    book: Zech
    chapter: 10
    verse: 7
    text: 'And they of Ephraim shall be like a mighty man, and their heart shall rejoice as through wine: yea, their children shall see it, and be glad; their heart shall rejoice in the LORD.'
    web: Ephraim will be like a mighty man, and their heart will rejoice as through wine. Yes, their children will see it and rejoice. Their heart will be glad in the LORD.
    people:
