  data:
    osis: Zech.11.10
    name: Zechariah 11:10
    apiRef: Zechariah11:10
    book: Zech
    chapter: 11
    verse: 10
    text: And I took my staff, even Beauty, and cut it asunder, that I might break my covenant which I had made with all the people.
    web: I took my staff Favor and cut it apart, that I might break my covenant that I had made with all the peoples.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.11
