  data:
    osis: Zech.9.13
    name: Zechariah 9:13
    apiRef: Zechariah9:13
    book: Zech
    chapter: 9
    verse: 13
    text: When I have bent Judah for me, filled the bow with Ephraim, and raised up thy sons, O Zion, against thy sons, O Greece, and made thee as the sword of a mighty man.
    web: For indeed I bend Judah as a bow for me. I have loaded the bow with Ephraim. I will stir up your sons, Zion, against your sons, Greece, and will make you like the sword of a mighty man.
    people:
    - ephraim_1206
