    apiRef: Zechariah10:5
    book: Zech
    chapter: 10
    verse: 5
    text: 'And they shall be as mighty men, which tread down their enemies in the mire of the streets in the battle: and they shall fight, because the LORD is with them, and the riders on horses shall be confounded.'
    web: They will be as mighty men, treading down muddy streets in the battle. They will fight, because the LORD is with them. The riders on horses will be confounded.
    people:
    - god_1324
