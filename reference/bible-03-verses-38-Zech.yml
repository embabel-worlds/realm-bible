  data:
    osis: Zech.11.4
    name: Zechariah 11:4
    apiRef: Zechariah11:4
    book: Zech
    chapter: 11
    verse: 4
    text: Thus saith the LORD my God; Feed the flock of the slaughter;
    web: 'The LORD my God says: “Feed the flock of slaughter.'
    people:
    - god_1324
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.11
