    osis: Zech.11.1
    name: Zechariah 11:1
    apiRef: Zechariah11:1
    book: Zech
    chapter: 11
    verse: 1
    text: Open thy doors, O Lebanon, that the fire may devour thy cedars.
    web: Open your doors, Lebanon, that the fire may devour your cedars.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
