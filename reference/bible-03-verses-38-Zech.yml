    name: Zechariah 10:2
    apiRef: Zechariah10:2
    book: Zech
    chapter: 10
    verse: 2
    text: 'For the idols have spoken vanity, and the diviners have seen a lie, and have told false dreams; they comfort in vain: therefore they went their way as a flock, they were troubled, because there was no shepherd.'
    web: For the teraphim have spoken vanity, and the diviners have seen a lie; and they have told false dreams. They comfort in vain. Therefore they go their way like sheep. They are oppressed, because there is no shepherd.
