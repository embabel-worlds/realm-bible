  data:
    osis: Zech.10.12
    name: Zechariah 10:12
    apiRef: Zechariah10:12
    book: Zech
    chapter: 10
    verse: 12
    text: And I will strengthen them in the LORD; and they shall walk up and down in his name, saith the LORD.
    web: I will strengthen them in the LORD. They will walk up and down in his name,” says the LORD.
    people:
    - god_1324
    event: Prophecies of Zechariah
