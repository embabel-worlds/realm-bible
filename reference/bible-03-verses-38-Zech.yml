  data:
    osis: Zech.11.2
    name: Zechariah 11:2
    apiRef: Zechariah11:2
    book: Zech
    chapter: 11
    verse: 2
    text: 'Howl, fir tree; for the cedar is fallen; because the mighty are spoiled: howl, O ye oaks of Bashan; for the forest of the vintage is come down.'
    web: Wail, cypress tree, for the cedar has fallen, because the stately ones are destroyed. Wail, you oaks of Bashan, for the strong forest has come down.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.11
- type: Verse
  data:
    osis: Zech.11.3
    name: Zechariah 11:3
    apiRef: Zechariah11:3
    book: Zech
    chapter: 11
    verse: 3
    text: 'There is a voice of the howling of the shepherds; for their glory is spoiled: a voice of the roaring of young lions; for the pride of Jordan is spoiled.'
    web: A voice of the wailing of the shepherds! For their glory is destroyed—a voice of the roaring of young lions! For the pride of the Jordan is ruined.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.11
