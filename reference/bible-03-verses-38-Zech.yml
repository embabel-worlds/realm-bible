    apiRef: Zechariah9:6
    book: Zech
    chapter: 9
    verse: 6
    text: And a bastard shall dwell in Ashdod, and I will cut off the pride of the Philistines.
    web: Foreigners will dwell in Ashdod, and I will cut off the pride of the Philistines.
