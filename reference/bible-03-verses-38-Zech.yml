    name: Zechariah 14:20
    apiRef: Zechariah14:20
    book: Zech
    chapter: 14
    verse: 20
    text: In that day shall there be upon the bells of the horses, HOLINESS UNTO THE LORD; and the pots in the LORD’S house shall be like the bowls before the altar.
    web: In that day there will be inscribed on the bells of the horses, “HOLY TO THE LORD”; and the pots in the LORD’s house will be like the bowls before the altar.
    people:
    - god_1324
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.14
- type: Verse
  data:
    osis: Zech.14.21
    name: Zechariah 14:21
    apiRef: Zechariah14:21
    book: Zech
    chapter: 14
    verse: 21
    text: 'Yea, every pot in Jerusalem and in Judah shall be holiness unto the LORD of hosts: and all they that sacrifice shall come and take of them, and seethe therein: and in that day there shall be no more the Canaanite in the house of the LORD of hosts.'
    web: Yes, every pot in Jerusalem and in Judah will be holy to the LORD of Armies; and all those who sacrifice will come and take of them, and cook in them. In that day there will no longer be a Canaanite in the house of the LORD of Armies.
