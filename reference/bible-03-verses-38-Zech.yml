  data:
    osis: Zech.9.10
    name: Zechariah 9:10
    apiRef: Zechariah9:10
    book: Zech
    chapter: 9
    verse: 10
    text: 'And I will cut off the chariot from Ephraim, and the horse from Jerusalem, and the battle bow shall be cut off: and he shall speak peace unto the heathen: and his dominion shall be from sea even to sea, and from the river even to the ends of the earth.'
    web: I will cut off the chariot from Ephraim and the horse from Jerusalem. The battle bow will be cut off; and he will speak peace to the nations. His dominion will be from sea to sea, and from the River to the ends of the earth.
    people:
