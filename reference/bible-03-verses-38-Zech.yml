    apiRef: Zechariah9:16
    book: Zech
    chapter: 9
    verse: 16
    text: 'And the LORD their God shall save them in that day as the flock of his people: for they shall be as the stones of a crown, lifted up as an ensign upon his land.'
    web: The LORD their God will save them in that day as the flock of his people; for they are like the jewels of a crown, lifted on high over his land.
