    name: Zechariah 14:19
    apiRef: Zechariah14:19
    book: Zech
    chapter: 14
    verse: 19
    text: This shall be the punishment of Egypt, and the punishment of all nations that come not up to keep the feast of tabernacles.
    web: This will be the punishment of Egypt and the punishment of all the nations that don’t go up to keep the feast of booths.
    event: Prophecies of Zechariah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zech.14
