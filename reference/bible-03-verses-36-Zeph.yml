  data:
    osis: Zeph.2.14
    name: Zephaniah 2:14
    apiRef: Zephaniah2:14
    book: Zeph
    chapter: 2
    verse: 14
    text: 'And flocks shall lie down in the midst of her, all the beasts of the nations: both the cormorant and the bittern shall lodge in the upper lintels of it; their voice shall sing in the windows; desolation shall be in the thresholds: for he shall uncover the cedar work.'
    web: Herds will lie down in the middle of her, all kinds of animals. Both the pelican and the porcupine will lodge in its capitals. Their calls will echo through the windows. Desolation will be in the thresholds, for he has laid bare the cedar beams.
    event: Prophecies of Zephaniah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Zeph.2
- type: Verse
  data:
    osis: Zeph.2.15
    name: Zephaniah 2:15
    apiRef: Zephaniah2:15
    book: Zeph
    chapter: 2
    verse: 15
    text: 'This is the rejoicing city that dwelt carelessly, that said in her heart, I am, and there is none beside me: how is she become a desolation, a place for beasts to lie down in! every one that passeth by her shall hiss, and wag his hand.'
    web: This is the joyous city that lived carelessly, that said in her heart, “I am, and there is no one besides me.” How she has become a desolation, a place for animals to lie down in! Everyone who passes by her will hiss and shake their fists.
    event: Prophecies of Zephaniah
  relations:
