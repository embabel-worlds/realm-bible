- type: "CatechismEntry"
  data:
    key: "baltimore-2/1"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 1
    question: "Who made the world?"
    text: "God made the world."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/2"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 2
    question: "Who is God?"
    text: "God is the Creator of heaven and earth, and of all things."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/3"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 3
    question: "What is man?"
    text: "Man is a creature composed of body and soul, and made to the image and likeness of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/4"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 4
    question: "Is this likeness in the body or in the soul?"
    text: "This likeness is chiefly in the soul."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/5"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 5
    question: "How is the soul like to God?"
    text: "The soul is like God because it is a spirit that will never die, and has understanding and free will."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/6"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 6
    question: "Why did God make you?"
    text: "God made me to know Him, to love Him, and to serve Him in this world, and to be happy with Him forever in the next."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/7"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 7
    question: "Of which must we take more care, our soul or our body?"
    text: "We must take more care of our soul than of our body."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/8"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 8
    question: "Why must we take more care of our soul than of our body?"
    text: "We must take more care of our soul than of our body, because in losing our soul we lose God and everlasting happiness."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/9"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 9
    question: "What must we do to save our souls?"
    text: "To save our souls we must worship God by faith, hope, and charity; that is, we must believe in Him, hope in Him, and love Him with all our heart."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/10"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 10
    question: "How shall we know the things which we are to believe?"
    text: "We shall know the things which we are to believe from the Catholic Church, through which God speaks to us."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/11"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 11
    question: "Where shall we find the chief truths which the Church teaches?"
    text: "We shall find the chief truths which the Church teaches in the Apostles' Creed."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/12"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 1"
    partNumber: 1
    section: "On The End Of Man"
    number: 12
    question: "Say the Apostles' Creed."
    text: "I believe in God, the Father Almighty, Creator of heaven and earth; and in Jesus Christ, His only Son, our Lord; who was conceived by the Holy Ghost, born of the Virgin Mary, suffered under Pontius Pilate, was crucified; died, and was buried. He descended into hell: the third day He arose again from the dead: He ascended into heaven, and sitteth at the right hand of God, the Father Almighty; from thence He shall come to judge the living and the dead. I believe in the Holy Ghost, the Holy Catholic Church, the communion of Saints, the forgiveness of sins, the resurrection of the body, and the life everlasting. Amen."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/13"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 2"
    partNumber: 2
    section: "On God And His Perfections"
    number: 13
    question: "What is God?"
    text: "God is a spirit infinitely perfect."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/14"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 2"
    partNumber: 2
    section: "On God And His Perfections"
    number: 14
    question: "Had God a beginning?"
    text: "God had no beginning; He always was and He always will be."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/15"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 2"
    partNumber: 2
    section: "On God And His Perfections"
    number: 15
    question: "Where is God?"
    text: "God is everywhere."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/16"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 2"
    partNumber: 2
    section: "On God And His Perfections"
    number: 16
    question: "If God is everywhere, why do we not see Him?"
    text: "We do not see God, because He is a pure spirit and cannot be seen with bodily eyes."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/17"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 2"
    partNumber: 2
    section: "On God And His Perfections"
    number: 17
    question: "Does God see us?"
    text: "God sees us and watches over us."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/18"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 2"
    partNumber: 2
    section: "On God And His Perfections"
    number: 18
    question: "Does God know all things?"
    text: "God knows all things, even our most secret thoughts, words, and actions."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/19"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 2"
    partNumber: 2
    section: "On God And His Perfections"
    number: 19
    question: "Can God do all things?"
    text: "God can do all things, and nothing is hard or impossible to Him."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/20"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 2"
    partNumber: 2
    section: "On God And His Perfections"
    number: 20
    question: "Is God just, holy, and merciful?"
    text: "God is all just, all holy, all merciful, as He is infinitely perfect."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/21"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 21
    question: "Is there but one God?"
    text: "Yes; there is but one God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/22"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 22
    question: "Why can there be but one God?"
    text: "There can be but one God, because God, being supreme and infinite, cannot have an equal."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/23"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 23
    question: "How many Persons are there in God?"
    text: "In God there are three Divine Persons, really distinct, and equal in all things--the Father, the Son, and the Holy Ghost."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/24"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 24
    question: "Is the Father God?"
    text: "The Father is God and the first Person of the Blessed Trinity."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/25"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 25
    question: "Is the Son God?"
    text: "The Son is God and the second Person of the Blessed Trinity."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/26"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 26
    question: "Is the Holy Ghost God?"
    text: "The Holy Ghost is God and the third Person of the Blessed Trinity."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/27"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 27
    question: "What do you mean by the Blessed Trinity?"
    text: "By the Blessed Trinity I mean one God in three Divine Persons."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/28"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 28
    question: "Are the three Divine Persons equal in all things?"
    text: "The three Divine Persons are equal in all things."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/29"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 29
    question: "Are the three Divine Persons one and the same God?"
    text: "The three Divine Persons are one and the same God, having one and the same Divine nature and substance."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/30"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 30
    question: "Can we fully understand how the three Divine Persons are one and the same God?"
    text: "We cannot fully understand how the three Divine Persons are one and the same God, because this is a mystery."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/31"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 3"
    partNumber: 3
    section: "On The Unity And Trinity Of God"
    number: 31
    question: "What is a mystery?"
    text: "A mystery is a truth which we cannot fully understand."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/32"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 4"
    partNumber: 4
    section: "On Creation"
    number: 32
    question: "Who created heaven and earth, and all things?"
    text: "God created heaven and earth, and all things."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/33"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 4"
    partNumber: 4
    section: "On Creation"
    number: 33
    question: "How did God create heaven and earth?"
    text: "God created heaven and earth from nothing by His word only; that is, by a single act of His all-powerful will."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/34"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 4"
    partNumber: 4
    section: "On Creation"
    number: 34
    question: "Which are the chief creatures of God?"
    text: "The chief creatures of God are angels and men."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/35"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 4"
    partNumber: 4
    section: "On Creation"
    number: 35
    question: "What are angels?"
    text: "Angels are pure spirits without a body, created to adore and enjoy God in heaven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/36"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 4"
    partNumber: 4
    section: "On Creation"
    number: 36
    question: "Were the angels created for any other purpose?"
    text: "The angels were also created to assist before the throne of God and to minister unto Him; they have often been sent as messengers from God to man; and are also appointed our guardians."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/37"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 4"
    partNumber: 4
    section: "On Creation"
    number: 37
    question: "Were the angels, as God created them, good and happy?"
    text: "The angels, as God created them, were good and happy."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/38"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 4"
    partNumber: 4
    section: "On Creation"
    number: 38
    question: "Did all the angels remain good and happy?"
    text: "All the angels did not remain good and happy; many of them sinned and were cast into hell, and these are called devils or bad angels."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/39"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 39
    question: "Who were the first man and woman?"
    text: "The first man and woman were Adam and Eve."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/40"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 40
    question: "Were Adam and Eve innocent and holy when they came from the hand of God?"
    text: "Adam and Eve were innocent and holy when they came from the hand of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/41"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 41
    question: "Did God give any command to Adam and Eve?"
    text: "To try their obedience God commanded Adam and Eve not to eat of a certain fruit which grew in the garden of Paradise."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/42"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 42
    question: "Which were the chief blessings intended for Adam and Eve had they remained faithful to God?"
    text: "The chief blessings intended for Adam and Eve, had they remained faithful to God, were a constant state of happiness in this life and everlasting glory in the next."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/43"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 43
    question: "Did Adam and Eve remain faithful to God?"
    text: "Adam and Eve did not remain faithful to God; but broke His command by eating the forbidden fruit."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/44"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 44
    question: "What befell Adam and Eve on account of their sin?"
    text: "Adam and Eve, on account of their sin, lost innocence and holiness, and were doomed to sickness and death."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/45"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 45
    question: "What evil befell us on account of the disobedience of our first parents?"
    text: "On account of the disobedience of our first parents, we all share in their sin and punishment, as we should have shared in their happiness if they had remained faithful."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/46"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 46
    question: "What other effects followed from the sin of our first parents?"
    text: "Our nature was corrupted by the sin of our first parents, which darkened our understanding, weakened our will, and left in us a strong inclination to evil."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/47"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 47
    question: "What is the sin called which we inherit from our first parents?"
    text: "The sin which we inherit from our first parents is called original sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/48"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 48
    question: "Why is this sin called original?"
    text: "This sin is called original because it comes down to us from our first parents, and we are brought into the world with its guilt on our soul."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/49"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 49
    question: "Does this corruption of our nature remain in us after original sin is forgiven?"
    text: "This corruption of our nature and other punishments remain in us after original sin is forgiven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/50"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 5"
    partNumber: 5
    section: "On Our First Parents And The Fall"
    number: 50
    question: "Was any one ever preserved from original sin?"
    text: "The Blessed Virgin Mary, through the merits of her Divine Son, was preserved free from the guilt of original sin, and this privilege is called her Immaculate Conception."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/51"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 6"
    partNumber: 6
    section: "On Sin And Its Kinds"
    number: 51
    question: "Is original sin the only kind of sin?"
    text: "Original sin is not the only kind of sin; there is another kind of sin, which we commit ourselves, called actual sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/52"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 6"
    partNumber: 6
    section: "On Sin And Its Kinds"
    number: 52
    question: "What is actual sin?"
    text: "Actual sin is any wilful thought, word, deed, or omission contrary to the law of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/53"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 6"
    partNumber: 6
    section: "On Sin And Its Kinds"
    number: 53
    question: "How many kinds of actual sin are there?"
    text: "There are two kinds of actual sin--mortal and venial."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/54"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 6"
    partNumber: 6
    section: "On Sin And Its Kinds"
    number: 54
    question: "What is mortal sin?"
    text: "Mortal sin is a grievous offense against the law of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/55"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 6"
    partNumber: 6
    section: "On Sin And Its Kinds"
    number: 55
    question: "Why is this sin called mortal?"
    text: "This sin is called mortal because it deprives us of spiritual life, which is sanctifying grace, and brings everlasting death and damnation on the soul."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/56"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 6"
    partNumber: 6
    section: "On Sin And Its Kinds"
    number: 56
    question: "How many things are necessary to make a sin mortal?"
    text: "To make a sin mortal three things are necessary: a grievous matter, sufficient reflection, and full consent of the will."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/57"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 6"
    partNumber: 6
    section: "On Sin And Its Kinds"
    number: 57
    question: "What is venial sin?"
    text: "Venial sin is a slight offense against the law of God in matters of less importance, or in matters of great importance it is an offense committed without sufficient reflection or full consent of the will."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/58"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 6"
    partNumber: 6
    section: "On Sin And Its Kinds"
    number: 58
    question: "Which are the effects of venial sin?"
    text: "The effects of venial sin are the lessening of the love of God in our heart, the making us less worthy of His help, and the weakening of the power to resist mortal sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/59"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 6"
    partNumber: 6
    section: "On Sin And Its Kinds"
    number: 59
    question: "Which are the chief sources of sin?"
    text: "The chief sources of sin are seven: Pride, Covetousness, Lust, Anger, Gluttony, Envy, and Sloth; and they are commonly called capital sins."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/60"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 60
    question: "Did God abandon man after he fell into sin?"
    text: "God did not abandon man after he fell into sin, but promised him a Redeemer, who was to satisfy for man's sin and reopen to him the gates of heaven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/61"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 61
    question: "Who is the Redeemer?"
    text: "Our Blessed Lord and Saviour Jesus Christ is the Redeemer of mankind."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/62"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 62
    question: "What do you believe of Jesus Christ?"
    text: "I believe that Jesus Christ is the Son of God, the second Person of the Blessed Trinity, true God and true man."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/63"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 63
    question: "Why is Jesus Christ true God?"
    text: "Jesus Christ is true God because He is the true and only Son of God the Father."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/64"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 64
    question: "Why is Jesus Christ true man?"
    text: "Jesus Christ is true man because He is the Son of the Blessed Virgin Mary and has a body and soul like ours."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/65"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 65
    question: "How many natures are there in Jesus Christ?"
    text: "In Jesus Christ there are two natures, the nature of God and the nature of man."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/66"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 66
    question: "Is Jesus Christ more than one person?"
    text: "No, Jesus Christ is but one Divine Person."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/67"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 67
    question: "Was Jesus Christ always God?"
    text: "Jesus Christ was always God, as He is the second Person of the Blessed Trinity, equal to His Father from all eternity."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/68"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 68
    question: "Was Jesus Christ always man?"
    text: "Jesus Christ was not always man, but became man at the time of His Incarnation."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/69"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 69
    question: "What do you mean by the Incarnation?"
    text: "By the Incarnation I mean that the Son of God was made man."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/70"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 70
    question: "How was the Son of God made man?"
    text: "The Son of God was conceived and made man by the power of the Holy Ghost, in the womb of the Blessed Virgin Mary."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/71"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 71
    question: "Is the Blessed Virgin Mary truly the Mother of God?"
    text: "The Blessed Virgin Mary is truly the Mother of God, because the same Divine Person who is the Son of God is also the Son of the Blessed Virgin Mary."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/72"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 72
    question: "Did the Son of God become man immediately after the sin of our first parents?"
    text: "The Son of God did not become man immediately after the sin of our first parents, but was promised to them as a Redeemer."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/73"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 73
    question: "How could they be saved who lived before the Son of God became man?"
    text: "They who lived before the Son of God became man could be saved by believing in a Redeemer to come, and by keeping the commandments."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/74"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 74
    question: "On what day was the Son of God conceived and made man?"
    text: "The Son of God was conceived and made man on Annunciation day--the day on which the Angel Gabriel announced to the Blessed Virgin Mary that she was to be the Mother of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/75"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 75
    question: "On what day was Christ born?"
    text: "Christ was born on Christmas day in a stable at Bethlehem, over nineteen hundred years ago."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/76"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 76
    question: "How long did Christ live on earth?"
    text: "Christ lived on earth about thirty-three years, and led a most holy life in poverty and suffering."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/77"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 7"
    partNumber: 7
    section: "On The Incarnation And Redemption"
    number: 77
    question: "Why did Christ live so long on earth?"
    text: "Christ lived so long on earth to show us the way to heaven by His teachings and example."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/78"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 78
    question: "What did Jesus Christ suffer?"
    text: "Jesus Christ suffered a bloody sweat, a cruel scourging, was crowned with thorns, and was crucified."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/79"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 79
    question: "On what day did Christ die?"
    text: "Christ died on Good Friday."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/80"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 80
    question: "Why do you call that day \"good\" on which Christ died so sorrowful a death?"
    text: "We call that day \"good\" on which Christ died because by His death He showed His great love for man, and purchased for him every blessing."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/81"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 81
    question: "Where did Christ die?"
    text: "Christ died on Mount Calvary."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/82"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 82
    question: "How did Christ die?"
    text: "Christ was nailed to the Cross and died on it between two thieves."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/83"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 83
    question: "Why did Christ suffer and die?"
    text: "Christ suffered and died for our sins."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/84"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 84
    question: "What lessons do we learn from the sufferings and death of Christ?"
    text: "From the sufferings and death of Christ we learn the great evil of sin, the hatred God bears to it, and the necessity of satisfying for it."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/85"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 85
    question: "Where did Christ's soul go after His death?"
    text: "After Christ's death His soul descended into hell."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/86"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 86
    question: "Did Christ's soul descend into the hell of the damned?"
    text: "The hell into which Christ's soul descended was not the hell of the damned, but a place or state of rest called Limbo, where the souls of the just were waiting for Him."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/87"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 87
    question: "Why did Christ descend into Limbo?"
    text: "Christ descended into Limbo to preach to the souls who were in prison--that is, to announce to them the joyful tidings of their redemption."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/88"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 88
    question: "Where was Christ's body while His soul was in Limbo?"
    text: "While Christ's soul was in Limbo His body was in the holy sepulchre."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/89"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 89
    question: "On what day did Christ rise from the dead?"
    text: "Christ rose from the dead, glorious and immortal, on Easter Sunday, the third day after His death."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/90"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 90
    question: "How long did Christ stay on earth after His resurrection?"
    text: "Christ stayed on earth forty days after His resurrection to show that He was truly risen from the dead, and to instruct His Apostles."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/91"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 91
    question: "After Christ had remained forty days on earth whither did He go?"
    text: "After forty days Christ ascended into heaven, and the day on which He ascended into heaven is called Ascension day."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/92"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 92
    question: "Where is Christ in heaven?"
    text: "In heaven Christ sits at the right hand of God the Father Almighty."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/93"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 8"
    partNumber: 8
    section: "On Our Lord'S Passion, Death, Resurrection, And Ascension"
    number: 93
    question: "What do you mean by saying that Christ sits at the right hand Of God?"
    text: "When I say that Christ sits at the right hand of God I mean that Christ as God is equal to His Father in all things, and that as man He is in the highest place in heaven next to God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/94"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 9"
    partNumber: 9
    section: "On The Holy Ghost And His Descent Upon The Apostles"
    number: 94
    question: "Who is the Holy Ghost?"
    text: "The Holy Ghost is the third Person of the Blessed Trinity."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/95"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 9"
    partNumber: 9
    section: "On The Holy Ghost And His Descent Upon The Apostles"
    number: 95
    question: "From whom does the Holy Ghost proceed?"
    text: "The Holy Ghost proceeds from the Father and the Son."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/96"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 9"
    partNumber: 9
    section: "On The Holy Ghost And His Descent Upon The Apostles"
    number: 96
    question: "Is the Holy Ghost equal to the Father and the Son?"
    text: "The Holy Ghost is equal to the Father and the Son, being the same Lord and God as They are."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/97"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 9"
    partNumber: 9
    section: "On The Holy Ghost And His Descent Upon The Apostles"
    number: 97
    question: "On what day did the Holy Ghost come down upon the Apostles?"
    text: "The Holy Ghost came down upon the Apostles ten days after the Ascension of our Lord; and the day on which He came down upon the Apostles is called Whitsunday, or Pentecost."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/98"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 9"
    partNumber: 9
    section: "On The Holy Ghost And His Descent Upon The Apostles"
    number: 98
    question: "How did the Holy Ghost come down upon the Apostles?"
    text: "The Holy Ghost came down upon the Apostles in the form of tongues of fire."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/99"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 9"
    partNumber: 9
    section: "On The Holy Ghost And His Descent Upon The Apostles"
    number: 99
    question: "Who sent the Holy Ghost upon the Apostles?"
    text: "Our Lord Jesus Christ sent the Holy Ghost upon the Apostles."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/100"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 9"
    partNumber: 9
    section: "On The Holy Ghost And His Descent Upon The Apostles"
    number: 100
    question: "Why did Christ send the Holy Ghost?"
    text: "Christ sent the Holy Ghost to sanctify His Church, to enlighten and strengthen the Apostles, and to enable them to preach the Gospel."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/101"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 9"
    partNumber: 9
    section: "On The Holy Ghost And His Descent Upon The Apostles"
    number: 101
    question: "Will the Holy Ghost abide with the Church forever?"
    text: "The Holy Ghost will abide with the Church forever, and guide it in the way of holiness and truth."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/102"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 102
    question: "Which are the chief effects of the Redemption?"
    text: "The chief effects of the Redemption are two: The satisfaction of God's justice by Christ's sufferings and death, and the gaining of grace for men."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/103"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 103
    question: "What do you mean by grace?"
    text: "By grace I mean a supernatural gift of God bestowed on us, through the merits of Jesus Christ, for our salvation."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/104"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 104
    question: "How many kinds of grace are there?"
    text: "There are two kinds of grace, sanctifying grace and actual grace."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/105"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 105
    question: "What is sanctifying grace?"
    text: "Sanctifying grace is that grace which makes the soul holy and pleasing to God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/106"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 106
    question: "What do you call those graces or gifts of God by which we believe in Him, hope in Him, and love Him?"
    text: "Those graces or gifts of God by which we believe in Him, and hope in Him, and love Him, are called the Divine virtues of Faith, Hope, and Charity."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/107"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 107
    question: "What is Faith?"
    text: "Faith is a Divine virtue by which we firmly believe the truths which God has revealed."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/108"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 108
    question: "What is Hope?"
    text: "Hope is a Divine virtue by which we firmly trust that God will give us eternal life and the means to obtain it."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/109"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 109
    question: "What is Charity?"
    text: "Charity is a Divine virtue by which we love God above all things for His own sake, and our neighbor as ourselves for the love of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/110"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 110
    question: "What is actual grace?"
    text: "Actual grace is that help of God which enlightens our mind and moves our will to shun evil and do good."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/111"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 111
    question: "Is grace necessary to salvation?"
    text: "Grace is necessary to salvation, because without grace we can do nothing to merit heaven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/112"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 112
    question: "Can we resist the grace of God?"
    text: "We can and unfortunately often do resist the grace of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/113"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 10"
    partNumber: 10
    section: "On The Effects Of The Redemption"
    number: 113
    question: "What is the grace of perseverance?"
    text: "The grace of perseverance is a particular gift of God which enables us to continue in the state of grace till death."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/114"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 11"
    partNumber: 11
    section: "On The Church"
    number: 114
    question: "Which are the means instituted by our Lord to enable men at all times to share in the fruits of the Redemption?"
    text: "The means instituted by our Lord to enable men at all times to share in the fruits of His Redemption are the Church and the Sacraments."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/115"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 11"
    partNumber: 11
    section: "On The Church"
    number: 115
    question: "What is the Church?"
    text: "The Church is the congregation of all those who profess the faith of Christ, partake of the same Sacraments, and are governed by their lawful pastors under one visible head."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/116"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 11"
    partNumber: 11
    section: "On The Church"
    number: 116
    question: "Who is the invisible Head of the Church?"
    text: "Jesus Christ is the invisible Head of the Church."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/117"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 11"
    partNumber: 11
    section: "On The Church"
    number: 117
    question: "Who is the visible Head of the Church?"
    text: "Our Holy Father the Pope, the Bishop of Rome, is the Vicar of Christ on earth and the visible Head of the Church."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/118"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 11"
    partNumber: 11
    section: "On The Church"
    number: 118
    question: "Why is the Pope, the Bishop of Rome, the visible Head of the Church?"
    text: "The Pope, the Bishop of Rome, is the visible Head of the Church because he is the successor of St. Peter, whom Christ made the chief of the Apostles and the visible Head of the Church."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/119"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 11"
    partNumber: 11
    section: "On The Church"
    number: 119
    question: "Who are the successors of the other Apostles?"
    text: "The successors of the other Apostles are the bishops of the Holy Catholic Church."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/120"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 11"
    partNumber: 11
    section: "On The Church"
    number: 120
    question: "Why did Christ found the Church?"
    text: "Christ founded the Church to teach, govern, sanctify, and save all men."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/121"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 11"
    partNumber: 11
    section: "On The Church"
    number: 121
    question: "Are all bound to belong to the Church?"
    text: "All are bound to belong to the Church, and he who knows the Church to be the true Church and remains out of it cannot be saved."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/122"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 122
    question: "Which are the attributes of the Church?"
    text: "The attributes of the Church are three: authority infallibility, and indefectibility."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/123"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 123
    question: "What do you mean by the authority of the Church?"
    text: "By the authority of the Church I mean the right and power which the Pope and the bishops, as the successors of the Apostles, have to teach and to govern the faithful."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/124"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 124
    question: "What do you mean by the infallibility of the Church?"
    text: "By the infallibility of the Church I mean that the Church cannot err when it teaches a doctrine of faith or morals."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/125"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 125
    question: "When does the Church teach infallibly?"
    text: "The Church teaches infallibly when it speaks through the Pope and the bishops, united in general council, or through the Pope alone when he proclaims to all the faithful a doctrine of faith or morals."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/126"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 126
    question: "What do you mean by the indefectibility of the Church?"
    text: "By the indefectibility of the Church I mean that the Church, as Christ founded it, will last till the end of time."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/127"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 127
    question: "In whom are these attributes found in their fullness?"
    text: "These attributes are found in their fullness in the Pope, the visible Head of the Church, whose infallible authority to teach bishops, priests, and people in matters of faith or morals will last till the end of the world."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/128"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 128
    question: "Has the Church any marks by which it may be known?"
    text: "The Church has four marks by which it may be known: it is One; it is Holy; it is Catholic; it is Apostolic."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/129"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 129
    question: "How is the Church One?"
    text: "The Church is One because all its members agree in one faith, are all in one communion, and are all under one Head."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/130"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 130
    question: "How is the Church Holy?"
    text: "The Church is Holy because its founder, Jesus Christ, is holy; because it teaches a holy doctrine; invites all to a holy life; and because of the eminent holiness of so many thousands of its children."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/131"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 131
    question: "How is the Church Catholic or universal?"
    text: "The Church is Catholic or universal because it subsists in all ages, teaches all nations, and maintains all truth."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/132"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 132
    question: "How is the Church Apostolic?"
    text: "The Church is Apostolic because it was founded by Christ on His Apostles, and is governed by their lawful successors, and because it has never ceased, and never will cease, to teach their doctrine."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/133"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 133
    question: "In which Church are these attributes and marks found?"
    text: "These attributes and marks are found in the Holy Roman Catholic Church alone."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/134"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 134
    question: "From whom does the Church derive its undying life and infallible authority?"
    text: "The Church derives its undying life and infallible authority from the Holy Ghost, the spirit of truth, who abides with it forever."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/135"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 12"
    partNumber: 12
    section: "On The Attributes And Marks Of The Church"
    number: 135
    question: "By whom is the Church made and kept One, Holy, and Catholic?"
    text: "The Church is made and kept One, Holy, and Catholic by the Holy Ghost, the spirit of love and holiness, who unites and sanctifies its members throughout the world."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/136"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 136
    question: "What is a Sacrament?"
    text: "A Sacrament is an outward sign instituted by Christ to give grace."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/137"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 137
    question: "How many Sacraments are there?"
    text: "There are seven Sacraments: Baptism, Confirmation, Holy Eucharist, Penance, Extreme Unction, Holy Orders, and Matrimony."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/138"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 138
    question: "Whence have the Sacraments the power of giving grace?"
    text: "The Sacraments have the power of giving grace from the merits of Jesus Christ."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/139"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 139
    question: "What grace do the Sacraments give?"
    text: "Some of the Sacraments give sanctifying grace, and others increase it in our souls."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/140"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 140
    question: "Which are the Sacraments that give sanctifying grace?"
    text: "The Sacraments that give sanctifying grace are Baptism and Penance; and they are called Sacraments of the dead."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/141"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 141
    question: "Why are Baptism and Penance called Sacraments of the dead?"
    text: "Baptism and Penance are called Sacraments of the dead, because they take away sin, which is the death of the soul, and give grace, which is its life."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/142"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 142
    question: "Which are the Sacraments that increase sanctifying grace in our soul?"
    text: "The Sacraments that increase sanctifying grace in our soul are: Confirmation, Holy Eucharist, Extreme Unction, Holy Orders, and Matrimony; and they are called Sacraments of the living."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/143"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 143
    question: "Why are Confirmation, Holy Eucharist, Extreme Unction, Holy Orders, and Matrimony called Sacraments of the living?"
    text: "Confirmation, Holy Eucharist, Extreme Unction, Holy Orders, and Matrimony are called Sacraments of the living, because those who receive them worthily are already living the life of grace."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/144"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 144
    question: "What sin does he commit who receives the Sacraments of the living in mortal sin?"
    text: "He who receives the Sacraments of the living in mortal sin commits a sacrilege, which is a great sin, because it is an abuse of a sacred thing."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/145"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 145
    question: "Besides sanctifying grace do the Sacraments give any other grace?"
    text: "Besides sanctifying grace the Sacraments give another grace, called sacramental."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/146"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 146
    question: "What is sacramental grace?"
    text: "Sacramental grace is a special help which God gives, to attain the end for which He instituted each Sacrament."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/147"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 147
    question: "Do the Sacraments always give grace?"
    text: "The Sacraments always give grace, if we receive them with the right dispositions."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/148"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 148
    question: "Can we receive the Sacraments more than once?"
    text: "We can receive the Sacraments more than once, except Baptism, Confirmation, and Holy Orders."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/149"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 149
    question: "Why can we not receive Baptism, Confirmation, and Holy Orders more than once?"
    text: "We cannot receive Baptism, Confirmation, and Holy Orders more than once, because they imprint a character in the soul."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/150"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 150
    question: "What is the character which these Sacraments imprint in the soul?"
    text: "The character which these Sacraments imprint in the soul is a spiritual mark which remains forever."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/151"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 13"
    partNumber: 13
    section: "On The Sacraments In General"
    number: 151
    question: "Does this character remain in the soul even after death?"
    text: "This character remains in the soul even after death: for the honor and glory of those who are saved; for the shame and punishment of those who are lost."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/152"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 152
    question: "What is Baptism?"
    text: "Baptism is a Sacrament which cleanses us from original sin, makes us Christians, children of God, and heirs of heaven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/153"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 153
    question: "Are actual sins ever remitted by Baptism?"
    text: "Actual sins and all the punishment due to them are remitted by Baptism, if the person baptized be guilty of any."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/154"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 154
    question: "Is Baptism necessary to salvation?"
    text: "Baptism is necessary to salvation, because without it we cannot enter into the kingdom of heaven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/155"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 155
    question: "Who can administer Baptism?"
    text: "The priest is the ordinary minister of Baptism; but in case of necessity any one who has the use of reason may baptize."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/156"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 156
    question: "How is Baptism given?"
    text: "Whoever baptizes should pour water on the head of the person to be baptized, and say, while pouring the water: I baptize thee in the name of the Father, and of the Son, and of the Holy Ghost."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/157"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 157
    question: "How many kinds of Baptism are there?"
    text: "There are three kinds of Baptism: Baptism of water, of desire, and of blood."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/158"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 158
    question: "What is Baptism of water?"
    text: "Baptism of water is that which is given by pouring water on the head of the person to be baptized, and saying at the same time: I baptize thee in the name of the Father, and of the Son, and of the Holy Ghost."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/159"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 159
    question: "What is Baptism of desire?"
    text: "Baptism of desire is an ardent wish to receive Baptism, and to do all that God has ordained for our salvation."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/160"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 160
    question: "What is Baptism of blood?"
    text: "Baptism of blood is the shedding of one's blood for the faith of Christ."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/161"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 161
    question: "Is Baptism of desire or of blood sufficient to produce the effects of Baptism of water?"
    text: "Baptism of desire or of blood is sufficient to produce the effects of the Baptism of water, if it is impossible to receive the Baptism of water."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/162"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 162
    question: "What do we promise in Baptism?"
    text: "In Baptism we promise to renounce the devil with all his works and pomps."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/163"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 163
    question: "Why is the name of a saint given in Baptism?"
    text: "The name of a saint is given in Baptism in order that the person baptized may imitate his virtues and have him for a protector."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/164"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 164
    question: "Why are godfathers and godmothers given in Baptism?"
    text: "Godfathers and godmothers are given in Baptism in order that they may promise, in the name of the child, what the child itself would promise if it had the use of reason."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/165"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 14"
    partNumber: 14
    section: "On Baptism"
    number: 165
    question: "What is the obligation of a godfather and a godmother?"
    text: "The obligation of a godfather and a godmother is to instruct the child in its religious duties, if the parents neglect to do so or die."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/166"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 15"
    partNumber: 15
    section: "On Confirmation"
    number: 166
    question: "What is Confirmation?"
    text: "Confirmation is a Sacrament through which we receive the Holy Ghost to make us strong and perfect Christians and soldiers of Jesus Christ."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/167"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 15"
    partNumber: 15
    section: "On Confirmation"
    number: 167
    question: "Who administers Confirmation?"
    text: "The bishop is the ordinary minister of Confirmation."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/168"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 15"
    partNumber: 15
    section: "On Confirmation"
    number: 168
    question: "How does the bishop give Confirmation?"
    text: "The bishop extends his hands over those who are to be confirmed, prays that they may receive the Holy Ghost, and anoints the forehead of each with holy chrism in the form of a cross."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/169"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 15"
    partNumber: 15
    section: "On Confirmation"
    number: 169
    question: "What is holy chrism?"
    text: "Holy chrism is a mixture of olive-oil and balm, consecrated by the bishop."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/170"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 15"
    partNumber: 15
    section: "On Confirmation"
    number: 170
    question: "What does the bishop say in anointing the person he confirms?"
    text: "In anointing the person he confirms the bishop says: I sign thee with the sign of the cross, and I confirm thee with the chrism of salvation, in the name of the Father, and of the Son, and of the Holy Ghost."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/171"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 15"
    partNumber: 15
    section: "On Confirmation"
    number: 171
    question: "What is meant by anointing the forehead with chrism in the form of a cross?"
    text: "By anointing the forehead with chrism in the form of a cross is meant, that the Christian who is confirmed must openly profess and practice his faith, never be ashamed of it, and rather die than deny it."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/172"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 15"
    partNumber: 15
    section: "On Confirmation"
    number: 172
    question: "Why does the bishop give the person he confirms a slight blow on the cheek?"
    text: "The bishop gives the person he confirms a slight blow on the cheek, to put him in mind that he must be ready to suffer everything, even death, for the sake of Christ."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/173"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 15"
    partNumber: 15
    section: "On Confirmation"
    number: 173
    question: "To receive Confirmation worthily is it necessary to be in the state of grace?"
    text: "To receive Confirmation worthily it is necessary to be in the state of grace."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/174"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 15"
    partNumber: 15
    section: "On Confirmation"
    number: 174
    question: "What special preparation should be made to receive Confirmation?"
    text: "Persons of an age to learn should know the chief mysteries of faith and the duties of a Christian, and be instructed in the nature and effects of this Sacrament."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/175"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 15"
    partNumber: 15
    section: "On Confirmation"
    number: 175
    question: "Is it a sin to neglect Confirmation?"
    text: "It is a sin to neglect Confirmation, especially in these evil days when faith and morals are exposed to so many and such violent temptations."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/176"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 176
    question: "Which are the effects of Confirmation?"
    text: "The effects of Confirmation are an increase of sanctifying grace, the strengthening of our faith, and the gifts of the Holy Ghost."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/177"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 177
    question: "Which are the gifts of the Holy Ghost?"
    text: "The gifts of the Holy Ghost are Wisdom, Understanding, Counsel, Fortitude, Knowledge, Piety and Fear of the Lord."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/178"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 178
    question: "Why do we receive the gift of Fear of the Lord?"
    text: "We receive the gift of Fear of the Lord to fill us with a dread of sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/179"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 179
    question: "Why do we receive the gift of Piety?"
    text: "We receive the gift of Piety to make us love God as a Father and obey Him because we love Him."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/180"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 180
    question: "Why do we receive the gift of Knowledge?"
    text: "We receive the gift of Knowledge to enable us to discover the will of God in all things."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/181"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 181
    question: "Why do we receive the gift of Fortitude?"
    text: "We receive the gift of Fortitude to strengthen us to do the will of God in all things."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/182"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 182
    question: "Why do we receive the gift of Counsel?"
    text: "We receive the gift of Counsel to warn us of the deceits of the devil, and of the dangers to salvation."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/183"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 183
    question: "Why do we receive the gift of Understanding?"
    text: "We receive the gift of Understanding to enable us to know more clearly the mysteries of faith."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/184"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 184
    question: "Why do we receive the gift of Wisdom?"
    text: "We receive the gift of Wisdom to give us a relish for the things of God, and to direct our whole life and all our actions to His honor and glory."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/185"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 185
    question: "Which are the Beatitudes?"
    text: "The Beatitudes are: 1. Blessed are the poor in spirit, for theirs is the kingdom of heaven. 2. Blessed are the meek, for they shall possess the land. 3. Blessed are they that mourn, for they shall be comforted. 4. Blessed are they that hunger and thirst after justice, for they shall be filled. 5. Blessed are the merciful, for they shall obtain mercy. 6. Blessed are the clean of heart, for they shall see God. 7. Blessed are the peacemakers, for they shall be called the children of God. 8. Blessed are they that suffer persecution for justice sake, for theirs is the kingdom of heaven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/186"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 16"
    partNumber: 16
    section: "On The Gifts And Fruits Of The Holy Ghost"
    number: 186
    question: "Which are the twelve fruits of the Holy Ghost?"
    text: "The twelve fruits of the Holy Ghost are Charity, Joy, Peace, Patience, Benignity, Goodness, Long-suffering, Mildness, Faith, Modesty, Continency, and Chastity."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/187"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 17"
    partNumber: 17
    section: "On The Sacrament Of Penance"
    number: 187
    question: "What is the Sacrament of Penance?"
    text: "Penance is a Sacrament in which the sins committed after Baptism are forgiven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/188"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 17"
    partNumber: 17
    section: "On The Sacrament Of Penance"
    number: 188
    question: "How does the Sacrament of Penance remit sin, and restore to the soul the friendship of God?"
    text: "The Sacrament of Penance remits sins and restores the friendship of God to the soul by means of the absolution of the priest."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/189"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 17"
    partNumber: 17
    section: "On The Sacrament Of Penance"
    number: 189
    question: "How do you know that the priest has the power of absolving from the sins committed after Baptism?"
    text: "I know that the priest has the power of absolving from the sins committed after Baptism, because Jesus Christ granted that power to the priests of His Church when He said: \"Receive ye the Holy Ghost. Whose sins you shall forgive, they are forgiven them; whose sins you shall retain, they are retained.\""
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/190"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 17"
    partNumber: 17
    section: "On The Sacrament Of Penance"
    number: 190
    question: "How do the priests of the Church exercise the power of forgiving sins?"
    text: "The priests of the Church exercise the power of forgiving sins by hearing the confession of sins, and granting pardon for them as ministers of God and in His name."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/191"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 17"
    partNumber: 17
    section: "On The Sacrament Of Penance"
    number: 191
    question: "What must we do to receive the Sacrament of Penance worthily?"
    text: "To receive the Sacrament of Penance worthily we must do five things: 1. We must examine our conscience. 2. We must have sorrow for our sins. 3. We must make a firm resolution never more to offend God. 4. We must confess our sins to the priest. 5. We must accept the penance which the priest gives us."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/192"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 17"
    partNumber: 17
    section: "On The Sacrament Of Penance"
    number: 192
    question: "What is the examination of conscience?"
    text: "The examination of conscience is an earnest effort to recall to mind all the sins we have committed since our last worthy confession."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/193"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 17"
    partNumber: 17
    section: "On The Sacrament Of Penance"
    number: 193
    question: "How can we make a good examination of conscience?"
    text: "We can make a good examination of conscience by calling to memory the commandments of God, the precepts of the Church, the seven capital sins, and the particular duties of our state in life, to find out the sins we have committed."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/194"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 17"
    partNumber: 17
    section: "On The Sacrament Of Penance"
    number: 194
    question: "What should we do before beginning the examination of conscience?"
    text: "Before beginning the examination of conscience we should pray to God to give us light to know our sins and grace to detest them."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/195"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 195
    question: "What is contrition, or sorrow for sin?"
    text: "Contrition, or sorrow for sin, is a hatred of sin and a true grief of the soul for having offended God, with a firm purpose of sinning no more."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/196"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 196
    question: "What kind of sorrow should we have for our sins?"
    text: "The sorrow we should have for our sins should be interior, supernatural, universal, and sovereign."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/197"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 197
    question: "What do you mean by saying that our sorrow should be interior?"
    text: "When I say that our sorrow should be interior, I mean that it should come from the heart, and not merely from the lips."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/198"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 198
    question: "What do you mean by saying that our sorrow should be supernatural?"
    text: "When I say that our sorrow should be supernatural, I mean that it should be prompted by the grace of God, and excited by motives which spring from faith, and not by merely natural motives."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/199"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 199
    question: "What do you mean by saying that our sorrow should be universal?"
    text: "When I say that our sorrow should be universal, I mean that we should be sorry for all our mortal sins without exception."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/200"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 200
    question: "What do you mean when you say that our sorrow should be sovereign?"
    text: "When I say that our sorrow should be sovereign, I mean that we should grieve more for having offended God than for any other evil that can befall us."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/201"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 201
    question: "Why should we be sorry for our sins?"
    text: "We should be sorry for our sins, because sin is the greatest of evils and an offense against God our Creator, Preserver, and Redeemer, and because it shuts us out of heaven and condemns us to the eternal pains of hell."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/202"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 202
    question: "How many kinds of contrition are there?"
    text: "There are two kinds of contrition: perfect contrition and imperfect contrition."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/203"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 203
    question: "What is perfect contrition?"
    text: "Perfect contrition is that which fills us with sorrow and hatred for sin, because it offends God, who is infinitely good in Himself and worthy of all love."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/204"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 204
    question: "What is imperfect contrition?"
    text: "Imperfect contrition is that by which we hate what offends God, because by it we lose heaven and deserve hell; or because sin is so hateful in itself."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/205"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 205
    question: "Is imperfect contrition sufficient for a worthy confession?"
    text: "Imperfect contrition is sufficient for a worthy confession, but we should endeavor to have perfect contrition."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/206"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 206
    question: "What do you mean by a firm purpose of sinning no more?"
    text: "By a firm purpose of sinning no more I mean a fixed resolve not only to avoid all mortal sin, but also its near occasions."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/207"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 18"
    partNumber: 18
    section: "On Contrition"
    number: 207
    question: "What do you mean by the near occasions of sin?"
    text: "By the near occasions of sin I mean all the persons, places, and things that may easily lead us into sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/208"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 208
    question: "What is Confession?"
    text: "Confession is the telling of our sins to a duly authorized priest, for the purpose of obtaining forgiveness."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/209"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 209
    question: "What sins are we bound to confess?"
    text: "We are bound to confess all our mortal sins, but it is well also to confess our venial sins."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/210"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 210
    question: "Which are the chief qualities of a good Confession?"
    text: "The chief qualities of a good Confession are three: it must be humble, sincere, and entire."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/211"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 211
    question: "When is our Confession humble?"
    text: "Our Confession is humble, when we accuse our selves of our sins, with a deep sense of shame and sorrow for having offended God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/212"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 212
    question: "When is our Confession sincere?"
    text: "Our Confession is sincere, when we tell our sins honestly and truthfully, neither exaggerating nor excusing them."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/213"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 213
    question: "When is our Confession entire?"
    text: "Our Confession is entire, when we tell the number and kinds of our sins and the circumstances which change their nature."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/214"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 214
    question: "What should we do if we cannot remember the number of our sins?"
    text: "If we cannot remember the number of our sins, we should tell the number as nearly as possible, and say how often we may have sinned in a day, a week, or a month, and how long the habit or practice has lasted."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/215"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 215
    question: "Is our Confession worthy if, without our fault, we forget to confess a mortal sin?"
    text: "If without our fault we forget to confess a mortal sin, our Confession is worthy, and the sin is forgiven; but it must be told in Confession if it again comes to our mind."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/216"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 216
    question: "Is it a grievous offense wilfully to conceal a mortal sin in Confession?"
    text: "It is a grievous offense wilfully to conceal a mortal sin in Confession, because we thereby tell a lie to the Holy Ghost, and make our Confession worthless."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/217"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 217
    question: "What must he do who has wilfully concealed a mortal sin in Confession?"
    text: "He who has wilfully concealed a mortal sin in Confession must not only confess it, but must also repeat all the sins he has committed since his last worthy Confession."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/218"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 218
    question: "Why does the priest give us a penance after Confession?"
    text: "The priest gives us a penance after Confession, that we may satisfy God for the temporal punishment due to our sins."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/219"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 219
    question: "Does not the Sacrament of Penance remit all punishment due to sin?"
    text: "The Sacrament of Penance remits the eternal punishment due to sin, but it does not always remit the temporal punishment which God requires as satisfaction for our sins."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/220"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 220
    question: "Why does God require a temporal punishment as a satisfaction for sin?"
    text: "God requires a temporal punishment as a satisfaction for sin, to teach us the great evil of sin and to prevent us from falling again."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/221"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 221
    question: "Which are the chief means by which we satisfy God for the temporal punishment due to sin?"
    text: "The chief means by which we satisfy God for the temporal punishment due to sin are: Prayer, Fasting, Almsgiving, all spiritual and corporal works of mercy, and the patient suffering of the ills of life."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/222"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 222
    question: "Which are the chief spiritual works of mercy?"
    text: "The chief spiritual works of mercy are seven: To admonish the sinner, to instruct the ignorant, to counsel the doubtful, to comfort the sorrowful, to bear wrongs patiently, to forgive all injuries, and to pray for the living and the dead."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/223"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 19"
    partNumber: 19
    section: "On Confession"
    number: 223
    question: "Which are the chief corporal works of mercy?"
    text: "The chief corporal works of mercy are seven: To feed the hungry, to give drink to the thirsty, to clothe the naked, to ransom the captive, to harbor the harborless, to visit the sick, and to bury the dead."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/224"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 20"
    partNumber: 20
    section: "On The Manner Of Making A Good Confession"
    number: 224
    question: "What should we do on entering the confessional?"
    text: "On entering the confessional we should kneel, make the sign of the Cross, and say to the priest, Bless me, Father; then add, I confess to Almighty God and to you, Father, that I have sinned."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/225"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 20"
    partNumber: 20
    section: "On The Manner Of Making A Good Confession"
    number: 225
    question: "Which are the first things we should tell the priest in Confession?"
    text: "The first things we should tell the priest in Confession are the time of our last Confession, and whether we said the penance and went to Holy Communion."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/226"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 20"
    partNumber: 20
    section: "On The Manner Of Making A Good Confession"
    number: 226
    question: "After telling the time of our last Confession and Communion what should we do?"
    text: "After telling the time of our last Confession and Communion we should confess all the mortal sins we have since committed, and all the venial sins we may wish to mention."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/227"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 20"
    partNumber: 20
    section: "On The Manner Of Making A Good Confession"
    number: 227
    question: "What must we do when the confessor asks us questions?"
    text: "When the confessor asks us questions we must answer them truthfully and clearly."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/228"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 20"
    partNumber: 20
    section: "On The Manner Of Making A Good Confession"
    number: 228
    question: "What should we do after telling our sins?"
    text: "After telling our sins we should listen with attention to the advice which the confessor may think proper to give."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/229"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 20"
    partNumber: 20
    section: "On The Manner Of Making A Good Confession"
    number: 229
    question: "How should we end our Confession?"
    text: "We should end our Confession by saying, I also accuse myself of all the sins of my past life, telling, if we choose, one or several of our past sins."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/230"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 20"
    partNumber: 20
    section: "On The Manner Of Making A Good Confession"
    number: 230
    question: "What should we do while the priest is giving us absolution?"
    text: "While the priest is giving us absolution we should from our heart renew the Act of Contrition."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/231"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 21"
    partNumber: 21
    section: "On Indulgences"
    number: 231
    question: "What is an Indulgence?"
    text: "An Indulgence is the remission in whole or in part of the temporal punishment due to sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/232"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 21"
    partNumber: 21
    section: "On Indulgences"
    number: 232
    question: "Is an Indulgence a pardon of sin, or a license to commit sin?"
    text: "An Indulgence is not a pardon of sin, nor a license to commit sin, and one who is in a state of mortal sin cannot gain an Indulgence."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/233"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 21"
    partNumber: 21
    section: "On Indulgences"
    number: 233
    question: "How many kinds of Indulgences are there?"
    text: "There are two kinds of Indulgences--Plenary and Partial."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/234"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 21"
    partNumber: 21
    section: "On Indulgences"
    number: 234
    question: "What is a Plenary Indulgence?"
    text: "A Plenary Indulgence is the full remission of the temporal punishment due to sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/235"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 21"
    partNumber: 21
    section: "On Indulgences"
    number: 235
    question: "What is a Partial Indulgence?"
    text: "A Partial Indulgence is the remission of a part of the temporal punishment due to sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/236"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 21"
    partNumber: 21
    section: "On Indulgences"
    number: 236
    question: "How does the Church by means of Indulgences remit the temporal punishment due to sin?"
    text: "The Church by means of Indulgences remits the temporal punishment due to sin by applying to us the merits of Jesus Christ, and the superabundant satisfactions of the Blessed Virgin Mary and of the saints; which merits and satisfactions are its spiritual treasury."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/237"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 21"
    partNumber: 21
    section: "On Indulgences"
    number: 237
    question: "What must we do to gain an Indulgence?"
    text: "To gain an Indulgence we must be in the state of grace and perform the works enjoined."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/238"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 238
    question: "What is the Holy Eucharist?"
    text: "The Holy Eucharist is the Sacrament which contains the body and blood, soul and divinity, of our Lord Jesus Christ under the appearances of bread and wine."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/239"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 239
    question: "When did Christ institute the Holy Eucharist?"
    text: "Christ instituted the Holy Eucharist at the Last Supper, the night before He died."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/240"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 240
    question: "Who were present when our Lord instituted the Holy Eucharist?"
    text: "When our Lord instituted the Holy Eucharist the twelve Apostles were present."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/241"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 241
    question: "How did our Lord institute the Holy Eucharist?"
    text: "Our Lord instituted the Holy Eucharist by taking bread, blessing, breaking, and giving to His Apostles, saying: Take ye and eat. This is My body; and then by taking the cup of wine, blessing and giving it, saying to them: Drink ye all of this. This is My blood which shall be shed for the remission of sins. Do this for a commemoration of Me."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/242"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 242
    question: "What happened when our Lord said, This is My body; this is My blood?"
    text: "When our Lord said, This is My body, the substance of the bread was changed into the substance of His body; when He said, This is My blood, the substance of the wine was changed into the substance of His blood."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/243"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 243
    question: "Is Jesus Christ whole and entire both under the form of bread and under the form of wine?"
    text: "Jesus Christ is whole and entire both under the form of bread and under the form of wine."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/244"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 244
    question: "Did anything remain of the bread and wine after their substance had been changed into the substance of the body and blood of our Lord?"
    text: "After the substance of the bread and wine had been changed into the substance of the body and blood of our Lord there remained only the appearances of bread and wine."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/245"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 245
    question: "What do you mean by the appearances of bread and wine?"
    text: "By the appearances of bread and wine I mean the figure, the color, the taste, and whatever appears to the senses."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/246"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 246
    question: "What is this change of the bread and wine into the body and blood of our Lord called?"
    text: "This change of the bread and wine into the body and blood of our Lord is called Transubstantiation."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/247"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 247
    question: "How was the substance of the bread and wine changed into the substance of the body and blood of Christ?"
    text: "The substance of the bread and wine was changed into the substance of the body and blood of Christ by His almighty power."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/248"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 248
    question: "Does this change of bread and wine into the body and blood of Christ continue to be made in the Church?"
    text: "This change of bread and wine into the body and blood of Christ continues to be made in the Church by Jesus Christ through the ministry of His priests."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/249"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 249
    question: "When did Christ give His priests the power to change bread and wine into His body and blood?"
    text: "Christ gave His priests the power to change bread and wine into His body and blood when He said to the Apostles, Do this in commemoration of Me."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/250"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 22"
    partNumber: 22
    section: "On The Holy Eucharist"
    number: 250
    question: "How do the priests exercise this power of changing bread and wine into the body and blood of Christ?"
    text: "The priests exercise this power of changing bread and wine into the body and blood of Christ through the words of consecration in the Mass, which are the words of Christ: This is My body; this is My blood."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/251"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 251
    question: "Why did Christ institute the Holy Eucharist?"
    text: "Christ instituted the Holy Eucharist-- 1. To unite us to Himself and to nourish our soul with His divine life. 2. To increase sanctifying grace and all virtues in our soul. 3. To lessen our evil inclinations. 4. To be a pledge of everlasting life. 5. To fit our bodies for a glorious resurrection. 6. To continue the sacrifice of the Cross in His Church."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/252"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 252
    question: "How are we united to Jesus Christ in the Holy Eucharist?"
    text: "We are united to Jesus Christ in the Holy Eucharist by means of Holy Communion."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/253"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 253
    question: "What is Holy Communion?"
    text: "Holy Communion is the receiving of the body and blood of Christ."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/254"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 254
    question: "What is necessary to make a good Communion?"
    text: "To make a good Communion it is necessary to be in the state of sanctifying grace, to have a right intention, and to obey the laws of fasting. (See Q. 257.)"
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/255"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 255
    question: "Does he who receives Communion in mortal sin receive the body and blood of Christ?"
    text: "He who receives Communion in mortal sin receives the body and blood of Christ, but does not receive His grace, and he commits a great sacrilege."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/256"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 256
    question: "Is it enough to be free from mortal sin to receive plentifully the graces of Holy Communion?"
    text: "To receive plentifully the graces of Holy Communion it is not enough to be free from mortal sin, but we should be free from all affection to venial sin, and should make acts of faith, hope, and love."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/257"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 257
    question: "What is the fast necessary for Holy Communion?"
    text: ""
    note: "Answer revised in a later printing (current discipline); the 1885 wording is not in the source, so it is omitted."
- type: "CatechismEntry"
  data:
    key: "baltimore-2/258"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 258
    question: "Is any one ever allowed to receive Holy Communion when not fasting?"
    text: "Any one in danger of death is allowed to receive Holy Communion when not fasting or when it is necessary to save the Blessed Sacrament from insult or injury."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/259"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 259
    question: "When are we bound to receive Holy Communion?"
    text: "We are bound to receive Holy Communion, under pain of mortal sin, during the Easter time and when in danger of death."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/260"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 260
    question: "Is it well to receive Holy Communion often?"
    text: "It is well to receive Holy Communion often, as nothing is a greater aid to a holy life than often to receive the Author of all grace and the Source of all good."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/261"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 23"
    partNumber: 23
    section: "On The Ends For Which The Holy Eucharist Was Instituted"
    number: 261
    question: "What should we do after Holy Communion?"
    text: "After Holy Communion we should spend some time in adoring our Lord, in thanking Him for the grace we have received, and in asking Him for the blessings we need."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/262"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 24"
    partNumber: 24
    section: "On The Sacrifice Of The Mass"
    number: 262
    question: "When and where are the bread and wine changed into the body and blood of Christ?"
    text: "The bread and wine are changed into the body and blood of Christ at the Consecration in the Mass."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/263"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 24"
    partNumber: 24
    section: "On The Sacrifice Of The Mass"
    number: 263
    question: "What is the Mass?"
    text: "The Mass is the unbloody sacrifice of the body and blood of Christ."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/264"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 24"
    partNumber: 24
    section: "On The Sacrifice Of The Mass"
    number: 264
    question: "What is a sacrifice?"
    text: "A sacrifice is the offering of an object by a priest to God alone, and the consuming of it to acknowledge that He is the Creator and Lord of all things."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/265"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 24"
    partNumber: 24
    section: "On The Sacrifice Of The Mass"
    number: 265
    question: "Is the Mass the same sacrifice as that of the Cross?"
    text: "The Mass is the same sacrifice as that of the Cross."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/266"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 24"
    partNumber: 24
    section: "On The Sacrifice Of The Mass"
    number: 266
    question: "How is the Mass the same sacrifice as that of the Cross?"
    text: "The Mass is the same sacrifice as that of the Cross because the offering and the priest are the same--Christ our Blessed Lord; and the ends for which the sacrifice of the Mass is offered are the same as those of the sacrifice of the Cross."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/267"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 24"
    partNumber: 24
    section: "On The Sacrifice Of The Mass"
    number: 267
    question: "What were the ends for which the sacrifice of the Cross was offered?"
    text: "The ends for which the sacrifice of the Cross was offered were: 1st, To honor and glorify God; 2d, To thank Him for all the graces bestowed on the whole world; 3d, To satisfy God's justice for the sins of men; 4th, To obtain all graces and blessings."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/268"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 24"
    partNumber: 24
    section: "On The Sacrifice Of The Mass"
    number: 268
    question: "Is there any difference between the sacrifice of the Cross and the sacrifice of the Mass?"
    text: "Yes; the manner in which the sacrifice is offered is different. On the Cross Christ really shed His blood and was really slain; in the Mass there is no real shedding of blood nor real death, because Christ can die no more; but the sacrifice of the Mass, through the separate consecration of the bread and the wine, represents His death on the Cross."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/269"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 24"
    partNumber: 24
    section: "On The Sacrifice Of The Mass"
    number: 269
    question: "How should we assist at Mass?"
    text: "We should assist at Mass with great interior recollection and piety and with every outward mark of respect and devotion."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/270"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 24"
    partNumber: 24
    section: "On The Sacrifice Of The Mass"
    number: 270
    question: "Which is the best manner of hearing Mass?"
    text: "The best manner of hearing Mass is to offer it to God with the priest for the same purpose for which it is said, to meditate on Christ's sufferings and death, and to go to Holy Communion."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/271"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 271
    question: "What is the Sacrament of Extreme Unction?"
    text: "Extreme Unction is the Sacrament which, through the anointing and prayer of the priest, gives health and strength to the soul, and sometimes to the body, when we are in danger of death from sickness."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/272"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 272
    question: "When should we receive Extreme Unction?"
    text: "We should receive Extreme Unction when we are in danger of death from sickness, or from a wound or accident."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/273"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 273
    question: "Should we wait until we are in extreme danger before we receive Extreme Unction?"
    text: "We should not wait until we are in extreme danger before we receive Extreme Unction, but if possible we should receive it whilst we have the use of our senses."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/274"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 274
    question: "Which are the effects of the Sacrament of Extreme Unction?"
    text: "The effects of Extreme Unction are: 1st, To comfort us in the pains of sickness and to strengthen us against temptation; 2d, To remit venial sins and to cleanse our soul from the remains of sin; 3d, To restore us to health, when God sees fit."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/275"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 275
    question: "What do you mean by the remains of sin?"
    text: "By the remains of sin I mean the inclination to evil and the weakness of the will which are the result of our sins, and which remain after our sins have been forgiven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/276"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 276
    question: "How should we receive the Sacrament of Extreme Unction?"
    text: "We should receive the Sacrament of Extreme Unction in the state of grace, and with lively faith and resignation to the will of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/277"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 277
    question: "Who is the minister of the Sacrament of Extreme Unction?"
    text: "The priest is the minister of the Sacrament of Extreme Unction."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/278"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 278
    question: "What is the Sacrament of Holy Orders?"
    text: "Holy Orders is a Sacrament by which bishops, priests, and other ministers of the Church are ordained and receive the power and grace to perform their sacred duties."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/279"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 279
    question: "What is necessary to receive Holy Orders worthily?"
    text: "To receive Holy Orders worthily it is necessary to be in the state of grace, to have the necessary knowledge and a divine call to this sacred office."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/280"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 280
    question: "How should Christians look upon the priests of the Church?"
    text: "Christians should look upon the priests of the Church as the messengers of God and the dispensers of His mysteries."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/281"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 25"
    partNumber: 25
    section: "On Extreme Unction And Holy Orders"
    number: 281
    question: "Who can confer the Sacrament of Holy Orders?"
    text: "Bishops can confer the Sacrament of Holy Orders."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/282"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 26"
    partNumber: 26
    section: "On Matrimony"
    number: 282
    question: "What is the Sacrament of Matrimony?"
    text: "The Sacrament of Matrimony is the Sacrament which unites a Christian man and woman in lawful marriage."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/283"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 26"
    partNumber: 26
    section: "On Matrimony"
    number: 283
    question: "Can a Christian man and woman be united in lawful marriage in any other way than by the Sacrament of Matrimony?"
    text: "A Christian man and woman cannot be united in lawful marriage in any other way than by the Sacrament of Matrimony, because Christ raised marriage to the dignity of a Sacrament."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/284"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 26"
    partNumber: 26
    section: "On Matrimony"
    number: 284
    question: "Can the bond of Christian marriage be dissolved by any human power?"
    text: "The bond of Christian marriage cannot be dissolved by any human power."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/285"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 26"
    partNumber: 26
    section: "On Matrimony"
    number: 285
    question: "Which are the effects of the Sacrament of Matrimony?"
    text: "The effects of the Sacrament of Matrimony are: 1st, To sanctify the love of husband and wife; 2d, To give them grace to bear with each other's weaknesses; 3d, To enable them to bring up their children in the fear and love of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/286"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 26"
    partNumber: 26
    section: "On Matrimony"
    number: 286
    question: "To receive the Sacrament of matrimony worthily is it necessary to be in the state of grace?"
    text: "To receive the Sacrament of Matrimony worthily it is necessary to be in the state of grace, and it is necessary also to comply with the laws of the Church."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/287"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 26"
    partNumber: 26
    section: "On Matrimony"
    number: 287
    question: "Who has the right to make laws concerning the Sacrament of marriage?"
    text: "The Church alone has the right to make laws concerning the Sacrament of marriage, though the state also has the right to make laws concerning the civil effects of the marriage contract."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/288"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 26"
    partNumber: 26
    section: "On Matrimony"
    number: 288
    question: "Does the Church forbid the marriage of Catholics with persons who have a different religion or no religion at all?"
    text: "The Church does forbid the marriage of Catholics with persons who have a different religion or no religion at all."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/289"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 26"
    partNumber: 26
    section: "On Matrimony"
    number: 289
    question: "Why does the Church forbid the marriage of Catholics with persons who have a different religion or no religion at all?"
    text: "The Church forbids the marriage of Catholics with persons who have a different religion or no religion at all, because such marriages generally lead to indifference, loss of faith, and to the neglect of the religious education of the children."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/290"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 26"
    partNumber: 26
    section: "On Matrimony"
    number: 290
    question: "Why do many marriages prove unhappy?"
    text: "Many marriages prove unhappy because they are entered into hastily and without worthy motives."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/291"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 26"
    partNumber: 26
    section: "On Matrimony"
    number: 291
    question: "How should Christians prepare for a holy and happy marriage?"
    text: "Christians should prepare for a holy and happy marriage by receiving the Sacraments of Penance and Holy Eucharist; by begging God to grant them a pure intention and to direct their choice; and by seeking the advice of their parents and the blessing of their pastors."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/292"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 292
    question: "What is a sacramental?"
    text: "A sacramental is anything set apart or blessed by the Church to excite good thoughts and to increase devotion, and through these movements of the heart to remit venial sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/293"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 293
    question: "What is the difference between the Sacraments and the sacramentals?"
    text: "The difference between the Sacraments and the sacramentals is: 1st, The Sacraments were instituted by Jesus Christ and the sacramentals were instituted by the Church; 2d, The Sacraments give grace of themselves when we place no obstacle in the way; the sacramentals excite in us pious dispositions, by means of which we may obtain grace."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/294"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 294
    question: "Which is the chief sacramental used in the Church?"
    text: "The chief sacramental used in the Church is the sign of the Cross."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/295"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 295
    question: "How do we make the sign of the Cross?"
    text: "We make the sign of the Cross by putting the right hand to the forehead, then on the breast, and then to the left and right shoulders, saying, In the name of the Father, and of the Son, and of the Holy Ghost. Amen."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/296"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 296
    question: "Why do we make the sign of the Cross?"
    text: "We make the sign of the Cross to show that we are Christians and to profess our belief in the chief mysteries of our religion."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/297"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 297
    question: "How is the sign of the Cross a profession of faith in the chief mysteries of our religion?"
    text: "The sign of the Cross is a profession of faith in the chief mysteries of our religion because it expresses the mysteries of the Unity and Trinity of God and of the Incarnation and death of our Lord."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/298"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 298
    question: "How does the sign of the Cross express the mystery of the Unity and Trinity of God?"
    text: "The words, In the name, express the Unity of God; the words that follow, of the Father, and of the Son, and of the Holy Ghost, express the mystery of the Trinity."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/299"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 299
    question: "How does the sign of the Cross express the mystery of the Incarnation and death of our Lord?"
    text: "The sign of the Cross expresses the mystery of the Incarnation by reminding us that the Son of God, having become man, suffered death on the cross."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/300"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 300
    question: "What other sacramental is in very frequent use?"
    text: "Another sacramental in very frequent use is holy water."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/301"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 301
    question: "What is holy water?"
    text: "Holy water is water blessed by the priest with solemn prayer to beg God's blessing on those who use it, and protection from the powers of darkness."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/302"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 27"
    partNumber: 27
    section: "On The Sacramentals"
    number: 302
    question: "Are there other sacramentals besides the sign of the Cross and holy water?"
    text: "Besides the sign of the Cross and holy water there are many other sacramentals, such as blessed candles, ashes, palms, crucifixes, images of the Blessed Virgin and of the saints, rosaries, and scapulars."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/303"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 28"
    partNumber: 28
    section: "On Prayer"
    number: 303
    question: "Is there any other means of obtaining God's grace than the Sacraments?"
    text: "There is another means of obtaining God's grace, and it is prayer."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/304"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 28"
    partNumber: 28
    section: "On Prayer"
    number: 304
    question: "What is prayer?"
    text: "Prayer is the lifting up of our minds and hearts to God to adore Him, to thank Him for His benefits, to ask His forgiveness, and to beg of Him all the graces we need whether for soul or body."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/305"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 28"
    partNumber: 28
    section: "On Prayer"
    number: 305
    question: "Is prayer necessary to salvation?"
    text: "Prayer is necessary to salvation, and without it no one having the use of reason can be saved."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/306"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 28"
    partNumber: 28
    section: "On Prayer"
    number: 306
    question: "At what particular times should we pray?"
    text: "We should pray particularly on Sundays and holydays, every morning and night, in all dangers, temptations, and afflictions."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/307"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 28"
    partNumber: 28
    section: "On Prayer"
    number: 307
    question: "How should we pray?"
    text: "We should pray: 1st, With attention; 2d, With a sense of our own helplessness and dependence upon God; 3d, With a great desire for the graces we beg of God; 4th, With trust in God's goodness; 5th, With perseverance."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/308"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 28"
    partNumber: 28
    section: "On Prayer"
    number: 308
    question: "Which are the prayers most recommended to us?"
    text: "The prayers most recommended to us are the Lord's Prayer, the Hail Mary, the Apostles' Creed, the Confiteor, and the Acts of Faith, Hope, Love, and Contrition."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/309"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 28"
    partNumber: 28
    section: "On Prayer"
    number: 309
    question: "Are prayers said with distractions of any avail?"
    text: "Prayers said with wilful distractions are of no avail."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/310"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 29"
    partNumber: 29
    section: "On The Commandments Of God"
    number: 310
    question: "Is it enough to belong to God's Church in order to be saved?"
    text: "It is not enough to belong to the Church in order to be saved, but we must also keep the Commandments of God and of the Church."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/311"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 29"
    partNumber: 29
    section: "On The Commandments Of God"
    number: 311
    question: "Which are the Commandments that contain the whole law of God?"
    text: "The Commandments which contain the whole law of God are these two: 1st, Thou shalt love the Lord thy God with thy whole heart, with thy whole soul, with thy whole strength, and with thy whole mind; 2d, Thou shalt love thy neighbor as thyself."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/312"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 29"
    partNumber: 29
    section: "On The Commandments Of God"
    number: 312
    question: "Why do these two Commandments of the love of God and of our neighbor contain the whole law of God?"
    text: "These two Commandments of the love of God and of our neighbor contain the whole law of God because all the other Commandments are given either to help us to keep these two, or to direct us how to shun what is opposed to them."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/313"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 29"
    partNumber: 29
    section: "On The Commandments Of God"
    number: 313
    question: "Which are the Commandments of God?"
    text: "The Commandments of God are these ten. 1. I am the Lord thy God, who brought thee out of the land of Egypt, out of the house of bondage. Thou shalt not have strange gods before Me. Thou shalt not make to thyself a graven thing, nor the likeness of anything that is in heaven above, or in the earth beneath, nor of those things that are in the waters under the earth. Thou shalt not adore them, nor serve them. 2. Thou shalt not take the name of the Lord thy God in vain. 3. Remember thou keep holy the Sabbath day. 4. Honor thy father and thy mother. 5. Thou shalt not kill. 6. Thou shalt not commit adultery. 7. Thou shalt not steal. 8. Thou shalt not bear false witness against thy neighbor. 9. Thou shalt not covet thy neighbor's wife. 10. Thou shalt not covet thy neighbor's goods."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/314"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 29"
    partNumber: 29
    section: "On The Commandments Of God"
    number: 314
    question: "Who gave the Ten Commandments?"
    text: "God Himself gave the Ten Commandments to Moses on Mount Sinai, and Christ our Lord confirmed them."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/315"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 315
    question: "What is the first Commandment?"
    text: "The first Commandment is: I am the Lord thy God: thou shalt not have strange gods before Me."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/316"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 316
    question: "How does the first Commandment help us to keep the great Commandment of the love of God?"
    text: "The first Commandment helps us to keep the great Commandment of the love of God because it commands us to adore God alone."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/317"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 317
    question: "How do we adore God?"
    text: "We adore God by faith, hope, and charity, by prayer and sacrifice."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/318"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 318
    question: "How may the first Commandment be broken?"
    text: "The first Commandment may be broken by giving to a creature the honor which belongs to God alone; by false worship; and by attributing to a creature a perfection which belongs to God alone."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/319"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 319
    question: "Do those who make use of spells and charms, or who believe in dreams, in mediums, spiritists, fortune-tellers, and the like, sin against the first Commandment?"
    text: "Those who make use of spells and charms, or who believe in dreams, in mediums, spiritists, fortunetellers and the like, sin against the first Commandment, because they attribute to creatures perfections which belong to God alone."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/320"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 320
    question: "Are sins against faith, hope and charity also sins against the first Commandment?"
    text: "Sins against faith, hope, and charity are also sins against the first Commandment."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/321"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 321
    question: "How does a person sin against faith?"
    text: "A person sins against faith: 1st, by not trying to know what God has taught; 2d, by refusing to believe all that God has taught; 3d, by neglecting to profess his belief in what God has taught."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/322"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 322
    question: "How do we fail to try to know what God has taught?"
    text: "We fail to try to know what God has taught by neglecting to learn the Christian doctrine."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/323"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 323
    question: "Who are they who do not believe all that God has taught?"
    text: "They who do not believe all that God has taught are the heretics and infidels."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/324"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 324
    question: "Who are they who neglect to profess their belief in what God has taught?"
    text: "They who neglect to profess their belief in what God has taught are all those who fail to acknowledge the true Church in which they really believe."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/325"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 325
    question: "Can they who fail to profess their faith in the true Church in which they believe expect to be saved while in that state?"
    text: "They who fail to profess their faith in the true Church in which they believe cannot expect to be saved while in that state, for Christ has said: \"Whoever shall deny Me before men, I will also deny him before My Father who is in heaven.\""
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/326"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 326
    question: "Are we obliged to make open profession of our faith?"
    text: "We are obliged to make open profession of our faith as often as God's honor, our neighbor's spiritual good, or our own requires it. \"Whosoever,\" says Christ, \"shall confess Me before men, I will also confess him before My Father who is in heaven.\""
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/327"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 327
    question: "Which are the sins against hope?"
    text: "The sins against hope are presumption and despair."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/328"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 328
    question: "What is presumption?"
    text: "Presumption is a rash expectation of salvation without making proper use of the necessary means to obtain it."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/329"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 329
    question: "What is despair?"
    text: "Despair is the loss of hope in God's mercy."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/330"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 30"
    partNumber: 30
    section: "On The First Commandment"
    number: 330
    question: "How do we sin against the love of God?"
    text: "We sin against the love of God by all sin, but particularly by mortal sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/331"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 331
    question: "Does the first Commandment forbid the honoring of the saints?"
    text: "The first Commandment does not forbid the honoring of the saints, but rather approves of it; because by honoring the saints, who are the chosen friends of God, we honor God Himself."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/332"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 332
    question: "Does the first Commandment forbid us to pray to the saints?"
    text: "The first Commandment does not forbid us to pray to the saints."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/333"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 333
    question: "What do we mean by praying to the saints?"
    text: "By praying to the saints we mean the asking of their help and prayers."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/334"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 334
    question: "How do we know that the saints hear us?"
    text: "We know that the saints hear us, because they are with God, who makes our prayers known to them."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/335"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 335
    question: "Why do we believe that the saints will help us?"
    text: "We believe that the saints will help us because both they and we are members of the same Church, and they love us as their brethren."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/336"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 336
    question: "How are the saints and we members of the same Church?"
    text: "The saints and we are members of the same Church, because the Church in heaven and the Church on earth are one and the same Church, and all its members are in communion with one another."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/337"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 337
    question: "What is the communion of the members of the Church called?"
    text: "The communion of the members of the Church is called the communion of saints."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/338"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 338
    question: "What does the communion of saints mean?"
    text: "The communion of saints means the union which exists between the members of the Church on earth with one another, and with the blessed in heaven and with the suffering souls in purgatory."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/339"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 339
    question: "What benefits are derived from the communion of saints?"
    text: "The following benefits are derived from the communion of saints:--the faithful on earth assist one another by their prayers and good works, and they are aided by the intercession of the saints in heaven, while both the saints in heaven and the faithful on earth help the souls in purgatory."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/340"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 340
    question: "Does the first Commandment forbid us to honor relics?"
    text: "The first Commandment does not forbid us to honor relics, because relics are the bodies of the saints, or objects directly connected with them or with our Lord."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/341"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 341
    question: "Does the first Commandment forbid the making of images?"
    text: "The first Commandment does forbid the making of images if they are made to be adored as gods, but it does not forbid the making of them to put us in mind of Jesus Christ, His Blessed Mother, and the saints."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/342"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 342
    question: "Is it right to show respect to the pictures and images of Christ and His saints?"
    text: "It is right to show respect to the pictures and images of Christ and His saints, because they are the representations and memorials of them."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/343"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 343
    question: "Is it allowed to pray to the crucifix or to the images and relics of the saints?"
    text: "It is not allowed to pray to the crucifix or images and relics of the saints, for they have no life, nor power to help us, nor sense to hear us."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/344"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 31"
    partNumber: 31
    section: "The First Commandment--On The Honor And Invocation Of Saints"
    number: 344
    question: "Why do we pray before the crucifix and the images and relics of the saints?"
    text: "We pray before the crucifix and images and relics of the saints because they enliven our devotion by exciting pious affections and desires, and by reminding us of Christ and of the saints, that we may imitate their virtues."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/345"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 345
    question: "What is the second Commandment?"
    text: "The second Commandment is: Thou shalt not take the name of the Lord thy God in vain."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/346"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 346
    question: "What are we commanded by the second Commandment?"
    text: "We are commanded by the second Commandment to speak with reverence of God and of the saints, and of all holy things, and to keep our lawful oaths and vows."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/347"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 347
    question: "What is an oath?"
    text: "An oath is the calling upon God to witness the truth of what we say."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/348"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 348
    question: "When may we take an oath?"
    text: "We may take an oath when it is ordered by lawful authority or required for God's honor or for our own or our neighbor's good."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/349"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 349
    question: "What is necessary to make an oath lawful?"
    text: "To make an oath lawful it is necessary that what we swear to, be true, and that there be a sufficient cause for taking an oath."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/350"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 350
    question: "What is a vow?"
    text: "A vow is a deliberate promise made to God to do something that is pleasing to Him."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/351"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 351
    question: "Is it a sin not to fulfill our vows?"
    text: "Not to fulfill our vows is a sin, mortal or venial, according to the nature of the vow and the intention we had in making it."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/352"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 352
    question: "What is forbidden by the second Commandment?"
    text: "The second Commandment forbids all false, rash, unjust, and unnecessary oaths, blasphemy, cursing, and profane words."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/353"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 353
    question: "What is the third Commandment?"
    text: "The third Commandment is: Remember thou keep holy the Sabbath day."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/354"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 354
    question: "What are we commanded by the third Commandment?"
    text: "By the third Commandment we are commanded to keep holy the Lord's day and the holydays of obligation, on which we are to give our time to the service and worship of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/355"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 355
    question: "How are we to worship God on Sundays and holydays of obligation?"
    text: "We are to worship God on Sundays and holydays of obligation by hearing Mass, by prayer, and by other good works."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/356"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 356
    question: "Are the Sabbath day and the Sunday the same?"
    text: "The Sabbath day and the Sunday are not the same. The Sabbath is the seventh day of the week, and is the day which was kept holy in the Old Law; the Sunday is the first day of the week, and is the day which is kept holy in the New Law."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/357"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 357
    question: "Why does the Church command us to keep the Sunday holy instead of the Sabbath?"
    text: "The Church commands us to keep the Sunday holy instead of the Sabbath because on Sunday Christ rose from the dead, and on Sunday He sent the Holy Ghost upon the Apostles."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/358"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 358
    question: "What is forbidden by the third Commandment?"
    text: "The third Commandment forbids all unnecessary servile work and whatever else may hinder the due observance of the Lord's day."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/359"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 359
    question: "What are servile works?"
    text: "Servile works are those which require labor rather of body than of mind."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/360"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 32"
    partNumber: 32
    section: "From The Second To The Fourth Commandment"
    number: 360
    question: "Are servile works on Sunday ever lawful?"
    text: "Servile works are lawful on Sunday when the honor of God, the good of our neighbor, or necessity requires them."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/361"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 361
    question: "What is the fourth Commandment?"
    text: "The fourth Commandment is: Honor thy father and thy mother."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/362"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 362
    question: "What are we commanded by the fourth Commandment?"
    text: "We are commanded by the fourth Commandment to honor, love, and obey our parents in all that is not sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/363"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 363
    question: "Are we bound to honor and obey others than our parents?"
    text: "We are also bound to honor and obey our bishops, pastors, magistrates, teachers, and other lawful superiors."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/364"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 364
    question: "Have parents and superiors any duties towards those who are under their charge?"
    text: "It is the duty of parents and superiors to take good care of all under their charge and give them proper direction and example."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/365"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 365
    question: "What is forbidden by the fourth Commandment?"
    text: "The fourth Commandment forbids all disobedience, contempt, and stubbornness towards our parents or lawful superiors."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/366"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 366
    question: "What is the fifth Commandment?"
    text: "The fifth Commandment is: Thou shalt not kill."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/367"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 367
    question: "What are we commanded by the fifth Commandment?"
    text: "We are commanded by the fifth Commandment to live in peace and union with our neighbor, to respect his rights, to seek his spiritual and bodily welfare, and to take proper care of our own life and health."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/368"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 368
    question: "What is forbidden by the fifth Commandment?"
    text: "The fifth Commandment forbids all wilful murder, fighting, anger, hatred, revenge, and bad example."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/369"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 369
    question: "What is the sixth Commandment?"
    text: "The sixth Commandment is: Thou shalt not commit adultery."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/370"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 370
    question: "What are we commanded by the sixth Commandment?"
    text: "We are commanded by the sixth Commandment to be pure in thought and modest in all our looks, words, and actions."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/371"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 371
    question: "What is forbidden by the sixth Commandment?"
    text: "The sixth commandment forbids all unchaste freedom with another's wife or husband; also all immodesty with ourselves or others in looks, dress, words, or actions."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/372"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 33"
    partNumber: 33
    section: "From The Fourth To The Seventh Commandment"
    number: 372
    question: "Does the sixth Commandment forbid the reading of bad and immodest books and newspapers?"
    text: "The sixth Commandment does forbid the reading of bad and immodest books and newspapers."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/373"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 373
    question: "What is the seventh Commandment?"
    text: "The seventh Commandment is: Thou shalt not steal."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/374"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 374
    question: "What are we commanded by the seventh Commandment?"
    text: "By the seventh Commandment we are commanded to give to all men what belongs to them and to respect their property."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/375"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 375
    question: "What is forbidden by the seventh Commandment?"
    text: "The seventh Commandment forbids all unjust taking or keeping what belongs to another."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/376"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 376
    question: "Are we bound to restore ill-gotten goods?"
    text: "We are bound to restore ill-gotten goods, or the value of them, as far as we are able; otherwise we cannot be forgiven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/377"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 377
    question: "Are we obliged to repair the damage we have unjustly caused?"
    text: "We are bound to repair the damage we have unjustly caused."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/378"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 378
    question: "What is the eighth Commandment?"
    text: "The eighth Commandment is: Thou shalt not bear false witness against thy neighbor."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/379"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 379
    question: "What are we commanded by the eighth Commandment?"
    text: "We are commanded by the eighth Commandment to speak the truth in all things and to be careful of the honor and reputation of every one."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/380"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 380
    question: "What is forbidden by the eighth Commandment?"
    text: "The eighth Commandment forbids all rash judgments, backbiting, slanders, and lies."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/381"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 381
    question: "What must they do who have lied about their neighbor and seriously injured his character?"
    text: "They who have lied about their neighbor and seriously injured his character must repair the injury done as far as they are able, otherwise they will not be forgiven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/382"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 382
    question: "What is the ninth Commandment?"
    text: "The ninth Commandment is: Thou shalt not covet thy neighbor's wife."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/383"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 383
    question: "What are we commanded by the ninth Commandment?"
    text: "We are commanded by the ninth Commandment to keep ourselves pure in thought and desire."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/384"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 384
    question: "What is forbidden by the ninth Commandment?"
    text: "The ninth Commandment forbids unchaste thoughts, desires of another's wife or husband, and all other unlawful impure thoughts and desires."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/385"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 385
    question: "Are impure thoughts and desires always sins?"
    text: "Impure thoughts and desires are always sins, unless they displease us and we try to banish them."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/386"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 386
    question: "What is the tenth Commandment?"
    text: "The tenth Commandment is: Thou shalt not covet thy neighbor's goods."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/387"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 387
    question: "What are we commanded by the tenth Commandment?"
    text: "By the tenth Commandment we are commanded to be content with what we have, and to rejoice in our neighbor's welfare."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/388"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 34"
    partNumber: 34
    section: "From The Seventh To The End Of The Tenth Commandment"
    number: 388
    question: "What is forbidden by the tenth Commandment?"
    text: "The tenth Commandment forbids all desires to take or keep wrongfully what belongs to another."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/389"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 35"
    partNumber: 35
    section: "On The First And Second Commandments Of The Church"
    number: 389
    question: "Which are the chief commandments of the Church?"
    text: "The chief commandments of the Church are six: 1. To hear Mass on Sundays and holydays of obligation. 2. To fast and abstain on the days appointed. 3. To confess at least once a year. 4. To receive the Holy Eucharist during the Easter time. 5. To contribute to the support of our pastors. 6. Not to marry persons who are not Catholics, or who are related to us within the third degree of kindred, nor privately without witnesses, nor to solemnize marriage at forbidden times."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/390"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 35"
    partNumber: 35
    section: "On The First And Second Commandments Of The Church"
    number: 390
    question: "Is it a mortal sin not to hear Mass on a Sunday or a holyday of obligation?"
    text: "It is a mortal sin not to hear Mass on a Sunday or a holyday of obligation, unless we are excused for a serious reason. They also commit a mortal sin who, having others under their charge, hinder them from hearing Mass, without a sufficient reason."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/391"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 35"
    partNumber: 35
    section: "On The First And Second Commandments Of The Church"
    number: 391
    question: "Why were holydays instituted by the Church?"
    text: "Holydays were instituted by the Church to recall to our minds the great mysteries of religion and the virtues and rewards of the saints."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/392"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 35"
    partNumber: 35
    section: "On The First And Second Commandments Of The Church"
    number: 392
    question: "How should we keep the holydays of obligation?"
    text: "We should keep the holydays of obligation as we should keep the Sunday."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/393"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 35"
    partNumber: 35
    section: "On The First And Second Commandments Of The Church"
    number: 393
    question: "What do you mean by fast-days?"
    text: "By fast-days I mean days on which we are allowed but one full meal."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/394"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 35"
    partNumber: 35
    section: "On The First And Second Commandments Of The Church"
    number: 394
    question: "What do you mean by days of abstinence?"
    text: "By days of abstinence I mean days on which we are forbidden to eat flesh-meat, but are allowed the usual number of meals."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/395"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 35"
    partNumber: 35
    section: "On The First And Second Commandments Of The Church"
    number: 395
    question: "Why does the Church command us to fast and abstain?"
    text: "The Church commands us to fast and abstain, in order that we may mortify our passions and satisfy for our sins."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/396"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 35"
    partNumber: 35
    section: "On The First And Second Commandments Of The Church"
    number: 396
    question: "Why does the Church command us to abstain from flesh-meat on Fridays?"
    text: "The Church commands us to abstain from flesh-meat on Fridays, in honor of the day on which our Saviour died."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/397"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 397
    question: "What is meant by the command of confessing at least once a year?"
    text: "By the command of confessing at least once a year is meant that we are obliged, under pain of mortal sin, to go to confession within the year."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/398"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 398
    question: "Should we confess only once a year?"
    text: "We should confess frequently, if we wish to lead a good life."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/399"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 399
    question: "Should children go to Confession?"
    text: "Children should go to Confession when they are old enough to commit sin, which is commonly about the age of seven years."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/400"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 400
    question: "What sin does he commit who neglects to receive Communion during the Easter time?"
    text: "He who neglects to receive Communion during the Easter time commits a mortal sin."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/401"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 401
    question: "What is the Easter time?"
    text: "The Easter time is, in this country, the time between the first Sunday of Lent and Trinity Sunday."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/402"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 402
    question: "Are we obliged to contribute to the support of our pastors?"
    text: "We are obliged to contribute to the support of our pastors, and to bear our share in the expenses of the church and school."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/403"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 403
    question: "What is the meaning of the commandment not to marry within the third degree of kindred?"
    text: "The meaning of the commandment not to marry within the third degree of kindred is that no one is allowed to marry another within the third degree of blood relationship."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/404"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 404
    question: "What is the meaning of the command not to marry privately?"
    text: "The command not to marry privately means that none should marry without the blessing of God's priests or without witnesses."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/405"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 405
    question: "What is the meaning of the precept not to solemnize marriage at forbidden times?"
    text: "The meaning of the precept not to solemnize marriage at forbidden times is that during Lent and Advent the marriage ceremony should not be performed with pomp or a nuptial Mass."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/406"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 406
    question: "What is the nuptial Mass?"
    text: "A nuptial Mass is a Mass appointed by the Church to invoke a special blessing upon the married couple."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/407"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 36"
    partNumber: 36
    section: "On The Third, Fourth, Fifth And Sixth Commandments Of The Church"
    number: 407
    question: "Should Catholics be married at a nuptial Mass?"
    text: "Catholics should be married at a nuptial Mass, because they thereby show greater reverence for the holy Sacrament and bring richer blessings upon their wedded life."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/408"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 408
    question: "When will Christ judge us?"
    text: "Christ will judge us immediately after our death, and on the last day."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/409"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 409
    question: "What is the judgment called which we have to undergo immediately after death?"
    text: "The judgment we have to undergo immediately after death is called the Particular Judgment."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/410"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 410
    question: "What is the judgment called which all men have to undergo on the last day?"
    text: "The judgment which all men have to undergo on the last day is called the General Judgment."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/411"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 411
    question: "Why does Christ judge men immediately after death?"
    text: "Christ judges men immediately after death to reward or punish them according to their deeds."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/412"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 412
    question: "What are the rewards or punishments appointed for men's souls after the Particular Judgment?"
    text: "The rewards or punishments appointed for men's souls after the Particular Judgment are Heaven, Purgatory, and Hell."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/413"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 413
    question: "What is Hell?"
    text: "Hell is a state to which the wicked are condemned, and in which they are deprived of the sight of God for all eternity, and are in dreadful torments."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/414"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 414
    question: "What is Purgatory?"
    text: "Purgatory is a state in which those suffer for a time who die guilty of venial sins, or without having satisfied for the punishment due to their sins."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/415"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 415
    question: "Can the faithful on earth help the souls in Purgatory?"
    text: "The faithful on earth can help the souls in Purgatory by their prayers, fasts, alms-deeds; by indulgences, and by having Masses said for them."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/416"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 416
    question: "If every one is judged immediately after death, what need is there of a General Judgment?"
    text: "There is need of a General Judgment, though every one is judged immediately after death, that the providence of God, which, on earth, often permits the good to suffer and the wicked to prosper, may in the end appear just before all men."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/417"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 417
    question: "Will our bodies share in the reward or punishment of our souls?"
    text: "Our bodies will share in the reward or punishment of our souls, because through the resurrection they will again be united to them."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/418"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 418
    question: "In what state will the bodies of the just rise?"
    text: "The bodies of the just will rise glorious and immortal."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/419"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 419
    question: "Will the bodies of the damned also rise?"
    text: "The bodies of the damned will also rise, but they will be condemned to eternal punishment."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/420"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 420
    question: "What is Heaven?"
    text: "Heaven is the state of everlasting life in which we see God face to face, are made like unto Him in glory, and enjoy eternal happiness."
    note: ""
- type: "CatechismEntry"
  data:
    key: "baltimore-2/421"
    catechism: "Baltimore Catechism No. 2"
    catechismId: "baltimore-2"
    part: "Lesson 37"
    partNumber: 37
    section: "On The Last Judgment And The Resurrection, Hell, Purgatory, And Heaven"
    number: 421
    question: "What words should we bear always in mind?"
    text: "We should bear always in mind these words of our Lord and Saviour Jesus Christ: \"What doth it profit a man if he gain the whole world and suffer the loss of his own soul, or what exchange shall a man give for his soul? For the Son of man shall come in the glory of His Father with His angels; and then will He render to every man according to his works.\""
    note: ""
