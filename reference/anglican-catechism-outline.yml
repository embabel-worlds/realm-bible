
# An Outline of the Faith, commonly called the Catechism, from the 1979 Prayer Book (pages 845-862):
# every question and answer, in the book's order, under its section. The Book of Common Prayer (1979), the Episcopal Church — public domain.
# The Outline gives no Scripture proofs, so none are invented here.
# Source: https://www.bcponline.org/Misc/catechism.html . Generated by scripts/anglican/build_texts.py.

- type: "CatechismEntry"
  data:
    key: "bcp-1979/1"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Human Nature"
    partNumber: 1
    section: "Human Nature"
    number: 1
    question: "What are we by nature?"
    text: "We are part of God's creation, made in the image of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/2"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Human Nature"
    partNumber: 1
    section: "Human Nature"
    number: 2
    question: "What does it mean to be created in the image of God?"
    text: "It means that we are free to make choices: to love, to create, to reason, and to live in harmony with creation and with God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/3"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Human Nature"
    partNumber: 1
    section: "Human Nature"
    number: 3
    question: "Why then do we live apart from God and out of harmony with creation?"
    text: "From the beginning, human beings have misused their freedom and made wrong choices."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/4"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Human Nature"
    partNumber: 1
    section: "Human Nature"
    number: 4
    question: "Why do we not use our freedom as we should?"
    text: "Because we rebel against God, and we put ourselves in the place of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/5"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Human Nature"
    partNumber: 1
    section: "Human Nature"
    number: 5
    question: "What help is there for us?"
    text: "Our help is in God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/6"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Human Nature"
    partNumber: 1
    section: "Human Nature"
    number: 6
    question: "How did God first help us?"
    text: "God first helped us by revealing himself and his will, through nature and history, through many seers and saints, and especially the prophets of Israel."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/7"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Father"
    partNumber: 2
    section: "God the Father"
    number: 7
    question: "What do we learn about God as creator from the revelation to Israel?"
    text: "We learn that there is one God, the Father Almighty, creator of heaven and earth, of all that is, seen and unseen."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/8"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Father"
    partNumber: 2
    section: "God the Father"
    number: 8
    question: "What does this mean?"
    text: "This means that the universe is good, that it is the work of a single loving God who creates, sustains, and directs it."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/9"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Father"
    partNumber: 2
    section: "God the Father"
    number: 9
    question: "What does this mean about our place in the universe?"
    text: "It means that the world belongs to its creator; and that we are called to enjoy it and to care for it in accordance with God's purposes."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/10"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Father"
    partNumber: 2
    section: "God the Father"
    number: 10
    question: "What does this mean about human life?"
    text: "It means that all people are worthy of respect and honor, because all are created in the image of God, and all can respond to the love of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/11"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Father"
    partNumber: 2
    section: "God the Father"
    number: 11
    question: "How was this revelation handed down to us?"
    text: "This revelation was handed down to us through a community created by a covenant with God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/12"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Old Covenant"
    partNumber: 3
    section: "The Old Covenant"
    number: 12
    question: "What is meant by a covenant with God?"
    text: "A covenant is a relationship initiated by God, to which a body of people responds in faith."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/13"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Old Covenant"
    partNumber: 3
    section: "The Old Covenant"
    number: 13
    question: "What is the Old Covenant?"
    text: "The Old Covenant is the one given by God to the Hebrew people."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/14"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Old Covenant"
    partNumber: 3
    section: "The Old Covenant"
    number: 14
    question: "What did God promise them?"
    text: "God promised that they would be his people to bring all the nations of the world to him."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/15"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Old Covenant"
    partNumber: 3
    section: "The Old Covenant"
    number: 15
    question: "What response did God require from the chosen people?"
    text: "God required the chosen people to be faithful; to love justice, to do mercy, and to walk humbly with their God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/16"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Old Covenant"
    partNumber: 3
    section: "The Old Covenant"
    number: 16
    question: "Where is this Old Covenant to be found?"
    text: "The covenant with the Hebrew people is to be found in the books which we call the Old Testament."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/17"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Old Covenant"
    partNumber: 3
    section: "The Old Covenant"
    number: 17
    question: "Where in the Old Testament is God's will for us shown most clearly?"
    text: "God's will for us is shown most clearly in the Ten Commandments."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/18"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ten Commandments"
    partNumber: 4
    section: "The Ten Commandments"
    number: 18
    question: "What are the Ten Commandments?"
    text: "The Ten Commandments are the laws given to Moses and the people of Israel."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/19"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ten Commandments"
    partNumber: 4
    section: "The Ten Commandments"
    number: 19
    question: "What do we learn from these commandments?"
    text: "We learn two things: our duty to God, and our duty to our neighbors."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/20"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ten Commandments"
    partNumber: 4
    section: "The Ten Commandments"
    number: 20
    question: "What is our duty to God?"
    text: "Our duty is to believe and trust in God;"
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/21"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ten Commandments"
    partNumber: 4
    section: "The Ten Commandments"
    number: 21
    question: "What is our duty to our neighbors?"
    text: "Our duty to our neighbors is to love them as ourselves, and to do to other people as we wish them to do to us;"
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/22"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ten Commandments"
    partNumber: 4
    section: "The Ten Commandments"
    number: 22
    question: "What is the purpose of the Ten Commandments?"
    text: "The Ten Commandments were given to define our relationship with God and our neighbors."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/23"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ten Commandments"
    partNumber: 4
    section: "The Ten Commandments"
    number: 23
    question: "Since we do not fully obey them, are they useful at all?"
    text: "Since we do not fully obey them, we see more clearly our sin and our need for redemption."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/24"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Sin and Redemption"
    partNumber: 5
    section: "Sin and Redemption"
    number: 24
    question: "What is sin?"
    text: "Sin is the seeking of our own will instead of the will of God, thus distorting our relationship with God, with other people, and with all creation."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/25"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Sin and Redemption"
    partNumber: 5
    section: "Sin and Redemption"
    number: 25
    question: "How does sin have power over us?"
    text: "Sin has power over us because we lose our liberty when our relationship with God is distorted."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/26"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Sin and Redemption"
    partNumber: 5
    section: "Sin and Redemption"
    number: 26
    question: "What is redemption?"
    text: "Redemption is the act of God which sets us free from the power of evil, sin, and death."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/27"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Sin and Redemption"
    partNumber: 5
    section: "Sin and Redemption"
    number: 27
    question: "How did God prepare us for redemption?"
    text: "God sent the prophets to call us back to himself, to show us our need for redemption, and to announce the coming of the Messiah."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/28"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Sin and Redemption"
    partNumber: 5
    section: "Sin and Redemption"
    number: 28
    question: "What is meant by the Messiah?"
    text: "The Messiah is one sent by God to free us from the power of sin, so that with the help of God we may live in harmony with God, within ourselves, with our neighbors, and with all creation."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/29"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Sin and Redemption"
    partNumber: 5
    section: "Sin and Redemption"
    number: 29
    question: "Who do we believe is the Messiah?"
    text: "The Messiah, or Christ, is Jesus of Nazareth, the only Son of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/30"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Son"
    partNumber: 6
    section: "God the Son"
    number: 30
    question: "What do we mean when we say that Jesus is the only Son of God?"
    text: "We mean that Jesus is the only perfect image of the Father, and shows us the nature of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/31"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Son"
    partNumber: 6
    section: "God the Son"
    number: 31
    question: "What is the nature of God revealed in Jesus?"
    text: "God is love."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/32"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Son"
    partNumber: 6
    section: "God the Son"
    number: 32
    question: "What do we mean when we say that Jesus was conceived by the power of the Holy Spirit and became incarnate from the Virgin Mary?"
    text: "We mean that by God's own act, his divine Son received our human nature from the Virgin Mary, his mother."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/33"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Son"
    partNumber: 6
    section: "God the Son"
    number: 33
    question: "Why did he take our human nature?"
    text: "The divine Son became human, so that in him human beings might be adopted as children of God, and be made heirs of God's kingdom."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/34"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Son"
    partNumber: 6
    section: "God the Son"
    number: 34
    question: "What is the great importance of Jesus' suffering and death?"
    text: "By his obedience, even to suffering and death, Jesus made the offering which we could not make; in him we are freed from the power of sin and reconciled to God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/35"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Son"
    partNumber: 6
    section: "God the Son"
    number: 35
    question: "What is the significance of Jesus' resurrection?"
    text: "By his resurrection, Jesus overcame death and opened for us the way of eternal life."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/36"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Son"
    partNumber: 6
    section: "God the Son"
    number: 36
    question: "What do we mean when we say that he descended to the dead?"
    text: "We mean that he went to the departed and offered them also the benefits of redemption."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/37"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Son"
    partNumber: 6
    section: "God the Son"
    number: 37
    question: "What do we mean when we say that he ascended into heaven and is seated at the right hand of the Father?"
    text: "We mean that Jesus took our human nature into heaven where he now reigns with the Father and intercedes for us."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/38"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "God the Son"
    partNumber: 6
    section: "God the Son"
    number: 38
    question: "How can we share in his victory over sin, suffering, and death?"
    text: "We share in his victory when we are baptized into the New Covenant and become living members of Christ."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/39"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The New Covenant"
    partNumber: 7
    section: "The New Covenant"
    number: 39
    question: "What is the New Covenant?"
    text: "The New Covenant is the new relationship with God given by Jesus Christ, the Messiah, to the apostles; and, through them, to all who believe in him."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/40"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The New Covenant"
    partNumber: 7
    section: "The New Covenant"
    number: 40
    question: "What did the Messiah promise in the New Covenant?"
    text: "Christ promised to bring us into the kingdom of God and give life in all its fullness."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/41"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The New Covenant"
    partNumber: 7
    section: "The New Covenant"
    number: 41
    question: "What response did Christ require?"
    text: "Christ commanded us to believe in him and to keep his commandments."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/42"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The New Covenant"
    partNumber: 7
    section: "The New Covenant"
    number: 42
    question: "What are the commandments taught by Christ?"
    text: "Christ taught us the Summary of the Law and gave us the New Commandment."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/43"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The New Covenant"
    partNumber: 7
    section: "The New Covenant"
    number: 43
    question: "What is the Summary of the Law?"
    text: "You shall love the Lord your God with all your heart, with all your soul, and with all your mind. This is the first and great commandment. And the second is like it: You shall love your neighbor as yourself."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/44"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The New Covenant"
    partNumber: 7
    section: "The New Covenant"
    number: 44
    question: "What is the New Commandment?"
    text: "The New Commandment is that we love one another as Christ loved us."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/45"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The New Covenant"
    partNumber: 7
    section: "The New Covenant"
    number: 45
    question: "Where may we find what Christians believe about Christ?"
    text: "What Christians believe about Christ is found in the Scriptures and summed up in the creeds."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/46"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Creeds"
    partNumber: 8
    section: "The Creeds"
    number: 46
    question: "What are the creeds?"
    text: "The creeds are statements of our basic beliefs about God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/47"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Creeds"
    partNumber: 8
    section: "The Creeds"
    number: 47
    question: "How many creeds does this Church use in its worship?"
    text: "This Church uses two creeds: The Apostles' Creed and the Nicene Creed."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/48"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Creeds"
    partNumber: 8
    section: "The Creeds"
    number: 48
    question: "What is the Apostles' Creed?"
    text: "The Apostles' Creed is the ancient creed of Baptism; it is used in the Church's daily worship to recall our Baptismal Covenant."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/49"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Creeds"
    partNumber: 8
    section: "The Creeds"
    number: 49
    question: "What is the Nicene Creed?"
    text: "The Nicene Creed is the creed of the universal Church and is used at the Eucharist."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/50"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Creeds"
    partNumber: 8
    section: "The Creeds"
    number: 50
    question: "What, then, is the Athanasian Creed?"
    text: "The Athanasian Creed is an ancient document proclaiming the nature of the Incarnation and of God as Trinity."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/51"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Creeds"
    partNumber: 8
    section: "The Creeds"
    number: 51
    question: "What is the Trinity?"
    text: "The Trinity is one God: Father, Son, and Holy Spirit."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/52"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Spirit"
    partNumber: 9
    section: "The Holy Spirit"
    number: 52
    question: "What is the Holy Spirit?"
    text: "The Holy Spirit is the Third Person of the Trinity, God at work in the world and in the Church even now."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/53"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Spirit"
    partNumber: 9
    section: "The Holy Spirit"
    number: 53
    question: "How is the Holy Spirit revealed in the Old Covenant?"
    text: "The Holy Spirit is revealed in the Old Covenant as the giver of life, the One who spoke through the prophets."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/54"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Spirit"
    partNumber: 9
    section: "The Holy Spirit"
    number: 54
    question: "How is the Holy Spirit revealed in the New Covenant?"
    text: "The Holy Spirit is revealed as the Lord who leads us into all truth and enables us to grow in the likeness of Christ."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/55"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Spirit"
    partNumber: 9
    section: "The Holy Spirit"
    number: 55
    question: "How do we recognize the presence of the Holy Spirit in our lives?"
    text: "We recognize the presence of the Holy Spirit when we confess Jesus Christ as Lord and are brought into love and harmony with God, with ourselves, with our neighbors, and with all creation."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/56"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Spirit"
    partNumber: 9
    section: "The Holy Spirit"
    number: 56
    question: "How do we recognize the truths taught by the Holy Spirit?"
    text: "We recognize truths to be taught by the Holy Spirit when they are in accord with the Scriptures."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/57"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Scriptures"
    partNumber: 10
    section: "The Holy Scriptures"
    number: 57
    question: "What are the Holy Scriptures?"
    text: "The Holy Scriptures, commonly called the Bible, are the books of the Old and New Testaments; other books, called the Apocrypha, are often included in the Bible."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/58"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Scriptures"
    partNumber: 10
    section: "The Holy Scriptures"
    number: 58
    question: "What is the Old Testament?"
    text: "The Old Testament consists of books written by the people of the Old Covenant, under the inspiration of the Holy Spirit, to show God at work in nature and history."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/59"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Scriptures"
    partNumber: 10
    section: "The Holy Scriptures"
    number: 59
    question: "What is the New Testament?"
    text: "The New Testament consists of books written by the people of the New Covenant, under the inspiration of the Holy Spirit, to set forth the life and teachings of Jesus and to proclaim the Good News of the Kingdom for all people."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/60"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Scriptures"
    partNumber: 10
    section: "The Holy Scriptures"
    number: 60
    question: "What is the Apocrypha?"
    text: "The Apocrypha is a collection of additional books written by people of the Old Covenant, and used in the Christian Church."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/61"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Scriptures"
    partNumber: 10
    section: "The Holy Scriptures"
    number: 61
    question: "Why do we call the Holy Scriptures the Word of God?"
    text: "We call them the Word of God because God inspired their human authors and because God still speaks to us through the Bible."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/62"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Scriptures"
    partNumber: 10
    section: "The Holy Scriptures"
    number: 62
    question: "How do we understand the meaning of the Bible?"
    text: "We understand the meaning of the Bible by the help of\nthe Holy Spirit, who guides the Church in the true interpretation of the Scriptures."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/63"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Church"
    partNumber: 11
    section: "The Church"
    number: 63
    question: "What is the Church?"
    text: "The Church is the community of the New Covenant."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/64"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Church"
    partNumber: 11
    section: "The Church"
    number: 64
    question: "How is the Church described in the Bible?"
    text: "The Church is described as the Body of which Jesus Christ is the Head and of which all baptized persons are members. It is called the People of God, the New Israel, a holy nation, a royal priesthood, and the pillar and ground of truth."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/65"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Church"
    partNumber: 11
    section: "The Church"
    number: 65
    question: "How is the Church described in the creeds?"
    text: "The Church is described as one, holy, catholic, and apostolic."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/66"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Church"
    partNumber: 11
    section: "The Church"
    number: 66
    question: "Why is the Church described as one?"
    text: "The Church is one, because it is one Body, under one Head, our Lord Jesus Christ."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/67"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Church"
    partNumber: 11
    section: "The Church"
    number: 67
    question: "Why is the Church described as holy?"
    text: "The Church is holy, because the Holy Spirit dwells in it, consecrates its members, and guides them to do God's work."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/68"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Church"
    partNumber: 11
    section: "The Church"
    number: 68
    question: "Why is the Church described as catholic?"
    text: "The Church is catholic, because it proclaims the whole Faith to all people, to the end of time."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/69"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Church"
    partNumber: 11
    section: "The Church"
    number: 69
    question: "Why is the Church described as apostolic?"
    text: "The Church is apostolic, because it continues in the teaching and fellowship of the apostles and is sent to carry out Christ's mission to all people."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/70"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Church"
    partNumber: 11
    section: "The Church"
    number: 70
    question: "What is the mission of the Church?"
    text: "The mission of the Church is to restore all people to unity with God and each other in Christ."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/71"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Church"
    partNumber: 11
    section: "The Church"
    number: 71
    question: "How does the Church pursue its mission?"
    text: "The Church pursues its mission as it prays and worships, proclaims the Gospel, and promotes justice, peace, and love."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/72"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Church"
    partNumber: 11
    section: "The Church"
    number: 72
    question: "Through whom does the Church carry out its mission?"
    text: "The church carries out its mission through the ministry of all its members."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/73"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ministry"
    partNumber: 12
    section: "The Ministry"
    number: 73
    question: "Who are the ministers of the Church?"
    text: "The ministers of the Church are lay persons, bishops, priests, and deacons."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/74"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ministry"
    partNumber: 12
    section: "The Ministry"
    number: 74
    question: "What is the ministry of the laity?"
    text: "The ministry of lay persons is to represent Christ and his Church; to bear witness to him wherever they may be; and, according to the gifts given them, to carry on Christ's work of reconciliation in the world; and to take their place in the life, worship, and governance of the Church."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/75"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ministry"
    partNumber: 12
    section: "The Ministry"
    number: 75
    question: "What is the ministry of a bishop?"
    text: "The ministry of a bishop is to represent Christ and his Church, particularly as apostle, chief priest, and pastor of a diocese; to guard the faith, unity, and discipline of the whole Church; to proclaim the Word of God; to act in Christ's name for the reconciliation of the world and the building up of the Church; and to ordain others to continue Christ's ministry."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/76"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ministry"
    partNumber: 12
    section: "The Ministry"
    number: 76
    question: "What is the ministry of a priest or presbyter?"
    text: "The ministry of a priest is to represent Christ and his Church, particularly as pastor to the people; to share with the bishop in the overseeing of the Church; to proclaim the Gospel; to administer the sacraments; and to bless and declare pardon in the name of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/77"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ministry"
    partNumber: 12
    section: "The Ministry"
    number: 77
    question: "What is the ministry of a deacon?"
    text: "The ministry of a deacon is to represent Christ and his Church, particularly as a servant of those in need; and to assist bishops and priests in the proclamation of the Gospel and the administration of the sacraments."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/78"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Ministry"
    partNumber: 12
    section: "The Ministry"
    number: 78
    question: "What is the duty of all Christians?"
    text: "The duty of all Christians is to follow Christ; to come together week by week for corporate worship; and to work, pray, and give for the spread of the kingdom of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/79"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 79
    question: "What is prayer?"
    text: "Prayer is responding to God, by thought and by deeds, with or without words."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/80"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 80
    question: "What is Christian Prayer?"
    text: "Christian prayer is response to God the Father, through Jesus Christ, in the power of the Holy Spirit."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/81"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 81
    question: "What prayer did Christ teach us?"
    text: "Our Lord gave us the example of prayer known as the Lord's Prayer. See page 364."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/82"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 82
    question: "What are the principal kinds of prayer?"
    text: "The principal kinds of prayer are adoration, praise, thanksgiving, penitence, oblation, intercession, and petition."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/83"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 83
    question: "What is adoration?"
    text: "Adoration is the lifting up of the heart and mind to God, asking nothing but to enjoy God's presence."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/84"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 84
    question: "Why do we praise God?"
    text: "We praise God, not to obtain anything, but because God's Being draws praise from us."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/85"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 85
    question: "For what do we offer thanksgiving?"
    text: "Thanksgiving is offered to God for all the blessings of this life, for our redemption, and for whatever draws us closer to God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/86"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 86
    question: "What is penitence?"
    text: "In penitence, we confess our sins and make restitution where possible, with the intention to amend our lives."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/87"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 87
    question: "What is prayer of oblation?"
    text: "Oblation is an offering of ourselves, our lives and labors, in union with Christ, for the purposes of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/88"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 88
    question: "What are intercession and petition?"
    text: "Intercession brings before God the needs of others; in petition, we present our own needs, that God's will may be done."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/89"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Prayer and Worship"
    partNumber: 13
    section: "Prayer and Worship"
    number: 89
    question: "What is corporate worship?"
    text: "In corporate worship, we unite ourselves with others to acknowledge the holiness of God, to hear God's Word, to offer prayer, and to celebrate the sacraments."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/90"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Sacraments"
    partNumber: 14
    section: "The Sacraments"
    number: 90
    question: "What are the sacraments?"
    text: "The sacraments are outward and visible signs of inward and spiritual grace, given by Christ as sure and certain means by which we receive that grace."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/91"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Sacraments"
    partNumber: 14
    section: "The Sacraments"
    number: 91
    question: "What is grace?"
    text: "Grace is God's favor towards us, unearned and undeserved; by grace God forgives our sins, enlightens our minds, stirs our hearts, and strengthens our wills."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/92"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Sacraments"
    partNumber: 14
    section: "The Sacraments"
    number: 92
    question: "What are the two great sacraments of the Gospel?"
    text: "The two great sacraments given by Christ to his Church are Holy Baptism and the Holy Eucharist."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/93"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Holy Baptism"
    partNumber: 15
    section: "Holy Baptism"
    number: 93
    question: "What is Holy Baptism?"
    text: "Holy Baptism is the sacrament by which God adopts us as his children and makes us members of Christ's Body, the Church, and inheritors of the kingdom of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/94"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Holy Baptism"
    partNumber: 15
    section: "Holy Baptism"
    number: 94
    question: "What is the outward and visible sign in Baptism?"
    text: "The outward and visible sign in Baptism is water, in which the person is baptized in the Name of the Father, and of the Son, and of the Holy Spirit."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/95"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Holy Baptism"
    partNumber: 15
    section: "Holy Baptism"
    number: 95
    question: "What is the inward and spiritual grace in Baptism?"
    text: "The inward and spiritual grace in Baptism is union with Christ in his death and resurrection, birth into God's family the Church, forgiveness of sins, and new life in the Holy Spirit."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/96"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Holy Baptism"
    partNumber: 15
    section: "Holy Baptism"
    number: 96
    question: "What is required of us at Baptism?"
    text: "It is required that we renounce Satan, repent of our sins, and accept Jesus as our Lord and Savior."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/97"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Holy Baptism"
    partNumber: 15
    section: "Holy Baptism"
    number: 97
    question: "Why then are infants baptized?"
    text: "Infants are baptized so that they can share citizenship in the Covenant, membership in Christ, and redemption by God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/98"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Holy Baptism"
    partNumber: 15
    section: "Holy Baptism"
    number: 98
    question: "How are the promises for infants made and carried out?"
    text: "Promises are made for them by their parents and sponsors, who guarantee that the infants will be brought up within the Church, to know Christ and be able to follow him."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/99"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Eucharist"
    partNumber: 16
    section: "The Holy Eucharist"
    number: 99
    question: "What is the Holy Eucharist?"
    text: "The Holy Eucharist is the sacrament commanded by Christ for the continual remembrance of his life, death, and resurrection, until his coming again."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/100"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Eucharist"
    partNumber: 16
    section: "The Holy Eucharist"
    number: 100
    question: "Why is the Eucharist called a sacrifice?"
    text: "Because the Eucharist, the Church's sacrifice of praise and thanksgiving, is the way by which the sacrifice of Christ is made present, and in which he unites us to his one offering of himself."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/101"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Eucharist"
    partNumber: 16
    section: "The Holy Eucharist"
    number: 101
    question: "By what other names is this service known?"
    text: "The Holy Eucharist is called the Lord's Supper, and Holy Communion; it is also known as the Divine Liturgy, the Mass, and the Great Offering."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/102"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Eucharist"
    partNumber: 16
    section: "The Holy Eucharist"
    number: 102
    question: "What is the outward and visible sign in the Eucharist?"
    text: "The outward and visible sign in the Eucharist is bread and wine, given and received according to Christ's command."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/103"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Eucharist"
    partNumber: 16
    section: "The Holy Eucharist"
    number: 103
    question: "What is the inward and spiritual grace given in the Eucharist?"
    text: "The inward and spiritual grace in the Holy Communion is the Body and Blood of Christ given to his people, and received by faith."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/104"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Eucharist"
    partNumber: 16
    section: "The Holy Eucharist"
    number: 104
    question: "What are the benefits which we receive in the Lord's Supper?"
    text: "The benefits we receive are the forgiveness of our sins,\nthe strengthening of our union with Christ and one another, and the foretaste of the heavenly banquet which is our nourishment in eternal life."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/105"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Holy Eucharist"
    partNumber: 16
    section: "The Holy Eucharist"
    number: 105
    question: "What is required of us when we come to the Eucharist?"
    text: "It is required that we should examine our lives, repent of our sins, and be in love and charity with all people."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/106"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Other Sacramental Rites"
    partNumber: 17
    section: "Other Sacramental Rites"
    number: 106
    question: "What other sacramental rites evolved in the Church under the guidance of the Holy Spirit?"
    text: "Other sacramental rites which evolved in the Church include confirmation, ordination, holy matrimony, reconciliation of a penitent, and unction."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/107"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Other Sacramental Rites"
    partNumber: 17
    section: "Other Sacramental Rites"
    number: 107
    question: "How do they differ from the two sacraments of the Gospel?"
    text: "Although they are means of grace, they are not necessary for all persons in the same way that Baptism and the Eucharist are."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/108"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Other Sacramental Rites"
    partNumber: 17
    section: "Other Sacramental Rites"
    number: 108
    question: "What is Confirmation?"
    text: "Confirmation is the rite in which we express a mature commitment to Christ, and receive strength from the Holy Spirit through prayer and the laying on of hands by a bishop."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/109"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Other Sacramental Rites"
    partNumber: 17
    section: "Other Sacramental Rites"
    number: 109
    question: "What is required of those to be confirmed?"
    text: "It is required of those to be confirmed that they have been baptized, are sufficiently instructed in the Christian Faith, are penitent for their sins, and are ready to affirm their confession of Jesus Christ as Savior and Lord."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/110"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Other Sacramental Rites"
    partNumber: 17
    section: "Other Sacramental Rites"
    number: 110
    question: "What is Ordination?"
    text: "Ordination is the rite in which God gives authority and the grace of the Holy Spirit to those being made bishops,\npriests, and deacons, through prayer and the laying on of hands by bishops."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/111"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Other Sacramental Rites"
    partNumber: 17
    section: "Other Sacramental Rites"
    number: 111
    question: "What is Holy Matrimony?"
    text: "Holy Matrimony is Christian marriage, in which the woman and man enter into a life-long union, make their vows before God and the Church, and receive the grace and blessing of God to help them fulfill their vows."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/112"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Other Sacramental Rites"
    partNumber: 17
    section: "Other Sacramental Rites"
    number: 112
    question: "What is Reconciliation of a Penitent?"
    text: "Reconciliation of a Penitent, or Penance, is the rite in which those who repent of their sins may confess them to God in the presence of a priest, and receive the assurance of pardon and the grace of absolution."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/113"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Other Sacramental Rites"
    partNumber: 17
    section: "Other Sacramental Rites"
    number: 113
    question: "What is Unction of the Sick?"
    text: "Unction is the rite of anointing the sick with oil, or the laying on of hands, by which God's grace is given for the healing of spirit, mind, and body."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/114"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Other Sacramental Rites"
    partNumber: 17
    section: "Other Sacramental Rites"
    number: 114
    question: "Is God's activity limited to these rites?"
    text: "God does not limit himself to these rites; they are patterns of countless ways by which God uses material things to reach out to us."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/115"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "Other Sacramental Rites"
    partNumber: 17
    section: "Other Sacramental Rites"
    number: 115
    question: "How are the sacraments related to our Christian hope?"
    text: "Sacraments sustain our present hope and anticipate its future fulfillment."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/116"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Christian Hope"
    partNumber: 18
    section: "The Christian Hope"
    number: 116
    question: "What is the Christian hope?"
    text: "The Christian hope is to live with confidence in newness and fullness of life, and to await the coming of Christ in glory, and the completion of God's purpose for the world."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/117"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Christian Hope"
    partNumber: 18
    section: "The Christian Hope"
    number: 117
    question: "What do we mean by the coming of Christ in glory?"
    text: "By the coming of Christ in glory, we mean that Christ will come, not in weakness but in power, and will make all things new."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/118"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Christian Hope"
    partNumber: 18
    section: "The Christian Hope"
    number: 118
    question: "What do we mean by heaven and hell?"
    text: "By heaven, we mean eternal life in our enjoyment of God; by hell, we mean eternal death in our rejection of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/119"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Christian Hope"
    partNumber: 18
    section: "The Christian Hope"
    number: 119
    question: "Why do we pray for the dead?"
    text: "We pray for them, because we still hold them in our love, and because we trust that in God's presence those who have chosen to serve him will grow in his love, until they see him as he is."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/120"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Christian Hope"
    partNumber: 18
    section: "The Christian Hope"
    number: 120
    question: "What do we mean by the last judgment?"
    text: "We believe that Christ will come in glory and judge the living and the dead."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/121"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Christian Hope"
    partNumber: 18
    section: "The Christian Hope"
    number: 121
    question: "What do we mean by the resurrection of the body?"
    text: "We mean that God will raise us from death in the fullness of our being, that we may live with Christ in the communion of the saints."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/122"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Christian Hope"
    partNumber: 18
    section: "The Christian Hope"
    number: 122
    question: "What is the communion of saints?"
    text: "The communion of saints is the whole family of God, the living and the dead, those whom we love and those whom we hurt, bound together in Christ by sacrament, prayer, and praise."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/123"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Christian Hope"
    partNumber: 18
    section: "The Christian Hope"
    number: 123
    question: "What do we mean by everlasting life?"
    text: "By everlasting life, we mean a new existence, in which we are united with all the people of God, in the joy of fully knowing and loving God and each other."
    note: ""
- type: "CatechismEntry"
  data:
    key: "bcp-1979/124"
    catechism: "An Outline of the Faith (BCP 1979)"
    catechismId: "bcp-1979"
    part: "The Christian Hope"
    partNumber: 18
    section: "The Christian Hope"
    number: 124
    question: "What, then, is our assurance as Christians?"
    text: "Our assurance as Christians is that nothing, not even death, shall separate us from the love of God which is in Christ Jesus our Lord. Amen."
    note: ""
