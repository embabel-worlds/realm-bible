    apiRef: 1Corinthians13:12
    book: 1Cor
    chapter: 13
    verse: 12
    text: 'For now we see through a glass, darkly; but then face to face: now I know in part; but then shall I know even as also I am known.'
    web: For now we see in a mirror, dimly, but then face to face. Now I know in part, but then I will know fully, even as I was also fully known.
