    name: 1 Corinthians 14:5
    apiRef: 1Corinthians14:5
    book: 1Cor
    chapter: 14
    verse: 5
    text: 'I would that ye all spake with tongues, but rather that ye prophesied: for greater is he that prophesieth than he that speaketh with tongues, except he interpret, that the church may receive edifying.'
    web: Now I desire to have you all speak with other languages, but even more that you would prophesy. For he is greater who prophesies than he who speaks with other languages, unless he interprets, that the assembly may be built up.
