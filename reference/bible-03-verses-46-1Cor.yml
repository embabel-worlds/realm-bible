    name: 1 Corinthians 14:4
    apiRef: 1Corinthians14:4
    book: 1Cor
    chapter: 14
    verse: 4
    text: He that speaketh in an unknown tongue edifieth himself; but he that prophesieth edifieth the church.
    web: He who speaks in another language edifies himself, but he who prophesies edifies the assembly.
