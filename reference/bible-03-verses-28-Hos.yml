  data:
    osis: Hos.9.9
    name: Hosea 9:9
    apiRef: Hosea9:9
    book: Hos
    chapter: 9
    verse: 9
    text: 'They have deeply corrupted themselves, as in the days of Gibeah: therefore he will remember their iniquity, he will visit their sins.'
    web: They have deeply corrupted themselves, as in the days of Gibeah. He will remember their iniquity. He will punish them for their sins.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
- type: Verse
  data:
    osis: Hos.9.10
    name: Hosea 9:10
    apiRef: Hosea9:10
    book: Hos
    chapter: 9
    verse: 10
    text: 'I found Israel like grapes in the wilderness; I saw your fathers as the firstripe in the fig tree at her first time: but they went to Baalpeor, and separated themselves unto that shame; and their abominations were according as they loved.'
    web: I found Israel like grapes in the wilderness. I saw your fathers as the first ripe in the fig tree at its first season; but they came to Baal Peor, and consecrated themselves to the shameful thing, and became abominable like that which they loved.
    people:
    - baal_573
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
