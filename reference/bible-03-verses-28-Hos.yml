  data:
    osis: Hos.9.5
    name: Hosea 9:5
    apiRef: Hosea9:5
    book: Hos
    chapter: 9
    verse: 5
    text: What will ye do in the solemn day, and in the day of the feast of the LORD?
    web: What will you do in the day of solemn assembly, and in the day of the feast of the LORD?
    people:
    - god_1324
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
- type: Verse
  data:
    osis: Hos.9.6
    name: Hosea 9:6
    apiRef: Hosea9:6
    book: Hos
    chapter: 9
    verse: 6
    text: 'For, lo, they are gone because of destruction: Egypt shall gather them up, Memphis shall bury them: the pleasant places for their silver, nettles shall possess them: thorns shall be in their tabernacles.'
    web: For, behold, when they flee destruction, Egypt will gather them up. Memphis will bury them. Nettles will possess their pleasant things of silver. Thorns will be in their tents.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
- type: Verse
  data:
    osis: Hos.9.7
    name: Hosea 9:7
    apiRef: Hosea9:7
    book: Hos
    chapter: 9
    verse: 7
    text: 'The days of visitation are come, the days of recompence are come; Israel shall know it: the prophet is a fool, the spiritual man is mad, for the multitude of thine iniquity, and the great hatred.'
    web: The days of visitation have come. The days of reckoning have come. Israel will consider the prophet to be a fool, and the man who is inspired to be insane, because of the abundance of your sins, and because your hostility is great.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
- type: Verse
  data:
    osis: Hos.9.8
    name: Hosea 9:8
    apiRef: Hosea9:8
    book: Hos
    chapter: 9
    verse: 8
    text: 'The watchman of Ephraim was with my God: but the prophet is a snare of a fowler in all his ways, and hatred in the house of his God.'
    web: A prophet watches over Ephraim with my God. A fowler’s snare is on all of his paths, and hostility in the house of his God.
    people:
    - ephraim_1206
    - god_1324
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
