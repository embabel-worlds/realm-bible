  data:
    osis: Hos.8.13
    name: Hosea 8:13
    apiRef: Hosea8:13
    book: Hos
    chapter: 8
    verse: 13
    text: 'They sacrifice flesh for the sacrifices of mine offerings, and eat it; but the LORD accepteth them not; now will he remember their iniquity, and visit their sins: they shall return to Egypt.'
    web: As for the sacrifices of my offerings, they sacrifice meat and eat it, but the LORD doesn’t accept them. Now he will remember their iniquity, and punish their sins. They will return to Egypt.
    people:
    - god_1324
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.8
- type: Verse
  data:
    osis: Hos.8.14
    name: Hosea 8:14
    apiRef: Hosea8:14
    book: Hos
    chapter: 8
    verse: 14
    text: 'For Israel hath forgotten his Maker, and buildeth temples; and Judah hath multiplied fenced cities: but I will send a fire upon his cities, and it shall devour the palaces thereof.'
    web: For Israel has forgotten his Maker and built palaces; and Judah has multiplied fortified cities; but I will send a fire on his cities, and it will devour its fortresses.”
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.8
- type: Verse
  data:
    osis: Hos.9.1
    name: Hosea 9:1
    apiRef: Hosea9:1
    book: Hos
    chapter: 9
    verse: 1
    text: 'Rejoice not, O Israel, for joy, as other people: for thou hast gone a whoring from thy God, thou hast loved a reward upon every cornfloor.'
    web: Don’t rejoice, Israel, to jubilation like the nations; for you were unfaithful to your God. You love the wages of a prostitute at every grain threshing floor.
    people:
    - god_1324
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
- type: Verse
  data:
    osis: Hos.9.2
    name: Hosea 9:2
    apiRef: Hosea9:2
    book: Hos
    chapter: 9
    verse: 2
    text: The floor and the winepress shall not feed them, and the new wine shall fail in her.
    web: The threshing floor and the wine press won’t feed them, and the new wine will fail her.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
- type: Verse
  data:
    osis: Hos.9.3
    name: Hosea 9:3
    apiRef: Hosea9:3
    book: Hos
    chapter: 9
    verse: 3
    text: They shall not dwell in the LORD’S land; but Ephraim shall return to Egypt, and they shall eat unclean things in Assyria.
    web: They won’t dwell in the LORD’s land; but Ephraim will return to Egypt, and they will eat unclean food in Assyria.
    people:
    - ephraim_1206
    - god_1324
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
- type: Verse
  data:
    osis: Hos.9.4
    name: Hosea 9:4
    apiRef: Hosea9:4
    book: Hos
    chapter: 9
    verse: 4
    text: 'They shall not offer wine offerings to the LORD, neither shall they be pleasing unto him: their sacrifices shall be unto them as the bread of mourners; all that eat thereof shall be polluted: for their bread for their soul shall not come into the house of the LORD.'
    web: They won’t pour out wine offerings to the LORD, neither will they be pleasing to him. Their sacrifices will be to them like the bread of mourners; all who eat of it will be polluted; for their bread will be for their appetite. It will not come into the LORD’s house.
    people:
    - god_1324
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
