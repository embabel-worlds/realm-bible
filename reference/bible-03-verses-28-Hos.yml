  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.8
- type: Verse
  data:
    osis: Hos.8.5
    name: Hosea 8:5
    apiRef: Hosea8:5
    book: Hos
    chapter: 8
    verse: 5
    text: 'Thy calf, O Samaria, hath cast thee off; mine anger is kindled against them: how long will it be ere they attain to innocency?'
    web: Let Samaria throw out his calf idol! My anger burns against them! How long will it be until they are capable of purity?
    event: Prophecies of Hosea
  relations:
