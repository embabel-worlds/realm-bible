  data:
    osis: Hos.7.15
    name: Hosea 7:15
    apiRef: Hosea7:15
    book: Hos
    chapter: 7
    verse: 15
    text: Though I have bound and strengthened their arms, yet do they imagine mischief against me.
    web: Though I have taught and strengthened their arms, yet they plot evil against me.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.7
- type: Verse
  data:
    osis: Hos.7.16
    name: Hosea 7:16
    apiRef: Hosea7:16
    book: Hos
    chapter: 7
    verse: 16
    text: 'They return, but not to the most High: they are like a deceitful bow: their princes shall fall by the sword for the rage of their tongue: this shall be their derision in the land of Egypt.'
    web: They return, but not to the Most High. They are like a faulty bow. Their princes will fall by the sword for the rage of their tongue. This will be their derision in the land of Egypt.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.7
