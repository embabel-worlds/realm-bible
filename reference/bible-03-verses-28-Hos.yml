  data:
    osis: Hos.7.8
    name: Hosea 7:8
    apiRef: Hosea7:8
    book: Hos
    chapter: 7
    verse: 8
    text: Ephraim, he hath mixed himself among the people; Ephraim is a cake not turned.
    web: Ephraim mixes himself among the nations. Ephraim is a pancake not turned over.
