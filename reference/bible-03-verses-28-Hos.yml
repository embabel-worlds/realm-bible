  data:
    osis: Hos.7.10
    name: Hosea 7:10
    apiRef: Hosea7:10
    book: Hos
    chapter: 7
    verse: 10
    text: 'And the pride of Israel testifieth to his face: and they do not return to the LORD their God, nor seek him for all this.'
    web: The pride of Israel testifies to his face; yet they haven’t returned to the LORD their God, nor sought him, for all this.
