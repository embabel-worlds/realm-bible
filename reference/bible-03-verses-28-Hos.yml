  data:
    osis: Hos.8.7
    name: Hosea 8:7
    apiRef: Hosea8:7
    book: Hos
    chapter: 8
    verse: 7
    text: 'For they have sown the wind, and they shall reap the whirlwind: it hath no stalk: the bud shall yield no meal: if so be it yield, the strangers shall swallow it up.'
    web: For they sow the wind, and they will reap the whirlwind. He has no standing grain. The stalk will yield no head. If it does yield, strangers will swallow it up.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.8
