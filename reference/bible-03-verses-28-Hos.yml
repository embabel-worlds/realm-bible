    apiRef: Hosea10:2
    book: Hos
    chapter: 10
    verse: 2
    text: 'Their heart is divided; now shall they be found faulty: he shall break down their altars, he shall spoil their images.'
    web: Their heart is divided. Now they will be found guilty. He will demolish their altars. He will destroy their sacred stones.
