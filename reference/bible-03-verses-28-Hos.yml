    apiRef: Hosea10:1
    book: Hos
    chapter: 10
    verse: 1
    text: 'Israel is an empty vine, he bringeth forth fruit unto himself: according to the multitude of his fruit he hath increased the altars; according to the goodness of his land they have made goodly images.'
    web: Israel is a luxuriant vine that produces his fruit. According to the abundance of his fruit he has multiplied his altars. As their land has prospered, they have adorned their sacred stones.
    event: Prophecies of Hosea
