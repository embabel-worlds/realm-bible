  data:
    osis: Hos.7.4
    name: Hosea 7:4
    apiRef: Hosea7:4
    book: Hos
    chapter: 7
    verse: 4
    text: They are all adulterers, as an oven heated by the baker, who ceaseth from raising after he hath kneaded the dough, until it be leavened.
    web: They are all adulterers. They are burning like an oven that the baker stops stirring, from the kneading of the dough, until it is leavened.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.7
