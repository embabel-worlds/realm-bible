  data:
    osis: Hos.7.11
    name: Hosea 7:11
    apiRef: Hosea7:11
    book: Hos
    chapter: 7
    verse: 11
    text: 'Ephraim also is like a silly dove without heart: they call to Egypt, they go to Assyria.'
    web: “Ephraim is like an easily deceived dove, without understanding. They call to Egypt. They go to Assyria.
    people:
    - ephraim_1206
