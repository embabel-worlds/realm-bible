    apiRef: Hosea10:3
    book: Hos
    chapter: 10
    verse: 3
    text: For now they shall say, We have no king, because we feared not the LORD; what then should a king do to us?
    web: Surely now they will say, “We have no king; for we don’t fear the LORD; and the king, what can he do for us?”
