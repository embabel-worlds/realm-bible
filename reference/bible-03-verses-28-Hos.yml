  data:
    osis: Hos.8.9
    name: Hosea 8:9
    apiRef: Hosea8:9
    book: Hos
    chapter: 8
    verse: 9
    text: 'For they are gone up to Assyria, a wild ass alone by himself: Ephraim hath hired lovers.'
    web: For they have gone up to Assyria, like a wild donkey wandering alone. Ephraim has hired lovers for himself.
