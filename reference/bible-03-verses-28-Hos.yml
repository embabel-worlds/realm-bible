  data:
    osis: Hos.8.12
    name: Hosea 8:12
    apiRef: Hosea8:12
    book: Hos
    chapter: 8
    verse: 12
    text: I have written to him the great things of my law, but they were counted as a strange thing.
    web: I wrote for him the many things of my law, but they were regarded as a strange thing.
    event: Prophecies of Hosea
  relations:
