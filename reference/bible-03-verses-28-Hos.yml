  data:
    osis: Hos.8.11
    name: Hosea 8:11
    apiRef: Hosea8:11
    book: Hos
    chapter: 8
    verse: 11
    text: Because Ephraim hath made many altars to sin, altars shall be unto him to sin.
    web: Because Ephraim has multiplied altars for sinning, they became for him altars for sinning.
    people:
    - ephraim_1206
