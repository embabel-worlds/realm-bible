  data:
    osis: Hos.7.2
    name: Hosea 7:2
    apiRef: Hosea7:2
    book: Hos
    chapter: 7
    verse: 2
    text: 'And they consider not in their hearts that I remember all their wickedness: now their own doings have beset them about; they are before my face.'
    web: They don’t consider in their hearts that I remember all their wickedness. Now their own deeds have engulfed them. They are before my face.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.7
