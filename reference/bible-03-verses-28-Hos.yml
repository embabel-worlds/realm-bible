    osis: Hos.8.6
    name: Hosea 8:6
    apiRef: Hosea8:6
    book: Hos
    chapter: 8
    verse: 6
    text: 'For from Israel was it also: the workman made it; therefore it is not God: but the calf of Samaria shall be broken in pieces.'
    web: For this is even from Israel! The workman made it, and it is no God; indeed, the calf of Samaria shall be broken in pieces.
