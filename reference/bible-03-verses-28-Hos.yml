  data:
    osis: Hos.7.5
    name: Hosea 7:5
    apiRef: Hosea7:5
    book: Hos
    chapter: 7
    verse: 5
    text: In the day of our king the princes have made him sick with bottles of wine; he stretched out his hand with scorners.
    web: On the day of our king, the princes made themselves sick with the heat of wine. He joined his hand with mockers.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.7
