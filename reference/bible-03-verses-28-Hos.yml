  data:
    osis: Hos.7.6
    name: Hosea 7:6
    apiRef: Hosea7:6
    book: Hos
    chapter: 7
    verse: 6
    text: 'For they have made ready their heart like an oven, whiles they lie in wait: their baker sleepeth all the night; in the morning it burneth as a flaming fire.'
    web: For they have prepared their heart like an oven, while they lie in wait. Their anger smolders all night. In the morning it burns as a flaming fire.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.7
- type: Verse
  data:
    osis: Hos.7.7
    name: Hosea 7:7
    apiRef: Hosea7:7
    book: Hos
    chapter: 7
    verse: 7
    text: 'They are all hot as an oven, and have devoured their judges; all their kings are fallen: there is none among them that calleth unto me.'
    web: They are all hot as an oven, and devour their judges. All their kings have fallen. There is no one among them who calls to me.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.7
