    name: Hosea 7:9
    apiRef: Hosea7:9
    book: Hos
    chapter: 7
    verse: 9
    text: 'Strangers have devoured his strength, and he knoweth it not: yea, gray hairs are here and there upon him, yet he knoweth not.'
    web: Strangers have devoured his strength, and he doesn’t realize it. Indeed, gray hairs are here and there on him, and he doesn’t realize it.
    event: Prophecies of Hosea
  relations:
