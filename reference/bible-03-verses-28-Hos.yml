  data:
    osis: Hos.8.8
    name: Hosea 8:8
    apiRef: Hosea8:8
    book: Hos
    chapter: 8
    verse: 8
    text: 'Israel is swallowed up: now shall they be among the Gentiles as a vessel wherein is no pleasure.'
    web: Israel is swallowed up. Now they are among the nations like a worthless thing.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.8
