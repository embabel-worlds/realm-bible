  data:
    osis: Hos.7.12
    name: Hosea 7:12
    apiRef: Hosea7:12
    book: Hos
    chapter: 7
    verse: 12
    text: When they shall go, I will spread my net upon them; I will bring them down as the fowls of the heaven; I will chastise them, as their congregation hath heard.
    web: When they go, I will spread my net on them. I will bring them down like the birds of the sky. I will chastise them, as their congregation has heard.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.7
- type: Verse
  data:
    osis: Hos.7.13
    name: Hosea 7:13
    apiRef: Hosea7:13
    book: Hos
    chapter: 7
    verse: 13
    text: 'Woe unto them! for they have fled from me: destruction unto them! because they have transgressed against me: though I have redeemed them, yet they have spoken lies against me.'
    web: Woe to them! For they have wandered from me. Destruction to them! For they have trespassed against me. Though I would redeem them, yet they have spoken lies against me.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.7
- type: Verse
  data:
    osis: Hos.7.14
    name: Hosea 7:14
    apiRef: Hosea7:14
    book: Hos
    chapter: 7
    verse: 14
    text: 'And they have not cried unto me with their heart, when they howled upon their beds: they assemble themselves for corn and wine, and they rebel against me.'
    web: They haven’t cried to me with their heart, but they howl on their beds. They assemble themselves for grain and new wine. They turn away from me.
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.7
