  data:
    osis: Hos.9.11
    name: Hosea 9:11
    apiRef: Hosea9:11
    book: Hos
    chapter: 9
    verse: 11
    text: As for Ephraim, their glory shall fly away like a bird, from the birth, and from the womb, and from the conception.
    web: As for Ephraim, their glory will fly away like a bird. There will be no birth, no one with child, and no conception.
    people:
    - ephraim_1206
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
