    osis: Hos.9.12
    name: Hosea 9:12
    apiRef: Hosea9:12
    book: Hos
    chapter: 9
    verse: 12
    text: 'Though they bring up their children, yet will I bereave them, that there shall not be a man left: yea, woe also to them when I depart from them!'
    web: Though they bring up their children, yet I will bereave them, so that not a man shall be left. Indeed, woe also to them when I depart from them!
    event: Prophecies of Hosea
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hos.9
