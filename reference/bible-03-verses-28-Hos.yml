    book: Hos
    chapter: 10
    verse: 4
    text: 'They have spoken words, swearing falsely in making a covenant: thus judgment springeth up as hemlock in the furrows of the field.'
    web: They make promises, swearing falsely in making covenants. Therefore judgment springs up like poisonous weeds in the furrows of the field.
