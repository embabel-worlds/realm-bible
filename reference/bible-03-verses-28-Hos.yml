    apiRef: Hosea8:1
    book: Hos
    chapter: 8
    verse: 1
    text: Set the trumpet to thy mouth. He shall come as an eagle against the house of the LORD, because they have transgressed my covenant, and trespassed against my law.
    web: “Put the trumpet to your lips! Something like an eagle is over the LORD’s house, because they have broken my covenant and rebelled against my law.
    people:
    - god_1324
    event: Prophecies of Hosea
