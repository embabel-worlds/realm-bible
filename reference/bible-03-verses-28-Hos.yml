  data:
    osis: Hos.8.10
    name: Hosea 8:10
    apiRef: Hosea8:10
    book: Hos
    chapter: 8
    verse: 10
    text: Yea, though they have hired among the nations, now will I gather them, and they shall sorrow a little for the burden of the king of princes.
    web: But although they sold themselves among the nations, I will now gather them; and they begin to waste away because of the oppression of the king of mighty ones.
