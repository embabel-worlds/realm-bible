    name: Song of Solomon 8:14
    apiRef: SongofSolomon8:14
    book: Song
    chapter: 8
    verse: 14
    text: Make haste, my beloved, and be thou like to a roe or to a young hart upon the mountains of spices.
    web: Come away, my beloved! Be like a gazelle or a young stag on the mountains of spices!
