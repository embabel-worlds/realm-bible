  data:
    osis: Song.7.11
    name: Song of Solomon 7:11
    apiRef: SongofSolomon7:11
    book: Song
    chapter: 7
    verse: 11
    text: Come, my beloved, let us go forth into the field; let us lodge in the villages.
    web: Come, my beloved! Let’s go out into the field. Let’s lodge in the villages.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.7
- type: Verse
  data:
    osis: Song.7.12
    name: Song of Solomon 7:12
    apiRef: SongofSolomon7:12
    book: Song
    chapter: 7
    verse: 12
    text: 'Let us get up early to the vineyards; let us see if the vine flourish, whether the tender grape appear, and the pomegranates bud forth: there will I give thee my loves.'
    web: Let’s go early up to the vineyards. Let’s see whether the vine has budded, its blossom is open, and the pomegranates are in flower. There I will give you my love.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.7
