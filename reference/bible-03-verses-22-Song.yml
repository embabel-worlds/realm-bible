    apiRef: SongofSolomon8:13
    book: Song
    chapter: 8
    verse: 13
    text: 'Thou that dwellest in the gardens, the companions hearken to thy voice: cause me to hear it.'
    web: You who dwell in the gardens, with friends in attendance, let me hear your voice!
