- type: Verse
  data:
    osis: Song.8.1
    name: Song of Solomon 8:1
    apiRef: SongofSolomon8:1
    book: Song
    chapter: 8
    verse: 1
    text: O that thou wert as my brother, that sucked the breasts of my mother! when I should find thee without, I would kiss thee; yea, I should not be despised.
    web: Oh that you were like my brother, who nursed from the breasts of my mother! If I found you outside, I would kiss you; yes, and no one would despise me.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.8
- type: Verse
  data:
    osis: Song.8.2
    name: Song of Solomon 8:2
    apiRef: SongofSolomon8:2
    book: Song
    chapter: 8
    verse: 2
    text: 'I would lead thee, and bring thee into my mother’s house, who would instruct me: I would cause thee to drink of spiced wine of the juice of my pomegranate.'
    web: I would lead you, bringing you into the house of my mother, who would instruct me. I would have you drink spiced wine, of the juice of my pomegranate.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.8
- type: Verse
  data:
    osis: Song.8.3
    name: Song of Solomon 8:3
    apiRef: SongofSolomon8:3
    book: Song
    chapter: 8
    verse: 3
    text: His left hand should be under my head, and his right hand should embrace me.
    web: His left hand would be under my head. His right hand would embrace me.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.8
- type: Verse
  data:
    osis: Song.8.4
    name: Song of Solomon 8:4
    apiRef: SongofSolomon8:4
    book: Song
    chapter: 8
    verse: 4
    text: I charge you, O daughters of Jerusalem, that ye stir not up, nor awake my love, until he please.
    web: I adjure you, daughters of Jerusalem, that you not stir up, nor awaken love, until it so desires.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.8
- type: Verse
  data:
    osis: Song.8.5
    name: Song of Solomon 8:5
    apiRef: SongofSolomon8:5
    book: Song
    chapter: 8
    verse: 5
    text: 'Who is this that cometh up from the wilderness, leaning upon her beloved? I raised thee up under the apple tree: there thy mother brought thee forth: there she brought thee forth that bare thee.'
    web: Who is this who comes up from the wilderness, leaning on her beloved? Beloved Under the apple tree I awakened you. There your mother conceived you. There she was in labor and bore you.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.8
- type: Verse
  data:
    osis: Song.8.6
    name: Song of Solomon 8:6
    apiRef: SongofSolomon8:6
    book: Song
    chapter: 8
    verse: 6
    text: 'Set me as a seal upon thine heart, as a seal upon thine arm: for love is strong as death; jealousy is cruel as the grave: the coals thereof are coals of fire, which hath a most vehement flame.'
    web: Set me as a seal on your heart, as a seal on your arm; for love is strong as death. Jealousy is as cruel as Sheol. Its flashes are flashes of fire, a very flame of the LORD.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.8
- type: Verse
  data:
    osis: Song.8.7
    name: Song of Solomon 8:7
    apiRef: SongofSolomon8:7
    book: Song
    chapter: 8
    verse: 7
    text: 'Many waters cannot quench love, neither can the floods drown it: if a man would give all the substance of his house for love, it would utterly be contemned.'
    web: Many waters can’t quench love, neither can floods drown it. If a man would give all the wealth of his house for love, he would be utterly scorned.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.8
- type: Verse
  data:
    osis: Song.8.8
    name: Song of Solomon 8:8
    apiRef: SongofSolomon8:8
    book: Song
    chapter: 8
    verse: 8
    text: 'We have a little sister, and she hath no breasts: what shall we do for our sister in the day when she shall be spoken for?'
    web: We have a little sister. She has no breasts. What shall we do for our sister in the day when she is to be spoken for?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.8
- type: Verse
  data:
    osis: Song.8.9
    name: Song of Solomon 8:9
    apiRef: SongofSolomon8:9
    book: Song
    chapter: 8
    verse: 9
    text: 'If she be a wall, we will build upon her a palace of silver: and if she be a door, we will inclose her with boards of cedar.'
    web: If she is a wall, we will build on her a turret of silver. If she is a door, we will enclose her with boards of cedar.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.8
- type: Verse
  data:
    osis: Song.8.10
    name: Song of Solomon 8:10
    apiRef: SongofSolomon8:10
    book: Song
    chapter: 8
    verse: 10
    text: 'I am a wall, and my breasts like towers: then was I in his eyes as one that found favour.'
    web: I am a wall, and my breasts like towers, then I was in his eyes like one who found peace.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.8
- type: Verse
  data:
    osis: Song.8.11
    name: Song of Solomon 8:11
    apiRef: SongofSolomon8:11
    book: Song
    chapter: 8
    verse: 11
    text: Solomon had a vineyard at Baalhamon; he let out the vineyard unto keepers; every one for the fruit thereof was to bring a thousand pieces of silver.
    web: Solomon had a vineyard at Baal Hamon. He leased out the vineyard to keepers. Each was to bring a thousand shekels of silver for its fruit.
