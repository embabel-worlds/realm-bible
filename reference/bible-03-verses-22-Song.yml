  data:
    osis: Song.7.13
    name: Song of Solomon 7:13
    apiRef: SongofSolomon7:13
    book: Song
    chapter: 7
    verse: 13
    text: The mandrakes give a smell, and at our gates are all manner of pleasant fruits, new and old, which I have laid up for thee, O my beloved.
    web: The mandrakes produce fragrance. At our doors are all kinds of precious fruits, new and old, which I have stored up for you, my beloved.
  relations:
