    name: Song of Solomon 4:5
    apiRef: SongofSolomon4:5
    book: Song
    chapter: 4
    verse: 5
    text: Thy two breasts are like two young roes that are twins, which feed among the lilies.
    web: Your two breasts are like two fawns that are twins of a roe, which feed among the lilies.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.6
    name: Song of Solomon 4:6
    apiRef: SongofSolomon4:6
    book: Song
    chapter: 4
    verse: 6
    text: Until the day break, and the shadows flee away, I will get me to the mountain of myrrh, and to the hill of frankincense.
    web: Until the day is cool, and the shadows flee away, I will go to the mountain of myrrh, to the hill of frankincense.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.7
    name: Song of Solomon 4:7
    apiRef: SongofSolomon4:7
    book: Song
    chapter: 4
    verse: 7
    text: Thou art all fair, my love; there is no spot in thee.
    web: You are all beautiful, my love. There is no spot in you.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.8
    name: Song of Solomon 4:8
    apiRef: SongofSolomon4:8
    book: Song
    chapter: 4
    verse: 8
    text: 'Come with me from Lebanon, my spouse, with me from Lebanon: look from the top of Amana, from the top of Shenir and Hermon, from the lions’ dens, from the mountains of the leopards.'
    web: Come with me from Lebanon, my bride, with me from Lebanon. Look from the top of Amana, from the top of Senir and Hermon, from the lions’ dens, from the mountains of the leopards.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.9
    name: Song of Solomon 4:9
    apiRef: SongofSolomon4:9
    book: Song
    chapter: 4
    verse: 9
    text: Thou hast ravished my heart, my sister, my spouse; thou hast ravished my heart with one of thine eyes, with one chain of thy neck.
    web: You have ravished my heart, my sister, my bride. You have ravished my heart with one of your eyes, with one chain of your neck.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.10
    name: Song of Solomon 4:10
    apiRef: SongofSolomon4:10
    book: Song
    chapter: 4
    verse: 10
    text: How fair is thy love, my sister, my spouse! how much better is thy love than wine! and the smell of thine ointments than all spices!
    web: How beautiful is your love, my sister, my bride! How much better is your love than wine, the fragrance of your perfumes than all kinds of spices!
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.11
    name: Song of Solomon 4:11
    apiRef: SongofSolomon4:11
    book: Song
    chapter: 4
    verse: 11
    text: 'Thy lips, O my spouse, drop as the honeycomb: honey and milk are under thy tongue; and the smell of thy garments is like the smell of Lebanon.'
    web: Your lips, my bride, drip like the honeycomb. Honey and milk are under your tongue. The smell of your garments is like the smell of Lebanon.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.12
    name: Song of Solomon 4:12
    apiRef: SongofSolomon4:12
    book: Song
    chapter: 4
    verse: 12
    text: A garden inclosed is my sister, my spouse; a spring shut up, a fountain sealed.
    web: My sister, my bride, is a locked up garden; a locked up spring, a sealed fountain.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.13
    name: Song of Solomon 4:13
    apiRef: SongofSolomon4:13
    book: Song
    chapter: 4
    verse: 13
    text: Thy plants are an orchard of pomegranates, with pleasant fruits; camphire, with spikenard,
    web: Your shoots are an orchard of pomegranates, with precious fruits, henna with spikenard plants,
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.14
    name: Song of Solomon 4:14
    apiRef: SongofSolomon4:14
    book: Song
    chapter: 4
    verse: 14
    text: 'Spikenard and saffron; calamus and cinnamon, with all trees of frankincense; myrrh and aloes, with all the chief spices:'
    web: spikenard and saffron, calamus and cinnamon, with every kind of incense tree; myrrh and aloes, with all the best spices,
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.15
    name: Song of Solomon 4:15
    apiRef: SongofSolomon4:15
    book: Song
    chapter: 4
    verse: 15
    text: A fountain of gardens, a well of living waters, and streams from Lebanon.
    web: a fountain of gardens, a well of living waters, flowing streams from Lebanon.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.4.16
    name: Song of Solomon 4:16
    apiRef: SongofSolomon4:16
    book: Song
    chapter: 4
    verse: 16
    text: Awake, O north wind; and come, thou south; blow upon my garden, that the spices thereof may flow out. Let my beloved come into his garden, and eat his pleasant fruits.
    web: Awake, north wind, and come, you south! Blow on my garden, that its spices may flow out. Let my beloved come into his garden, and taste his precious fruits.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.4
- type: Verse
  data:
    osis: Song.5.1
    name: Song of Solomon 5:1
    apiRef: SongofSolomon5:1
    book: Song
    chapter: 5
    verse: 1
    text: 'I am come into my garden, my sister, my spouse: I have gathered my myrrh with my spice; I have eaten my honeycomb with my honey; I have drunk my wine with my milk: eat, O friends; drink, yea, drink abundantly, O beloved.'
    web: I have come into my garden, my sister, my bride. I have gathered my myrrh with my spice; I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Friends Eat, friends! Drink, yes, drink abundantly, beloved.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.2
    name: Song of Solomon 5:2
    apiRef: SongofSolomon5:2
    book: Song
    chapter: 5
    verse: 2
    text: 'I sleep, but my heart waketh: it is the voice of my beloved that knocketh, saying, Open to me, my sister, my love, my dove, my undefiled: for my head is filled with dew, and my locks with the drops of the night.'
    web: 'I was asleep, but my heart was awake. It is the voice of my beloved who knocks: “Open to me, my sister, my love, my dove, my undefiled; for my head is filled with dew, and my hair with the dampness of the night.”'
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.3
    name: Song of Solomon 5:3
    apiRef: SongofSolomon5:3
    book: Song
    chapter: 5
    verse: 3
    text: I have put off my coat; how shall I put it on? I have washed my feet; how shall I defile them?
    web: I have taken off my robe. Indeed, must I put it on? I have washed my feet. Indeed, must I soil them?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.4
    name: Song of Solomon 5:4
    apiRef: SongofSolomon5:4
    book: Song
    chapter: 5
    verse: 4
    text: My beloved put in his hand by the hole of the door, and my bowels were moved for him.
    web: My beloved thrust his hand in through the latch opening. My heart pounded for him.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.5
    name: Song of Solomon 5:5
    apiRef: SongofSolomon5:5
    book: Song
    chapter: 5
    verse: 5
    text: I rose up to open to my beloved; and my hands dropped with myrrh, and my fingers with sweet smelling myrrh, upon the handles of the lock.
    web: I rose up to open for my beloved. My hands dripped with myrrh, my fingers with liquid myrrh, on the handles of the lock.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.6
    name: Song of Solomon 5:6
    apiRef: SongofSolomon5:6
    book: Song
    chapter: 5
    verse: 6
    text: 'I opened to my beloved; but my beloved had withdrawn himself, and was gone: my soul failed when he spake: I sought him, but I could not find him; I called him, but he gave me no answer.'
    web: I opened to my beloved; but my beloved left, and had gone away. My heart went out when he spoke. I looked for him, but I didn’t find him. I called him, but he didn’t answer.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.7
    name: Song of Solomon 5:7
    apiRef: SongofSolomon5:7
    book: Song
    chapter: 5
    verse: 7
    text: The watchmen that went about the city found me, they smote me, they wounded me; the keepers of the walls took away my veil from me.
    web: The watchmen who go about the city found me. They beat me. They bruised me. The keepers of the walls took my cloak away from me.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.8
    name: Song of Solomon 5:8
    apiRef: SongofSolomon5:8
    book: Song
    chapter: 5
    verse: 8
    text: I charge you, O daughters of Jerusalem, if ye find my beloved, that ye tell him, that I am sick of love.
    web: I adjure you, daughters of Jerusalem, If you find my beloved, that you tell him that I am faint with love.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.9
    name: Song of Solomon 5:9
    apiRef: SongofSolomon5:9
    book: Song
    chapter: 5
    verse: 9
    text: What is thy beloved more than another beloved, O thou fairest among women? what is thy beloved more than another beloved, that thou dost so charge us?
    web: How is your beloved better than another beloved, you fairest among women? How is your beloved better than another beloved, that you do so adjure us?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.10
    name: Song of Solomon 5:10
    apiRef: SongofSolomon5:10
    book: Song
    chapter: 5
    verse: 10
    text: My beloved is white and ruddy, the chiefest among ten thousand.
    web: My beloved is white and ruddy. The best among ten thousand.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.11
    name: Song of Solomon 5:11
    apiRef: SongofSolomon5:11
    book: Song
    chapter: 5
    verse: 11
    text: His head is as the most fine gold, his locks are bushy, and black as a raven.
    web: His head is like the purest gold. His hair is bushy, black as a raven.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.12
    name: Song of Solomon 5:12
    apiRef: SongofSolomon5:12
    book: Song
    chapter: 5
    verse: 12
    text: His eyes are as the eyes of doves by the rivers of waters, washed with milk, and fitly set.
    web: His eyes are like doves beside the water brooks, washed with milk, mounted like jewels.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.13
    name: Song of Solomon 5:13
    apiRef: SongofSolomon5:13
    book: Song
    chapter: 5
    verse: 13
    text: 'His cheeks are as a bed of spices, as sweet flowers: his lips like lilies, dropping sweet smelling myrrh.'
    web: His cheeks are like a bed of spices with towers of perfumes. His lips are like lilies, dropping liquid myrrh.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.14
    name: Song of Solomon 5:14
    apiRef: SongofSolomon5:14
    book: Song
    chapter: 5
    verse: 14
    text: 'His hands are as gold rings set with the beryl: his belly is as bright ivory overlaid with sapphires.'
    web: His hands are like rings of gold set with beryl. His body is like ivory work overlaid with sapphires.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.15
    name: Song of Solomon 5:15
    apiRef: SongofSolomon5:15
    book: Song
    chapter: 5
    verse: 15
    text: 'His legs are as pillars of marble, set upon sockets of fine gold: his countenance is as Lebanon, excellent as the cedars.'
    web: His legs are like pillars of marble set on sockets of fine gold. His appearance is like Lebanon, excellent as the cedars.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.5.16
    name: Song of Solomon 5:16
    apiRef: SongofSolomon5:16
    book: Song
    chapter: 5
    verse: 16
    text: 'His mouth is most sweet: yea, he is altogether lovely. This is my beloved, and this is my friend, O daughters of Jerusalem.'
    web: His mouth is sweetness; yes, he is altogether lovely. This is my beloved, and this is my friend, daughters of Jerusalem.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.5
- type: Verse
  data:
    osis: Song.6.1
    name: Song of Solomon 6:1
    apiRef: SongofSolomon6:1
    book: Song
    chapter: 6
    verse: 1
    text: Whither is thy beloved gone, O thou fairest among women? whither is thy beloved turned aside? that we may seek him with thee.
    web: Where has your beloved gone, you fairest among women? Where has your beloved turned, that we may seek him with you?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.2
    name: Song of Solomon 6:2
    apiRef: SongofSolomon6:2
    book: Song
    chapter: 6
    verse: 2
    text: My beloved is gone down into his garden, to the beds of spices, to feed in the gardens, and to gather lilies.
    web: My beloved has gone down to his garden, to the beds of spices, to pasture his flock in the gardens, and to gather lilies.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.3
    name: Song of Solomon 6:3
    apiRef: SongofSolomon6:3
    book: Song
    chapter: 6
    verse: 3
    text: 'I am my beloved’s, and my beloved is mine: he feedeth among the lilies.'
    web: I am my beloved’s, and my beloved is mine. He browses among the lilies.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.4
    name: Song of Solomon 6:4
    apiRef: SongofSolomon6:4
    book: Song
    chapter: 6
    verse: 4
    text: Thou art beautiful, O my love, as Tirzah, comely as Jerusalem, terrible as an army with banners.
    web: You are beautiful, my love, as Tirzah, lovely as Jerusalem, awesome as an army with banners.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.5
    name: Song of Solomon 6:5
    apiRef: SongofSolomon6:5
    book: Song
    chapter: 6
    verse: 5
    text: 'Turn away thine eyes from me, for they have overcome me: thy hair is as a flock of goats that appear from Gilead.'
    web: Turn away your eyes from me, for they have overcome me. Your hair is like a flock of goats, that lie along the side of Gilead.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.6
    name: Song of Solomon 6:6
    apiRef: SongofSolomon6:6
    book: Song
    chapter: 6
    verse: 6
    text: Thy teeth are as a flock of sheep which go up from the washing, whereof every one beareth twins, and there is not one barren among them.
    web: Your teeth are like a flock of ewes, which have come up from the washing, of which every one has twins; not one is bereaved among them.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.7
    name: Song of Solomon 6:7
    apiRef: SongofSolomon6:7
    book: Song
    chapter: 6
    verse: 7
    text: As a piece of a pomegranate are thy temples within thy locks.
    web: Your temples are like a piece of a pomegranate behind your veil.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.8
    name: Song of Solomon 6:8
    apiRef: SongofSolomon6:8
    book: Song
    chapter: 6
    verse: 8
    text: There are threescore queens, and fourscore concubines, and virgins without number.
    web: There are sixty queens, eighty concubines, and virgins without number.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.9
    name: Song of Solomon 6:9
    apiRef: SongofSolomon6:9
    book: Song
    chapter: 6
    verse: 9
    text: My dove, my undefiled is but one; she is the only one of her mother, she is the choice one of her that bare her. The daughters saw her, and blessed her; yea, the queens and the concubines, and they praised her.
    web: My dove, my perfect one, is unique. She is her mother’s only daughter. She is the favorite one of her who bore her. The daughters saw her, and called her blessed. The queens and the concubines saw her, and they praised her.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.10
    name: Song of Solomon 6:10
    apiRef: SongofSolomon6:10
    book: Song
    chapter: 6
    verse: 10
    text: Who is she that looketh forth as the morning, fair as the moon, clear as the sun, and terrible as an army with banners?
    web: Who is she who looks out as the morning, beautiful as the moon, clear as the sun, and awesome as an army with banners?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.11
    name: Song of Solomon 6:11
    apiRef: SongofSolomon6:11
    book: Song
    chapter: 6
    verse: 11
    text: I went down into the garden of nuts to see the fruits of the valley, and to see whether the vine flourished, and the pomegranates budded.
    web: I went down into the nut tree grove, to see the green plants of the valley, to see whether the vine budded, and the pomegranates were in flower.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.12
    name: Song of Solomon 6:12
    apiRef: SongofSolomon6:12
    book: Song
    chapter: 6
    verse: 12
    text: Or ever I was aware, my soul made me like the chariots of Amminadib.
    web: Without realizing it, my desire set me with my royal people’s chariots.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.6.13
    name: Song of Solomon 6:13
    apiRef: SongofSolomon6:13
    book: Song
    chapter: 6
    verse: 13
    text: Return, return, O Shulamite; return, return, that we may look upon thee. What will ye see in the Shulamite? As it were the company of two armies.
    web: Return, return, Shulammite! Return, return, that we may gaze at you. Lover Why do you desire to gaze at the Shulammite, as at the dance of Mahanaim?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.6
- type: Verse
  data:
    osis: Song.7.1
    name: Song of Solomon 7:1
    apiRef: SongofSolomon7:1
    book: Song
    chapter: 7
    verse: 1
    text: How beautiful are thy feet with shoes, O prince’s daughter! the joints of thy thighs are like jewels, the work of the hands of a cunning workman.
    web: How beautiful are your feet in sandals, prince’s daughter! Your rounded thighs are like jewels, the work of the hands of a skillful workman.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.7
- type: Verse
  data:
    osis: Song.7.2
    name: Song of Solomon 7:2
    apiRef: SongofSolomon7:2
    book: Song
    chapter: 7
    verse: 2
    text: 'Thy navel is like a round goblet, which wanteth not liquor: thy belly is like an heap of wheat set about with lilies.'
    web: Your body is like a round goblet, no mixed wine is wanting. Your waist is like a heap of wheat, set about with lilies.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.7
- type: Verse
  data:
    osis: Song.7.3
    name: Song of Solomon 7:3
    apiRef: SongofSolomon7:3
    book: Song
    chapter: 7
    verse: 3
    text: Thy two breasts are like two young roes that are twins.
    web: Your two breasts are like two fawns, that are twins of a roe.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.7
- type: Verse
  data:
    osis: Song.7.4
    name: Song of Solomon 7:4
    apiRef: SongofSolomon7:4
    book: Song
    chapter: 7
    verse: 4
    text: 'Thy neck is as a tower of ivory; thine eyes like the fishpools in Heshbon, by the gate of Bathrabbim: thy nose is as the tower of Lebanon which looketh toward Damascus.'
    web: Your neck is like an ivory tower. Your eyes are like the pools in Heshbon by the gate of Bathrabbim. Your nose is like the tower of Lebanon which looks toward Damascus.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.7
- type: Verse
  data:
    osis: Song.7.5
    name: Song of Solomon 7:5
    apiRef: SongofSolomon7:5
    book: Song
    chapter: 7
    verse: 5
    text: Thine head upon thee is like Carmel, and the hair of thine head like purple; the king is held in the galleries.
    web: Your head on you is like Carmel. The hair of your head like purple. The king is held captive in its tresses.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.7
- type: Verse
  data:
    osis: Song.7.6
    name: Song of Solomon 7:6
    apiRef: SongofSolomon7:6
    book: Song
    chapter: 7
    verse: 6
    text: How fair and how pleasant art thou, O love, for delights!
    web: How beautiful and how pleasant you are, love, for delights!
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.7
- type: Verse
  data:
    osis: Song.7.7
    name: Song of Solomon 7:7
    apiRef: SongofSolomon7:7
    book: Song
    chapter: 7
    verse: 7
    text: This thy stature is like to a palm tree, and thy breasts to clusters of grapes.
    web: This, your stature, is like a palm tree, your breasts like its fruit.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.7
- type: Verse
  data:
    osis: Song.7.8
    name: Song of Solomon 7:8
    apiRef: SongofSolomon7:8
    book: Song
    chapter: 7
    verse: 8
    text: 'I said, I will go up to the palm tree, I will take hold of the boughs thereof: now also thy breasts shall be as clusters of the vine, and the smell of thy nose like apples;'
    web: I said, “I will climb up into the palm tree. I will take hold of its fruit.” Let your breasts be like clusters of the vine, the smell of your breath like apples.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Song.7
- type: Verse
  data:
    osis: Song.7.9
    name: Song of Solomon 7:9
    apiRef: SongofSolomon7:9
    book: Song
    chapter: 7
    verse: 9
    text: And the roof of thy mouth like the best wine for my beloved, that goeth down sweetly, causing the lips of those that are asleep to speak.
    web: Your mouth is like the best wine, that goes down smoothly for my beloved, gliding through the lips of those who are asleep.
