    name: Song of Solomon 8:12
    apiRef: SongofSolomon8:12
    book: Song
    chapter: 8
    verse: 12
    text: 'My vineyard, which is mine, is before me: thou, O Solomon, must have a thousand, and those that keep the fruit thereof two hundred.'
    web: My own vineyard is before me. The thousand are for you, Solomon, two hundred for those who tend its fruit.
