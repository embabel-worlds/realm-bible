  data:
    osis: Hab.2.7
    name: Habakkuk 2:7
    apiRef: Habakkuk2:7
    book: Hab
    chapter: 2
    verse: 7
    text: Shall they not rise up suddenly that shall bite thee, and awake that shall vex thee, and thou shalt be for booties unto them?
    web: Won’t your debtors rise up suddenly, and wake up those who make you tremble, and you will be their victim?
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
