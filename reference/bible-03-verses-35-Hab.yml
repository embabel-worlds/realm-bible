  data:
    osis: Hab.2.2
    name: Habakkuk 2:2
    apiRef: Habakkuk2:2
    book: Hab
    chapter: 2
    verse: 2
    text: And the LORD answered me, and said, Write the vision, and make it plain upon tables, that he may run that readeth it.
    web: The LORD answered me, “Write the vision, and make it plain on tablets, that he who runs may read it.
    people:
