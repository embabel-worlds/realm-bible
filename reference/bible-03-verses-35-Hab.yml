  data:
    osis: Hab.3.6
    name: Habakkuk 3:6
    apiRef: Habakkuk3:6
    book: Hab
    chapter: 3
    verse: 6
    text: 'He stood, and measured the earth: he beheld, and drove asunder the nations; and the everlasting mountains were scattered, the perpetual hills did bow: his ways are everlasting.'
    web: He stood, and shook the earth. He looked, and made the nations tremble. The ancient mountains were crumbled. The age-old hills collapsed. His ways are eternal.
    event: Prophecies of Habakkuk
  relations:
