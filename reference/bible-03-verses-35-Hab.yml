    apiRef: Habakkuk1:15
    book: Hab
    chapter: 1
    verse: 15
    text: 'They take up all of them with the angle, they catch them in their net, and gather them in their drag: therefore they rejoice and are glad.'
    web: He takes up all of them with the hook. He catches them in his net and gathers them in his dragnet. Therefore he rejoices and is glad.
    event: Prophecies of Habakkuk
