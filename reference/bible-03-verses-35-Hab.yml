  data:
    osis: Hab.3.7
    name: Habakkuk 3:7
    apiRef: Habakkuk3:7
    book: Hab
    chapter: 3
    verse: 7
    text: 'I saw the tents of Cushan in affliction: and the curtains of the land of Midian did tremble.'
    web: I saw the tents of Cushan in affliction. The dwellings of the land of Midian trembled.
