    name: Habakkuk 1:13
    apiRef: Habakkuk1:13
    book: Hab
    chapter: 1
    verse: 13
    text: 'Thou art of purer eyes than to behold evil, and canst not look on iniquity: wherefore lookest thou upon them that deal treacherously, and holdest thy tongue when the wicked devoureth the man that is more righteous than he?'
    web: You who have purer eyes than to see evil, and who cannot look on perversity, why do you tolerate those who deal treacherously and keep silent when the wicked swallows up the man who is more righteous than he,
    event: Prophecies of Habakkuk
