  data:
    osis: Hab.3.2
    name: Habakkuk 3:2
    apiRef: Habakkuk3:2
    book: Hab
    chapter: 3
    verse: 2
    text: 'O LORD, I have heard thy speech, and was afraid: O LORD, revive thy work in the midst of the years, in the midst of the years make known; in wrath remember mercy.'
    web: LORD, I have heard of your fame. I stand in awe of your deeds, LORD. Renew your work in the middle of the years. In the middle of the years make it known. In wrath, you remember mercy.
    people:
    - god_1324
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hab.3
