  data:
    osis: Hab.2.9
    name: Habakkuk 2:9
    apiRef: Habakkuk2:9
    book: Hab
    chapter: 2
    verse: 9
    text: Woe to him that coveteth an evil covetousness to his house, that he may set his nest on high, that he may be delivered from the power of evil!
    web: Woe to him who gets an evil gain for his house, that he may set his nest on high, that he may be delivered from the hand of evil!
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hab.2
