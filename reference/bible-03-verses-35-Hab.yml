  data:
    osis: Hab.1.8
    name: Habakkuk 1:8
    apiRef: Habakkuk1:8
    book: Hab
    chapter: 1
    verse: 8
    text: 'Their horses also are swifter than the leopards, and are more fierce than the evening wolves: and their horsemen shall spread themselves, and their horsemen shall come from far; they shall fly as the eagle that hasteth to eat.'
    web: Their horses also are swifter than leopards, and are more fierce than the evening wolves. Their horsemen press proudly on. Yes, their horsemen come from afar. They fly as an eagle that hurries to devour.
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
