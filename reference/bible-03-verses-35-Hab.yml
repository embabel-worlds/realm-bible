    apiRef: Habakkuk2:1
    book: Hab
    chapter: 2
    verse: 1
    text: I will stand upon my watch, and set me upon the tower, and will watch to see what he will say unto me, and what I shall answer when I am reproved.
    web: I will stand at my watch and set myself on the ramparts, and will look out to see what he will say to me, and what I will answer concerning my complaint.
    event: Prophecies of Habakkuk
