    apiRef: Habakkuk2:11
    book: Hab
    chapter: 2
    verse: 11
    text: For the stone shall cry out of the wall, and the beam out of the timber shall answer it.
    web: For the stone will cry out of the wall, and the beam out of the woodwork will answer it.
    event: Prophecies of Habakkuk
