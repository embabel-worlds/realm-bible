    osis: Hab.2.10
    name: Habakkuk 2:10
    apiRef: Habakkuk2:10
    book: Hab
    chapter: 2
    verse: 10
    text: Thou hast consulted shame to thy house by cutting off many people, and hast sinned against thy soul.
    web: You have devised shame to your house by cutting off many peoples, and have sinned against your soul.
    event: Prophecies of Habakkuk
  relations:
