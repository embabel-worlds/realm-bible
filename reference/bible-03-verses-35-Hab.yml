    apiRef: Habakkuk2:13
    book: Hab
    chapter: 2
    verse: 13
    text: Behold, is it not of the LORD of hosts that the people shall labour in the very fire, and the people shall weary themselves for very vanity?
    web: Behold, isn’t it from the LORD of Armies that the peoples labor for the fire, and the nations weary themselves for vanity?
