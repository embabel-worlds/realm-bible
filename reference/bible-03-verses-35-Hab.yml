    apiRef: Habakkuk2:4
    book: Hab
    chapter: 2
    verse: 4
    text: 'Behold, his soul which is lifted up is not upright in him: but the just shall live by his faith.'
    web: Behold, his soul is puffed up. It is not upright in him, but the righteous will live by his faith.
    event: Prophecies of Habakkuk
  relations:
