    name: Habakkuk 1:3
    apiRef: Habakkuk1:3
    book: Hab
    chapter: 1
    verse: 3
    text: 'Why dost thou shew me iniquity, and cause me to behold grievance? for spoiling and violence are before me: and there are that raise up strife and contention.'
    web: Why do you show me iniquity, and look at perversity? For destruction and violence are before me. There is strife, and contention rises up.
