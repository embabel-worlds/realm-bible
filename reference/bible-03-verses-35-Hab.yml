  data:
    osis: Hab.2.17
    name: Habakkuk 2:17
    apiRef: Habakkuk2:17
    book: Hab
    chapter: 2
    verse: 17
    text: For the violence of Lebanon shall cover thee, and the spoil of beasts, which made them afraid, because of men’s blood, and for the violence of the land, of the city, and of all that dwell therein.
    web: For the violence done to Lebanon will overwhelm you, and the destruction of the animals will terrify you, because of men’s blood and for the violence done to the land, to every city and to those who dwell in them.
    event: Prophecies of Habakkuk
  relations:
