- type: Verse
  data:
    osis: Hab.2.16
    name: Habakkuk 2:16
    apiRef: Habakkuk2:16
    book: Hab
    chapter: 2
    verse: 16
    text: 'Thou art filled with shame for glory: drink thou also, and let thy foreskin be uncovered: the cup of the LORD’S right hand shall be turned unto thee, and shameful spewing shall be on thy glory.'
    web: You are filled with shame, and not glory. You will also drink and be exposed! The cup of the LORD’s right hand will come around to you, and disgrace will cover your glory.
    people:
    - god_1324
    event: Prophecies of Habakkuk
  relations:
