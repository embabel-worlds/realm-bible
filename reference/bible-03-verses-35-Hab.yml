    apiRef: Habakkuk2:14
    book: Hab
    chapter: 2
    verse: 14
    text: For the earth shall be filled with the knowledge of the glory of the LORD, as the waters cover the sea.
    web: For the earth will be filled with the knowledge of the LORD’s glory, as the waters cover the sea.
