    apiRef: Habakkuk1:10
    book: Hab
    chapter: 1
    verse: 10
    text: 'And they shall scoff at the kings, and the princes shall be a scorn unto them: they shall deride every strong hold; for they shall heap dust, and take it.'
    web: Yes, they scoff at kings, and princes are a derision to them. They laugh at every stronghold, for they build up an earthen ramp and take it.
    event: Prophecies of Habakkuk
