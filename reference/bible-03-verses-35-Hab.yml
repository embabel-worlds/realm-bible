  data:
    osis: Hab.2.5
    name: Habakkuk 2:5
    apiRef: Habakkuk2:5
    book: Hab
    chapter: 2
    verse: 5
    text: 'Yea also, because he transgresseth by wine, he is a proud man, neither keepeth at home, who enlargeth his desire as hell, and is as death, and cannot be satisfied, but gathereth unto him all nations, and heapeth unto him all people:'
    web: 'Yes, moreover, wine is treacherous: an arrogant man who doesn’t stay at home, who enlarges his desire as Sheol; he is like death and can’t be satisfied, but gathers to himself all nations and heaps to himself all peoples.'
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hab.2
