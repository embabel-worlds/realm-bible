    apiRef: Habakkuk1:16
    book: Hab
    chapter: 1
    verse: 16
    text: Therefore they sacrifice unto their net, and burn incense unto their drag; because by them their portion is fat, and their meat plenteous.
    web: Therefore he sacrifices to his net and burns incense to his dragnet, because by them his life is luxurious and his food is good.
