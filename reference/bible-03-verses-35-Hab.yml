    osis: Hab.3.3
    name: Habakkuk 3:3
    apiRef: Habakkuk3:3
    book: Hab
    chapter: 3
    verse: 3
    text: God came from Teman, and the Holy One from mount Paran. Selah. His glory covered the heavens, and the earth was full of his praise.
    web: God came from Teman, the Holy One from Mount Paran. Selah. His glory covered the heavens, and his praise filled the earth.
    people:
    - god_1324
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hab.3
