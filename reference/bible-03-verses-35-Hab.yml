    name: Habakkuk 3:16
    apiRef: Habakkuk3:16
    book: Hab
    chapter: 3
    verse: 16
    text: 'When I heard, my belly trembled; my lips quivered at the voice: rottenness entered into my bones, and I trembled in myself, that I might rest in the day of trouble: when he cometh up unto the people, he will invade them with his troops.'
    web: I heard, and my body trembled. My lips quivered at the voice. Rottenness enters into my bones, and I tremble in my place because I must wait quietly for the day of trouble, for the coming up of the people who invade us.
