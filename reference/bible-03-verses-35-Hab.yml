    apiRef: Habakkuk1:12
    book: Hab
    chapter: 1
    verse: 12
    text: Art thou not from everlasting, O LORD my God, mine Holy One? we shall not die. O LORD, thou hast ordained them for judgment; and, O mighty God, thou hast established them for correction.
    web: Aren’t you from everlasting, LORD my God, my Holy One? We will not die. LORD, you have appointed them for judgment. You, Rock, have established him to punish.
