  data:
    osis: Hab.2.18
    name: Habakkuk 2:18
    apiRef: Habakkuk2:18
    book: Hab
    chapter: 2
    verse: 18
    text: What profiteth the graven image that the maker thereof hath graven it; the molten image, and a teacher of lies, that the maker of his work trusteth therein, to make dumb idols?
    web: “What value does the engraved image have, that its maker has engraved it; the molten image, even the teacher of lies, that he who fashions its form trusts in it, to make mute idols?
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hab.2
- type: Verse
  data:
    osis: Hab.2.19
    name: Habakkuk 2:19
    apiRef: Habakkuk2:19
    book: Hab
    chapter: 2
    verse: 19
    text: Woe unto him that saith to the wood, Awake; to the dumb stone, Arise, it shall teach! Behold, it is laid over with gold and silver, and there is no breath at all in the midst of it.
    web: Woe to him who says to the wood, ‘Awake!’ or to the mute stone, ‘Arise!’ Shall this teach? Behold, it is overlaid with gold and silver, and there is no breath at all within it.
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hab.2
