  data:
    osis: Hab.3.5
    name: Habakkuk 3:5
    apiRef: Habakkuk3:5
    book: Hab
    chapter: 3
    verse: 5
    text: Before him went the pestilence, and burning coals went forth at his feet.
    web: Plague went before him, and pestilence followed his feet.
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hab.3
