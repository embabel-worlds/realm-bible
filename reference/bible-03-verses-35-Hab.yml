    apiRef: Habakkuk1:4
    book: Hab
    chapter: 1
    verse: 4
    text: 'Therefore the law is slacked, and judgment doth never go forth: for the wicked doth compass about the righteous; therefore wrong judgment proceedeth.'
    web: Therefore the law is paralyzed, and justice never prevails; for the wicked surround the righteous; therefore justice comes out perverted.
