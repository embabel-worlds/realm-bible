  data:
    osis: Hab.2.8
    name: Habakkuk 2:8
    apiRef: Habakkuk2:8
    book: Hab
    chapter: 2
    verse: 8
    text: Because thou hast spoiled many nations, all the remnant of the people shall spoil thee; because of men’s blood, and for the violence of the land, of the city, and of all that dwell therein.
    web: Because you have plundered many nations, all the remnant of the peoples will plunder you because of men’s blood, and for the violence done to the land, to the city and to all who dwell in it.
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hab.2
