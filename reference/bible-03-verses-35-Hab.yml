  data:
    osis: Hab.1.9
    name: Habakkuk 1:9
    apiRef: Habakkuk1:9
    book: Hab
    chapter: 1
    verse: 9
    text: 'They shall come all for violence: their faces shall sup up as the east wind, and they shall gather the captivity as the sand.'
    web: All of them come for violence. Their hordes face forward. They gather prisoners like sand.
    event: Prophecies of Habakkuk
