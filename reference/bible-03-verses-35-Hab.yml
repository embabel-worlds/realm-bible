  data:
    osis: Hab.2.6
    name: Habakkuk 2:6
    apiRef: Habakkuk2:6
    book: Hab
    chapter: 2
    verse: 6
    text: Shall not all these take up a parable against him, and a taunting proverb against him, and say, Woe to him that increaseth that which is not his! how long? and to him that ladeth himself with thick clay!
    web: Won’t all these take up a parable against him, and a taunting proverb against him, and say, ‘Woe to him who increases that which is not his, and who enriches himself by extortion! How long?’
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
