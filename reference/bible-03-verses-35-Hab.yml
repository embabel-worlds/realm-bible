  data:
    osis: Hab.2.3
    name: Habakkuk 2:3
    apiRef: Habakkuk2:3
    book: Hab
    chapter: 2
    verse: 3
    text: 'For the vision is yet for an appointed time, but at the end it shall speak, and not lie: though it tarry, wait for it; because it will surely come, it will not tarry.'
    web: For the vision is yet for the appointed time, and it hurries toward the end, and won’t prove false. Though it takes time, wait for it, because it will surely come. It won’t delay.
    event: Prophecies of Habakkuk
  relations:
