  data:
    osis: Hab.2.15
    name: Habakkuk 2:15
    apiRef: Habakkuk2:15
    book: Hab
    chapter: 2
    verse: 15
    text: Woe unto him that giveth his neighbour drink, that puttest thy bottle to him, and makest him drunken also, that thou mayest look on their nakedness!
    web: “Woe to him who gives his neighbor drink, pouring your inflaming wine until they are drunk, so that you may gaze at their naked bodies!
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
