  data:
    osis: Hab.2.20
    name: Habakkuk 2:20
    apiRef: Habakkuk2:20
    book: Hab
    chapter: 2
    verse: 20
    text: 'But the LORD is in his holy temple: let all the earth keep silence before him.'
    web: But the LORD is in his holy temple. Let all the earth be silent before him!”
