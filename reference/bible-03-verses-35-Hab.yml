  data:
    osis: Hab.3.4
    name: Habakkuk 3:4
    apiRef: Habakkuk3:4
    book: Hab
    chapter: 3
    verse: 4
    text: 'And his brightness was as the light; he had horns coming out of his hand: and there was the hiding of his power.'
    web: His splendor is like the sunrise. Rays shine from his hand, where his power is hidden.
    event: Prophecies of Habakkuk
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Hab.3
