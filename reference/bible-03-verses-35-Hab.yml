    apiRef: Habakkuk1:11
    book: Hab
    chapter: 1
    verse: 11
    text: Then shall his mind change, and he shall pass over, and offend, imputing this his power unto his god.
    web: Then they sweep by like the wind and go on. They are indeed guilty, whose strength is their god.”
    event: Prophecies of Habakkuk
