- type: Verse
  data:
    osis: Lam.1.1
    name: Lamentations 1:1
    apiRef: Lamentations1:1
    book: Lam
    chapter: 1
    verse: 1
    text: How doth the city sit solitary, that was full of people! how is she become as a widow! she that was great among the nations, and princess among the provinces, how is she become tributary!
    web: How the city sits solitary, that was full of people! She has become as a widow, who was great among the nations! She who was a princess among the provinces has become a slave!
  relations:
