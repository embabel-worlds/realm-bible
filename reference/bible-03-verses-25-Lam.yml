  data:
    osis: Lam.1.20
    name: Lamentations 1:20
    apiRef: Lamentations1:20
    book: Lam
    chapter: 1
    verse: 20
    text: 'Behold, O LORD; for I am in distress: my bowels are troubled; mine heart is turned within me; for I have grievously rebelled: abroad the sword bereaveth, at home there is as death.'
    web: “Look, LORD; for I am in distress. My heart is troubled. My heart turns over within me, for I have grievously rebelled. Abroad, the sword bereaves. At home, it is like death.
    people:
    - god_1324
  relations:
