  data:
    osis: Lam.1.16
    name: Lamentations 1:16
    apiRef: Lamentations1:16
    book: Lam
    chapter: 1
    verse: 16
    text: 'For these things I weep; mine eye, mine eye runneth down with water, because the comforter that should relieve my soul is far from me: my children are desolate, because the enemy prevailed.'
    web: “For these things I weep. My eye, my eye runs down with water, because the comforter who should refresh my soul is far from me. My children are desolate, because the enemy has prevailed.”
  relations:
