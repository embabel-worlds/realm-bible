    apiRef: Lamentations1:8
    book: Lam
    chapter: 1
    verse: 8
    ordinal: 20319
    text: 'Jerusalem hath grievously sinned; therefore she is removed: all that honoured her despise her, because they have seen her nakedness: yea, she sigheth, and turneth backward.'
    translation: King James Version
    web: Jerusalem has grievously sinned. Therefore she has become unclean. All who honored her despise her, because they have seen her nakedness. Yes, she sighs and turns backward.
