  data:
    osis: Lam.1.18
    name: Lamentations 1:18
    apiRef: Lamentations1:18
    book: Lam
    chapter: 1
    verse: 18
    text: 'The LORD is righteous; for I have rebelled against his commandment: hear, I pray you, all people, and behold my sorrow: my virgins and my young men are gone into captivity.'
    web: “The LORD is righteous, for I have rebelled against his commandment. Please hear all you peoples, and see my sorrow. My virgins and my young men have gone into captivity.
    people:
    - god_1324
  relations:
