    to:
      type: Passage
      osis: Lam.1
- type: Verse
  data:
    osis: Lam.1.4
    name: Lamentations 1:4
    apiRef: Lamentations1:4
    book: Lam
    chapter: 1
    verse: 4
    text: 'The ways of Zion do mourn, because none come to the solemn feasts: all her gates are desolate: her priests sigh, her virgins are afflicted, and she is in bitterness.'
    web: The roads to Zion mourn, because no one comes to the solemn assembly. All her gates are desolate. Her priests sigh. Her virgins are afflicted, and she herself is in bitterness.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.1
- type: Verse
  data:
    osis: Lam.1.5
    name: Lamentations 1:5
    apiRef: Lamentations1:5
    book: Lam
    chapter: 1
    verse: 5
    text: 'Her adversaries are the chief, her enemies prosper; for the LORD hath afflicted her for the multitude of her transgressions: her children are gone into captivity before the enemy.'
    web: Her adversaries have become the head. Her enemies prosper; for the LORD has afflicted her for the multitude of her transgressions. Her young children have gone into captivity before the adversary.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
