      osis: Lam.1
- type: Verse
  data:
    osis: Lam.1.6
    name: Lamentations 1:6
    apiRef: Lamentations1:6
    book: Lam
    chapter: 1
    verse: 6
    text: 'And from the daughter of Zion all her beauty is departed: her princes are become like harts that find no pasture, and they are gone without strength before the pursuer.'
    web: All majesty has departed from the daughter of Zion. Her princes have become like deer that find no pasture. They have gone without strength before the pursuer.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.1
- type: Verse
  data:
    osis: Lam.1.7
    name: Lamentations 1:7
    apiRef: Lamentations1:7
    book: Lam
    chapter: 1
    verse: 7
    text: 'Jerusalem remembered in the days of her affliction and of her miseries all her pleasant things that she had in the days of old, when her people fell into the hand of the enemy, and none did help her: the adversaries saw her, and did mock at her sabbaths.'
    web: Jerusalem remembers in the days of her affliction and of her miseries all her pleasant things that were from the days of old; when her people fell into the hand of the adversary, and no one helped her. The adversaries saw her. They mocked at her desolations.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.1
- type: Verse
  data:
    osis: Lam.1.8
    name: Lamentations 1:8
    apiRef: Lamentations1:8
    book: Lam
    chapter: 1
    verse: 8
    text: 'Jerusalem hath grievously sinned; therefore she is removed: all that honoured her despise her, because they have seen her nakedness: yea, she sigheth, and turneth backward.'
    web: Jerusalem has grievously sinned. Therefore she has become unclean. All who honored her despise her, because they have seen her nakedness. Yes, she sighs and turns backward.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.1
- type: Verse
  data:
    osis: Lam.1.9
    name: Lamentations 1:9
    apiRef: Lamentations1:9
    book: Lam
    chapter: 1
    verse: 9
    text: 'Her filthiness is in her skirts; she remembereth not her last end; therefore she came down wonderfully: she had no comforter. O LORD, behold my affliction: for the enemy hath magnified himself.'
    web: Her filthiness was in her skirts. She didn’t remember her latter end. Therefore she has come down astoundingly. She has no comforter. “See, LORD, my affliction; for the enemy has magnified himself.”
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.1
- type: Verse
  data:
    osis: Lam.1.10
    name: Lamentations 1:10
    apiRef: Lamentations1:10
    book: Lam
    chapter: 1
    verse: 10
    text: 'The adversary hath spread out his hand upon all her pleasant things: for she hath seen that the heathen entered into her sanctuary, whom thou didst command that they should not enter into thy congregation.'
    web: The adversary has spread out his hand on all her pleasant things; for she has seen that the nations have entered into her sanctuary, concerning whom you commanded that they should not enter into your assembly.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.1
