  data:
    osis: Lam.1.14
    name: Lamentations 1:14
    apiRef: Lamentations1:14
    book: Lam
    chapter: 1
    verse: 14
    text: 'The yoke of my transgressions is bound by his hand: they are wreathed, and come up upon my neck: he hath made my strength to fall, the Lord hath delivered me into their hands, from whom I am not able to rise up.'
    web: “The yoke of my transgressions is bound by his hand. They are knit together. They have come up on my neck. He made my strength fail. The Lord has delivered me into their hands, against whom I am not able to stand.
    people:
    - god_1324
  relations:
