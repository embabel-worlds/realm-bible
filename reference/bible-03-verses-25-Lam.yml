    to:
      type: Passage
      osis: Lam.1
- type: Verse
  data:
    osis: Lam.1.21
    name: Lamentations 1:21
    apiRef: Lamentations1:21
    book: Lam
    chapter: 1
    verse: 21
    text: 'They have heard that I sigh: there is none to comfort me: all mine enemies have heard of my trouble; they are glad that thou hast done it: thou wilt bring the day that thou hast called, and they shall be like unto me.'
    web: “They have heard that I sigh. There is no one to comfort me. All my enemies have heard of my trouble. They are glad that you have done it. You will bring the day that you have proclaimed, and they will be like me.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.1
