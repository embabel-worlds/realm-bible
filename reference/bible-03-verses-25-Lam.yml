    apiRef: Lamentations1:4
    book: Lam
    chapter: 1
    verse: 4
    ordinal: 20315
    text: 'The ways of Zion do mourn, because none come to the solemn feasts: all her gates are desolate: her priests sigh, her virgins are afflicted, and she is in bitterness.'
    translation: King James Version
    web: The roads to Zion mourn, because no one comes to the solemn assembly. All her gates are desolate. Her priests sigh. Her virgins are afflicted, and she herself is in bitterness.
