  data:
    osis: Lam.2.4
    name: Lamentations 2:4
    apiRef: Lamentations2:4
    book: Lam
    chapter: 2
    verse: 4
    text: 'He hath bent his bow like an enemy: he stood with his right hand as an adversary, and slew all that were pleasant to the eye in the tabernacle of the daughter of Zion: he poured out his fury like fire.'
    web: He has bent his bow like an enemy. He has stood with his right hand as an adversary. He has killed all that were pleasant to the eye. In the tent of the daughter of Zion, he has poured out his wrath like fire.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.5
    name: Lamentations 2:5
    apiRef: Lamentations2:5
    book: Lam
    chapter: 2
    verse: 5
    text: 'The Lord was as an enemy: he hath swallowed up Israel, he hath swallowed up all her palaces: he hath destroyed his strong holds, and hath increased in the daughter of Judah mourning and lamentation.'
    web: The Lord has become as an enemy. He has swallowed up Israel. He has swallowed up all her palaces. He has destroyed his strongholds. He has multiplied mourning and lamentation in the daughter of Judah.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.6
    name: Lamentations 2:6
    apiRef: Lamentations2:6
    book: Lam
    chapter: 2
    verse: 6
    text: 'And he hath violently taken away his tabernacle, as if it were of a garden: he hath destroyed his places of the assembly: the LORD hath caused the solemn feasts and sabbaths to be forgotten in Zion, and hath despised in the indignation of his anger the king and the priest.'
    web: He has violently taken away his tabernacle, as if it were a garden. He has destroyed his place of assembly. The LORD has caused solemn assembly and Sabbath to be forgotten in Zion. In the indignation of his anger, he has despised the king and the priest.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.7
    name: Lamentations 2:7
    apiRef: Lamentations2:7
    book: Lam
    chapter: 2
    verse: 7
    text: The Lord hath cast off his altar, he hath abhorred his sanctuary, he hath given up into the hand of the enemy the walls of her palaces; they have made a noise in the house of the LORD, as in the day of a solemn feast.
    web: The Lord has cast off his altar. He has abhorred his sanctuary. He has given the walls of her palaces into the hand of the enemy. They have made a noise in the LORD’s house, as in the day of a solemn assembly.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.8
    name: Lamentations 2:8
    apiRef: Lamentations2:8
    book: Lam
    chapter: 2
    verse: 8
    text: 'The LORD hath purposed to destroy the wall of the daughter of Zion: he hath stretched out a line, he hath not withdrawn his hand from destroying: therefore he made the rampart and the wall to lament; they languished together.'
    web: The LORD has purposed to destroy the wall of the daughter of Zion. He has stretched out the line. He has not withdrawn his hand from destroying; He has made the rampart and wall lament. They languish together.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.9
    name: Lamentations 2:9
    apiRef: Lamentations2:9
    book: Lam
    chapter: 2
    verse: 9
    text: 'Her gates are sunk into the ground; he hath destroyed and broken her bars: her king and her princes are among the Gentiles: the law is no more; her prophets also find no vision from the LORD.'
    web: Her gates have sunk into the ground. He has destroyed and broken her bars. Her king and her princes are among the nations where the law is not. Yes, her prophets find no vision from the LORD.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.10
    name: Lamentations 2:10
    apiRef: Lamentations2:10
    book: Lam
    chapter: 2
    verse: 10
    text: 'The elders of the daughter of Zion sit upon the ground, and keep silence: they have cast up dust upon their heads; they have girded themselves with sackcloth: the virgins of Jerusalem hang down their heads to the ground.'
    web: The elders of the daughter of Zion sit on the ground. They keep silence. They have cast up dust on their heads. They have clothed themselves with sackcloth. The virgins of Jerusalem hang down their heads to the ground.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.11
    name: Lamentations 2:11
    apiRef: Lamentations2:11
    book: Lam
    chapter: 2
    verse: 11
    text: Mine eyes do fail with tears, my bowels are troubled, my liver is poured upon the earth, for the destruction of the daughter of my people; because the children and the sucklings swoon in the streets of the city.
    web: My eyes fail with tears. My heart is troubled. My bile is poured on the earth, because of the destruction of the daughter of my people, because the young children and the infants swoon in the streets of the city.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.12
    name: Lamentations 2:12
    apiRef: Lamentations2:12
    book: Lam
    chapter: 2
    verse: 12
    text: They say to their mothers, Where is corn and wine? when they swooned as the wounded in the streets of the city, when their soul was poured out into their mothers’ bosom.
    web: They ask their mothers, “Where is grain and wine?” when they swoon as the wounded in the streets of the city, when their soul is poured out into their mothers’ bosom.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.13
    name: Lamentations 2:13
    apiRef: Lamentations2:13
    book: Lam
    chapter: 2
    verse: 13
    text: 'What thing shall I take to witness for thee? what thing shall I liken to thee, O daughter of Jerusalem? what shall I equal to thee, that I may comfort thee, O virgin daughter of Zion? for thy breach is great like the sea: who can heal thee?'
    web: What shall I testify to you? What shall I liken to you, daughter of Jerusalem? What shall I compare to you, that I may comfort you, virgin daughter of Zion? For your breach is as big as the sea. Who can heal you?
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.14
    name: Lamentations 2:14
    apiRef: Lamentations2:14
    book: Lam
    chapter: 2
    verse: 14
    text: 'Thy prophets have seen vain and foolish things for thee: and they have not discovered thine iniquity, to turn away thy captivity; but have seen for thee false burdens and causes of banishment.'
    web: Your prophets have seen false and foolish visions for you. They have not uncovered your iniquity, to reverse your captivity, but have seen for you false revelations and causes of banishment.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.15
    name: Lamentations 2:15
    apiRef: Lamentations2:15
    book: Lam
    chapter: 2
    verse: 15
    text: All that pass by clap their hands at thee; they hiss and wag their head at the daughter of Jerusalem, saying, Is this the city that men call The perfection of beauty, The joy of the whole earth?
    web: All that pass by clap their hands at you. They hiss and wag their head at the daughter of Jerusalem, saying, “Is this the city that men called ‘The perfection of beauty, the joy of the whole earth’?”
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.16
    name: Lamentations 2:16
    apiRef: Lamentations2:16
    book: Lam
    chapter: 2
    verse: 16
    text: 'All thine enemies have opened their mouth against thee: they hiss and gnash the teeth: they say, We have swallowed her up: certainly this is the day that we looked for; we have found, we have seen it.'
    web: All your enemies have opened their mouth wide against you. They hiss and gnash their teeth. They say, “We have swallowed her up. Certainly this is the day that we looked for. We have found it. We have seen it.”
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.17
    name: Lamentations 2:17
    apiRef: Lamentations2:17
    book: Lam
    chapter: 2
    verse: 17
    text: 'The LORD hath done that which he had devised; he hath fulfilled his word that he had commanded in the days of old: he hath thrown down, and hath not pitied: and he hath caused thine enemy to rejoice over thee, he hath set up the horn of thine adversaries.'
    web: The LORD has done that which he planned. He has fulfilled his word that he commanded in the days of old. He has thrown down, and has not pitied. He has caused the enemy to rejoice over you. He has exalted the horn of your adversaries.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.18
    name: Lamentations 2:18
    apiRef: Lamentations2:18
    book: Lam
    chapter: 2
    verse: 18
    text: 'Their heart cried unto the Lord, O wall of the daughter of Zion, let tears run down like a river day and night: give thyself no rest; let not the apple of thine eye cease.'
    web: Their heart cried to the Lord. O wall of the daughter of Zion, let tears run down like a river day and night. Give yourself no relief. Don’t let your eyes rest.
