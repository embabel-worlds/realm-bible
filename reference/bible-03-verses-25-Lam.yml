    apiRef: Lamentations1:2
    book: Lam
    chapter: 1
    verse: 2
    ordinal: 20313
    text: 'She weepeth sore in the night, and her tears are on her cheeks: among all her lovers she hath none to comfort her: all her friends have dealt treacherously with her, they are become her enemies.'
    translation: King James Version
    web: She weeps bitterly in the night. Her tears are on her cheeks. Among all her lovers she has no one to comfort her. All her friends have dealt treacherously with her. They have become her enemies.
  relations:
