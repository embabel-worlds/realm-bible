  data:
    osis: Lam.1.22
    name: Lamentations 1:22
    apiRef: Lamentations1:22
    book: Lam
    chapter: 1
    verse: 22
    text: 'Let all their wickedness come before thee; and do unto them, as thou hast done unto me for all my transgressions: for my sighs are many, and my heart is faint.'
    web: “Let all their wickedness come before you. Do to them as you have done to me for all my transgressions. For my sighs are many, and my heart is faint.
  relations:
