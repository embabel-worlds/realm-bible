  data:
    osis: Lam.1.17
    name: Lamentations 1:17
    apiRef: Lamentations1:17
    book: Lam
    chapter: 1
    verse: 17
    text: 'Zion spreadeth forth her hands, and there is none to comfort her: the LORD hath commanded concerning Jacob, that his adversaries should be round about him: Jerusalem is as a menstruous woman among them.'
    web: Zion spreads out her hands. There is no one to comfort her. The LORD has commanded concerning Jacob, that those who are around him should be his adversaries. Jerusalem is among them as an unclean thing.
