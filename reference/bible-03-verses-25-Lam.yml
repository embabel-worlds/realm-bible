  data:
    osis: Lam.1.12
    name: Lamentations 1:12
    apiRef: Lamentations1:12
    book: Lam
    chapter: 1
    verse: 12
    text: Is it nothing to you, all ye that pass by? behold, and see if there be any sorrow like unto my sorrow, which is done unto me, wherewith the LORD hath afflicted me in the day of his fierce anger.
    web: “Is it nothing to you, all you who pass by? Look, and see if there is any sorrow like my sorrow, which is brought on me, with which the LORD has afflicted me in the day of his fierce anger.
    people:
    - god_1324
  relations:
