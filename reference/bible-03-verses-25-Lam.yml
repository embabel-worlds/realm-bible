    chapter: 1
    verse: 11
    ordinal: 20322
    text: 'All her people sigh, they seek bread; they have given their pleasant things for meat to relieve the soul: see, O LORD, and consider; for I am become vile.'
    translation: King James Version
    web: All her people sigh. They seek bread. They have given their pleasant things for food to refresh their soul. “Look, LORD, and see, for I have become despised.”
