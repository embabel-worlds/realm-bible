    name: Lamentations 1:15
    apiRef: Lamentations1:15
    book: Lam
    chapter: 1
    verse: 15
    text: 'The Lord hath trodden under foot all my mighty men in the midst of me: he hath called an assembly against me to crush my young men: the Lord hath trodden the virgin, the daughter of Judah, as in a winepress.'
    web: “The Lord has set at nothing all my mighty men within me. He has called a solemn assembly against me to crush my young men. The Lord has trodden the virgin daughter of Judah as in a wine press.
    people:
    - god_1324
  relations:
