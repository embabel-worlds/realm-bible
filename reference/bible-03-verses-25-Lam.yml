    apiRef: Lamentations1:3
    book: Lam
    chapter: 1
    verse: 3
    text: 'Judah is gone into captivity because of affliction, and because of great servitude: she dwelleth among the heathen, she findeth no rest: all her persecutors overtook her between the straits.'
    web: Judah has gone into captivity because of affliction and because of great servitude. She dwells among the nations. She finds no rest. All her persecutors overtook her in her distress.
  relations:
