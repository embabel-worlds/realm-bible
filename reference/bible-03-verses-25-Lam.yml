- type: Verse
  data:
    osis: Lam.2.1
    name: Lamentations 2:1
    apiRef: Lamentations2:1
    book: Lam
    chapter: 2
    verse: 1
    text: How hath the Lord covered the daughter of Zion with a cloud in his anger, and cast down from heaven unto the earth the beauty of Israel, and remembered not his footstool in the day of his anger!
    web: How has the Lord covered the daughter of Zion with a cloud in his anger! He has cast the beauty of Israel down from heaven to the earth, and hasn’t remembered his footstool in the day of his anger.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.2
    name: Lamentations 2:2
    apiRef: Lamentations2:2
    book: Lam
    chapter: 2
    verse: 2
    text: 'The Lord hath swallowed up all the habitations of Jacob, and hath not pitied: he hath thrown down in his wrath the strong holds of the daughter of Judah; he hath brought them down to the ground: he hath polluted the kingdom and the princes thereof.'
    web: The Lord has swallowed up all the dwellings of Jacob without pity. He has thrown down in his wrath the strongholds of the daughter of Judah. He has brought them down to the ground. He has profaned the kingdom and its princes.
    people:
    - israel_682
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
- type: Verse
  data:
    osis: Lam.2.3
    name: Lamentations 2:3
    apiRef: Lamentations2:3
    book: Lam
    chapter: 2
    verse: 3
    text: 'He hath cut off in his fierce anger all the horn of Israel: he hath drawn back his right hand from before the enemy, and he burned against Jacob like a flaming fire, which devoureth round about.'
    web: He has cut off all the horn of Israel in fierce anger. He has drawn back his right hand from before the enemy. He has burned up Jacob like a flaming fire, which devours all around.
    people:
    - israel_682
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Lam.2
