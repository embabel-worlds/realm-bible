  data:
    osis: Lam.1.19
    name: Lamentations 1:19
    apiRef: Lamentations1:19
    book: Lam
    chapter: 1
    verse: 19
    text: 'I called for my lovers, but they deceived me: my priests and mine elders gave up the ghost in the city, while they sought their meat to relieve their souls.'
    web: “I called for my lovers, but they deceived me. My priests and my elders gave up the spirit in the city, while they sought food for themselves to refresh their souls.
  relations:
