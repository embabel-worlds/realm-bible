  data:
    osis: Lam.1.13
    name: Lamentations 1:13
    apiRef: Lamentations1:13
    book: Lam
    chapter: 1
    verse: 13
    text: 'From above hath he sent fire into my bones, and it prevaileth against them: he hath spread a net for my feet, he hath turned me back: he hath made me desolate and faint all the day.'
    web: “From on high has he sent fire into my bones, and it prevails against them. He has spread a net for my feet. He has turned me back. He has made me desolate and I faint all day long.
  relations:
  - predicate: IN
    to:
