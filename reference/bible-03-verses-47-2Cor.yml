    apiRef: 2Corinthians8:10
    book: 2Cor
    chapter: 8
    verse: 10
    text: 'And herein I give my advice: for this is expedient for you, who have begun before, not only to do, but also to be forward a year ago.'
    web: 'I give advice in this: it is expedient for you who were the first to start a year ago, not only to do, but also to be willing.'
