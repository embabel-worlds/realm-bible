    apiRef: 2Corinthians8:15
    book: 2Cor
    chapter: 8
    verse: 15
    text: As it is written, He that had gathered much had nothing over; and he that had gathered little had no lack.
    web: As it is written, “He who gathered much had nothing left over, and he who gathered little had no lack.”
