    apiRef: 2Corinthians9:4
    book: 2Cor
    chapter: 9
    verse: 4
    text: Lest haply if they of Macedonia come with me, and find you unprepared, we (that we say not, ye) should be ashamed in this same confident boasting.
    web: lest by any means, if anyone from Macedonia comes there with me and finds you unprepared, we (to say nothing of you) would be disappointed in this confident boasting.
  relations:
