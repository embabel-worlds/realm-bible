    apiRef: 2Corinthians10:7
    book: 2Cor
    chapter: 10
    verse: 7
    text: Do ye look on things after the outward appearance? If any man trust to himself that he is Christ’s, let him of himself think this again, that, as he is Christ’s, even so are we Christ’s.
    web: Do you look at things only as they appear in front of your face? If anyone trusts in himself that he is Christ’s, let him consider this again with himself, that even as he is Christ’s, so we also are Christ’s.
    people:
    - god_1324
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: 2Cor.10
