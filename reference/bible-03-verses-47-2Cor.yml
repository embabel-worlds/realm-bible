  data:
    osis: 2Cor.9.2
    name: 2 Corinthians 9:2
    apiRef: 2Corinthians9:2
    book: 2Cor
    chapter: 9
    verse: 2
    text: For I know the forwardness of your mind, for which I boast of you to them of Macedonia, that Achaia was ready a year ago; and your zeal hath provoked very many.
    web: for I know your readiness, of which I boast on your behalf to those of Macedonia, that Achaia has been prepared for the past year. Your zeal has stirred up very many of them.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: 2Cor.9
