  data:
    osis: 2Cor.9.6
    name: 2 Corinthians 9:6
    apiRef: 2Corinthians9:6
    book: 2Cor
    chapter: 9
    verse: 6
    text: But this I say, He which soweth sparingly shall reap also sparingly; and he which soweth bountifully shall reap also bountifully.
    web: 'Remember this: he who sows sparingly will also reap sparingly. He who sows bountifully will also reap bountifully.'
