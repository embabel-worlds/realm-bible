    web: For even if I boast somewhat abundantly concerning our authority, which the Lord gave for building you up and not for casting you down, I will not be ashamed,
    people:
    - jesus_905
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: 2Cor.10
