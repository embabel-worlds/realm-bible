  data:
    osis: 2Cor.9.5
    name: 2 Corinthians 9:5
    apiRef: 2Corinthians9:5
    book: 2Cor
    chapter: 9
    verse: 5
    text: Therefore I thought it necessary to exhort the brethren, that they would go before unto you, and make up beforehand your bounty, whereof ye had notice before, that the same might be ready, as a matter of bounty, and not as of covetousness.
    web: I thought it necessary therefore to entreat the brothers that they would go before to you and arrange ahead of time the generous gift that you promised before, that the same might be ready as a matter of generosity, and not of greediness.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: 2Cor.9
