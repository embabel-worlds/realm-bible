  data:
    osis: 2Cor.9.3
    name: 2 Corinthians 9:3
    apiRef: 2Corinthians9:3
    book: 2Cor
    chapter: 9
    verse: 3
    text: 'Yet have I sent the brethren, lest our boasting of you should be in vain in this behalf; that, as I said, ye may be ready:'
    web: But I have sent the brothers so that our boasting on your behalf may not be in vain in this respect, that, just as I said, you may be prepared,
  relations:
