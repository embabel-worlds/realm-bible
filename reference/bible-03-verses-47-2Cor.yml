    apiRef: 2Corinthians10:14
    book: 2Cor
    chapter: 10
    verse: 14
    text: 'For we stretch not ourselves beyond our measure, as though we reached not unto you: for we are come as far as to you also in preaching the gospel of Christ:'
    web: For we don’t stretch ourselves too much, as though we didn’t reach to you. For we came even as far as to you with the Good News of Christ,
