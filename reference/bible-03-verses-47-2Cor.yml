  data:
    osis: 2Cor.10.6
    name: 2 Corinthians 10:6
    apiRef: 2Corinthians10:6
    book: 2Cor
    chapter: 10
    verse: 6
    text: And having in a readiness to revenge all disobedience, when your obedience is fulfilled.
    web: and being in readiness to avenge all disobedience when your obedience is made full.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: 2Cor.10
