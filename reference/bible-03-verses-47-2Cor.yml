    osis: 2Cor.10.13
    name: 2 Corinthians 10:13
    apiRef: 2Corinthians10:13
    book: 2Cor
    chapter: 10
    verse: 13
    text: But we will not boast of things without our measure, but according to the measure of the rule which God hath distributed to us, a measure to reach even unto you.
    web: But we will not boast beyond proper limits, but within the boundaries with which God appointed to us, which reach even to you.
    people:
    - god_1324
  relations:
