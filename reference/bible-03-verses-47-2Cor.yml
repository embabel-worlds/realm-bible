    apiRef: 2Corinthians10:2
    book: 2Cor
    chapter: 10
    verse: 2
    text: But I beseech you, that I may not be bold when I am present with that confidence, wherewith I think to be bold against some, which think of us as if we walked according to the flesh.
    web: Yes, I beg you that I may not, when present, show courage with the confidence with which I intend to be bold against some, who consider us to be walking according to the flesh.
