  data:
    osis: 2Cor.10.12
    name: 2 Corinthians 10:12
    apiRef: 2Corinthians10:12
    book: 2Cor
    chapter: 10
    verse: 12
    text: 'For we dare not make ourselves of the number, or compare ourselves with some that commend themselves: but they measuring themselves by themselves, and comparing themselves among themselves, are not wise.'
    web: For we are not bold to number or compare ourselves with some of those who commend themselves. But they themselves, measuring themselves by themselves, and comparing themselves with themselves, are without understanding.
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: 2Cor.10
