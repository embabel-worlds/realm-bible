- type: "Collect"
  data:
    key: "first-sunday-of-advent"
    name: "First Sunday of Advent"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty God, give us grace that we may cast away the works of darkness, and put upon us the armor of light, now in the time of this mortal life in which thy Son Jesus Christ came to visit us in great humility; that in the last day, when he shall come again in his glorious majesty to judge both the quick and the dead, we may rise to the life immortal; through him who liveth and reigneth with thee and the Holy Ghost, one God, now and for ever. Amen."
    rite2: "Almighty God, give us grace to cast away the works of darkness, and put on the armor of light, now in the time of this mortal life in which your Son Jesus Christ came to visit us in great humility; that in the last day, when he shall come again in his glorious majesty to judge both the living and the dead, we may rise to the life immortal; through him who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "second-sunday-of-advent"
    name: "Second Sunday of Advent"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Merciful God, who didst send thy messengers the prophets to preach repentance and prepare the way for our salvation: Give us grace to heed their warnings and forsake our sins, that we may greet with joy the coming of Jesus Christ our Redeemer; who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Merciful God, who sent your messengers the prophets to preach repentance and prepare the way for our salvation: Give us grace to heed their warnings and forsake our sins, that we may greet with joy the coming of Jesus Christ our Redeemer; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "third-sunday-of-advent"
    name: "Third Sunday of Advent"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Stir up thy power, O Lord, and with great might come among us; and, because we are sorely hindered by our sins, let thy bountiful grace and mercy speedily help and deliver us; through Jesus Christ our Lord, to whom, with thee and the Holy Ghost, be honor and glory, world without end. Amen."
    rite2: "Stir up your power, O Lord, and with great might come among us; and, because we are sorely hindered by our sins, let your bountiful grace and mercy speedily help and deliver us; through Jesus Christ our Lord, to whom, with you and the Holy Spirit, be honor and glory, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "fourth-sunday-of-advent"
    name: "Fourth Sunday of Advent"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "We beseech thee, Almighty God, to purify our consciences by thy daily visitation, that when thy Son our Lord cometh he may find in us a mansion prepared for himself; through the same Jesus Christ our Lord, who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Purify our conscience, Almighty God, by your daily visitation, that your Son Jesus Christ, at his coming, may find in us a mansion prepared for himself; who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "nativity-of-our-lord"
    name: "The Nativity of Our Lord: Christmas Day"
    kind: "season"
    monthDay: "12-25"
    note: ""
    rite1: "O God, who makest us glad by the yearly remembrance of the birth of thy only Son Jesus Christ: Grant that as we joyfully receive him for our Redeemer, so we may with sure confidence behold him when he shall come to be our Judge; who liveth and reigneth with thee and the Holy Ghost, one God, world without end. Amen."
    rite2: "O God, you make us glad by the yearly festival of the birth of your only Son Jesus Christ: Grant that we, who joyfully receive him as our Redeemer, may with sure confidence behold him when he comes to be our Judge; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives:
    - "O God, who hast caused this holy night to shine with the illumination of the true Light: Grant us, we beseech thee, that as we have known the mystery of that Light upon earth, so may we also perfectly enjoy him in heaven; where with thee and the Holy Spirit he liveth and reigneth, one God, in glory everlasting. Amen."
    - "Almighty God, who hast given us thy only-begotten Son to take our nature upon him and as at this time to be born of a pure virgin: Grant that we, being regenerate and made thy children by adoption and grace, may daily be renewed by thy Holy Spirit; through the same our Lord Jesus Christ, who liveth and reigneth with thee and the same Spirit ever, one God, world without end. Amen."
    rite2Alternatives:
    - "O God, you have caused this holy night to shine with the brightness of the true Light: Grant that we, who have known the mystery of that Light on earth, may also enjoy him perfectly in heaven; where with you and the Holy Spirit he lives and reigns, one God, in glory everlasting. Amen."
    - "Almighty God, you have given your only-begotten Son to take our nature upon him, and to be born [this day] of a pure virgin: Grant that we, who have been born again and made your children by adoption and grace, may daily be renewed by your Holy Spirit; through our Lord Jesus Christ, to whom with you and the same Spirit be honor and glory, now and for ever. Amen."
- type: "Collect"
  data:
    key: "first-sunday-after-christmas-day"
    name: "First Sunday after Christmas Day"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty God, who hast poured upon us the new light of thine incarnate Word: Grant that the same light, enkindled in our hearts, may shine forth in our lives; through the same Jesus Christ our Lord, who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty God, you have poured upon us the new light of your incarnate Word: Grant that this light, enkindled in our hearts, may shine forth in our lives; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "holy-name"
    name: "The Holy Name"
    kind: "season"
    monthDay: "01-01"
    note: ""
    rite1: "Eternal Father, who didst give to thine incarnate Son the holy name of Jesus to be the sign of our salvation: Plant in every heart, we beseech thee, the love of him who is the Savior of the world, even our Lord Jesus Christ; who liveth and reigneth with thee and the Holy Spirit, one God, in glory everlasting. Amen."
    rite2: "Eternal Father, you gave to your incarnate Son the holy name of Jesus to be the sign of our salvation: Plant in every heart, we pray, the love of him who is the Savior of the world, our Lord Jesus Christ; who lives and reigns with you and the Holy Spirit, one God, in glory everlasting. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "second-sunday-after-christmas-day"
    name: "Second Sunday after Christmas Day"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, who didst wonderfully create, and yet more wonderfully restore, the dignity of human nature: Grant that we may share the divine life of him who humbled himself to share our humanity, thy Son Jesus Christ; who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, who wonderfully created, and yet more wonderfully restored, the dignity of human nature: Grant that we may share the divine life of him who humbled himself to share our humanity, your Son Jesus Christ; who lives and reigns with you, in the unity of the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "epiphany"
    name: "The Epiphany"
    kind: "season"
    monthDay: "01-06"
    note: ""
    rite1: "O God, who by the leading of a star didst manifest thy only- begotten Son to the peoples of the earth: Lead us, who know thee now by faith, to thy presence, where we may behold thy glory face to face; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "O God, by the leading of a star you manifested your only Son to the Peoples of the earth: Lead us, who know you now by faith, to your presence, where we may see your glory face to face; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "first-sunday-after-the-epiphany"
    name: "First Sunday after the Epiphany: The Baptism of our Lord"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Father in heaven, who at the baptism of Jesus in the River Jordan didst proclaim him thy beloved Son and anoint him with the Holy Spirit: Grant that all who are baptized into his Name may keep the covenant they have made, and boldly confess him as Lord and Savior; who with thee and the same Spirit liveth and reigneth, one God, in glory everlasting. Amen."
    rite2: "Father in heaven, who at the baptism of Jesus in the River Jordan proclaimed him your beloved Son and anointed him with the Holy Spirit: Grant that all who are baptized into his Name may keep the covenant they have made, and boldly confess him as Lord and Savior; who with you and the Holy Spirit lives and reigns, one God, in glory everlasting. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "second-sunday-after-the-epiphany"
    name: "Second Sunday after the Epiphany"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty God, whose Son our Savior Jesus Christ is the light of the world: Grant that thy people, illumined by thy Word and Sacraments, may shine with the radiance of Christ's glory, that he may be known, worshiped, and obeyed to the ends of the earth; through the same Jesus Christ our Lord, who with thee and the Holy Spirit liveth and reigneth, one God, now and for ever. Amen."
    rite2: "Almighty God, whose Son our Savior Jesus Christ is the light of the world: Grant that your people, illumined by your Word and Sacraments, may shine with the radiance of Christ's glory, that he may be known, worshiped, and obeyed to the ends of the earth; through Jesus Christ our Lord, who with you and the Holy Spirit lives and reigns, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "third-sunday-after-the-epiphany"
    name: "Third Sunday after the Epiphany"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Give us grace, O Lord, to answer readily the call of our Savior Jesus Christ and proclaim to all people the Good News of his salvation, that we and all the whole world may perceive the glory of his marvelous works; who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Give us grace, O Lord, to answer readily the call of our Savior Jesus Christ and proclaim to all people the Good News of his salvation, that we and the whole world may perceive the glory of his marvelous works; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "fourth-sunday-after-the-epiphany"
    name: "Fourth Sunday after the Epiphany"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty and everlasting God, who dost govern all things in heaven and earth: Mercifully hear the supplications of thy people, and in our time grant us thy peace; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty and everlasting God, you govern all things both in heaven and on earth: Mercifully hear the supplications of your people, and in our time grant us your peace; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "fifth-sunday-after-the-epiphany"
    name: "Fifth Sunday after the Epiphany"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Set us free, O God, from the bondage of our sins and give us, we beseech thee, the liberty of that abundant life which thou hast manifested to us in thy Son our Savior Jesus Christ; who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Set us free, O God, from the bondage of our sins, and give us the liberty of that abundant life which you have made known to us in your Son our Savior Jesus Christ; who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "sixth-sunday-after-the-epiphany"
    name: "Sixth Sunday after the Epiphany"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, the strength of all who put their trust in thee: Mercifully accept our prayers; and because through the weakness of our mortal nature, we can do no good thing without thee, give us the help of thy grace, that in keeping thy commandments we may please thee both in will and deed; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, the strength of all who put their trust in you: Mercifully accept our prayers; and because in our weakness we can do nothing good without you, give us the help of your grace, that in keeping your commandments we may please you both in will and deed; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "seventh-sunday-after-the-epiphany"
    name: "Seventh Sunday after the Epiphany"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O Lord, who hast taught us that all our doings without charity are nothing worth: Send thy Holy Ghost and pour into our hearts that most excellent gift of charity, the very bond of peace and of all virtues, without which whosoever liveth is counted dead before thee. Grant this for thine only Son Jesus Christ's sake, who liveth and reigneth with thee and the same Holy Ghost, one God, now and for ever. Amen."
    rite2: "O Lord, you have taught us that without love whatever we do is worth nothing; Send your Holy Spirit and pour into our hearts your greatest gift, which is love, the true bond of peace and of all virtue, without which whoever lives is accounted dead before you. Grant this for the sake of your only Son Jesus Christ, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "eighth-sunday-after-the-epiphany"
    name: "Eighth Sunday after the Epiphany"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O most loving Father, who willest us to give thanks for all things, to dread nothing but the loss of thee, and to cast all our care on thee who carest for us: Preserve us from faithless fears and worldly anxieties, and grant that no clouds of this mortal life may hide from us the light of that love which is immortal, and which thou hast manifested unto us in thy Son Jesus Christ our Lord; who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Most loving Father, whose will it is for us to give thanks for all things, to fear nothing but the loss of you, and to cast all our care on you who care for us: Preserve us from faithless fears and worldly anxieties, that no clouds of this mortal life may hide from us the light of that love which is immortal, and which you have manifested to us in your Son Jesus Christ our Lord; who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "last-sunday-after-the-epiphany"
    name: "Last Sunday after the Epiphany"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, who before the passion of thy only-begotten Son didst reveal his glory upon the holy mount: Grant unto us that we, beholding by faith the light of his countenance, may be strengthened to bear our cross, and be changed into his likeness from glory to glory; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, who before the passion of your only-begotten Son revealed his glory upon the holy mountain: Grant to us that we, beholding by faith the light of his countenance, may be strengthened to bear our cross, and be changed into his likeness from glory to glory; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "ash-wednesday"
    name: "Ash Wednesday"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty and everlasting God, who hatest nothing that thou hast made and dost forgive the sins of all those who are penitent: Create and make in us new and contrite hearts, that we, worthily lamenting our sins and acknowledging our wretchedness, may obtain of thee, the God of all mercy, perfect remission and forgiveness; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty and everlasting God, you hate nothing you have made and forgive the sins of all who are penitent: Create and make in us new and contrite hearts, that we, worthily lamenting our sins and acknowledging our wretchedness, may obtain of you, the God of all mercy, perfect remission and forgiveness; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "first-sunday-in-lent"
    name: "First Sunday in Lent"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty God, whose blessed Son was led by the Spirit to be tempted of Satan: Make speed to help thy servants who are assaulted by manifold temptations; and, as thou knowest their several infirmities, let each one find thee mighty to save; through Jesus Christ thy Son our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty God, whose blessed Son was led by the Spirit to be tempted by Satan: Come quickly to help us who are assaulted by many temptations; and, as you know the weaknesses of each of us, let each one find you mighty to save; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "second-sunday-in-lent"
    name: "Second Sunday in Lent"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, whose glory it is always to have mercy: Be gracious to all who have gone astray from thy ways, and bring them again with penitent hearts and steadfast faith to embrace and hold fast the unchangeable truth of thy Word, Jesus Christ thy Son; who with thee and the Holy Spirit liveth and reigneth, one God, for ever and ever. Amen."
    rite2: "O God, whose glory it is always to have mercy: Be gracious to all who have gone astray from your ways, and bring them again with penitent hearts and steadfast faith to embrace and hold fast the unchangeable truth of your Word, Jesus Christ your Son; who with you and the Holy Spirit lives and reigns, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "third-sunday-in-lent"
    name: "Third Sunday in Lent"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty God, who seest that we have no power of ourselves to help ourselves: Keep us both outwardly in our bodies and inwardly in our souls, that we may be defended from all adversities which may happen to the body, and from all evil thoughts which may assault and hurt the soul; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty God, you know that we have no power in ourselves to help ourselves: Keep us both outwardly in our bodies and inwardly in our souls, that we may be defended from all adversities which may happen to the body, and from all evil thoughts which may assault and hurt the soul; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "fourth-sunday-in-lent"
    name: "Fourth Sunday in Lent"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Gracious Father, whose blessed Son Jesus Christ came down from heaven to be the true bread which giveth life to the world: Evermore give us this bread, that he may live in us, and we in him; who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Gracious Father, whose blessed Son Jesus Christ came down from heaven to be the true bread which gives life to the world: Evermore give us this bread, that he may live in us, and we in him; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "fifth-sunday-in-lent"
    name: "Fifth Sunday in Lent"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O Almighty God, who alone canst order the unruly wills and affections of sinful men: Grant unto thy people that they may love the thing which thou commandest, and desire that which thou dost promise; that so, among the sundry and manifold changes of the world, our hearts may surely there be fixed where true joys are to be found; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty God, you alone can bring into order the unruly wills and affections of sinners: Grant your people grace to love what you command and desire what you promise; that, among the swift and varied changes of the world, our hearts may surely there be fixed where true joys are to be found; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "sunday-of-the-passion"
    name: "Sunday of the Passion: Palm Sunday"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty and everlasting God, who, of thy tender love towards mankind, hast sent thy Son our Savior Jesus Christ to take upon him our flesh, and to suffer death upon the cross, that all mankind should follow the example of his great humility: Mercifully grant that we may both follow the example of his patience, and also be made partakers of his resurrection; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty and everliving God, in your tender love for the human race you sent your Son our Savior Jesus Christ to take upon him our nature, and to suffer death upon the cross, giving us the example of his great humility: Mercifully grant that we may walk in the way of his suffering, and also share in his resurrection; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "monday-in-holy-week"
    name: "Monday in Holy Week"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty God, whose most dear Son went not up to joy but first he suffered pain, and entered not into glory before he was crucified: Mercifully grant that we, walking in the way of the cross, may find it none other than the way of life and peace; through the same thy Son Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty God, whose dear Son went not up to joy but first he suffered pain, and entered not into glory before he was crucified: Mercifully grant that we, walking in the way of the cross, may find it none other that the way of life and peace; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "tuesday-in-holy-week"
    name: "Tuesday in Holy Week"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, by the passion of thy blessed Son didst make an instrument of shameful death to be unto us the means of life: Grant us so to glory in the cross of Christ, that we may gladly suffer shame and loss for the sake of thy Son our Savior Jesus Christ; who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, by the passion of your blessed Son you made an instrument of shameful death to be for us the means of life: Grant us so to glory in the cross of Christ, that we may gladly suffer shame and loss for the sake of your Son our Savior Jesus Christ; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "wednesday-in-holy-week"
    name: "Wednesday in Holy Week"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O Lord God, whose blessed Son our Savior gave his back to the smiters and hid not his face from shame: Grant us grace to take joyfully the sufferings of the present time, in full assurance of the glory that shall be revealed; through the same Jesus Christ thy Son our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Lord God, whose blessed Son our Savior gave his body to be whipped and his face to be spit upon: Give us grace to accept joyfully the sufferings of the present time, confident of the glory that shall be revealed; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "maundy-thursday"
    name: "Maundy Thursday"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty Father, whose dear Son, on the night before he suffered, did institute the Sacrament of his Body and Blood: Mercifully grant that we may thankfully receive the same in remembrance of him who in these holy mysteries giveth us a pledge of life eternal, the same thy Son Jesus Christ our Lord; who now liveth and reigneth with thee and the Holy Spirit ever, one God, world without end. Amen."
    rite2: "Almighty Father, whose dear Son, on the night before he suffered, instituted the Sacrament of his Body and Blood: Mercifully grant that we may receive it thankfully in remembrance of Jesus Christ our Lord, who in these holy mysteries gives us a pledge of eternal life; and who now lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "good-friday"
    name: "Good Friday"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty God, we beseech thee graciously to behold this thy family, for whom our Lord Jesus Christ was contented to be betrayed, and given into the hands of sinners, and to suffer death upon the cross; who now liveth and reigneth with thee and the Holy Ghost ever, one God, world without end. Amen."
    rite2: "Almighty God, we pray you graciously to behold this your family, for whom our Lord Jesus Christ was willing to be betrayed, and given into the hands of sinners, and to suffer death upon the cross; who now lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "holy-saturday"
    name: "Holy Saturday"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, Creator of heaven and earth: Grant that, as the crucified body of thy dear Son was laid in the tomb and rested on this holy Sabbath, so we may await with him the coming of the third day, and rise with him to newness of life; who now liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, Creator of heaven and earth: Grant that, as the crucified body of your dear Son was laid in the tomb and rested on this holy Sabbath, so we may await with him the coming of the third day, and rise with him to newness of life; who now lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "easter-day"
    name: "Easter Day"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, who for our redemption didst give thine only-begotten Son to the death of the cross, and by his glorious resurrection hast delivered us from the power of our enemy: Grant us so to die daily to sin, that we may evermore live with him in the joy of his resurrection; through the same thy Son Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "O God, who for our redemption gave your only-begotten Son to the death of the cross, and by his glorious resurrection delivered us from the power of our enemy: Grant us so to die daily to sin, that we may evermore live with him in the joy of his resurrection; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives:
    - "O God, who didst make this most holy night to shine with the glory of the Lord's resurrection: Stir up in thy Church that Spirit of adoption which is given to us in Baptism, that we, being renewed both in body and mind, may worship thee in sincerity and truth; through the same Jesus Christ our Lord, who liveth and reigneth with thee in the unity of the same Spirit, one God, now and for ever. Amen."
    - "Almighty God, who through thine only-begotten Son Jesus Christ hast overcome death and opened unto us the gate of everlasting life: Grant that we, who celebrate with joy the day of the Lord's resurrection, may be raised from the death of sin by thy life-giving Spirit; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the same Spirit ever, one God, world without end. Amen."
    rite2Alternatives:
    - "O God, who made this most holy night to shine with the glory of the Lord's resurrection: Stir up in your Church that Spirit of adoption which is given to us in Baptism, that we, being renewed both in body and mind, may worship you in sincerity and truth; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    - "Almighty God, who through your only-begotten Son Jesus Christ overcame death and opened to us the gate of everlasting life: Grant that we, who celebrate with joy the day of the Lord's resurrection, may be raised from the death of sin by your life-giving Spirit; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
- type: "Collect"
  data:
    key: "monday-in-easter-week"
    name: "Monday in Easter Week"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Grant, we beseech thee, Almighty God, that we who celebrate with reverence the Paschal feast may be found worthy to attain to everlasting joys; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Grant, we pray, Almighty God, that we who celebrate with awe the Paschal feast may be found worthy to attain to everlasting joys; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "tuesday-in-easter-week"
    name: "Tuesday in Easter Week"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, who by the glorious resurrection of thy Son Jesus Christ didst destroy death and brought life and immortality to light: Grant that we, who have been raised with him, may abide in his presence and rejoice in the hope of eternal glory; through the same Jesus Christ our Lord, to whom, with thee and the Holy Spirit, be dominion and praise for ever and ever. Amen."
    rite2: "O God, who by the glorious resurrection of your Son Jesus Christ destroyed death and brought life and immortality to light: Grant that we, who have been raised with him, may abide in his presence and rejoice in the hope of eternal glory; through Jesus Christ our Lord, to whom, with you and the Holy Spirit, be dominion and praise for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "wednesday-in-easter-week"
    name: "Wednesday in Easter Week"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, whose blessed Son did manifest himself to his disciples in the breaking of bread: Open, we pray thee, the eyes of our faith, that we may behold him in all his redeeming work; through the same thy Son Jesus Christ our Lord, who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "O God, whose blessed Son made himself known to his disciples in the breaking of bread: Open the eyes of our faith, that we may behold him in all his redeeming work; who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "thursday-in-easter-week"
    name: "Thursday in Easter Week"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty and everlasting God, who in the Paschal mystery hast established the new covenant of reconciliation: Grant that all who have been reborn into the fellowship of Christ's Body may show forth in their lives what they profess by their faith; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty and everlasting God, who in the Paschal mystery established the new covenant of reconciliation: Grant that all who have been reborn into the fellowship of Christ's Body may show forth in their lives what they profess by their faith; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "friday-in-easter-week"
    name: "Friday in Easter Week"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty Father, who hast given thine only Son to die for our sins and to rise again for our justification: Grant us so to put away the leaven of malice and wickedness, that we may always serve thee in pureness of living and truth; through the same thy Son Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty Father, who gave your only Son to die for our sins and to rise for our justification: Give us grace so to put away the leaven of malice and wickedness, that we may always serve you in pureness of living and truth; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saturday-in-easter-week"
    name: "Saturday in Easter Week"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "We thank thee, heavenly Father, for that thou hast delivered us from the dominion of sin and death and hast brought us into the kingdom of thy Son; and we pray thee that, as by his death he hath recalled us to life, so by his love he may raise us to joys eternal; who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "We thank you, heavenly Father, that you have delivered us from the dominion of sin and death and brought us into the kingdom of your Son; and we pray that, as by his death he has recalled us to life, so by his love he may raise us to eternal joys; who lives and reigns with you, in the unity of the Holy Spirit, one God, now and forever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
