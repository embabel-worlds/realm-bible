- type: "Collect"
  data:
    key: "fourth-sunday-of-easter"
    name: "Fourth Sunday of Easter"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, whose Son Jesus is the good shepherd of thy people: Grant that when we hear his voice we may know him who calleth us each by name, and follow where he doth lead; who, with thee and the Holy Spirit, liveth and reigneth, one God, for ever and ever. Amen."
    rite2: "O God, whose Son Jesus is the good shepherd of your people; Grant that when we hear his voice we may know him who calls us each by name, and follow where he leads; who, with you and the Holy Spirit, lives and reigns, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "fifth-sunday-of-easter"
    name: "Fifth Sunday of Easter"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O Almighty God, whom truly to know is everlasting life: Grant us so perfectly to know thy Son Jesus Christ to be the way, the truth, and the life, that we may steadfastly follow his steps in the way that leadeth to eternal life; through the same thy Son Jesus Christ our Lord, who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty God, whom truly to know is everlasting life: Grant us so perfectly to know your Son Jesus Christ to be the way, the truth, and the life, that we may steadfastly follow his steps in the way that leads to eternal life; through Jesus Christ your Son our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "sixth-sunday-of-easter"
    name: "Sixth Sunday of Easter"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, who hast prepared for those who love thee such good things as pass man's understanding: Pour into our hearts such love toward thee, that we, loving thee in all things and above all things, may obtain thy promises, which exceed all that we can desire; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, you have prepared for those who love you such good things as surpass our understanding: Pour into our hearts such love towards you, that we, loving you in all things and above all things, may obtain your promises, which exceed all that we can desire; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "ascension-day"
    name: "Ascension Day"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O Almighty God, whose blessed Son our Savior Jesus Christ ascended far above all heavens that he might fill all things: Mercifully give us faith to perceive that, according to his promise, he abideth with his Church on earth, even unto the end of the ages; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, in glory everlasting. Amen."
    rite2: "Almighty God, whose blessed Son our Savior Jesus Christ ascended far above all heavens that he might fill all things: Mercifully give us faith to perceive that, according to his promise, he abides with his Church on earth, even to the end of the ages; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, in glory everlasting. Amen."
    rite1Alternatives:
    - "Grant, we beseech thee, Almighty God, that like as we do believe thy only-begotten Son our Lord Jesus Christ to have ascended into the heavens, so we may also in heart and mind thither ascend, and with him continually dwell; who liveth and reigneth with thee and the Holy Ghost, one God, world without end. Amen."
    rite2Alternatives:
    - "Grant, we pray, Almighty God, that as we believe your only-begotten Son our Lord Jesus Christ to have ascended into heaven, so we may also in heart and mind there ascend, and with him continually dwell; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
- type: "Collect"
  data:
    key: "seventh-sunday-of-easter"
    name: "Seventh Sunday of Easter: The Sunday after Ascension Day"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "O God, the King of glory, who hast exalted thine only Son Jesus Christ with great triumph unto thy kingdom in heaven: We beseech thee, leave us not comfortless, but send to us thine Holy Ghost to comfort us, and exalt us unto the same place whither our Savior Christ is gone before; who liveth and reigneth with thee and the same Holy Ghost, one God, world without end. Amen."
    rite2: "O God, the King of glory, you have exalted your only Son Jesus Christ with great triumph to your kingdom in heaven: Do not leave us comfortless, but send us your Holy Spirit to strengthen us, and exalt us to that place where our Savior Christ has gone before; who lives and reigns with you and the Holy Spirit, one God, in glory everlasting. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "day-of-pentecost"
    name: "The Day of Pentecost: Whitsunday"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty God, who on this day didst open the way of eternal life to every race and nation by the promised gift of thy Holy Spirit: Shed abroad this gift throughout the world by the preaching of the Gospel, that it may reach to the ends of the earth; through Jesus Christ our Lord, who liveth and reigneth with thee, in the unity of the same Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty God, on this day you opened the way of eternal life to every race and nation by the promised gift of your Holy Spirit: Shed abroad this gift throughout the world by the preaching of the Gospel, that it may reach to the ends of the earth; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives:
    - "O God, who on this day didst teach the hearts of thy faithful people by sending to them the light of thy Holy Spirit: Grant us by the same Spirit to have a right judgment in all things, and evermore to rejoice in his holy comfort; through the merits of Christ Jesus our Savior, who liveth and reigneth with thee, in the unity of the same Spirit, one God, world without end. Amen."
    rite2Alternatives:
    - "O God, who on this day taught the hearts of your faithful people by sending to them the light of your Holy Spirit: Grant us by the same Spirit to have a right judgment in all things, and evermore to rejoice in his holy comfort; through Jesus Christ your Son our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, for ever and ever. Amen."
- type: "Collect"
  data:
    key: "first-sunday-after-pentecost"
    name: "First Sunday after Pentecost: Trinity Sunday"
    kind: "season"
    monthDay: ""
    note: ""
    rite1: "Almighty and everlasting God, who hast given unto us thy servants grace, by the confession of a true faith, to acknowledge the glory of the eternal Trinity, and in the power of the Divine Majesty to worship the Unity: We beseech thee that thou wouldest keep us steadfast in this faith and worship, and bring us at last to see thee in thy one and eternal glory, O Father; who with the Son and the Holy Spirit livest and reignest, one God, for ever and ever. Amen."
    rite2: "Almighty and everlasting God, you have given to us your servants grace, by the confession of a true faith, to acknowledge the glory of the eternal Trinity, and in the power of your divine Majesty to worship the Unity: Keep us steadfast in this faith and worship, and bring us at last to see you in your one and eternal glory, O Father; who with the Son and the Holy Spirit live and reign, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-1"
    name: "Proper 1"
    kind: "season"
    monthDay: "05-11"
    note: "The Sunday closest to May 11"
    rite1: "Remember, O Lord, what thou hast wrought in us and not what we deserve; and, as thou hast called us to thy service, make us worthy of our calling; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Remember, O Lord, what you have wrought in us and not what we deserve; and, as you have called us to your service, make us worthy of our calling; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-2"
    name: "Proper 2"
    kind: "season"
    monthDay: "05-18"
    note: "The Sunday closest to May 18"
    rite1: "O Almighty and most merciful God, of thy bountiful goodness keep us, we beseech thee, from all things that may hurt us, that we, being ready both in body and soul, may with free hearts accomplish those things which belong to thy purpose; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty and merciful God, in your goodness keep us, we pray, from all things that may hurt us, that we, being ready both in mind and body, may accomplish with free hearts those things which belong to your purpose; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-3"
    name: "Proper 3"
    kind: "season"
    monthDay: "05-25"
    note: "The Sunday closest to May 25"
    rite1: "Grant, O Lord, we beseech thee, that the course of this world may be peaceably governed by thy providence, and that thy Church may joyfully serve thee in confidence and serenity; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Grant, O Lord, that the course of this world may be peaceably governed by your providence; and that your Church may joyfully serve you in confidence and serenity; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-4"
    name: "Proper 4"
    kind: "season"
    monthDay: "06-01"
    note: "The Sunday closest to June 1"
    rite1: "O God, whose never-failing providence ordereth all things both in heaven and earth: We humbly beseech thee to put away from us all hurtful things, and to give us those things which are profitable for us; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, your never-failing providence sets in order all things both in heaven and earth: Put away from us, we entreat you, all hurtful things, and give us those things which are profitable for us; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-5"
    name: "Proper 5"
    kind: "season"
    monthDay: "06-08"
    note: "The Sunday closest to June 8"
    rite1: "O God, from whom all good doth come: Grant that by thy inspiration we may think those things that are right, and by thy merciful guiding may perform the same; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, from whom all good proceeds: Grant that by your inspiration we may think those things that are right, and by your merciful guiding may do them; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-6"
    name: "Proper 6"
    kind: "season"
    monthDay: "06-15"
    note: "The Sunday closest to June 15"
    rite1: "Keep, O Lord, we beseech thee, thy household the Church in thy steadfast faith and love, that by the help of thy grace we may proclaim thy truth with boldness, and minister thy justice with compassion; for the sake of our Savior Jesus Christ, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Keep, O Lord, your household the Church in your steadfast faith and love, that through your grace we may proclaim your truth with boldness, and minister your justice with compassion; for the sake of our Savior Jesus Christ, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-7"
    name: "Proper 7"
    kind: "season"
    monthDay: "06-22"
    note: "The Sunday closest to June 22"
    rite1: "O Lord, we beseech thee, make us to have a perpetual fear and love of thy holy Name, for thou never failest to help and govern those whom thou hast set upon the sure foundation of thy loving-kindness; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O Lord, make us have perpetual love and reverence for your holy Name, for you never fail to help and govern those whom you have set upon the sure foundation of your loving-kindness; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-8"
    name: "Proper 8"
    kind: "season"
    monthDay: "06-29"
    note: "The Sunday closest to June 29"
    rite1: "O Almighty God, who hast built thy Church upon the foundation of the apostles and prophets, Jesus Christ himself being the chief cornerstone: Grant us so to be joined together in unity of spirit by their doctrine, that we may be made an holy temple acceptable unto thee; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty God, you have built your Church upon the foundation of the apostles and prophets, Jesus Christ himself being the chief cornerstone: Grant us so to be joined together in unity of spirit by their teaching, that we may be made a holy temple acceptable to you; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-9"
    name: "Proper 9"
    kind: "season"
    monthDay: "07-06"
    note: "The Sunday closest to July 6"
    rite1: "O God, who hast taught us to keep all thy commandments by loving thee and our neighbor: Grant us the grace of thy Holy Spirit, that we may be devoted to thee with our whole heart, and united to one another with pure affection; through Jesus Christ our Lord, who liveth and reigneth with thee and the same Spirit, one God, for ever and ever. Amen."
    rite2: "O God, you have taught us to keep all your commandments by loving you and our neighbor: Grant us the grace of your Holy Spirit, that we may be devoted to you with our whole heart, and united to one another with pure affection; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-10"
    name: "Proper 10"
    kind: "season"
    monthDay: "07-13"
    note: "The Sunday closest to July 13"
    rite1: "O Lord, we beseech thee mercifully to receive the prayers of thy people who call upon thee, and grant that they may both perceive and know what things they ought to do, and also may have grace and power faithfully to fulfill the same; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "O Lord, mercifully receive the prayers of your people who call upon you, and grant that they may know and understand what things they ought to do, and also may have grace and power faithfully to accomplish them; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-11"
    name: "Proper 11"
    kind: "season"
    monthDay: "07-20"
    note: "The Sunday closest to July 20"
    rite1: "Almighty God, the fountain of all wisdom, who knowest our necessities before we ask and our ignorance in asking: Have compassion, we beseech thee, upon our infirmities, and those things which for our unworthiness we dare not, and for our blindness we cannot ask, mercifully give us for the worthiness of thy Son Jesus Christ our Lord; who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty God, the fountain of all wisdom, you know our necessities before we ask and our ignorance in asking: Have compassion on our weakness, and mercifully give us those things which for our unworthiness we dare not, and for our blindness we cannot ask; through the worthiness of your Son Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-12"
    name: "Proper 12"
    kind: "season"
    monthDay: "07-27"
    note: "The Sunday closest to July 27"
    rite1: "O God, the protector of all that trust in thee, without whom nothing is strong, nothing is holy: Increase and multiply upon us thy mercy; that, thou being our ruler and guide, we may so pass through things temporal, that we finally lose not the things eternal; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, the protector of all who trust in you, without whom nothing is strong, nothing is holy: Increase and multiply upon us your mercy; that, with you as our ruler and guide, we may so pass through things temporal, that we lose not the things eternal; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-13"
    name: "Proper 13"
    kind: "season"
    monthDay: "08-03"
    note: "The Sunday closest to August 3"
    rite1: "O Lord, we beseech thee, let thy continual pity cleanse and defend thy Church, and, because it cannot continue in safety without thy succor, preserve it evermore by thy help and goodness; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Let your continual mercy, O Lord, cleanse and defend your Church; and, because it cannot continue in safety without your help, protect and govern it always by your goodness; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-14"
    name: "Proper 14"
    kind: "season"
    monthDay: "08-10"
    note: "The Sunday closest to August 10"
    rite1: "Grant to us, Lord, we beseech thee, the spirit to think and do always such things as are right, that we, who cannot exist without thee, may by thee be enabled to live according to thy will; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Grant to us, Lord, we pray, the spirit to think and do always those things that are right, that we, who cannot exist without you, may by you be enabled to live according to your will; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-15"
    name: "Proper 15"
    kind: "season"
    monthDay: "08-17"
    note: "The Sunday closest to August 17"
    rite1: "Almighty God, who hast given thy only Son to be unto us both a sacrifice for sin and also an example of godly life: Give us grace that we may always most thankfully receive that his inestimable benefit, and also daily endeavor ourselves to follow the blessed steps of his most holy life; through the same thy Son Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty God, you have given your only Son to be for us a sacrifice for sin, and also an example of godly life: Give us grace to receive thankfully the fruits of his redeeming work, and to follow daily in the blessed steps of his most holy life; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-16"
    name: "Proper 16"
    kind: "season"
    monthDay: "08-24"
    note: "The Sunday closest to August 24"
    rite1: "Grant, we beseech thee, merciful God, that thy Church, being gathered together in unity by thy Holy Spirit, may manifest thy power among all peoples, to the glory of thy Name; through Jesus Christ our Lord, who liveth and reigneth with thee and the same Spirit, one God, world without end. Amen."
    rite2: "Grant, O merciful God, that your Church, being gathered together in unity by your Holy Spirit, may show forth your power among all peoples, to the glory of your Name; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-17"
    name: "Proper 17"
    kind: "season"
    monthDay: "08-31"
    note: "The Sunday closest to August 31"
    rite1: "Lord of all power and might, who art the author and giver of all good things: Graft in our hearts the love of thy Name, increase in us true religion, nourish us with all goodness, and bring forth in us the fruit of good works; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Lord of all power and might, the author and giver of all good things: Graft in our hearts the love of your Name; increase in us true religion; nourish us with all goodness; and bring forth in us the fruit of good works; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-18"
    name: "Proper 18"
    kind: "season"
    monthDay: "09-07"
    note: "The Sunday closest to September 7"
    rite1: "Grant us, O Lord, we pray thee, to trust in thee with all our heart; seeing that, as thou dost alway resist the proud who confide in their own strength, so thou dost not forsake those who make their boast of thy mercy; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Grant us, O Lord, to trust in you with all our hearts; for, as you always resist the proud who confide in their own strength, so you never forsake those who make their boast of your mercy; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-19"
    name: "Proper 19"
    kind: "season"
    monthDay: "09-14"
    note: "The Sunday closest to September 14"
    rite1: "O God, forasmuch as without thee we are not able to please thee, mercifully grant that thy Holy Spirit may in all things direct and rule our hearts; through Jesus Christ our Lord, who with thee and the same Spirit liveth and reigneth, one God, now and for ever. Amen."
    rite2: "O God, because without you we are not able to please you, mercifully grant that your Holy Spirit may in all things direct and rule our hearts; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-20"
    name: "Proper 20"
    kind: "season"
    monthDay: "09-21"
    note: "The Sunday closest to September 21"
    rite1: "Grant us, O Lord, not to mind earthly things, but to love things heavenly; and even now, while we are placed among things that are passing away, to cleave to those that shall abide; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Grant us, Lord, not to be anxious about earthly things, but to love things heavenly; and even now, while we are placed among things that are passing away, to hold fast to those that shall endure; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-21"
    name: "Proper 21"
    kind: "season"
    monthDay: "09-28"
    note: "The Sunday closest to September 28"
    rite1: "O God, who declarest thy almighty power chiefly in showing mercy and pity: Mercifully grant unto us such a measure of thy grace, that we, running to obtain thy promises, may be made partakers of thy heavenly treasure; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, you declare your almighty power chiefly in showing mercy and pity: Grant us the fullness of your grace, that we, running to obtain your promises, may become partakers of your heavenly treasure; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-22"
    name: "Proper 22"
    kind: "season"
    monthDay: "10-05"
    note: "The Sunday closest to October 5"
    rite1: "Almighty and everlasting God, who art always more ready to hear than we to pray, and art wont to give more than either we desire or deserve: Pour down upon us the abundance of thy mercy, forgiving us those things whereof our conscience is afraid, and giving us those good things which we are not worthy to ask, but through the merits and mediation of Jesus Christ thy Son our Lord; who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty and everlasting God, you are always more ready to hear than we to pray, and to give more than we either desire or deserve: Pour upon us the abundance of your mercy, forgiving us those things of which our conscience is afraid, and giving us those good things for which we are not worthy to ask, except through the merits and mediation of Jesus Christ our Savior; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-23"
    name: "Proper 23"
    kind: "season"
    monthDay: "10-12"
    note: "The Sunday closest to October 12"
    rite1: "Lord, we pray thee that thy grace may always precede and follow us, and make us continually to be given to all good works; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Lord, we pray that your grace may always precede and follow us, that we may continually be given to good works; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-24"
    name: "Proper 24"
    kind: "season"
    monthDay: "10-19"
    note: "The Sunday closest to October 19"
    rite1: "Almighty and everlasting God, who in Christ hast revealed thy glory among the nations: Preserve the works of thy mercy, that thy Church throughout the world may persevere with steadfast faith in the confession of thy Name; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty and everlasting God, in Christ you have revealed your glory among the nations: Preserve the works of your mercy, that your Church throughout the world may persevere with steadfast faith in the confession of your Name; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-25"
    name: "Proper 25"
    kind: "season"
    monthDay: "10-26"
    note: "The Sunday closest to October 26"
    rite1: "Almighty and everlasting God, give unto us the increase of faith, hope, and charity; and, that we may obtain that which thou dost promise, make us to love that which thou dost command; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty and everlasting God, increase in us the gifts of faith, hope, and charity; and, that we may obtain what you promise, make us love what you command; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-26"
    name: "Proper 26"
    kind: "season"
    monthDay: "11-02"
    note: "The Sunday closest to November 2"
    rite1: "Almighty and merciful God, of whose only gift it cometh that thy faithful people do unto thee true and laudable service: Grant, we beseech thee, that we may run without stumbling to obtain thy heavenly promises; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty and merciful God, it is only by your gift that your faithful people offer you true and laudable service: Grant that we may run without stumbling to obtain your heavenly promises; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-27"
    name: "Proper 27"
    kind: "season"
    monthDay: "11-09"
    note: "The Sunday closest to November 9"
    rite1: "O God, whose blessed Son was manifested that he might destroy the works of the devil and make us the children of God and heirs of eternal life: Grant us, we beseech thee, that, having this hope, we may purify ourselves even as he is pure; that, when he shall appear again with power and great glory, we may be made like unto him in his eternal and glorious kingdom; where with thee, O Father, and thee, O Holy Ghost, he liveth and reigneth ever, one God, world without end. Amen."
    rite2: "O God, whose blessed Son came into the world that he might destroy the works of the devil and make us children of God and heirs of eternal life: Grant that, having this hope, we may purify ourselves as he is pure; that, when he comes again with power and great glory, we may be made like him in his eternal and glorious kingdom; where he lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-28"
    name: "Proper 28"
    kind: "season"
    monthDay: "11-16"
    note: "The Sunday closest to November 16"
    rite1: "Blessed Lord, who hast caused all holy Scriptures to be written for our learning: Grant that we may in such wise hear them, read, mark, learn, and inwardly digest them; that, by patience and comfort of thy holy Word, we may embrace and ever hold fast the blessed hope of everlasting life, which thou hast given us in our Savior Jesus Christ; who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Blessed Lord, who caused all holy Scriptures to be written for our learning: Grant us so to hear them, read, mark, learn, and inwardly digest them, that we may embrace and ever hold fast the blessed hope of everlasting life, which you have given us in our Savior Jesus Christ; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "proper-29"
    name: "Proper 29"
    kind: "season"
    monthDay: "11-23"
    note: "The Sunday closest to November 23"
    rite1: "Almighty and everlasting God, whose will it is to restore all things in thy well-beloved Son, the King of kings and Lord of lords: Mercifully grant that the peoples of the earth, divided and enslaved by sin, may be freed and brought together under his most gracious rule; who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty and everlasting God, whose will it is to restore all things in your well-beloved Son, the King of kings and Lord of lords: Mercifully grant that the peoples of the earth, divided and enslaved by sin, may be freed and brought together under his most gracious rule; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-andrew"
    name: "Saint Andrew"
    kind: "holy day"
    monthDay: "11-30"
    note: ""
    rite1: "Almighty God, who didst give such grace to thine apostle Andrew that he readily obeyed the call of thy Son Jesus Christ, and brought his brother with him: Give unto us, who are called by thy Word, grace to follow him without delay, and to bring those near to us into his gracious presence; who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty God, who gave such grace to your apostle Andrew that he readily obeyed the call of your Son Jesus Christ, and brought his brother with him: Give us, who are called by your holy Word, grace to follow him without delay, and to bring those near to us into his gracious presence; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-thomas"
    name: "Saint Thomas"
    kind: "holy day"
    monthDay: "12-21"
    note: ""
    rite1: "Everliving God, who didst strengthen thine apostle Thomas with firm and certain faith in thy Son's resurrection: Grant us so perfectly and without doubt to believe in Jesus Christ, our Lord and our God, that our faith may never be found wanting in thy sight; through him who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Everliving God, who strengthened your apostle Thomas with firm and certain faith in your Son's resurrection: Grant us so perfectly and without doubt to believe in Jesus Christ, our Lord and our God, that our faith may never be found wanting in your sight; through him who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-stephen"
    name: "Saint Stephen"
    kind: "holy day"
    monthDay: "12-26"
    note: ""
    rite1: "We give the thanks, O Lord of glory, for the example of the first martyr Stephen, who looked up to heaven and prayed for his persecutors to thy Son Jesus Christ, who standeth at thy right hand; where he liveth and reigneth with thee and the Holy Spirit, one God, in glory everlasting. Amen."
    rite2: "We give you thanks, O Lord of glory, for the example of the first martyr Stephen, who looked up to heaven and prayed for his persecutors to your Son Jesus Christ, who stands at your right hand; where he lives and reigns with you and the Holy Spirit, one God, in glory everlasting. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-john"
    name: "Saint John"
    kind: "holy day"
    monthDay: "12-27"
    note: ""
    rite1: "Shed upon thy Church, we beseech thee, O Lord, the brightness of thy light; that we, being illumined by the teaching of thine apostle and evangelist John, may so walk in the light of thy truth, that at length we may attain to the fullness of life everlasting; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Shed upon your Church, O Lord, the brightness of your light, that we, being illumined by the teaching of your apostle and evangelist John, may so walk in the light of your truth, that at length we may attain to the fullness of eternal life; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "holy-innocents"
    name: "The Holy Innocents"
    kind: "holy day"
    monthDay: "12-28"
    note: ""
    rite1: "We remember today, O God, the slaughter of the holy innocents of Bethlehem by the order of King Herod. Receive, we beseech thee, into the arms of thy mercy all innocent victims; and by thy great might frustrate the designs of evil tyrants and establish thy rule of justice, love, and peace; through Jesus Christ our Lord, who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "We remember today, O God, the slaughter of the holy innocents of Bethlehem by King Herod. Receive, we pray, into the arms of your mercy all innocent victims; and by your great might frustrate the designs of evil tyrants and establish your rule of justice, love, and peace; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "confession-of-saint-peter"
    name: "Confession of Saint Peter"
    kind: "holy day"
    monthDay: "01-18"
    note: ""
    rite1: "Almighty Father, who didst inspire Simon Peter, first among the apostles, to confess Jesus as Messiah and Son of the living God: Keep thy Church steadfast upon the rock of this faith, that in unity and peace we may proclaim the one truth and follow the one Lord, our Savior Jesus Christ; who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty Father, who inspired Saint Peter, first among the apostles, to confess Jesus as Messiah and Son of the living God: Keep your Church steadfast upon the rock of this faith, so that in unity and peace we may proclaim the one truth and follow the one Lord, our Savior Jesus Christ; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "conversion-of-saint-paul"
    name: "Conversion of Saint Paul"
    kind: "holy day"
    monthDay: "01-25"
    note: ""
    rite1: "O God, who, by the preaching of thine apostle Paul, hast caused the light of the Gospel to shine throughout the world: Grant, we beseech thee, that we, having his wonderful conversion in remembrance, may show forth our thankfulness unto thee for the same by following the holy doctrine which he taught; through Jesus Christ our Lord, who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "O God, by the preaching of your apostle Paul you have caused the light of the Gospel to shine throughout the world: Grant, we pray, that we, having his wonderful conversion in remembrance, may show ourselves thankful to you by following his holy teaching; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "presentation"
    name: "The Presentation"
    kind: "holy day"
    monthDay: "02-02"
    note: ""
    rite1: "Almighty and everliving God, we humbly beseech thee that, as thy only-begotten Son was this day presented in the temple, so we may be presented unto thee with pure and clean hearts by the same thy Son Jesus Christ our Lord; who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty and everliving God, we humbly pray that, as your only-begotten Son was this day presented in the temple, so we may be presented to you with pure and clean hearts by Jesus Christ our Lord; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-matthias"
    name: "Saint Matthias"
    kind: "holy day"
    monthDay: "02-24"
    note: ""
    rite1: "O Almighty God, who into the place of Judas didst choose thy faithful servant Matthias to be of the number of the Twelve: Grant that thy Church, being delivered from false apostles, may always be ordered and guided by faithful and true pastors; through Jesus Christ our Lord, who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty God, who in the place of Judas chose your faithful servant Matthias to be numbered among the Twelve: Grant that your Church, being delivered from false apostles, may always be guided and governed by faithful and true pastors; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-joseph"
    name: "Saint Joseph"
    kind: "holy day"
    monthDay: "03-19"
    note: ""
    rite1: "O God, who from the family of thy servant David didst raise up Joseph to be the guardian of thy incarnate Son and the spouse of his virgin mother: Give us grace to imitate his uprightness of life and his obedience to thy commands; through the same thy Son Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, who from the family of your servant David raised up Joseph to be the guardian of your incarnate Son and the spouse of his virgin mother: Give us grace to imitate his uprightness of life and his obedience to your commands; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "annunciation"
    name: "The Annunciation"
    kind: "holy day"
    monthDay: "03-25"
    note: ""
    rite1: "We beseech thee, O Lord, pour thy grace into our hearts, that we who have known the incarnation of thy Son Jesus Christ, announced by an angel to the Virgin Mary, may by his cross and passion be brought unto the glory of his resurrection; who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Pour your grace into our hearts, O Lord, that we who have known the incarnation of your Son Jesus Christ, announced by an angel to the Virgin Mary, may by his cross and passion be brought to the glory of his resurrection; who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-mark"
    name: "Saint Mark"
    kind: "holy day"
    monthDay: "04-25"
    note: ""
    rite1: "Almighty God, who by the hand of Mark the evangelist hast given to thy Church the Gospel of Jesus Christ the Son of God: We thank thee for this witness, and pray that we may be firmly grounded in its truth; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty God, by the hand of Mark the evangelist you have given to your Church the Gospel of Jesus Christ the Son of God: We thank you for this witness, and pray that we may be firmly grounded in its truth; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-philip-and-saint-james"
    name: "Saint Philip and Saint James"
    kind: "holy day"
    monthDay: "05-01"
    note: ""
    rite1: "Almighty God, who didst give to thine apostles Philip and James grace and strength to bear witness to the truth: Grant that we, being mindful of their victory of faith, may glorify in life and death the Name of our Lord Jesus Christ; who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty God, who gave to your apostles Philip and James grace and strength to bear witness to the truth: Grant that we, being mindful of their victory of faith, may glorify in life and death the Name of our Lord Jesus Christ; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "visitation"
    name: "The Visitation"
    kind: "holy day"
    monthDay: "05-31"
    note: ""
    rite1: "Father in heaven, by whose grace the virgin mother of thy incarnate Son was blessed in bearing him, but still more blessed in keeping thy word: Grant us who honor the exaltation of her lowliness to follow the example of her devotion to thy will; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Father in heaven, by your grace the virgin mother of your incarnate Son was blessed in bearing him, but still more blessed in keeping your word: Grant us who honor the exaltation of her lowliness to follow the example of her devotion to your will; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-barnabas"
    name: "Saint Barnabas"
    kind: "holy day"
    monthDay: "06-11"
    note: ""
    rite1: "Grant, O God, that we may follow the example of thy faithful servant Barnabas, who, seeking not his own renown but the well-being of thy Church, gave generously of his life and substance for the relief of the poor and the spread of the Gospel; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Grant, O God, that we may follow the example of your faithful servant Barnabas, who, seeking not his own renown but the well-being of your Church, gave generously of his life and substance for the relief of the poor and the spread of the Gospel; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "nativity-of-saint-john-the-baptist"
    name: "The Nativity of Saint John the Baptist"
    kind: "holy day"
    monthDay: "06-24"
    note: ""
    rite1: "Almighty God, by whose providence thy servant John the Baptist was wonderfully born, and sent to prepare the way of thy Son our Savior by preaching repentance: Make us so to follow his doctrine and holy life, that we may truly repent according to his preaching; and after his example constantly speak the truth, boldly rebuke vice, and patiently suffer for the truth's sake; through the same thy Son Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty God, by whose providence your servant John the Baptist was wonderfully born, and sent to prepare the way of your Son our Savior by preaching repentance: Make us so to follow his teaching and holy life, that we may truly repent according to his preaching; and, following his example, constantly speak the truth, boldly rebuke vice, and patiently suffer for the truth's sake; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-peter-and-saint-paul"
    name: "Saint Peter and Saint Paul"
    kind: "holy day"
    monthDay: "06-29"
    note: ""
    rite1: "Almighty God, whose blessed apostles Peter and Paul glorified thee by their martyrdom: Grant that thy Church, instructed by their teaching and example, and knit together in unity by thy Spirit, may ever stand firm upon the one foundation, which is Jesus Christ our Lord; who liveth and reigneth with thee, in the unity of the same Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty God, whose blessed apostles Peter and Paul glorified you by their martyrdom: Grant that your Church, instructed by their teaching and example, and knit together in unity by your Spirit, may ever stand firm upon the one foundation, which is Jesus Christ our Lord; who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "independence-day"
    name: "Independence Day"
    kind: "holy day"
    monthDay: "07-04"
    note: ""
    rite1: "Lord God Almighty, in whose Name the founders of this country won liberty for themselves and for us, and lit the torch of freedom for nations then unborn: Grant, we beseech thee, that we and all the people of this land may have grace to maintain these liberties in righteousness and peace; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Lord God Almighty, in whose Name the founders of this country won liberty for themselves and for us, and lit the torch of freedom for nations then unborn: Grant that we and all the people of this land may have grace to maintain our liberties in righteousness and peace; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-mary-magdalene"
    name: "Saint Mary Magdalene"
    kind: "holy day"
    monthDay: "07-22"
    note: ""
    rite1: "Almighty God, whose blessed Son restored Mary Magdalene to health of body and mind, and called her to be a witness of his resurrection: Mercifully grant that by thy grace we may be healed of all our infirmities and know thee in the power of his endless life; who with thee and the Holy Spirit liveth and reigneth, one God, now and for ever. Amen."
    rite2: "Almighty God, whose blessed Son restored Mary Magdalene to health of body and of mind, and called her to be a witness of his resurrection: Mercifully grant that by your grace we may be healed from all our infirmities and know you in the power of his unending life; who with you and the Holy Spirit lives and reigns, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-james"
    name: "Saint James"
    kind: "holy day"
    monthDay: "07-25"
    note: ""
    rite1: "O gracious God, we remember before thee this day thy servant and apostle James, first among the Twelve to suffer martyrdom for the Name of Jesus Christ; and we pray that thou wilt pour out upon the leaders of thy Church that spirit of self-denying service by which alone they may have true authority among thy people; through the same Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "O gracious God, we remember before you today your servant and apostle James, first among the Twelve to suffer martyrdom for the Name of Jesus Christ; and we pray that you will pour out upon the leaders of your Church that spirit of self-denying service by which alone they may have true authority among your people; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "transfiguration"
    name: "The Transfiguration"
    kind: "holy day"
    monthDay: "08-06"
    note: ""
    rite1: "O God, who on the holy mount didst reveal to chosen witnesses thy well-beloved Son, wonderfully transfigured, in raiment white and glistening: Mercifully grant that we, being delivered from the disquietude of this world, may by faith behold the King in his beauty; who with thee, O Father, and thee, O Holy Ghost, liveth and reigneth, one God, world without end. Amen."
    rite2: "O God, who on the holy mount revealed to chosen witnesses your well-beloved Son, wonderfully transfigured, in raiment white and glistening: Mercifully grant that we, being delivered from the disquietude of this world, may by faith behold the King in his beauty; who with you, O Father, and you, O Holy Spirit, lives and reigns, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-mary-the-virgin"
    name: "Saint Mary the Virgin"
    kind: "holy day"
    monthDay: "08-15"
    note: ""
    rite1: "O God, who hast taken to thyself the blessed Virgin Mary, mother of thy incarnate Son: Grant that we, who have been redeemed by his blood, may share with her the glory of thine eternal kingdom; through the same thy Son Jesus Christ our Lord, who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "O God, you have taken to yourself the blessed Virgin Mary, mother of your incarnate Son: Grant that we, who have been redeemed by his blood, may share with her the glory of your eternal kingdom; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-bartholomew"
    name: "Saint Bartholomew"
    kind: "holy day"
    monthDay: "08-24"
    note: ""
    rite1: "O Almighty and everlasting God, who didst give to thine apostle Bartholomew grace truly to believe and to preach thy Word: Grant, we beseech thee, unto thy Church to love what he believed and to preach what he taught; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Almighty and everlasting God, who gave to your apostle Bartholomew grace truly to believe and to preach your Word: Grant that your Church may love what he believed and preach what he taught; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "holy-cross-day"
    name: "Holy Cross Day"
    kind: "holy day"
    monthDay: "09-14"
    note: ""
    rite1: "Almighty God, whose Son our Savior Jesus Christ was lifted high upon the cross that he might draw the whole world unto himself: Mercifully grant that we, who glory in the mystery of our redemption, may have grace to take up our cross and follow him; who liveth and reigneth with thee and the Holy Spirit, one God, in glory everlasting. Amen."
    rite2: "Almighty God, whose Son our Savior Jesus Christ was lifted high upon the cross that he might draw the whole world to himself: Mercifully grant that we, who glory in the mystery of our redemption, may have grace to take up our cross and follow him; who lives and reigns with you and the Holy Spirit, one God, in glory everlasting. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-matthew"
    name: "Saint Matthew"
    kind: "holy day"
    monthDay: "09-21"
    note: ""
    rite1: "We thank thee, heavenly Father, for the witness of thine apostle and evangelist Matthew to the Gospel of thy Son our Savior; and we pray that, after his example, we may with ready wills and hearts obey the calling of our Lord to follow him; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "We thank you, heavenly Father, for the witness of your apostle and evangelist Matthew to the Gospel of your Son our Savior; and we pray that, after his example, we may with ready wills and hearts obey the calling of our Lord to follow him; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-michael-and-all-angels"
    name: "Saint Michael and All Angels"
    kind: "holy day"
    monthDay: "09-29"
    note: ""
    rite1: "O everlasting God, who hast ordained and constituted the ministries of angels and men in a wonderful order: Mercifully grant that, as thy holy angels always serve and worship thee in heaven, so by thy appointment they may help and defend us on earth; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "Everlasting God, you have ordained and constituted in a wonderful order the ministries of angels and mortals: Mercifully grant that, as your holy angels always serve and worship you in heaven, so by your appointment they may help and defend us here on earth; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-luke"
    name: "Saint Luke"
    kind: "holy day"
    monthDay: "10-18"
    note: ""
    rite1: "Almighty God, who didst inspire thy servant Luke the physician to set forth in the Gospel the love and healing power of thy Son: Graciously continue in thy Church the like love and power to heal, to the praise and glory of thy Name; through the same thy Son Jesus Christ our Lord, who liveth and reigneth with thee, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty God, who inspired your servant Luke the physician to set forth in the Gospel the love and healing power of your Son: Graciously continue in your Church this love and power to heal, to the praise and glory of your Name; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-james-of-jerusalem"
    name: "Saint James of Jerusalem"
    kind: "holy day"
    monthDay: "10-23"
    note: ""
    rite1: "Grant, we beseech thee, O God, that after the example of thy servant James the Just, brother of our Lord, thy Church may give itself continually to prayer and to the reconciliation of all who are at variance and enmity; through the same our Lord Jesus Christ, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Grant, O God, that, following the example of your servant James the Just, brother of our Lord, your Church may give itself continually to prayer and to the reconciliation of all who are at variance and enmity; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "saint-simon-and-saint-jude"
    name: "Saint Simon and Saint Jude"
    kind: "holy day"
    monthDay: "10-28"
    note: ""
    rite1: "O God, we thank thee for the glorious company of the apostles, and especially on this day for Simon and Jude; and we pray that, as they were faithful and zealous in their mission, so we may with ardent devotion make known the love and mercy of our Lord and Savior Jesus Christ; who liveth and reigneth with thee and the Holy Spirit, one God, for ever and ever. Amen."
    rite2: "O God, we thank you for the glorious company of the apostles, and especially on this day for Simon and Jude; and we pray that, as they were faithful and zealous in their mission, so we may with ardent devotion make known the love and mercy of our Lord and Savior Jesus Christ; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "all-saints-day"
    name: "All Saints' Day"
    kind: "holy day"
    monthDay: "11-01"
    note: ""
    rite1: "O Almighty God, who hast knit together thine elect in one communion and fellowship in the mystical body of thy Son Christ our Lord: Grant us grace so to follow thy blessed saints in all virtuous and godly living, that we may come to those ineffable joys which thou hast prepared for those who unfeignedly love thee; through the same Jesus Christ our Lord, who with thee and the Holy Spirit liveth and reigneth, one God, in glory everlasting. Amen."
    rite2: "Almighty God, you have knit together your elect in one communion and fellowship in the mystical body of your Son Christ our Lord: Give us grace so to follow your blessed saints in all virtuous and godly living, that we may come to those ineffable joys that you have prepared for those who truly love you; through Jesus Christ our Lord, who with you and the Holy Spirit lives and reigns, one God, in glory everlasting. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
- type: "Collect"
  data:
    key: "thanksgiving-day"
    name: "Thanksgiving Day"
    kind: "holy day"
    monthDay: ""
    note: ""
    rite1: "Almighty and gracious Father, we give thee thanks for the fruits of the earth in their season and for the labors of those who harvest them. Make us, we beseech thee, faithful stewards of thy great bounty, for the provision of our necessities and the relief of all who are in need, to the glory of thy Name; through Jesus Christ our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and for ever. Amen."
    rite2: "Almighty and gracious Father, we give you thanks for the fruits of the earth in their season and for the labors of those who harvest them. Make us, we pray, faithful stewards of your great bounty, for the provision of our necessities and the relief of all who are in need, to the glory of your Name; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."
    rite1Alternatives: []
    rite2Alternatives: []
