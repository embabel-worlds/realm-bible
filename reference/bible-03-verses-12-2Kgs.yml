    apiRef: 2Kings7:9
    book: 2Kgs
    chapter: 7
    verse: 9
    text: 'Then they said one to another, We do not well: this day is a day of good tidings, and we hold our peace: if we tarry till the morning light, some mischief will come upon us: now therefore come, that we may go and tell the king’s household.'
    web: Then they said to one another, “We aren’t doing right. Today is a day of good news, and we keep silent. If we wait until the morning light, punishment will overtake us. Now therefore come, let’s go and tell the king’s household.”
    event: Prophecies of Elisha
  relations:
