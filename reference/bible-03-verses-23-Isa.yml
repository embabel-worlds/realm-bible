  data:
    osis: Isa.56.3
    name: Isaiah 56:3
    apiRef: Isaiah56:3
    book: Isa
    chapter: 56
    verse: 3
    text: 'Neither let the son of the stranger, that hath joined himself to the LORD, speak, saying, The LORD hath utterly separated me from his people: neither let the eunuch say, Behold, I am a dry tree.'
    web: Let no foreigner who has joined himself to the LORD speak, saying, “The LORD will surely separate me from his people.” Do not let the eunuch say, “Behold, I am a dry tree.”
    people:
