    name: Isaiah 21:7
    apiRef: Isaiah21:7
    book: Isa
    chapter: 21
    verse: 7
    text: 'And he saw a chariot with a couple of horsemen, a chariot of asses, and a chariot of camels; and he hearkened diligently with much heed:'
    web: When he sees a troop, horsemen in pairs, a troop of donkeys, a troop of camels, he shall listen diligently with great attentiveness.”
    event: Prophecies of Isaiah
  relations:
