  data:
    osis: Isa.11.9
    name: Isaiah 11:9
    apiRef: Isaiah11:9
    book: Isa
    chapter: 11
    verse: 9
    text: 'They shall not hurt nor destroy in all my holy mountain: for the earth shall be full of the knowledge of the LORD, as the waters cover the sea.'
    web: They will not hurt nor destroy in all my holy mountain; for the earth will be full of the knowledge of the LORD, as the waters cover the sea.
