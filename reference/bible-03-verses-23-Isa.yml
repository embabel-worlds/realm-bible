  data:
    osis: Isa.19.15
    name: Isaiah 19:15
    apiRef: Isaiah19:15
    book: Isa
    chapter: 19
    verse: 15
    text: Neither shall there be any work for Egypt, which the head or tail, branch or rush, may do.
    web: Neither shall there be any work for Egypt, which head or tail, palm branch or rush, may do.
    event: Prophecies of Isaiah
