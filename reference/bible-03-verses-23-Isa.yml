    name: Isaiah 30:11
    apiRef: Isaiah30:11
    book: Isa
    chapter: 30
    verse: 11
    text: Get you out of the way, turn aside out of the path, cause the Holy One of Israel to cease from before us.
    web: Get out of the way. Turn away from the path. Cause the Holy One of Israel to cease from before us.”
    people:
    - god_1324
