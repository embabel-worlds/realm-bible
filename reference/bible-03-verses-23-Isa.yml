    apiRef: Isaiah23:3
    book: Isa
    chapter: 23
    verse: 3
    text: And by great waters the seed of Sihor, the harvest of the river, is her revenue; and she is a mart of nations.
    web: On great waters, the seed of the Shihor, the harvest of the Nile, was her revenue. She was the market of nations.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
