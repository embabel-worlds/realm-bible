    name: Isaiah 63:14
    apiRef: Isaiah63:14
    book: Isa
    chapter: 63
    verse: 14
    text: 'As a beast goeth down into the valley, the Spirit of the LORD caused him to rest: so didst thou lead thy people, to make thyself a glorious name.'
    web: As the livestock that go down into the valley, the LORD’s Spirit caused them to rest. So you led your people to make yourself a glorious name.
