- type: Verse
  data:
    osis: Isa.43.19
    name: Isaiah 43:19
    apiRef: Isaiah43:19
    book: Isa
    chapter: 43
    verse: 19
    text: Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.
    web: Behold, I will do a new thing. It springs out now. Don’t you know it? I will even make a way in the wilderness, and rivers in the desert.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.43
- type: Verse
  data:
    osis: Isa.43.20
    name: Isaiah 43:20
    apiRef: Isaiah43:20
    book: Isa
    chapter: 43
    verse: 20
    text: 'The beast of the field shall honour me, the dragons and the owls: because I give waters in the wilderness, and rivers in the desert, to give drink to my people, my chosen.'
    web: The animals of the field, the jackals and the ostriches, shall honor me, because I give water in the wilderness and rivers in the desert, to give drink to my people, my chosen,
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.43
- type: Verse
  data:
    osis: Isa.43.21
    name: Isaiah 43:21
    apiRef: Isaiah43:21
    book: Isa
    chapter: 43
    verse: 21
    text: This people have I formed for myself; they shall shew forth my praise.
    web: the people which I formed for myself, that they might declare my praise.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.43
- type: Verse
  data:
    osis: Isa.43.22
    name: Isaiah 43:22
    apiRef: Isaiah43:22
    book: Isa
    chapter: 43
    verse: 22
    text: But thou hast not called upon me, O Jacob; but thou hast been weary of me, O Israel.
    web: Yet you have not called on me, Jacob; but you have been weary of me, Israel.
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.43
- type: Verse
  data:
    osis: Isa.43.23
    name: Isaiah 43:23
    apiRef: Isaiah43:23
    book: Isa
    chapter: 43
    verse: 23
    text: Thou hast not brought me the small cattle of thy burnt offerings; neither hast thou honoured me with thy sacrifices. I have not caused thee to serve with an offering, nor wearied thee with incense.
    web: You have not brought me any of your sheep for burnt offerings, neither have you honored me with your sacrifices. I have not burdened you with offerings, nor wearied you with frankincense.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.43
- type: Verse
  data:
    osis: Isa.43.24
    name: Isaiah 43:24
    apiRef: Isaiah43:24
    book: Isa
    chapter: 43
    verse: 24
    text: 'Thou hast bought me no sweet cane with money, neither hast thou filled me with the fat of thy sacrifices: but thou hast made me to serve with thy sins, thou hast wearied me with thine iniquities.'
    web: You have bought me no sweet cane with money, nor have you filled me with the fat of your sacrifices, but you have burdened me with your sins. You have wearied me with your iniquities.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.43
- type: Verse
  data:
    osis: Isa.43.25
    name: Isaiah 43:25
    apiRef: Isaiah43:25
    book: Isa
    chapter: 43
    verse: 25
    text: I, even I, am he that blotteth out thy transgressions for mine own sake, and will not remember thy sins.
    web: I, even I, am he who blots out your transgressions for my own sake; and I will not remember your sins.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.43
- type: Verse
  data:
    osis: Isa.43.26
    name: Isaiah 43:26
    apiRef: Isaiah43:26
    book: Isa
    chapter: 43
    verse: 26
    text: 'Put me in remembrance: let us plead together: declare thou, that thou mayest be justified.'
    web: Put me in remembrance. Let us plead together. Declare your case, that you may be justified.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.43
- type: Verse
  data:
    osis: Isa.43.27
    name: Isaiah 43:27
    apiRef: Isaiah43:27
    book: Isa
    chapter: 43
    verse: 27
    text: Thy first father hath sinned, and thy teachers have transgressed against me.
    web: Your first father sinned, and your teachers have transgressed against me.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.43
- type: Verse
  data:
    osis: Isa.43.28
    name: Isaiah 43:28
    apiRef: Isaiah43:28
    book: Isa
    chapter: 43
    verse: 28
    text: Therefore I have profaned the princes of the sanctuary, and have given Jacob to the curse, and Israel to reproaches.
    web: Therefore I will profane the princes of the sanctuary; and I will make Jacob a curse, and Israel an insult.”
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
