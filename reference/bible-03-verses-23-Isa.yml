  data:
    osis: Isa.56.9
    name: Isaiah 56:9
    apiRef: Isaiah56:9
    book: Isa
    chapter: 56
    verse: 9
    text: All ye beasts of the field, come to devour, yea, all ye beasts in the forest.
    web: All you animals of the field, come to devour, all you animals in the forest.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.56
- type: Verse
  data:
    osis: Isa.56.10
    name: Isaiah 56:10
    apiRef: Isaiah56:10
    book: Isa
    chapter: 56
    verse: 10
    text: 'His watchmen are blind: they are all ignorant, they are all dumb dogs, they cannot bark; sleeping, lying down, loving to slumber.'
    web: His watchmen are blind. They are all without knowledge. They are all mute dogs. They can’t bark— dreaming, lying down, loving to slumber.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.56
- type: Verse
  data:
    osis: Isa.56.11
    name: Isaiah 56:11
    apiRef: Isaiah56:11
    book: Isa
    chapter: 56
    verse: 11
    text: 'Yea, they are greedy dogs which can never have enough, and they are shepherds that cannot understand: they all look to their own way, every one for his gain, from his quarter.'
    web: Yes, the dogs are greedy. They can never have enough. They are shepherds who can’t understand. They have all turned to their own way, each one to his gain, from every quarter.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.56
- type: Verse
  data:
    osis: Isa.56.12
    name: Isaiah 56:12
    apiRef: Isaiah56:12
    book: Isa
    chapter: 56
    verse: 12
    text: Come ye, say they, I will fetch wine, and we will fill ourselves with strong drink; and to morrow shall be as this day, and much more abundant.
    web: “Come,” they say, “I will get wine, and we will fill ourselves with strong drink; and tomorrow will be as today, great beyond measure.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.56
- type: Verse
  data:
    osis: Isa.57.1
    name: Isaiah 57:1
    apiRef: Isaiah57:1
    book: Isa
    chapter: 57
    verse: 1
    text: 'The righteous perisheth, and no man layeth it to heart: and merciful men are taken away, none considering that the righteous is taken away from the evil to come.'
    web: The righteous perish, and no one lays it to heart. Merciful men are taken away, and no one considers that the righteous is taken away from the evil.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.2
    name: Isaiah 57:2
    apiRef: Isaiah57:2
    book: Isa
    chapter: 57
    verse: 2
    text: 'He shall enter into peace: they shall rest in their beds, each one walking in his uprightness.'
    web: He enters into peace. They rest in their beds, each one who walks in his uprightness.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.3
    name: Isaiah 57:3
    apiRef: Isaiah57:3
    book: Isa
    chapter: 57
    verse: 3
    text: But draw near hither, ye sons of the sorceress, the seed of the adulterer and the whore.
    web: “But draw near here, you sons of a sorceress, you offspring of adulterers and prostitutes.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.4
    name: Isaiah 57:4
    apiRef: Isaiah57:4
    book: Isa
    chapter: 57
    verse: 4
    text: Against whom do ye sport yourselves? against whom make ye a wide mouth, and draw out the tongue? are ye not children of transgression, a seed of falsehood,
    web: Whom do you mock? Against whom do you make a wide mouth and stick out your tongue? Aren’t you children of disobedience and offspring of falsehood,
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.5
    name: Isaiah 57:5
    apiRef: Isaiah57:5
    book: Isa
    chapter: 57
    verse: 5
    text: Enflaming yourselves with idols under every green tree, slaying the children in the valleys under the clifts of the rocks?
    web: you who inflame yourselves among the oaks, under every green tree; who kill the children in the valleys, under the clefts of the rocks?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.6
    name: Isaiah 57:6
    apiRef: Isaiah57:6
    book: Isa
    chapter: 57
    verse: 6
    text: 'Among the smooth stones of the stream is thy portion; they, they are thy lot: even to them hast thou poured a drink offering, thou hast offered a meat offering. Should I receive comfort in these?'
    web: Among the smooth stones of the valley is your portion. They, they are your lot. You have even poured a drink offering to them. You have offered an offering. Shall I be appeased for these things?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.7
    name: Isaiah 57:7
    apiRef: Isaiah57:7
    book: Isa
    chapter: 57
    verse: 7
    text: 'Upon a lofty and high mountain hast thou set thy bed: even thither wentest thou up to offer sacrifice.'
    web: On a high and lofty mountain you have set your bed. You also went up there to offer sacrifice.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.8
    name: Isaiah 57:8
    apiRef: Isaiah57:8
    book: Isa
    chapter: 57
    verse: 8
    text: 'Behind the doors also and the posts hast thou set up thy remembrance: for thou hast discovered thyself to another than me, and art gone up; thou hast enlarged thy bed, and made thee a covenant with them; thou lovedst their bed where thou sawest it.'
    web: You have set up your memorial behind the doors and the posts, for you have exposed yourself to someone besides me, and have gone up. You have enlarged your bed and made a covenant for yourself with them. You loved what you saw on their bed.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.9
    name: Isaiah 57:9
    apiRef: Isaiah57:9
    book: Isa
    chapter: 57
    verse: 9
    text: And thou wentest to the king with ointment, and didst increase thy perfumes, and didst send thy messengers far off, and didst debase thyself even unto hell.
    web: You went to the king with oil, increased your perfumes, sent your ambassadors far off, and degraded yourself even to Sheol.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.10
    name: Isaiah 57:10
    apiRef: Isaiah57:10
    book: Isa
    chapter: 57
    verse: 10
    text: 'Thou art wearied in the greatness of thy way; yet saidst thou not, There is no hope: thou hast found the life of thine hand; therefore thou wast not grieved.'
    web: You were wearied with the length of your ways; yet you didn’t say, ‘It is in vain.’ You found a reviving of your strength; therefore you weren’t faint.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.11
    name: Isaiah 57:11
    apiRef: Isaiah57:11
    book: Isa
    chapter: 57
    verse: 11
    text: And of whom hast thou been afraid or feared, that thou hast lied, and hast not remembered me, nor laid it to thy heart? have not I held my peace even of old, and thou fearest me not?
    web: “Whom have you dreaded and feared, so that you lie, and have not remembered me, nor laid it to your heart? Haven’t I held my peace for a long time, and you don’t fear me?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.12
    name: Isaiah 57:12
    apiRef: Isaiah57:12
