    apiRef: Isaiah55:8
    book: Isa
    chapter: 55
    verse: 8
    text: For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD.
    web: “For my thoughts are not your thoughts, and your ways are not my ways,” says the LORD.
    people:
    - god_1324
