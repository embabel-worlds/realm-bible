    osis: Isa.23.11
    name: Isaiah 23:11
    apiRef: Isaiah23:11
    book: Isa
    chapter: 23
    verse: 11
    text: 'He stretched out his hand over the sea, he shook the kingdoms: the LORD hath given a commandment against the merchant city, to destroy the strong holds thereof.'
    web: He has stretched out his hand over the sea. He has shaken the kingdoms. The LORD has ordered the destruction of Canaan’s strongholds.
    people:
    - god_1324
