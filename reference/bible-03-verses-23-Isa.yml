    name: Isaiah 23:5
    apiRef: Isaiah23:5
    book: Isa
    chapter: 23
    verse: 5
    text: As at the report concerning Egypt, so shall they be sorely pained at the report of Tyre.
    web: When the report comes to Egypt, they will be in anguish at the report of Tyre.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
