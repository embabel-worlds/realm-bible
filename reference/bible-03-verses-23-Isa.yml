    name: Isaiah 56:1
    apiRef: Isaiah56:1
    book: Isa
    chapter: 56
    verse: 1
    text: 'Thus saith the LORD, Keep ye judgment, and do justice: for my salvation is near to come, and my righteousness to be revealed.'
    web: 'The LORD says: “Maintain justice and do what is right, for my salvation is near and my righteousness will soon be revealed.'
    people:
    - god_1324
