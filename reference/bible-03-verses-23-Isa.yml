  data:
    osis: Isa.63.15
    name: Isaiah 63:15
    apiRef: Isaiah63:15
    book: Isa
    chapter: 63
    verse: 15
    text: 'Look down from heaven, and behold from the habitation of thy holiness and of thy glory: where is thy zeal and thy strength, the sounding of thy bowels and of thy mercies toward me? are they restrained?'
    web: Look down from heaven, and see from the habitation of your holiness and of your glory. Where are your zeal and your mighty acts? The yearning of your heart and your compassion is restrained toward me.
    event: Prophecies of Isaiah
  relations:
