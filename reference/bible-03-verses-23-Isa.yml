  data:
    osis: Isa.19.10
    name: Isaiah 19:10
    apiRef: Isaiah19:10
    book: Isa
    chapter: 19
    verse: 10
    text: And they shall be broken in the purposes thereof, all that make sluices and ponds for fish.
    web: The pillars will be broken in pieces. All those who work for hire will be grieved in soul.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
- type: Verse
  data:
    osis: Isa.19.11
    name: Isaiah 19:11
    apiRef: Isaiah19:11
    book: Isa
    chapter: 19
    verse: 11
    text: 'Surely the princes of Zoan are fools, the counsel of the wise counsellors of Pharaoh is become brutish: how say ye unto Pharaoh, I am the son of the wise, the son of ancient kings?'
    web: The princes of Zoan are utterly foolish. The counsel of the wisest counselors of Pharaoh has become stupid. How do you say to Pharaoh, “I am the son of the wise, the son of ancient kings”?
    people:
    - pharaoh_2333
