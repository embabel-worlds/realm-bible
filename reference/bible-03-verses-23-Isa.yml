    apiRef: Isaiah22:11
    book: Isa
    chapter: 22
    verse: 11
    text: 'Ye made also a ditch between the two walls for the water of the old pool: but ye have not looked unto the maker thereof, neither had respect unto him that fashioned it long ago.'
    web: You also made a reservoir between the two walls for the water of the old pool. But you didn’t look to him who had done this, neither did you have respect for him who planned it long ago.
