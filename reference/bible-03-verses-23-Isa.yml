    name: Isaiah 11:2
    apiRef: Isaiah11:2
    book: Isa
    chapter: 11
    verse: 2
    text: And the spirit of the LORD shall rest upon him, the spirit of wisdom and understanding, the spirit of counsel and might, the spirit of knowledge and of the fear of the LORD;
    web: 'The LORD’s Spirit will rest on him: the spirit of wisdom and understanding, the spirit of counsel and might, the spirit of knowledge and of the fear of the LORD.'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.11
- type: Verse
  data:
    osis: Isa.11.3
    name: Isaiah 11:3
    apiRef: Isaiah11:3
    book: Isa
    chapter: 11
    verse: 3
    text: 'And shall make him of quick understanding in the fear of the LORD: and he shall not judge after the sight of his eyes, neither reprove after the hearing of his ears:'
    web: His delight will be in the fear of the LORD. He will not judge by the sight of his eyes, neither decide by the hearing of his ears;
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.11
- type: Verse
  data:
    osis: Isa.11.4
    name: Isaiah 11:4
    apiRef: Isaiah11:4
    book: Isa
    chapter: 11
    verse: 4
    text: 'But with righteousness shall he judge the poor, and reprove with equity for the meek of the earth: and he shall smite the earth with the rod of his mouth, and with the breath of his lips shall he slay the wicked.'
    web: but he will judge the poor with righteousness, and decide with equity for the humble of the earth. He will strike the earth with the rod of his mouth; and with the breath of his lips he will kill the wicked.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.11
