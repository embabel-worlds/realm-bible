  data:
    osis: Isa.55.10
    name: Isaiah 55:10
    apiRef: Isaiah55:10
    book: Isa
    chapter: 55
    verse: 10
    text: 'For as the rain cometh down, and the snow from heaven, and returneth not thither, but watereth the earth, and maketh it bring forth and bud, that it may give seed to the sower, and bread to the eater:'
    web: For as the rain comes down and the snow from the sky, and doesn’t return there, but waters the earth, and makes it grow and bud, and gives seed to the sower and bread to the eater;
    event: Prophecies of Isaiah
  relations:
