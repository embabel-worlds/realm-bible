    apiRef: Isaiah19:21
    book: Isa
    chapter: 19
    verse: 21
    text: And the LORD shall be known to Egypt, and the Egyptians shall know the LORD in that day, and shall do sacrifice and oblation; yea, they shall vow a vow unto the LORD, and perform it.
    web: The LORD will be known to Egypt, and the Egyptians will know the LORD in that day. Yes, they will worship with sacrifice and offering, and will vow a vow to the LORD, and will perform it.
    people:
