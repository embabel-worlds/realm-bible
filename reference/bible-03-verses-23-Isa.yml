    apiRef: Isaiah1:2
    book: Isa
    chapter: 1
    verse: 2
    text: 'Hear, O heavens, and give ear, O earth: for the LORD hath spoken, I have nourished and brought up children, and they have rebelled against me.'
    web: 'Hear, heavens, and listen, earth; for the LORD has spoken: “I have nourished and brought up children and they have rebelled against me.'
