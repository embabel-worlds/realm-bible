  data:
    osis: Isa.51.14
    name: Isaiah 51:14
    apiRef: Isaiah51:14
    book: Isa
    chapter: 51
    verse: 14
    text: The captive exile hasteneth that he may be loosed, and that he should not die in the pit, nor that his bread should fail.
    web: The captive exile will speedily be freed. He will not die and go down into the pit. His bread won’t fail.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
