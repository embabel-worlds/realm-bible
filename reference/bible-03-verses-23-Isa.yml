    name: Isaiah 22:3
    apiRef: Isaiah22:3
    book: Isa
    chapter: 22
    verse: 3
    text: 'All thy rulers are fled together, they are bound by the archers: all that are found in thee are bound together, which have fled from far.'
    web: All your rulers fled away together. They were bound by the archers. All who were found by you were bound together. They fled far away.
    event: Prophecies of Isaiah
  relations:
