    apiRef: Isaiah1:14
    book: Isa
    chapter: 1
    verse: 14
    text: 'Your new moons and your appointed feasts my soul hateth: they are a trouble unto me; I am weary to bear them.'
    web: My soul hates your New Moons and your appointed feasts. They are a burden to me. I am weary of bearing them.
