    name: Isaiah 50:8
    apiRef: Isaiah50:8
    book: Isa
    chapter: 50
    verse: 8
    text: 'He is near that justifieth me; who will contend with me? let us stand together: who is mine adversary? let him come near to me.'
    web: He who justifies me is near. Who will bring charges against me? Let us stand up together. Who is my adversary? Let him come near to me.
    event: Prophecies of Isaiah
