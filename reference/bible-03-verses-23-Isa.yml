    apiRef: Isaiah19:17
    book: Isa
    chapter: 19
    verse: 17
    text: And the land of Judah shall be a terror unto Egypt, every one that maketh mention thereof shall be afraid in himself, because of the counsel of the LORD of hosts, which he hath determined against it.
    web: The land of Judah will become a terror to Egypt. Everyone to whom mention is made of it will be afraid, because of the plans of the LORD of Armies, which he determines against it.
    people:
    - god_1324
