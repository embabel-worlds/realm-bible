    name: Isaiah 55:9
    apiRef: Isaiah55:9
    book: Isa
    chapter: 55
    verse: 9
    text: For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.
    web: “For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.
    event: Prophecies of Isaiah
  relations:
