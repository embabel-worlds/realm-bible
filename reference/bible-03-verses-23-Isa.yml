    name: Isaiah 19:12
    apiRef: Isaiah19:12
    book: Isa
    chapter: 19
    verse: 12
    text: Where are they? where are thy wise men? and let them tell thee now, and let them know what the LORD of hosts hath purposed upon Egypt.
    web: Where then are your wise men? Let them tell you now; and let them know what the LORD of Armies has purposed concerning Egypt.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
