  data:
    osis: Isa.10.32
    name: Isaiah 10:32
    apiRef: Isaiah10:32
    book: Isa
    chapter: 10
    verse: 32
    text: 'As yet shall he remain at Nob that day: he shall shake his hand against the mount of the daughter of Zion, the hill of Jerusalem.'
    web: This very day he will halt at Nob. He shakes his hand at the mountain of the daughter of Zion, the hill of Jerusalem.
    event: Prophecies of Isaiah
  relations:
