    apiRef: Isaiah55:7
    book: Isa
    chapter: 55
    verse: 7
    text: 'Let the wicked forsake his way, and the unrighteous man his thoughts: and let him return unto the LORD, and he will have mercy upon him; and to our God, for he will abundantly pardon.'
    web: Let the wicked forsake his way, and the unrighteous man his thoughts. Let him return to the LORD, and he will have mercy on him, to our God, for he will freely pardon.
    people:
