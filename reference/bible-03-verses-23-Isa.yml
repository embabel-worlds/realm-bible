  data:
    osis: Isa.13.5
    name: Isaiah 13:5
    apiRef: Isaiah13:5
    book: Isa
    chapter: 13
    verse: 5
    text: They come from a far country, from the end of heaven, even the LORD, and the weapons of his indignation, to destroy the whole land.
    web: They come from a far country, from the uttermost part of heaven, even the LORD, and the weapons of his indignation, to destroy the whole land.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.13
