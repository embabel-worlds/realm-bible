    to:
      type: Passage
      osis: Isa.11
- type: Verse
  data:
    osis: Isa.11.11
    name: Isaiah 11:11
    apiRef: Isaiah11:11
    book: Isa
    chapter: 11
    verse: 11
    text: And it shall come to pass in that day, that the Lord shall set his hand again the second time to recover the remnant of his people, which shall be left, from Assyria, and from Egypt, and from Pathros, and from Cush, and from Elam, and from Shinar, and from Hamath, and from the islands of the sea.
    web: It will happen in that day that the Lord will set his hand again the second time to recover the remnant that is left of his people from Assyria, from Egypt, from Pathros, from Cush, from Elam, from Shinar, from Hamath, and from the islands of the sea.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
