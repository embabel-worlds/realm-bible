  data:
    osis: Isa.51.12
    name: Isaiah 51:12
    apiRef: Isaiah51:12
    book: Isa
    chapter: 51
    verse: 12
    text: 'I, even I, am he that comforteth you: who art thou, that thou shouldest be afraid of a man that shall die, and of the son of man which shall be made as grass;'
    web: “I, even I, am he who comforts you. Who are you, that you are afraid of man who shall die, and of the son of man who will be made as grass?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
