    name: Isaiah 51:17
    apiRef: Isaiah51:17
    book: Isa
    chapter: 51
    verse: 17
    text: Awake, awake, stand up, O Jerusalem, which hast drunk at the hand of the LORD the cup of his fury; thou hast drunken the dregs of the cup of trembling, and wrung them out.
    web: Awake, awake! Stand up, Jerusalem, you who have drunk from the LORD’s hand the cup of his wrath. You have drunken the bowl of the cup of staggering, and drained it.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
