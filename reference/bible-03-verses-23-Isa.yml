    apiRef: Isaiah10:29
    book: Isa
    chapter: 10
    verse: 29
    text: 'They are gone over the passage: they have taken up their lodging at Geba; Ramah is afraid; Gibeah of Saul is fled.'
    web: They have gone over the pass. They have taken up their lodging at Geba. Ramah trembles. Gibeah of Saul has fled.
    event: Prophecies of Isaiah
  relations:
