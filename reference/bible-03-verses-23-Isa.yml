  data:
    osis: Isa.51.1
    name: Isaiah 51:1
    apiRef: Isaiah51:1
    book: Isa
    chapter: 51
    verse: 1
    text: 'Hearken to me, ye that follow after righteousness, ye that seek the LORD: look unto the rock whence ye are hewn, and to the hole of the pit whence ye are digged.'
    web: “Listen to me, you who follow after righteousness, you who seek the LORD. Look to the rock you were cut from, and to the quarry you were dug from.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
