  data:
    osis: Isa.56.5
    name: Isaiah 56:5
    apiRef: Isaiah56:5
    book: Isa
    chapter: 56
    verse: 5
    text: 'Even unto them will I give in mine house and within my walls a place and a name better than of sons and of daughters: I will give them an everlasting name, that shall not be cut off.'
    web: I will give them in my house and within my walls a memorial and a name better than of sons and of daughters. I will give them an everlasting name that will not be cut off.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.56
