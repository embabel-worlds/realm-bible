    chapter: 57
    verse: 12
    text: I will declare thy righteousness, and thy works; for they shall not profit thee.
    web: I will declare your righteousness; and as for your works, they will not benefit you.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.13
    name: Isaiah 57:13
    apiRef: Isaiah57:13
    book: Isa
    chapter: 57
    verse: 13
    text: 'When thou criest, let thy companies deliver thee; but the wind shall carry them all away; vanity shall take them: but he that putteth his trust in me shall possess the land, and shall inherit my holy mountain;'
    web: When you cry, let those whom you have gathered deliver you, but the wind will take them. A breath will carry them all away, but he who takes refuge in me will possess the land, and will inherit my holy mountain.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.14
    name: Isaiah 57:14
    apiRef: Isaiah57:14
    book: Isa
    chapter: 57
    verse: 14
    text: And shall say, Cast ye up, cast ye up, prepare the way, take up the stumblingblock out of the way of my people.
    web: He will say, “Build up, build up, prepare the way! Remove the stumbling-block out of the way of my people.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.15
    name: Isaiah 57:15
    apiRef: Isaiah57:15
    book: Isa
    chapter: 57
    verse: 15
    text: For thus saith the high and lofty One that inhabiteth eternity, whose name is Holy; I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite ones.
    web: 'For the high and lofty One who inhabits eternity, whose name is Holy, says: “I dwell in the high and holy place, with him also who is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite.'
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.16
    name: Isaiah 57:16
    apiRef: Isaiah57:16
    book: Isa
    chapter: 57
    verse: 16
    text: 'For I will not contend for ever, neither will I be always wroth: for the spirit should fail before me, and the souls which I have made.'
    web: For I will not contend forever, neither will I always be angry; for the spirit would faint before me, and the souls whom I have made.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.17
    name: Isaiah 57:17
    apiRef: Isaiah57:17
    book: Isa
    chapter: 57
    verse: 17
    text: 'For the iniquity of his covetousness was I wroth, and smote him: I hid me, and was wroth, and he went on frowardly in the way of his heart.'
    web: I was angry because of the iniquity of his covetousness and struck him. I hid myself and was angry; and he went on backsliding in the way of his heart.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.18
    name: Isaiah 57:18
    apiRef: Isaiah57:18
    book: Isa
    chapter: 57
    verse: 18
    text: 'I have seen his ways, and will heal him: I will lead him also, and restore comforts unto him and to his mourners.'
    web: I have seen his ways, and will heal him. I will lead him also, and restore comforts to him and to his mourners.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.19
    name: Isaiah 57:19
    apiRef: Isaiah57:19
    book: Isa
    chapter: 57
    verse: 19
    text: I create the fruit of the lips; Peace, peace to him that is far off, and to him that is near, saith the LORD; and I will heal him.
    web: 'I create the fruit of the lips: Peace, peace, to him who is far off and to him who is near,” says the LORD; “and I will heal them.”'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.20
    name: Isaiah 57:20
    apiRef: Isaiah57:20
    book: Isa
    chapter: 57
    verse: 20
    text: But the wicked are like the troubled sea, when it cannot rest, whose waters cast up mire and dirt.
    web: But the wicked are like the troubled sea; for it can’t rest and its waters cast up mire and mud.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.57.21
    name: Isaiah 57:21
    apiRef: Isaiah57:21
    book: Isa
    chapter: 57
    verse: 21
    text: There is no peace, saith my God, to the wicked.
    web: “There is no peace”, says my God, “for the wicked.”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.57
- type: Verse
  data:
    osis: Isa.58.1
    name: Isaiah 58:1
    apiRef: Isaiah58:1
    book: Isa
    chapter: 58
    verse: 1
    text: Cry aloud, spare not, lift up thy voice like a trumpet, and shew my people their transgression, and the house of Jacob their sins.
    web: “Cry aloud! Don’t spare! Lift up your voice like a trumpet! Declare to my people their disobedience, and to the house of Jacob their sins.
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.2
    name: Isaiah 58:2
    apiRef: Isaiah58:2
    book: Isa
    chapter: 58
    verse: 2
    text: 'Yet they seek me daily, and delight to know my ways, as a nation that did righteousness, and forsook not the ordinance of their God: they ask of me the ordinances of justice; they take delight in approaching to God.'
    web: Yet they seek me daily, and delight to know my ways. As a nation that did righteousness, and didn’t forsake the ordinance of their God, they ask of me righteous judgments. They delight to draw near to God.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.3
    name: Isaiah 58:3
    apiRef: Isaiah58:3
    book: Isa
    chapter: 58
    verse: 3
    text: Wherefore have we fasted, say they, and thou seest not? wherefore have we afflicted our soul, and thou takest no knowledge? Behold, in the day of your fast ye find pleasure, and exact all your labours.
    web: ‘Why have we fasted,’ they say, ‘and you don’t see? Why have we afflicted our soul, and you don’t notice?’ “Behold, in the day of your fast you find pleasure, and oppress all your laborers.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.4
    name: Isaiah 58:4
    apiRef: Isaiah58:4
    book: Isa
    chapter: 58
    verse: 4
    text: 'Behold, ye fast for strife and debate, and to smite with the fist of wickedness: ye shall not fast as ye do this day, to make your voice to be heard on high.'
    web: Behold, you fast for strife and contention, and to strike with the fist of wickedness. You don’t fast today so as to make your voice to be heard on high.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.5
    name: Isaiah 58:5
    apiRef: Isaiah58:5
    book: Isa
    chapter: 58
    verse: 5
    text: Is it such a fast that I have chosen? a day for a man to afflict his soul? is it to bow down his head as a bulrush, and to spread sackcloth and ashes under him? wilt thou call this a fast, and an acceptable day to the LORD?
    web: Is this the fast that I have chosen? A day for a man to humble his soul? Is it to bow down his head like a reed, and to spread sackcloth and ashes under himself? Will you call this a fast, and an acceptable day to the LORD?
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.6
    name: Isaiah 58:6
    apiRef: Isaiah58:6
    book: Isa
    chapter: 58
    verse: 6
    text: Is not this the fast that I have chosen? to loose the bands of wickedness, to undo the heavy burdens, and to let the oppressed go free, and that ye break every yoke?
    web: '“Isn’t this the fast that I have chosen: to release the bonds of wickedness, to undo the straps of the yoke, to let the oppressed go free, and that you break every yoke?'
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.7
    name: Isaiah 58:7
    apiRef: Isaiah58:7
    book: Isa
    chapter: 58
    verse: 7
    text: Is it not to deal thy bread to the hungry, and that thou bring the poor that are cast out to thy house? when thou seest the naked, that thou cover him; and that thou hide not thyself from thine own flesh?
    web: Isn’t it to distribute your bread to the hungry, and that you bring the poor who are cast out to your house? When you see the naked, that you cover him; and that you not hide yourself from your own flesh?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.8
    name: Isaiah 58:8
    apiRef: Isaiah58:8
    book: Isa
    chapter: 58
    verse: 8
    text: 'Then shall thy light break forth as the morning, and thine health shall spring forth speedily: and thy righteousness shall go before thee; the glory of the LORD shall be thy rereward.'
    web: Then your light will break out as the morning, and your healing will appear quickly; then your righteousness shall go before you, and the LORD’s glory will be your rear guard.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.9
    name: Isaiah 58:9
    apiRef: Isaiah58:9
    book: Isa
    chapter: 58
    verse: 9
    text: Then shalt thou call, and the LORD shall answer; thou shalt cry, and he shall say, Here I am. If thou take away from the midst of thee the yoke, the putting forth of the finger, and speaking vanity;
    web: Then you will call, and the LORD will answer. You will cry for help, and he will say, ‘Here I am.’ “If you take away from among you the yoke, finger pointing, and speaking wickedly;
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.10
    name: Isaiah 58:10
    apiRef: Isaiah58:10
    book: Isa
    chapter: 58
    verse: 10
    text: 'And if thou draw out thy soul to the hungry, and satisfy the afflicted soul; then shall thy light rise in obscurity, and thy darkness be as the noonday:'
    web: and if you pour out your soul to the hungry, and satisfy the afflicted soul, then your light will rise in darkness, and your obscurity will be as the noonday;
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.11
    name: Isaiah 58:11
    apiRef: Isaiah58:11
    book: Isa
    chapter: 58
    verse: 11
    text: 'And the LORD shall guide thee continually, and satisfy thy soul in drought, and make fat thy bones: and thou shalt be like a watered garden, and like a spring of water, whose waters fail not.'
    web: and the LORD will guide you continually, satisfy your soul in dry places, and make your bones strong. You will be like a watered garden, and like a spring of water whose waters don’t fail.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.12
    name: Isaiah 58:12
    apiRef: Isaiah58:12
    book: Isa
    chapter: 58
    verse: 12
    text: 'And they that shall be of thee shall build the old waste places: thou shalt raise up the foundations of many generations; and thou shalt be called, The repairer of the breach, The restorer of paths to dwell in.'
    web: Those who will be of you will build the old waste places. You will raise up the foundations of many generations. You will be called Repairer of the Breach, Restorer of Paths with Dwellings.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.13
    name: Isaiah 58:13
    apiRef: Isaiah58:13
    book: Isa
    chapter: 58
    verse: 13
    text: 'If thou turn away thy foot from the sabbath, from doing thy pleasure on my holy day; and call the sabbath a delight, the holy of the LORD, honourable; and shalt honour him, not doing thine own ways, nor finding thine own pleasure, nor speaking thine own words:'
    web: “If you turn away your foot from the Sabbath, from doing your pleasure on my holy day, and call the Sabbath a delight, and the holy of the LORD honorable, and honor it, not doing your own ways, nor finding your own pleasure, nor speaking your own words,
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.58.14
    name: Isaiah 58:14
    apiRef: Isaiah58:14
    book: Isa
    chapter: 58
    verse: 14
    text: 'Then shalt thou delight thyself in the LORD; and I will cause thee to ride upon the high places of the earth, and feed thee with the heritage of Jacob thy father: for the mouth of the LORD hath spoken it.'
    web: then you will delight yourself in the LORD, and I will make you to ride on the high places of the earth, and I will feed you with the heritage of Jacob your father;” for the LORD’s mouth has spoken it.
    people:
    - israel_682
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.58
- type: Verse
  data:
    osis: Isa.59.1
    name: Isaiah 59:1
    apiRef: Isaiah59:1
    book: Isa
    chapter: 59
    verse: 1
    text: 'Behold, the LORD’S hand is not shortened, that it cannot save; neither his ear heavy, that it cannot hear:'
    web: Behold, the LORD’s hand is not shortened, that it can’t save; nor his ear dull, that it can’t hear.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.2
    name: Isaiah 59:2
    apiRef: Isaiah59:2
    book: Isa
    chapter: 59
    verse: 2
    text: But your iniquities have separated between you and your God, and your sins have hid his face from you, that he will not hear.
    web: But your iniquities have separated you and your God, and your sins have hidden his face from you, so that he will not hear.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.3
    name: Isaiah 59:3
    apiRef: Isaiah59:3
    book: Isa
    chapter: 59
    verse: 3
    text: For your hands are defiled with blood, and your fingers with iniquity; your lips have spoken lies, your tongue hath muttered perverseness.
    web: For your hands are defiled with blood, and your fingers with iniquity. Your lips have spoken lies. Your tongue mutters wickedness.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.4
    name: Isaiah 59:4
    apiRef: Isaiah59:4
    book: Isa
    chapter: 59
    verse: 4
    text: 'None calleth for justice, nor any pleadeth for truth: they trust in vanity, and speak lies; they conceive mischief, and bring forth iniquity.'
    web: No one sues in righteousness, and no one pleads in truth. They trust in vanity and speak lies. They conceive mischief and give birth to iniquity.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.5
    name: Isaiah 59:5
    apiRef: Isaiah59:5
    book: Isa
    chapter: 59
    verse: 5
    text: 'They hatch cockatrice’ eggs, and weave the spider’s web: he that eateth of their eggs dieth, and that which is crushed breaketh out into a viper.'
    web: They hatch adders’ eggs and weave the spider’s web. He who eats of their eggs dies; and that which is crushed breaks out into a viper.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.6
    name: Isaiah 59:6
    apiRef: Isaiah59:6
    book: Isa
    chapter: 59
    verse: 6
    text: 'Their webs shall not become garments, neither shall they cover themselves with their works: their works are works of iniquity, and the act of violence is in their hands.'
    web: Their webs won’t become garments. They won’t cover themselves with their works. Their works are works of iniquity, and acts of violence are in their hands.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.7
    name: Isaiah 59:7
    apiRef: Isaiah59:7
    book: Isa
    chapter: 59
    verse: 7
    text: 'Their feet run to evil, and they make haste to shed innocent blood: their thoughts are thoughts of iniquity; wasting and destruction are in their paths.'
    web: Their feet run to evil, and they hurry to shed innocent blood. Their thoughts are thoughts of iniquity. Desolation and destruction are in their paths.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.8
    name: Isaiah 59:8
    apiRef: Isaiah59:8
    book: Isa
    chapter: 59
    verse: 8
    text: 'The way of peace they know not; and there is no judgment in their goings: they have made them crooked paths: whosoever goeth therein shall not know peace.'
    web: They don’t know the way of peace; and there is no justice in their ways. They have made crooked paths for themselves; whoever goes in them doesn’t know peace.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.9
    name: Isaiah 59:9
    apiRef: Isaiah59:9
    book: Isa
    chapter: 59
    verse: 9
    text: 'Therefore is judgment far from us, neither doth justice overtake us: we wait for light, but behold obscurity; for brightness, but we walk in darkness.'
    web: Therefore justice is far from us, and righteousness doesn’t overtake us. We look for light, but see darkness; for brightness, but we walk in obscurity.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.10
    name: Isaiah 59:10
    apiRef: Isaiah59:10
    book: Isa
    chapter: 59
    verse: 10
    text: 'We grope for the wall like the blind, and we grope as if we had no eyes: we stumble at noonday as in the night; we are in desolate places as dead men.'
    web: We grope for the wall like the blind. Yes, we grope as those who have no eyes. We stumble at noon as if it were twilight. Among those who are strong, we are like dead men.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.11
    name: Isaiah 59:11
    apiRef: Isaiah59:11
    book: Isa
    chapter: 59
    verse: 11
    text: 'We roar all like bears, and mourn sore like doves: we look for judgment, but there is none; for salvation, but it is far off from us.'
    web: We all roar like bears and moan sadly like doves. We look for justice, but there is none, for salvation, but it is far off from us.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.12
    name: Isaiah 59:12
    apiRef: Isaiah59:12
    book: Isa
    chapter: 59
    verse: 12
    text: 'For our transgressions are multiplied before thee, and our sins testify against us: for our transgressions are with us; and as for our iniquities, we know them;'
    web: 'For our transgressions are multiplied before you, and our sins testify against us; for our transgressions are with us, and as for our iniquities, we know them:'
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.13
    name: Isaiah 59:13
    apiRef: Isaiah59:13
    book: Isa
    chapter: 59
    verse: 13
    text: In transgressing and lying against the LORD, and departing away from our God, speaking oppression and revolt, conceiving and uttering from the heart words of falsehood.
    web: transgressing and denying the LORD, and turning away from following our God, speaking oppression and revolt, conceiving and uttering from the heart words of falsehood.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.14
    name: Isaiah 59:14
    apiRef: Isaiah59:14
    book: Isa
    chapter: 59
    verse: 14
    text: 'And judgment is turned away backward, and justice standeth afar off: for truth is fallen in the street, and equity cannot enter.'
    web: Justice is turned away backward, and righteousness stands far away; for truth has fallen in the street, and uprightness can’t enter.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.15
    name: Isaiah 59:15
    apiRef: Isaiah59:15
    book: Isa
    chapter: 59
    verse: 15
    text: 'Yea, truth faileth; and he that departeth from evil maketh himself a prey: and the LORD saw it, and it displeased him that there was no judgment.'
    web: Yes, truth is lacking; and he who departs from evil makes himself a prey. The LORD saw it, and it displeased him that there was no justice.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.16
    name: Isaiah 59:16
    apiRef: Isaiah59:16
    book: Isa
    chapter: 59
    verse: 16
    text: 'And he saw that there was no man, and wondered that there was no intercessor: therefore his arm brought salvation unto him; and his righteousness, it sustained him.'
    web: He saw that there was no man, and wondered that there was no intercessor. Therefore his own arm brought salvation to him; and his righteousness sustained him.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.17
    name: Isaiah 59:17
    apiRef: Isaiah59:17
    book: Isa
    chapter: 59
    verse: 17
    text: For he put on righteousness as a breastplate, and an helmet of salvation upon his head; and he put on the garments of vengeance for clothing, and was clad with zeal as a cloke.
    web: He put on righteousness as a breastplate, and a helmet of salvation on his head. He put on garments of vengeance for clothing, and was clad with zeal as a mantle.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.18
    name: Isaiah 59:18
    apiRef: Isaiah59:18
    book: Isa
    chapter: 59
    verse: 18
    text: According to their deeds, accordingly he will repay, fury to his adversaries, recompence to his enemies; to the islands he will repay recompence.
    web: 'According to their deeds, he will repay as appropriate: wrath to his adversaries, recompense to his enemies. He will repay the islands their due.'
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.59
- type: Verse
  data:
    osis: Isa.59.19
    name: Isaiah 59:19
    apiRef: Isaiah59:19
    book: Isa
    chapter: 59
    verse: 19
    text: So shall they fear the name of the LORD from the west, and his glory from the rising of the sun. When the enemy shall come in like a flood, the Spirit of the LORD shall lift up a standard against him.
    web: So they will fear the LORD’s name from the west, and his glory from the rising of the sun; for he will come as a rushing stream, which the LORD’s breath drives.
