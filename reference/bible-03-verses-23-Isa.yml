    apiRef: Isaiah47:15
    book: Isa
    chapter: 47
    verse: 15
    text: 'Thus shall they be unto thee with whom thou hast laboured, even thy merchants, from thy youth: they shall wander every one to his quarter; none shall save thee.'
    web: 'The things that you labored in will be like this: those who have trafficked with you from your youth will each wander in his own way. There will be no one to save you.'
