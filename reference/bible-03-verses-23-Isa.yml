  data:
    osis: Isa.21.6
    name: Isaiah 21:6
    apiRef: Isaiah21:6
    book: Isa
    chapter: 21
    verse: 6
    text: For thus hath the Lord said unto me, Go, set a watchman, let him declare what he seeth.
    web: For the Lord said to me, “Go, set a watchman. Let him declare what he sees.
