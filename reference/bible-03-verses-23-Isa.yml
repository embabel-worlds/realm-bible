  data:
    osis: Isa.63.16
    name: Isaiah 63:16
    apiRef: Isaiah63:16
    book: Isa
    chapter: 63
    verse: 16
    text: 'Doubtless thou art our father, though Abraham be ignorant of us, and Israel acknowledge us not: thou, O LORD, art our father, our redeemer; thy name is from everlasting.'
    web: For you are our Father, though Abraham doesn’t know us, and Israel does not acknowledge us. You, LORD, are our Father. Our Redeemer from everlasting is your name.
