  data:
    osis: Isa.64.1
    name: Isaiah 64:1
    apiRef: Isaiah64:1
    book: Isa
    chapter: 64
    verse: 1
    text: Oh that thou wouldest rend the heavens, that thou wouldest come down, that the mountains might flow down at thy presence,
    web: Oh that you would tear the heavens, that you would come down, that the mountains might quake at your presence—
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
- type: Verse
  data:
    osis: Isa.64.2
    name: Isaiah 64:2
    apiRef: Isaiah64:2
    book: Isa
    chapter: 64
    verse: 2
    text: As when the melting fire burneth, the fire causeth the waters to boil, to make thy name known to thine adversaries, that the nations may tremble at thy presence!
    web: as when fire kindles the brushwood, and the fire causes the water to boil. Make your name known to your adversaries, that the nations may tremble at your presence!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
- type: Verse
  data:
    osis: Isa.64.3
    name: Isaiah 64:3
    apiRef: Isaiah64:3
    book: Isa
    chapter: 64
    verse: 3
    text: When thou didst terrible things which we looked not for, thou camest down, the mountains flowed down at thy presence.
    web: When you did awesome things which we didn’t look for, you came down, and the mountains quaked at your presence.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
- type: Verse
  data:
    osis: Isa.64.4
    name: Isaiah 64:4
    apiRef: Isaiah64:4
    book: Isa
    chapter: 64
    verse: 4
    text: For since the beginning of the world men have not heard, nor perceived by the ear, neither hath the eye seen, O God, beside thee, what he hath prepared for him that waiteth for him.
    web: For from of old men have not heard, nor perceived by the ear, nor has the eye seen a God besides you, who works for him who waits for him.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
