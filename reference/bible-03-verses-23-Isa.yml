  data:
    osis: Isa.51.3
    name: Isaiah 51:3
    apiRef: Isaiah51:3
    book: Isa
    chapter: 51
    verse: 3
    text: 'For the LORD shall comfort Zion: he will comfort all her waste places; and he will make her wilderness like Eden, and her desert like the garden of the LORD; joy and gladness shall be found therein, thanksgiving, and the voice of melody.'
    web: For the LORD has comforted Zion. He has comforted all her waste places, and has made her wilderness like Eden, and her desert like the garden of the LORD. Joy and gladness will be found in them, thanksgiving, and the voice of melody.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.51.4
    name: Isaiah 51:4
    apiRef: Isaiah51:4
    book: Isa
    chapter: 51
    verse: 4
    text: 'Hearken unto me, my people; and give ear unto me, O my nation: for a law shall proceed from me, and I will make my judgment to rest for a light of the people.'
    web: “Listen to me, my people; and hear me, my nation, for a law will go out from me, and I will establish my justice for a light to the peoples.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.51.5
    name: Isaiah 51:5
    apiRef: Isaiah51:5
    book: Isa
    chapter: 51
    verse: 5
    text: My righteousness is near; my salvation is gone forth, and mine arms shall judge the people; the isles shall wait upon me, and on mine arm shall they trust.
    web: My righteousness is near. My salvation has gone out, and my arms will judge the peoples. The islands will wait for me, and they will trust my arm.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.51.6
    name: Isaiah 51:6
    apiRef: Isaiah51:6
    book: Isa
    chapter: 51
    verse: 6
    text: 'Lift up your eyes to the heavens, and look upon the earth beneath: for the heavens shall vanish away like smoke, and the earth shall wax old like a garment, and they that dwell therein shall die in like manner: but my salvation shall be for ever, and my righteousness shall not be abolished.'
    web: Lift up your eyes to the heavens, and look at the earth beneath; for the heavens will vanish away like smoke, and the earth will wear out like a garment. Its inhabitants will die in the same way, but my salvation will be forever, and my righteousness will not be abolished.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.51.7
    name: Isaiah 51:7
    apiRef: Isaiah51:7
    book: Isa
    chapter: 51
    verse: 7
    text: Hearken unto me, ye that know righteousness, the people in whose heart is my law; fear ye not the reproach of men, neither be ye afraid of their revilings.
    web: “Listen to me, you who know righteousness, the people in whose heart is my law. Don’t fear the reproach of men, and don’t be dismayed at their insults.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.51.8
    name: Isaiah 51:8
    apiRef: Isaiah51:8
    book: Isa
    chapter: 51
    verse: 8
    text: 'For the moth shall eat them up like a garment, and the worm shall eat them like wool: but my righteousness shall be for ever, and my salvation from generation to generation.'
    web: For the moth will eat them up like a garment, and the worm will eat them like wool; but my righteousness will be forever, and my salvation to all generations.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
