    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.4
    name: Isaiah 36:4
    apiRef: Isaiah36:4
    book: Isa
    chapter: 36
    verse: 4
    text: And Rabshakeh said unto them, Say ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence is this wherein thou trustest?
    web: Rabshakeh said to them, “Now tell Hezekiah, ‘The great king, the king of Assyria, says, “What confidence is this in which you trust?
    people:
    - rabshakeh_2384
    - hezekiah_1512
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.5
    name: Isaiah 36:5
    apiRef: Isaiah36:5
    book: Isa
    chapter: 36
    verse: 5
    text: 'I say, sayest thou, (but they are but vain words) I have counsel and strength for war: now on whom dost thou trust, that thou rebellest against me?'
    web: I say that your counsel and strength for the war are only vain words. Now in whom do you trust, that you have rebelled against me?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.6
    name: Isaiah 36:6
    apiRef: Isaiah36:6
    book: Isa
    chapter: 36
    verse: 6
    text: 'Lo, thou trustest in the staff of this broken reed, on Egypt; whereon if a man lean, it will go into his hand, and pierce it: so is Pharaoh king of Egypt to all that trust in him.'
    web: Behold, you trust in the staff of this bruised reed, even in Egypt, which if a man leans on it, it will go into his hand and pierce it. So is Pharaoh king of Egypt to all who trust in him.
    people:
    - pharaoh_2333
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.7
    name: Isaiah 36:7
    apiRef: Isaiah36:7
    book: Isa
    chapter: 36
    verse: 7
    text: 'But if thou say to me, We trust in the LORD our God: is it not he, whose high places and whose altars Hezekiah hath taken away, and said to Judah and to Jerusalem, Ye shall worship before this altar?'
    web: But if you tell me, ‘We trust in the LORD our God,’ isn’t that he whose high places and whose altars Hezekiah has taken away, and has said to Judah and to Jerusalem, ‘You shall worship before this altar’?”
    people:
    - hezekiah_1512
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.8
    name: Isaiah 36:8
    apiRef: Isaiah36:8
    book: Isa
    chapter: 36
    verse: 8
    text: Now therefore give pledges, I pray thee, to my master the king of Assyria, and I will give thee two thousand horses, if thou be able on thy part to set riders upon them.
    web: Now therefore, please make a pledge to my master the king of Assyria, and I will give you two thousand horses, if you are able on your part to set riders on them.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.9
    name: Isaiah 36:9
    apiRef: Isaiah36:9
    book: Isa
    chapter: 36
    verse: 9
    text: How then wilt thou turn away the face of one captain of the least of my master’s servants, and put thy trust on Egypt for chariots and for horsemen?
    web: How then can you turn away the face of one captain of the least of my master’s servants, and put your trust in Egypt for chariots and for horsemen?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.10
    name: Isaiah 36:10
    apiRef: Isaiah36:10
    book: Isa
    chapter: 36
    verse: 10
    text: And am I now come up without the LORD against this land to destroy it? the LORD said unto me, Go up against this land, and destroy it.
    web: Have I come up now without the LORD against this land to destroy it? The LORD said to me, “Go up against this land, and destroy it.”’”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.11
    name: Isaiah 36:11
    apiRef: Isaiah36:11
    book: Isa
    chapter: 36
    verse: 11
    text: 'Then said Eliakim and Shebna and Joah unto Rabshakeh, Speak, I pray thee, unto thy servants in the Syrian language; for we understand it: and speak not to us in the Jews’ language, in the ears of the people that are on the wall.'
    web: Then Eliakim, Shebna and Joah said to Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. Don’t speak to us in the Jews’ language in the hearing of the people who are on the wall.”
    people:
    - eliakim_1084
    - shebna_2577
    - joah_1621
    - rabshakeh_2384
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.12
    name: Isaiah 36:12
    apiRef: Isaiah36:12
    book: Isa
    chapter: 36
    verse: 12
    text: But Rabshakeh said, Hath my master sent me to thy master and to thee to speak these words? hath he not sent me to the men that sit upon the wall, that they may eat their own dung, and drink their own piss with you?
    web: But Rabshakeh said, “Has my master sent me only to your master and to you, to speak these words, and not to the men who sit on the wall, who will eat their own dung and drink their own urine with you?”
    people:
    - rabshakeh_2384
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.13
    name: Isaiah 36:13
    apiRef: Isaiah36:13
    book: Isa
    chapter: 36
    verse: 13
    text: Then Rabshakeh stood, and cried with a loud voice in the Jews’ language, and said, Hear ye the words of the great king, the king of Assyria.
    web: Then Rabshakeh stood, and called out with a loud voice in the Jews’ language, and said, “Hear the words of the great king, the king of Assyria!
    people:
    - rabshakeh_2384
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.14
    name: Isaiah 36:14
    apiRef: Isaiah36:14
    book: Isa
    chapter: 36
    verse: 14
    text: 'Thus saith the king, Let not Hezekiah deceive you: for he shall not be able to deliver you.'
    web: The king says, ‘Don’t let Hezekiah deceive you; for he will not be able to deliver you.
    people:
    - hezekiah_1512
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.15
    name: Isaiah 36:15
    apiRef: Isaiah36:15
    book: Isa
    chapter: 36
    verse: 15
    text: 'Neither let Hezekiah make you trust in the LORD, saying, The LORD will surely deliver us: this city shall not be delivered into the hand of the king of Assyria.'
    web: Don’t let Hezekiah make you trust in the LORD, saying, “The LORD will surely deliver us. This city won’t be given into the hand of the king of Assyria.”’
    people:
    - hezekiah_1512
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.16
    name: Isaiah 36:16
    apiRef: Isaiah36:16
    book: Isa
    chapter: 36
    verse: 16
    text: 'Hearken not to Hezekiah: for thus saith the king of Assyria, Make an agreement with me by a present, and come out to me: and eat ye every one of his vine, and every one of his fig tree, and drink ye every one the waters of his own cistern;'
    web: Don’t listen to Hezekiah, for the king of Assyria says, ‘Make your peace with me, and come out to me; and each of you eat from his vine, and each one from his fig tree, and each one of you drink the waters of his own cistern;
    people:
    - hezekiah_1512
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.17
    name: Isaiah 36:17
    apiRef: Isaiah36:17
    book: Isa
    chapter: 36
    verse: 17
    text: Until I come and take you away to a land like your own land, a land of corn and wine, a land of bread and vineyards.
    web: until I come and take you away to a land like your own land, a land of grain and new wine, a land of bread and vineyards.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.18
    name: Isaiah 36:18
    apiRef: Isaiah36:18
    book: Isa
    chapter: 36
    verse: 18
    text: Beware lest Hezekiah persuade you, saying, The LORD will deliver us. Hath any of the gods of the nations delivered his land out of the hand of the king of Assyria?
    web: Beware lest Hezekiah persuade you, saying, “The LORD will deliver us.” Have any of the gods of the nations delivered their lands from the hand of the king of Assyria?
    people:
    - hezekiah_1512
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.19
    name: Isaiah 36:19
    apiRef: Isaiah36:19
    book: Isa
    chapter: 36
    verse: 19
    text: Where are the gods of Hamath and Arphad? where are the gods of Sepharvaim? and have they delivered Samaria out of my hand?
    web: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim? Have they delivered Samaria from my hand?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.20
    name: Isaiah 36:20
    apiRef: Isaiah36:20
    book: Isa
    chapter: 36
    verse: 20
    text: Who are they among all the gods of these lands, that have delivered their land out of my hand, that the LORD should deliver Jerusalem out of my hand?
    web: Who are they among all the gods of these countries that have delivered their country out of my hand, that the LORD should deliver Jerusalem out of my hand?’”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
