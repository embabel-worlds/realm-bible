    name: Isaiah 20:3
    apiRef: Isaiah20:3
    book: Isa
    chapter: 20
    verse: 3
    text: And the LORD said, Like as my servant Isaiah hath walked naked and barefoot three years for a sign and wonder upon Egypt and upon Ethiopia;
    web: The LORD said, “As my servant Isaiah has walked naked and barefoot three years for a sign and a wonder concerning Egypt and concerning Ethiopia,
    people:
