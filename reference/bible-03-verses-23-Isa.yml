    name: Isaiah 1:13
    apiRef: Isaiah1:13
    book: Isa
    chapter: 1
    verse: 13
    text: Bring no more vain oblations; incense is an abomination unto me; the new moons and sabbaths, the calling of assemblies, I cannot away with; it is iniquity, even the solemn meeting.
    web: Bring no more vain offerings. Incense is an abomination to me. New moons, Sabbaths, and convocations— I can’t stand evil assemblies.
    event: Prophecies of Isaiah
