  data:
    osis: Isa.13.7
    name: Isaiah 13:7
    apiRef: Isaiah13:7
    book: Isa
    chapter: 13
    verse: 7
    text: 'Therefore shall all hands be faint, and every man’s heart shall melt:'
    web: Therefore all hands will be feeble, and everyone’s heart will melt.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.13
- type: Verse
  data:
    osis: Isa.13.8
    name: Isaiah 13:8
    apiRef: Isaiah13:8
    book: Isa
    chapter: 13
    verse: 8
    text: 'And they shall be afraid: pangs and sorrows shall take hold of them; they shall be in pain as a woman that travaileth: they shall be amazed one at another; their faces shall be as flames.'
    web: They will be dismayed. Pangs and sorrows will seize them. They will be in pain like a woman in labor. They will look in amazement one at another. Their faces will be faces of flame.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.13
- type: Verse
  data:
    osis: Isa.13.9
    name: Isaiah 13:9
    apiRef: Isaiah13:9
    book: Isa
    chapter: 13
    verse: 9
    text: 'Behold, the day of the LORD cometh, cruel both with wrath and fierce anger, to lay the land desolate: and he shall destroy the sinners thereof out of it.'
    web: Behold, the day of the LORD comes, cruel, with wrath and fierce anger; to make the land a desolation, and to destroy its sinners out of it.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.13
- type: Verse
  data:
    osis: Isa.13.10
    name: Isaiah 13:10
    apiRef: Isaiah13:10
    book: Isa
    chapter: 13
    verse: 10
    text: 'For the stars of heaven and the constellations thereof shall not give their light: the sun shall be darkened in his going forth, and the moon shall not cause her light to shine.'
    web: For the stars of the sky and its constellations will not give their light. The sun will be darkened in its going out, and the moon will not cause its light to shine.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.13
- type: Verse
  data:
    osis: Isa.13.11
    name: Isaiah 13:11
    apiRef: Isaiah13:11
    book: Isa
    chapter: 13
    verse: 11
    text: And I will punish the world for their evil, and the wicked for their iniquity; and I will cause the arrogancy of the proud to cease, and will lay low the haughtiness of the terrible.
    web: I will punish the world for their evil, and the wicked for their iniquity. I will cause the arrogance of the proud to cease, and will humble the arrogance of the terrible.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.13
- type: Verse
  data:
    osis: Isa.13.12
    name: Isaiah 13:12
    apiRef: Isaiah13:12
    book: Isa
    chapter: 13
    verse: 12
    text: I will make a man more precious than fine gold; even a man than the golden wedge of Ophir.
    web: I will make people more rare than fine gold, even a person than the pure gold of Ophir.
    event: Prophecies of Isaiah
  relations:
