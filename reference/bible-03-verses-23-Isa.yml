    osis: Isa.56.4
    name: Isaiah 56:4
    apiRef: Isaiah56:4
    book: Isa
    chapter: 56
    verse: 4
    text: For thus saith the LORD unto the eunuchs that keep my sabbaths, and choose the things that please me, and take hold of my covenant;
    web: For the LORD says, “To the eunuchs who keep my Sabbaths, choose the things that please me, and hold fast to my covenant,
    people:
    - god_1324
