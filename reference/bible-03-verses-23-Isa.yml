    apiRef: Isaiah19:16
    book: Isa
    chapter: 19
    verse: 16
    text: 'In that day shall Egypt be like unto women: and it shall be afraid and fear because of the shaking of the hand of the LORD of hosts, which he shaketh over it.'
    web: In that day the Egyptians will be like women. They will tremble and fear because of the shaking of the LORD of Armies’s hand, which he shakes over them.
    people:
