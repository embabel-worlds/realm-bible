    apiRef: Isaiah23:6
    book: Isa
    chapter: 23
    verse: 6
    text: Pass ye over to Tarshish; howl, ye inhabitants of the isle.
    web: Pass over to Tarshish! Wail, you inhabitants of the coast!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
