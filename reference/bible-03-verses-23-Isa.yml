  data:
    osis: Isa.65.1
    name: Isaiah 65:1
    apiRef: Isaiah65:1
    book: Isa
    chapter: 65
    verse: 1
    text: 'I am sought of them that asked not for me; I am found of them that sought me not: I said, Behold me, behold me, unto a nation that was not called by my name.'
    web: “I am inquired of by those who didn’t ask. I am found by those who didn’t seek me. I said, ‘See me, see me,’ to a nation that was not called by my name.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
