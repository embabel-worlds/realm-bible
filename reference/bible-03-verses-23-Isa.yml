    apiRef: Isaiah55:1
    book: Isa
    chapter: 55
    verse: 1
    text: Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy, and eat; yea, come, buy wine and milk without money and without price.
    web: “Hey! Come, everyone who thirsts, to the waters! Come, he who has no money, buy, and eat! Yes, come, buy wine and milk without money and without price.
    event: Prophecies of Isaiah
  relations:
