    name: Isaiah 10:14
    apiRef: Isaiah10:14
    book: Isa
    chapter: 10
    verse: 14
    text: 'And my hand hath found as a nest the riches of the people: and as one gathereth eggs that are left, have I gathered all the earth; and there was none that moved the wing, or opened the mouth, or peeped.'
    web: My hand has found the riches of the peoples like a nest, and like one gathers eggs that are abandoned, I have gathered all the earth. There was no one who moved their wing, or that opened their mouth, or chirped.”
