  data:
    osis: Isa.1.6
    name: Isaiah 1:6
    apiRef: Isaiah1:6
    book: Isa
    chapter: 1
    verse: 6
    text: 'From the sole of the foot even unto the head there is no soundness in it; but wounds, and bruises, and putrifying sores: they have not been closed, neither bound up, neither mollified with ointment.'
    web: From the sole of the foot even to the head there is no soundness in it, but wounds, welts, and open sores. They haven’t been closed, bandaged, or soothed with oil.
    event: Prophecies of Isaiah
