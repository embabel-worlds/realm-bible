  data:
    osis: Isa.55.12
    name: Isaiah 55:12
    apiRef: Isaiah55:12
    book: Isa
    chapter: 55
    verse: 12
    text: 'For ye shall go out with joy, and be led forth with peace: the mountains and the hills shall break forth before you into singing, and all the trees of the field shall clap their hands.'
    web: For you shall go out with joy, and be led out with peace. The mountains and the hills will break out before you into singing; and all the trees of the fields will clap their hands.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
