  data:
    osis: Isa.21.9
    name: Isaiah 21:9
    apiRef: Isaiah21:9
    book: Isa
    chapter: 21
    verse: 9
    text: And, behold, here cometh a chariot of men, with a couple of horsemen. And he answered and said, Babylon is fallen, is fallen; and all the graven images of her gods he hath broken unto the ground.
    web: Behold, here comes a troop of men, horsemen in pairs.” He answered, “Fallen, fallen is Babylon; and all the engraved images of her gods are broken to the ground.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.21
- type: Verse
  data:
    osis: Isa.21.10
    name: Isaiah 21:10
    apiRef: Isaiah21:10
    book: Isa
    chapter: 21
    verse: 10
    text: 'O my threshing, and the corn of my floor: that which I have heard of the LORD of hosts, the God of Israel, have I declared unto you.'
    web: You are my threshing, and the grain of my floor!” That which I have heard from the LORD of Armies, the God of Israel, I have declared to you.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
