  data:
    osis: Isa.12.6
    name: Isaiah 12:6
    apiRef: Isaiah12:6
    book: Isa
    chapter: 12
    verse: 6
    text: 'Cry out and shout, thou inhabitant of Zion: for great is the Holy One of Israel in the midst of thee.'
    web: Cry aloud and shout, you inhabitant of Zion, for the Holy One of Israel is great among you!”
    people:
    - god_1324
