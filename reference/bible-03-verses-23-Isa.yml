    name: Isaiah 10:31
    apiRef: Isaiah10:31
    book: Isa
    chapter: 10
    verse: 31
    text: Madmenah is removed; the inhabitants of Gebim gather themselves to flee.
    web: Madmenah is a fugitive. The inhabitants of Gebim flee for safety.
