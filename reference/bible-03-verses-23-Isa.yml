  data:
    osis: Isa.64.9
    name: Isaiah 64:9
    apiRef: Isaiah64:9
    book: Isa
    chapter: 64
    verse: 9
    text: 'Be not wroth very sore, O LORD, neither remember iniquity for ever: behold, see, we beseech thee, we are all thy people.'
    web: Don’t be furious, LORD. Don’t remember iniquity forever. Look and see, we beg you, we are all your people.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
