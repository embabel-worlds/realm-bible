    name: Isaiah 14:30
    apiRef: Isaiah14:30
    book: Isa
    chapter: 14
    verse: 30
    text: 'And the firstborn of the poor shall feed, and the needy shall lie down in safety: and I will kill thy root with famine, and he shall slay thy remnant.'
    web: The firstborn of the poor will eat, and the needy will lie down in safety; and I will kill your root with famine, and your remnant will be killed.
