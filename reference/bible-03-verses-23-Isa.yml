    book: Isa
    chapter: 19
    verse: 18
    text: In that day shall five cities in the land of Egypt speak the language of Canaan, and swear to the LORD of hosts; one shall be called, The city of destruction.
    web: In that day, there will be five cities in the land of Egypt that speak the language of Canaan, and swear to the LORD of Armies. One will be called “The city of destruction.”
