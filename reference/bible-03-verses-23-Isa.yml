    apiRef: Isaiah1:21
    book: Isa
    chapter: 1
    verse: 21
    text: How is the faithful city become an harlot! it was full of judgment; righteousness lodged in it; but now murderers.
    web: How the faithful city has become a prostitute! She was full of justice. Righteousness lodged in her, but now there are murderers.
