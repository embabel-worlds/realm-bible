    name: Isaiah 23:2
    apiRef: Isaiah23:2
    book: Isa
    chapter: 23
    verse: 2
    text: Be still, ye inhabitants of the isle; thou whom the merchants of Zidon, that pass over the sea, have replenished.
    web: Be still, you inhabitants of the coast, you whom the merchants of Sidon that pass over the sea have replenished.
    event: Prophecies of Isaiah
  relations:
