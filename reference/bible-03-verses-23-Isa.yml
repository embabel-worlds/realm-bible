    name: Isaiah 63:1
    apiRef: Isaiah63:1
    book: Isa
    chapter: 63
    verse: 1
    text: Who is this that cometh from Edom, with dyed garments from Bozrah? this that is glorious in his apparel, travelling in the greatness of his strength? I that speak in righteousness, mighty to save.
    web: Who is this who comes from Edom, with dyed garments from Bozrah? Who is this who is glorious in his clothing, marching in the greatness of his strength? “It is I who speak in righteousness, mighty to save.”
    people:
    - esau_1216
