    name: Isaiah 21:8
    apiRef: Isaiah21:8
    book: Isa
    chapter: 21
    verse: 8
    text: 'And he cried, A lion: My lord, I stand continually upon the watchtower in the daytime, and I am set in my ward whole nights:'
    web: 'He cried like a lion: “Lord, I stand continually on the watchtower in the daytime, and every night I stay at my post.'
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.21
