    name: Isaiah 20:5
    apiRef: Isaiah20:5
    book: Isa
    chapter: 20
    verse: 5
    text: And they shall be afraid and ashamed of Ethiopia their expectation, and of Egypt their glory.
    web: They will be dismayed and confounded, because of Ethiopia their expectation, and of Egypt their glory.
