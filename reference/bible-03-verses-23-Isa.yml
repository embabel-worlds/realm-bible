    osis: Isa.11.13
    name: Isaiah 11:13
    apiRef: Isaiah11:13
    book: Isa
    chapter: 11
    verse: 13
    text: 'The envy also of Ephraim shall depart, and the adversaries of Judah shall be cut off: Ephraim shall not envy Judah, and Judah shall not vex Ephraim.'
    web: The envy also of Ephraim will depart, and those who persecute Judah will be cut off. Ephraim won’t envy Judah, and Judah won’t persecute Ephraim.
    people:
    - ephraim_1206
