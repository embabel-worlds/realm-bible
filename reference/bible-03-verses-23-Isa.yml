    apiRef: Isaiah50:9
    book: Isa
    chapter: 50
    verse: 9
    text: Behold, the Lord GOD will help me; who is he that shall condemn me? lo, they all shall wax old as a garment; the moth shall eat them up.
    web: Behold, the Lord GOD will help me! Who is he who will condemn me? Behold, they will all grow old like a garment. The moths will eat them up.
