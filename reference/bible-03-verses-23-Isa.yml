    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.17
    name: Isaiah 49:17
    apiRef: Isaiah49:17
    book: Isa
    chapter: 49
    verse: 17
    text: Thy children shall make haste; thy destroyers and they that made thee waste shall go forth of thee.
    web: Your children hurry. Your destroyers and those who devastated you will leave you.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.18
    name: Isaiah 49:18
    apiRef: Isaiah49:18
    book: Isa
    chapter: 49
    verse: 18
    text: 'Lift up thine eyes round about, and behold: all these gather themselves together, and come to thee. As I live, saith the LORD, thou shalt surely clothe thee with them all, as with an ornament, and bind them on thee, as a bride doeth.'
    web: 'Lift up your eyes all around, and see: all these gather themselves together, and come to you. As I live,” says the LORD, “you shall surely clothe yourself with them all as with an ornament, and dress yourself with them, like a bride.'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.19
    name: Isaiah 49:19
    apiRef: Isaiah49:19
    book: Isa
    chapter: 49
    verse: 19
    text: For thy waste and thy desolate places, and the land of thy destruction, shall even now be too narrow by reason of the inhabitants, and they that swallowed thee up shall be far away.
    web: “For, as for your waste and your desolate places, and your land that has been destroyed, surely now that land will be too small for the inhabitants, and those who swallowed you up will be far away.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.20
    name: Isaiah 49:20
    apiRef: Isaiah49:20
    book: Isa
    chapter: 49
    verse: 20
    text: 'The children which thou shalt have, after thou hast lost the other, shall say again in thine ears, The place is too strait for me: give place to me that I may dwell.'
    web: The children of your bereavement will say in your ears, ‘This place is too small for me. Give me a place to live in.’
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.21
    name: Isaiah 49:21
    apiRef: Isaiah49:21
    book: Isa
    chapter: 49
    verse: 21
    text: Then shalt thou say in thine heart, Who hath begotten me these, seeing I have lost my children, and am desolate, a captive, and removing to and fro? and who hath brought up these? Behold, I was left alone; these, where had they been?
    web: Then you will say in your heart, ‘Who has conceived these for me, since I have been bereaved of my children and am alone, an exile, and wandering back and forth? Who has brought these up? Behold, I was left alone. Where were these?’”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.22
    name: Isaiah 49:22
    apiRef: Isaiah49:22
    book: Isa
    chapter: 49
    verse: 22
    text: 'Thus saith the Lord GOD, Behold, I will lift up mine hand to the Gentiles, and set up my standard to the people: and they shall bring thy sons in their arms, and thy daughters shall be carried upon their shoulders.'
    web: The Lord GOD says, “Behold, I will lift up my hand to the nations, and lift up my banner to the peoples. They shall bring your sons in their bosom, and your daughters shall be carried on their shoulders.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.23
    name: Isaiah 49:23
    apiRef: Isaiah49:23
    book: Isa
    chapter: 49
    verse: 23
    text: 'And kings shall be thy nursing fathers, and their queens thy nursing mothers: they shall bow down to thee with their face toward the earth, and lick up the dust of thy feet; and thou shalt know that I am the LORD: for they shall not be ashamed that wait for me.'
    web: Kings shall be your foster fathers, and their queens your nursing mothers. They will bow down to you with their faces to the earth, and lick the dust of your feet. Then you will know that I am the LORD; and those who wait for me won’t be disappointed.”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.24
    name: Isaiah 49:24
    apiRef: Isaiah49:24
    book: Isa
    chapter: 49
    verse: 24
    text: Shall the prey be taken from the mighty, or the lawful captive delivered?
    web: Shall the plunder be taken from the mighty, or the lawful captives be delivered?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.25
    name: Isaiah 49:25
    apiRef: Isaiah49:25
    book: Isa
    chapter: 49
    verse: 25
    text: 'But thus saith the LORD, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered: for I will contend with him that contendeth with thee, and I will save thy children.'
    web: But the LORD says, “Even the captives of the mighty shall be taken away, and the plunder retrieved from the fierce, for I will contend with him who contends with you and I will save your children.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.26
    name: Isaiah 49:26
    apiRef: Isaiah49:26
    book: Isa
    chapter: 49
    verse: 26
    text: 'And I will feed them that oppress thee with their own flesh; and they shall be drunken with their own blood, as with sweet wine: and all flesh shall know that I the LORD am thy Saviour and thy Redeemer, the mighty One of Jacob.'
    web: I will feed those who oppress you with their own flesh; and they will be drunk on their own blood, as with sweet wine. Then all flesh shall know that I, the LORD, am your Savior and your Redeemer, the Mighty One of Jacob.”
    people:
    - israel_682
    - god_1324
