    book: Isa
    chapter: 12
    verse: 1
    text: 'And in that day thou shalt say, O LORD, I will praise thee: though thou wast angry with me, thine anger is turned away, and thou comfortedst me.'
    web: In that day you will say, “I will give thanks to you, the LORD; for though you were angry with me, your anger has turned away and you comfort me.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
