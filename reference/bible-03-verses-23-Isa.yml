  data:
    osis: Isa.11.14
    name: Isaiah 11:14
    apiRef: Isaiah11:14
    book: Isa
    chapter: 11
    verse: 14
    text: 'But they shall fly upon the shoulders of the Philistines toward the west; they shall spoil them of the east together: they shall lay their hand upon Edom and Moab; and the children of Ammon shall obey them.'
    web: They will fly down on the shoulders of the Philistines on the west. Together they will plunder the children of the east. They will extend their power over Edom and Moab, and the children of Ammon will obey them.
