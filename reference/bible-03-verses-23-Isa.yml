    name: Isaiah 10:34
    apiRef: Isaiah10:34
    book: Isa
    chapter: 10
    verse: 34
    text: And he shall cut down the thickets of the forest with iron, and Lebanon shall fall by a mighty one.
    web: He will cut down the thickets of the forest with iron, and Lebanon will fall by the Mighty One.
