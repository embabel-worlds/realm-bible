    name: Isaiah 19:4
    apiRef: Isaiah19:4
    book: Isa
    chapter: 19
    verse: 4
    text: And the Egyptians will I give over into the hand of a cruel lord; and a fierce king shall rule over them, saith the Lord, the LORD of hosts.
    web: I will give over the Egyptians into the hand of a cruel lord. A fierce king will rule over them,” says the Lord, GOD of Armies.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
