  data:
    osis: Isa.13.2
    name: Isaiah 13:2
    apiRef: Isaiah13:2
    book: Isa
    chapter: 13
    verse: 2
    text: Lift ye up a banner upon the high mountain, exalt the voice unto them, shake the hand, that they may go into the gates of the nobles.
    web: Set up a banner on the bare mountain! Lift up your voice to them! Wave your hand, that they may go into the gates of the nobles.
