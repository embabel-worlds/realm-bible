- type: Verse
  data:
    osis: Isa.44.1
    name: Isaiah 44:1
    apiRef: Isaiah44:1
    book: Isa
    chapter: 44
    verse: 1
    text: 'Yet now hear, O Jacob my servant; and Israel, whom I have chosen:'
    web: Yet listen now, Jacob my servant, and Israel, whom I have chosen.
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.2
    name: Isaiah 44:2
    apiRef: Isaiah44:2
    book: Isa
    chapter: 44
    verse: 2
    text: Thus saith the LORD that made thee, and formed thee from the womb, which will help thee; Fear not, O Jacob, my servant; and thou, Jesurun, whom I have chosen.
    web: 'This is what the LORD who made you, and formed you from the womb, who will help you says: “Don’t be afraid, Jacob my servant; and you, Jeshurun, whom I have chosen.'
    people:
    - israel_682
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.3
    name: Isaiah 44:3
    apiRef: Isaiah44:3
    book: Isa
    chapter: 44
    verse: 3
    text: 'For I will pour water upon him that is thirsty, and floods upon the dry ground: I will pour my spirit upon thy seed, and my blessing upon thine offspring:'
    web: For I will pour water on him who is thirsty, and streams on the dry ground. I will pour my Spirit on your descendants, and my blessing on your offspring;
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.4
    name: Isaiah 44:4
    apiRef: Isaiah44:4
    book: Isa
    chapter: 44
    verse: 4
    text: And they shall spring up as among the grass, as willows by the water courses.
    web: and they will spring up among the grass, as willows by the watercourses.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.5
    name: Isaiah 44:5
    apiRef: Isaiah44:5
    book: Isa
    chapter: 44
    verse: 5
    text: One shall say, I am the LORD’S; and another shall call himself by the name of Jacob; and another shall subscribe with his hand unto the LORD, and surname himself by the name of Israel.
    web: One will say, ‘I am the LORD’s.’ Another will be called by the name of Jacob; and another will write with his hand ‘to the LORD,’ and honor the name of Israel.”
    people:
    - israel_682
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.6
    name: Isaiah 44:6
    apiRef: Isaiah44:6
    book: Isa
    chapter: 44
    verse: 6
    text: Thus saith the LORD the King of Israel, and his redeemer the LORD of hosts; I am the first, and I am the last; and beside me there is no God.
    web: 'This is what the LORD, the King of Israel, and his Redeemer, the LORD of Armies, says: “I am the first, and I am the last; and besides me there is no God.'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.7
    name: Isaiah 44:7
    apiRef: Isaiah44:7
    book: Isa
    chapter: 44
    verse: 7
    text: And who, as I, shall call, and shall declare it, and set it in order for me, since I appointed the ancient people? and the things that are coming, and shall come, let them shew unto them.
    web: Who is like me? Who will call, and will declare it, and set it in order for me, since I established the ancient people? Let them declare the things that are coming, and that will happen.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.8
    name: Isaiah 44:8
    apiRef: Isaiah44:8
    book: Isa
    chapter: 44
    verse: 8
    text: 'Fear ye not, neither be afraid: have not I told thee from that time, and have declared it? ye are even my witnesses. Is there a God beside me? yea, there is no God; I know not any.'
    web: Don’t fear, neither be afraid. Haven’t I declared it to you long ago, and shown it? You are my witnesses. Is there a God besides me? Indeed, there is not. I don’t know any other Rock.”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.9
    name: Isaiah 44:9
    apiRef: Isaiah44:9
    book: Isa
    chapter: 44
    verse: 9
    text: They that make a graven image are all of them vanity; and their delectable things shall not profit; and they are their own witnesses; they see not, nor know; that they may be ashamed.
    web: Everyone who makes a carved image is vain. The things that they delight in will not profit. Their own witnesses don’t see, nor know, that they may be disappointed.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.10
    name: Isaiah 44:10
    apiRef: Isaiah44:10
    book: Isa
    chapter: 44
    verse: 10
    text: Who hath formed a god, or molten a graven image that is profitable for nothing?
    web: Who has fashioned a god, or molds an image that is profitable for nothing?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.11
    name: Isaiah 44:11
    apiRef: Isaiah44:11
    book: Isa
    chapter: 44
    verse: 11
    text: 'Behold, all his fellows shall be ashamed: and the workmen, they are of men: let them all be gathered together, let them stand up; yet they shall fear, and they shall be ashamed together.'
    web: Behold, all his fellows will be disappointed; and the workmen are mere men. Let them all be gathered together. Let them stand up. They will fear. They will be put to shame together.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.12
    name: Isaiah 44:12
    apiRef: Isaiah44:12
    book: Isa
    chapter: 44
    verse: 12
    text: 'The smith with the tongs both worketh in the coals, and fashioneth it with hammers, and worketh it with the strength of his arms: yea, he is hungry, and his strength faileth: he drinketh no water, and is faint.'
    web: The blacksmith takes an ax, works in the coals, fashions it with hammers, and works it with his strong arm. He is hungry, and his strength fails; he drinks no water, and is faint.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.13
    name: Isaiah 44:13
    apiRef: Isaiah44:13
    book: Isa
    chapter: 44
    verse: 13
    text: The carpenter stretcheth out his rule; he marketh it out with a line; he fitteth it with planes, and he marketh it out with the compass, and maketh it after the figure of a man, according to the beauty of a man; that it may remain in the house.
    web: The carpenter stretches out a line. He marks it out with a pencil. He shapes it with planes. He marks it out with compasses, and shapes it like the figure of a man, with the beauty of a man, to reside in a house.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.14
    name: Isaiah 44:14
    apiRef: Isaiah44:14
    book: Isa
    chapter: 44
    verse: 14
    text: 'He heweth him down cedars, and taketh the cypress and the oak, which he strengtheneth for himself among the trees of the forest: he planteth an ash, and the rain doth nourish it.'
    web: He cuts down cedars for himself, and takes the cypress and the oak, and strengthens for himself one among the trees of the forest. He plants a cypress tree, and the rain nourishes it.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.15
    name: Isaiah 44:15
    apiRef: Isaiah44:15
    book: Isa
    chapter: 44
    verse: 15
    text: 'Then shall it be for a man to burn: for he will take thereof, and warm himself; yea, he kindleth it, and baketh bread; yea, he maketh a god, and worshippeth it; he maketh it a graven image, and falleth down thereto.'
    web: Then it will be for a man to burn; and he takes some of it and warms himself. Yes, he burns it and bakes bread. Yes, he makes a god and worships it; he makes it a carved image, and falls down to it.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.16
    name: Isaiah 44:16
    apiRef: Isaiah44:16
    book: Isa
    chapter: 44
    verse: 16
    text: 'He burneth part thereof in the fire; with part thereof he eateth flesh; he roasteth roast, and is satisfied: yea, he warmeth himself, and saith, Aha, I am warm, I have seen the fire:'
    web: He burns part of it in the fire. With part of it, he eats meat. He roasts a roast and is satisfied. Yes, he warms himself and says, “Aha! I am warm. I have seen the fire.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.17
    name: Isaiah 44:17
    apiRef: Isaiah44:17
    book: Isa
    chapter: 44
    verse: 17
    text: 'And the residue thereof he maketh a god, even his graven image: he falleth down unto it, and worshippeth it, and prayeth unto it, and saith, Deliver me; for thou art my god.'
    web: The rest of it he makes into a god, even his engraved image. He bows down to it and worships, and prays to it, and says, “Deliver me, for you are my god!”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.18
    name: Isaiah 44:18
    apiRef: Isaiah44:18
    book: Isa
    chapter: 44
    verse: 18
    text: 'They have not known nor understood: for he hath shut their eyes, that they cannot see; and their hearts, that they cannot understand.'
    web: They don’t know, neither do they consider, for he has shut their eyes, that they can’t see, and their hearts, that they can’t understand.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.19
    name: Isaiah 44:19
    apiRef: Isaiah44:19
    book: Isa
    chapter: 44
    verse: 19
    text: 'And none considereth in his heart, neither is there knowledge nor understanding to say, I have burned part of it in the fire; yea, also I have baked bread upon the coals thereof; I have roasted flesh, and eaten it: and shall I make the residue thereof an abomination? shall I fall down to the stock of a tree?'
    web: No one thinks, neither is there knowledge nor understanding to say, “I have burned part of it in the fire. Yes, I have also baked bread on its coals. I have roasted meat and eaten it. Shall I make the rest of it into an abomination? Shall I bow down to a tree trunk?”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.20
    name: Isaiah 44:20
    apiRef: Isaiah44:20
    book: Isa
    chapter: 44
    verse: 20
    text: 'He feedeth on ashes: a deceived heart hath turned him aside, that he cannot deliver his soul, nor say, Is there not a lie in my right hand?'
    web: He feeds on ashes. A deceived heart has turned him aside; and he can’t deliver his soul, nor say, “Isn’t there a lie in my right hand?”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.21
    name: Isaiah 44:21
    apiRef: Isaiah44:21
    book: Isa
    chapter: 44
    verse: 21
    text: 'Remember these, O Jacob and Israel; for thou art my servant: I have formed thee; thou art my servant: O Israel, thou shalt not be forgotten of me.'
    web: Remember these things, Jacob and Israel, for you are my servant. I have formed you. You are my servant. Israel, you will not be forgotten by me.
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.22
    name: Isaiah 44:22
    apiRef: Isaiah44:22
    book: Isa
    chapter: 44
    verse: 22
    text: 'I have blotted out, as a thick cloud, thy transgressions, and, as a cloud, thy sins: return unto me; for I have redeemed thee.'
    web: I have blotted out, as a thick cloud, your transgressions, and, as a cloud, your sins. Return to me, for I have redeemed you.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.23
    name: Isaiah 44:23
    apiRef: Isaiah44:23
    book: Isa
    chapter: 44
    verse: 23
    text: 'Sing, O ye heavens; for the LORD hath done it: shout, ye lower parts of the earth: break forth into singing, ye mountains, O forest, and every tree therein: for the LORD hath redeemed Jacob, and glorified himself in Israel.'
    web: Sing, you heavens, for the LORD has done it! Shout, you lower parts of the earth! Break out into singing, you mountains, O forest, all of your trees, for the LORD has redeemed Jacob, and will glorify himself in Israel.
    people:
    - israel_682
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.24
    name: Isaiah 44:24
    apiRef: Isaiah44:24
    book: Isa
    chapter: 44
    verse: 24
    text: Thus saith the LORD, thy redeemer, and he that formed thee from the womb, I am the LORD that maketh all things; that stretcheth forth the heavens alone; that spreadeth abroad the earth by myself;
    web: 'The LORD, your Redeemer, and he who formed you from the womb says: “I am the LORD, who makes all things; who alone stretches out the heavens; who spreads out the earth by myself;'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.25
    name: Isaiah 44:25
    apiRef: Isaiah44:25
    book: Isa
    chapter: 44
    verse: 25
    text: That frustrateth the tokens of the liars, and maketh diviners mad; that turneth wise men backward, and maketh their knowledge foolish;
    web: who frustrates the signs of the liars, and makes diviners mad; who turns wise men backward, and makes their knowledge foolish;
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.26
    name: Isaiah 44:26
    apiRef: Isaiah44:26
    book: Isa
    chapter: 44
    verse: 26
    text: 'That confirmeth the word of his servant, and performeth the counsel of his messengers; that saith to Jerusalem, Thou shalt be inhabited; and to the cities of Judah, Ye shall be built, and I will raise up the decayed places thereof:'
    web: who confirms the word of his servant, and performs the counsel of his messengers; who says of Jerusalem, ‘She will be inhabited;’ and of the cities of Judah, ‘They will be built,’ and ‘I will raise up its waste places;’
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.27
    name: Isaiah 44:27
    apiRef: Isaiah44:27
    book: Isa
    chapter: 44
    verse: 27
    text: 'That saith to the deep, Be dry, and I will dry up thy rivers:'
    web: who says to the deep, ‘Be dry,’ and ‘I will dry up your rivers,’
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.44.28
    name: Isaiah 44:28
    apiRef: Isaiah44:28
    book: Isa
    chapter: 44
    verse: 28
    text: 'That saith of Cyrus, He is my shepherd, and shall perform all my pleasure: even saying to Jerusalem, Thou shalt be built; and to the temple, Thy foundation shall be laid.'
    web: who says of Cyrus, ‘He is my shepherd, and shall perform all my pleasure,’ even saying of Jerusalem, ‘She will be built;’ and of the temple, ‘Your foundation will be laid.’”
    people:
    - cyrus_968
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.44
- type: Verse
  data:
    osis: Isa.45.1
    name: Isaiah 45:1
    apiRef: Isaiah45:1
    book: Isa
    chapter: 45
    verse: 1
    text: Thus saith the LORD to his anointed, to Cyrus, whose right hand I have holden, to subdue nations before him; and I will loose the loins of kings, to open before him the two leaved gates; and the gates shall not be shut;
    web: 'The LORD says to his anointed, to Cyrus, whose right hand I have held to subdue nations before him and strip kings of their armor, to open the doors before him, and the gates shall not be shut:'
    people:
    - cyrus_968
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.2
    name: Isaiah 45:2
    apiRef: Isaiah45:2
    book: Isa
    chapter: 45
    verse: 2
    text: 'I will go before thee, and make the crooked places straight: I will break in pieces the gates of brass, and cut in sunder the bars of iron:'
    web: “I will go before you and make the rough places smooth. I will break the doors of bronze in pieces and cut apart the bars of iron.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.3
    name: Isaiah 45:3
    apiRef: Isaiah45:3
    book: Isa
    chapter: 45
    verse: 3
    text: And I will give thee the treasures of darkness, and hidden riches of secret places, that thou mayest know that I, the LORD, which call thee by thy name, am the God of Israel.
    web: I will give you the treasures of darkness and hidden riches of secret places, that you may know that it is I, the LORD, who calls you by your name, even the God of Israel.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.4
    name: Isaiah 45:4
    apiRef: Isaiah45:4
    book: Isa
    chapter: 45
    verse: 4
    text: 'For Jacob my servant’s sake, and Israel mine elect, I have even called thee by thy name: I have surnamed thee, though thou hast not known me.'
    web: For Jacob my servant’s sake, and Israel my chosen, I have called you by your name. I have given you a title, though you have not known me.
    people:
    - israel_682
    event: Prophecies of Isaiah
