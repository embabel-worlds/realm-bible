    apiRef: Isaiah22:18
    book: Isa
    chapter: 22
    verse: 18
    text: 'He will surely violently turn and toss thee like a ball into a large country: there shalt thou die, and there the chariots of thy glory shall be the shame of thy lord’s house.'
    web: He will surely wind you around and around, and throw you like a ball into a large country. There you will die, and there the chariots of your glory will be, you disgrace of your lord’s house.
