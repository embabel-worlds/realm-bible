  data:
    osis: Isa.36.1
    name: Isaiah 36:1
    apiRef: Isaiah36:1
    book: Isa
    chapter: 36
    verse: 1
    text: Now it came to pass in the fourteenth year of king Hezekiah, that Sennacherib king of Assyria came up against all the defenced cities of Judah, and took them.
    web: Now in the fourteenth year of King Hezekiah, Sennacherib king of Assyria attacked all of the fortified cities of Judah and captured them.
    people:
    - hezekiah_1512
    - sennacherib_2489
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.2
    name: Isaiah 36:2
    apiRef: Isaiah36:2
    book: Isa
    chapter: 36
    verse: 2
    text: And the king of Assyria sent Rabshakeh from Lachish to Jerusalem unto king Hezekiah with a great army. And he stood by the conduit of the upper pool in the highway of the fuller’s field.
    web: The king of Assyria sent Rabshakeh from Lachish to Jerusalem to King Hezekiah with a large army. He stood by the aqueduct from the upper pool in the fuller’s field highway.
    people:
    - rabshakeh_2384
    - hezekiah_1512
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.36
- type: Verse
  data:
    osis: Isa.36.3
    name: Isaiah 36:3
    apiRef: Isaiah36:3
    book: Isa
    chapter: 36
    verse: 3
    text: Then came forth unto him Eliakim, Hilkiah’s son, which was over the house, and Shebna the scribe, and Joah, Asaph’s son, the recorder.
    web: Then Eliakim the son of Hilkiah, who was over the household, and Shebna the scribe, and Joah, the son of Asaph the recorder came out to him.
    people:
    - eliakim_1084
    - hilkiah_1524
    - shebna_2577
    - joah_1621
    - asaph_330
    event: Prophecies of Isaiah
  relations:
