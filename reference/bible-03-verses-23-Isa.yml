    apiRef: Isaiah54:15
    book: Isa
    chapter: 54
    verse: 15
    text: 'Behold, they shall surely gather together, but not by me: whosoever shall gather together against thee shall fall for thy sake.'
    web: Behold, they may gather together, but not by me. Whoever gathers together against you will fall because of you.
