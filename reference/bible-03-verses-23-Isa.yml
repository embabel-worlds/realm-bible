  data:
    osis: Isa.64.5
    name: Isaiah 64:5
    apiRef: Isaiah64:5
    book: Isa
    chapter: 64
    verse: 5
    text: 'Thou meetest him that rejoiceth and worketh righteousness, those that remember thee in thy ways: behold, thou art wroth; for we have sinned: in those is continuance, and we shall be saved.'
    web: You meet him who rejoices and does righteousness, those who remember you in your ways. Behold, you were angry, and we sinned. We have been in sin for a long time. Shall we be saved?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
- type: Verse
  data:
    osis: Isa.64.6
    name: Isaiah 64:6
    apiRef: Isaiah64:6
    book: Isa
    chapter: 64
    verse: 6
    text: But we are all as an unclean thing, and all our righteousnesses are as filthy rags; and we all do fade as a leaf; and our iniquities, like the wind, have taken us away.
    web: For we have all become like one who is unclean, and all our righteousness is like a polluted garment. We all fade like a leaf; and our iniquities, like the wind, take us away.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
- type: Verse
  data:
    osis: Isa.64.7
    name: Isaiah 64:7
    apiRef: Isaiah64:7
    book: Isa
    chapter: 64
    verse: 7
    text: 'And there is none that calleth upon thy name, that stirreth up himself to take hold of thee: for thou hast hid thy face from us, and hast consumed us, because of our iniquities.'
    web: There is no one who calls on your name, who stirs himself up to take hold of you; for you have hidden your face from us, and have consumed us by means of our iniquities.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
- type: Verse
  data:
    osis: Isa.64.8
    name: Isaiah 64:8
    apiRef: Isaiah64:8
    book: Isa
    chapter: 64
    verse: 8
    text: But now, O LORD, thou art our father; we are the clay, and thou our potter; and we all are the work of thy hand.
    web: But now, LORD, you are our Father. We are the clay and you our potter. We all are the work of your hand.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
