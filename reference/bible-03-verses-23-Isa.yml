  data:
    osis: Isa.56.6
    name: Isaiah 56:6
    apiRef: Isaiah56:6
    book: Isa
    chapter: 56
    verse: 6
    text: Also the sons of the stranger, that join themselves to the LORD, to serve him, and to love the name of the LORD, to be his servants, every one that keepeth the sabbath from polluting it, and taketh hold of my covenant;
    web: Also the foreigners who join themselves to the LORD to serve him, and to love the LORD’s name, to be his servants, everyone who keeps the Sabbath from profaning it, and holds fast my covenant,
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.56
- type: Verse
  data:
    osis: Isa.56.7
    name: Isaiah 56:7
    apiRef: Isaiah56:7
    book: Isa
    chapter: 56
    verse: 7
    text: 'Even them will I bring to my holy mountain, and make them joyful in my house of prayer: their burnt offerings and their sacrifices shall be accepted upon mine altar; for mine house shall be called an house of prayer for all people.'
    web: I will bring these to my holy mountain, and make them joyful in my house of prayer. Their burnt offerings and their sacrifices will be accepted on my altar; for my house will be called a house of prayer for all peoples.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.56
