    name: Isaiah 50:4
    apiRef: Isaiah50:4
    book: Isa
    chapter: 50
    verse: 4
    text: 'The Lord GOD hath given me the tongue of the learned, that I should know how to speak a word in season to him that is weary: he wakeneth morning by morning, he wakeneth mine ear to hear as the learned.'
    web: The Lord GOD has given me the tongue of those who are taught, that I may know how to sustain with words him who is weary. He awakens morning by morning, he awakens my ear to hear as those who are taught.
