  data:
    osis: Isa.1.4
    name: Isaiah 1:4
    apiRef: Isaiah1:4
    book: Isa
    chapter: 1
    verse: 4
    text: 'Ah sinful nation, a people laden with iniquity, a seed of evildoers, children that are corrupters: they have forsaken the LORD, they have provoked the Holy One of Israel unto anger, they are gone away backward.'
    web: Ah sinful nation, a people loaded with iniquity, offspring of evildoers, children who deal corruptly! They have forsaken the LORD. They have despised the Holy One of Israel. They are estranged and backward.
    people:
    - god_1324
