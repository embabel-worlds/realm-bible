  data:
    osis: Isa.64.12
    name: Isaiah 64:12
    apiRef: Isaiah64:12
    book: Isa
    chapter: 64
    verse: 12
    text: Wilt thou refrain thyself for these things, O LORD? wilt thou hold thy peace, and afflict us very sore?
    web: Will you hold yourself back for these things, LORD? Will you keep silent and punish us very severely?
    people:
    - god_1324
