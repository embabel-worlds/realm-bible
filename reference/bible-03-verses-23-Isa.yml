    apiRef: Isaiah21:11
    book: Isa
    chapter: 21
    verse: 11
    text: The burden of Dumah. He calleth to me out of Seir, Watchman, what of the night? Watchman, what of the night?
    web: The burden of Dumah. One calls to me out of Seir, “Watchman, what of the night? Watchman, what of the night?”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.21
