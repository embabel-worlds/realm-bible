  data:
    osis: Isa.23.16
    name: Isaiah 23:16
    apiRef: Isaiah23:16
    book: Isa
    chapter: 23
    verse: 16
    text: Take an harp, go about the city, thou harlot that hast been forgotten; make sweet melody, sing many songs, that thou mayest be remembered.
    web: Take a harp; go about the city, you prostitute that has been forgotten. Make sweet melody. Sing many songs, that you may be remembered.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
- type: Verse
  data:
    osis: Isa.23.17
    name: Isaiah 23:17
    apiRef: Isaiah23:17
    book: Isa
    chapter: 23
    verse: 17
    text: And it shall come to pass after the end of seventy years, that the LORD will visit Tyre, and she shall turn to her hire, and shall commit fornication with all the kingdoms of the world upon the face of the earth.
    web: It will happen after the end of seventy years that the LORD will visit Tyre. She will return to her wages, and will play the prostitute with all the kingdoms of the world on the surface of the earth.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
- type: Verse
  data:
    osis: Isa.23.18
    name: Isaiah 23:18
    apiRef: Isaiah23:18
    book: Isa
    chapter: 23
    verse: 18
    text: 'And her merchandise and her hire shall be holiness to the LORD: it shall not be treasured nor laid up; for her merchandise shall be for them that dwell before the LORD, to eat sufficiently, and for durable clothing.'
    web: Her merchandise and her wages will be holiness to the LORD. It will not be treasured nor laid up; for her merchandise will be for those who dwell before the LORD, to eat sufficiently, and for durable clothing.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
- type: Verse
  data:
    osis: Isa.24.1
    name: Isaiah 24:1
    apiRef: Isaiah24:1
    book: Isa
    chapter: 24
    verse: 1
    text: Behold, the LORD maketh the earth empty, and maketh it waste, and turneth it upside down, and scattereth abroad the inhabitants thereof.
    web: Behold, the LORD makes the earth empty, makes it waste, turns it upside down, and scatters its inhabitants.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.2
    name: Isaiah 24:2
    apiRef: Isaiah24:2
    book: Isa
    chapter: 24
    verse: 2
    text: And it shall be, as with the people, so with the priest; as with the servant, so with his master; as with the maid, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the taker of usury, so with the giver of usury to him.
    web: It will be as with the people, so with the priest; as with the servant, so with his master; as with the maid, so with her mistress; as with the buyer, so with the seller; as with the creditor, so with the debtor; as with the taker of interest, so with the giver of interest.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.3
    name: Isaiah 24:3
    apiRef: Isaiah24:3
    book: Isa
    chapter: 24
    verse: 3
    text: 'The land shall be utterly emptied, and utterly spoiled: for the LORD hath spoken this word.'
    web: The earth will be utterly emptied and utterly laid waste; for the LORD has spoken this word.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.4
    name: Isaiah 24:4
    apiRef: Isaiah24:4
    book: Isa
    chapter: 24
    verse: 4
    text: The earth mourneth and fadeth away, the world languisheth and fadeth away, the haughty people of the earth do languish.
    web: The earth mourns and fades away. The world languishes and fades away. The lofty people of the earth languish.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.5
    name: Isaiah 24:5
    apiRef: Isaiah24:5
    book: Isa
    chapter: 24
    verse: 5
    text: The earth also is defiled under the inhabitants thereof; because they have transgressed the laws, changed the ordinance, broken the everlasting covenant.
    web: The earth also is polluted under its inhabitants, because they have transgressed the laws, violated the statutes, and broken the everlasting covenant.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.6
    name: Isaiah 24:6
    apiRef: Isaiah24:6
    book: Isa
    chapter: 24
    verse: 6
    text: 'Therefore hath the curse devoured the earth, and they that dwell therein are desolate: therefore the inhabitants of the earth are burned, and few men left.'
    web: Therefore the curse has devoured the earth, and those who dwell therein are found guilty. Therefore the inhabitants of the earth are burned, and few men are left.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.7
    name: Isaiah 24:7
    apiRef: Isaiah24:7
    book: Isa
    chapter: 24
    verse: 7
    text: The new wine mourneth, the vine languisheth, all the merryhearted do sigh.
    web: The new wine mourns. The vine languishes. All the merry-hearted sigh.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.8
    name: Isaiah 24:8
    apiRef: Isaiah24:8
    book: Isa
    chapter: 24
    verse: 8
    text: The mirth of tabrets ceaseth, the noise of them that rejoice endeth, the joy of the harp ceaseth.
    web: The mirth of tambourines ceases. The sound of those who rejoice ends. The joy of the harp ceases.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.9
    name: Isaiah 24:9
    apiRef: Isaiah24:9
    book: Isa
    chapter: 24
    verse: 9
    text: They shall not drink wine with a song; strong drink shall be bitter to them that drink it.
    web: They will not drink wine with a song. Strong drink will be bitter to those who drink it.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.10
    name: Isaiah 24:10
    apiRef: Isaiah24:10
    book: Isa
    chapter: 24
    verse: 10
    text: 'The city of confusion is broken down: every house is shut up, that no man may come in.'
    web: The confused city is broken down. Every house is shut up, that no man may come in.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.11
    name: Isaiah 24:11
    apiRef: Isaiah24:11
    book: Isa
    chapter: 24
    verse: 11
    text: There is a crying for wine in the streets; all joy is darkened, the mirth of the land is gone.
    web: There is a crying in the streets because of the wine. All joy is darkened. The mirth of the land is gone.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.12
    name: Isaiah 24:12
    apiRef: Isaiah24:12
    book: Isa
    chapter: 24
    verse: 12
    text: In the city is left desolation, and the gate is smitten with destruction.
    web: The city is left in desolation, and the gate is struck with destruction.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.13
    name: Isaiah 24:13
    apiRef: Isaiah24:13
    book: Isa
    chapter: 24
    verse: 13
    text: When thus it shall be in the midst of the land among the people, there shall be as the shaking of an olive tree, and as the gleaning grapes when the vintage is done.
    web: For it will be so within the earth among the peoples, as the shaking of an olive tree, as the gleanings when the vintage is done.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.14
    name: Isaiah 24:14
    apiRef: Isaiah24:14
    book: Isa
    chapter: 24
    verse: 14
    text: They shall lift up their voice, they shall sing for the majesty of the LORD, they shall cry aloud from the sea.
    web: These shall lift up their voice. They will shout for the majesty of the LORD. They cry aloud from the sea.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.15
    name: Isaiah 24:15
    apiRef: Isaiah24:15
    book: Isa
    chapter: 24
    verse: 15
    text: Wherefore glorify ye the LORD in the fires, even the name of the LORD God of Israel in the isles of the sea.
    web: Therefore glorify the LORD in the east, even the name of the LORD, the God of Israel, in the islands of the sea!
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.16
    name: Isaiah 24:16
    apiRef: Isaiah24:16
    book: Isa
    chapter: 24
    verse: 16
    text: From the uttermost part of the earth have we heard songs, even glory to the righteous. But I said, My leanness, my leanness, woe unto me! the treacherous dealers have dealt treacherously; yea, the treacherous dealers have dealt very treacherously.
    web: From the uttermost part of the earth have we heard songs. Glory to the righteous! But I said, “I pine away! I pine away! woe is me!” The treacherous have dealt treacherously. Yes, the treacherous have dealt very treacherously.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.17
    name: Isaiah 24:17
    apiRef: Isaiah24:17
    book: Isa
    chapter: 24
    verse: 17
    text: Fear, and the pit, and the snare, are upon thee, O inhabitant of the earth.
    web: Fear, the pit, and the snare are on you who inhabit the earth.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.18
    name: Isaiah 24:18
    apiRef: Isaiah24:18
    book: Isa
    chapter: 24
    verse: 18
    text: 'And it shall come to pass, that he who fleeth from the noise of the fear shall fall into the pit; and he that cometh up out of the midst of the pit shall be taken in the snare: for the windows from on high are open, and the foundations of the earth do shake.'
    web: It will happen that he who flees from the noise of the fear will fall into the pit; and he who comes up out of the middle of the pit will be taken in the snare; for the windows on high are opened, and the foundations of the earth tremble.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.19
    name: Isaiah 24:19
    apiRef: Isaiah24:19
    book: Isa
    chapter: 24
    verse: 19
    text: The earth is utterly broken down, the earth is clean dissolved, the earth is moved exceedingly.
    web: The earth is utterly broken. The earth is torn apart. The earth is shaken violently.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.20
    name: Isaiah 24:20
    apiRef: Isaiah24:20
    book: Isa
    chapter: 24
    verse: 20
    text: The earth shall reel to and fro like a drunkard, and shall be removed like a cottage; and the transgression thereof shall be heavy upon it; and it shall fall, and not rise again.
    web: The earth will stagger like a drunken man, and will sway back and forth like a hammock. Its disobedience will be heavy on it, and it will fall and not rise again.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.21
    name: Isaiah 24:21
    apiRef: Isaiah24:21
    book: Isa
    chapter: 24
    verse: 21
    text: And it shall come to pass in that day, that the LORD shall punish the host of the high ones that are on high, and the kings of the earth upon the earth.
    web: It will happen in that day that the LORD will punish the army of the high ones on high, and the kings of the earth on the earth.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.22
    name: Isaiah 24:22
    apiRef: Isaiah24:22
    book: Isa
    chapter: 24
    verse: 22
    text: And they shall be gathered together, as prisoners are gathered in the pit, and shall be shut up in the prison, and after many days shall they be visited.
    web: They will be gathered together, as prisoners are gathered in the pit, and will be shut up in the prison; and after many days they will be visited.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.24.23
    name: Isaiah 24:23
    apiRef: Isaiah24:23
    book: Isa
    chapter: 24
    verse: 23
    text: Then the moon shall be confounded, and the sun ashamed, when the LORD of hosts shall reign in mount Zion, and in Jerusalem, and before his ancients gloriously.
    web: Then the moon will be confounded, and the sun ashamed; for the LORD of Armies will reign on Mount Zion and in Jerusalem; and glory will be before his elders.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.24
- type: Verse
  data:
    osis: Isa.25.1
    name: Isaiah 25:1
    apiRef: Isaiah25:1
    book: Isa
    chapter: 25
    verse: 1
    text: O LORD, thou art my God; I will exalt thee, I will praise thy name; for thou hast done wonderful things; thy counsels of old are faithfulness and truth.
    web: The LORD, you are my God. I will exalt you! I will praise your name, for you have done wonderful things, things planned long ago, in complete faithfulness and truth.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.2
    name: Isaiah 25:2
    apiRef: Isaiah25:2
    book: Isa
    chapter: 25
    verse: 2
    text: 'For thou hast made of a city an heap; of a defenced city a ruin: a palace of strangers to be no city; it shall never be built.'
    web: For you have made a city into a heap, a fortified city into a ruin, a palace of strangers to be no city. It will never be built.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.3
    name: Isaiah 25:3
    apiRef: Isaiah25:3
    book: Isa
    chapter: 25
    verse: 3
    text: Therefore shall the strong people glorify thee, the city of the terrible nations shall fear thee.
    web: Therefore a strong people will glorify you. A city of awesome nations will fear you.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.4
    name: Isaiah 25:4
    apiRef: Isaiah25:4
    book: Isa
    chapter: 25
    verse: 4
    text: For thou hast been a strength to the poor, a strength to the needy in his distress, a refuge from the storm, a shadow from the heat, when the blast of the terrible ones is as a storm against the wall.
    web: For you have been a stronghold to the poor, a stronghold to the needy in his distress, a refuge from the storm, a shade from the heat, when the blast of the dreaded ones is like a storm against the wall.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.5
    name: Isaiah 25:5
    apiRef: Isaiah25:5
    book: Isa
    chapter: 25
    verse: 5
    text: 'Thou shalt bring down the noise of strangers, as the heat in a dry place; even the heat with the shadow of a cloud: the branch of the terrible ones shall be brought low.'
    web: As the heat in a dry place you will bring down the noise of strangers; as the heat by the shade of a cloud, the song of the dreaded ones will be brought low.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.6
    name: Isaiah 25:6
    apiRef: Isaiah25:6
    book: Isa
    chapter: 25
    verse: 6
    text: And in this mountain shall the LORD of hosts make unto all people a feast of fat things, a feast of wines on the lees, of fat things full of marrow, of wines on the lees well refined.
    web: In this mountain, the LORD of Armies will make all peoples a feast of choice meat, a feast of choice wines, of choice meat full of marrow, of well refined choice wines.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.7
    name: Isaiah 25:7
    apiRef: Isaiah25:7
    book: Isa
    chapter: 25
    verse: 7
    text: And he will destroy in this mountain the face of the covering cast over all people, and the vail that is spread over all nations.
    web: He will destroy in this mountain the surface of the covering that covers all peoples, and the veil that is spread over all nations.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.8
    name: Isaiah 25:8
    apiRef: Isaiah25:8
    book: Isa
    chapter: 25
    verse: 8
    text: 'He will swallow up death in victory; and the Lord GOD will wipe away tears from off all faces; and the rebuke of his people shall he take away from off all the earth: for the LORD hath spoken it.'
    web: He has swallowed up death forever! The Lord GOD will wipe away tears from off all faces. He will take the reproach of his people away from off all the earth, for the LORD has spoken it.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.9
    name: Isaiah 25:9
    apiRef: Isaiah25:9
    book: Isa
    chapter: 25
    verse: 9
    text: 'And it shall be said in that day, Lo, this is our God; we have waited for him, and he will save us: this is the LORD; we have waited for him, we will be glad and rejoice in his salvation.'
    web: It shall be said in that day, “Behold, this is our God! We have waited for him, and he will save us! This is the LORD! We have waited for him. We will be glad and rejoice in his salvation!”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.10
    name: Isaiah 25:10
    apiRef: Isaiah25:10
    book: Isa
    chapter: 25
    verse: 10
    text: For in this mountain shall the hand of the LORD rest, and Moab shall be trodden down under him, even as straw is trodden down for the dunghill.
    web: For the LORD’s hand will rest in this mountain. Moab will be trodden down in his place, even like straw is trodden down in the water of the dunghill.
    people:
    - moab_2103
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.11
    name: Isaiah 25:11
    apiRef: Isaiah25:11
    book: Isa
    chapter: 25
    verse: 11
    text: 'And he shall spread forth his hands in the midst of them, as he that swimmeth spreadeth forth his hands to swim: and he shall bring down their pride together with the spoils of their hands.'
    web: He will spread out his hands in the middle of it, like one who swims spreads out hands to swim, but his pride will be humbled together with the craft of his hands.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.25.12
    name: Isaiah 25:12
    apiRef: Isaiah25:12
    book: Isa
    chapter: 25
    verse: 12
    text: And the fortress of the high fort of thy walls shall he bring down, lay low, and bring to the ground, even to the dust.
    web: He has brought the high fortress of your walls down, laid low, and brought to the ground, even to the dust.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.25
- type: Verse
  data:
    osis: Isa.26.1
    name: Isaiah 26:1
    apiRef: Isaiah26:1
    book: Isa
    chapter: 26
    verse: 1
    text: In that day shall this song be sung in the land of Judah; We have a strong city; salvation will God appoint for walls and bulwarks.
    web: 'In that day, this song will be sung in the land of Judah: “We have a strong city. God appoints salvation for walls and bulwarks.'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.2
    name: Isaiah 26:2
    apiRef: Isaiah26:2
    book: Isa
    chapter: 26
    verse: 2
    text: Open ye the gates, that the righteous nation which keepeth the truth may enter in.
    web: 'Open the gates, that the righteous nation may enter: the one which keeps faith.'
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.3
    name: Isaiah 26:3
    apiRef: Isaiah26:3
    book: Isa
    chapter: 26
    verse: 3
    text: 'Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.'
    web: You will keep whoever’s mind is steadfast in perfect peace, because he trusts in you.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.4
    name: Isaiah 26:4
    apiRef: Isaiah26:4
    book: Isa
    chapter: 26
    verse: 4
    text: 'Trust ye in the LORD for ever: for in the LORD JEHOVAH is everlasting strength:'
    web: Trust in the LORD forever; for in the LORD, the LORD, is an everlasting Rock.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.5
    name: Isaiah 26:5
    apiRef: Isaiah26:5
    book: Isa
    chapter: 26
    verse: 5
    text: For he bringeth down them that dwell on high; the lofty city, he layeth it low; he layeth it low, even to the ground; he bringeth it even to the dust.
    web: For he has brought down those who dwell on high, the lofty city. He lays it low. He lays it low even to the ground. He brings it even to the dust.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.6
    name: Isaiah 26:6
    apiRef: Isaiah26:6
    book: Isa
    chapter: 26
    verse: 6
    text: The foot shall tread it down, even the feet of the poor, and the steps of the needy.
    web: The foot shall tread it down, even the feet of the poor and the steps of the needy.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.7
    name: Isaiah 26:7
    apiRef: Isaiah26:7
    book: Isa
    chapter: 26
    verse: 7
    text: 'The way of the just is uprightness: thou, most upright, dost weigh the path of the just.'
    web: The way of the just is uprightness. You who are upright make the path of the righteous level.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.8
    name: Isaiah 26:8
    apiRef: Isaiah26:8
    book: Isa
    chapter: 26
    verse: 8
    text: Yea, in the way of thy judgments, O LORD, have we waited for thee; the desire of our soul is to thy name, and to the remembrance of thee.
    web: Yes, in the way of your judgments, LORD, we have waited for you. Your name and your renown are the desire of our soul.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.9
    name: Isaiah 26:9
    apiRef: Isaiah26:9
    book: Isa
    chapter: 26
    verse: 9
    text: 'With my soul have I desired thee in the night; yea, with my spirit within me will I seek thee early: for when thy judgments are in the earth, the inhabitants of the world will learn righteousness.'
    web: With my soul I have desired you in the night. Yes, with my spirit within me I will seek you earnestly; for when your judgments are on the earth, the inhabitants of the world learn righteousness.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.10
    name: Isaiah 26:10
    apiRef: Isaiah26:10
    book: Isa
    chapter: 26
    verse: 10
    text: 'Let favour be shewed to the wicked, yet will he not learn righteousness: in the land of uprightness will he deal unjustly, and will not behold the majesty of the LORD.'
    web: Let favor be shown to the wicked, yet he will not learn righteousness. In the land of uprightness he will deal wrongfully, and will not see the LORD’s majesty.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.11
    name: Isaiah 26:11
    apiRef: Isaiah26:11
    book: Isa
    chapter: 26
    verse: 11
    text: 'LORD, when thy hand is lifted up, they will not see: but they shall see, and be ashamed for their envy at the people; yea, the fire of thine enemies shall devour them.'
    web: LORD, your hand is lifted up, yet they don’t see; but they will see your zeal for the people and be disappointed. Yes, fire will consume your adversaries.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.12
    name: Isaiah 26:12
    apiRef: Isaiah26:12
    book: Isa
    chapter: 26
    verse: 12
    text: 'LORD, thou wilt ordain peace for us: for thou also hast wrought all our works in us.'
    web: LORD, you will ordain peace for us, for you have also done all our work for us.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.13
    name: Isaiah 26:13
    apiRef: Isaiah26:13
    book: Isa
    chapter: 26
    verse: 13
    text: 'O LORD our God, other lords beside thee have had dominion over us: but by thee only will we make mention of thy name.'
    web: LORD our God, other lords besides you have had dominion over us, but we will only acknowledge your name.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.14
    name: Isaiah 26:14
    apiRef: Isaiah26:14
    book: Isa
    chapter: 26
    verse: 14
    text: 'They are dead, they shall not live; they are deceased, they shall not rise: therefore hast thou visited and destroyed them, and made all their memory to perish.'
    web: The dead shall not live. The departed spirits shall not rise. Therefore you have visited and destroyed them, and caused all memory of them to perish.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.15
    name: Isaiah 26:15
    apiRef: Isaiah26:15
    book: Isa
    chapter: 26
    verse: 15
    text: 'Thou hast increased the nation, O LORD, thou hast increased the nation: thou art glorified: thou hadst removed it far unto all the ends of the earth.'
    web: You have increased the nation, O LORD. You have increased the nation! You are glorified! You have enlarged all the borders of the land.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.16
    name: Isaiah 26:16
    apiRef: Isaiah26:16
    book: Isa
    chapter: 26
    verse: 16
    text: LORD, in trouble have they visited thee, they poured out a prayer when thy chastening was upon them.
    web: LORD, in trouble they have visited you. They poured out a prayer when your chastening was on them.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.17
    name: Isaiah 26:17
    apiRef: Isaiah26:17
    book: Isa
    chapter: 26
    verse: 17
    text: Like as a woman with child, that draweth near the time of her delivery, is in pain, and crieth out in her pangs; so have we been in thy sight, O LORD.
    web: Just as a woman with child, who draws near the time of her delivery, is in pain and cries out in her pangs, so we have been before you, LORD.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.18
    name: Isaiah 26:18
    apiRef: Isaiah26:18
    book: Isa
    chapter: 26
    verse: 18
    text: We have been with child, we have been in pain, we have as it were brought forth wind; we have not wrought any deliverance in the earth; neither have the inhabitants of the world fallen.
    web: We have been with child. We have been in pain. We gave birth, it seems, only to wind. We have not worked any deliverance on the earth; neither have the inhabitants of the world fallen.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.19
    name: Isaiah 26:19
    apiRef: Isaiah26:19
    book: Isa
    chapter: 26
    verse: 19
    text: 'Thy dead men shall live, together with my dead body shall they arise. Awake and sing, ye that dwell in dust: for thy dew is as the dew of herbs, and the earth shall cast out the dead.'
    web: Your dead shall live. Their dead bodies shall arise. Awake and sing, you who dwell in the dust; for your dew is like the dew of herbs, and the earth will cast out the departed spirits.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.20
    name: Isaiah 26:20
    apiRef: Isaiah26:20
    book: Isa
    chapter: 26
    verse: 20
    text: 'Come, my people, enter thou into thy chambers, and shut thy doors about thee: hide thyself as it were for a little moment, until the indignation be overpast.'
    web: Come, my people, enter into your rooms, and shut your doors behind you. Hide yourself for a little moment, until the indignation is past.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.26.21
    name: Isaiah 26:21
    apiRef: Isaiah26:21
    book: Isa
    chapter: 26
    verse: 21
    text: 'For, behold, the LORD cometh out of his place to punish the inhabitants of the earth for their iniquity: the earth also shall disclose her blood, and shall no more cover her slain.'
    web: For, behold, the LORD comes out of his place to punish the inhabitants of the earth for their iniquity. The earth also will disclose her blood, and will no longer cover her slain.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.26
- type: Verse
  data:
    osis: Isa.27.1
    name: Isaiah 27:1
    apiRef: Isaiah27:1
    book: Isa
    chapter: 27
    verse: 1
    text: In that day the LORD with his sore and great and strong sword shall punish leviathan the piercing serpent, even leviathan that crooked serpent; and he shall slay the dragon that is in the sea.
    web: In that day, the LORD with his hard and great and strong sword will punish leviathan, the fleeing serpent, and leviathan, the twisted serpent; and he will kill the dragon that is in the sea.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.2
    name: Isaiah 27:2
    apiRef: Isaiah27:2
    book: Isa
    chapter: 27
    verse: 2
    text: In that day sing ye unto her, A vineyard of red wine.
    web: In that day, sing to her, “A pleasant vineyard!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.3
    name: Isaiah 27:3
    apiRef: Isaiah27:3
    book: Isa
    chapter: 27
    verse: 3
    text: 'I the LORD do keep it; I will water it every moment: lest any hurt it, I will keep it night and day.'
    web: I, the LORD, am its keeper. I will water it every moment. Lest anyone damage it, I will keep it night and day.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.4
    name: Isaiah 27:4
    apiRef: Isaiah27:4
    book: Isa
    chapter: 27
    verse: 4
    text: 'Fury is not in me: who would set the briers and thorns against me in battle? I would go through them, I would burn them together.'
    web: Wrath is not in me, but if I should find briers and thorns, I would do battle! I would march on them and I would burn them together.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.5
    name: Isaiah 27:5
    apiRef: Isaiah27:5
    book: Isa
    chapter: 27
    verse: 5
    text: Or let him take hold of my strength, that he may make peace with me; and he shall make peace with me.
    web: Or else let him take hold of my strength, that he may make peace with me. Let him make peace with me.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.6
    name: Isaiah 27:6
    apiRef: Isaiah27:6
    book: Isa
    chapter: 27
    verse: 6
    text: 'He shall cause them that come of Jacob to take root: Israel shall blossom and bud, and fill the face of the world with fruit.'
    web: In days to come, Jacob will take root. Israel will blossom and bud. They will fill the surface of the world with fruit.
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.7
    name: Isaiah 27:7
    apiRef: Isaiah27:7
    book: Isa
    chapter: 27
    verse: 7
    text: Hath he smitten him, as he smote those that smote him? or is he slain according to the slaughter of them that are slain by him?
    web: Has he struck them as he struck those who struck them? Or are they killed like those who killed them were killed?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.8
    name: Isaiah 27:8
    apiRef: Isaiah27:8
    book: Isa
    chapter: 27
    verse: 8
    text: 'In measure, when it shooteth forth, thou wilt debate with it: he stayeth his rough wind in the day of the east wind.'
    web: In measure, when you send them away, you contend with them. He has removed them with his rough blast in the day of the east wind.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.9
    name: Isaiah 27:9
    apiRef: Isaiah27:9
    book: Isa
    chapter: 27
    verse: 9
    text: By this therefore shall the iniquity of Jacob be purged; and this is all the fruit to take away his sin; when he maketh all the stones of the altar as chalkstones that are beaten in sunder, the groves and images shall not stand up.
    web: 'Therefore by this the iniquity of Jacob will be forgiven, and this is all the fruit of taking away his sin: that he makes all the stones of the altar as chalk stones that are beaten in pieces, so that the Asherah poles and the incense altars shall rise no more.'
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.10
    name: Isaiah 27:10
    apiRef: Isaiah27:10
    book: Isa
    chapter: 27
    verse: 10
    text: 'Yet the defenced city shall be desolate, and the habitation forsaken, and left like a wilderness: there shall the calf feed, and there shall he lie down, and consume the branches thereof.'
    web: For the fortified city is solitary, a habitation deserted and forsaken, like the wilderness. The calf will feed there, and there he will lie down, and consume its branches.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.11
    name: Isaiah 27:11
    apiRef: Isaiah27:11
    book: Isa
    chapter: 27
    verse: 11
    text: 'When the boughs thereof are withered, they shall be broken off: the women come, and set them on fire: for it is a people of no understanding: therefore he that made them will not have mercy on them, and he that formed them will shew them no favour.'
    web: When its boughs are withered, they will be broken off. The women will come and set them on fire, for they are a people of no understanding. Therefore he who made them will not have compassion on them, and he who formed them will show them no favor.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.12
    name: Isaiah 27:12
    apiRef: Isaiah27:12
    book: Isa
    chapter: 27
    verse: 12
    text: And it shall come to pass in that day, that the LORD shall beat off from the channel of the river unto the stream of Egypt, and ye shall be gathered one by one, O ye children of Israel.
    web: It will happen in that day that the LORD will thresh from the flowing stream of the Euphrates to the brook of Egypt; and you will be gathered one by one, children of Israel.
    people:
    - israel_682
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.27.13
    name: Isaiah 27:13
    apiRef: Isaiah27:13
    book: Isa
    chapter: 27
    verse: 13
    text: And it shall come to pass in that day, that the great trumpet shall be blown, and they shall come which were ready to perish in the land of Assyria, and the outcasts in the land of Egypt, and shall worship the LORD in the holy mount at Jerusalem.
    web: It will happen in that day that a great trumpet will be blown; and those who were ready to perish in the land of Assyria, and those who were outcasts in the land of Egypt, shall come; and they will worship the LORD in the holy mountain at Jerusalem.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.27
- type: Verse
  data:
    osis: Isa.28.1
    name: Isaiah 28:1
    apiRef: Isaiah28:1
    book: Isa
    chapter: 28
    verse: 1
    text: Woe to the crown of pride, to the drunkards of Ephraim, whose glorious beauty is a fading flower, which are on the head of the fat valleys of them that are overcome with wine!
    web: Woe to the crown of pride of the drunkards of Ephraim, and to the fading flower of his glorious beauty, which is on the head of the fertile valley of those who are overcome with wine!
    people:
    - ephraim_1206
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.2
    name: Isaiah 28:2
    apiRef: Isaiah28:2
    book: Isa
    chapter: 28
    verse: 2
    text: Behold, the Lord hath a mighty and strong one, which as a tempest of hail and a destroying storm, as a flood of mighty waters overflowing, shall cast down to the earth with the hand.
    web: Behold, the Lord has one who is mighty and strong. Like a storm of hail, a destroying storm, and like a storm of mighty waters overflowing, he will cast them down to the earth with his hand.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.3
    name: Isaiah 28:3
    apiRef: Isaiah28:3
    book: Isa
    chapter: 28
    verse: 3
    text: 'The crown of pride, the drunkards of Ephraim, shall be trodden under feet:'
    web: The crown of pride of the drunkards of Ephraim will be trodden under foot.
    people:
    - ephraim_1206
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.4
    name: Isaiah 28:4
    apiRef: Isaiah28:4
    book: Isa
    chapter: 28
    verse: 4
    text: And the glorious beauty, which is on the head of the fat valley, shall be a fading flower, and as the hasty fruit before the summer; which when he that looketh upon it seeth, while it is yet in his hand he eateth it up.
    web: The fading flower of his glorious beauty, which is on the head of the fertile valley, shall be like the first-ripe fig before the summer, which someone picks and eats as soon as he sees it.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.5
    name: Isaiah 28:5
    apiRef: Isaiah28:5
    book: Isa
    chapter: 28
    verse: 5
    text: In that day shall the LORD of hosts be for a crown of glory, and for a diadem of beauty, unto the residue of his people,
    web: In that day, the LORD of Armies will become a crown of glory and a diadem of beauty to the residue of his people,
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.6
    name: Isaiah 28:6
    apiRef: Isaiah28:6
    book: Isa
    chapter: 28
    verse: 6
    text: And for a spirit of judgment to him that sitteth in judgment, and for strength to them that turn the battle to the gate.
    web: and a spirit of justice to him who sits in judgment, and strength to those who turn back the battle at the gate.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.7
    name: Isaiah 28:7
    apiRef: Isaiah28:7
    book: Isa
    chapter: 28
    verse: 7
    text: But they also have erred through wine, and through strong drink are out of the way; the priest and the prophet have erred through strong drink, they are swallowed up of wine, they are out of the way through strong drink; they err in vision, they stumble in judgment.
    web: They also reel with wine, and stagger with strong drink. The priest and the prophet reel with strong drink. They are swallowed up by wine. They stagger with strong drink. They err in vision. They stumble in judgment.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.8
    name: Isaiah 28:8
    apiRef: Isaiah28:8
    book: Isa
    chapter: 28
    verse: 8
    text: For all tables are full of vomit and filthiness, so that there is no place clean.
    web: For all tables are completely full of filthy vomit and filthiness.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.9
    name: Isaiah 28:9
    apiRef: Isaiah28:9
    book: Isa
    chapter: 28
    verse: 9
    text: Whom shall he teach knowledge? and whom shall he make to understand doctrine? them that are weaned from the milk, and drawn from the breasts.
    web: Whom will he teach knowledge? To whom will he explain the message? Those who are weaned from the milk, and drawn from the breasts?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.10
    name: Isaiah 28:10
    apiRef: Isaiah28:10
    book: Isa
    chapter: 28
    verse: 10
    text: 'For precept must be upon precept, precept upon precept; line upon line, line upon line; here a little, and there a little:'
    web: For it is precept on precept, precept on precept; line on line, line on line; here a little, there a little.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.11
    name: Isaiah 28:11
    apiRef: Isaiah28:11
    book: Isa
    chapter: 28
    verse: 11
    text: For with stammering lips and another tongue will he speak to this people.
    web: But he will speak to this nation with stammering lips and in another language,
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.12
    name: Isaiah 28:12
    apiRef: Isaiah28:12
    book: Isa
    chapter: 28
    verse: 12
    text: 'To whom he said, This is the rest wherewith ye may cause the weary to rest; and this is the refreshing: yet they would not hear.'
    web: to whom he said, “This is the resting place. Give rest to the weary,” and “This is the refreshing;” yet they would not hear.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.13
    name: Isaiah 28:13
    apiRef: Isaiah28:13
    book: Isa
    chapter: 28
    verse: 13
    text: But the word of the LORD was unto them precept upon precept, precept upon precept; line upon line, line upon line; here a little, and there a little; that they might go, and fall backward, and be broken, and snared, and taken.
    web: Therefore the LORD’s word will be to them precept on precept, precept on precept; line on line, line on line; here a little, there a little; that they may go, fall backward, be broken, be snared, and be taken.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.14
    name: Isaiah 28:14
    apiRef: Isaiah28:14
    book: Isa
    chapter: 28
    verse: 14
    text: Wherefore hear the word of the LORD, ye scornful men, that rule this people which is in Jerusalem.
    web: 'Therefore hear the LORD’s word, you scoffers, that rule this people in Jerusalem:'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.15
    name: Isaiah 28:15
    apiRef: Isaiah28:15
    book: Isa
    chapter: 28
    verse: 15
    text: 'Because ye have said, We have made a covenant with death, and with hell are we at agreement; when the overflowing scourge shall pass through, it shall not come unto us: for we have made lies our refuge, and under falsehood have we hid ourselves:'
    web: “Because you have said, ‘We have made a covenant with death, and we are in agreement with Sheol. When the overflowing scourge passes through, it won’t come to us; for we have made lies our refuge, and we have hidden ourselves under falsehood.’”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.16
    name: Isaiah 28:16
    apiRef: Isaiah28:16
    book: Isa
    chapter: 28
    verse: 16
    text: 'Therefore thus saith the Lord GOD, Behold, I lay in Zion for a foundation a stone, a tried stone, a precious corner stone, a sure foundation: he that believeth shall not make haste.'
    web: Therefore the Lord GOD says, “Behold, I lay in Zion for a foundation a stone, a tried stone, a precious cornerstone of a sure foundation. He who believes shall not act hastily.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.17
    name: Isaiah 28:17
    apiRef: Isaiah28:17
    book: Isa
    chapter: 28
    verse: 17
    text: 'Judgment also will I lay to the line, and righteousness to the plummet: and the hail shall sweep away the refuge of lies, and the waters shall overflow the hiding place.'
    web: I will make justice the measuring line, and righteousness the plumb line. The hail will sweep away the refuge of lies, and the waters will overflow the hiding place.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.18
    name: Isaiah 28:18
    apiRef: Isaiah28:18
    book: Isa
    chapter: 28
    verse: 18
    text: And your covenant with death shall be disannulled, and your agreement with hell shall not stand; when the overflowing scourge shall pass through, then ye shall be trodden down by it.
    web: Your covenant with death shall be annulled, and your agreement with Sheol shall not stand. When the overflowing scourge passes through, then you will be trampled down by it.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.19
    name: Isaiah 28:19
    apiRef: Isaiah28:19
    book: Isa
    chapter: 28
    verse: 19
    text: 'From the time that it goeth forth it shall take you: for morning by morning shall it pass over, by day and by night: and it shall be a vexation only to understand the report.'
    web: As often as it passes through, it will seize you; for morning by morning it will pass through, by day and by night; and it will be nothing but terror to understand the message.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.20
    name: Isaiah 28:20
    apiRef: Isaiah28:20
    book: Isa
    chapter: 28
    verse: 20
    text: 'For the bed is shorter than that a man can stretch himself on it: and the covering narrower than that he can wrap himself in it.'
    web: For the bed is too short to stretch out on, and the blanket is too narrow to wrap oneself in.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.21
    name: Isaiah 28:21
    apiRef: Isaiah28:21
    book: Isa
    chapter: 28
    verse: 21
    text: For the LORD shall rise up as in mount Perazim, he shall be wroth as in the valley of Gibeon, that he may do his work, his strange work; and bring to pass his act, his strange act.
    web: For the LORD will rise up as on Mount Perazim. He will be angry as in the valley of Gibeon; that he may do his work, his unusual work, and bring to pass his act, his extraordinary act.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.22
    name: Isaiah 28:22
    apiRef: Isaiah28:22
    book: Isa
    chapter: 28
    verse: 22
    text: 'Now therefore be ye not mockers, lest your bands be made strong: for I have heard from the Lord GOD of hosts a consumption, even determined upon the whole earth.'
    web: Now therefore don’t be scoffers, lest your bonds be made strong; for I have heard a decree of destruction from the Lord, GOD of Armies, on the whole earth.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.23
    name: Isaiah 28:23
    apiRef: Isaiah28:23
    book: Isa
    chapter: 28
    verse: 23
    text: Give ye ear, and hear my voice; hearken, and hear my speech.
    web: Give ear, and hear my voice! Listen, and hear my speech!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.24
    name: Isaiah 28:24
    apiRef: Isaiah28:24
    book: Isa
    chapter: 28
    verse: 24
    text: Doth the plowman plow all day to sow? doth he open and break the clods of his ground?
    web: Does he who plows to sow plow continually? Does he keep turning the soil and breaking the clods?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.25
    name: Isaiah 28:25
    apiRef: Isaiah28:25
    book: Isa
    chapter: 28
    verse: 25
    text: When he hath made plain the face thereof, doth he not cast abroad the fitches, and scatter the cummin, and cast in the principal wheat and the appointed barley and the rie in their place?
    web: When he has leveled its surface, doesn’t he plant the dill, and scatter the cumin seed, and put in the wheat in rows, the barley in the appointed place, and the spelt in its place?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.26
    name: Isaiah 28:26
    apiRef: Isaiah28:26
    book: Isa
    chapter: 28
    verse: 26
    text: For his God doth instruct him to discretion, and doth teach him.
    web: For his God instructs him in right judgment and teaches him.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.27
    name: Isaiah 28:27
    apiRef: Isaiah28:27
    book: Isa
    chapter: 28
    verse: 27
    text: For the fitches are not threshed with a threshing instrument, neither is a cart wheel turned about upon the cummin; but the fitches are beaten out with a staff, and the cummin with a rod.
    web: For the dill isn’t threshed with a sharp instrument, neither is a cart wheel turned over the cumin; but the dill is beaten out with a stick, and the cumin with a rod.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.28
    name: Isaiah 28:28
    apiRef: Isaiah28:28
    book: Isa
    chapter: 28
    verse: 28
    text: Bread corn is bruised; because he will not ever be threshing it, nor break it with the wheel of his cart, nor bruise it with his horsemen.
    web: Bread flour must be ground; so he will not always be threshing it. Although he drives the wheel of his threshing cart over it, his horses don’t grind it.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.28.29
    name: Isaiah 28:29
    apiRef: Isaiah28:29
    book: Isa
    chapter: 28
    verse: 29
    text: This also cometh forth from the LORD of hosts, which is wonderful in counsel, and excellent in working.
    web: This also comes out from the LORD of Armies, who is wonderful in counsel, and excellent in wisdom.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.28
- type: Verse
  data:
    osis: Isa.29.1
    name: Isaiah 29:1
    apiRef: Isaiah29:1
    book: Isa
    chapter: 29
    verse: 1
    text: Woe to Ariel, to Ariel, the city where David dwelt! add ye year to year; let them kill sacrifices.
    web: Woe to Ariel! Ariel, the city where David encamped! Add year to year; let the feasts come around;
    people:
    - david_994
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.2
    name: Isaiah 29:2
    apiRef: Isaiah29:2
    book: Isa
    chapter: 29
    verse: 2
    text: 'Yet I will distress Ariel, and there shall be heaviness and sorrow: and it shall be unto me as Ariel.'
    web: then I will distress Ariel, and there will be mourning and lamentation. She shall be to me as an altar hearth.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.3
    name: Isaiah 29:3
    apiRef: Isaiah29:3
    book: Isa
    chapter: 29
    verse: 3
    text: And I will camp against thee round about, and will lay siege against thee with a mount, and I will raise forts against thee.
    web: I will encamp against you all around you, and will lay siege against you with posted troops. I will raise siege works against you.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.4
    name: Isaiah 29:4
    apiRef: Isaiah29:4
    book: Isa
    chapter: 29
    verse: 4
    text: And thou shalt be brought down, and shalt speak out of the ground, and thy speech shall be low out of the dust, and thy voice shall be, as of one that hath a familiar spirit, out of the ground, and thy speech shall whisper out of the dust.
    web: You will be brought down, and will speak out of the ground. Your speech will mumble out of the dust. Your voice will be as of one who has a familiar spirit, out of the ground, and your speech will whisper out of the dust.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.5
    name: Isaiah 29:5
    apiRef: Isaiah29:5
    book: Isa
    chapter: 29
    verse: 5
    text: 'Moreover the multitude of thy strangers shall be like small dust, and the multitude of the terrible ones shall be as chaff that passeth away: yea, it shall be at an instant suddenly.'
    web: But the multitude of your foes will be like fine dust, and the multitude of the ruthless ones like chaff that blows away. Yes, it will be in an instant, suddenly.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.6
    name: Isaiah 29:6
    apiRef: Isaiah29:6
    book: Isa
    chapter: 29
    verse: 6
    text: Thou shalt be visited of the LORD of hosts with thunder, and with earthquake, and great noise, with storm and tempest, and the flame of devouring fire.
    web: She will be visited by the LORD of Armies with thunder, with earthquake, with great noise, with whirlwind and storm, and with the flame of a devouring fire.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.7
    name: Isaiah 29:7
    apiRef: Isaiah29:7
    book: Isa
    chapter: 29
    verse: 7
    text: And the multitude of all the nations that fight against Ariel, even all that fight against her and her munition, and that distress her, shall be as a dream of a night vision.
    web: The multitude of all the nations that fight against Ariel, even all who fight against her and her stronghold, and who distress her, will be like a dream, a vision of the night.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.8
    name: Isaiah 29:8
    apiRef: Isaiah29:8
    book: Isa
    chapter: 29
    verse: 8
    text: 'It shall even be as when an hungry man dreameth, and, behold, he eateth; but he awaketh, and his soul is empty: or as when a thirsty man dreameth, and, behold, he drinketh; but he awaketh, and, behold, he is faint, and his soul hath appetite: so shall the multitude of all the nations be, that fight against mount Zion.'
    web: It will be like when a hungry man dreams, and behold, he eats; but he awakes, and his hunger isn’t satisfied; or like when a thirsty man dreams, and behold, he drinks; but he awakes, and behold, he is faint, and he is still thirsty. The multitude of all the nations that fight against Mount Zion will be like that.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.9
    name: Isaiah 29:9
    apiRef: Isaiah29:9
    book: Isa
    chapter: 29
    verse: 9
    text: 'Stay yourselves, and wonder; cry ye out, and cry: they are drunken, but not with wine; they stagger, but not with strong drink.'
    web: Pause and wonder! Blind yourselves and be blind! They are drunken, but not with wine; they stagger, but not with strong drink.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.10
    name: Isaiah 29:10
    apiRef: Isaiah29:10
    book: Isa
    chapter: 29
    verse: 10
    text: 'For the LORD hath poured out upon you the spirit of deep sleep, and hath closed your eyes: the prophets and your rulers, the seers hath he covered.'
    web: For the LORD has poured out on you a spirit of deep sleep, and has closed your eyes, the prophets; and he has covered your heads, the seers.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.11
    name: Isaiah 29:11
    apiRef: Isaiah29:11
    book: Isa
    chapter: 29
    verse: 11
    text: 'And the vision of all is become unto you as the words of a book that is sealed, which men deliver to one that is learned, saying, Read this, I pray thee: and he saith, I cannot; for it is sealed:'
    web: All vision has become to you like the words of a book that is sealed, which men deliver to one who is educated, saying, “Read this, please;” and he says, “I can’t, for it is sealed;”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.12
    name: Isaiah 29:12
    apiRef: Isaiah29:12
    book: Isa
    chapter: 29
    verse: 12
    text: 'And the book is delivered to him that is not learned, saying, Read this, I pray thee: and he saith, I am not learned.'
    web: and the book is delivered to one who is not educated, saying, “Read this, please;” and he says, “I can’t read.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.13
    name: Isaiah 29:13
    apiRef: Isaiah29:13
    book: Isa
    chapter: 29
    verse: 13
    text: 'Wherefore the Lord said, Forasmuch as this people draw near me with their mouth, and with their lips do honour me, but have removed their heart far from me, and their fear toward me is taught by the precept of men:'
    web: The Lord said, “Because this people draws near with their mouth and honors me with their lips, but they have removed their heart far from me, and their fear of me is a commandment of men which has been taught;
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.14
    name: Isaiah 29:14
    apiRef: Isaiah29:14
    book: Isa
    chapter: 29
    verse: 14
    text: 'Therefore, behold, I will proceed to do a marvellous work among this people, even a marvellous work and a wonder: for the wisdom of their wise men shall perish, and the understanding of their prudent men shall be hid.'
    web: therefore, behold, I will proceed to do a marvelous work among this people, even a marvelous work and a wonder; and the wisdom of their wise men will perish, and the understanding of their prudent men will be hidden.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.15
    name: Isaiah 29:15
    apiRef: Isaiah29:15
    book: Isa
    chapter: 29
    verse: 15
    text: Woe unto them that seek deep to hide their counsel from the LORD, and their works are in the dark, and they say, Who seeth us? and who knoweth us?
    web: Woe to those who deeply hide their counsel from the LORD, and whose deeds are in the dark, and who say, “Who sees us?” and “Who knows us?”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.16
    name: Isaiah 29:16
    apiRef: Isaiah29:16
    book: Isa
    chapter: 29
    verse: 16
    text: 'Surely your turning of things upside down shall be esteemed as the potter’s clay: for shall the work say of him that made it, He made me not? or shall the thing framed say of him that framed it, He had no understanding?'
    web: You turn things upside down! Should the potter be thought to be like clay, that the thing made should say about him who made it, “He didn’t make me;” or the thing formed say of him who formed it, “He has no understanding”?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.17
    name: Isaiah 29:17
    apiRef: Isaiah29:17
    book: Isa
    chapter: 29
    verse: 17
    text: Is it not yet a very little while, and Lebanon shall be turned into a fruitful field, and the fruitful field shall be esteemed as a forest?
    web: Isn’t it yet a very little while, and Lebanon will be turned into a fruitful field, and the fruitful field will be regarded as a forest?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.18
    name: Isaiah 29:18
    apiRef: Isaiah29:18
    book: Isa
    chapter: 29
    verse: 18
    text: And in that day shall the deaf hear the words of the book, and the eyes of the blind shall see out of obscurity, and out of darkness.
    web: In that day, the deaf will hear the words of the book, and the eyes of the blind will see out of obscurity and out of darkness.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.19
    name: Isaiah 29:19
    apiRef: Isaiah29:19
    book: Isa
    chapter: 29
    verse: 19
    text: The meek also shall increase their joy in the LORD, and the poor among men shall rejoice in the Holy One of Israel.
    web: The humble also will increase their joy in the LORD, and the poor among men will rejoice in the Holy One of Israel.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.20
    name: Isaiah 29:20
    apiRef: Isaiah29:20
    book: Isa
    chapter: 29
    verse: 20
    text: 'For the terrible one is brought to nought, and the scorner is consumed, and all that watch for iniquity are cut off:'
    web: For the ruthless is brought to nothing, and the scoffer ceases, and all those who are alert to do evil are cut off—
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.21
    name: Isaiah 29:21
    apiRef: Isaiah29:21
    book: Isa
    chapter: 29
    verse: 21
    text: That make a man an offender for a word, and lay a snare for him that reproveth in the gate, and turn aside the just for a thing of nought.
    web: who cause a person to be indicted by a word, and lay a snare for one who reproves in the gate, and who deprive the innocent of justice with false testimony.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.22
    name: Isaiah 29:22
    apiRef: Isaiah29:22
    book: Isa
    chapter: 29
    verse: 22
    text: Therefore thus saith the LORD, who redeemed Abraham, concerning the house of Jacob, Jacob shall not now be ashamed, neither shall his face now wax pale.
    web: 'Therefore the LORD, who redeemed Abraham, says concerning the house of Jacob: “Jacob shall no longer be ashamed, neither shall his face grow pale.'
    people:
    - abraham_58
    - israel_682
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.23
    name: Isaiah 29:23
    apiRef: Isaiah29:23
    book: Isa
    chapter: 29
    verse: 23
    text: But when he seeth his children, the work of mine hands, in the midst of him, they shall sanctify my name, and sanctify the Holy One of Jacob, and shall fear the God of Israel.
    web: But when he sees his children, the work of my hands, in the middle of him, they will sanctify my name. Yes, they will sanctify the Holy One of Jacob, and will stand in awe of the God of Israel.
    people:
    - israel_682
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.29.24
    name: Isaiah 29:24
    apiRef: Isaiah29:24
    book: Isa
    chapter: 29
    verse: 24
    text: They also that erred in spirit shall come to understanding, and they that murmured shall learn doctrine.
    web: They also who err in spirit will come to understanding, and those who grumble will receive instruction.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.29
- type: Verse
  data:
    osis: Isa.30.1
    name: Isaiah 30:1
    apiRef: Isaiah30:1
    book: Isa
    chapter: 30
    verse: 1
    text: 'Woe to the rebellious children, saith the LORD, that take counsel, but not of me; and that cover with a covering, but not of my spirit, that they may add sin to sin:'
    web: “Woe to the rebellious children”, says the LORD, “who take counsel, but not from me; and who make an alliance, but not with my Spirit, that they may add sin to sin;
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.2
    name: Isaiah 30:2
    apiRef: Isaiah30:2
    book: Isa
    chapter: 30
    verse: 2
    text: That walk to go down into Egypt, and have not asked at my mouth; to strengthen themselves in the strength of Pharaoh, and to trust in the shadow of Egypt!
    web: who set out to go down into Egypt without asking for my advice, to strengthen themselves in the strength of Pharaoh, and to take refuge in the shadow of Egypt!
    people:
    - pharaoh_2333
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.3
    name: Isaiah 30:3
    apiRef: Isaiah30:3
    book: Isa
    chapter: 30
    verse: 3
    text: Therefore shall the strength of Pharaoh be your shame, and the trust in the shadow of Egypt your confusion.
    web: Therefore the strength of Pharaoh will be your shame, and the refuge in the shadow of Egypt your confusion.
    people:
    - pharaoh_2333
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.4
    name: Isaiah 30:4
    apiRef: Isaiah30:4
    book: Isa
    chapter: 30
    verse: 4
    text: For his princes were at Zoan, and his ambassadors came to Hanes.
    web: For their princes are at Zoan, and their ambassadors have come to Hanes.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.5
    name: Isaiah 30:5
    apiRef: Isaiah30:5
    book: Isa
    chapter: 30
    verse: 5
    text: They were all ashamed of a people that could not profit them, nor be an help nor profit, but a shame, and also a reproach.
    web: They shall all be ashamed because of a people that can’t profit them, that are not a help nor profit, but a shame, and also a reproach.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.6
    name: Isaiah 30:6
    apiRef: Isaiah30:6
    book: Isa
    chapter: 30
    verse: 6
    text: 'The burden of the beasts of the south: into the land of trouble and anguish, from whence come the young and old lion, the viper and fiery flying serpent, they will carry their riches upon the shoulders of young asses, and their treasures upon the bunches of camels, to a people that shall not profit them.'
    web: The burden of the animals of the South. Through the land of trouble and anguish, of the lioness and the lion, the viper and fiery flying serpent, they carry their riches on the shoulders of young donkeys, and their treasures on the humps of camels, to an unprofitable people.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.7
    name: Isaiah 30:7
    apiRef: Isaiah30:7
    book: Isa
    chapter: 30
    verse: 7
    text: 'For the Egyptians shall help in vain, and to no purpose: therefore have I cried concerning this, Their strength is to sit still.'
    web: For Egypt helps in vain, and to no purpose; therefore I have called her Rahab who sits still.
    event: Prophecies of Isaiah
