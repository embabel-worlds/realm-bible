    name: Isaiah 63:13
    apiRef: Isaiah63:13
    book: Isa
    chapter: 63
    verse: 13
    text: That led them through the deep, as an horse in the wilderness, that they should not stumble?
    web: Who led them through the depths, like a horse in the wilderness, so that they didn’t stumble?
