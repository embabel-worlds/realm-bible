  data:
    osis: Isa.23.15
    name: Isaiah 23:15
    apiRef: Isaiah23:15
    book: Isa
    chapter: 23
    verse: 15
    text: 'And it shall come to pass in that day, that Tyre shall be forgotten seventy years, according to the days of one king: after the end of seventy years shall Tyre sing as an harlot.'
    web: It will come to pass in that day that Tyre will be forgotten seventy years, according to the days of one king. After the end of seventy years it will be to Tyre like in the song of the prostitute.
    event: Prophecies of Isaiah
  relations:
