  data:
    osis: Isa.19.13
    name: Isaiah 19:13
    apiRef: Isaiah19:13
    book: Isa
    chapter: 19
    verse: 13
    text: The princes of Zoan are become fools, the princes of Noph are deceived; they have also seduced Egypt, even they that are the stay of the tribes thereof.
    web: The princes of Zoan have become fools. The princes of Memphis are deceived. They have caused Egypt to go astray, those who are the cornerstone of her tribes.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
- type: Verse
  data:
    osis: Isa.19.14
    name: Isaiah 19:14
    apiRef: Isaiah19:14
    book: Isa
    chapter: 19
    verse: 14
    text: 'The LORD hath mingled a perverse spirit in the midst thereof: and they have caused Egypt to err in every work thereof, as a drunken man staggereth in his vomit.'
    web: The LORD has mixed a spirit of perverseness in the middle of her; and they have caused Egypt to go astray in all of its works, like a drunken man staggers in his vomit.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
