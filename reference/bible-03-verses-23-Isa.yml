    name: Isaiah 63:9
    apiRef: Isaiah63:9
    book: Isa
    chapter: 63
    verse: 9
    text: 'In all their affliction he was afflicted, and the angel of his presence saved them: in his love and in his pity he redeemed them; and he bare them, and carried them all the days of old.'
    web: In all their affliction he was afflicted, and the angel of his presence saved them. In his love and in his pity he redeemed them. He bore them, and carried them all the days of old.
