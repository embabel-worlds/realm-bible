  data:
    osis: Isa.23.9
    name: Isaiah 23:9
    apiRef: Isaiah23:9
    book: Isa
    chapter: 23
    verse: 9
    text: The LORD of hosts hath purposed it, to stain the pride of all glory, and to bring into contempt all the honourable of the earth.
    web: The LORD of Armies has planned it, to stain the pride of all glory, to bring into contempt all the honorable of the earth.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
