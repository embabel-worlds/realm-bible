  data:
    osis: Isa.51.2
    name: Isaiah 51:2
    apiRef: Isaiah51:2
    book: Isa
    chapter: 51
    verse: 2
    text: 'Look unto Abraham your father, and unto Sarah that bare you: for I called him alone, and blessed him, and increased him.'
    web: Look to Abraham your father, and to Sarah who bore you; for when he was but one I called him, I blessed him, and made him many.
    people:
    - abraham_58
    - sarah_2473
    event: Prophecies of Isaiah
  relations:
