    apiRef: Isaiah62:11
    book: Isa
    chapter: 62
    verse: 11
    text: Behold, the LORD hath proclaimed unto the end of the world, Say ye to the daughter of Zion, Behold, thy salvation cometh; behold, his reward is with him, and his work before him.
    web: 'Behold, the LORD has proclaimed to the end of the earth: “Say to the daughter of Zion, ‘Behold, your salvation comes! Behold, his reward is with him, and his recompense before him!’”'
