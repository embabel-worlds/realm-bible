    osis: Isa.63.10
    name: Isaiah 63:10
    apiRef: Isaiah63:10
    book: Isa
    chapter: 63
    verse: 10
    text: 'But they rebelled, and vexed his holy Spirit: therefore he was turned to be their enemy, and he fought against them.'
    web: But they rebelled and grieved his Holy Spirit. Therefore he turned and became their enemy, and he himself fought against them.
