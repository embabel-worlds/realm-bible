    apiRef: Isaiah54:14
    book: Isa
    chapter: 54
    verse: 14
    text: 'In righteousness shalt thou be established: thou shalt be far from oppression; for thou shalt not fear: and from terror; for it shall not come near thee.'
    web: You will be established in righteousness. You will be far from oppression, for you will not be afraid, and far from terror, for it shall not come near you.
