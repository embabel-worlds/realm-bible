- type: Verse
  data:
    osis: Isa.10.26
    name: Isaiah 10:26
    apiRef: Isaiah10:26
    book: Isa
    chapter: 10
    verse: 26
    text: 'And the LORD of hosts shall stir up a scourge for him according to the slaughter of Midian at the rock of Oreb: and as his rod was upon the sea, so shall he lift it up after the manner of Egypt.'
    web: The LORD of Armies will stir up a scourge against him, as in the slaughter of Midian at the rock of Oreb. His rod will be over the sea, and he will lift it up like he did against Egypt.
    people:
    - midian_2075
    - oreb_2255
    - god_1324
