    apiRef: Isaiah19:20
    book: Isa
    chapter: 19
    verse: 20
    text: 'And it shall be for a sign and for a witness unto the LORD of hosts in the land of Egypt: for they shall cry unto the LORD because of the oppressors, and he shall send them a saviour, and a great one, and he shall deliver them.'
    web: It will be for a sign and for a witness to the LORD of Armies in the land of Egypt; for they will cry to the LORD because of oppressors, and he will send them a savior and a defender, and he will deliver them.
    people:
    - god_1324
