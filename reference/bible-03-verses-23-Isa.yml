  data:
    osis: Isa.51.16
    name: Isaiah 51:16
    apiRef: Isaiah51:16
    book: Isa
    chapter: 51
    verse: 16
    text: And I have put my words in thy mouth, and I have covered thee in the shadow of mine hand, that I may plant the heavens, and lay the foundations of the earth, and say unto Zion, Thou art my people.
    web: I have put my words in your mouth and have covered you in the shadow of my hand, that I may plant the heavens, and lay the foundations of the earth, and tell Zion, ‘You are my people.’”
    event: Prophecies of Isaiah
  relations:
