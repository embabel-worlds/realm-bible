    name: Isaiah 10:27
    apiRef: Isaiah10:27
    book: Isa
    chapter: 10
    verse: 27
    text: And it shall come to pass in that day, that his burden shall be taken away from off thy shoulder, and his yoke from off thy neck, and the yoke shall be destroyed because of the anointing.
    web: It will happen in that day that his burden will depart from off your shoulder, and his yoke from off your neck, and the yoke shall be destroyed because of the anointing oil.
    event: Prophecies of Isaiah
  relations:
