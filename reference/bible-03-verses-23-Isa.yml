    web: Is this your joyous city, whose antiquity is of ancient days, whose feet carried her far away to travel?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
- type: Verse
  data:
    osis: Isa.23.8
    name: Isaiah 23:8
    apiRef: Isaiah23:8
    book: Isa
    chapter: 23
    verse: 8
    text: Who hath taken this counsel against Tyre, the crowning city, whose merchants are princes, whose traffickers are the honourable of the earth?
    web: Who has planned this against Tyre, the giver of crowns, whose merchants are princes, whose traders are the honorable of the earth?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
