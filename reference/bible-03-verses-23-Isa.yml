  data:
    osis: Isa.11.10
    name: Isaiah 11:10
    apiRef: Isaiah11:10
    book: Isa
    chapter: 11
    verse: 10
    text: 'And in that day there shall be a root of Jesse, which shall stand for an ensign of the people; to it shall the Gentiles seek: and his rest shall be glorious.'
    web: It will happen in that day that the nations will seek the root of Jesse, who stands as a banner of the peoples; and his resting place will be glorious.
    people:
    - jesse_903
    event: Prophecies of Isaiah
  relations:
