  data:
    osis: Isa.1.5
    name: Isaiah 1:5
    apiRef: Isaiah1:5
    book: Isa
    chapter: 1
    verse: 5
    text: 'Why should ye be stricken any more? ye will revolt more and more: the whole head is sick, and the whole heart faint.'
    web: Why should you be beaten more, that you revolt more and more? The whole head is sick, and the whole heart faint.
    event: Prophecies of Isaiah
