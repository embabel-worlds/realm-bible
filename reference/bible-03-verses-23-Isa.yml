  data:
    osis: Isa.12.4
    name: Isaiah 12:4
    apiRef: Isaiah12:4
    book: Isa
    chapter: 12
    verse: 4
    text: And in that day shall ye say, Praise the LORD, call upon his name, declare his doings among the people, make mention that his name is exalted.
    web: In that day you will say, “Give thanks to the LORD! Call on his name! Declare his doings among the peoples! Proclaim that his name is exalted!
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.12
