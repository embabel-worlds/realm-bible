    apiRef: Isaiah10:30
    book: Isa
    chapter: 10
    verse: 30
    text: 'Lift up thy voice, O daughter of Gallim: cause it to be heard unto Laish, O poor Anathoth.'
    web: Cry aloud with your voice, daughter of Gallim! Listen, Laishah! You poor Anathoth!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.10
