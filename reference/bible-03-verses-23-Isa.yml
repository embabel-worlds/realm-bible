- type: Verse
  data:
    osis: Isa.50.1
    name: Isaiah 50:1
    apiRef: Isaiah50:1
    book: Isa
    chapter: 50
    verse: 1
    text: Thus saith the LORD, Where is the bill of your mother’s divorcement, whom I have put away? or which of my creditors is it to whom I have sold you? Behold, for your iniquities have ye sold yourselves, and for your transgressions is your mother put away.
    web: The LORD says, “Where is the bill of your mother’s divorce, with which I have put her away? Or to which of my creditors have I sold you? Behold, you were sold for your iniquities, and your mother was put away for your transgressions.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.50
- type: Verse
  data:
    osis: Isa.50.2
    name: Isaiah 50:2
    apiRef: Isaiah50:2
    book: Isa
    chapter: 50
    verse: 2
    text: 'Wherefore, when I came, was there no man? when I called, was there none to answer? Is my hand shortened at all, that it cannot redeem? or have I no power to deliver? behold, at my rebuke I dry up the sea, I make the rivers a wilderness: their fish stinketh, because there is no water, and dieth for thirst.'
    web: Why, when I came, was there no one? When I called, why was there no one to answer? Is my hand shortened at all, that it can’t redeem? Or have I no power to deliver? Behold, at my rebuke I dry up the sea. I make the rivers a wilderness. Their fish stink because there is no water, and die of thirst.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.50
- type: Verse
  data:
    osis: Isa.50.3
    name: Isaiah 50:3
    apiRef: Isaiah50:3
    book: Isa
    chapter: 50
    verse: 3
    text: I clothe the heavens with blackness, and I make sackcloth their covering.
    web: I clothe the heavens with blackness. I make sackcloth their covering.”
    event: Prophecies of Isaiah
  relations:
