    name: Isaiah 63:8
    apiRef: Isaiah63:8
    book: Isa
    chapter: 63
    verse: 8
    text: 'For he said, Surely they are my people, children that will not lie: so he was their Saviour.'
    web: For he said, “Surely, they are my people, children who will not deal falsely;” so he became their Savior.
    people:
    - god_1324
