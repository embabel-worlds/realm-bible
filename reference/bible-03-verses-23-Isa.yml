    to:
      type: Passage
      osis: Isa.10
- type: Verse
  data:
    osis: Isa.10.33
    name: Isaiah 10:33
    apiRef: Isaiah10:33
    book: Isa
    chapter: 10
    verse: 33
    text: 'Behold, the Lord, the LORD of hosts, shall lop the bough with terror: and the high ones of stature shall be hewn down, and the haughty shall be humbled.'
    web: Behold, the Lord, GOD of Armies, will lop the boughs with terror. The tall will be cut down, and the lofty will be brought low.
    people:
