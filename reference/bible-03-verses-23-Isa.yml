    name: Isaiah 12:5
    apiRef: Isaiah12:5
    book: Isa
    chapter: 12
    verse: 5
    text: 'Sing unto the LORD; for he hath done excellent things: this is known in all the earth.'
    web: Sing to the LORD, for he has done excellent things! Let this be known in all the earth!
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.12
