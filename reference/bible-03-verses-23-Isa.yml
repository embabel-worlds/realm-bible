    text: 'In their streets they shall gird themselves with sackcloth: on the tops of their houses, and in their streets, every one shall howl, weeping abundantly.'
    web: In their streets, they clothe themselves in sackcloth. In their streets and on their housetops, everyone wails, weeping abundantly.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.15
- type: Verse
  data:
    osis: Isa.15.4
    name: Isaiah 15:4
    apiRef: Isaiah15:4
    book: Isa
    chapter: 15
    verse: 4
    text: 'And Heshbon shall cry, and Elealeh: their voice shall be heard even unto Jahaz: therefore the armed soldiers of Moab shall cry out; his life shall be grievous unto him.'
    web: Heshbon cries out with Elealeh. Their voice is heard even to Jahaz. Therefore the armed men of Moab cry aloud. Their souls tremble within them.
    people:
    - moab_2103
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.15
- type: Verse
  data:
    osis: Isa.15.5
    name: Isaiah 15:5
    apiRef: Isaiah15:5
    book: Isa
    chapter: 15
    verse: 5
    text: 'My heart shall cry out for Moab; his fugitives shall flee unto Zoar, an heifer of three years old: for by the mounting up of Luhith with weeping shall they go it up; for in the way of Horonaim they shall raise up a cry of destruction.'
    web: My heart cries out for Moab! Her nobles flee to Zoar, to Eglath Shelishiyah; for they go up by the ascent of Luhith with weeping; for on the way to Horonaim, they raise up a cry of destruction.
    people:
    - moab_2103
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.15
- type: Verse
  data:
    osis: Isa.15.6
    name: Isaiah 15:6
    apiRef: Isaiah15:6
    book: Isa
    chapter: 15
    verse: 6
    text: 'For the waters of Nimrim shall be desolate: for the hay is withered away, the grass faileth, there is no green thing.'
    web: For the waters of Nimrim will be desolate; for the grass has withered away, the tender grass fails, there is no green thing.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.15
- type: Verse
  data:
    osis: Isa.15.7
    name: Isaiah 15:7
    apiRef: Isaiah15:7
    book: Isa
    chapter: 15
    verse: 7
    text: Therefore the abundance they have gotten, and that which they have laid up, shall they carry away to the brook of the willows.
    web: Therefore they will carry away the abundance they have gotten, and that which they have stored up, over the brook of the willows.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.15
- type: Verse
  data:
    osis: Isa.15.8
    name: Isaiah 15:8
    apiRef: Isaiah15:8
    book: Isa
    chapter: 15
    verse: 8
    text: For the cry is gone round about the borders of Moab; the howling thereof unto Eglaim, and the howling thereof unto Beerelim.
    web: For the cry has gone around the borders of Moab, its wailing to Eglaim, and its wailing to Beer Elim.
    people:
    - moab_2103
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.15
- type: Verse
  data:
    osis: Isa.15.9
    name: Isaiah 15:9
    apiRef: Isaiah15:9
    book: Isa
    chapter: 15
    verse: 9
    text: 'For the waters of Dimon shall be full of blood: for I will bring more upon Dimon, lions upon him that escapeth of Moab, and upon the remnant of the land.'
    web: For the waters of Dimon are full of blood; for I will bring yet more on Dimon, a lion on those of Moab who escape, and on the remnant of the land.
    people:
    - moab_2103
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.15
- type: Verse
  data:
    osis: Isa.16.1
    name: Isaiah 16:1
    apiRef: Isaiah16:1
    book: Isa
    chapter: 16
    verse: 1
    text: Send ye the lamb to the ruler of the land from Sela to the wilderness, unto the mount of the daughter of Zion.
    web: Send the lambs for the ruler of the land from Selah to the wilderness, to the mountain of the daughter of Zion.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.2
    name: Isaiah 16:2
    apiRef: Isaiah16:2
    book: Isa
    chapter: 16
    verse: 2
    text: For it shall be, that, as a wandering bird cast out of the nest, so the daughters of Moab shall be at the fords of Arnon.
    web: For it will be that as wandering birds, as a scattered nest, so will the daughters of Moab be at the fords of the Arnon.
    people:
    - moab_2103
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.3
    name: Isaiah 16:3
    apiRef: Isaiah16:3
    book: Isa
    chapter: 16
    verse: 3
    text: Take counsel, execute judgment; make thy shadow as the night in the midst of the noonday; hide the outcasts; bewray not him that wandereth.
    web: Give counsel! Execute justice! Make your shade like the night in the middle of the noonday! Hide the outcasts! Don’t betray the fugitive!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.4
    name: Isaiah 16:4
    apiRef: Isaiah16:4
    book: Isa
    chapter: 16
    verse: 4
    text: 'Let mine outcasts dwell with thee, Moab; be thou a covert to them from the face of the spoiler: for the extortioner is at an end, the spoiler ceaseth, the oppressors are consumed out of the land.'
    web: Let my outcasts dwell with you! As for Moab, be a hiding place for him from the face of the destroyer. For the extortionist is brought to nothing. Destruction ceases. The oppressors are consumed out of the land.
    people:
    - moab_2103
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.5
    name: Isaiah 16:5
    apiRef: Isaiah16:5
    book: Isa
    chapter: 16
    verse: 5
    text: 'And in mercy shall the throne be established: and he shall sit upon it in truth in the tabernacle of David, judging, and seeking judgment, and hasting righteousness.'
    web: A throne will be established in loving kindness. One will sit on it in truth, in the tent of David, judging, seeking justice, and swift to do righteousness.
    people:
    - david_994
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.6
    name: Isaiah 16:6
    apiRef: Isaiah16:6
    book: Isa
    chapter: 16
    verse: 6
    text: 'We have heard of the pride of Moab; he is very proud: even of his haughtiness, and his pride, and his wrath: but his lies shall not be so.'
    web: We have heard of the pride of Moab, that he is very proud; even of his arrogance, his pride, and his wrath. His boastings are nothing.
    people:
    - moab_2103
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.7
    name: Isaiah 16:7
    apiRef: Isaiah16:7
    book: Isa
    chapter: 16
    verse: 7
    text: 'Therefore shall Moab howl for Moab, every one shall howl: for the foundations of Kirhareseth shall ye mourn; surely they are stricken.'
    web: Therefore Moab will wail for Moab. Everyone will wail. You will mourn for the raisin cakes of Kir Hareseth, utterly stricken.
    people:
    - moab_2103
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.8
    name: Isaiah 16:8
    apiRef: Isaiah16:8
    book: Isa
    chapter: 16
    verse: 8
    text: 'For the fields of Heshbon languish, and the vine of Sibmah: the lords of the heathen have broken down the principal plants thereof, they are come even unto Jazer, they wandered through the wilderness: her branches are stretched out, they are gone over the sea.'
    web: For the fields of Heshbon languish with the vine of Sibmah. The lords of the nations have broken down its choice branches, which reached even to Jazer, which wandered into the wilderness. Its shoots were spread abroad. They passed over the sea.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.9
    name: Isaiah 16:9
    apiRef: Isaiah16:9
    book: Isa
    chapter: 16
    verse: 9
    text: 'Therefore I will bewail with the weeping of Jazer the vine of Sibmah: I will water thee with my tears, O Heshbon, and Elealeh: for the shouting for thy summer fruits and for thy harvest is fallen.'
    web: 'Therefore I will weep with the weeping of Jazer for the vine of Sibmah. I will water you with my tears, Heshbon, and Elealeh: for on your summer fruits and on your harvest the battle shout has fallen.'
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.10
    name: Isaiah 16:10
    apiRef: Isaiah16:10
    book: Isa
    chapter: 16
    verse: 10
    text: 'And gladness is taken away, and joy out of the plentiful field; and in the vineyards there shall be no singing, neither shall there be shouting: the treaders shall tread out no wine in their presses; I have made their vintage shouting to cease.'
    web: Gladness is taken away, and joy out of the fruitful field; and in the vineyards there will be no singing, neither joyful noise. Nobody will tread out wine in the presses. I have made the shouting stop.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.11
    name: Isaiah 16:11
    apiRef: Isaiah16:11
    book: Isa
    chapter: 16
    verse: 11
    text: Wherefore my bowels shall sound like an harp for Moab, and mine inward parts for Kirharesh.
    web: Therefore my heart sounds like a harp for Moab, and my inward parts for Kir Heres.
    people:
    - moab_2103
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.12
    name: Isaiah 16:12
    apiRef: Isaiah16:12
    book: Isa
    chapter: 16
    verse: 12
    text: And it shall come to pass, when it is seen that Moab is weary on the high place, that he shall come to his sanctuary to pray; but he shall not prevail.
    web: It will happen that when Moab presents himself, when he wearies himself on the high place, and comes to his sanctuary to pray, that he will not prevail.
    people:
    - moab_2103
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.13
    name: Isaiah 16:13
    apiRef: Isaiah16:13
    book: Isa
    chapter: 16
    verse: 13
    text: This is the word that the LORD hath spoken concerning Moab since that time.
    web: This is the word that the LORD spoke concerning Moab in time past.
    people:
    - moab_2103
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.16.14
    name: Isaiah 16:14
    apiRef: Isaiah16:14
    book: Isa
    chapter: 16
    verse: 14
    text: But now the LORD hath spoken, saying, Within three years, as the years of an hireling, and the glory of Moab shall be contemned, with all that great multitude; and the remnant shall be very small and feeble.
    web: But now the LORD has spoken, saying, “Within three years, as a worker bound by contract would count them, the glory of Moab shall be brought into contempt, with all his great multitude; and the remnant will be very small and feeble.”
    people:
    - moab_2103
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.16
- type: Verse
  data:
    osis: Isa.17.1
    name: Isaiah 17:1
    apiRef: Isaiah17:1
    book: Isa
    chapter: 17
    verse: 1
    text: The burden of Damascus. Behold, Damascus is taken away from being a city, and it shall be a ruinous heap.
    web: The burden of Damascus. “Behold, Damascus is taken away from being a city, and it will be a ruinous heap.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.2
    name: Isaiah 17:2
    apiRef: Isaiah17:2
    book: Isa
    chapter: 17
    verse: 2
    text: 'The cities of Aroer are forsaken: they shall be for flocks, which shall lie down, and none shall make them afraid.'
    web: The cities of Aroer are forsaken. They will be for flocks, which shall lie down, and no one shall make them afraid.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.3
    name: Isaiah 17:3
    apiRef: Isaiah17:3
    book: Isa
    chapter: 17
    verse: 3
    text: 'The fortress also shall cease from Ephraim, and the kingdom from Damascus, and the remnant of Syria: they shall be as the glory of the children of Israel, saith the LORD of hosts.'
    web: The fortress shall cease from Ephraim, and the kingdom from Damascus, and the remnant of Syria. They will be as the glory of the children of Israel,” says the LORD of Armies.
    people:
    - ephraim_1206
    - israel_682
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.4
    name: Isaiah 17:4
    apiRef: Isaiah17:4
    book: Isa
    chapter: 17
    verse: 4
    text: And in that day it shall come to pass, that the glory of Jacob shall be made thin, and the fatness of his flesh shall wax lean.
    web: “It will happen in that day that the glory of Jacob will be made thin, and the fatness of his flesh will become lean.
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.5
    name: Isaiah 17:5
    apiRef: Isaiah17:5
    book: Isa
    chapter: 17
    verse: 5
    text: And it shall be as when the harvestman gathereth the corn, and reapeth the ears with his arm; and it shall be as he that gathereth ears in the valley of Rephaim.
    web: It will be like when the harvester gathers the wheat, and his arm reaps the grain. Yes, it will be like when one gleans grain in the valley of Rephaim.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.6
    name: Isaiah 17:6
    apiRef: Isaiah17:6
    book: Isa
    chapter: 17
    verse: 6
    text: Yet gleaning grapes shall be left in it, as the shaking of an olive tree, two or three berries in the top of the uppermost bough, four or five in the outmost fruitful branches thereof, saith the LORD God of Israel.
    web: Yet gleanings will be left there, like the shaking of an olive tree, two or three olives in the top of the uppermost bough, four or five in the outermost branches of a fruitful tree,” says the LORD, the God of Israel.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.7
    name: Isaiah 17:7
    apiRef: Isaiah17:7
    book: Isa
    chapter: 17
    verse: 7
    text: At that day shall a man look to his Maker, and his eyes shall have respect to the Holy One of Israel.
    web: In that day, people will look to their Maker, and their eyes will have respect for the Holy One of Israel.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.8
    name: Isaiah 17:8
    apiRef: Isaiah17:8
    book: Isa
    chapter: 17
    verse: 8
    text: And he shall not look to the altars, the work of his hands, neither shall respect that which his fingers have made, either the groves, or the images.
    web: They will not look to the altars, the work of their hands; neither shall they respect that which their fingers have made, either the Asherah poles or the incense altars.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.9
    name: Isaiah 17:9
    apiRef: Isaiah17:9
    book: Isa
    chapter: 17
    verse: 9
    text: 'In that day shall his strong cities be as a forsaken bough, and an uppermost branch, which they left because of the children of Israel: and there shall be desolation.'
    web: In that day, their strong cities will be like the forsaken places in the woods and on the mountain top, which were forsaken from before the children of Israel; and it will be a desolation.
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.10
    name: Isaiah 17:10
    apiRef: Isaiah17:10
    book: Isa
    chapter: 17
    verse: 10
    text: 'Because thou hast forgotten the God of thy salvation, and hast not been mindful of the rock of thy strength, therefore shalt thou plant pleasant plants, and shalt set it with strange slips:'
    web: For you have forgotten the God of your salvation, and have not remembered the rock of your strength. Therefore you plant pleasant plants, and set out foreign seedlings.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.11
    name: Isaiah 17:11
    apiRef: Isaiah17:11
    book: Isa
    chapter: 17
    verse: 11
    text: 'In the day shalt thou make thy plant to grow, and in the morning shalt thou make thy seed to flourish: but the harvest shall be a heap in the day of grief and of desperate sorrow.'
    web: In the day of your planting, you hedge it in. In the morning, you make your seed blossom, but the harvest flees away in the day of grief and of desperate sorrow.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.12
    name: Isaiah 17:12
    apiRef: Isaiah17:12
    book: Isa
    chapter: 17
    verse: 12
    text: Woe to the multitude of many people, which make a noise like the noise of the seas; and to the rushing of nations, that make a rushing like the rushing of mighty waters!
    web: Ah, the uproar of many peoples who roar like the roaring of the seas; and the rushing of nations that rush like the rushing of mighty waters!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.13
    name: Isaiah 17:13
    apiRef: Isaiah17:13
    book: Isa
    chapter: 17
    verse: 13
    text: 'The nations shall rush like the rushing of many waters: but God shall rebuke them, and they shall flee far off, and shall be chased as the chaff of the mountains before the wind, and like a rolling thing before the whirlwind.'
    web: The nations will rush like the rushing of many waters, but he will rebuke them, and they will flee far off, and will be chased like the chaff of the mountains before the wind, and like the whirling dust before the storm.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.17.14
    name: Isaiah 17:14
    apiRef: Isaiah17:14
    book: Isa
    chapter: 17
    verse: 14
    text: And behold at eveningtide trouble; and before the morning he is not. This is the portion of them that spoil us, and the lot of them that rob us.
    web: At evening, behold, terror! Before the morning, they are no more. This is the portion of those who plunder us, and the lot of those who rob us.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.17
- type: Verse
  data:
    osis: Isa.18.1
    name: Isaiah 18:1
    apiRef: Isaiah18:1
    book: Isa
    chapter: 18
    verse: 1
    text: 'Woe to the land shadowing with wings, which is beyond the rivers of Ethiopia:'
    web: Ah, the land of the rustling of wings, which is beyond the rivers of Ethiopia;
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.18
- type: Verse
  data:
    osis: Isa.18.2
    name: Isaiah 18:2
    apiRef: Isaiah18:2
    book: Isa
    chapter: 18
    verse: 2
    text: That sendeth ambassadors by the sea, even in vessels of bulrushes upon the waters, saying, Go, ye swift messengers, to a nation scattered and peeled, to a people terrible from their beginning hitherto; a nation meted out and trodden down, whose land the rivers have spoiled!
    web: that sends ambassadors by the sea, even in vessels of papyrus on the waters, saying, “Go, you swift messengers, to a nation tall and smooth, to a people awesome from their beginning onward, a nation that measures out and treads down, whose land the rivers divide!”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.18
- type: Verse
  data:
    osis: Isa.18.3
    name: Isaiah 18:3
    apiRef: Isaiah18:3
    book: Isa
    chapter: 18
    verse: 3
    text: All ye inhabitants of the world, and dwellers on the earth, see ye, when he lifteth up an ensign on the mountains; and when he bloweth a trumpet, hear ye.
    web: All you inhabitants of the world, and you dwellers on the earth, when a banner is lifted up on the mountains, look! When the trumpet is blown, listen!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.18
- type: Verse
  data:
    osis: Isa.18.4
    name: Isaiah 18:4
    apiRef: Isaiah18:4
    book: Isa
    chapter: 18
    verse: 4
    text: For so the LORD said unto me, I will take my rest, and I will consider in my dwelling place like a clear heat upon herbs, and like a cloud of dew in the heat of harvest.
    web: For the LORD said to me, “I will be still, and I will see in my dwelling place, like clear heat in sunshine, like a cloud of dew in the heat of harvest.”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.18
- type: Verse
  data:
    osis: Isa.18.5
    name: Isaiah 18:5
    apiRef: Isaiah18:5
    book: Isa
    chapter: 18
    verse: 5
    text: For afore the harvest, when the bud is perfect, and the sour grape is ripening in the flower, he shall both cut off the sprigs with pruning hooks, and take away and cut down the branches.
    web: For before the harvest, when the blossom is over, and the flower becomes a ripening grape, he will cut off the sprigs with pruning hooks, and he will cut down and take away the spreading branches.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.18
- type: Verse
  data:
    osis: Isa.18.6
    name: Isaiah 18:6
    apiRef: Isaiah18:6
    book: Isa
    chapter: 18
    verse: 6
    text: 'They shall be left together unto the fowls of the mountains, and to the beasts of the earth: and the fowls shall summer upon them, and all the beasts of the earth shall winter upon them.'
    web: They will be left together for the ravenous birds of the mountains, and for the animals of the earth. The ravenous birds will eat them in the summer, and all the animals of the earth will eat them in the winter.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.18
- type: Verse
  data:
    osis: Isa.18.7
    name: Isaiah 18:7
    apiRef: Isaiah18:7
    book: Isa
    chapter: 18
    verse: 7
    text: In that time shall the present be brought unto the LORD of hosts of a people scattered and peeled, and from a people terrible from their beginning hitherto; a nation meted out and trodden under foot, whose land the rivers have spoiled, to the place of the name of the LORD of hosts, the mount Zion.
    web: In that time, a present will be brought to the LORD of Armies from a people tall and smooth, even from a people awesome from their beginning onward, a nation that measures out and treads down, whose land the rivers divide, to the place of the name of the LORD of Armies, Mount Zion.
    people:
    - god_1324
    event: Prophecies of Isaiah
