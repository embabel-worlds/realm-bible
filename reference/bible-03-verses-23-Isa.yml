    apiRef: Isaiah1:8
    book: Isa
    chapter: 1
    verse: 8
    text: And the daughter of Zion is left as a cottage in a vineyard, as a lodge in a garden of cucumbers, as a besieged city.
    web: The daughter of Zion is left like a shelter in a vineyard, like a hut in a field of melons, like a besieged city.
