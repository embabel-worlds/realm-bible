    book: Isa
    chapter: 1
    verse: 9
    text: Except the LORD of hosts had left unto us a very small remnant, we should have been as Sodom, and we should have been like unto Gomorrah.
    web: Unless the LORD of Armies had left to us a very small remnant, we would have been as Sodom. We would have been like Gomorrah.
