    to:
      type: Passage
      osis: Isa.13
- type: Verse
  data:
    osis: Isa.13.3
    name: Isaiah 13:3
    apiRef: Isaiah13:3
    book: Isa
    chapter: 13
    verse: 3
    text: I have commanded my sanctified ones, I have also called my mighty ones for mine anger, even them that rejoice in my highness.
    web: I have commanded my consecrated ones; yes, I have called my mighty men for my anger, even my proudly exulting ones.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.13
- type: Verse
  data:
    osis: Isa.13.4
    name: Isaiah 13:4
    apiRef: Isaiah13:4
    book: Isa
    chapter: 13
    verse: 4
    text: 'The noise of a multitude in the mountains, like as of a great people; a tumultuous noise of the kingdoms of nations gathered together: the LORD of hosts mustereth the host of the battle.'
    web: The noise of a multitude is in the mountains, as of a great people; the noise of an uproar of the kingdoms of the nations gathered together! The LORD of Armies is mustering the army for the battle.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.13
