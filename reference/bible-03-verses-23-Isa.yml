- type: Verse
  data:
    osis: Isa.30.13
    name: Isaiah 30:13
    apiRef: Isaiah30:13
    book: Isa
    chapter: 30
    verse: 13
    text: Therefore this iniquity shall be to you as a breach ready to fall, swelling out in a high wall, whose breaking cometh suddenly at an instant.
    web: therefore this iniquity shall be to you like a breach ready to fall, swelling out in a high wall, whose breaking comes suddenly in an instant.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.14
    name: Isaiah 30:14
    apiRef: Isaiah30:14
    book: Isa
    chapter: 30
    verse: 14
    text: 'And he shall break it as the breaking of the potters’ vessel that is broken in pieces; he shall not spare: so that there shall not be found in the bursting of it a sherd to take fire from the hearth, or to take water withal out of the pit.'
    web: He will break it as a potter’s vessel is broken, breaking it in pieces without sparing, so that there won’t be found among the broken pieces a piece good enough to take fire from the hearth, or to dip up water out of the cistern.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.15
    name: Isaiah 30:15
    apiRef: Isaiah30:15
    book: Isa
    chapter: 30
    verse: 15
    text: 'For thus saith the Lord GOD, the Holy One of Israel; In returning and rest shall ye be saved; in quietness and in confidence shall be your strength: and ye would not.'
    web: For thus said the Lord GOD, the Holy One of Israel, “You will be saved in returning and rest. Your strength will be in quietness and in confidence.” You refused,
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.16
    name: Isaiah 30:16
    apiRef: Isaiah30:16
    book: Isa
    chapter: 30
    verse: 16
    text: 'But ye said, No; for we will flee upon horses; therefore shall ye flee: and, We will ride upon the swift; therefore shall they that pursue you be swift.'
    web: but you said, “No, for we will flee on horses;” therefore you will flee; and, “We will ride on the swift;” therefore those who pursue you will be swift.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.17
    name: Isaiah 30:17
    apiRef: Isaiah30:17
    book: Isa
    chapter: 30
    verse: 17
    text: 'One thousand shall flee at the rebuke of one; at the rebuke of five shall ye flee: till ye be left as a beacon upon the top of a mountain, and as an ensign on an hill.'
    web: One thousand will flee at the threat of one. At the threat of five, you will flee until you are left like a beacon on the top of a mountain, and like a banner on a hill.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.18
    name: Isaiah 30:18
    apiRef: Isaiah30:18
    book: Isa
    chapter: 30
    verse: 18
    text: 'And therefore will the LORD wait, that he may be gracious unto you, and therefore will he be exalted, that he may have mercy upon you: for the LORD is a God of judgment: blessed are all they that wait for him.'
    web: Therefore the LORD will wait, that he may be gracious to you; and therefore he will be exalted, that he may have mercy on you, for the LORD is a God of justice. Blessed are all those who wait for him.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.19
    name: Isaiah 30:19
    apiRef: Isaiah30:19
    book: Isa
    chapter: 30
    verse: 19
    text: 'For the people shall dwell in Zion at Jerusalem: thou shalt weep no more: he will be very gracious unto thee at the voice of thy cry; when he shall hear it, he will answer thee.'
    web: For the people will dwell in Zion at Jerusalem. You will weep no more. He will surely be gracious to you at the voice of your cry. When he hears you, he will answer you.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.20
    name: Isaiah 30:20
    apiRef: Isaiah30:20
    book: Isa
    chapter: 30
    verse: 20
    text: 'And though the Lord give you the bread of adversity, and the water of affliction, yet shall not thy teachers be removed into a corner any more, but thine eyes shall see thy teachers:'
    web: Though the Lord may give you the bread of adversity and the water of affliction, yet your teachers won’t be hidden any more, but your eyes will see your teachers;
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.21
    name: Isaiah 30:21
    apiRef: Isaiah30:21
    book: Isa
    chapter: 30
    verse: 21
    text: And thine ears shall hear a word behind thee, saying, This is the way, walk ye in it, when ye turn to the right hand, and when ye turn to the left.
    web: and when you turn to the right hand, and when you turn to the left, your ears will hear a voice behind you, saying, “This is the way. Walk in it.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.22
    name: Isaiah 30:22
    apiRef: Isaiah30:22
    book: Isa
    chapter: 30
    verse: 22
    text: 'Ye shall defile also the covering of thy graven images of silver, and the ornament of thy molten images of gold: thou shalt cast them away as a menstruous cloth; thou shalt say unto it, Get thee hence.'
    web: You shall defile the overlaying of your engraved images of silver, and the plating of your molten images of gold. You shall cast them away as an unclean thing. You shall tell it, “Go away!”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.23
    name: Isaiah 30:23
    apiRef: Isaiah30:23
    book: Isa
    chapter: 30
    verse: 23
    text: 'Then shall he give the rain of thy seed, that thou shalt sow the ground withal; and bread of the increase of the earth, and it shall be fat and plenteous: in that day shall thy cattle feed in large pastures.'
    web: He will give the rain for your seed, with which you will sow the ground; and bread of the increase of the ground will be rich and plentiful. In that day, your livestock will feed in large pastures.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.24
    name: Isaiah 30:24
    apiRef: Isaiah30:24
    book: Isa
    chapter: 30
    verse: 24
    text: The oxen likewise and the young asses that ear the ground shall eat clean provender, which hath been winnowed with the shovel and with the fan.
    web: The oxen likewise and the young donkeys that till the ground will eat savory feed, which has been winnowed with the shovel and with the fork.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.25
    name: Isaiah 30:25
    apiRef: Isaiah30:25
    book: Isa
    chapter: 30
    verse: 25
    text: And there shall be upon every high mountain, and upon every high hill, rivers and streams of waters in the day of the great slaughter, when the towers fall.
    web: There will be brooks and streams of water on every lofty mountain and on every high hill in the day of the great slaughter, when the towers fall.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.26
    name: Isaiah 30:26
    apiRef: Isaiah30:26
    book: Isa
    chapter: 30
    verse: 26
    text: Moreover the light of the moon shall be as the light of the sun, and the light of the sun shall be sevenfold, as the light of seven days, in the day that the LORD bindeth up the breach of his people, and healeth the stroke of their wound.
    web: Moreover the light of the moon will be like the light of the sun, and the light of the sun will be seven times brighter, like the light of seven days, in the day that the LORD binds up the fracture of his people, and heals the wound they were struck with.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.27
    name: Isaiah 30:27
    apiRef: Isaiah30:27
    book: Isa
    chapter: 30
    verse: 27
    text: 'Behold, the name of the LORD cometh from far, burning with his anger, and the burden thereof is heavy: his lips are full of indignation, and his tongue as a devouring fire:'
    web: Behold, the LORD’s name comes from far away, burning with his anger, and in thick rising smoke. His lips are full of indignation. His tongue is as a devouring fire.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.28
    name: Isaiah 30:28
    apiRef: Isaiah30:28
    book: Isa
    chapter: 30
    verse: 28
    text: 'And his breath, as an overflowing stream, shall reach to the midst of the neck, to sift the nations with the sieve of vanity: and there shall be a bridle in the jaws of the people, causing them to err.'
    web: His breath is as an overflowing stream that reaches even to the neck, to sift the nations with the sieve of destruction. A bridle that leads to ruin will be in the jaws of the peoples.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.29
    name: Isaiah 30:29
    apiRef: Isaiah30:29
    book: Isa
    chapter: 30
    verse: 29
    text: Ye shall have a song, as in the night when a holy solemnity is kept; and gladness of heart, as when one goeth with a pipe to come into the mountain of the LORD, to the mighty One of Israel.
    web: You will have a song, as in the night when a holy feast is kept, and gladness of heart, as when one goes with a flute to come to the LORD’s mountain, to Israel’s Rock.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.30
    name: Isaiah 30:30
    apiRef: Isaiah30:30
    book: Isa
    chapter: 30
    verse: 30
    text: And the LORD shall cause his glorious voice to be heard, and shall shew the lighting down of his arm, with the indignation of his anger, and with the flame of a devouring fire, with scattering, and tempest, and hailstones.
    web: The LORD will cause his glorious voice to be heard, and will show the descent of his arm, with the indignation of his anger and the flame of a devouring fire, with a blast, storm, and hailstones.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.31
    name: Isaiah 30:31
    apiRef: Isaiah30:31
    book: Isa
    chapter: 30
    verse: 31
    text: For through the voice of the LORD shall the Assyrian be beaten down, which smote with a rod.
    web: For through the LORD’s voice the Assyrian will be dismayed. He will strike him with his rod.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.32
    name: Isaiah 30:32
    apiRef: Isaiah30:32
    book: Isa
    chapter: 30
    verse: 32
    text: 'And in every place where the grounded staff shall pass, which the LORD shall lay upon him, it shall be with tabrets and harps: and in battles of shaking will he fight with it.'
    web: Every stroke of the rod of punishment, which the LORD will lay on him, will be with the sound of tambourines and harps. He will fight with them in battles, brandishing weapons.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.30.33
    name: Isaiah 30:33
    apiRef: Isaiah30:33
    book: Isa
    chapter: 30
    verse: 33
    text: 'For Tophet is ordained of old; yea, for the king it is prepared; he hath made it deep and large: the pile thereof is fire and much wood; the breath of the LORD, like a stream of brimstone, doth kindle it.'
    web: For his burning place has long been ready. Yes, it is prepared for the king. He has made its pyre deep and large with fire and much wood. The LORD’s breath, like a stream of sulfur, kindles it.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.30
- type: Verse
  data:
    osis: Isa.31.1
    name: Isaiah 31:1
    apiRef: Isaiah31:1
    book: Isa
    chapter: 31
    verse: 1
    text: Woe to them that go down to Egypt for help; and stay on horses, and trust in chariots, because they are many; and in horsemen, because they are very strong; but they look not unto the Holy One of Israel, neither seek the LORD!
    web: Woe to those who go down to Egypt for help, and rely on horses, and trust in chariots because they are many, and in horsemen because they are very strong, but they don’t look to the Holy One of Israel, and they don’t seek the LORD!
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.31
- type: Verse
  data:
    osis: Isa.31.2
    name: Isaiah 31:2
    apiRef: Isaiah31:2
    book: Isa
    chapter: 31
    verse: 2
    text: 'Yet he also is wise, and will bring evil, and will not call back his words: but will arise against the house of the evildoers, and against the help of them that work iniquity.'
    web: Yet he also is wise, and will bring disaster, and will not call back his words, but will arise against the house of the evildoers, and against the help of those who work iniquity.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.31
- type: Verse
  data:
    osis: Isa.31.3
    name: Isaiah 31:3
    apiRef: Isaiah31:3
    book: Isa
    chapter: 31
    verse: 3
    text: Now the Egyptians are men, and not God; and their horses flesh, and not spirit. When the LORD shall stretch out his hand, both he that helpeth shall fall, and he that is holpen shall fall down, and they all shall fail together.
    web: Now the Egyptians are men, and not God; and their horses flesh, and not spirit. When the LORD stretches out his hand, both he who helps shall stumble, and he who is helped shall fall, and they all shall be consumed together.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.31
- type: Verse
  data:
    osis: Isa.31.4
    name: Isaiah 31:4
    apiRef: Isaiah31:4
    book: Isa
    chapter: 31
    verse: 4
    text: 'For thus hath the LORD spoken unto me, Like as the lion and the young lion roaring on his prey, when a multitude of shepherds is called forth against him, he will not be afraid of their voice, nor abase himself for the noise of them: so shall the LORD of hosts come down to fight for mount Zion, and for the hill thereof.'
    web: For the LORD says to me, “As the lion and the young lion growling over his prey, if a multitude of shepherds is called together against him, will not be dismayed at their voice, nor abase himself for their noise, so the LORD of Armies will come down to fight on Mount Zion and on its heights.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.31
- type: Verse
  data:
    osis: Isa.31.5
    name: Isaiah 31:5
    apiRef: Isaiah31:5
    book: Isa
    chapter: 31
    verse: 5
    text: As birds flying, so will the LORD of hosts defend Jerusalem; defending also he will deliver it; and passing over he will preserve it.
    web: As birds hovering, so the LORD of Armies will protect Jerusalem. He will protect and deliver it. He will pass over and preserve it.”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.31
- type: Verse
  data:
    osis: Isa.31.6
    name: Isaiah 31:6
    apiRef: Isaiah31:6
    book: Isa
    chapter: 31
    verse: 6
    text: Turn ye unto him from whom the children of Israel have deeply revolted.
    web: Return to him from whom you have deeply revolted, children of Israel.
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.31
- type: Verse
  data:
    osis: Isa.31.7
    name: Isaiah 31:7
    apiRef: Isaiah31:7
    book: Isa
    chapter: 31
    verse: 7
    text: For in that day every man shall cast away his idols of silver, and his idols of gold, which your own hands have made unto you for a sin.
    web: For in that day everyone shall cast away his idols of silver and his idols of gold—sin which your own hands have made for you.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.31
- type: Verse
  data:
    osis: Isa.31.8
    name: Isaiah 31:8
    apiRef: Isaiah31:8
    book: Isa
    chapter: 31
    verse: 8
    text: 'Then shall the Assyrian fall with the sword, not of a mighty man; and the sword, not of a mean man, shall devour him: but he shall flee from the sword, and his young men shall be discomfited.'
    web: “The Assyrian will fall by the sword, not of man; and the sword, not of mankind, shall devour him. He will flee from the sword, and his young men will become subject to forced labor.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.31
- type: Verse
  data:
    osis: Isa.31.9
    name: Isaiah 31:9
    apiRef: Isaiah31:9
    book: Isa
    chapter: 31
    verse: 9
    text: And he shall pass over to his strong hold for fear, and his princes shall be afraid of the ensign, saith the LORD, whose fire is in Zion, and his furnace in Jerusalem.
    web: His rock will pass away by reason of terror, and his princes will be afraid of the banner,” says the LORD, whose fire is in Zion, and his furnace in Jerusalem.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.31
- type: Verse
  data:
    osis: Isa.32.1
    name: Isaiah 32:1
    apiRef: Isaiah32:1
    book: Isa
    chapter: 32
    verse: 1
    text: Behold, a king shall reign in righteousness, and princes shall rule in judgment.
    web: Behold, a king shall reign in righteousness, and princes shall rule in justice.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.2
    name: Isaiah 32:2
    apiRef: Isaiah32:2
    book: Isa
    chapter: 32
    verse: 2
    text: And a man shall be as an hiding place from the wind, and a covert from the tempest; as rivers of water in a dry place, as the shadow of a great rock in a weary land.
    web: A man shall be as a hiding place from the wind, and a covert from the storm, as streams of water in a dry place, as the shade of a large rock in a weary land.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.3
    name: Isaiah 32:3
    apiRef: Isaiah32:3
    book: Isa
    chapter: 32
    verse: 3
    text: And the eyes of them that see shall not be dim, and the ears of them that hear shall hearken.
    web: The eyes of those who see will not be dim, and the ears of those who hear will listen.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.4
    name: Isaiah 32:4
    apiRef: Isaiah32:4
    book: Isa
    chapter: 32
    verse: 4
    text: The heart also of the rash shall understand knowledge, and the tongue of the stammerers shall be ready to speak plainly.
    web: The heart of the rash will understand knowledge, and the tongue of the stammerers will be ready to speak plainly.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.5
    name: Isaiah 32:5
    apiRef: Isaiah32:5
    book: Isa
    chapter: 32
    verse: 5
    text: The vile person shall be no more called liberal, nor the churl said to be bountiful.
    web: The fool will no longer be called noble, nor the scoundrel be highly respected.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.6
    name: Isaiah 32:6
    apiRef: Isaiah32:6
    book: Isa
    chapter: 32
    verse: 6
    text: For the vile person will speak villany, and his heart will work iniquity, to practise hypocrisy, and to utter error against the LORD, to make empty the soul of the hungry, and he will cause the drink of the thirsty to fail.
    web: For the fool will speak folly, and his heart will work iniquity, to practice profanity, and to utter error against the LORD, to make empty the soul of the hungry, and to cause the drink of the thirsty to fail.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
