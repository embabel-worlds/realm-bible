  data:
    osis: Isa.11.5
    name: Isaiah 11:5
    apiRef: Isaiah11:5
    book: Isa
    chapter: 11
    verse: 5
    text: And righteousness shall be the girdle of his loins, and faithfulness the girdle of his reins.
    web: Righteousness will be the belt around his waist, and faithfulness the belt around his waist.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.11
- type: Verse
  data:
    osis: Isa.11.6
    name: Isaiah 11:6
    apiRef: Isaiah11:6
    book: Isa
    chapter: 11
    verse: 6
    text: The wolf also shall dwell with the lamb, and the leopard shall lie down with the kid; and the calf and the young lion and the fatling together; and a little child shall lead them.
    web: The wolf will live with the lamb, and the leopard will lie down with the young goat, the calf, the young lion, and the fattened calf together; and a little child will lead them.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.11
- type: Verse
  data:
    osis: Isa.11.7
    name: Isaiah 11:7
    apiRef: Isaiah11:7
    book: Isa
    chapter: 11
    verse: 7
    text: 'And the cow and the bear shall feed; their young ones shall lie down together: and the lion shall eat straw like the ox.'
    web: The cow and the bear will graze. Their young ones will lie down together. The lion will eat straw like the ox.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.11
