    apiRef: Isaiah1:3
    book: Isa
    chapter: 1
    verse: 3
    text: 'The ox knoweth his owner, and the ass his master’s crib: but Israel doth not know, my people doth not consider.'
    web: The ox knows his owner, and the donkey his master’s crib; but Israel doesn’t know. My people don’t consider.”
