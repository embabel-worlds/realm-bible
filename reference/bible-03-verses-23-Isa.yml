    apiRef: Isaiah10:28
    book: Isa
    chapter: 10
    verse: 28
    text: 'He is come to Aiath, he is passed to Migron; at Michmash he hath laid up his carriages:'
    web: He has come to Aiath. He has passed through Migron. At Michmash he stores his baggage.
    event: Prophecies of Isaiah
  relations:
