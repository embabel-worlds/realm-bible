  data:
    osis: Isa.11.8
    name: Isaiah 11:8
    apiRef: Isaiah11:8
    book: Isa
    chapter: 11
    verse: 8
    text: And the sucking child shall play on the hole of the asp, and the weaned child shall put his hand on the cockatrice’ den.
    web: The nursing child will play near a cobra’s hole, and the weaned child will put his hand on the viper’s den.
    event: Prophecies of Isaiah
