    name: Isaiah 1:11
    apiRef: Isaiah1:11
    book: Isa
    chapter: 1
    verse: 11
    text: 'To what purpose is the multitude of your sacrifices unto me? saith the LORD: I am full of the burnt offerings of rams, and the fat of fed beasts; and I delight not in the blood of bullocks, or of lambs, or of he goats.'
    web: “What are the multitude of your sacrifices to me?”, says the LORD. “I have had enough of the burnt offerings of rams and the fat of fed animals. I don’t delight in the blood of bulls, or of lambs, or of male goats.
    people:
    - god_1324
