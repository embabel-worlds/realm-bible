    book: Isa
    chapter: 63
    verse: 12
    text: That led them by the right hand of Moses with his glorious arm, dividing the water before them, to make himself an everlasting name?
    web: Who caused his glorious arm to be at Moses’ right hand? Who divided the waters before them, to make himself an everlasting name?
