    apiRef: Isaiah63:17
    book: Isa
    chapter: 63
    verse: 17
    text: O LORD, why hast thou made us to err from thy ways, and hardened our heart from thy fear? Return for thy servants’ sake, the tribes of thine inheritance.
    web: O LORD, why do you make us wander from your ways, and harden our heart from your fear? Return for your servants’ sake, the tribes of your inheritance.
    people:
    - god_1324
