  data:
    osis: Isa.23.14
    name: Isaiah 23:14
    apiRef: Isaiah23:14
    book: Isa
    chapter: 23
    verse: 14
    text: 'Howl, ye ships of Tarshish: for your strength is laid waste.'
    web: Howl, you ships of Tarshish, for your stronghold is laid waste!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
