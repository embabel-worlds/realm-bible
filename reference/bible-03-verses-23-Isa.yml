  data:
    osis: Isa.55.13
    name: Isaiah 55:13
    apiRef: Isaiah55:13
    book: Isa
    chapter: 55
    verse: 13
    text: 'Instead of the thorn shall come up the fir tree, and instead of the brier shall come up the myrtle tree: and it shall be to the LORD for a name, for an everlasting sign that shall not be cut off.'
    web: Instead of the thorn the cypress tree will come up; and instead of the brier the myrtle tree will come up. It will make a name for the LORD, for an everlasting sign that will not be cut off.”
