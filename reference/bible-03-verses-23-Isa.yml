  data:
    osis: Isa.49.15
    name: Isaiah 49:15
    apiRef: Isaiah49:15
    book: Isa
    chapter: 49
    verse: 15
    text: Can a woman forget her sucking child, that she should not have compassion on the son of her womb? yea, they may forget, yet will I not forget thee.
    web: “Can a woman forget her nursing child, that she should not have compassion on the son of her womb? Yes, these may forget, yet I will not forget you!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.49
- type: Verse
  data:
    osis: Isa.49.16
    name: Isaiah 49:16
    apiRef: Isaiah49:16
    book: Isa
    chapter: 49
    verse: 16
    text: Behold, I have graven thee upon the palms of my hands; thy walls are continually before me.
    web: Behold, I have engraved you on the palms of my hands. Your walls are continually before me.
    event: Prophecies of Isaiah
  relations:
