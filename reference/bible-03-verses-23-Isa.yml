  data:
    osis: Isa.32.7
    name: Isaiah 32:7
    apiRef: Isaiah32:7
    book: Isa
    chapter: 32
    verse: 7
    text: 'The instruments also of the churl are evil: he deviseth wicked devices to destroy the poor with lying words, even when the needy speaketh right.'
    web: The ways of the scoundrel are evil. He devises wicked plans to destroy the humble with lying words, even when the needy speaks right.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.8
    name: Isaiah 32:8
    apiRef: Isaiah32:8
    book: Isa
    chapter: 32
    verse: 8
    text: But the liberal deviseth liberal things; and by liberal things shall he stand.
    web: But the noble devises noble things, and he will continue in noble things.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.9
    name: Isaiah 32:9
    apiRef: Isaiah32:9
    book: Isa
    chapter: 32
    verse: 9
    text: Rise up, ye women that are at ease; hear my voice, ye careless daughters; give ear unto my speech.
    web: Rise up, you women who are at ease! Hear my voice! You careless daughters, give ear to my speech!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.10
    name: Isaiah 32:10
    apiRef: Isaiah32:10
    book: Isa
    chapter: 32
    verse: 10
    text: 'Many days and years shall ye be troubled, ye careless women: for the vintage shall fail, the gathering shall not come.'
    web: For days beyond a year you will be troubled, you careless women; for the vintage will fail. The harvest won’t come.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.11
    name: Isaiah 32:11
    apiRef: Isaiah32:11
    book: Isa
    chapter: 32
    verse: 11
    text: 'Tremble, ye women that are at ease; be troubled, ye careless ones: strip you, and make you bare, and gird sackcloth upon your loins.'
    web: Tremble, you women who are at ease! Be troubled, you careless ones! Strip yourselves, make yourselves naked, and put sackcloth on your waist.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.12
    name: Isaiah 32:12
    apiRef: Isaiah32:12
    book: Isa
    chapter: 32
    verse: 12
    text: They shall lament for the teats, for the pleasant fields, for the fruitful vine.
    web: Beat your breasts for the pleasant fields, for the fruitful vine.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.13
    name: Isaiah 32:13
    apiRef: Isaiah32:13
    book: Isa
    chapter: 32
    verse: 13
    text: 'Upon the land of my people shall come up thorns and briers; yea, upon all the houses of joy in the joyous city:'
    web: Thorns and briers will come up on my people’s land; yes, on all the houses of joy in the joyous city.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.14
    name: Isaiah 32:14
    apiRef: Isaiah32:14
    book: Isa
    chapter: 32
    verse: 14
    text: Because the palaces shall be forsaken; the multitude of the city shall be left; the forts and towers shall be for dens for ever, a joy of wild asses, a pasture of flocks;
    web: For the palace will be forsaken. The populous city will be deserted. The hill and the watchtower will be for dens forever, a delight for wild donkeys, a pasture of flocks,
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.15
    name: Isaiah 32:15
    apiRef: Isaiah32:15
    book: Isa
    chapter: 32
    verse: 15
    text: Until the spirit be poured upon us from on high, and the wilderness be a fruitful field, and the fruitful field be counted for a forest.
    web: until the Spirit is poured on us from on high, and the wilderness becomes a fruitful field, and the fruitful field is considered a forest.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.16
    name: Isaiah 32:16
    apiRef: Isaiah32:16
    book: Isa
    chapter: 32
    verse: 16
    text: Then judgment shall dwell in the wilderness, and righteousness remain in the fruitful field.
    web: Then justice will dwell in the wilderness; and righteousness will remain in the fruitful field.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.17
    name: Isaiah 32:17
    apiRef: Isaiah32:17
    book: Isa
    chapter: 32
    verse: 17
    text: And the work of righteousness shall be peace; and the effect of righteousness quietness and assurance for ever.
    web: The work of righteousness will be peace, and the effect of righteousness, quietness and confidence forever.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.18
    name: Isaiah 32:18
    apiRef: Isaiah32:18
    book: Isa
    chapter: 32
    verse: 18
    text: And my people shall dwell in a peaceable habitation, and in sure dwellings, and in quiet resting places;
    web: My people will live in a peaceful habitation, in safe dwellings, and in quiet resting places,
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.19
    name: Isaiah 32:19
    apiRef: Isaiah32:19
    book: Isa
    chapter: 32
    verse: 19
    text: When it shall hail, coming down on the forest; and the city shall be low in a low place.
    web: though hail flattens the forest, and the city is leveled completely.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.32.20
    name: Isaiah 32:20
    apiRef: Isaiah32:20
    book: Isa
    chapter: 32
    verse: 20
    text: Blessed are ye that sow beside all waters, that send forth thither the feet of the ox and the ass.
    web: Blessed are you who sow beside all waters, who send out the feet of the ox and the donkey.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.32
- type: Verse
  data:
    osis: Isa.33.1
    name: Isaiah 33:1
    apiRef: Isaiah33:1
    book: Isa
    chapter: 33
    verse: 1
    text: Woe to thee that spoilest, and thou wast not spoiled; and dealest treacherously, and they dealt not treacherously with thee! when thou shalt cease to spoil, thou shalt be spoiled; and when thou shalt make an end to deal treacherously, they shall deal treacherously with thee.
    web: Woe to you who destroy, but you weren’t destroyed, and who betray, but nobody betrayed you! When you have finished destroying, you will be destroyed; and when you have finished betrayal, you will be betrayed.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.2
    name: Isaiah 33:2
    apiRef: Isaiah33:2
    book: Isa
    chapter: 33
    verse: 2
    text: 'O LORD, be gracious unto us; we have waited for thee: be thou their arm every morning, our salvation also in the time of trouble.'
    web: LORD, be gracious to us. We have waited for you. Be our strength every morning, our salvation also in the time of trouble.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.3
    name: Isaiah 33:3
    apiRef: Isaiah33:3
    book: Isa
    chapter: 33
    verse: 3
    text: At the noise of the tumult the people fled; at the lifting up of thyself the nations were scattered.
    web: At the noise of the thunder, the peoples have fled. When you lift yourself up, the nations are scattered.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.4
    name: Isaiah 33:4
    apiRef: Isaiah33:4
    book: Isa
    chapter: 33
    verse: 4
    text: 'And your spoil shall be gathered like the gathering of the caterpiller: as the running to and fro of locusts shall he run upon them.'
    web: Your plunder will be gathered as the caterpillar gathers. Men will leap on it as locusts leap.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.5
    name: Isaiah 33:5
    apiRef: Isaiah33:5
    book: Isa
    chapter: 33
    verse: 5
    text: 'The LORD is exalted; for he dwelleth on high: he hath filled Zion with judgment and righteousness.'
    web: The LORD is exalted, for he dwells on high. He has filled Zion with justice and righteousness.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.6
    name: Isaiah 33:6
    apiRef: Isaiah33:6
    book: Isa
    chapter: 33
    verse: 6
    text: 'And wisdom and knowledge shall be the stability of thy times, and strength of salvation: the fear of the LORD is his treasure.'
    web: There will be stability in your times, abundance of salvation, wisdom, and knowledge. The fear of the LORD is your treasure.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.7
    name: Isaiah 33:7
    apiRef: Isaiah33:7
    book: Isa
    chapter: 33
    verse: 7
    text: 'Behold, their valiant ones shall cry without: the ambassadors of peace shall weep bitterly.'
    web: Behold, their valiant ones cry outside; the ambassadors of peace weep bitterly.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.8
    name: Isaiah 33:8
    apiRef: Isaiah33:8
    book: Isa
    chapter: 33
    verse: 8
    text: 'The highways lie waste, the wayfaring man ceaseth: he hath broken the covenant, he hath despised the cities, he regardeth no man.'
    web: The highways are desolate. The traveling man ceases. The covenant is broken. He has despised the cities. He doesn’t respect man.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.9
    name: Isaiah 33:9
    apiRef: Isaiah33:9
    book: Isa
    chapter: 33
    verse: 9
    text: 'The earth mourneth and languisheth: Lebanon is ashamed and hewn down: Sharon is like a wilderness; and Bashan and Carmel shake off their fruits.'
    web: The land mourns and languishes. Lebanon is confounded and withers away. Sharon is like a desert, and Bashan and Carmel are stripped bare.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.10
    name: Isaiah 33:10
    apiRef: Isaiah33:10
    book: Isa
    chapter: 33
    verse: 10
    text: Now will I rise, saith the LORD; now will I be exalted; now will I lift up myself.
    web: “Now I will arise,” says the LORD. “Now I will lift myself up. Now I will be exalted.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.11
    name: Isaiah 33:11
    apiRef: Isaiah33:11
    book: Isa
    chapter: 33
    verse: 11
    text: 'Ye shall conceive chaff, ye shall bring forth stubble: your breath, as fire, shall devour you.'
    web: You will conceive chaff. You will give birth to stubble. Your breath is a fire that will devour you.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.12
    name: Isaiah 33:12
    apiRef: Isaiah33:12
    book: Isa
    chapter: 33
    verse: 12
    text: 'And the people shall be as the burnings of lime: as thorns cut up shall they be burned in the fire.'
    web: The peoples will be like the burning of lime, like thorns that are cut down and burned in the fire.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.13
    name: Isaiah 33:13
    apiRef: Isaiah33:13
    book: Isa
    chapter: 33
    verse: 13
    text: Hear, ye that are far off, what I have done; and, ye that are near, acknowledge my might.
    web: Hear, you who are far off, what I have done; and, you who are near, acknowledge my might.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.14
    name: Isaiah 33:14
    apiRef: Isaiah33:14
    book: Isa
    chapter: 33
    verse: 14
    text: The sinners in Zion are afraid; fearfulness hath surprised the hypocrites. Who among us shall dwell with the devouring fire? who among us shall dwell with everlasting burnings?
    web: The sinners in Zion are afraid. Trembling has seized the godless ones. Who among us can live with the devouring fire? Who among us can live with everlasting burning?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.15
    name: Isaiah 33:15
    apiRef: Isaiah33:15
    book: Isa
    chapter: 33
    verse: 15
    text: He that walketh righteously, and speaketh uprightly; he that despiseth the gain of oppressions, that shaketh his hands from holding of bribes, that stoppeth his ears from hearing of blood, and shutteth his eyes from seeing evil;
    web: He who walks righteously and speaks blamelessly, he who despises the gain of oppressions, who gestures with his hands, refusing to take a bribe, who stops his ears from hearing of bloodshed, and shuts his eyes from looking at evil—
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.16
    name: Isaiah 33:16
    apiRef: Isaiah33:16
    book: Isa
    chapter: 33
    verse: 16
    text: 'He shall dwell on high: his place of defence shall be the munitions of rocks: bread shall be given him; his waters shall be sure.'
    web: he will dwell on high. His place of defense will be the fortress of rocks. His bread will be supplied. His waters will be sure.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.17
    name: Isaiah 33:17
    apiRef: Isaiah33:17
    book: Isa
    chapter: 33
    verse: 17
    text: 'Thine eyes shall see the king in his beauty: they shall behold the land that is very far off.'
    web: Your eyes will see the king in his beauty. They will see a distant land.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.18
    name: Isaiah 33:18
    apiRef: Isaiah33:18
    book: Isa
    chapter: 33
    verse: 18
    text: Thine heart shall meditate terror. Where is the scribe? where is the receiver? where is he that counted the towers?
    web: Your heart will meditate on the terror. Where is he who counted? Where is he who weighed? Where is he who counted the towers?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.19
    name: Isaiah 33:19
    apiRef: Isaiah33:19
    book: Isa
    chapter: 33
    verse: 19
    text: Thou shalt not see a fierce people, a people of a deeper speech than thou canst perceive; of a stammering tongue, that thou canst not understand.
    web: You will no longer see the fierce people, a people of a deep speech that you can’t comprehend, with a strange language that you can’t understand.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.20
    name: Isaiah 33:20
    apiRef: Isaiah33:20
    book: Isa
    chapter: 33
    verse: 20
    text: 'Look upon Zion, the city of our solemnities: thine eyes shall see Jerusalem a quiet habitation, a tabernacle that shall not be taken down; not one of the stakes thereof shall ever be removed, neither shall any of the cords thereof be broken.'
    web: Look at Zion, the city of our appointed festivals. Your eyes will see Jerusalem, a quiet habitation, a tent that won’t be removed. Its stakes will never be plucked up, nor will any of its cords be broken.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.21
    name: Isaiah 33:21
    apiRef: Isaiah33:21
    book: Isa
    chapter: 33
    verse: 21
    text: But there the glorious LORD will be unto us a place of broad rivers and streams; wherein shall go no galley with oars, neither shall gallant ship pass thereby.
    web: But there the LORD will be with us in majesty, a place of wide rivers and streams, in which no galley with oars will go, neither will any gallant ship pass by there.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.22
    name: Isaiah 33:22
    apiRef: Isaiah33:22
    book: Isa
    chapter: 33
    verse: 22
    text: For the LORD is our judge, the LORD is our lawgiver, the LORD is our king; he will save us.
    web: For the LORD is our judge. The LORD is our lawgiver. The LORD is our king. He will save us.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.23
    name: Isaiah 33:23
    apiRef: Isaiah33:23
    book: Isa
    chapter: 33
    verse: 23
    text: 'Thy tacklings are loosed; they could not well strengthen their mast, they could not spread the sail: then is the prey of a great spoil divided; the lame take the prey.'
    web: Your rigging is untied. They couldn’t strengthen the foot of their mast. They couldn’t spread the sail. Then the prey of a great plunder was divided. The lame took the prey.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.33.24
    name: Isaiah 33:24
    apiRef: Isaiah33:24
    book: Isa
    chapter: 33
    verse: 24
    text: 'And the inhabitant shall not say, I am sick: the people that dwell therein shall be forgiven their iniquity.'
    web: The inhabitant won’t say, “I am sick.” The people who dwell therein will be forgiven their iniquity.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.33
- type: Verse
  data:
    osis: Isa.34.1
    name: Isaiah 34:1
    apiRef: Isaiah34:1
    book: Isa
    chapter: 34
    verse: 1
    text: 'Come near, ye nations, to hear; and hearken, ye people: let the earth hear, and all that is therein; the world, and all things that come forth of it.'
    web: Come near, you nations, to hear! Listen, you peoples. Let the earth and all it contains hear, the world, and everything that comes from it.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.2
    name: Isaiah 34:2
    apiRef: Isaiah34:2
    book: Isa
    chapter: 34
    verse: 2
    text: 'For the indignation of the LORD is upon all nations, and his fury upon all their armies: he hath utterly destroyed them, he hath delivered them to the slaughter.'
    web: For the LORD is enraged against all the nations, and angry with all their armies. He has utterly destroyed them. He has given them over for slaughter.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.3
    name: Isaiah 34:3
    apiRef: Isaiah34:3
    book: Isa
    chapter: 34
    verse: 3
    text: Their slain also shall be cast out, and their stink shall come up out of their carcases, and the mountains shall be melted with their blood.
    web: Their slain will also be cast out, and the stench of their dead bodies will come up. The mountains will melt in their blood.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.4
    name: Isaiah 34:4
    apiRef: Isaiah34:4
    book: Isa
    chapter: 34
    verse: 4
    text: 'And all the host of heaven shall be dissolved, and the heavens shall be rolled together as a scroll: and all their host shall fall down, as the leaf falleth off from the vine, and as a falling fig from the fig tree.'
    web: All of the army of the sky will be dissolved. The sky will be rolled up like a scroll, and all its armies will fade away, as a leaf fades from off a vine or a fig tree.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.5
    name: Isaiah 34:5
    apiRef: Isaiah34:5
    book: Isa
    chapter: 34
    verse: 5
    text: 'For my sword shall be bathed in heaven: behold, it shall come down upon Idumea, and upon the people of my curse, to judgment.'
    web: For my sword has drunk its fill in the sky. Behold, it will come down on Edom, and on the people of my curse, for judgment.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.6
    name: Isaiah 34:6
    apiRef: Isaiah34:6
    book: Isa
    chapter: 34
    verse: 6
    text: 'The sword of the LORD is filled with blood, it is made fat with fatness, and with the blood of lambs and goats, with the fat of the kidneys of rams: for the LORD hath a sacrifice in Bozrah, and a great slaughter in the land of Idumea.'
    web: The LORD’s sword is filled with blood. It is covered with fat, with the blood of lambs and goats, with the fat of the kidneys of rams; for the LORD has a sacrifice in Bozrah, and a great slaughter in the land of Edom.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.7
    name: Isaiah 34:7
    apiRef: Isaiah34:7
    book: Isa
    chapter: 34
    verse: 7
    text: And the unicorns shall come down with them, and the bullocks with the bulls; and their land shall be soaked with blood, and their dust made fat with fatness.
    web: The wild oxen will come down with them, and the young bulls with the mighty bulls; and their land will be drunken with blood, and their dust made greasy with fat.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.8
    name: Isaiah 34:8
    apiRef: Isaiah34:8
    book: Isa
    chapter: 34
    verse: 8
    text: For it is the day of the LORD’S vengeance, and the year of recompences for the controversy of Zion.
    web: For the LORD has a day of vengeance, a year of recompense for the cause of Zion.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.9
    name: Isaiah 34:9
    apiRef: Isaiah34:9
    book: Isa
    chapter: 34
    verse: 9
    text: And the streams thereof shall be turned into pitch, and the dust thereof into brimstone, and the land thereof shall become burning pitch.
    web: Its streams will be turned into pitch, its dust into sulfur, and its land will become burning pitch.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
