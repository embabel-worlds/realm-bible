  data:
    osis: Isa.47.10
    name: Isaiah 47:10
    apiRef: Isaiah47:10
    book: Isa
    chapter: 47
    verse: 10
    text: 'For thou hast trusted in thy wickedness: thou hast said, None seeth me. Thy wisdom and thy knowledge, it hath perverted thee; and thou hast said in thine heart, I am, and none else beside me.'
    web: For you have trusted in your wickedness. You have said, ‘No one sees me.’ Your wisdom and your knowledge has perverted you. You have said in your heart, ‘I am, and there is no one else besides me.’
    event: Prophecies of Isaiah
  relations:
