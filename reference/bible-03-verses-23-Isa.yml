    name: Isaiah 11:12
    apiRef: Isaiah11:12
    book: Isa
    chapter: 11
    verse: 12
    text: And he shall set up an ensign for the nations, and shall assemble the outcasts of Israel, and gather together the dispersed of Judah from the four corners of the earth.
    web: He will set up a banner for the nations, and will assemble the outcasts of Israel, and gather together the dispersed of Judah from the four corners of the earth.
    event: Prophecies of Isaiah
  relations:
