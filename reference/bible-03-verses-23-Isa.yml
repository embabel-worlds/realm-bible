- type: Verse
  data:
    osis: Isa.45.7
    name: Isaiah 45:7
    apiRef: Isaiah45:7
    book: Isa
    chapter: 45
    verse: 7
    text: 'I form the light, and create darkness: I make peace, and create evil: I the LORD do all these things.'
    web: I form the light and create darkness. I make peace and create calamity. I am the LORD, who does all these things.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.8
    name: Isaiah 45:8
    apiRef: Isaiah45:8
    book: Isa
    chapter: 45
    verse: 8
    text: 'Drop down, ye heavens, from above, and let the skies pour down righteousness: let the earth open, and let them bring forth salvation, and let righteousness spring up together; I the LORD have created it.'
    web: Rain, you heavens, from above, and let the skies pour down righteousness. Let the earth open, that it may produce salvation, and let it cause righteousness to spring up with it. I, the LORD, have created it.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.9
    name: Isaiah 45:9
    apiRef: Isaiah45:9
    book: Isa
    chapter: 45
    verse: 9
    text: Woe unto him that striveth with his Maker! Let the potsherd strive with the potsherds of the earth. Shall the clay say to him that fashioneth it, What makest thou? or thy work, He hath no hands?
    web: Woe to him who strives with his Maker— a clay pot among the clay pots of the earth! Shall the clay ask him who fashions it, ‘What are you making?’ or your work, ‘He has no hands’?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.10
    name: Isaiah 45:10
    apiRef: Isaiah45:10
    book: Isa
    chapter: 45
    verse: 10
    text: Woe unto him that saith unto his father, What begettest thou? or to the woman, What hast thou brought forth?
    web: Woe to him who says to a father, ‘What have you become the father of?’ or to a mother, ‘What have you given birth to?’”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.11
    name: Isaiah 45:11
    apiRef: Isaiah45:11
    book: Isa
    chapter: 45
    verse: 11
    text: Thus saith the LORD, the Holy One of Israel, and his Maker, Ask me of things to come concerning my sons, and concerning the work of my hands command ye me.
    web: 'The LORD, the Holy One of Israel and his Maker says: “You ask me about the things that are to come, concerning my sons, and you command me concerning the work of my hands!'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.12
    name: Isaiah 45:12
    apiRef: Isaiah45:12
    book: Isa
    chapter: 45
    verse: 12
    text: 'I have made the earth, and created man upon it: I, even my hands, have stretched out the heavens, and all their host have I commanded.'
    web: I have made the earth, and created man on it. I, even my hands, have stretched out the heavens. I have commanded all their army.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.13
    name: Isaiah 45:13
    apiRef: Isaiah45:13
    book: Isa
    chapter: 45
    verse: 13
    text: 'I have raised him up in righteousness, and I will direct all his ways: he shall build my city, and he shall let go my captives, not for price nor reward, saith the LORD of hosts.'
    web: I have raised him up in righteousness, and I will make all his ways straight. He shall build my city, and he shall let my exiles go free, not for price nor reward,” says the LORD of Armies.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.14
    name: Isaiah 45:14
    apiRef: Isaiah45:14
    book: Isa
    chapter: 45
    verse: 14
    text: 'Thus saith the LORD, The labour of Egypt, and merchandise of Ethiopia and of the Sabeans, men of stature, shall come over unto thee, and they shall be thine: they shall come after thee; in chains they shall come over, and they shall fall down unto thee, they shall make supplication unto thee, saying, Surely God is in thee; and there is none else, there is no God.'
    web: 'The LORD says: “The labor of Egypt, and the merchandise of Ethiopia, and the Sabeans, men of stature, will come over to you, and they will be yours. They will go after you. They shall come over in chains. They will bow down to you. They will make supplication to you: ‘Surely God is in you; and there is no one else. There is no other god.'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.15
    name: Isaiah 45:15
    apiRef: Isaiah45:15
    book: Isa
    chapter: 45
    verse: 15
    text: Verily thou art a God that hidest thyself, O God of Israel, the Saviour.
    web: Most certainly you are a God who has hidden yourself, God of Israel, the Savior.’”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.16
    name: Isaiah 45:16
    apiRef: Isaiah45:16
    book: Isa
    chapter: 45
    verse: 16
    text: 'They shall be ashamed, and also confounded, all of them: they shall go to confusion together that are makers of idols.'
    web: They will be disappointed, yes, confounded, all of them. Those who are makers of idols will go into confusion together.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.17
    name: Isaiah 45:17
    apiRef: Isaiah45:17
    book: Isa
    chapter: 45
    verse: 17
    text: 'But Israel shall be saved in the LORD with an everlasting salvation: ye shall not be ashamed nor confounded world without end.'
    web: Israel will be saved by the LORD with an everlasting salvation. You will not be disappointed nor confounded to ages everlasting.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.18
    name: Isaiah 45:18
    apiRef: Isaiah45:18
    book: Isa
    chapter: 45
    verse: 18
    text: 'For thus saith the LORD that created the heavens; God himself that formed the earth and made it; he hath established it, he created it not in vain, he formed it to be inhabited: I am the LORD; and there is none else.'
    web: 'For the LORD who created the heavens, the God who formed the earth and made it, who established it and didn’t create it a waste, who formed it to be inhabited says: “I am the LORD. There is no other.'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.19
    name: Isaiah 45:19
    apiRef: Isaiah45:19
    book: Isa
    chapter: 45
    verse: 19
    text: 'I have not spoken in secret, in a dark place of the earth: I said not unto the seed of Jacob, Seek ye me in vain: I the LORD speak righteousness, I declare things that are right.'
    web: I have not spoken in secret, in a place of the land of darkness. I didn’t say to the offspring of Jacob, ‘Seek me in vain.’ I, the LORD, speak righteousness. I declare things that are right.
    people:
    - israel_682
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.20
    name: Isaiah 45:20
    apiRef: Isaiah45:20
    book: Isa
    chapter: 45
    verse: 20
    text: 'Assemble yourselves and come; draw near together, ye that are escaped of the nations: they have no knowledge that set up the wood of their graven image, and pray unto a god that cannot save.'
    web: “Assemble yourselves and come. Draw near together, you who have escaped from the nations. Those have no knowledge who carry the wood of their engraved image, and pray to a god that can’t save.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.21
    name: Isaiah 45:21
    apiRef: Isaiah45:21
    book: Isa
    chapter: 45
    verse: 21
    text: 'Tell ye, and bring them near; yea, let them take counsel together: who hath declared this from ancient time? who hath told it from that time? have not I the LORD? and there is no God else beside me; a just God and a Saviour; there is none beside me.'
    web: Declare and present it. Yes, let them take counsel together. Who has shown this from ancient time? Who has declared it of old? Haven’t I, the LORD? There is no other God besides me, a just God and a Savior. There is no one besides me.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.22
    name: Isaiah 45:22
    apiRef: Isaiah45:22
    book: Isa
    chapter: 45
    verse: 22
    text: 'Look unto me, and be ye saved, all the ends of the earth: for I am God, and there is none else.'
    web: “Look to me, and be saved, all the ends of the earth; for I am God, and there is no other.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.23
    name: Isaiah 45:23
    apiRef: Isaiah45:23
    book: Isa
    chapter: 45
    verse: 23
    text: I have sworn by myself, the word is gone out of my mouth in righteousness, and shall not return, That unto me every knee shall bow, every tongue shall swear.
    web: I have sworn by myself. The word has gone out of my mouth in righteousness, and will not be revoked, that to me every knee shall bow, every tongue shall take an oath.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.24
    name: Isaiah 45:24
    apiRef: Isaiah45:24
    book: Isa
    chapter: 45
    verse: 24
    text: 'Surely, shall one say, in the LORD have I righteousness and strength: even to him shall men come; and all that are incensed against him shall be ashamed.'
    web: They will say of me, ‘There is righteousness and strength only in the LORD.’” Even to him will men come. All those who raged against him will be disappointed.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.45.25
    name: Isaiah 45:25
    apiRef: Isaiah45:25
    book: Isa
    chapter: 45
    verse: 25
    text: In the LORD shall all the seed of Israel be justified, and shall glory.
    web: All the offspring of Israel will be justified in the LORD, and will rejoice!
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.45
- type: Verse
  data:
    osis: Isa.46.1
    name: Isaiah 46:1
    apiRef: Isaiah46:1
    book: Isa
    chapter: 46
    verse: 1
    text: 'Bel boweth down, Nebo stoopeth, their idols were upon the beasts, and upon the cattle: your carriages were heavy loaden; they are a burden to the weary beast.'
    web: Bel bows down. Nebo stoops. Their idols are carried by animals, and on the livestock. The things that you carried around are heavy loads, a burden for the weary.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.2
    name: Isaiah 46:2
    apiRef: Isaiah46:2
    book: Isa
    chapter: 46
    verse: 2
    text: They stoop, they bow down together; they could not deliver the burden, but themselves are gone into captivity.
    web: They stoop and they bow down together. They could not deliver the burden, but they have gone into captivity.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.3
    name: Isaiah 46:3
    apiRef: Isaiah46:3
    book: Isa
    chapter: 46
    verse: 3
    text: 'Hearken unto me, O house of Jacob, and all the remnant of the house of Israel, which are borne by me from the belly, which are carried from the womb:'
    web: “Listen to me, house of Jacob, and all the remnant of the house of Israel, that have been carried from their birth, that have been carried from the womb.
    people:
    - israel_682
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.4
    name: Isaiah 46:4
    apiRef: Isaiah46:4
    book: Isa
    chapter: 46
    verse: 4
    text: 'And even to your old age I am he; and even to hoar hairs will I carry you: I have made, and I will bear; even I will carry, and will deliver you.'
    web: Even to old age I am he, and even to gray hairs I will carry you. I have made, and I will bear. Yes, I will carry, and will deliver.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.5
    name: Isaiah 46:5
    apiRef: Isaiah46:5
    book: Isa
    chapter: 46
    verse: 5
    text: To whom will ye liken me, and make me equal, and compare me, that we may be like?
    web: “To whom will you compare me, and consider my equal, and compare me, as if we were the same?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.6
    name: Isaiah 46:6
    apiRef: Isaiah46:6
    book: Isa
    chapter: 46
    verse: 6
    text: 'They lavish gold out of the bag, and weigh silver in the balance, and hire a goldsmith; and he maketh it a god: they fall down, yea, they worship.'
    web: Some pour out gold from the bag, and weigh silver in the balance. They hire a goldsmith, and he makes it a god. They fall down— yes, they worship.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.7
    name: Isaiah 46:7
    apiRef: Isaiah46:7
    book: Isa
    chapter: 46
    verse: 7
    text: 'They bear him upon the shoulder, they carry him, and set him in his place, and he standeth; from his place shall he not remove: yea, one shall cry unto him, yet can he not answer, nor save him out of his trouble.'
    web: They bear it on their shoulder. They carry it, and set it in its place, and it stands there. It cannot move from its place. Yes, one may cry to it, yet it can not answer. It cannot save him out of his trouble.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.8
    name: Isaiah 46:8
    apiRef: Isaiah46:8
    book: Isa
    chapter: 46
    verse: 8
    text: 'Remember this, and shew yourselves men: bring it again to mind, O ye transgressors.'
    web: “Remember this, and show yourselves men. Bring it to mind again, you transgressors.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.9
    name: Isaiah 46:9
    apiRef: Isaiah46:9
    book: Isa
    chapter: 46
    verse: 9
    text: 'Remember the former things of old: for I am God, and there is none else; I am God, and there is none like me,'
    web: Remember the former things of old; for I am God, and there is no other. I am God, and there is none like me.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.10
    name: Isaiah 46:10
    apiRef: Isaiah46:10
    book: Isa
    chapter: 46
    verse: 10
    text: 'Declaring the end from the beginning, and from ancient times the things that are not yet done, saying, My counsel shall stand, and I will do all my pleasure:'
    web: 'I declare the end from the beginning, and from ancient times things that are not yet done. I say: My counsel will stand, and I will do all that I please.'
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.11
    name: Isaiah 46:11
    apiRef: Isaiah46:11
    book: Isa
    chapter: 46
    verse: 11
    text: 'Calling a ravenous bird from the east, the man that executeth my counsel from a far country: yea, I have spoken it, I will also bring it to pass; I have purposed it, I will also do it.'
    web: I call a ravenous bird from the east, the man of my counsel from a far country. Yes, I have spoken. I will also bring it to pass. I have planned. I will also do it.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.12
    name: Isaiah 46:12
    apiRef: Isaiah46:12
    book: Isa
    chapter: 46
    verse: 12
    text: 'Hearken unto me, ye stouthearted, that are far from righteousness:'
    web: Listen to me, you stubborn-hearted, who are far from righteousness!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.46.13
    name: Isaiah 46:13
    apiRef: Isaiah46:13
    book: Isa
    chapter: 46
    verse: 13
    text: 'I bring near my righteousness; it shall not be far off, and my salvation shall not tarry: and I will place salvation in Zion for Israel my glory.'
    web: I bring my righteousness near. It is not far off, and my salvation will not wait. I will grant salvation to Zion, my glory to Israel.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.46
- type: Verse
  data:
    osis: Isa.47.1
    name: Isaiah 47:1
    apiRef: Isaiah47:1
    book: Isa
    chapter: 47
    verse: 1
    text: 'Come down, and sit in the dust, O virgin daughter of Babylon, sit on the ground: there is no throne, O daughter of the Chaldeans: for thou shalt no more be called tender and delicate.'
    web: “Come down and sit in the dust, virgin daughter of Babylon. Sit on the ground without a throne, daughter of the Chaldeans. For you will no longer be called tender and delicate.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.47
- type: Verse
  data:
    osis: Isa.47.2
    name: Isaiah 47:2
    apiRef: Isaiah47:2
    book: Isa
    chapter: 47
    verse: 2
    text: 'Take the millstones, and grind meal: uncover thy locks, make bare the leg, uncover the thigh, pass over the rivers.'
    web: Take the millstones and grind flour. Remove your veil, lift up your skirt, uncover your legs, and wade through the rivers.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.47
- type: Verse
  data:
    osis: Isa.47.3
    name: Isaiah 47:3
    apiRef: Isaiah47:3
    book: Isa
    chapter: 47
    verse: 3
    text: 'Thy nakedness shall be uncovered, yea, thy shame shall be seen: I will take vengeance, and I will not meet thee as a man.'
    web: Your nakedness will be uncovered. Yes, your shame will be seen. I will take vengeance, and will spare no one.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.47
- type: Verse
  data:
    osis: Isa.47.4
    name: Isaiah 47:4
    apiRef: Isaiah47:4
    book: Isa
    chapter: 47
    verse: 4
    text: As for our redeemer, the LORD of hosts is his name, the Holy One of Israel.
    web: Our Redeemer, the LORD of Armies is his name, is the Holy One of Israel.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.47
- type: Verse
  data:
    osis: Isa.47.5
    name: Isaiah 47:5
    apiRef: Isaiah47:5
    book: Isa
    chapter: 47
    verse: 5
    text: 'Sit thou silent, and get thee into darkness, O daughter of the Chaldeans: for thou shalt no more be called, The lady of kingdoms.'
    web: “Sit in silence, and go into darkness, daughter of the Chaldeans. For you shall no longer be called the mistress of kingdoms.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.47
- type: Verse
  data:
    osis: Isa.47.6
    name: Isaiah 47:6
    apiRef: Isaiah47:6
    book: Isa
    chapter: 47
    verse: 6
    text: 'I was wroth with my people, I have polluted mine inheritance, and given them into thine hand: thou didst shew them no mercy; upon the ancient hast thou very heavily laid thy yoke.'
    web: I was angry with my people. I profaned my inheritance and gave them into your hand. You showed them no mercy. You laid a very heavy yoke on the aged.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.47
- type: Verse
  data:
    osis: Isa.47.7
    name: Isaiah 47:7
    apiRef: Isaiah47:7
    book: Isa
    chapter: 47
    verse: 7
    text: 'And thou saidst, I shall be a lady for ever: so that thou didst not lay these things to thy heart, neither didst remember the latter end of it.'
    web: You said, ‘I will be a princess forever,’ so that you didn’t lay these things to your heart, nor did you remember the results.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.47
- type: Verse
  data:
    osis: Isa.47.8
    name: Isaiah 47:8
    apiRef: Isaiah47:8
    book: Isa
    chapter: 47
    verse: 8
    text: 'Therefore hear now this, thou that art given to pleasures, that dwellest carelessly, that sayest in thine heart, I am, and none else beside me; I shall not sit as a widow, neither shall I know the loss of children:'
    web: “Now therefore hear this, you who are given to pleasures, who sit securely, who say in your heart, ‘I am, and there is no one else besides me. I won’t sit as a widow, neither will I know the loss of children.’
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.47
- type: Verse
  data:
    osis: Isa.47.9
    name: Isaiah 47:9
    apiRef: Isaiah47:9
    book: Isa
    chapter: 47
    verse: 9
    text: 'But these two things shall come to thee in a moment in one day, the loss of children, and widowhood: they shall come upon thee in their perfection for the multitude of thy sorceries, and for the great abundance of thine enchantments.'
    web: 'But these two things will come to you in a moment in one day: the loss of children and widowhood. They will come on you in their full measure, in the multitude of your sorceries, and the great abundance of your enchantments.'
    event: Prophecies of Isaiah
  relations:
