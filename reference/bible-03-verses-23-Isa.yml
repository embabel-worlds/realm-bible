    name: Isaiah 11:15
    apiRef: Isaiah11:15
    book: Isa
    chapter: 11
    verse: 15
    text: And the LORD shall utterly destroy the tongue of the Egyptian sea; and with his mighty wind shall he shake his hand over the river, and shall smite it in the seven streams, and make men go over dryshod.
    web: The LORD will utterly destroy the tongue of the Egyptian sea; and with his scorching wind he will wave his hand over the River, and will split it into seven streams, and cause men to march over in sandals.
    people:
