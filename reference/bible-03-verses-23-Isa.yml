    apiRef: Isaiah14:20
    book: Isa
    chapter: 14
    verse: 20
    text: 'Thou shalt not be joined with them in burial, because thou hast destroyed thy land, and slain thy people: the seed of evildoers shall never be renowned.'
    web: You will not join them in burial, because you have destroyed your land. You have killed your people. The offspring of evildoers will not be named forever.
