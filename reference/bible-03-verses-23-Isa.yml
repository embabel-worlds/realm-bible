    name: Isaiah 22:5
    apiRef: Isaiah22:5
    book: Isa
    chapter: 22
    verse: 5
    text: For it is a day of trouble, and of treading down, and of perplexity by the Lord GOD of hosts in the valley of vision, breaking down the walls, and of crying to the mountains.
    web: For it is a day of confusion, and of treading down, and of perplexity from the Lord, GOD of Armies, in the valley of vision, a breaking down of the walls, and a crying to the mountains.”
    people:
    - god_1324
