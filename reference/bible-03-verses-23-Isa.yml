- type: Verse
  data:
    osis: Isa.34.10
    name: Isaiah 34:10
    apiRef: Isaiah34:10
    book: Isa
    chapter: 34
    verse: 10
    text: 'It shall not be quenched night nor day; the smoke thereof shall go up for ever: from generation to generation it shall lie waste; none shall pass through it for ever and ever.'
    web: It won’t be quenched night or day. Its smoke will go up forever. From generation to generation, it will lie waste. No one will pass through it forever and ever.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.11
    name: Isaiah 34:11
    apiRef: Isaiah34:11
    book: Isa
    chapter: 34
    verse: 11
    text: 'But the cormorant and the bittern shall possess it; the owl also and the raven shall dwell in it: and he shall stretch out upon it the line of confusion, and the stones of emptiness.'
    web: But the pelican and the porcupine will possess it. The owl and the raven will dwell in it. He will stretch the line of confusion over it, and the plumb line of emptiness.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.12
    name: Isaiah 34:12
    apiRef: Isaiah34:12
    book: Isa
    chapter: 34
    verse: 12
    text: They shall call the nobles thereof to the kingdom, but none shall be there, and all her princes shall be nothing.
    web: They shall call its nobles to the kingdom, but none shall be there; and all its princes shall be nothing.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.13
    name: Isaiah 34:13
    apiRef: Isaiah34:13
    book: Isa
    chapter: 34
    verse: 13
    text: 'And thorns shall come up in her palaces, nettles and brambles in the fortresses thereof: and it shall be an habitation of dragons, and a court for owls.'
    web: Thorns will come up in its palaces, nettles and thistles in its fortresses; and it will be a habitation of jackals, a court for ostriches.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.14
    name: Isaiah 34:14
    apiRef: Isaiah34:14
    book: Isa
    chapter: 34
    verse: 14
    text: The wild beasts of the desert shall also meet with the wild beasts of the island, and the satyr shall cry to his fellow; the screech owl also shall rest there, and find for herself a place of rest.
    web: The wild animals of the desert will meet with the wolves, and the wild goat will cry to his fellow. Yes, the night creature shall settle there, and shall find herself a place of rest.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.15
    name: Isaiah 34:15
    apiRef: Isaiah34:15
    book: Isa
    chapter: 34
    verse: 15
    text: 'There shall the great owl make her nest, and lay, and hatch, and gather under her shadow: there shall the vultures also be gathered, every one with her mate.'
    web: The arrow snake will make her nest there, and lay, hatch, and gather under her shade. Yes, the kites will be gathered there, every one with her mate.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.16
    name: Isaiah 34:16
    apiRef: Isaiah34:16
    book: Isa
    chapter: 34
    verse: 16
    text: 'Seek ye out of the book of the LORD, and read: no one of these shall fail, none shall want her mate: for my mouth it hath commanded, and his spirit it hath gathered them.'
    web: 'Search in the book of the LORD, and read: not one of these will be missing. None will lack her mate. For my mouth has commanded, and his Spirit has gathered them.'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.34.17
    name: Isaiah 34:17
    apiRef: Isaiah34:17
    book: Isa
    chapter: 34
    verse: 17
    text: 'And he hath cast the lot for them, and his hand hath divided it unto them by line: they shall possess it for ever, from generation to generation shall they dwell therein.'
    web: He has cast the lot for them, and his hand has divided it to them with a measuring line. They shall possess it forever. From generation to generation they will dwell in it.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.34
- type: Verse
  data:
    osis: Isa.35.1
    name: Isaiah 35:1
    apiRef: Isaiah35:1
    book: Isa
    chapter: 35
    verse: 1
    text: The wilderness and the solitary place shall be glad for them; and the desert shall rejoice, and blossom as the rose.
    web: The wilderness and the dry land will be glad. The desert will rejoice and blossom like a rose.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.35
- type: Verse
  data:
    osis: Isa.35.2
    name: Isaiah 35:2
    apiRef: Isaiah35:2
    book: Isa
    chapter: 35
    verse: 2
    text: 'It shall blossom abundantly, and rejoice even with joy and singing: the glory of Lebanon shall be given unto it, the excellency of Carmel and Sharon, they shall see the glory of the LORD, and the excellency of our God.'
    web: It will blossom abundantly, and rejoice even with joy and singing. Lebanon’s glory will be given to it, the excellence of Carmel and Sharon. They will see the LORD’s glory, the excellence of our God.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.35
- type: Verse
  data:
    osis: Isa.35.3
    name: Isaiah 35:3
    apiRef: Isaiah35:3
    book: Isa
    chapter: 35
    verse: 3
    text: Strengthen ye the weak hands, and confirm the feeble knees.
    web: Strengthen the weak hands, and make the feeble knees firm.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.35
- type: Verse
  data:
    osis: Isa.35.4
    name: Isaiah 35:4
    apiRef: Isaiah35:4
    book: Isa
    chapter: 35
    verse: 4
    text: 'Say to them that are of a fearful heart, Be strong, fear not: behold, your God will come with vengeance, even God with a recompence; he will come and save you.'
    web: Tell those who have a fearful heart, “Be strong! Don’t be afraid! Behold, your God will come with vengeance, God’s retribution. He will come and save you.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.35
- type: Verse
  data:
    osis: Isa.35.5
    name: Isaiah 35:5
    apiRef: Isaiah35:5
    book: Isa
    chapter: 35
    verse: 5
    text: Then the eyes of the blind shall be opened, and the ears of the deaf shall be unstopped.
    web: Then the eyes of the blind will be opened, and the ears of the deaf will be unstopped.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.35
- type: Verse
  data:
    osis: Isa.35.6
    name: Isaiah 35:6
    apiRef: Isaiah35:6
    book: Isa
    chapter: 35
    verse: 6
    text: 'Then shall the lame man leap as an hart, and the tongue of the dumb sing: for in the wilderness shall waters break out, and streams in the desert.'
    web: Then the lame man will leap like a deer, and the tongue of the mute will sing; for waters will break out in the wilderness, and streams in the desert.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.35
- type: Verse
  data:
    osis: Isa.35.7
    name: Isaiah 35:7
    apiRef: Isaiah35:7
    book: Isa
    chapter: 35
    verse: 7
    text: 'And the parched ground shall become a pool, and the thirsty land springs of water: in the habitation of dragons, where each lay, shall be grass with reeds and rushes.'
    web: The burning sand will become a pool, and the thirsty ground springs of water. Grass with reeds and rushes will be in the habitation of jackals, where they lay.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.35
- type: Verse
  data:
    osis: Isa.35.8
    name: Isaiah 35:8
    apiRef: Isaiah35:8
    book: Isa
    chapter: 35
    verse: 8
    text: 'And an highway shall be there, and a way, and it shall be called The way of holiness; the unclean shall not pass over it; but it shall be for those: the wayfaring men, though fools, shall not err therein.'
    web: A highway will be there, a road, and it will be called “The Holy Way”. The unclean shall not pass over it, but it will be for those who walk in the Way. Wicked fools shall not go there.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.35
- type: Verse
  data:
    osis: Isa.35.9
    name: Isaiah 35:9
    apiRef: Isaiah35:9
    book: Isa
    chapter: 35
    verse: 9
    text: 'No lion shall be there, nor any ravenous beast shall go up thereon, it shall not be found there; but the redeemed shall walk there:'
    web: No lion will be there, nor will any ravenous animal go up on it. They will not be found there; but the redeemed will walk there.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.35
- type: Verse
  data:
    osis: Isa.35.10
    name: Isaiah 35:10
    apiRef: Isaiah35:10
    book: Isa
    chapter: 35
    verse: 10
    text: 'And the ransomed of the LORD shall return, and come to Zion with songs and everlasting joy upon their heads: they shall obtain joy and gladness, and sorrow and sighing shall flee away.'
    web: Then the LORD’s ransomed ones will return, and come with singing to Zion; and everlasting joy will be on their heads. They will obtain gladness and joy, and sorrow and sighing will flee away.”
    people:
    - god_1324
    event: Prophecies of Isaiah
