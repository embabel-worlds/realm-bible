    apiRef: Isaiah30:12
    book: Isa
    chapter: 30
    verse: 12
    text: 'Wherefore thus saith the Holy One of Israel, Because ye despise this word, and trust in oppression and perverseness, and stay thereon:'
    web: Therefore the Holy One of Israel says, “Because you despise this word, and trust in oppression and perverseness, and rely on it,
    people:
