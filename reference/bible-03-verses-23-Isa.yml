    apiRef: Isaiah1:12
    book: Isa
    chapter: 1
    verse: 12
    text: When ye come to appear before me, who hath required this at your hand, to tread my courts?
    web: When you come to appear before me, who has required this at your hand, to trample my courts?
    event: Prophecies of Isaiah
