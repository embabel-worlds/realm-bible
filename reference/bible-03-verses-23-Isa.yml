  data:
    osis: Isa.51.10
    name: Isaiah 51:10
    apiRef: Isaiah51:10
    book: Isa
    chapter: 51
    verse: 10
    text: Art thou not it which hath dried the sea, the waters of the great deep; that hath made the depths of the sea a way for the ransomed to pass over?
    web: Isn’t it you who dried up the sea, the waters of the great deep; who made the depths of the sea a way for the redeemed to pass over?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
