    to:
      type: Passage
      osis: Isa.55
- type: Verse
  data:
    osis: Isa.55.2
    name: Isaiah 55:2
    apiRef: Isaiah55:2
    book: Isa
    chapter: 55
    verse: 2
    text: Wherefore do ye spend money for that which is not bread? and your labour for that which satisfieth not? hearken diligently unto me, and eat ye that which is good, and let your soul delight itself in fatness.
    web: Why do you spend money for that which is not bread, and your labor for that which doesn’t satisfy? Listen diligently to me, and eat that which is good, and let your soul delight itself in richness.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
