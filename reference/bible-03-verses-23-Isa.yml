    name: Isaiah 50:10
    apiRef: Isaiah50:10
    book: Isa
    chapter: 50
    verse: 10
    text: Who is among you that feareth the LORD, that obeyeth the voice of his servant, that walketh in darkness, and hath no light? let him trust in the name of the LORD, and stay upon his God.
    web: Who among you fears the LORD and obeys the voice of his servant? He who walks in darkness and has no light, let him trust in the LORD’s name, and rely on his God.
    people:
    - god_1324
