    apiRef: Isaiah14:26
    book: Isa
    chapter: 14
    verse: 26
    text: 'This is the purpose that is purposed upon the whole earth: and this is the hand that is stretched out upon all the nations.'
    web: This is the plan that is determined for the whole earth. This is the hand that is stretched out over all the nations.
