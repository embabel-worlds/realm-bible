  data:
    osis: Isa.21.1
    name: Isaiah 21:1
    apiRef: Isaiah21:1
    book: Isa
    chapter: 21
    verse: 1
    text: The burden of the desert of the sea. As whirlwinds in the south pass through; so it cometh from the desert, from a terrible land.
    web: The burden of the wilderness of the sea. As whirlwinds in the South sweep through, it comes from the wilderness, from an awesome land.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.21
- type: Verse
  data:
    osis: Isa.21.2
    name: Isaiah 21:2
    apiRef: Isaiah21:2
    book: Isa
    chapter: 21
    verse: 2
    text: 'A grievous vision is declared unto me; the treacherous dealer dealeth treacherously, and the spoiler spoileth. Go up, O Elam: besiege, O Media; all the sighing thereof have I made to cease.'
    web: A grievous vision is declared to me. The treacherous man deals treacherously, and the destroyer destroys. Go up, Elam; attack! I have stopped all of Media’s sighing.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.21
- type: Verse
  data:
    osis: Isa.21.3
    name: Isaiah 21:3
    apiRef: Isaiah21:3
    book: Isa
    chapter: 21
    verse: 3
    text: 'Therefore are my loins filled with pain: pangs have taken hold upon me, as the pangs of a woman that travaileth: I was bowed down at the hearing of it; I was dismayed at the seeing of it.'
    web: Therefore my thighs are filled with anguish. Pains have seized me, like the pains of a woman in labor. I am in so much pain that I can’t hear. I am so dismayed that I can’t see.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.21
- type: Verse
  data:
    osis: Isa.21.4
    name: Isaiah 21:4
    apiRef: Isaiah21:4
    book: Isa
    chapter: 21
    verse: 4
    text: 'My heart panted, fearfulness affrighted me: the night of my pleasure hath he turned into fear unto me.'
    web: My heart flutters. Horror has frightened me. The twilight that I desired has been turned into trembling for me.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.21
- type: Verse
  data:
    osis: Isa.21.5
    name: Isaiah 21:5
    apiRef: Isaiah21:5
    book: Isa
    chapter: 21
    verse: 5
    text: 'Prepare the table, watch in the watchtower, eat, drink: arise, ye princes, and anoint the shield.'
    web: They prepare the table. They set the watch. They eat. They drink. Rise up, you princes, oil the shield!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.21
