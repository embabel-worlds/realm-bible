    apiRef: Isaiah14:25
    book: Isa
    chapter: 14
    verse: 25
    text: 'That I will break the Assyrian in my land, and upon my mountains tread him under foot: then shall his yoke depart from off them, and his burden depart from off their shoulders.'
    web: that I will break the Assyrian in my land, and tread him under foot on my mountains. Then his yoke will leave them, and his burden leave their shoulders.
