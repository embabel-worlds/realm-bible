    name: Isaiah 22:25
    apiRef: Isaiah22:25
    book: Isa
    chapter: 22
    verse: 25
    text: 'In that day, saith the LORD of hosts, shall the nail that is fastened in the sure place be removed, and be cut down, and fall; and the burden that was upon it shall be cut off: for the LORD hath spoken it.'
    web: “In that day,” says the LORD of Armies, “the nail that was fastened in a sure place will give way. It will be cut down and fall. The burden that was on it will be cut off, for the LORD has spoken it.”
    people:
    - god_1324
