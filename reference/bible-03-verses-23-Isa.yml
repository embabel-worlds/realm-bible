    name: Isaiah 64:10
    apiRef: Isaiah64:10
    book: Isa
    chapter: 64
    verse: 10
    text: Thy holy cities are a wilderness, Zion is a wilderness, Jerusalem a desolation.
    web: Your holy cities have become a wilderness. Zion has become a wilderness, Jerusalem a desolation.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
