  data:
    osis: Isa.51.15
    name: Isaiah 51:15
    apiRef: Isaiah51:15
    book: Isa
    chapter: 51
    verse: 15
    text: 'But I am the LORD thy God, that divided the sea, whose waves roared: The LORD of hosts is his name.'
    web: For I am the LORD your God, who stirs up the sea so that its waves roar. the LORD of Armies is his name.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
