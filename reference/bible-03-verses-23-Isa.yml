    name: Isaiah 45:5
    apiRef: Isaiah45:5
    book: Isa
    chapter: 45
    verse: 5
    text: 'I am the LORD, and there is none else, there is no God beside me: I girded thee, though thou hast not known me:'
    web: I am the LORD, and there is no one else. Besides me, there is no God. I will strengthen you, though you have not known me,
    people:
    - god_1324
    event: Prophecies of Isaiah
