    to:
      type: Passage
      osis: Isa.63
- type: Verse
  data:
    osis: Isa.63.2
    name: Isaiah 63:2
    apiRef: Isaiah63:2
    book: Isa
    chapter: 63
    verse: 2
    text: Wherefore art thou red in thine apparel, and thy garments like him that treadeth in the winefat?
    web: Why is your clothing red, and your garments like him who treads in the wine vat?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.63
- type: Verse
  data:
    osis: Isa.63.3
    name: Isaiah 63:3
    apiRef: Isaiah63:3
    book: Isa
    chapter: 63
    verse: 3
    text: 'I have trodden the winepress alone; and of the people there was none with me: for I will tread them in mine anger, and trample them in my fury; and their blood shall be sprinkled upon my garments, and I will stain all my raiment.'
    web: “I have trodden the wine press alone. Of the peoples, no one was with me. Yes, I trod them in my anger and trampled them in my wrath. Their lifeblood is sprinkled on my garments, and I have stained all my clothing.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.63
- type: Verse
  data:
    osis: Isa.63.4
    name: Isaiah 63:4
    apiRef: Isaiah63:4
    book: Isa
    chapter: 63
    verse: 4
    text: For the day of vengeance is in mine heart, and the year of my redeemed is come.
    web: For the day of vengeance was in my heart, and the year of my redeemed has come.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.63
- type: Verse
  data:
    osis: Isa.63.5
    name: Isaiah 63:5
    apiRef: Isaiah63:5
    book: Isa
    chapter: 63
    verse: 5
    text: 'And I looked, and there was none to help; and I wondered that there was none to uphold: therefore mine own arm brought salvation unto me; and my fury, it upheld me.'
    web: I looked, and there was no one to help; and I wondered that there was no one to uphold. Therefore my own arm brought salvation to me. My own wrath upheld me.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.63
- type: Verse
  data:
    osis: Isa.63.6
    name: Isaiah 63:6
    apiRef: Isaiah63:6
    book: Isa
    chapter: 63
    verse: 6
    text: And I will tread down the people in mine anger, and make them drunk in my fury, and I will bring down their strength to the earth.
    web: I trod down the peoples in my anger and made them drunk in my wrath. I poured their lifeblood out on the earth.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.63
- type: Verse
  data:
    osis: Isa.63.7
    name: Isaiah 63:7
    apiRef: Isaiah63:7
    book: Isa
    chapter: 63
    verse: 7
    text: I will mention the lovingkindnesses of the LORD, and the praises of the LORD, according to all that the LORD hath bestowed on us, and the great goodness toward the house of Israel, which he hath bestowed on them according to his mercies, and according to the multitude of his lovingkindnesses.
    web: I will tell of the loving kindnesses of the LORD and the praises of the LORD, according to all that the LORD has given to us, and the great goodness toward the house of Israel, which he has given to them according to his mercies, and according to the multitude of his loving kindnesses.
    people:
    - god_1324
