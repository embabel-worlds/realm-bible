    name: Isaiah 10:25
    apiRef: Isaiah10:25
    book: Isa
    chapter: 10
    verse: 25
    text: For yet a very little while, and the indignation shall cease, and mine anger in their destruction.
    web: For yet a very little while, and the indignation against you will be accomplished, and my anger will be directed to his destruction.”
    event: Prophecies of Isaiah
  relations:
