    to:
      type: Passage
      osis: Isa.47
- type: Verse
  data:
    osis: Isa.47.11
    name: Isaiah 47:11
    apiRef: Isaiah47:11
    book: Isa
    chapter: 47
    verse: 11
    text: 'Therefore shall evil come upon thee; thou shalt not know from whence it riseth: and mischief shall fall upon thee; thou shalt not be able to put it off: and desolation shall come upon thee suddenly, which thou shalt not know.'
    web: Therefore disaster will come on you. You won’t know when it dawns. Mischief will fall on you. You won’t be able to put it away. Desolation will come on you suddenly, which you don’t understand.
    event: Prophecies of Isaiah
