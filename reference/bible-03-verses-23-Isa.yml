    apiRef: Isaiah1:7
    book: Isa
    chapter: 1
    verse: 7
    text: 'Your country is desolate, your cities are burned with fire: your land, strangers devour it in your presence, and it is desolate, as overthrown by strangers.'
    web: Your country is desolate. Your cities are burned with fire. Strangers devour your land in your presence and it is desolate, as overthrown by strangers.
