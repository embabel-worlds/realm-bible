- type: Verse
  data:
    osis: Isa.19.1
    name: Isaiah 19:1
    apiRef: Isaiah19:1
    book: Isa
    chapter: 19
    verse: 1
    text: 'The burden of Egypt. Behold, the LORD rideth upon a swift cloud, and shall come into Egypt: and the idols of Egypt shall be moved at his presence, and the heart of Egypt shall melt in the midst of it.'
    web: The burden of Egypt. “Behold, the LORD rides on a swift cloud, and comes to Egypt. The idols of Egypt will tremble at his presence; and the heart of Egypt will melt within it.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
- type: Verse
  data:
    osis: Isa.19.2
    name: Isaiah 19:2
    apiRef: Isaiah19:2
    book: Isa
    chapter: 19
    verse: 2
    text: 'And I will set the Egyptians against the Egyptians: and they shall fight every one against his brother, and every one against his neighbour; city against city, and kingdom against kingdom.'
    web: I will stir up the Egyptians against the Egyptians, and they will fight everyone against his brother, and everyone against his neighbor; city against city, and kingdom against kingdom.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
- type: Verse
  data:
    osis: Isa.19.3
    name: Isaiah 19:3
    apiRef: Isaiah19:3
    book: Isa
    chapter: 19
    verse: 3
    text: 'And the spirit of Egypt shall fail in the midst thereof; and I will destroy the counsel thereof: and they shall seek to the idols, and to the charmers, and to them that have familiar spirits, and to the wizards.'
    web: The spirit of the Egyptians will fail within them. I will destroy their counsel. They will seek the idols, the charmers, those who have familiar spirits, and the wizards.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
