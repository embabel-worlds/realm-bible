  data:
    osis: Isa.55.11
    name: Isaiah 55:11
    apiRef: Isaiah55:11
    book: Isa
    chapter: 55
    verse: 11
    text: 'So shall my word be that goeth forth out of my mouth: it shall not return unto me void, but it shall accomplish that which I please, and it shall prosper in the thing whereto I sent it.'
    web: 'so is my word that goes out of my mouth: it will not return to me void, but it will accomplish that which I please, and it will prosper in the thing I sent it to do.'
    event: Prophecies of Isaiah
  relations:
