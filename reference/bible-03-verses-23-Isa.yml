  data:
    osis: Isa.51.18
    name: Isaiah 51:18
    apiRef: Isaiah51:18
    book: Isa
    chapter: 51
    verse: 18
    text: There is none to guide her among all the sons whom she hath brought forth; neither is there any that taketh her by the hand of all the sons that she hath brought up.
    web: There is no one to guide her among all the sons to whom she has given birth; and there is no one who takes her by the hand among all the sons whom she has brought up.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.51.19
    name: Isaiah 51:19
    apiRef: Isaiah51:19
    book: Isa
    chapter: 51
    verse: 19
    text: 'These two things are come unto thee; who shall be sorry for thee? desolation, and destruction, and the famine, and the sword: by whom shall I comfort thee?'
    web: These two things have happened to you— who will grieve with you?— desolation and destruction, and famine and the sword. How can I comfort you?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.51.20
    name: Isaiah 51:20
    apiRef: Isaiah51:20
    book: Isa
    chapter: 51
    verse: 20
    text: 'Thy sons have fainted, they lie at the head of all the streets, as a wild bull in a net: they are full of the fury of the LORD, the rebuke of thy God.'
    web: Your sons have fainted. They lie at the head of all the streets, like an antelope in a net. They are full of the LORD’s wrath, the rebuke of your God.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.51.21
    name: Isaiah 51:21
    apiRef: Isaiah51:21
    book: Isa
    chapter: 51
    verse: 21
    text: 'Therefore hear now this, thou afflicted, and drunken, but not with wine:'
    web: 'Therefore now hear this, you afflicted, and drunken, but not with wine:'
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.51.22
    name: Isaiah 51:22
    apiRef: Isaiah51:22
    book: Isa
    chapter: 51
    verse: 22
    text: 'Thus saith thy Lord the LORD, and thy God that pleadeth the cause of his people, Behold, I have taken out of thine hand the cup of trembling, even the dregs of the cup of my fury; thou shalt no more drink it again:'
    web: Your Lord GOD, your God who pleads the cause of his people, says, “Behold, I have taken out of your hand the cup of staggering, even the bowl of the cup of my wrath. You will not drink it any more.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.51.23
    name: Isaiah 51:23
    apiRef: Isaiah51:23
    book: Isa
    chapter: 51
    verse: 23
    text: 'But I will put it into the hand of them that afflict thee; which have said to thy soul, Bow down, that we may go over: and thou hast laid thy body as the ground, and as the street, to them that went over.'
    web: I will put it into the hand of those who afflict you, who have said to your soul, ‘Bow down, that we may walk over you;’ and you have laid your back as the ground, like a street to those who walk over.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.51
- type: Verse
  data:
    osis: Isa.52.1
    name: Isaiah 52:1
    apiRef: Isaiah52:1
    book: Isa
    chapter: 52
    verse: 1
    text: 'Awake, awake; put on thy strength, O Zion; put on thy beautiful garments, O Jerusalem, the holy city: for henceforth there shall no more come into thee the uncircumcised and the unclean.'
    web: Awake, awake! Put on your strength, Zion. Put on your beautiful garments, Jerusalem, the holy city, for from now on the uncircumcised and the unclean will no more come into you.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.2
    name: Isaiah 52:2
    apiRef: Isaiah52:2
    book: Isa
    chapter: 52
    verse: 2
    text: 'Shake thyself from the dust; arise, and sit down, O Jerusalem: loose thyself from the bands of thy neck, O captive daughter of Zion.'
    web: Shake yourself from the dust! Arise, sit up, Jerusalem! Release yourself from the bonds of your neck, captive daughter of Zion!
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.3
    name: Isaiah 52:3
    apiRef: Isaiah52:3
    book: Isa
    chapter: 52
    verse: 3
    text: For thus saith the LORD, Ye have sold yourselves for nought; and ye shall be redeemed without money.
    web: For the LORD says, “You were sold for nothing; and you will be redeemed without money.”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.4
    name: Isaiah 52:4
    apiRef: Isaiah52:4
    book: Isa
    chapter: 52
    verse: 4
    text: For thus saith the Lord GOD, My people went down aforetime into Egypt to sojourn there; and the Assyrian oppressed them without cause.
    web: 'For the Lord GOD says: “My people went down at the first into Egypt to live there; and the Assyrian has oppressed them without cause.'
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.5
    name: Isaiah 52:5
    apiRef: Isaiah52:5
    book: Isa
    chapter: 52
    verse: 5
    text: Now therefore, what have I here, saith the LORD, that my people is taken away for nought? they that rule over them make them to howl, saith the LORD; and my name continually every day is blasphemed.
    web: “Now therefore, what do I do here,” says the LORD, “seeing that my people are taken away for nothing? Those who rule over them mock,” says the LORD, “and my name is blasphemed continually all day long.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.6
    name: Isaiah 52:6
    apiRef: Isaiah52:6
    book: Isa
    chapter: 52
    verse: 6
    text: 'Therefore my people shall know my name: therefore they shall know in that day that I am he that doth speak: behold, it is I.'
    web: Therefore my people shall know my name. Therefore they shall know in that day that I am he who speaks. Behold, it is I.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.7
    name: Isaiah 52:7
    apiRef: Isaiah52:7
    book: Isa
    chapter: 52
    verse: 7
    text: How beautiful upon the mountains are the feet of him that bringeth good tidings, that publisheth peace; that bringeth good tidings of good, that publisheth salvation; that saith unto Zion, Thy God reigneth!
    web: How beautiful on the mountains are the feet of him who brings good news, who publishes peace, who brings good news, who proclaims salvation, who says to Zion, “Your God reigns!”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.8
    name: Isaiah 52:8
    apiRef: Isaiah52:8
    book: Isa
    chapter: 52
    verse: 8
    text: 'Thy watchmen shall lift up the voice; with the voice together shall they sing: for they shall see eye to eye, when the LORD shall bring again Zion.'
    web: Your watchmen lift up their voice. Together they sing; for they shall see eye to eye when the LORD returns to Zion.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.9
    name: Isaiah 52:9
    apiRef: Isaiah52:9
    book: Isa
    chapter: 52
    verse: 9
    text: 'Break forth into joy, sing together, ye waste places of Jerusalem: for the LORD hath comforted his people, he hath redeemed Jerusalem.'
    web: Break out into joy! Sing together, you waste places of Jerusalem; for the LORD has comforted his people. He has redeemed Jerusalem.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.10
    name: Isaiah 52:10
    apiRef: Isaiah52:10
    book: Isa
    chapter: 52
    verse: 10
    text: The LORD hath made bare his holy arm in the eyes of all the nations; and all the ends of the earth shall see the salvation of our God.
    web: The LORD has made his holy arm bare in the eyes of all the nations. All the ends of the earth have seen the salvation of our God.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.11
    name: Isaiah 52:11
    apiRef: Isaiah52:11
    book: Isa
    chapter: 52
    verse: 11
    text: Depart ye, depart ye, go ye out from thence, touch no unclean thing; go ye out of the midst of her; be ye clean, that bear the vessels of the LORD.
    web: Depart! Depart! Go out from there! Touch no unclean thing! Go out from among her! Cleanse yourselves, you who carry the LORD’s vessels.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.12
    name: Isaiah 52:12
    apiRef: Isaiah52:12
    book: Isa
    chapter: 52
    verse: 12
    text: 'For ye shall not go out with haste, nor go by flight: for the LORD will go before you; and the God of Israel will be your rereward.'
    web: For you shall not go out in haste, neither shall you go by flight; for the LORD will go before you, and the God of Israel will be your rear guard.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.13
    name: Isaiah 52:13
    apiRef: Isaiah52:13
    book: Isa
    chapter: 52
    verse: 13
    text: Behold, my servant shall deal prudently, he shall be exalted and extolled, and be very high.
    web: Behold, my servant will deal wisely. He will be exalted and lifted up, and will be very high.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.14
    name: Isaiah 52:14
    apiRef: Isaiah52:14
    book: Isa
    chapter: 52
    verse: 14
    text: 'As many were astonied at thee; his visage was so marred more than any man, and his form more than the sons of men:'
    web: Just as many were astonished at you— his appearance was marred more than any man, and his form more than the sons of men—
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.52.15
    name: Isaiah 52:15
    apiRef: Isaiah52:15
    book: Isa
    chapter: 52
    verse: 15
    text: 'So shall he sprinkle many nations; the kings shall shut their mouths at him: for that which had not been told them shall they see; and that which they had not heard shall they consider.'
    web: so he will cleanse many nations. Kings will shut their mouths at him; for they will see that which had not been told them, and they will understand that which they had not heard.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.52
- type: Verse
  data:
    osis: Isa.53.1
    name: Isaiah 53:1
    apiRef: Isaiah53:1
    book: Isa
    chapter: 53
    verse: 1
    text: Who hath believed our report? and to whom is the arm of the LORD revealed?
    web: Who has believed our message? To whom has the LORD’s arm been revealed?
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.2
    name: Isaiah 53:2
    apiRef: Isaiah53:2
    book: Isa
    chapter: 53
    verse: 2
    text: 'For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, there is no beauty that we should desire him.'
    web: For he grew up before him as a tender plant, and as a root out of dry ground. He has no good looks or majesty. When we see him, there is no beauty that we should desire him.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.3
    name: Isaiah 53:3
    apiRef: Isaiah53:3
    book: Isa
    chapter: 53
    verse: 3
    text: 'He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were our faces from him; he was despised, and we esteemed him not.'
    web: He was despised and rejected by men, a man of suffering and acquainted with disease. He was despised as one from whom men hide their face; and we didn’t respect him.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.4
    name: Isaiah 53:4
    apiRef: Isaiah53:4
    book: Isa
    chapter: 53
    verse: 4
    text: 'Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted.'
    web: Surely he has borne our sickness and carried our suffering; yet we considered him plagued, struck by God, and afflicted.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.5
    name: Isaiah 53:5
    apiRef: Isaiah53:5
    book: Isa
    chapter: 53
    verse: 5
    text: 'But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.'
    web: But he was pierced for our transgressions. He was crushed for our iniquities. The punishment that brought our peace was on him; and by his wounds we are healed.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.6
    name: Isaiah 53:6
    apiRef: Isaiah53:6
    book: Isa
    chapter: 53
    verse: 6
    text: All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all.
    web: All we like sheep have gone astray. Everyone has turned to his own way; and the LORD has laid on him the iniquity of us all.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.7
    name: Isaiah 53:7
    apiRef: Isaiah53:7
    book: Isa
    chapter: 53
    verse: 7
    text: 'He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth.'
    web: He was oppressed, yet when he was afflicted he didn’t open his mouth. As a lamb that is led to the slaughter, and as a sheep that before its shearers is silent, so he didn’t open his mouth.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.8
    name: Isaiah 53:8
    apiRef: Isaiah53:8
    book: Isa
    chapter: 53
    verse: 8
    text: 'He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken.'
    web: He was taken away by oppression and judgment. As for his generation, who considered that he was cut off out of the land of the living and stricken for the disobedience of my people?
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.9
    name: Isaiah 53:9
    apiRef: Isaiah53:9
    book: Isa
    chapter: 53
    verse: 9
    text: And he made his grave with the wicked, and with the rich in his death; because he had done no violence, neither was any deceit in his mouth.
    web: They made his grave with the wicked, and with a rich man in his death, although he had done no violence, nor was any deceit in his mouth.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.10
    name: Isaiah 53:10
    apiRef: Isaiah53:10
    book: Isa
    chapter: 53
    verse: 10
    text: 'Yet it pleased the LORD to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the LORD shall prosper in his hand.'
    web: Yet it pleased the LORD to bruise him. He has caused him to suffer. When you make his soul an offering for sin, he will see his offspring. He will prolong his days and the LORD’s pleasure will prosper in his hand.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.11
    name: Isaiah 53:11
    apiRef: Isaiah53:11
    book: Isa
    chapter: 53
    verse: 11
    text: 'He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities.'
    web: After the suffering of his soul, he will see the light and be satisfied. My righteous servant will justify many by the knowledge of himself; and he will bear their iniquities.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.53.12
    name: Isaiah 53:12
    apiRef: Isaiah53:12
    book: Isa
    chapter: 53
    verse: 12
    text: 'Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors.'
    web: Therefore I will give him a portion with the great. He will divide the plunder with the strong, because he poured out his soul to death and was counted with the transgressors; yet he bore the sins of many and made intercession for the transgressors.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.53
- type: Verse
  data:
    osis: Isa.54.1
    name: Isaiah 54:1
    apiRef: Isaiah54:1
    book: Isa
    chapter: 54
    verse: 1
    text: 'Sing, O barren, thou that didst not bear; break forth into singing, and cry aloud, thou that didst not travail with child: for more are the children of the desolate than the children of the married wife, saith the LORD.'
    web: “Sing, barren, you who didn’t give birth! Break out into singing, and cry aloud, you who didn’t travail with child! For more are the children of the desolate than the children of the married wife,” says the LORD.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.54
- type: Verse
  data:
    osis: Isa.54.2
    name: Isaiah 54:2
    apiRef: Isaiah54:2
    book: Isa
    chapter: 54
    verse: 2
    text: 'Enlarge the place of thy tent, and let them stretch forth the curtains of thine habitations: spare not, lengthen thy cords, and strengthen thy stakes;'
    web: “Enlarge the place of your tent, and let them stretch out the curtains of your habitations; don’t spare; lengthen your cords, and strengthen your stakes.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.54
- type: Verse
  data:
    osis: Isa.54.3
    name: Isaiah 54:3
    apiRef: Isaiah54:3
    book: Isa
    chapter: 54
    verse: 3
    text: For thou shalt break forth on the right hand and on the left; and thy seed shall inherit the Gentiles, and make the desolate cities to be inhabited.
    web: For you will spread out on the right hand and on the left; and your offspring will possess the nations and settle in desolate cities.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.54
- type: Verse
  data:
    osis: Isa.54.4
    name: Isaiah 54:4
    apiRef: Isaiah54:4
    book: Isa
    chapter: 54
    verse: 4
    text: 'Fear not; for thou shalt not be ashamed: neither be thou confounded; for thou shalt not be put to shame: for thou shalt forget the shame of thy youth, and shalt not remember the reproach of thy widowhood any more.'
    web: “Don’t be afraid, for you will not be ashamed. Don’t be confounded, for you will not be disappointed. For you will forget the shame of your youth. You will remember the reproach of your widowhood no more.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.54
- type: Verse
  data:
    osis: Isa.54.5
    name: Isaiah 54:5
    apiRef: Isaiah54:5
    book: Isa
    chapter: 54
    verse: 5
    text: For thy Maker is thine husband; the LORD of hosts is his name; and thy Redeemer the Holy One of Israel; The God of the whole earth shall he be called.
    web: For your Maker is your husband; the LORD of Armies is his name. The Holy One of Israel is your Redeemer. He will be called the God of the whole earth.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.54
- type: Verse
  data:
    osis: Isa.54.6
    name: Isaiah 54:6
    apiRef: Isaiah54:6
    book: Isa
    chapter: 54
    verse: 6
    text: For the LORD hath called thee as a woman forsaken and grieved in spirit, and a wife of youth, when thou wast refused, saith thy God.
    web: For the LORD has called you as a wife forsaken and grieved in spirit, even a wife of youth, when she is cast off,” says your God.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.54
- type: Verse
  data:
    osis: Isa.54.7
    name: Isaiah 54:7
    apiRef: Isaiah54:7
    book: Isa
    chapter: 54
    verse: 7
    text: For a small moment have I forsaken thee; but with great mercies will I gather thee.
    web: “For a small moment I have forsaken you, but I will gather you with great mercies.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.54
- type: Verse
  data:
    osis: Isa.54.8
    name: Isaiah 54:8
    apiRef: Isaiah54:8
    book: Isa
    chapter: 54
    verse: 8
    text: In a little wrath I hid my face from thee for a moment; but with everlasting kindness will I have mercy on thee, saith the LORD thy Redeemer.
    web: In overflowing wrath I hid my face from you for a moment, but with everlasting loving kindness I will have mercy on you,” says the LORD your Redeemer.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.54
- type: Verse
  data:
    osis: Isa.54.9
    name: Isaiah 54:9
    apiRef: Isaiah54:9
    book: Isa
    chapter: 54
    verse: 9
    text: 'For this is as the waters of Noah unto me: for as I have sworn that the waters of Noah should no more go over the earth; so have I sworn that I would not be wroth with thee, nor rebuke thee.'
    web: “For this is like the waters of Noah to me; for as I have sworn that the waters of Noah will no more go over the earth, so I have sworn that I will not be angry with you, nor rebuke you.
    people:
    - noah_2210
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.54
- type: Verse
  data:
    osis: Isa.54.10
    name: Isaiah 54:10
    apiRef: Isaiah54:10
    book: Isa
    chapter: 54
    verse: 10
    text: For the mountains shall depart, and the hills be removed; but my kindness shall not depart from thee, neither shall the covenant of my peace be removed, saith the LORD that hath mercy on thee.
    web: For the mountains may depart, and the hills be removed, but my loving kindness will not depart from you, and my covenant of peace will not be removed,” says the LORD who has mercy on you.
    people:
