    name: Isaiah 50:5
    apiRef: Isaiah50:5
    book: Isa
    chapter: 50
    verse: 5
    text: The Lord GOD hath opened mine ear, and I was not rebellious, neither turned away back.
    web: The Lord GOD has opened my ear. I was not rebellious. I have not turned back.
    people:
    - god_1324
    event: Prophecies of Isaiah
