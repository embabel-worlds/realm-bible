    name: Isaiah 50:6
    apiRef: Isaiah50:6
    book: Isa
    chapter: 50
    verse: 6
    text: 'I gave my back to the smiters, and my cheeks to them that plucked off the hair: I hid not my face from shame and spitting.'
    web: I gave my back to those who beat me, and my cheeks to those who plucked off the hair. I didn’t hide my face from shame and spitting.
