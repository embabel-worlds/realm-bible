    apiRef: Isaiah11:1
    book: Isa
    chapter: 11
    verse: 1
    text: 'And there shall come forth a rod out of the stem of Jesse, and a Branch shall grow out of his roots:'
    web: A shoot will come out of the stock of Jesse, and a branch out of his roots will bear fruit.
    people:
