  data:
    osis: Isa.56.8
    name: Isaiah 56:8
    apiRef: Isaiah56:8
    book: Isa
    chapter: 56
    verse: 8
    text: The Lord GOD which gathereth the outcasts of Israel saith, Yet will I gather others to him, beside those that are gathered unto him.
    web: The Lord GOD, who gathers the outcasts of Israel, says, “I will yet gather others to him, in addition to his own who are gathered.”
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.56
