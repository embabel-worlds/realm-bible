    apiRef: Isaiah22:4
    book: Isa
    chapter: 22
    verse: 4
    text: Therefore said I, Look away from me; I will weep bitterly, labour not to comfort me, because of the spoiling of the daughter of my people.
    web: Therefore I said, “Look away from me. I will weep bitterly. Don’t labor to comfort me for the destruction of the daughter of my people.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.22
