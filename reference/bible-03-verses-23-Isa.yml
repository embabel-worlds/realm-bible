  data:
    osis: Isa.64.11
    name: Isaiah 64:11
    apiRef: Isaiah64:11
    book: Isa
    chapter: 64
    verse: 11
    text: 'Our holy and our beautiful house, where our fathers praised thee, is burned up with fire: and all our pleasant things are laid waste.'
    web: Our holy and our beautiful house where our fathers praised you is burned with fire. All our pleasant places are laid waste.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.64
