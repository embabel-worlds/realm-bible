    name: Isaiah 14:31
    apiRef: Isaiah14:31
    book: Isa
    chapter: 14
    verse: 31
    text: 'Howl, O gate; cry, O city; thou, whole Palestina, art dissolved: for there shall come from the north a smoke, and none shall be alone in his appointed times.'
    web: Howl, gate! Cry, city! You are melted away, Philistia, all of you; for smoke comes out of the north, and there is no straggler in his ranks.
