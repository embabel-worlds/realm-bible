    osis: Isa.55.3
    name: Isaiah 55:3
    apiRef: Isaiah55:3
    book: Isa
    chapter: 55
    verse: 3
    text: 'Incline your ear, and come unto me: hear, and your soul shall live; and I will make an everlasting covenant with you, even the sure mercies of David.'
    web: Turn your ear, and come to me. Hear, and your soul will live. I will make an everlasting covenant with you, even the sure mercies of David.
