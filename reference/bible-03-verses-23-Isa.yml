    apiRef: Isaiah11:16
    book: Isa
    chapter: 11
    verse: 16
    text: And there shall be an highway for the remnant of his people, which shall be left, from Assyria; like as it was to Israel in the day that he came up out of the land of Egypt.
    web: There will be a highway for the remnant that is left of his people from Assyria, like there was for Israel in the day that he came up out of the land of Egypt.
    event: Prophecies of Isaiah
