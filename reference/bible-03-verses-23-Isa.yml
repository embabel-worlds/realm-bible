  data:
    osis: Isa.36.21
    name: Isaiah 36:21
    apiRef: Isaiah36:21
    book: Isa
    chapter: 36
    verse: 21
    text: 'But they held their peace, and answered him not a word: for the king’s commandment was, saying, Answer him not.'
    web: But they remained silent, and said nothing in reply, for the king’s commandment was, “Don’t answer him.”
    event: Prophecies of Isaiah
  relations:
