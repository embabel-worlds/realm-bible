    name: Isaiah 19:22
    apiRef: Isaiah19:22
    book: Isa
    chapter: 19
    verse: 22
    text: 'And the LORD shall smite Egypt: he shall smite and heal it: and they shall return even to the LORD, and he shall be intreated of them, and shall heal them.'
    web: The LORD will strike Egypt, striking and healing. They will return to the LORD, and he will be entreated by them, and will heal them.
    people:
    - god_1324
