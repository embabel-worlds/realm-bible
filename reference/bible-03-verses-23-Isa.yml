- type: Verse
  data:
    osis: Isa.45.6
    name: Isaiah 45:6
    apiRef: Isaiah45:6
    book: Isa
    chapter: 45
    verse: 6
    text: That they may know from the rising of the sun, and from the west, that there is none beside me. I am the LORD, and there is none else.
    web: that they may know from the rising of the sun, and from the west, that there is no one besides me. I am the LORD, and there is no one else.
    people:
    - god_1324
