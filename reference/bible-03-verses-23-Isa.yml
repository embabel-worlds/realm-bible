  data:
    osis: Isa.21.12
    name: Isaiah 21:12
    apiRef: Isaiah21:12
    book: Isa
    chapter: 21
    verse: 12
    text: 'The watchman said, The morning cometh, and also the night: if ye will enquire, enquire ye: return, come.'
    web: The watchman said, “The morning comes, and also the night. If you will inquire, inquire. Come back again.”
    event: Prophecies of Isaiah
