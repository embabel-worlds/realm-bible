- type: Verse
  data:
    osis: Isa.50.11
    name: Isaiah 50:11
    apiRef: Isaiah50:11
    book: Isa
    chapter: 50
    verse: 11
    text: 'Behold, all ye that kindle a fire, that compass yourselves about with sparks: walk in the light of your fire, and in the sparks that ye have kindled. This shall ye have of mine hand; ye shall lie down in sorrow.'
    web: 'Behold, all you who kindle a fire, who adorn yourselves with torches around yourselves, walk in the flame of your fire, and among the torches that you have kindled. You will have this from my hand: you will lie down in sorrow.'
    event: Prophecies of Isaiah
  relations:
