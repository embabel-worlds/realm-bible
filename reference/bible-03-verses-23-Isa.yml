    book: Isa
    chapter: 55
    verse: 5
    text: Behold, thou shalt call a nation that thou knowest not, and nations that knew not thee shall run unto thee because of the LORD thy God, and for the Holy One of Israel; for he hath glorified thee.
    web: Behold, you shall call a nation that you don’t know; and a nation that didn’t know you shall run to you, because of the LORD your God, and for the Holy One of Israel; for he has glorified you.”
