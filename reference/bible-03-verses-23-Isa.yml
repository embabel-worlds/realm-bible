    name: Isaiah 19:5
    apiRef: Isaiah19:5
    book: Isa
    chapter: 19
    verse: 5
    text: And the waters shall fail from the sea, and the river shall be wasted and dried up.
    web: The waters will fail from the sea, and the river will be wasted and become dry.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
- type: Verse
  data:
    osis: Isa.19.6
    name: Isaiah 19:6
    apiRef: Isaiah19:6
    book: Isa
    chapter: 19
    verse: 6
    text: 'And they shall turn the rivers far away; and the brooks of defence shall be emptied and dried up: the reeds and flags shall wither.'
    web: The rivers will become foul. The streams of Egypt will be diminished and dried up. The reeds and flags will wither away.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
- type: Verse
  data:
    osis: Isa.19.7
    name: Isaiah 19:7
    apiRef: Isaiah19:7
    book: Isa
    chapter: 19
    verse: 7
    text: The paper reeds by the brooks, by the mouth of the brooks, and every thing sown by the brooks, shall wither, be driven away, and be no more.
    web: The meadows by the Nile, by the brink of the Nile, and all the sown fields of the Nile, will become dry, be driven away, and be no more.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
- type: Verse
  data:
    osis: Isa.19.8
    name: Isaiah 19:8
    apiRef: Isaiah19:8
    book: Isa
    chapter: 19
    verse: 8
    text: The fishers also shall mourn, and all they that cast angle into the brooks shall lament, and they that spread nets upon the waters shall languish.
    web: The fishermen will lament, and all those who fish in the Nile will mourn, and those who spread nets on the waters will languish.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
- type: Verse
  data:
    osis: Isa.19.9
    name: Isaiah 19:9
    apiRef: Isaiah19:9
    book: Isa
    chapter: 19
    verse: 9
    text: Moreover they that work in fine flax, and they that weave networks, shall be confounded.
    web: Moreover those who work in combed flax, and those who weave white cloth, will be confounded.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.19
