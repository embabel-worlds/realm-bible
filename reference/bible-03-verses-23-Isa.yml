  data:
    osis: Isa.20.6
    name: Isaiah 20:6
    apiRef: Isaiah20:6
    book: Isa
    chapter: 20
    verse: 6
    text: 'And the inhabitant of this isle shall say in that day, Behold, such is our expectation, whither we flee for help to be delivered from the king of Assyria: and how shall we escape?'
    web: The inhabitants of this coast land will say in that day, ‘Behold, this is our expectation, where we fled for help to be delivered from the king of Assyria. And we, how will we escape?’”
