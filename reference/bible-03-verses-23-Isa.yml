    apiRef: Isaiah12:3
    book: Isa
    chapter: 12
    verse: 3
    text: Therefore with joy shall ye draw water out of the wells of salvation.
    web: Therefore with joy you will draw water out of the wells of salvation.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.12
