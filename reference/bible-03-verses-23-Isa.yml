    name: Isaiah 23:10
    apiRef: Isaiah23:10
    book: Isa
    chapter: 23
    verse: 10
    text: 'Pass through thy land as a river, O daughter of Tarshish: there is no more strength.'
    web: Pass through your land like the Nile, daughter of Tarshish. There is no restraint any more.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.23
