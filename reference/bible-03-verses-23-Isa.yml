    name: Isaiah 56:2
    apiRef: Isaiah56:2
    book: Isa
    chapter: 56
    verse: 2
    text: Blessed is the man that doeth this, and the son of man that layeth hold on it; that keepeth the sabbath from polluting it, and keepeth his hand from doing any evil.
    web: Blessed is the man who does this, and the son of man who holds it fast; who keeps the Sabbath without profaning it and keeps his hand from doing any evil.”
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
