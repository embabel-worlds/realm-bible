  data:
    osis: Isa.13.6
    name: Isaiah 13:6
    apiRef: Isaiah13:6
    book: Isa
    chapter: 13
    verse: 6
    text: Howl ye; for the day of the LORD is at hand; it shall come as a destruction from the Almighty.
    web: Wail, for the LORD’s day is at hand! It will come as destruction from the Almighty.
    people:
    - god_1324
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.13
