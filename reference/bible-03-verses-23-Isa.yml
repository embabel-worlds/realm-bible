    name: Isaiah 50:7
    apiRef: Isaiah50:7
    book: Isa
    chapter: 50
    verse: 7
    text: 'For the Lord GOD will help me; therefore shall I not be confounded: therefore have I set my face like a flint, and I know that I shall not be ashamed.'
    web: For the Lord GOD will help me. Therefore I have not been confounded. Therefore I have set my face like a flint, and I know that I won’t be disappointed.
