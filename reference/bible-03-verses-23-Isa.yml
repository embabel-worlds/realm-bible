    apiRef: Isaiah63:18
    book: Isa
    chapter: 63
    verse: 18
    text: 'The people of thy holiness have possessed it but a little while: our adversaries have trodden down thy sanctuary.'
    web: Your holy people possessed it but a little while. Our adversaries have trodden down your sanctuary.
    event: Prophecies of Isaiah
  relations:
  - predicate: IN
    to:
      type: Passage
      osis: Isa.63
- type: Verse
  data:
    osis: Isa.63.19
    name: Isaiah 63:19
    apiRef: Isaiah63:19
    book: Isa
    chapter: 63
    verse: 19
    text: 'We are thine: thou never barest rule over them; they were not called by thy name.'
    web: We have become like those over whom you never ruled, like those who were not called by your name.
    event: Prophecies of Isaiah
