    apiRef: Ezekiel46:15
    book: Ezek
    chapter: 46
    verse: 15
    text: Thus shall they prepare the lamb, and the meat offering, and the oil, every morning for a continual burnt offering.
    web: Thus they shall prepare the lamb, the meal offering, and the oil, morning by morning, for a continual burnt offering.”
