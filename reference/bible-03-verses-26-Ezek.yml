    apiRef: Ezekiel46:14
    book: Ezek
    chapter: 46
    verse: 14
    text: And thou shalt prepare a meat offering for it every morning, the sixth part of an ephah, and the third part of an hin of oil, to temper with the fine flour; a meat offering continually by a perpetual ordinance unto the LORD.
    web: You shall prepare a meal offering with it morning by morning, the sixth part of an ephah, and the third part of a hin of oil to moisten the fine flour; a meal offering to the LORD continually by a perpetual ordinance.
