    book: Ezek
    chapter: 46
    verse: 13
    text: 'Thou shalt daily prepare a burnt offering unto the LORD of a lamb of the first year without blemish: thou shalt prepare it every morning.'
    web: “‘“You shall prepare a lamb a year old without defect for a burnt offering to the LORD daily. Morning by morning you shall prepare it.
