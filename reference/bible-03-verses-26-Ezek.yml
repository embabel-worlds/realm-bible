    apiRef: Ezekiel46:12
    book: Ezek
    chapter: 46
    verse: 12
    text: 'Now when the prince shall prepare a voluntary burnt offering or peace offerings voluntarily unto the LORD, one shall then open him the gate that looketh toward the east, and he shall prepare his burnt offering and his peace offerings, as he did on the sabbath day: then he shall go forth; and after his going forth one shall shut the gate.'
    web: When the prince prepares a free will offering, a burnt offering or peace offerings as a free will offering to the LORD, one shall open for him the gate that looks toward the east; and he shall prepare his burnt offering and his peace offerings, as he does on the Sabbath day. Then he shall go out; and after his going out one shall shut the gate.
    people:
