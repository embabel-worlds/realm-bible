
# The Church Catechism ("A Catechism, that is to say, an Instruction to be learned of every person before
# he be brought to be confirmed by the Bishop"), the catechism of the 1662 Prayer Book in the American form
# printed in the Episcopal Church's Book of Common Prayer of 1928 (public domain in the United States).
# The English 1662 printing is not used: its text is Crown property in the United Kingdom.
# Source: http://justus.anglican.org/resources/bcp/1928/Catechism.htm (via web.archive.org). Generated by scripts/anglican/build_texts.py.

- type: "CatechismEntry"
  data:
    key: "church-catechism/1"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "Your Baptism"
    number: 1
    question: "What is your Name?"
    text: "N. or N. N."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/2"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "Your Baptism"
    number: 2
    question: "Who gave you this Name?"
    text: "My Sponsors in Baptism; wherein I was made a member of Christ, the child of God, and an inheritor of the kingdom of heaven."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/3"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "Your Baptism"
    number: 3
    question: "What did your Sponsors then for you?"
    text: "They did promise and vow three things in my name: First, that I should renounce the devil and all his works, the pomps and vanity of this wicked world, and all the sinful lusts of the flesh; Secondly, that I should believe all the Articles of the Christian Faith; And Thirdly, that I should keep God's holy will and commandments, and walk in the same all the days of my life."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/4"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "Your Baptism"
    number: 4
    question: "Dost thou not think that thou art bound to believe, and to do, as they have promised for thee?"
    text: "Yes, verily; and by God's help so I will. And I heartily thank our heavenly Father, that he hath called me to this state of salvation, through Jesus Christ our Saviour. And I pray unto God to give me his grace, that I may continue in the same unto my life's end."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/5"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Creed"
    number: 5
    question: "Rehearse the Articles of thy Belief."
    text: "I believe in God the Father Almighty, Maker of heaven and earth: And in Jesus Christ his only Son our Lord: Who was conceived by the Holy Ghost, Born of the Virgin Mary: Suffered under Pontius Pilate, Was crucified, dead, and buried: He descended into hell; The third day he rose again from the dead: He ascended into heaven, And sitteth on the right hand of God the Father Almighty: From thence he shall come to judge the quick and the dead. I believe in the Holy Ghost: The holy Catholic Church; The Communion of Saints: The Forgiveness of sins: The Resurrection of the body: And the Life everlasting. Amen."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/6"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Creed"
    number: 6
    question: "What dost thou chiefly learn in these Articles of thy Belief?"
    text: "First, I learn to believe in God the Father, who hath made me, and all the world. Secondly, in God the Son, who hath redeemed me, and all mankind. Thirdly, in God the Holy Ghost, who sanctifieth me, and all the people of God."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/7"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Commandments"
    number: 7
    question: "You said that your Sponsors did promise for you, that you should keep God's Commandments. Tell me how many there are?"
    text: "Ten."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/8"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Commandments"
    number: 8
    question: "Which are they?"
    text: "The same which God spake in the twentieth Chapter of Exodus, saying, I am the Lord thy God, who brought thee out of the land of Egypt, out of the house of bondage. I. Thou shalt have none other gods but me. II. Thou shalt not make to thyself any graven image, nor the likeness of any thing that is in heaven above, or in the earth beneath, or in the water under the earth; thou shalt not bow down to them, nor worship them; for I the LORD thy God am a jealous God, and visit the sins of the fathers upon the children, unto the third and fourth generation of them that hate me; and show mercy unto thousands in them that love me and keep my commandments. III. Thou shalt not take the Name of the Lord thy God in vain; for the LORD will not hold him guiltless, that taketh his Name in vain. IV. Remember that thou keep holy the Sabbath-day. Six days shalt thou labour, and do all that thou hast to do; but the seventh day is the Sabbath of the Lord thy God. In it thou shalt do no manner of work; thou, and thy son, and thy daughter, thy man-servant, and thy maid-servant, thy cattle, and the stranger that is within thy gates. For in six days the Lord made heaven and earth, the sea, and all that in them is, and rested the seventh day: wherefore the Lord blessed the seventh day, and hallowed it. V. Honour thy father and thy mother; that thy days may be long in the land which the LORD thy God giveth thee. VI. Thou shalt do no murder. VII. Thou shalt not commit adultery. VIII. Thou shalt not steal. IX. Thou shalt not bear false witness against thy neighbour. X. Thou shalt not covet thy neighbour's house, thou shalt not covet thy neighbour's wife, nor his servant, nor his maid, nor his ox, nor his ass, nor any thing that is his."
    note: ""
    proofTexts:
    - "Exodus 20:1-17"
  relations:
  - predicate: "PROVED_BY"
    to:
      type: "Passage"
      osis: "Exod.20"
- type: "CatechismEntry"
  data:
    key: "church-catechism/9"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Commandments"
    number: 9
    question: "What dost thou chiefly learn by these Commandments?"
    text: "I learn two things; my duty towards God, and my duty towards my Neighbour."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/10"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Commandments"
    number: 10
    question: "What is thy duty towards God?"
    text: "My duty towards God is To believe in him, to fear him, And to love him with all my heart, with all my mind, with all my soul, and with all my strength: To worship him, to give him thanks: To put my whole trust in him, to call upon him: To honour his holy Name and his Word: And to serve him truly all the days of my life."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/11"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Commandments"
    number: 11
    question: "What is thy duty towards thy Neighbour?"
    text: "My duty towards my Neighbour is To love him as myself, and to do to all men as I would they should do unto me: To love, honour, and succour my father and mother: To honour and obey the civil authority: To submit myself to all my governors, teachers, spiritual pastors and masters: To order myself lowly and reverently to all my betters: To hurt nobody by word or deed: To be true and just in all my dealings: To bear no malice nor hatred in my heart: To keep my hands from picking and stealing, and my tongue from evil speaking, lying, and slandering: To keep my body in temperance, soberness, and chastity: Not to covet nor desire other men's goods; But to learn and labour truly to get mine own living, And to do my duty in that state of life unto which it shall please God to call me."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/12"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Lord's Prayer"
    number: 12
    question: "My good Child, know this; that thou art not able to do these things of thyself, nor to walk in the Com- mandments of God, and to serve him, without his special grace; which thou must learn at all times to call for by diligent prayer. Let me hear, therefore, if thou canst say the Lord’s Prayer."
    text: "Our Father, who art in heaven, Hallowed be thy Name. Thy kingdom come. Thy will be done, On earth as it is in heaven. Give us this day our daily bread. And forgive us our trespasses, As we forgive those who trespass against us. And lead us not into temptation, But deliver us from evil. Amen."
    note: "The proof text is the Lord's Prayer as Matthew records it; the Catechism quotes the prayer without citing it."
    proofTexts:
    - "Matthew 6:9-13"
  relations:
  - predicate: "PROVED_BY"
    to:
      type: "Passage"
      osis: "Matt.6"
- type: "CatechismEntry"
  data:
    key: "church-catechism/13"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Lord's Prayer"
    number: 13
    question: "What desirest thou of God in this Prayer?"
    text: "I desire my Lord God, our heavenly Father, who is the giver of all goodness, to send his grace unto me, and to all people; that we may worship him, serve him, and obey him, as we ought to do. And I pray unto God, that he will send us all things that are needful both for our souls and bodies; and that he will be merciful unto us, and forgive us our sins; and that it will please him to save and defend us in all dangers both of soul and body; and that he will keep us from all sin and wickedness, and from our spiritual enemy, and from everlasting death. And this I trust he will do of his mercy and goodness, through our Lord Jesus Christ. And therefore I say, Amen, So be it."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/14"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 14
    question: "How many Sacraments hath Christ ordained in his Church?"
    text: "Two only, as generally necessary to salvation; that is to say, Baptism, and the Supper of the Lord."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/15"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 15
    question: "What meanest thou by this word Sacrament?"
    text: "I mean an outward and visible sign of an inward and spiritual grace given unto us; ordained by Christ himself, as a means whereby we receive the same, and a pledge to assure us thereof."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/16"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 16
    question: "How many parts are there in a Sacrament?"
    text: "Two; the outward visible sign, and the inward spiritual grace."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/17"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 17
    question: "What is the outward visible sign or form in Baptism?"
    text: "Water; wherein the person is baptized, In the Name of the Father, and of the Son, and of the Holy Ghost."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/18"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 18
    question: "What is the inward and spiritual grace?"
    text: "A death unto sin, and a new birth unto righteousness: for being by nature born in sin, and the children of wrath, we are hereby made the children of grace."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/19"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 19
    question: "What is required of persons to be baptized?"
    text: "Repentance, whereby they forsake sin; and Faith, whereby they stedfastly believe the promises of God made to them in that Sacrament."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/20"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 20
    question: "Why then are Infants baptized, when by reason of their tender age they cannot perform them?"
    text: "Because they promise them both by their Sureties; which promise, when they come to age, themselves are bound to perform."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/21"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 21
    question: "Why was the Sacrament of the Lord’s Supper ordained?"
    text: "For the continual remembrance of the sacrifice of the death of Christ, and of the benefits which we receive thereby."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/22"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 22
    question: "What is the outward part or sign of the Lord’s Supper?"
    text: "Bread and Wine, which the Lord hath commanded to be received."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/23"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 23
    question: "What is the inward part, or thing signified?"
    text: "The Body and Blood of Christ, which are spiritually taken and received by the faithful in the Lord's Supper."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/24"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 24
    question: "What are the benefits whereof we are partakers thereby?"
    text: "The strengthening and refreshing of our souls by the Body and Blood of Christ, as our bodies are by the Bread and Wine."
    note: ""
- type: "CatechismEntry"
  data:
    key: "church-catechism/25"
    catechism: "The Church Catechism (1662, American form of 1928)"
    catechismId: "church-catechism"
    part: "A Catechism"
    partNumber: 1
    section: "The Sacraments"
    number: 25
    question: "What is required of those who come to the Lord's Supper?"
    text: "To examine themselves, whether they repent them truly of their former sins, stedfastly purposing to lead a new life; have a lively faith in God's mercy through Christ, with a thankful remembrance of his death; and be in charity with all men."
    note: ""
