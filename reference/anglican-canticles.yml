
# The twenty-one canticles of Morning and Evening Prayer: 1-7 in Rite One's wording, 8-21 in Rite Two's.
# A biblical canticle is FROM the chapter it is taken from. The Book of Common Prayer (1979), the Episcopal Church — public domain.
# Source: https://www.bcponline.org/DailyOffice/mp1.html and mp2.html . Generated by scripts/anglican/build_texts.py.

- type: "Canticle"
  data:
    key: "canticle-1"
    number: 1
    name: "A Song of Creation"
    latin: "Benedicite, omnia opera Domini"
    rite: "One"
    source: "Song of the Three Young Men, 35-65"
    text: "I Invocation\n\nO all ye works of the Lord, bless ye the Lord; *\n  praise him and magnify him for ever.\nO ye angels of the Lord, bless ye the Lord; *\n  praise him and magnify him for ever.\n\nII The Cosmic Order\n\nO ye heavens, bless ye the Lord; *\n  O ye waters that be above the firmament, bless ye the Lord;\nO all ye powers of the Lord, bless ye the Lord; *\n  praise him and magnify him for ever.\n\nO ye sun and moon, bless ye the Lord; *\n  O ye stars of heaven, bless ye the Lord;\nO ye showers and dew, bless ye the Lord; *\n  praise him and magnify him for ever.\n\nO ye winds of God, bless ye the Lord; *\n  O ye fire and heat, bless ye the Lord;\nO ye winter and summer, bless ye the Lord; *\n  praise him and magnify him for ever.\n\nO ye dews and frosts, bless ye the Lord; *\n  O ye frost and cold, bless ye the Lord;\nO ye ice and snow, bless ye the Lord; *\n  praise him and magnify him for ever.\n\nO ye nights and days, bless ye the Lord; *\n  O ye light and darkness, bless ye the Lord;\nO ye lightnings and clouds, bless ye the Lord; *\n  praise him and magnify him for ever.\n\nIII The Earth and its Creatures\n\nO let the earth bless the Lord; *\n  O ye mountains and hills, bless ye the Lord;\nO all ye green things upon the earth, bless ye the Lord; *\n  praise him and magnify him for ever.\n\nO ye wells, bless ye the Lord; *\n  O ye seas and floods, bless ye the Lord;\nO ye whales and all that move in the waters, bless ye the Lord;\n  praise him and magnify him for ever.\n\nO all ye fowls of the air, bless ye the Lord; *\n  O all ye beasts and cattle, bless ye the Lord;\nO ye children of men, bless ye the Lord; *\n  praise him and magnify him for ever.\n\nIV The People of God\n\nO ye people of God, bless ye the Lord; *\n  O ye priests of the Lord, bless ye the Lord;\nO ye servants of the Lord, bless ye the Lord; *\n  praise him and magnify him for ever.\n\nO ye spirits and souls of the righteous, bless ye the\nLord; *\n  O ye holy and humble men of heart, bless ye the Lord.\nLet us bless the Father, the Son, and the Holy Spirit; *\n  praise him and magnify him for ever."
- type: "Canticle"
  data:
    key: "canticle-2"
    number: 2
    name: "A Song of Praise"
    latin: "Benedictus es, Domine"
    rite: "One"
    source: "Song of the Three Young Men, 29-34"
    text: "Blessed art thou, O Lord God of our fathers; *\n  praised and exalted above all for ever.\nBlessed art thou for the Name of thy Majesty; *\n  praised and exalted above all for ever.\nBlessed art thou in the temple of thy holiness; *\n  praised and exalted above all for ever.\nBlessed art thou that beholdest the depths,\nand dwellest between the Cherubim; *\n  praised and exalted above all for ever.\nBlessed art thou on the glorious throne of thy kingdom; *\n  praised and exalted above all for ever.\nBlessed art thou in the firmament of heaven; *\n  praised and exalted above all for ever.\nBlessed art thou, O Father, Son, and Holy Spirit; *\n  praised and exalted above all for ever."
- type: "Canticle"
  data:
    key: "canticle-3"
    number: 3
    name: "The Song of Mary"
    latin: "Magnificat"
    rite: "One"
    source: "Luke 1:46-55"
    text: "My soul doth magnify the Lord, *\n  and my spirit hath rejoiced in God my Savior.\nFor he hath regarded *\n  the lowliness of his handmaiden.\nFor behold from henceforth *\n  all generations shall call me blessed.\nFor he that is mighty hath magnified me, *\n  and holy is his Name.\nAnd his mercy is on them that fear him *\n  throughout all generations.\nHe hath showed strength with his arm; *\n  he hath scattered the proud in the imagination of their hearts.\nHe hath put down the mighty from their seat, *\n  and hath exalted the humble and meek.\nHe hath filled the hungry with good things, *\n  and the rich he hath sent empty away.\nHe remembering his mercy hath holpen his servant Israel, *\n  as he promised to our forefathers,\n  Abraham and his seed for ever.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Luke.1"
- type: "Canticle"
  data:
    key: "canticle-4"
    number: 4
    name: "The Song of Zechariah"
    latin: "Benedictus Dominus Deus"
    rite: "One"
    source: "Luke 1:68-79"
    text: "Blessed be the Lord God of Israel, *\n  for he hath visited and redeemed his people;\nAnd hath raised up a mighty salvation for us *\n  in the house of his servant David,\nAs he spake by the mouth of his holy prophets, *\n  which have been since the world began:\n\nThat we should be saved from our enemies, *\n  and from the hand of all that hate us;\nTo perform the mercy promised to our forefathers, *\n  and to remember his holy covenant;\nTo perform the oath which he sware to our forefather Abraham, *\n  that he would give us,\nThat we being delivered out of the hand of our enemies *\n  might serve him without fear,\nIn holiness and righteousness before him, *\n  all the days of our life.\n\nAnd thou, child, shalt be called the prophet of the Highest, *\n  for thou shalt go before the face of the Lord\n  to prepare his ways;\nTo give knowledge of salvation unto his people *\n  for the remission of their sins,\nThrough the tender mercy of our God, *\n  whereby the dayspring from on high hath visited us;\nTo give light to them that sit in darkness\nand in the shadow of death, *\n  and to guide our feet into the way of peace.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Luke.1"
- type: "Canticle"
  data:
    key: "canticle-5"
    number: 5
    name: "The Song of Simeon"
    latin: "Nunc dimittis"
    rite: "One"
    source: "Luke 2:29-32"
    text: "Lord, now lettest thou thy servant depart in peace, *\n  according to thy word;\nFor mine eyes have seen thy salvation, *\n  which thou hast prepared before the face of all people,\nTo be a light to lighten the Gentiles, *\n  and to be the glory of thy people Israel.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Luke.2"
- type: "Canticle"
  data:
    key: "canticle-6"
    number: 6
    name: "Glory be to God"
    latin: "Gloria in Excelsis"
    rite: "One"
    source: ""
    text: "Glory be to God on high,\n  and on earth peace, good will towards men.\n\nWe praise thee, we bless thee,\n  we worship thee,\n  we glorify thee,\n  we give thanks to thee for thy great glory,\nO Lord God, heavenly King, God the Father Almighty.\n\nO Lord, the only-begotten Son, Jesus Christ;\nO Lord God, Lamb of God, Son of the Father,\n  that takest away the sins of the world,\n  have mercy upon us.\nThou that takest away the sins of the world,\n  receive our prayer.\nThou that sittest at the right hand of God the Father,\n  have mercy upon us.\n\nFor thou only art holy,\nthou only art the Lord,\nthou only, O Christ,\n  with the Holy Ghost,\n  art most high in the glory of God the Father. Amen."
- type: "Canticle"
  data:
    key: "canticle-7"
    number: 7
    name: "We Praise Thee"
    latin: "Te Deum laudamus"
    rite: "One"
    source: ""
    text: "We praise thee, O God; we acknowledge thee to be the Lord.\nAll the earth doth worship thee, the Father everlasting.\nTo thee all Angels cry aloud,\nthe Heavens and all the Powers therein.\nTo thee Cherubim and Seraphim continually do cry:\n\nHoly, holy, holy, Lord God of Sabaoth;\n  Heaven and earth are full of the majesty of thy glory.\nThe glorious company of the apostles praise thee.\nThe goodly fellowship of the prophets praise thee.\nThe noble army of martyrs praise thee.\nThe holy Church throughout all the world\n  doth acknowledge thee,\n  the Father, of an infinite majesty,\n  thine adorable, true, and only Son,\n  also the Holy Ghost the Comforter.\n\nThou art the King of glory, O Christ.\nThou art the everlasting Son of the Father.\nWhen thou tookest upon thee to deliver man,\nthou didst humble thyself to be born of a Virgin.\nWhen thou hadst overcome the sharpness of death,\nthou didst open the kingdom of heaven to all believers.\nThou sittest at the right hand of God, in the glory of the Father.\nWe believe that thou shalt come to be our judge.\n  We therefore pray thee, help thy servants,\n  whom thou hast redeemed with thy precious blood.\n  Make them to be numbered with thy saints,\n  in glory everlasting."
- type: "Canticle"
  data:
    key: "canticle-8"
    number: 8
    name: "The Song of Moses"
    latin: "Cantemus Domino"
    rite: "Two"
    source: "Exodus 15:1-6, 11-13, 17-18"
    text: "I will sing to the Lord, for he is lofty and uplifted; *\n  the horse and its rider has he hurled into the sea.\nThe Lord is my strength and my refuge; *\n  the Lord has become my Savior.\nThis is my God and I will praise him, *\n  the God of my people and I will exalt him.\nThe Lord is a mighty warrior; *\n  Yahweh is his Name.\nThe chariots of Pharaoh and his army has he hurled into the sea; *\n  the finest of those who bear armor have been\n  drowned in the Red Sea.\nThe fathomless deep has overwhelmed them; *\n  they sank into the depths like a stone.\nYour right hand, O Lord, is glorious in might; *\n  your right hand, O Lord, has overthrown the enemy.\nWho can be compared with you, O Lord, among the gods? *\n  who is like you, glorious in holiness,\n  awesome in renown, and worker of wonders?\nYou stretched forth your right hand; *\n  the earth swallowed them up.\nWith your constant love you led the people you redeemed; *\n  with your might you brought them in safety to\n  your holy dwelling.\nYou will bring them in and plant them *\n  on the mount of your possession,\nThe resting-place you have made for yourself, O Lord, *\n  the sanctuary, O Lord, that your hand has established.\nThe Lord shall reign *\n  for ever and for ever.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Exod.15"
- type: "Canticle"
  data:
    key: "canticle-9"
    number: 9
    name: "The First Song of Isaiah"
    latin: "Ecce, Deus"
    rite: "Two"
    source: "Isaiah 12:2-6"
    text: "Surely, it is God who saves me; *\n  I will trust in him and not be afraid.\nFor the Lord is my stronghold and my sure defense, *\n  and he will be my Savior.\nTherefore you shall draw water with rejoicing *\n  from the springs of salvation.\nAnd on that day you shall say, *\n  Give thanks to the Lord and call upon his Name;\nMake his deeds known among the peoples; *\n  see that they remember that his Name is exalted.\nSing the praises of the Lord, for he has done great things, *\n  and this is known in all the world.\nCry aloud, inhabitants of Zion, ring out your joy, *\n  for the great one in the midst of you is the Holy One of Israel.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Isa.12"
- type: "Canticle"
  data:
    key: "canticle-10"
    number: 10
    name: "The Second Song of Isaiah"
    latin: "Quaerite Dominum"
    rite: "Two"
    source: "Isaiah 55:6-11"
    text: "Seek the Lord while he wills to be found; *\n  call upon him when he draws near.\nLet the wicked forsake their ways *\n  and the evil ones their thoughts;\nAnd let them turn to the Lord, and he will have compassion, *\n  and to our God, for he will richly pardon.\nFor my thoughts are not your thoughts, *\n  nor your ways my ways, says the Lord.\nFor as the heavens are higher than the earth, *\n  so are my ways higher than your ways,\n  and my thoughts than your thoughts.\n\nFor as rain and snow fall from the heavens *\n  and return not again, but water the earth,\nBringing forth life and giving growth, *\n  seed for sowing and bread for eating,\nSo is my word that goes forth from my mouth; *\n  it will not return to me empty;\nBut it will accomplish that which I have purposed, *\n  and prosper in that for which I sent it.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Isa.55"
- type: "Canticle"
  data:
    key: "canticle-11"
    number: 11
    name: "The Third Song of Isaiah"
    latin: "Surge, illuminare"
    rite: "Two"
    source: "Isaiah 60:1-3, 11a, 14c, 18-19"
    text: "Arise, shine, for your light has come, *\n  and the glory of the Lord has dawned upon you.\nFor behold, darkness covers the land; *\n  deep gloom enshrouds the peoples.\nBut over you the Lord will rise, *\n  and his glory will appear upon you.\nNations will stream to your light, *\n  and kings to the brightness of your dawning.\nYour gates will always be open; *\n  by day or night they will never be shut.\nThey will call you, The City of the Lord, *\n  The Zion of the Holy One of Israel.\nViolence will no more be heard in your land, *\n  ruin or destruction within your borders.\nYou will call your walls, Salvation, *\n  and all your portals, Praise.\nThe sun will no more be your light by day; *\n  by night you will not need the brightness of the moon.\n\nThe Lord will be your everlasting light, *\n  and your God will be your glory.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Isa.60"
- type: "Canticle"
  data:
    key: "canticle-12"
    number: 12
    name: "A Song of Creation"
    latin: "Benedicite, omnia opera Domini"
    rite: "Two"
    source: "Song of the Three Young Men, 35-65"
    text: "Invocation\n\nGlorify the Lord, all you works of the Lord, *\n  praise him and highly exalt him for ever.\nIn the firmament of his power, glorify the Lord, *\n  praise him and highly exalt him for ever.\n\nI The Cosmic Order\n\nGlorify the Lord, you angels and all powers of the Lord, *\n  O heavens and all waters above the heavens.\nSun and moon and stars of the sky, glorify the Lord, *\n  praise him and highly exalt him for ever.\n\nGlorify the Lord, every shower of rain and fall of dew, *\n  all winds and fire and heat.\nWinter and Summer, glorify the Lord, *\n  praise him and highly exalt him for ever.\n\nGlorify the Lord, O chill and cold, *\ndrops of dew and flakes of snow.\nFrost and cold, ice and sleet, glorify the Lord, *\n  praise him and highly exalt him for ever.\n\nGlorify the Lord, O nights and days, *\n  O shining light and enfolding dark.\nStorm clouds and thunderbolts, glorify the Lord, *\n  praise him and highly exalt him for ever.\n\nII The Earth and its Creatures\n\nLet the earth glorify the Lord, *\n  praise him and highly exalt him for ever.\nGlorify the Lord, O mountains and hills,\nand all that grows upon the earth, *\n  praise him and highly exalt him for ever.\n\nGlorify the Lord, O springs of water, seas, and streams, *\n  O whales and all that move in the waters.\nAll birds of the air, glorify the Lord, *\n  praise him and highly exalt him for ever.\n\nGlorify the Lord, O beasts of the wild, *\n  and all you flocks and herds.\nO men and women everywhere, glorify the Lord, *\n  praise him and highly exalt him for ever.\n\nIII The People of God\n\nLet the people of God glorify the Lord, *\n  praise him and highly exalt him for ever.\nGlorify the Lord, O priests and servants of the Lord, *\n  praise him and highly exalt him for ever.\n\nGlorify the Lord, O spirits and souls of the righteous, *\n  praise him and highly exalt him for ever.\nYou that are holy and humble of heart, glorify the Lord, *\n  praise him and highly exalt him for ever.\n\nDoxology\n\nLet us glorify the Lord: Father, Son, and Holy Spirit; *\n  praise him and highly exalt him for ever.\nIn the firmament of his power, glorify the Lord, *\n  praise him and highly exalt him for ever."
- type: "Canticle"
  data:
    key: "canticle-13"
    number: 13
    name: "A Song of Praise"
    latin: "Benedictus es, Domine"
    rite: "Two"
    source: "Song of the Three Young Men, 29-34"
    text: "Glory to you, Lord God of our fathers; *\n  you are worthy of praise; glory to you.\nGlory to you for the radiance of your holy Name; *\n  we will praise you and highly exalt you for ever.\n\nGlory to you in the splendor of your temple; *\n  on the throne of your majesty, glory to you.\nGlory to you, seated between the Cherubim; *\n  we will praise you and highly exalt you for ever.\n\nGlory to you, beholding the depths; *\n  in the high vault of heaven, glory to you.\nGlory to you, Father, Son, and Holy Spirit; *\n  we will praise you and highly exalt you for ever."
- type: "Canticle"
  data:
    key: "canticle-14"
    number: 14
    name: "A Song of Penitence"
    latin: "Kyrie Pantokrator"
    rite: "Two"
    source: "Prayer of Manasseh 1-2, 4, 6-7, 11-15"
    text: "O Lord and Ruler of the hosts of heaven, *\n  God of Abraham, Isaac, and Jacob,\n  and of all their righteous offspring:\nYou made the heavens and the earth, *\n  with all their vast array.\n\nAll things quake with fear at your presence; *\n  they tremble because of your power.\nBut your merciful promise is beyond all measure; *\n  it surpasses all that our minds can fathom.\nO Lord, you are full of compassion, *\n  long-suffering, and abounding in mercy.\nYou hold back your hand; *\n  you do not punish as we deserve.\nIn your great goodness, Lord,\nyou have promised forgiveness to sinners, *\n  that they may repent of their sin and be saved.\nAnd now, O Lord, I bend the knee of my heart, *\n  and make my appeal, sure of your gracious goodness.\nI have sinned, O Lord, I have sinned, *\n  and I know my wickedness only too well.\nTherefore I make this prayer to you: *\n  Forgive me, Lord, forgive me.\nDo not let me perish in my sin, *\n  nor condemn me to the depths of the earth.\nFor you, O Lord, are the God of those who repent, *\n  and in me you will show forth your goodness.\nUnworthy as I am, you will save me,\nin accordance with your great mercy, *\n  and I will praise you without ceasing all the days of my life.\nFor all the powers of heaven sing your praises, *\n  and yours is the glory to ages of ages. Amen."
- type: "Canticle"
  data:
    key: "canticle-15"
    number: 15
    name: "The Song of Mary"
    latin: "Magnificat"
    rite: "Two"
    source: "Luke 1:46-55"
    text: "My soul proclaims the greatness of the Lord,\nmy spirit rejoices in God my Savior; *\n  for he has looked with favor on his lowly servant.\n\nFrom this day all generations will call me blessed: *\n  the Almighty has done great things for me,\n  and holy is his Name.\nHe has mercy on those who fear him *\n  in every generation.\nHe has shown the strength of his arm, *\n  he has scattered the proud in their conceit.\nHe has cast down the mighty from their thrones, *\n  and has lifted up the lowly.\nHe has filled the hungry with good things, *\n  and the rich he has sent away empty.\nHe has come to the help of his servant Israel, *\n  for he has remembered his promise of mercy,\nThe promise he made to our fathers, *\n  to Abraham and his children for ever.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Luke.1"
- type: "Canticle"
  data:
    key: "canticle-16"
    number: 16
    name: "The Song of Zechariah"
    latin: "Benedictus Dominus Deus"
    rite: "Two"
    source: "Luke 1:68-79"
    text: "Blessed be the Lord, the God of Israel; *\n  he has come to his people and set them free.\nHe has raised up for us a mighty savior, *\n  born of the house of his servant David.\nThrough his holy prophets he promised of old,\nthat he would save us from our enemies, *\n  from the hands of all who hate us.\nHe promised to show mercy to our fathers *\n  and to remember his holy covenant.\nThis was the oath he swore to our father Abraham, *\n  to set us free from the hands of our enemies,\nFree to worship him without fear, *\n  holy and righteous in his sight\n  all the days of our life.\n\nYou, my child, shall be called the prophet of the Most High, *\n  for you will go before the Lord to prepare his way,\nTo give his people knowledge of salvation *\n  by the forgiveness of their sins.\nIn the tender compassion of our God *\n  the dawn from on high shall break upon us,\nTo shine on those who dwell in darkness and the\n  shadow of death, *\n  and to guide our feet into the way of peace.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Luke.1"
- type: "Canticle"
  data:
    key: "canticle-17"
    number: 17
    name: "The Song of Simeon"
    latin: "Nunc Dimittis"
    rite: "Two"
    source: "Luke 2:29-32"
    text: "Lord, you now have set your servant free *\n  to go in peace as you have promised;\nFor these eyes of mine have seen the Savior, *\n  whom you have prepared for all the world to see:\nA Light to enlighten the nations, *\n  and the glory of your people Israel.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Luke.2"
- type: "Canticle"
  data:
    key: "canticle-18"
    number: 18
    name: "A Song to the Lamb"
    latin: "Dignus es"
    rite: "Two"
    source: "Revelation 4:11, 5:9-10, 13"
    text: "Splendor and honor and kingly power *\n  are yours by right, O Lord our God,\nFor you created everything that is, *\n  and by your will they were created and have their being;\n\nAnd yours by right, O Lamb that was slain, *\n  for with your blood you have redeemed for God,\nFrom every family, language, people, and nation, *\n  a kingdom of priests to serve our God.\n\nAnd so, to him who sits upon the throne, *\n  and to Christ the Lamb,\nBe worship and praise, dominion and splendor, *\n  for ever and for evermore."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Rev.4"
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Rev.5"
- type: "Canticle"
  data:
    key: "canticle-19"
    number: 19
    name: "The Song of the Redeemed"
    latin: "Magna et mirabilia"
    rite: "Two"
    source: "Revelation 15:3-4"
    text: "O ruler of the universe, Lord God,\ngreat deeds are they that you have done, *\n  surpassing human understanding.\nYour ways are ways of righteousness and truth, *\nO King of all the ages.\n\nWho can fail to do you homage, Lord,\nand sing the praises of your Name? *\n  for you only are the Holy One.\nAll nations will draw near and fall down before you, *\n  because your just and holy works have been revealed.\n\nGlory to the Father, and to the Son, and to the Holy Spirit: *\n  as it was in the beginning, is now, and will be for ever. Amen."
  relations:
  - predicate: "FROM"
    to:
      type: "Passage"
      osis: "Rev.15"
- type: "Canticle"
  data:
    key: "canticle-20"
    number: 20
    name: "Glory to God"
    latin: "Gloria in excelsis"
    rite: "Two"
    source: ""
    text: "Glory to God in the highest,\n  and peace to his people on earth.\n\nLord God, heavenly King,\nalmighty God and Father,\n\nwe worship you, we give you thanks,\n  we praise you for your glory.\n\nLord Jesus Christ, only Son of the Father,\nLord God, Lamb of God,\nyou take away the sin of the world:\n  have mercy on us;\nyou are seated at the right hand of the Father:\n  receive our prayer.\n\nFor you alone are the Holy One,\nyou alone are the Lord,\nyou alone are the Most High,\n  Jesus Christ,\n  with the Holy Spirit,\n  in the glory of God the Father. Amen."
- type: "Canticle"
  data:
    key: "canticle-21"
    number: 21
    name: "You are God"
    latin: "Te Deum laudamus"
    rite: "Two"
    source: ""
    text: "You are God: we praise you;\nYou are the Lord; we acclaim you;\nYou are the eternal Father:\nAll creation worships you.\nTo you all angels, all the powers of heaven,\nCherubim and Seraphim, sing in endless praise:\n  Holy, holy, holy Lord, God of power and might,\n  heaven and earth are full of your glory.\nThe glorious company of apostles praise you.\nThe noble fellowship of prophets praise you.\nThe white-robed army of martyrs praise you.\nThroughout the world the holy Church acclaims you;\n  Father, of majesty unbounded,\n  your true and only Son, worthy of all worship,\n  and the Holy Spirit, advocate and guide.\n\nYou, Christ, are the king of glory,\nthe eternal Son of the Father.\nWhen you became man to set us free\nyou did not shun the Virgin's womb.\nYou overcame the sting of death\nand opened the kingdom of heaven to all believers.\nYou are seated at God's right hand in glory.\nWe believe that you will come and be our judge.\n  Come then, Lord, and help your people,\n  bought with the price of your own blood,\n  and bring us with your saints\n  to glory everlasting."
