# The Catholic edition's views. Each takes its date from the caller — a view never knows what
# "today" is where the reader is, and the app does.

- name: TodayInTheChurch
  description: >-
    What the Church celebrates on a date in the General Roman Calendar. The day's principal
    celebration, any optional memorials beside it with the saints each honours (name and Wikidata
    entity, for SaintLife), the colour, season and lectionary cycles. Stored, so it answers at once.
    The universal calendar only (2025–2030); a country's own calendar may differ.
  params:
    date:
      type: string
      default: ""
      description: "ISO date, e.g. `2026-10-01`. Empty means today by the server's clock (UTC); pass the reader's own date when you know it."
  cypher: |
    MATCH (d:LiturgicalDay {date: CASE $date WHEN '' THEN toString(date()) ELSE $date END})<-[:ON]-(c:Celebration)
    OPTIONAL MATCH (s:CalendarSaint) WHERE s.saintId IN c.saints
    WITH d, c, collect({saintId: s.saintId, wd: s.wd, name: s.label}) AS saints
    WITH d, c, [x IN saints WHERE x.wd IS NOT NULL] AS saints ORDER BY c.rankOrder, c.principal DESC, c.name
    RETURN d.date AS date,
           d.weekday AS weekday,
           d.season AS season,
           d.colour AS colour,
           d.sundayCycle AS sundayCycle,
           d.weekdayCycle AS weekdayCycle,
           d.holyDayOfObligation AS holyDayOfObligation,
           collect({id: c.celebrationId, name: c.name, rank: c.rank, optional: c.optional, colours: c.colours, saints: saints}) AS celebrations

- name: FeastsInRange
  description: >-
    Solemnities, Sundays and feasts between two dates in the General Roman Calendar. Memorials only
    when `maxRank` asks for them; the universal calendar only (2025–2030), not a country's own.
  params:
    from:
      type: string
      default: ""
      description: "First ISO date. Empty means today (UTC)."
    to:
      type: string
      default: ""
      description: "Last ISO date, inclusive. Empty means thirty days after `from`."
    maxRank:
      type: int
      default: 4
      description: "Highest rankOrder to include: 3 = solemnities, Sundays and feasts; 4 adds memorials; 5 adds optional memorials."
  cypher: |
    WITH CASE $from WHEN '' THEN date() ELSE date($from) END AS first
    WITH toString(first) AS first, CASE $to WHEN '' THEN toString(first + duration({days: 30})) ELSE $to END AS last
    MATCH (d:LiturgicalDay)<-[:ON]-(c:Celebration)
    WHERE d.date >= first AND d.date <= last AND c.rankOrder <= $maxRank
    RETURN d.date AS date, d.weekday AS weekday, c.name AS celebration, c.rank AS rank, c.colours AS colours
    ORDER BY date, c.rankOrder

- name: RosaryToday
  description: >-
    The Rosary mysteries prayed on a date, with their Scripture and fruits. The set for that day of
    the week, each mystery with the passage it meditates and its verses in the King James Version.
    Dates 2025–2030 only.
  params:
    date:
      type: string
      default: ""
      description: "ISO date, e.g. `2026-10-01` (2025–2030). Empty means today by the server's clock (UTC); pass the reader's own date when you know it."
  cypher: |
    MATCH (d:LiturgicalDay {date: CASE $date WHEN '' THEN toString(date()) ELSE $date END})
    MATCH (r:RosaryDay {weekday: d.weekday})
    MATCH (m:RosaryMystery {set: r.set})-[:TOLD_IN]->(p:Passage)
    RETURN d.weekday AS weekday, r.set AS mysteries, m.number AS number, m.name AS mystery,
           m.scripture AS scripture, p.name AS passage, m.fruit AS fruit, m.note AS note
    ORDER BY number

- name: Prayers
  description: >-
    Traditional Catholic prayers in their long-established English forms. The Our Father, Hail Mary,
    Glory Be, the Fatima Prayer, Hail Holy Queen, the Apostles' Creed, the Angelus, the Memorare and
    others; only those the realm holds, matched by part of the name.
  params:
    name:
      type: string
      default: ""
      description: "Part of a prayer's name, commas optional, e.g. `Hail Holy Queen`, `Memorare`; empty for all of them."
  cypher: |
    MATCH (p:Prayer)
    WHERE $name = '' OR replace(toLower(p.name), ',', '') CONTAINS replace(toLower($name), ',', '')
    RETURN p.key AS key, p.name AS name, p.text AS text
    ORDER BY name

- name: CatechismLesson
  description: >-
    One lesson of a catechism, question by question, in the book's order. One lesson only, by
    number; the catechisms held are public domain — the Catechism of the Catholic Church is not
    carried (CatechismOnTopic links it).
  params:
    catechism:
      type: string
      default: "baltimore-2"
      description: "The catechism: `baltimore-2` (Baltimore Catechism No. 2, 1885), `bcp-1979` (An Outline of the Faith, by section number) or `church-catechism` (the Church Catechism of 1662, lesson 1)."
    lesson:
      type: int
      default: 1
      description: "The lesson number, e.g. `1` (On the End of Man)."
  cypher: |
    MATCH (e:CatechismEntry {catechismId: $catechism, partNumber: $lesson})
    RETURN e.catechism AS catechism, e.part AS lesson, e.section AS title, e.number AS number,
           e.question AS question, e.text AS answer, e.note AS note
    ORDER BY number

- name: CatechismSearch
  description: >-
    Catechism questions and answers containing a word, across every catechism held. Partial and
    case-insensitive; at most `limit` entries, in each book's order. Not the Catechism of the
    Catholic Church, whose text is not carried.
  params:
    term:
      type: string
      default: "grace"
      description: "A word or phrase; a partial match, ignoring case, in the question or the answer."
    catechism:
      type: string
      default: ""
      description: "Limit to one catechism — `baltimore-2`, `bcp-1979` (An Outline of the Faith) or `church-catechism` (1662); empty for all."
    limit:
      type: int
      default: 25
      description: "At most this many entries."
  cypher: |
    MATCH (e:CatechismEntry)
    WHERE ($catechism = '' OR e.catechismId = $catechism)
      AND (toLower(e.question) CONTAINS toLower($term) OR toLower(e.text) CONTAINS toLower($term))
    RETURN e.catechism AS catechism, e.part AS lesson, e.section AS title, e.number AS number,
           e.question AS question, e.text AS answer
    ORDER BY catechism, number
    LIMIT $limit

- name: CatechismOnTopic
  description: >-
    What the catechisms say on a topic, with where the CCC treats it. The matching questions and
    answers of the public-domain catechisms held, and the Catechism of the Catholic Church's
    paragraph numbers with links to vatican.va — not its text, which is copyright. At most `limit`
    answers.
  params:
    topic:
      type: string
      default: "Eucharist"
      description: "One or more words, each of which must appear, e.g. `Eucharist`, `purgatory`, `Mass Sunday`. Fewer words find more."
    catechism:
      type: string
      default: ""
      description: "Limit the public-domain answers to one catechism — `baltimore-2` (Catholic), `bcp-1979` or `church-catechism` (Anglican); empty for all. The CCC references are Catholic either way."
    limit:
      type: int
      default: 12
      description: "At most this many catechism answers."
  cypher: |
    WITH [w IN split(toLower(trim($topic)), ' ') WHERE w <> ''] AS words
    OPTIONAL MATCH (t:CccTopic) WHERE all(w IN words WHERE toLower(t.topic) CONTAINS w)
    WITH words, collect(DISTINCT {topic: t.topic, paragraphs: t.paragraphs, section: t.section, url: t.url}) AS ccc
    OPTIONAL MATCH (e:CatechismEntry)
    WHERE ($catechism = '' OR e.catechismId = $catechism)
      AND all(w IN words WHERE toLower(coalesce(e.question, '') + ' ' + e.text) CONTAINS w)
    WITH ccc, e ORDER BY e.catechism, e.number
    WITH ccc, collect({catechism: e.catechism, lesson: e.part, number: e.number, question: e.question, answer: e.text})[0..$limit] AS answers
    RETURN [x IN ccc WHERE x.topic IS NOT NULL] AS catechismOfTheCatholicChurch,
           [a IN answers WHERE a.number IS NOT NULL] AS publicDomainCatechisms

# ── The deuterocanon ─────────────────────────────────────────────────────────────────────────
# Douay-Rheims only, fetched live a whole book at a time and cached forever: the first read of a
# book takes about a second, every read after it is immediate. Daniel 3:24–90 (the Prayer of Azariah
# and the Song of the Three) is not reached here — Daniel 3 is read through ReadPassage.

- name: ReadDeuterocanon
  description: >-
    One verse of the deuterocanon in the Douay-Rheims, or a whole chapter. Tobit, Judith, Wisdom,
    Sirach, Baruch, 1 and 2 Maccabees, or Esther 11–16 and Daniel 13–14 (Susanna, Bel and the
    Dragon); Vulgate numbering. Fetched live; the first read of a book takes about a second. Not the
    66 books, which are ReadVerse.
  params:
    book:
      type: string
      default: "Tobit"
      description: "Tobit, Judith, Esther, Wisdom, Sirach, Baruch, Daniel, `1 Maccabees` or `2 Maccabees`, exactly."
    chapter:
      type: int
      default: 1
      description: "Chapter, Vulgate numbering; Esther from 11, Daniel from 13."
    verse:
      type: int
      default: 0
      description: "Verse; 0 (the default) returns the whole chapter."
  cypher: |
    MATCH (b:DeuterocanonBook {name: $book})-[:VERSES]->(v:DeuterocanonVerse)
    WHERE v.chapter = $chapter AND ($verse = 0 OR v.verse = $verse) AND v.chapter >= b.fromChapter
    RETURN v.name AS reference, trim(v.text) AS text, 'Douay-Rheims' AS translation
    ORDER BY v.verse

- name: ReadDeuterocanonPassage
  description: >-
    A whole chapter of the deuterocanon in the Douay-Rheims, verse by verse. One chapter only,
    Vulgate numbering; fetched live, the first read of a book taking about a second.
  params:
    book:
      type: string
      default: "Wisdom"
      description: "Tobit, Judith, Esther, Wisdom, Sirach, Baruch, Daniel, `1 Maccabees` or `2 Maccabees`."
    chapter:
      type: int
      default: 3
      description: "Chapter. Esther from 11, Daniel from 13."
  cypher: |
    MATCH (b:DeuterocanonBook {name: $book})-[:VERSES]->(v:DeuterocanonVerse)
    WHERE v.chapter = $chapter AND v.chapter >= b.fromChapter
    RETURN v.verse AS verse, trim(v.text) AS text, 'Douay-Rheims' AS translation
    ORDER BY verse

- name: SearchDeuterocanon
  description: >-
    Deuterocanon verses in the Douay-Rheims containing a word or phrase. Partial and
    case-insensitive, in book order, at most `limit`. Reads all nine books; the first search fetches
    any not yet read (about a second each), later ones are immediate.
  params:
    term:
      type: string
      default: "friend"
      description: "A word or phrase in the Douay-Rheims's own wording (`charity`, `thou`); a partial match, ignoring case."
    limit:
      type: int
      default: 25
      description: "At most this many verses."
  cypher: |
    MATCH (b:DeuterocanonBook)-[:VERSES]->(v:DeuterocanonVerse)
    WHERE v.chapter >= b.fromChapter AND toLower(v.text) CONTAINS toLower($term)
    RETURN v.name AS reference, trim(v.text) AS text, 'Douay-Rheims' AS translation
    ORDER BY b.bookOrder, v.chapter, v.verse
    LIMIT $limit
