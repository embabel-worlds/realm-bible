# Saints, fetched live from Wikidata and Wikipedia, starting from the calendar's saints (CalendarSaint),
# a country (Country), or Scripture (ScriptureSaint). Every view here reaches the public Wikidata endpoint
# or Wikipedia on first use and caches for a week.

- name: SaintsOfTheDay
  description: The saints the calendar honours on a date, each with Wikidata's card — dates, birth, death and burial places with coordinates for a map, image, religious order, canonization — fetched live. Pair with TodayInTheChurch, which answers at once.
  params:
    date:
      type: string
      default: ""
      description: "ISO date, e.g. `2026-10-01` (2025–2030). Empty means today by the server's clock (UTC); pass the reader's own date when you know it."
  cypher: |
    MATCH (d:LiturgicalDay {date: CASE $date WHEN '' THEN toString(date()) ELSE $date END})<-[:ON]-(c:Celebration)
    UNWIND c.saints AS sid
    MATCH (s:CalendarSaint {saintId: sid})-[:CARD]->(k:SaintCard)
    RETURN c.name AS celebration, c.rank AS rank, s.label AS saint, k.wd AS wd,
           k.wdDescription AS description, k.birthDate AS born, k.deathDate AS died,
           k.birthPlace AS birthPlace, k.birthCoord AS birthCoord, k.birthCountry AS birthCountry,
           k.deathPlace AS deathPlace, k.deathCoord AS deathCoord, k.deathCountry AS deathCountry,
           k.burialPlace AS burialPlace, k.burialCoord AS burialCoord,
           k.image AS image, k.religiousOrder AS religiousOrder, k.canonization AS canonization, k.article AS article
    ORDER BY c.rankOrder, saint

- name: FindSaint
  description: Find a saint by name among the General Roman Calendar's saints and the saints of Scripture — their Wikidata entity (for SaintLife and SaintPatronOf), canonization, and the calendar's id. Matches part of a name, with or without accents (`Therese`, `Thérèse`, `Francis`). A saint the universal calendar does not keep may be found through SaintsOfCountry.
  params:
    name:
      type: string
      default: "Thérèse"
      description: "Part of the saint's name, e.g. `Thérèse`, `Therese`, `Francis of Assisi`, `Peter`."
  cypher: |
    MATCH (s:CalendarSaint)
    WHERE toLower(s.label) CONTAINS toLower($name)
       OR s.saintId CONTAINS replace(replace(toLower(trim($name)), ' ', '_'), '.', '')
    RETURN s.label AS saint, s.wd AS wd, s.canonization AS canonization, s.saintId AS calendarId
    ORDER BY size(s.label)
    LIMIT 10

- name: SaintLife
  description: One saint's life — Wikidata's card (places with coordinates, dates, image, order) and the opening of their Wikipedia article (CC BY-SA 4.0, shown with its link), fetched live — by Wikidata entity.
  params:
    wd:
      type: string
      default: "http://www.wikidata.org/entity/Q181715"
      description: "The saint's Wikidata entity — the IRI FindSaint returns, `http://www.wikidata.org/entity/Q676555`, or the bare QID `Q676555` (Francis of Assisi)."
  cypher: |
    MATCH (k:SaintCard {wd: CASE WHEN $wd STARTS WITH 'http' THEN $wd ELSE 'http://www.wikidata.org/entity/' + $wd END})
    OPTIONAL MATCH (k)-[:LIFE]->(l:SaintLife)
    RETURN k.wdLabel AS saint, k.wdDescription AS description, k.birthDate AS born, k.deathDate AS died,
           k.birthPlace AS birthPlace, k.birthCoord AS birthCoord, k.birthCountry AS birthCountry,
           k.deathPlace AS deathPlace, k.deathCoord AS deathCoord, k.deathCountry AS deathCountry,
           k.burialPlace AS burialPlace, k.burialCoord AS burialCoord,
           k.image AS image, k.religiousOrder AS religiousOrder, k.canonization AS canonization, k.feastDay AS feastDay,
           l.extract AS life, l.thumbnail AS thumbnail, l.pageUrl AS wikipedia

- name: SaintPatronOf
  description: What a saint is patron of — cities, countries, trades, causes — as Wikidata records it (churches dedicated to them excluded), fetched live.
  params:
    wd:
      type: string
      default: "http://www.wikidata.org/entity/Q676555"
      description: "The saint's Wikidata entity — the IRI FindSaint returns, or the bare QID, e.g. `Q676555` (Francis of Assisi)."
    limit:
      type: int
      default: 40
      description: "How many to return."
  cypher: |
    MATCH (k:SaintCard {wd: CASE WHEN $wd STARTS WITH 'http' THEN $wd ELSE 'http://www.wikidata.org/entity/' + $wd END})-[:PATRON_OF]->(p:SaintPatronage)
    RETURN p.thingLabel AS patronOf, collect(DISTINCT p.kindLabel)[0..3] AS kind
    ORDER BY patronOf
    LIMIT $limit

- name: SaintsOfCountry
  description: The saints and blessed (and venerable, and servants of God) of a country — citizenship or birthplace — from Wikidata, fetched live, by ISO 3166-1 alpha-2 code so the app can start from the reader's locale. Saints first, then the blessed, the venerable and servants of God, each by fame (how many Wikipedias have an article on them).
  params:
    country:
      type: string
      default: "IE"
      description: "ISO 3166-1 alpha-2 code in upper case, e.g. `IE`, `PL`, `US`. The code pins the one country whose saints are fetched; an expression over it (toUpper) would not, and every country would be fetched."
    limit:
      type: int
      default: 60
      description: "How many to return."
  cypher: |
    MATCH (c:Country) WHERE c.iso2 = toUpper($country) OR toLower(c.name) = toLower($country)
    MATCH (c)-[:SAINTS]->(s:CountrySaint)
    WITH c, s, CASE WHEN s.canonization CONTAINS 'saint' AND NOT s.canonization CONTAINS 'Servant' THEN 0
                    WHEN s.canonization CONTAINS 'lessed' THEN 1 WHEN s.canonization CONTAINS 'enerable' THEN 2 ELSE 3 END AS standing
    RETURN c.name AS country, s.wdLabel AS name, s.canonization AS canonization, s.wdDescription AS description,
           s.birthDate AS born, s.deathDate AS died, s.feastDay AS feastDay, s.wd AS wd, s.article AS article,
           toInteger(s.fame) AS fame
    ORDER BY standing, fame DESC
    LIMIT $limit

- name: SaintsInScripture
  description: The saints who are also people of Scripture — the apostles, the Holy Family, the women at the tomb, Stephen, Timothy — with how many verses name them, the chapters that name them most, and their feasts in the calendar as month-day and name (`06-29 Saints Peter and Paul, Apostles`).
  params:
    chapters:
      type: int
      default: 5
      description: "How many of each saint's chapters to list, most-mentioning first."
  cypher: |
    MATCH (s:ScriptureSaint)
    MATCH (p:Passage)<-[:IN]-(v:Verse) WHERE s.personLookup IN v.people
    WITH s, p, count(v) AS verses ORDER BY verses DESC
    WITH s, sum(verses) AS total, collect(p.name)[0..$chapters] AS chapters
    OPTIONAL MATCH (cs:CalendarSaint {qid: s.qid})
    OPTIONAL MATCH (:LiturgicalDay)<-[:ON]-(c:Celebration) WHERE cs.saintId IN c.saints
    WITH s, total, chapters, collect(DISTINCT substring(c.date, 5) + ' ' + c.name) AS feasts
    RETURN s.label AS saint, s.wd AS wd, s.personLookup AS person, total AS verses, chapters,
           [f IN feasts WHERE f IS NOT NULL] AS feasts
    ORDER BY verses DESC
