# Saints, fetched live from Wikidata and Wikipedia, starting from the calendar's saints (CalendarSaint),
# a country (Country), or Scripture (ScriptureSaint). Every view here reaches the public Wikidata endpoint
# or Wikipedia on first use and caches for a week.

- name: SaintsOfTheDay
  description: The saints the calendar honours on a date, each with Wikidata's card — dates, birth, death and burial places with coordinates for a map, image, religious order, canonization — fetched live. Pair with TodayInTheChurch, which answers at once.
  params:
    date:
      type: string
      default: ""
      description: "ISO date, e.g. `2026-10-01` (2025–2030). Empty means today by the server's clock (UTC); pass the reader's own date when you know it."
  cypher: |
    MATCH (d:LiturgicalDay {date: CASE $date WHEN '' THEN toString(date()) ELSE $date END})<-[:ON]-(c:Celebration)
    UNWIND c.saints AS sid
    MATCH (s:CalendarSaint {saintId: sid})-[:CARD]->(k:SaintCard)
    RETURN c.name AS celebration, c.rank AS rank, s.label AS saint, k.wd AS wd,
           k.wdDescription AS description, k.birthDate AS born, k.deathDate AS died,
           k.birthPlace AS birthPlace, k.birthCoord AS birthCoord, k.birthCountry AS birthCountry,
           k.deathPlace AS deathPlace, k.deathCoord AS deathCoord, k.deathCountry AS deathCountry,
           k.burialPlace AS burialPlace, k.burialCoord AS burialCoord,
           k.image AS image, k.religiousOrder AS religiousOrder, k.canonization AS canonization, k.article AS article
    ORDER BY c.rankOrder, saint

- name: FindSaint
  description: Find a saint by name among the General Roman Calendar's saints and the saints of Scripture — their Wikidata entity (for SaintLife and SaintPatronOf), canonization, and the calendar's id. Matches part of a name, with or without accents (`Therese`, `Thérèse`, `Francis`). A saint the universal calendar does not keep may be found through SaintsOfCountry.
  params:
    name:
      type: string
      default: "Thérèse"
      description: "Part of the saint's name, e.g. `Thérèse`, `Therese`, `Francis of Assisi`, `Peter`."
  cypher: |
    MATCH (s:CalendarSaint)
    WHERE toLower(s.label) CONTAINS toLower($name)
       OR s.saintId CONTAINS replace(replace(toLower(trim($name)), ' ', '_'), '.', '')
    RETURN s.label AS saint, s.wd AS wd, s.canonization AS canonization, s.saintId AS calendarId
    ORDER BY size(s.label)
    LIMIT 10

- name: SaintLife
  description: One saint's life — Wikidata's card (places with coordinates, dates, image, order) and the opening of their Wikipedia article (CC BY-SA 4.0, shown with its link), fetched live — by Wikidata entity.
  params:
    wd:
      type: string
      default: "http://www.wikidata.org/entity/Q181715"
      description: "The saint's Wikidata entity — the IRI FindSaint returns, `http://www.wikidata.org/entity/Q676555`, or the bare QID `Q676555` (Francis of Assisi)."
  cypher: |
    MATCH (k:SaintCard {wd: CASE WHEN $wd STARTS WITH 'http' THEN $wd ELSE 'http://www.wikidata.org/entity/' + $wd END})
    OPTIONAL MATCH (k)-[:LIFE]->(l:SaintLife)
    RETURN k.wdLabel AS saint, k.wdDescription AS description, k.birthDate AS born, k.deathDate AS died,
           k.birthPlace AS birthPlace, k.birthCoord AS birthCoord, k.birthCountry AS birthCountry,
           k.deathPlace AS deathPlace, k.deathCoord AS deathCoord, k.deathCountry AS deathCountry,
           k.burialPlace AS burialPlace, k.burialCoord AS burialCoord,
           k.image AS image, k.religiousOrder AS religiousOrder, k.canonization AS canonization, k.feastDay AS feastDay,
           l.extract AS life, l.thumbnail AS thumbnail, l.pageUrl AS wikipedia

- name: SaintPatronOf
  description: What a saint is patron of — cities, countries, trades, causes — as Wikidata records it (churches dedicated to them excluded), fetched live.
  params:
    wd:
      type: string
      default: "http://www.wikidata.org/entity/Q676555"
      description: "The saint's Wikidata entity — the IRI FindSaint returns, or the bare QID, e.g. `Q676555` (Francis of Assisi)."
    limit:
      type: int
      default: 40
      description: "How many to return."
  cypher: |
    MATCH (k:SaintCard {wd: CASE WHEN $wd STARTS WITH 'http' THEN $wd ELSE 'http://www.wikidata.org/entity/' + $wd END})-[:PATRON_OF]->(p:SaintPatronage)
    RETURN p.thingLabel AS patronOf, collect(DISTINCT p.kindLabel)[0..3] AS kind
    ORDER BY patronOf
    LIMIT $limit

- name: SaintsOfCountry
  description: The saints and blessed (and venerable, and servants of God) of a country — citizenship or birthplace — from Wikidata, fetched live, by ISO 3166-1 alpha-2 code so the app can start from the reader's locale. Saints first, then the blessed, the venerable and servants of God, each by fame (how many Wikipedias have an article on them).
  params:
    country:
      type: string
      default: "IE"
      description: "ISO 3166-1 alpha-2 code in upper case, e.g. `IE`, `PL`, `US`. The code pins the one country whose saints are fetched; an expression over it (toUpper) would not, and every country would be fetched."
    limit:
      type: int
      default: 60
      description: "How many to return."
  cypher: |
    MATCH (c:Country) WHERE c.iso2 = toUpper($country) OR toLower(c.name) = toLower($country)
    MATCH (c)-[:SAINTS]->(s:CountrySaint)
    WITH c, s, CASE WHEN s.canonization CONTAINS 'saint' AND NOT s.canonization CONTAINS 'Servant' THEN 0
                    WHEN s.canonization CONTAINS 'lessed' THEN 1 WHEN s.canonization CONTAINS 'enerable' THEN 2 ELSE 3 END AS standing
    RETURN c.name AS country, s.wdLabel AS name, s.canonization AS canonization, s.wdDescription AS description,
           s.birthDate AS born, s.deathDate AS died, s.feastDay AS feastDay, s.wd AS wd, s.article AS article,
           toInteger(s.fame) AS fame
    ORDER BY standing, fame DESC
    LIMIT $limit

- name: CountriesBySaints
  description: Countries ranked by how many saints they have — saints, blessed, venerable and servants of God by citizenship or birthplace, and how many of those are canonized — counted on Wikidata, uncapped. The first run fetches every country (about four minutes, ten countries a call); after that it is cached for 30 days.
  params:
    limit:
      type: int
      default: 30
      description: "How many countries to return."
  cypher: |
    MATCH (c:Country)-[:SAINT_COUNT]->(n:CountrySaintCount)
    RETURN c.name AS country, c.iso2 AS iso2, n.total AS saints, n.canonized AS canonized
    ORDER BY saints DESC, country
    LIMIT $limit

- name: SaintsInScripture
  description: The saints who are also people of Scripture — the apostles, the Holy Family, the women at the tomb, Stephen, Timothy — with how many verses name them, the chapters that name them most, and their feasts in the calendar as month-day and name (`06-29 Saints Peter and Paul, Apostles`).
  params:
    chapters:
      type: int
      default: 5
      description: "How many of each saint's chapters to list, most-mentioning first."
  cypher: |
    MATCH (s:ScriptureSaint)
    MATCH (p:Passage)<-[:IN]-(v:Verse) WHERE s.personLookup IN v.people
    WITH s, p, count(v) AS verses ORDER BY verses DESC
    WITH s, sum(verses) AS total, collect(p.name)[0..$chapters] AS chapters
    OPTIONAL MATCH (cs:CalendarSaint {qid: s.qid})
    OPTIONAL MATCH (:LiturgicalDay)<-[:ON]-(c:Celebration) WHERE cs.saintId IN c.saints
    WITH s, total, chapters, collect(DISTINCT substring(c.date, 5) + ' ' + c.name) AS feasts
    RETURN s.label AS saint, s.wd AS wd, s.personLookup AS person, total AS verses, chapters,
           [f IN feasts WHERE f IS NOT NULL] AS feasts
    ORDER BY verses DESC

# ── The whole roll: every saint, blessed, venerable and servant of God at once ───────────────
# These read SaintCause, fetched for everyone in one call (about ten seconds cold, then cached for
# 30 days). Dates are Wikidata's, and Wikidata dates the minority: about 1 in 9 saints has a
# canonization date, and a mass canonization dates every member while a single one is often left
# undated. Every view that counts or ranks by a date says so in its own rows' `note`.
#
# A martyr is one Wikidata records as such (manner of death, `Christian martyr`, or its own
# description), or one the General Roman Calendar celebrates as "Martyr" — Maria Goretti is
# "Italian saint" on Wikidata and "Virgin and Martyr" in the calendar — or, as the weakest evidence
# and labelled so, one Wikidata records as killed. Óscar Romero, canonized a martyr in 2018, is
# only "homicide" on Wikidata; Joan of Arc is "capital punishment" and is not venerated as a
# martyr. `includeKilled: false` keeps to the first two.

- name: CausesByYear
  description: How many people reached a stage of sainthood each year — canonized, beatified, declared venerable, or named a servant of God — as Wikidata dates it, with up to five names a year. Only dated stages count, and Wikidata dates a minority (about 1 in 9 canonizations), so a year's count is a floor, and the mass canonizations (2000, the Martyrs of China; 1988, Vietnam; 1984, Korea) dominate. People only, not groups.
  params:
    stage:
      type: string
      default: "canonization"
      description: "`canonization`, `beatification`, `venerable` or `servantOfGod`."
    from:
      type: int
      default: 1
      description: "Earliest year to include."
    limit:
      type: int
      default: 50
      description: "How many years to return, latest first."
  cypher: |
    MATCH (:SaintRoll)-[:CAUSE]->(s:SaintCause)
    WHERE s.kind = 'person'
    WITH s, CASE $stage
              WHEN 'canonization' THEN s.canonizationYear
              WHEN 'beatification' THEN s.beatificationYear
              WHEN 'venerable' THEN s.venerableYear
              WHEN 'servantOfGod' THEN s.servantOfGodYear
            END AS year
    WHERE year IS NOT NULL AND year >= $from
    WITH year, count(s) AS people, collect(s.name) AS names
    RETURN year, people, names[0..5] AS someOfThem,
           'Counts only stages Wikidata dates; most are undated, so this is a floor.' AS note
    ORDER BY year DESC
    LIMIT $limit

- name: Martyrs
  description: Saints, blessed, venerable and servants of God who died as martyrs, most recent death first, with the evidence for each — Wikidata's record of martyrdom, its description, the General Roman Calendar's title, or (weakest, and labelled so) Wikidata's record that they were killed. Set `includeKilled` false for recorded martyrdom only. Filter by stage for canonized martyrs; `datedOnly` keeps to those whose stage Wikidata dates, which excludes the few Wikidata wrongly marks as saints (some beatified martyrs carry a `Catholic saint` status with no date). Only those whose year of death is known are listed; the counts are MartyrCount.
  params:
    stage:
      type: string
      default: ""
      description: "`saint`, `blessed`, `venerable` or `servant of God`; empty for every stage."
    includeKilled:
      type: boolean
      default: true
      description: "Count those Wikidata records only as killed — homicide, execution — as martyrs, labelled as the weakest evidence."
    datedOnly:
      type: boolean
      default: false
      description: "Only those whose canonization (for `saint`) or beatification (for `blessed`) Wikidata dates."
    limit:
      type: int
      default: 25
      description: "How many to return."
  cypher: |
    MATCH (cs:CalendarSaint)
    MATCH (:LiturgicalDay)<-[:ON]-(c:Celebration)
    WHERE cs.saintId IN c.saints AND c.name CONTAINS 'Martyr'
    WITH collect(DISTINCT cs.wd) AS calendarMartyrs
    MATCH (:SaintRoll)-[:CAUSE]->(s:SaintCause)
    WHERE s.deathYear IS NOT NULL
      AND ($stage = '' OR s.stage = $stage)
      AND (NOT $datedOnly OR (s.stage = 'saint' AND s.canonizationYear IS NOT NULL)
                          OR (s.stage = 'blessed' AND s.beatificationYear IS NOT NULL))
    WITH s, calendarMartyrs, CASE
              WHEN s.martyrEvidence IS NOT NULL THEN s.martyrEvidence
              WHEN s.wd IN calendarMartyrs THEN 'celebrated as a martyr in the General Roman Calendar'
              WHEN $includeKilled AND s.killedEvidence IS NOT NULL THEN 'killed — ' + s.killedEvidence + ' (weakest evidence, not itself proof)'
            END AS evidence
    WHERE evidence IS NOT NULL
    RETURN s.name AS name, s.stage AS stage, s.status AS status, s.deathDate AS died,
           s.beatificationYear AS beatified, s.canonizationYear AS canonized,
           evidence, s.wd AS wd
    ORDER BY s.deathDate DESC
    LIMIT $limit

- name: MartyrCount
  description: "How many martyrs there are at each stage of sainthood — saint, blessed, venerable, servant of God — split by the evidence: recorded (Wikidata or the General Roman Calendar says martyr) and killed (Wikidata records only a killing, the weakest evidence). A martyr nothing records is not counted, so these are floors."
  cypher: |
    MATCH (cs:CalendarSaint)
    MATCH (:LiturgicalDay)<-[:ON]-(c:Celebration)
    WHERE cs.saintId IN c.saints AND c.name CONTAINS 'Martyr'
    WITH collect(DISTINCT cs.wd) AS calendarMartyrs
    MATCH (:SaintRoll)-[:CAUSE]->(s:SaintCause)
    WITH s, s.martyrEvidence IS NOT NULL OR s.wd IN calendarMartyrs AS recorded,
         s.killedEvidence IS NOT NULL AS killed
    WHERE recorded OR killed
    RETURN s.stage AS stage,
           sum(CASE WHEN recorded THEN 1 ELSE 0 END) AS recordedMartyrs,
           sum(CASE WHEN NOT recorded THEN 1 ELSE 0 END) AS killedOnly
    ORDER BY recordedMartyrs DESC

- name: SaintLifespans
  description: Saints, blessed, venerable and servants of God by age at death — the longest-lived first, or the youngest first with `youngest`. By default only those whose birth and death are both known to the day, which is the answer to trust; set `exactOnly` false to add those known only by year, which brings in the legends of the first millennium (Ciarán of Saigir, 155 by Wikidata's years) and is one year high at most for the rest. People only — Adam's 930 years are Scripture's, not a lifespan.
  params:
    youngest:
      type: boolean
      default: false
      description: "True to list who died youngest first — the saints who died as children."
    exactOnly:
      type: boolean
      default: true
      description: "Only people whose birth and death are both known to the day."
    maxAge:
      type: int
      default: 200
      description: "Only those who died at this age or younger — 12 for those who died as children."
    limit:
      type: int
      default: 25
      description: "How many to return."
  cypher: |
    MATCH (:SaintRoll)-[:CAUSE]->(s:SaintCause)
    WHERE s.kind = 'person' AND s.birthYear IS NOT NULL AND s.deathYear IS NOT NULL
      AND (s.exactAgeAtDeath IS NOT NULL OR NOT $exactOnly)
    WITH s, coalesce(s.exactAgeAtDeath, s.deathYear - s.birthYear) AS age
    WHERE age >= 0 AND age <= $maxAge
    WITH s, age, CASE WHEN $youngest THEN age ELSE -age END AS rank
    RETURN s.name AS name, s.stage AS stage, age AS ageAtDeath,
           s.exactAgeAtDeath IS NOT NULL AS exact,
           s.birthDate AS born, s.deathDate AS died,
           s.martyrEvidence IS NOT NULL AS martyr, s.description AS description, s.wd AS wd
    ORDER BY rank, s.deathDate
    LIMIT $limit

- name: SaintCauseStages
  description: The stages of one person's cause, by name — when they were named a servant of God, declared venerable, beatified and canonized, as far as Wikidata dates them — with their birth, death, age at death and any martyrdom. A stage with no date may still have happened; Wikidata dates a minority.
  params:
    name:
      type: string
      default: "Teresa"
      description: "Part of the name, any case, e.g. `Kolbe`, `Teresa of Calcutta`."
    limit:
      type: int
      default: 10
      description: "How many matches to return."
  cypher: |
    MATCH (:SaintRoll)-[:CAUSE]->(s:SaintCause)
    WHERE toLower(s.name) CONTAINS toLower($name)
    RETURN s.name AS name, s.stage AS stage, s.status AS status,
           s.servantOfGodDate AS servantOfGod, s.venerableDate AS venerable,
           s.beatificationDate AS beatified, s.canonizationDate AS canonized,
           s.birthDate AS born, s.deathDate AS died,
           coalesce(s.exactAgeAtDeath, s.deathYear - s.birthYear) AS ageAtDeath,
           s.martyrEvidence AS martyr, s.description AS description, s.wd AS wd
    ORDER BY s.name
    LIMIT $limit
