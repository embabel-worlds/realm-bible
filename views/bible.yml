# The realm's answer surface.
#
# Every reading view takes `translation`: `kjv` (the default) or `web` (the World English Bible,
# modern English). Both are stored on the Verse, so switching costs nothing and search works in
# either. The five older translations are fetched live and only CompareTranslations reaches them —
# one verse, five calls, well inside bible-api's allowance. A view that fetched them for a whole
# chapter would not be.
#
# References are human (`Judges 3:21`, `Judges 3`), because that is what a reader types and what
# the stored `name` holds. OSIS (`Judg.3.21`) is the identity underneath.

- name: ReadVerse
  description: One verse by reference, in the King James Version by default or the World English Bible — with the people it mentions.
  params:
    ref:
      type: string
      default: "John 3:16"
      description: "The verse, e.g. `Judges 3:21`, `1 Kings 16:31`."
    translation:
      type: string
      default: "kjv"
      description: "`kjv` (default) or `web` (World English Bible, modern)."
  cypher: |
    MATCH (v:Verse {name: $ref})
    RETURN v.name AS reference,
           CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text,
           CASE $translation WHEN 'web' THEN 'World English Bible' ELSE 'King James Version' END AS translation,
           v.people AS people,
           v.event AS event

- name: ReadPassage
  description: A whole chapter, verse by verse, in the King James Version by default or the World English Bible.
  params:
    passage:
      type: string
      default: "Judges 3"
      description: "The chapter, e.g. `Judges 3`, `Song of Solomon 2`."
    translation:
      type: string
      default: "kjv"
      description: "`kjv` (default) or `web` (World English Bible, modern)."
  cypher: |
    MATCH (p:Passage {name: $passage})<-[:IN]-(v:Verse)
    RETURN v.verse AS verse,
           CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    ORDER BY verse

- name: SearchVerses
  description: Verses whose text contains a word or phrase, case-insensitively, in canonical order. Matches inside words — `goat` also finds `goats` and `scapegoat`.
  params:
    term:
      type: string
      default: "goat"
      description: "The word or phrase to find."
    translation:
      type: string
      default: "kjv"
      description: "Which text to search and show: `kjv` (default) or `web`. The two often word a verse differently — KJV `kid` is WEB `young goat`."
    limit:
      type: int
      default: 100
      description: "How many verses to return."
  cypher: |
    MATCH (b:Book)<-[:IN]-(:Passage)<-[:IN]-(v:Verse)
    WITH b, v, CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    WHERE toLower(text) CONTAINS toLower($term)
    RETURN v.name AS reference, text
    ORDER BY b.bookOrder, v.chapter, v.verse
    LIMIT $limit

- name: PassagesMentioning
  description: The chapters that mention a word or phrase most often, ranked by how many of their verses contain it.
  params:
    term:
      type: string
      default: "goat"
      description: "The word or phrase to find."
    translation:
      type: string
      default: "kjv"
      description: "Which text to search: `kjv` (default) or `web`."
    limit:
      type: int
      default: 25
      description: "How many passages to return."
  cypher: |
    MATCH (b:Book)<-[:IN]-(p:Passage)<-[:IN]-(v:Verse)
    WITH b, p, v, CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    WHERE toLower(text) CONTAINS toLower($term)
    RETURN p.name AS passage,
           count(v) AS matchingVerses,
           collect(v.verse)[0..10] AS verses
    ORDER BY matchingVerses DESC, b.bookOrder, p.chapter
    LIMIT $limit

- name: CompareTranslations
  description: One verse side by side in all seven translations — the stored King James and World English, and five older ones fetched live. Young's Literal is New Testament only, so an Old Testament verse has no YLT row.
  params:
    ref:
      type: string
      default: "Judges 3:21"
      description: "The verse, e.g. `Judges 3:21`."
  cypher: |
    MATCH (v:Verse {name: $ref})
    OPTIONAL MATCH (v)-[:RENDERED]->(asv:AsvVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(bbe:BbeVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(darby:DarbyVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(dra:DraVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(ylt:YltVerse)
    UNWIND [
      {translation: 'King James Version (default)', text: v.text},
      {translation: 'World English Bible (modern)', text: v.web},
      {translation: 'American Standard Version', text: trim(asv.text)},
      {translation: 'Bible in Basic English', text: trim(bbe.text)},
      {translation: 'Darby', text: trim(darby.text)},
      {translation: 'Douay-Rheims', text: trim(dra.text)},
      {translation: "Young's Literal", text: trim(ylt.text)}
    ] AS r
    WITH r WHERE r.text IS NOT NULL
    RETURN r.translation AS translation, r.text AS text

- name: PeopleNamed
  description: Everyone in the Bible who bore a name, from Theographic. A name is not a person — there are 26 Zechariahs — so read displayTitle to tell them apart; most-mentioned first.
  params:
    name:
      type: string
      default: "Jezebel"
      description: "The name, matched case-insensitively."
  cypher: |
    MATCH (:BibleNameQuery {name: $name})-[:NAMED]->(p:BiblePerson)
    RETURN p.personLookup AS id,
           p.displayTitle AS person,
           p.gender AS gender,
           toInteger(p.verseCount) AS verses,
           p.birthYear AS born,
           p.deathYear AS died,
           p.father AS father,
           p.mother AS mother,
           p.status AS curation,
           left(p.dictionary, 300) AS dictionary
    ORDER BY verses DESC

- name: VersesAboutPerson
  description: Every verse that mentions a person, in canonical order — by name, so every bearer of the name is included and labelled.
  params:
    name:
      type: string
      default: "Jezebel"
      description: "The name, matched case-insensitively."
    translation:
      type: string
      default: "kjv"
      description: "`kjv` (default) or `web`."
  cypher: |
    MATCH (:BibleNameQuery {name: $name})-[:NAMED]->(p:BiblePerson)
    MATCH (b:Book)<-[:IN]-(:Passage)<-[:IN]-(v:Verse)
    WHERE p.personLookup IN v.people
    RETURN p.displayTitle AS person,
           v.name AS reference,
           CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    ORDER BY person, b.bookOrder, v.chapter, v.verse

- name: PeopleInPassage
  description: The people a chapter mentions, and in how many of its verses — the cast of a passage.
  params:
    passage:
      type: string
      default: "Judges 3"
      description: "The chapter, e.g. `2 Kings 9`."
  cypher: |
    MATCH (:Passage {name: $passage})<-[:IN]-(v:Verse)-[:MENTIONS]->(p:BiblePerson)
    RETURN p.displayTitle AS person,
           p.personLookup AS id,
           count(v) AS verses,
           collect(v.verse) AS verseNumbers
    ORDER BY verses DESC, person

- name: Parents
  description: The father and mother of everyone who bore a name, where Theographic records them.
  params:
    name:
      type: string
      default: "Solomon"
      description: "The name, matched case-insensitively."
  cypher: |
    MATCH (:BibleNameQuery {name: $name})-[:NAMED]->(p:BiblePerson)
    OPTIONAL MATCH (p)-[:FATHER]->(f:BiblePerson)
    OPTIONAL MATCH (p)-[:MOTHER]->(m:BiblePerson)
    RETURN p.displayTitle AS person,
           f.displayTitle AS father,
           m.displayTitle AS mother

- name: SearchPassages
  description: The chapters that narrate or contain what the reader describes, in their own words — found by an agentic search over the World English Bible that reformulates, reads and judges each candidate, returned with each chapter's verses in both the King James and the World English Bible so either can be shown. Only chapters judged to fit come back, so fewer than the limit is normal.
  params:
    query:
      type: string
      default: "a younger brother is sold by jealous siblings who lie to their father"
      description: "What the reader remembers, in plain modern English."
    limit:
      type: int
      default: 8
      description: "How many chapters to return, closest first."
  # AGENTIC, NOT A SINGLE PASS. A reader describes a story, not its words: "bears eat boys who mocked a
  # prophet" shares almost no vocabulary with 2 Kings 2 ("youths… mocked him… two female bears… mauled"),
  # and one fused vector+keyword pass ranked it 8th behind chapters about eating. The agentic loop
  # reformulates, runs both retrievals, reads into candidates and keeps only chapters it judges to fit,
  # citing only text it saw. Measured: 2 Kings 2, Jonah 1, Luke 10 and 1 Samuel 17 — all missed or
  # mis-ranked by the single pass — each came back first with fit 1.0, in 4–7 s.
  #
  # WHY THE WEB, WHEN THE KJV IS THE DEFAULT: meaning is searched in modern English because readers
  # ask in modern English. Measured on "a woman kills a sleeping enemy general by driving a tent peg
  # through his head": the WEB chapters rank Judges 4 and 5 first; the KJV chapters miss both in
  # their top five. The hit is mapped back to its Passage (a document's uri ends in the osis), and
  # the chapter is returned in both translations, so the page shows whichever the reader chose.
  #
  # Scoped to the Bible's WEB chapters by tag, inside the retrieval, so the loop never spends its
  # budget on other documents in the world. `r.score` is the loop's judged fit (0..1) and `r.snippet`
  # the evidence it read — both returned.
  cypher: |
    MATCH (c:Concept {value: $query})-[r:RELEVANT_TO {via: 'agentic-rag', intent: 'find the Bible chapter that narrates or contains what the reader describes'}]->(d:Document)
    WHERE 'web' IN d.tags
    WITH r, d, split(d.uri, '/')[3] AS osis
    MATCH (b:Book)<-[:IN]-(p:Passage {osis: osis})<-[:IN]-(v:Verse)
    WITH r, p, b, v ORDER BY v.verse
    WITH r, p, b, collect({n: v.verse, kjv: v.text, web: v.web, ref: v.name}) AS verses
    RETURN r.rank AS rank,
           r.score AS fit,
           p.osis AS osis,
           p.name AS passage,
           b.testament AS testament,
           r.snippet AS matched,
           verses
    ORDER BY rank
    LIMIT $limit

# NEWS → SCRIPTURE. Two views, not one, on purpose: the app lists headlines on load (one news call)
# and runs the agentic search only for the story a reader picks. Ten agentic runs behind a page load
# would be ten model loops nobody asked for.
#
# The news comes from realm-research (NewsItem over Brave, keyed by the ResearchTopic's name), so
# TodaysHeadlines needs that realm installed with a Brave key; without it the view has no HAS_NEWS
# join and the app says so rather than showing an empty strip.

- name: TodaysHeadlines
  description: Today's news stories, from realm-research's Brave news search — the stories Scripture Search finds passages for. Needs realm-research.
  params:
    topic:
      type: string
      default: "world news today"
      description: "What to search the news for; the topic text IS the Brave query."
    limit:
      type: int
      default: 8
      description: "How many stories (Brave returns at most 10)."
  cypher: |
    MATCH (t:ResearchTopic {name: $topic})-[:HAS_NEWS]->(n:NewsItem)
    RETURN n.title AS headline,
           n.description AS summary,
           n.url AS url,
           n.age AS age
    LIMIT $limit

- name: PassagesForStory
  description: The Bible chapters whose story or teaching speaks most directly to a news story — an agentic search over the World English Bible that keeps only chapters it judges to fit, with each chapter's verses in the King James and the World English Bible. Fewer than the limit, or none, is a real answer.
  params:
    story:
      type: string
      default: "Russia launches its largest attack on Ukraine's energy grid, forcing power cuts ahead of winter"
      description: "The headline and its summary, as one text."
    limit:
      type: int
      default: 3
      description: "How many chapters to return, closest first."
  # Same retrieval as SearchPassages; only the intent differs, and the intent is the whole game.
  # News English shares almost nothing with Scripture. Asked plainly for "the chapter that tells of the
  # same kind of event", the loop searched in news words: a diverted aircraft matched "pray that your
  # flight will not be in the winter". Asking it to restate the event in biblical terms FIRST, and search
  # with that, found a conspiracy against the king for a foreign terror plot and a nation threatened with
  # destruction for a nuclear warning (measured 2026-10-01). The appliance's meaning check then keeps a
  # chapter only when it tells the same kind of event, so a story with no biblical counterpart returns
  # nothing — three of eight that day. r.snippet is the evidence it judged by.
  cypher: |
    MATCH (c:Concept {value: $story})-[r:RELEVANT_TO {via: 'agentic-rag', intent: 'first restate this news event as the kind of event the Bible itself narrates, in plain biblical terms (for example: a plot against the king is uncovered; a foreign army burns a city; strangers seek refuge in a land; kings make and break a covenant; a ruler threatens to destroy a nation), then find the chapter that narrates that event. Search with the restatement, not the news words'}]->(d:Document)
    WHERE 'web' IN d.tags
    WITH r, d, split(d.uri, '/')[3] AS osis
    MATCH (b:Book)<-[:IN]-(p:Passage {osis: osis})<-[:IN]-(v:Verse)
    WITH r, p, b, v ORDER BY v.verse
    WITH r, p, b, collect({n: v.verse, kjv: v.text, web: v.web, ref: v.name}) AS verses
    RETURN r.rank AS rank,
           r.score AS fit,
           p.osis AS osis,
           p.name AS passage,
           b.testament AS testament,
           r.snippet AS matched,
           verses
    ORDER BY rank
    LIMIT $limit
