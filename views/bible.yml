# The realm's answer surface.
#
# Every reading view takes `translation`: `kjv` (the default) or `web` (the World English Bible,
# modern English). Both are stored on the Verse, so switching costs nothing and search works in
# either. The five older translations are fetched live and only CompareTranslations reaches them —
# one verse, five calls, well inside bible-api's allowance. A view that fetched them for a whole
# chapter would not be.
#
# References are human (`Judges 3:21`, `Judges 3`), because that is what a reader types and what
# the stored `name` holds. OSIS (`Judg.3.21`) is the identity underneath.

- name: ReadVerse
  description: >-
    One Bible verse by reference, in the King James or World English Bible. With the Theographic ids
    of the people it mentions and its event. Only the one verse, matched exactly by reference (KJV
    numbering); the five older translations are CompareTranslations.
  params:
    ref:
      type: string
      default: "John 3:16"
      description: "The verse exactly as the stored reference writes it (KJV numbering), e.g. `Judges 3:21`, `1 Kings 16:31`."
    translation:
      type: string
      default: "kjv"
      description: "`kjv` (default) or `web` (World English Bible, modern)."
  cypher: |
    MATCH (v:BibleVerse {name: $ref})
    RETURN v.name AS reference,
           CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text,
           CASE $translation WHEN 'web' THEN 'World English Bible' ELSE 'King James Version' END AS translation,
           v.people AS people,
           v.event AS event

- name: ReadPassage
  description: >-
    A whole Bible chapter, verse by verse, in the King James or World English Bible. One chapter
    only, named exactly (`Judges 3`); KJV chapter numbering, and the 66 books only — the
    deuterocanon is ReadDeuterocanonPassage.
  params:
    passage:
      type: string
      default: "Judges 3"
      description: "The chapter exactly as named, e.g. `Judges 3`, `Song of Solomon 2`."
    translation:
      type: string
      default: "kjv"
      description: "`kjv` (default) or `web` (World English Bible, modern)."
  cypher: |
    MATCH (p:Passage {name: $passage})<-[:IN]-(v:BibleVerse)
    RETURN v.verse AS verse,
           CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    ORDER BY verse

- name: SearchVerses
  description: >-
    Bible verses containing a word or phrase, in canonical order. Partial and case-insensitive: it
    matches inside words, so `goat` also finds `goats` and `scapegoat`. Searches one stored
    translation (KJV or WEB), not the five fetched ones; at most `limit` verses.
  params:
    term:
      type: string
      default: "goat"
      description: "The word or phrase to find. A partial match, ignoring case: any verse whose text contains it, inside longer words too."
    translation:
      type: string
      default: "kjv"
      description: "Which text to search and show: `kjv` (default) or `web`. The two often word a verse differently — KJV `kid` is WEB `young goat`."
    limit:
      type: int
      default: 100
      description: "At most this many verses, in canonical order."
  cypher: |
    MATCH (b:Book)<-[:IN]-(:Passage)<-[:IN]-(v:BibleVerse)
    WITH b, v, CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    WHERE toLower(text) CONTAINS toLower($term)
    RETURN v.name AS reference, text
    ORDER BY b.bookOrder, v.chapter, v.verse
    LIMIT $limit

- name: PassagesMentioning
  description: >-
    Bible chapters ranked by how many of their verses contain a word or phrase. Partial and
    case-insensitive, in one stored translation; each chapter lists at most ten matching verse
    numbers, and at most `limit` chapters come back.
  params:
    term:
      type: string
      default: "goat"
      description: "The word or phrase to find. A partial match, ignoring case: a verse counts when its text contains it."
    translation:
      type: string
      default: "kjv"
      description: "Which text to search: `kjv` (default) or `web`."
    limit:
      type: int
      default: 25
      description: "At most this many chapters."
  cypher: |
    MATCH (b:Book)<-[:IN]-(p:Passage)<-[:IN]-(v:BibleVerse)
    WITH b, p, v, CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    WHERE toLower(text) CONTAINS toLower($term)
    // Aggregate in a WITH that keeps b and p: ordered after a RETURN that aggregates, they are out
    // of scope, and Neo4j refuses the whole query.
    WITH b, p, count(v) AS matchingVerses, collect(v.verse)[0..10] AS verses
    RETURN p.name AS passage, matchingVerses, verses
    ORDER BY matchingVerses DESC, b.bookOrder, p.chapter
    LIMIT $limit

- name: CompareTranslations
  description: >-
    One verse side by side in seven translations: KJV, WEB and five older ones. The King James and
    World English are stored; the ASV, Basic English, Darby, Douay-Rheims and Young's Literal are
    fetched live, one call each. Young's Literal is New Testament only, so an Old Testament verse
    has no YLT row. One verse only.
  params:
    ref:
      type: string
      default: "Judges 3:21"
      description: "The verse exactly as the stored reference writes it (KJV numbering), e.g. `Judges 3:21`."
  cypher: |
    MATCH (v:BibleVerse {name: $ref})
    OPTIONAL MATCH (v)-[:RENDERED]->(asv:AsvVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(bbe:BbeVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(darby:DarbyVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(dra:DraVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(ylt:YltVerse)
    UNWIND [
      {translation: 'King James Version (default)', text: v.text},
      {translation: 'World English Bible (modern)', text: v.web},
      {translation: 'American Standard Version', text: trim(asv.text)},
      {translation: 'Bible in Basic English', text: trim(bbe.text)},
      {translation: 'Darby', text: trim(darby.text)},
      {translation: 'Douay-Rheims', text: trim(dra.text)},
      {translation: "Young's Literal", text: trim(ylt.text)}
    ] AS r
    WITH r WHERE r.text IS NOT NULL
    RETURN r.translation AS translation, r.text AS text

- name: ReadVerseDouayRheims
  description: >-
    One verse in the Douay-Rheims, the Catholic translation from the Vulgate. Fetched live under the
    stored reference, which is KJV numbering: bible-api maps the Psalms itself, so `Psalms 23:1`
    returns the Vulgate's Psalm 22, "The Lord ruleth me". Not the deuterocanon — Tobit, Sirach and
    the rest are ReadDeuterocanon. Required: empty returns nothing.
  params:
    ref:
      type: string
      default: ""
      description: "The verse under KJV numbering, e.g. `John 6:51`, `Psalms 23:1`. Required — empty returns nothing."
  cypher: |
    MATCH (v:BibleVerse {name: $ref})-[:RENDERED]->(dra:DraVerse)
    RETURN v.name AS reference, trim(dra.text) AS text, 'Douay-Rheims' AS translation

- name: PeopleNamed
  description: >-
    Everyone in the Bible who bore a name, from Theographic, most-mentioned first. A name is not a
    person — there are 26 Zechariahs — so read displayTitle to tell them apart. Matched on the whole
    name, ignoring case; not part of a name.
  params:
    name:
      type: string
      default: "Jezebel"
      description: "The whole name, matched ignoring case, e.g. `Jezebel`; not part of a name."
  cypher: |
    MATCH (:BibleNameQuery {name: $name})-[:NAMED]->(p:BiblePerson)
    RETURN p.personLookup AS id,
           p.displayTitle AS person,
           p.gender AS gender,
           toInteger(p.verseCount) AS verses,
           p.birthYear AS born,
           p.deathYear AS died,
           p.father AS father,
           p.mother AS mother,
           left(p.dictionary, 300) AS dictionary
    ORDER BY verses DESC

- name: VersesAboutPerson
  description: >-
    Every verse that mentions a person, by name, in canonical order. Every bearer of the name is
    included and labelled, so a common name returns several people's verses; only verses Theographic
    tags with the person, not every verse the name appears in.
  params:
    name:
      type: string
      default: "Jezebel"
      description: "The whole name, matched ignoring case, e.g. `Jezebel`; not part of a name."
    translation:
      type: string
      default: "kjv"
      description: "`kjv` (default) or `web`."
  cypher: |
    MATCH (:BibleNameQuery {name: $name})-[:NAMED]->(p:BiblePerson)
    MATCH (b:Book)<-[:IN]-(:Passage)<-[:IN]-(v:BibleVerse)
    WHERE p.personLookup IN v.people
    RETURN p.displayTitle AS person,
           v.name AS reference,
           CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    ORDER BY person, b.bookOrder, v.chapter, v.verse

- name: PeopleInPassage
  description: >-
    The people a chapter mentions, and in how many of its verses. One chapter, named exactly; only
    the people Theographic tags in its verses, most-mentioned first.
  params:
    passage:
      type: string
      default: "Judges 3"
      description: "The chapter exactly as named, e.g. `2 Kings 9`."
  cypher: |
    MATCH (:Passage {name: $passage})<-[:IN]-(v:BibleVerse)-[:MENTIONS]->(p:BiblePerson)
    RETURN p.displayTitle AS person,
           p.personLookup AS id,
           count(v) AS verses,
           collect(v.verse) AS verseNumbers
    ORDER BY verses DESC, person

- name: Parents
  description: >-
    Father and mother of everyone who bore a name, where Theographic records them. Every bearer
    of the name; a parent Theographic does not record is empty, not unknown to Scripture.
  params:
    name:
      type: string
      default: "Solomon"
      description: "The whole name, matched ignoring case, e.g. `Solomon`; not part of a name."
  cypher: |
    MATCH (:BibleNameQuery {name: $name})-[:NAMED]->(p:BiblePerson)
    OPTIONAL MATCH (p)-[:FATHER]->(f:BiblePerson)
    OPTIONAL MATCH (p)-[:MOTHER]->(m:BiblePerson)
    RETURN p.displayTitle AS person,
           f.displayTitle AS father,
           m.displayTitle AS mother

- name: SearchPassages
  description: >-
    Bible chapters that tell what the reader describes, by agentic search. It searches the World
    English Bible's chapters, reformulates, reads and judges each candidate, and returns each kept
    chapter's verses in the King James and the World English Bible. Only chapters judged to fit come
    back, so fewer than the limit is normal. Several model calls per question.
  params:
    query:
      type: string
      default: "a younger brother is sold by jealous siblings who lie to their father"
      description: "What the reader remembers, in plain modern English."
    limit:
      type: int
      default: 8
      description: "How many chapters to return, closest first."
  # AGENTIC, NOT A SINGLE PASS. A reader describes a story, not its words: "bears eat boys who mocked a
  # prophet" shares almost no vocabulary with 2 Kings 2 ("youths… mocked him… two female bears… mauled"),
  # and one fused vector+keyword pass ranked it 8th behind chapters about eating. The agentic loop
  # reformulates, runs both retrievals, reads into candidates and keeps only chapters it judges to fit,
  # citing only text it saw. Measured: 2 Kings 2, Jonah 1, Luke 10 and 1 Samuel 17 — all missed or
  # mis-ranked by the single pass — each came back first with fit 1.0, in 4–7 s.
  #
  # WHY THE WEB, WHEN THE KJV IS THE DEFAULT: meaning is searched in modern English because readers
  # ask in modern English. Measured on "a woman kills a sleeping enemy general by driving a tent peg
  # through his head": the WEB chapters rank Judges 4 and 5 first; the KJV chapters miss both in
  # their top five. The hit is mapped back to its Passage (a document's uri ends in the osis), and
  # the chapter is returned in both translations, so the page shows whichever the reader chose.
  #
  # Scoped to the Bible's WEB chapters by tag, inside the retrieval, so the loop never spends its
  # budget on other documents in the world. `r.score` is the loop's judged fit (0..1) and `r.snippet`
  # the evidence it read — both returned.
  cypher: |
    MATCH (c:Concept {value: $query})-[r:RELEVANT_TO {via: 'agentic-rag', intent: 'find the Bible chapter that narrates or contains what the reader describes'}]->(d:Document)
    WHERE 'web' IN d.tags
    WITH r, d, split(d.uri, '/')[3] AS osis
    MATCH (b:Book)<-[:IN]-(p:Passage {osis: osis})<-[:IN]-(v:BibleVerse)
    WITH r, p, b, v ORDER BY v.verse
    WITH r, p, b, collect({n: v.verse, kjv: v.text, web: v.web, ref: v.name}) AS verses
    RETURN r.rank AS rank,
           r.score AS fit,
           p.osis AS osis,
           p.name AS passage,
           b.testament AS testament,
           r.snippet AS matched,
           verses
    ORDER BY rank
    LIMIT $limit

# NEWS → SCRIPTURE. Two views, not one, on purpose: the app lists headlines on load (one news call)
# and runs the agentic search only for the story a reader picks. Ten agentic runs behind a page load
# would be ten model loops nobody asked for.
#
# The news comes from realm-research (NewsItem over Brave, keyed by the ResearchTopic's name), so
# TodaysHeadlines needs that realm installed with a Brave key; without it the view has no HAS_NEWS
# join and the app says so rather than showing an empty strip.

- name: TodaysHeadlines
  description: >-
    Today's news stories for a topic, from realm-research's news search. At most `limit` stories
    (the search returns ten at most); needs realm-research installed with its search key, and
    answers nothing without it.
  params:
    topic:
      type: string
      default: "world news today"
      description: "What to search the news for; the topic text IS the Brave query."
    limit:
      type: int
      default: 8
      description: "At most this many stories (the search returns ten at most)."
  cypher: |
    MATCH (t:ResearchTopic {name: $topic})-[:HAS_NEWS]->(n:NewsItem)
    RETURN n.title AS headline,
           n.description AS summary,
           n.url AS url,
           n.age AS age
    LIMIT $limit

- name: PassagesForStory
  description: >-
    Bible chapters whose story or teaching speaks to a news story, agentic search. It restates
    the event in biblical terms, searches the World English Bible and keeps only chapters it judges
    to fit, with each chapter's verses in the King James and World English. Fewer than the limit, or
    none, is a real answer.
  params:
    story:
      type: string
      default: "Russia launches its largest attack on Ukraine's energy grid, forcing power cuts ahead of winter"
      description: "The headline and its summary, as one text."
    limit:
      type: int
      default: 3
      description: "How many chapters to return, closest first."
  # Same retrieval as SearchPassages; only the intent differs, and the intent is the whole game.
  # News English shares almost nothing with Scripture. Asked plainly for "the chapter that tells of the
  # same kind of event", the loop searched in news words: a diverted aircraft matched "pray that your
  # flight will not be in the winter". Asking it to restate the event in biblical terms FIRST, and search
  # with that, found a conspiracy against the king for a foreign terror plot and a nation threatened with
  # destruction for a nuclear warning (measured 2026-10-01). The appliance's meaning check then keeps a
  # chapter only when it tells the same kind of event, so a story with no biblical counterpart returns
  # nothing — three of eight that day. r.snippet is the evidence it judged by.
  cypher: |
    MATCH (c:Concept {value: $story})-[r:RELEVANT_TO {via: 'agentic-rag', intent: 'first restate this news event as the kind of event the Bible itself narrates, in plain biblical terms (for example: a plot against the king is uncovered; a foreign army burns a city; strangers seek refuge in a land; kings make and break a covenant; a ruler threatens to destroy a nation), then find the chapter that narrates that event. Search with the restatement, not the news words'}]->(d:Document)
    WHERE 'web' IN d.tags
    WITH r, d, split(d.uri, '/')[3] AS osis
    MATCH (b:Book)<-[:IN]-(p:Passage {osis: osis})<-[:IN]-(v:BibleVerse)
    WITH r, p, b, v ORDER BY v.verse
    WITH r, p, b, collect({n: v.verse, kjv: v.text, web: v.web, ref: v.name}) AS verses
    RETURN r.rank AS rank,
           r.score AS fit,
           p.osis AS osis,
           p.name AS passage,
           b.testament AS testament,
           r.snippet AS matched,
           verses
    ORDER BY rank
    LIMIT $limit

# ── Derived: tribes, parallel tellings, tribal chapters (rules/*.yml) ─────────────────────────
# Naming a derived label is what evaluates its rule set, so these views are how the rules reach
# every surface.

- name: TribeOf
  description: >-
    The tribe of Israel each bearer of a name descends from, through the father. Derived by
    rules/tribes.yml; no row means Theographic does not link that person's father chain to a son of
    Israel, not that they had no tribe.
  params:
    name:
      type: string
      default: "Moses"
      description: "The person's name, exactly as Theographic spells it."
  cypher: |
    MATCH (t:TribeMember {name: $name})
    RETURN t.displayTitle AS person, t.tribe AS tribe

- name: TribeCensus
  description: >-
    How many people Theographic links to each tribe by descent through the father. A count of linked
    records, not a population: only people whose father chain Theographic records back to a son of
    Israel.
  cypher: |
    MATCH (t:TribeMember)
    RETURN t.tribe AS tribe, count(*) AS people
    ORDER BY people DESC

- name: ParallelTellings
  description: >-
    Chapters in other books that share a cast with this one. Parallel tellings and copied lists
    (rules/parallels.yml); only chapters sharing several Theographic-tagged people, so a parallel
    told with different names is not found.
  params:
    passage:
      type: string
      default: "2 Samuel 8"
      description: "The chapter, e.g. `2 Samuel 8`."
  cypher: |
    MATCH (a:Passage {name: $passage})-[r:PARALLELS]-(b:Passage)
    RETURN b.name AS parallel, r.shared AS sharedPeople
    ORDER BY sharedPeople DESC

- name: TribalChapters
  description: >-
    Chapters whose cast is mostly one tribe, strongest first. Derived by rules/tribal-chapters.yml,
    stacked on rules/tribes.yml; only people whose tribe can be derived count toward the cast.
  params:
    tribe:
      type: string
      default: "Levi"
      description: "The tribe, e.g. `Levi`, `Judah`."
  cypher: |
    MATCH (p:TribalChapter {tribe: $tribe})
    RETURN p.name AS passage, p.tribalCast AS members
    ORDER BY members DESC, passage

- name: GreatestHouses
  description: >-
    Fathers with the most descendants through the male line, largest first. Among Israel's
    descendants as Theographic links them (rules/progenitors.yml); at most `limit` fathers, and only
    descent Theographic records.
  params:
    limit:
      type: int
      default: 15
      description: "At most this many fathers."
  cypher: |
    MATCH (p:Progenitor)
    RETURN p.displayTitle AS father, p.descendants AS descendants
    ORDER BY descendants DESC
    LIMIT $limit

- name: GenerationFromAdam
  description: >-
    How many generations each bearer of a name stands from Adam, father to son. Derived by
    rules/generations.yml; no row means Theographic does not link that person's father chain back to
    Adam.
  params:
    name:
      type: string
      default: "David"
      description: "The person's name, exactly as Theographic spells it."
  cypher: |
    MATCH (g:Generation {name: $name})
    RETURN g.displayTitle AS person, g.fromAdam AS generation
    ORDER BY generation
