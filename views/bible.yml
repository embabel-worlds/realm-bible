# The realm's answer surface.
#
# Every reading view takes `translation`: `kjv` (the default) or `web` (the World English Bible,
# modern English). Both are stored on the Verse, so switching costs nothing and search works in
# either. The five older translations are fetched live and only CompareTranslations reaches them —
# one verse, five calls, well inside bible-api's allowance. A view that fetched them for a whole
# chapter would not be.
#
# References are human (`Judges 3:21`, `Judges 3`), because that is what a reader types and what
# the stored `name` holds. OSIS (`Judg.3.21`) is the identity underneath.

- name: ReadVerse
  description: One verse by reference, in the King James Version by default or the World English Bible — with the people it mentions.
  params:
    ref:
      type: string
      default: "John 3:16"
      description: "The verse, e.g. `Judges 3:21`, `1 Kings 16:31`."
    translation:
      type: string
      default: "kjv"
      description: "`kjv` (default) or `web` (World English Bible, modern)."
  cypher: |
    MATCH (v:Verse {name: $ref})
    RETURN v.name AS reference,
           CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text,
           CASE $translation WHEN 'web' THEN 'World English Bible' ELSE 'King James Version' END AS translation,
           v.people AS people,
           v.event AS event

- name: ReadPassage
  description: A whole chapter, verse by verse, in the King James Version by default or the World English Bible.
  params:
    passage:
      type: string
      default: "Judges 3"
      description: "The chapter, e.g. `Judges 3`, `Song of Solomon 2`."
    translation:
      type: string
      default: "kjv"
      description: "`kjv` (default) or `web` (World English Bible, modern)."
  cypher: |
    MATCH (p:Passage {name: $passage})<-[:IN]-(v:Verse)
    RETURN v.verse AS verse,
           CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    ORDER BY verse

- name: SearchVerses
  description: Verses whose text contains a word or phrase, case-insensitively, in canonical order. Matches inside words — `goat` also finds `goats` and `scapegoat`.
  params:
    term:
      type: string
      default: "goat"
      description: "The word or phrase to find."
    translation:
      type: string
      default: "kjv"
      description: "Which text to search and show: `kjv` (default) or `web`. The two often word a verse differently — KJV `kid` is WEB `young goat`."
    limit:
      type: int
      default: 100
      description: "How many verses to return."
  cypher: |
    MATCH (b:Book)<-[:IN]-(:Passage)<-[:IN]-(v:Verse)
    WITH b, v, CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    WHERE toLower(text) CONTAINS toLower($term)
    RETURN v.name AS reference, text
    ORDER BY b.bookOrder, v.chapter, v.verse
    LIMIT $limit

- name: PassagesMentioning
  description: The chapters that mention a word or phrase most often, ranked by how many of their verses contain it.
  params:
    term:
      type: string
      default: "goat"
      description: "The word or phrase to find."
    translation:
      type: string
      default: "kjv"
      description: "Which text to search: `kjv` (default) or `web`."
    limit:
      type: int
      default: 25
      description: "How many passages to return."
  cypher: |
    MATCH (b:Book)<-[:IN]-(p:Passage)<-[:IN]-(v:Verse)
    WITH b, p, v, CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    WHERE toLower(text) CONTAINS toLower($term)
    RETURN p.name AS passage,
           count(v) AS matchingVerses,
           collect(v.verse)[0..10] AS verses
    ORDER BY matchingVerses DESC, b.bookOrder, p.chapter
    LIMIT $limit

- name: CompareTranslations
  description: One verse side by side in all seven translations — the stored King James and World English, and five older ones fetched live. Young's Literal is New Testament only, so an Old Testament verse has no YLT row.
  params:
    ref:
      type: string
      default: "Judges 3:21"
      description: "The verse, e.g. `Judges 3:21`."
  cypher: |
    MATCH (v:Verse {name: $ref})
    OPTIONAL MATCH (v)-[:RENDERED]->(asv:AsvVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(bbe:BbeVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(darby:DarbyVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(dra:DraVerse)
    OPTIONAL MATCH (v)-[:RENDERED]->(ylt:YltVerse)
    UNWIND [
      {translation: 'King James Version (default)', text: v.text},
      {translation: 'World English Bible (modern)', text: v.web},
      {translation: 'American Standard Version', text: trim(asv.text)},
      {translation: 'Bible in Basic English', text: trim(bbe.text)},
      {translation: 'Darby', text: trim(darby.text)},
      {translation: 'Douay-Rheims', text: trim(dra.text)},
      {translation: "Young's Literal", text: trim(ylt.text)}
    ] AS r
    WITH r WHERE r.text IS NOT NULL
    RETURN r.translation AS translation, r.text AS text

- name: PeopleNamed
  description: Everyone in the Bible who bore a name, from Theographic. A name is not a person — there are 26 Zechariahs — so read displayTitle to tell them apart; most-mentioned first.
  params:
    name:
      type: string
      default: "Jezebel"
      description: "The name, matched case-insensitively."
  cypher: |
    MATCH (:BibleNameQuery {name: $name})-[:NAMED]->(p:BiblePerson)
    RETURN p.personLookup AS id,
           p.displayTitle AS person,
           p.gender AS gender,
           toInteger(p.verseCount) AS verses,
           p.birthYear AS born,
           p.deathYear AS died,
           p.father AS father,
           p.mother AS mother,
           p.status AS curation,
           left(p.dictionary, 300) AS dictionary
    ORDER BY verses DESC

- name: VersesAboutPerson
  description: Every verse that mentions a person, in canonical order — by name, so every bearer of the name is included and labelled.
  params:
    name:
      type: string
      default: "Jezebel"
      description: "The name, matched case-insensitively."
    translation:
      type: string
      default: "kjv"
      description: "`kjv` (default) or `web`."
  cypher: |
    MATCH (:BibleNameQuery {name: $name})-[:NAMED]->(p:BiblePerson)
    MATCH (b:Book)<-[:IN]-(:Passage)<-[:IN]-(v:Verse)
    WHERE p.personLookup IN v.people
    RETURN p.displayTitle AS person,
           v.name AS reference,
           CASE $translation WHEN 'web' THEN v.web ELSE v.text END AS text
    ORDER BY person, b.bookOrder, v.chapter, v.verse

- name: PeopleInPassage
  description: The people a chapter mentions, and in how many of its verses — the cast of a passage.
  params:
    passage:
      type: string
      default: "Judges 3"
      description: "The chapter, e.g. `2 Kings 9`."
  cypher: |
    MATCH (:Passage {name: $passage})<-[:IN]-(v:Verse)-[:MENTIONS]->(p:BiblePerson)
    RETURN p.displayTitle AS person,
           p.personLookup AS id,
           count(v) AS verses,
           collect(v.verse) AS verseNumbers
    ORDER BY verses DESC, person

- name: Parents
  description: The father and mother of everyone who bore a name, where Theographic records them.
  params:
    name:
      type: string
      default: "Solomon"
      description: "The name, matched case-insensitively."
  cypher: |
    MATCH (:BibleNameQuery {name: $name})-[:NAMED]->(p:BiblePerson)
    OPTIONAL MATCH (p)-[:FATHER]->(f:BiblePerson)
    OPTIONAL MATCH (p)-[:MOTHER]->(m:BiblePerson)
    RETURN p.displayTitle AS person,
           f.displayTitle AS father,
           m.displayTitle AS mother
