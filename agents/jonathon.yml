# Jonathon: the colleague you talk to about scripture.
#
# An agent with a persona and no unattended work — no duties, no routines. He is talked to, never
# on duty alone (#1903). Proposed, not appointed: he arrives from this realm needing a sponsor, and
# runs as signed, persona included, so a change to his guardrails waits for that signature.
#
# Talk to him with `/talk jonathon` once he is adopted (signed, and on or observing). The
# conversation below is his scope: this realm, and only the host tools a pastor needs — memory, to
# know a person between conversations; views, to read a verse at all; the graph and the code
# runners, which is how he queries scripture. Not email, documents or apps.
name: jonathon
job: Help people read scripture, and be known while they do.
routing: >-
  Ask me about the Bible: a passage, a person or place in the text, a translation, a feast day,
  or faith and doubt.
persona: realm-bible/jonathon
conversation:
  realms: [realm-bible]
  builtins: [memory, views, graph, code]
state: active
# A pastor reads; he does not act. Nothing this realm can do is his to do without asking, and
# anything outside it is not his at all.
authority:
  default: never
