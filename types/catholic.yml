# The Catholic year, stored: one LiturgicalDay per date and one Celebration per thing celebrated.
#
#   Celebration ─ON─▶ LiturgicalDay
#
# Seeded from reference/catholic-calendar-<year>.yml, which scripts/calendar/build.mjs computes from
# romcal. The universal General Roman Calendar only — a country's own calendar (its patron, a holy
# day transferred to Sunday) is not applied, and views say so.

- name: LiturgicalDay
  description: >-
    One day of the General Roman Calendar (universal, 2025–2030), identified by `date` (ISO,
    `2026-10-01`): the principal celebration, its rank, the liturgical colour and season, and the
    Sunday and weekday lectionary cycles. Each Celebration is ON its day. A country's own calendar —
    a patron, a holy day transferred to Sunday — is not applied.
  examples:
    - q: "what does the Church celebrate on 1 November 2026"
      cypher: |
        MATCH (c:Celebration)-[:ON]->(d:LiturgicalDay {date: '2026-11-01'})
        RETURN d.season AS season, d.colour AS colour, c.name AS celebration, c.rank AS rank
        ORDER BY c.rankOrder
  userAnchor: false
  properties:
    date:
      identity: true
      description: "The calendar date, ISO `YYYY-MM-DD`, e.g. `2026-10-01`. Identity."
    weekday: "Day of the week, e.g. `Thursday`."
    celebration: "The day's principal celebration as the calendar names it."
    rank:
      values: ["solemnity", "sunday", "feast", "memorial", "optional memorial", "weekday"]
      description: "The principal celebration's rank, lower case: solemnity, sunday, feast, memorial, optional memorial or weekday."
    colour:
      description: "Liturgical colour of the principal celebration, lower case: white, red, green, purple or rose; empty on the few days the calendar leaves it open."
    season:
      values: ["advent", "christmas time", "ordinary time", "lent", "paschal triduum", "easter time"]
      description: "The liturgical season, lower case: advent, christmas time, ordinary time, lent, paschal triduum or easter time."
    sundayCycle:
      values: ["a", "b", "c"]
      description: "Sunday lectionary year, lower case: a, b or c."
    weekdayCycle:
      values: ["1", "2"]
      description: "Weekday lectionary year, as text: `1` or `2`."
    psalterWeek:
      description: "Week of the four-week psalter of the Liturgy of the Hours, as text: `1` to `4`."
    holyDayOfObligation:
      type: boolean
      description: "True when the universal calendar makes it a holy day of obligation (a bishops' conference may transfer or dispense)."

- name: Celebration
  description: >-
    One thing celebrated on one day of the General Roman Calendar, identified by `key`
    (`<date>/<celebrationId>`) — a solemnity, a feast, a memorial, or each of several optional
    memorials. ON its LiturgicalDay. `saints` holds the calendar's ids for the saints it honours;
    CalendarSaint maps them to Wikidata.
  userAnchor: false
  properties:
    key:
      identity: true
      description: "`<date>/<id>`, e.g. `2026-10-01/therese_of_the_child_jesus_and_the_holy_face_of_lisieux_virgin`. Identity."
    celebrationId: "The calendar's stable id for the celebration — the same every year, e.g. `all_saints`."
    date:
      description: "The day it is celebrated, ISO `YYYY-MM-DD` — after any transfer the universal calendar makes."
    name: "The celebration's English name, e.g. `Saint Thérèse of the Child Jesus, Virgin and Doctor of the Church`."
    rank:
      values: ["solemnity", "sunday", "feast", "memorial", "optional memorial", "weekday"]
      description: "Its rank, lower case: solemnity, sunday, feast, memorial, optional memorial or weekday."
    rankOrder:
      type: int
      description: "1 solemnity … 6 weekday — sort by it to put the day's greatest first."
    principal:
      type: boolean
      description: "True for the day's principal celebration; optional memorials beside a weekday are false."
    optional:
      type: boolean
      description: "True for an optional memorial — a parish may keep it or the weekday."
    colours:
      description: "Liturgical colours it may be kept in, a list of white, red, green, purple, rose."
    holyDayOfObligation:
      type: boolean
      description: "True when the universal calendar makes it a holy day of obligation."
    saints: "The calendar's ids for the saints honoured, a list (empty for a feast of the Lord or a weekday)."

# ── Devotions ────────────────────────────────────────────────────────────────────────────────
#
#   RosaryMystery ─TOLD_IN─▶ Passage          RosaryDay {weekday} names the set prayed that day
#   Prayer                                     CatechismEntry  (every catechism, one shape)
#
# All public domain or facts of practice; see reference/catholic-*.yml headers for sources.

- name: RosaryMystery
  description: >-
    One of the twenty mysteries of the Rosary, identified by `key` (`joyful-1`): its set (joyful,
    luminous, sorrowful, glorious), its number in the set, the Scripture it meditates (`scripture`,
    a verse range; TOLD_IN the Passage), and the fruit traditionally asked for.
  examples:
    - q: "the sorrowful mysteries with their Scripture"
      cypher: |
        MATCH (m:RosaryMystery {set: 'sorrowful'})
        OPTIONAL MATCH (m)-[:TOLD_IN]->(p:Passage)
        RETURN m.number AS number, m.name AS mystery, m.scripture AS scripture, p.name AS chapter
        ORDER BY number
  userAnchor: false
  properties:
    key:
      identity: true
      description: "`<set>-<number>`, e.g. `joyful-1`. Identity."
    set:
      values: ["joyful", "luminous", "sorrowful", "glorious"]
      description: "The set it belongs to, lower case: joyful, luminous, sorrowful or glorious."
    number:
      type: int
      description: "1–5 within the set."
    name:
      description: "The mystery's name, e.g. `The Annunciation`, `The Agony in the Garden`."
    scripture: "The verse range it meditates, e.g. `Luke 1:26-38`."
    osis: "OSIS chapter the range falls in, e.g. `Luke.1` — TOLD_IN joins to that Passage."
    fruit: "The grace traditionally asked for in meditating it, e.g. `Humility`."
    note:
      description: "Set where the mystery is not itself narrated in Scripture (the Assumption, the Coronation); empty otherwise."

- name: RosaryDay
  description: >-
    One day of the week, identified by `weekday`, and the set of mysteries prayed on it: Monday and
    Saturday joyful, Tuesday and Friday sorrowful, Wednesday and Sunday glorious, Thursday luminous
    (Rosarium Virginis Mariae, 2002).
  userAnchor: false
  properties:
    weekday:
      identity: true
      description: "Day of the week, e.g. `Thursday`. Identity."
    set:
      values: ["joyful", "luminous", "sorrowful", "glorious"]
      description: "The set prayed that day, lower case: joyful, luminous, sorrowful or glorious."

- name: Prayer
  description: >-
    One traditional Catholic prayer in its long-established public-domain English form, identified
    by `key` (`hail-mary`) — the Our Father, Hail Mary, Glory Be, Hail Holy Queen, the Angelus, the
    Memorare…
  userAnchor: false
  properties:
    key:
      identity: true
      description: "Slug, e.g. `hail-mary`. Identity."
    name:
      description: "The prayer's customary English title, e.g. `Hail Mary`, `The Angelus`."
    text:
      description: "The full text of the prayer in its traditional public-domain English form."

- name: CatechismEntry
  description: >-
    One entry of a public-domain catechism, identified by `key` (`<catechismId>/<number>`, e.g.
    `baltimore-2/6`), in a shape every catechism here shares: a question and answer (Baltimore) or a
    numbered passage (An Outline of the Faith). `part`/`section` place it in the book; PROVED_BY
    joins the chapters it cites.
  userAnchor: false
  properties:
    key:
      identity: true
      description: "`<catechismId>/<number>`, e.g. `baltimore-2/6`. Identity."
    catechism: "The catechism's name, e.g. `Baltimore Catechism No. 2`."
    catechismId:
      description: "Stable id of the catechism, e.g. `baltimore-2`; the first part of `key`."
    part: "The book's own division, e.g. `Lesson 1`."
    partNumber:
      type: int
      description: "The division's number, for ordering."
    section: "The division's title, e.g. `On The End Of Man`."
    number:
      type: int
      description: "The entry's number in the catechism."
    question: "The question, where the catechism is in question-and-answer form."
    text: "The answer or passage."
    note:
      description: "Editorial note — set when an entry's text is withheld or qualified; empty otherwise."
    proofTexts: "Scripture references the catechism itself names for the entry, e.g. `Exodus 20:1-17`; the entry is PROVED_BY those chapters. Most catechisms give none."

- name: CccTopic
  description: >-
    One topic, feast or devotion and where the Catechism of the Catholic Church treats it,
    identified by `key` (`the-eucharist`): paragraph numbers, and a link to the official text on
    vatican.va. No CCC text is carried — it is copyright. A Rosary mystery's topic EXPLAINS that
    mystery.
  userAnchor: false
  properties:
    key:
      identity: true
      description: "Slug of the topic, e.g. `the-eucharist`. Identity."
    topic:
      description: "The topic as a reader names it, e.g. `The Eucharist`, `Rosary — The Annunciation`."
    paragraphs: "CCC paragraph numbers, e.g. `1322–1419` or `971, 2678, 2708`."
    firstParagraph:
      type: int
      description: "The first paragraph number, for ordering."
    url:
      description: "The vatican.va page holding the first paragraph — the official text, which is not carried here."
    section: "That page's heading in the Catechism, e.g. `Article 3 THE SACRAMENT OF THE EUCHARIST`."
    urls:
      description: "Every vatican.va page the paragraph ranges start on, a list of URLs."
    mystery: "The Rosary mystery's key, e.g. `joyful-1`, when the topic is a mystery."

# ── The deuterocanon ─────────────────────────────────────────────────────────────────────────
#
#   DeuterocanonBook ─VERSES─▶ DeuterocanonVerse     (fetched live from getbible.net, cached forever)
#
# The books a Catholic Bible has and the stored Verse graph does not: Tobit, Judith, Wisdom, Sirach,
# Baruch, 1 and 2 Maccabees, and the Douay-Rheims chapters of Esther (11–16) and Daniel (13–14).
# Only the nine books are stored; their text is fetched a whole book at a time and never again.
# Douay-Rheims only, in its own (Vulgate) numbering.

- name: DeuterocanonBook
  description: >-
    One of the nine books (or parts of books) of the deuterocanon a Catholic Bible has and the
    stored Protestant canon lacks, identified by `name` (`Sirach`), with the number getbible.net
    files it under. `fromChapter` is where the Douay-Rheims chapters the stored canon lacks begin —
    11 for Esther, 13 for Daniel, 1 otherwise.
  userAnchor: false
  properties:
    name:
      identity: true
      description: "Tobit, Judith, Esther, Wisdom, Sirach, Baruch, Daniel, 1 Maccabees or 2 Maccabees. Identity."
    number:
      description: "getbible.net's book number, as text, e.g. `74` for Sirach — the key VERSES fetches with."
    bookOrder:
      type: int
      description: "Order in a Catholic Bible, among these nine."
    fromChapter:
      type: int
      description: "First chapter to read: 11 for Esther, 13 for Daniel, 1 otherwise."

- name: DeuterocanonVerse
  description: >-
    One verse of a deuterocanonical book in the Douay-Rheims (public domain), identified by `name`
    (`Sirach 2:1`), in its Vulgate numbering. Reached from DeuterocanonBook via VERSES; a whole book
    is fetched live from getbible.net and cached forever.
  virtualJoins:
    - anchorLabel: DeuterocanonBook
      relationship: VERSES
      keyField: number
      recordKeyField: bookNumber
      producer: deuterocanonBook
      description: "Every verse of this book in the Douay-Rheims."
  properties:
    name:
      identity: true
      description: "The reference, e.g. `Sirach 2:1`. Identity."
    bookNumber: "getbible's book number the verse was fetched under."
    chapter:
      type: int
      description: "Chapter number, in the Vulgate numbering the Douay-Rheims uses."
    verse:
      type: int
      description: "Verse number within the chapter, Vulgate numbering."
    text:
      description: "The verse in the Douay-Rheims (1899 American edition, public domain), as getbible.net gives it."
