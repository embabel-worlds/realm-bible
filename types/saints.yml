# Saints: who the calendar's saints are, and their lives, fetched live from Wikidata and Wikipedia.
#
#   CalendarSaint {saintId} ─CARD─▶ SaintCard ─PATRON_OF─▶ SaintPatronage
#   SaintQuery {wd}        ─CARD─▶ SaintCard ─LIFE─▶ SaintLife (Wikipedia summary)
#   Country {iso2}         ─SAINTS─▶ CountrySaint
#   SaintRoll {scope:'all'} ─CAUSE─▶ SaintCause (everyone at once: stages, dates, martyrdom)
#
# CalendarSaint and Country are stored (reference/catholic-saints.yml, reference/catholic-countries.yml);
# everything else is fetched when a query reaches it. A Celebration names its saints by `saints`
# (calendar ids), which CalendarSaint.saintId matches.

- name: CalendarSaint
  description: >-
    One saint (or blessed, or Our Lady) honoured in the General Roman Calendar, identified by
    `saintId` — the calendar's own id, as a Celebration's `saints` lists it — with the Wikidata
    entity that is them (`wd`). CARD fetches their Wikidata card.
  userAnchor: false
  properties:
    saintId:
      identity: true
      description: "The calendar's id, e.g. `therese_of_the_child_jesus_and_the_holy_face_of_lisieux_virgin`. Identity."
    qid: "Wikidata QID, e.g. `Q181715`."
    wd: "Wikidata entity IRI — the key CARD fetches with."
    label: "Wikidata's English label, e.g. `Thérèse of Lisieux`."
    matched:
      values: ["search", "curated"]
      description: "How the Wikidata entity was matched: `search` (Wikidata's entity search, then checked) or `curated` (set by hand)."
    canonization:
      description: "The calendar's level, lower case: `saint` or `blessed`; empty for a feast of Our Lady or of an event."

- name: SaintQuery
  visibility: internal
  userAnchor: false
  description: >-
    An anchor for one Wikidata entity, so a saint's card can be fetched by entity wherever the IRI comes
    from — `MATCH (c:SaintCard {wd: $wd})`: the engine writes this door, pinned to the IRI, by itself.
  properties:
    wd:
      identity: true
      description: "Wikidata entity IRI, e.g. `http://www.wikidata.org/entity/Q181715`. Identity."

- name: SaintCard
  description: >-
    One saint's card as Wikidata records it, identified by `wd`, the entity IRI: dates, birth, death
    and burial places with coordinates and countries, image, canonization status, religious order,
    feast day, and the English Wikipedia article (LIFE fetches its summary). Fetched live, CC0,
    cached 30 days. Dates may be traditional or approximate for early saints.
  properties:
    wd:
      identity: true
      description: "Wikidata entity IRI. Identity."
    wdLabel:
      description: "Wikidata's English label for the saint, e.g. `Thérèse of Lisieux`."
    wdDescription: "One-line English description."
    birthDate:
      description: "Date of birth (P569), ISO date-time in UTC as Wikidata stores it, e.g. `1873-01-02T00:00:00Z`; approximate for early saints."
    deathDate:
      description: "Date of death (P570), ISO date-time in UTC as Wikidata stores it; approximate for early saints. The traditional feast is often this day."
    birthPlace: "Place of birth (P19)."
    birthCoord: "Its coordinates, WKT `Point(lon lat)`."
    birthCountry:
      description: "The country (P17) of the place of birth, as Wikidata's English label."
    deathPlace: "Place of death (P20)."
    deathCoord: "Its coordinates, WKT `Point(lon lat)`."
    deathCountry:
      description: "The country (P17) of the place of death, as Wikidata's English label, e.g. `France`."
    burialPlace: "Place of burial (P119)."
    burialCoord: "Its coordinates, WKT `Point(lon lat)`."
    image: "Wikimedia Commons image (P18), a URL."
    canonization:
      description: "Canonization status (P411) as Wikidata labels it, e.g. `Catholic saint`, `blessed`, `Venerable`, `Servant of God`."
    religiousOrder: "Religious order (P611), e.g. `Order of Discalced Carmelites`."
    feastDay: "Feast day (P841) as Wikidata records it — the calendar's own date is on Celebration."
    article: "English Wikipedia article title, spaces as underscores, e.g. `Teresa_of_Ávila`."
  virtualJoins:
    - anchorLabel: CalendarSaint
      relationship: CARD
      keyField: wd
      recordKeyField: wd
      producer: saintCardByEntity
      description: "The card of the calendar saint: `MATCH (s:CalendarSaint {saintId: …})-[:CARD]->(c:SaintCard)`."
    - anchorLabel: SaintQuery
      relationship: CARD
      keyField: wd
      recordKeyField: wd
      materializedKeyField: wd
      producer: saintCardByEntity
      description: "The card for one entity — `MATCH (c:SaintCard {wd: $wd})`."

- name: SaintPatronage
  description: >-
    One thing a saint is patron of — a city, a country, a trade, a cause — identified by `patronKey`
    (`<saint IRI>|<thing IRI>`), as Wikidata records it on the patronised thing (P417). Buildings
    dedicated to the saint (churches, convents, chapels) are excluded; at most 400 per request.
    Fetched live, cached 30 days.
  properties:
    patronKey:
      identity: true
      description: "`<saint IRI>|<thing IRI>`. Identity."
    wd: "The saint's entity IRI."
    thing: "The patronised thing's entity IRI."
    thingLabel: "Its English label, e.g. `Amsterdam`."
    kindLabel: "What kind of thing it is, e.g. `city`, `occupation`."
  virtualJoins:
    - anchorLabel: SaintCard
      relationship: PATRON_OF
      keyField: wd
      recordKeyField: wd
      producer: saintPatronageByEntity
      description: "What the saint is patron of: `(c:SaintCard)-[:PATRON_OF]->(p:SaintPatronage)`."

- name: SaintLife
  description: >-
    One saint's life in brief: the opening of their English Wikipedia article, identified by `key`,
    the article title it was fetched by. Fetched live, never stored, cached a week. Text is CC BY-SA
    4.0: show `pageUrl` with it.
  properties:
    key:
      identity: true
      description: "The article title it was fetched by. Identity."
    title: "The article's title."
    extract: "The summary — the article's opening paragraphs, plain text."
    thumbnail: "A thumbnail image URL, when the article has one."
    pageUrl: "The article's URL — the attribution link."
  virtualJoins:
    - anchorLabel: SaintCard
      relationship: LIFE
      keyField: article
      recordKeyField: key
      producer: wikipediaSummary
      description: "The saint's life in brief: `(c:SaintCard)-[:LIFE]->(l:SaintLife)`."

- name: Country
  description: >-
    One country, identified by its ISO 3166-1 alpha-2 code `iso2` (`IE`), with its Wikidata entity —
    where SAINTS and SAINT_COUNT start.
  userAnchor: false
  properties:
    iso2:
      identity: true
      description: "ISO 3166-1 alpha-2, upper case, e.g. `IE`. Identity."
    wd: "Wikidata entity IRI."
    qid: "Wikidata QID, e.g. `Q27`."
    name: "English name."

- name: CountrySaint
  description: >-
    One saint, blessed, venerable or servant of God whose citizenship or birthplace Wikidata places
    in a country, identified by `memberKey` (`<country IRI>|<person IRI>`), with Catholic evidence
    for their cause. At most the 600 most famous per country (by Wikipedia sitelinks);
    CountrySaintCount counts them all. Fetched live, CC0, cached 30 days.
  examples:
    - q: "the most famous saints of Ireland"
      cypher: |
        MATCH (:Country {iso2: 'IE'})-[:SAINTS]->(s:CountrySaint)
        RETURN s.wdLabel AS name, s.canonization AS status, s.fame AS fame
        ORDER BY fame DESC
        LIMIT 10
  properties:
    memberKey:
      identity: true
      description: "`<country IRI>|<person IRI>`. Identity."
    country: "The country's entity IRI."
    wd: "The person's entity IRI — fetch the full card with `MATCH (c:SaintCard {wd: …})`."
    wdLabel: "English label."
    wdDescription: "One-line description."
    canonization:
      description: "The person's highest canonization status, as Wikidata labels it, e.g. `Catholic saint`, `blessed`, `Venerable`, `Servant of God`."
    birthDate:
      description: "Date of birth, ISO date-time in UTC as Wikidata stores it; empty when Wikidata has none."
    deathDate:
      description: "Date of death, ISO date-time in UTC as Wikidata stores it; empty when Wikidata has none."
    feastDay: "Feast day as Wikidata records it."
    article: "English Wikipedia article title, spaces as underscores."
    fame:
      type: int
      description: "How many Wikipedias have an article on them (Wikidata sitelinks) — the order of 'most famous'."
  virtualJoins:
    - anchorLabel: Country
      relationship: SAINTS
      keyField: wd
      recordKeyField: country
      producer: saintsOfCountryByFame
      description: "The saints and blessed of a country: `MATCH (:Country {iso2: 'IE'})-[:SAINTS]->(s:CountrySaint)`."

- name: CountrySaintCount
  description: >-
    One country's count of saints, blessed, venerable and servants of God, identified by `countKey`
    (`<country IRI>|count`) — citizenship or birthplace, Catholic evidence as for CountrySaint —
    counted on Wikidata, uncapped. Fetched live (CC0), cached 30 days.
  properties:
    countKey:
      identity: true
      description: "`<country IRI>|count`. Identity."
    country: "The country's entity IRI."
    total:
      type: int
      description: "Number of people (a count, no unit): saints, blessed, venerable and servants of God together."
    canonized:
      type: int
      description: "Those with a saint-level status (canonized saint, or a saint of the undivided Church)."
  virtualJoins:
    - anchorLabel: Country
      relationship: SAINT_COUNT
      keyField: wd
      recordKeyField: country
      producer: saintCountsOfCountry
      description: "A country's saint counts: `MATCH (c:Country)-[:SAINT_COUNT]->(n:CountrySaintCount)`."

- name: SaintRoll
  visibility: internal
  userAnchor: false
  description: >-
    The roll of saints as a door with one key: `scope`, always 'all' — so a bare MATCH
    (r:SaintRoll)-[:CAUSE]->(s:SaintCause) means every saint, blessed, venerable and servant of God
    at once. It is not stored and does not need to exist.
  properties:
    scope:
      metadata: { identity: "true", default: "all" }
      description: "The roll's one key, always `all`: everyone on the roll."

- name: SaintCause
  description: >-
    One person on the roll of saints, identified by `causeKey` (`all|<person IRI>`) — a saint,
    blessed, venerable or servant of God with Catholic evidence — and how far their cause has gone:
    the date of each stage Wikidata records, birth and death, and whether they died a martyr.
    Everyone at once (~7,700); fetched live, cached 30 days. About 1 in 9 saints has a canonization
    date, so a count by year counts what is dated.
  examples:
    - q: "how many people were canonized each year since 2000"
      cypher: |
        MATCH (:SaintRoll)-[:CAUSE]->(s:SaintCause)
        WHERE s.canonizationYear >= 2000
        RETURN s.canonizationYear AS year, count(s) AS canonized
        ORDER BY year
  properties:
    causeKey:
      identity: true
      description: "`all|<person IRI>`. Identity."
    scope: "Echo of the roll's scope."
    wd: "The person's entity IRI — the full card is `MATCH (c:SaintCard {wd: …})`."
    name: "English label, e.g. `Maximilian Kolbe`."
    description: "Wikidata's one-line English description."
    stage:
      values: ["saint", "blessed", "venerable", "servant of God", "other"]
      description: "How far the cause has gone, exactly: `saint`, `blessed`, `venerable`, `servant of God` or `other`. Filter on this, not `status`."
    status:
      description: "Wikidata's own label for the highest status, e.g. `Catholic saint`, `canonized saint`, `saint` (of the undivided Church), `blessed`, `Venerable`; open-ended — filter on `stage`."
    kind:
      values: ["person", "biblical figure", "existence disputed", "group or other"]
      description: "`person`, `biblical figure` (Adam, Sarah), `existence disputed` (legendary) or `group or other` (the Martyrs of Otranto). Lifespan questions keep to `person`."
    servantOfGodDate:
      description: "When the cause opened and they were named a servant of God: ISO date-time in UTC as Wikidata stores it; empty when undated."
    venerableDate:
      description: "When they were declared venerable (heroic virtue, or martyrdom accepted): ISO date-time in UTC; empty when undated."
    beatificationDate:
      description: "When they were beatified: ISO date-time in UTC, from the statement or the beatification event; empty when undated."
    canonizationDate:
      description: "When they were canonized: ISO date-time in UTC, from the statement or the canonization event; empty when undated."
    servantOfGodYear: { type: int, description: "Year of servantOfGodDate." }
    venerableYear: { type: int, description: "Year of venerableDate." }
    beatificationYear: { type: int, description: "Year of beatificationDate." }
    canonizationYear: { type: int, description: "Year of canonizationDate. Absent for most saints of the first millennium, who were never formally canonized, and for many since." }
    birthDate: "Date of birth, ISO timestamp — only when known at least to the year."
    deathDate: "Date of death, ISO timestamp — only when known at least to the year."
    birthYear: { type: int, description: "Year of birth. Absent when Wikidata gives only a century or decade." }
    deathYear: { type: int, description: "Year of death. Absent when Wikidata gives only a century or decade." }
    exactAgeAtDeath: { type: int, description: "Age at death in whole years, only when both dates are known to the day. Otherwise `deathYear - birthYear`, which may be one year high." }
    mannerOfDeath: "Manner of death as Wikidata records it (P1196), e.g. `homicide`, `capital punishment`, `natural causes`; several are comma-separated."
    causeOfDeath: "Cause of death as Wikidata records it (P509), e.g. `decapitation`, `tuberculosis`; several are comma-separated."
    killedEvidence: "Why they count as killed, when they do — `manner of death: homicide`, `cause of death: assassination`, or `described as: …assassinated…`. Weak evidence of martyrdom, not proof: the Martyrs view labels it as such."
    martyrEvidence: "Why they count as a martyr, when they do: `manner of death: martyrdom`, `Christian martyr`, or `described as: …` quoting Wikidata's description. Absent when nothing records it — not a finding that they were not."
  virtualJoins:
    - anchorLabel: SaintRoll
      relationship: CAUSE
      keyField: scope
      recordKeyField: scope
      producer: saintCausesAll
      # The whole roll is one read of about 8,200 causes (2026); the default cap of 5,000 cut it short,
      # and a ranked view over a cut roll is refused rather than answered wrong. Room to grow.
      maxFanoutTotal: 20000
      description: "Everyone on the roll: `MATCH (:SaintRoll)-[:CAUSE]->(s:SaintCause)`."

- name: ScriptureSaint
  description: >-
    One saint who is also a person of Scripture, identified by `qid` (the Wikidata QID, `Q33923`):
    the Wikidata saint and the Theographic person who is them, matched by hand (Peter is
    `peter_2745`, Mary the mother of Jesus `mary_1938`). The bridge from the calendar's saints to
    the verses that name them.
  userAnchor: false
  properties:
    qid:
      identity: true
      description: "Wikidata QID, e.g. `Q33923`. Identity."
    wd: "Wikidata entity IRI."
    personLookup: "Theographic person id — matches Verse.people and BiblePerson.personLookup."
    label: "Who they are, e.g. `James the Less (son of Alphaeus)`."
