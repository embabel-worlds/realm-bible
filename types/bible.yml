# The Bible as a graph: four STORED types and a set of VIRTUAL ones.
#
#   BibleCanon ◀─IN─ Book ◀─IN─ Passage ◀─IN─ BibleVerse ─MENTIONS──▶ BiblePerson ─FATHER/MOTHER─▶ BiblePerson
#                                                 │                       ▲
#                                                 └─RENDERED──▶ AsvVerse, BbeVerse, DarbyVerse, DraVerse, YltVerse
#                                                    │
#                                     BibleNameQuery {name} ──NAMED─────┤
#                                     BibleRoll {scope:'all'} ──PERSON──┘   (everyone at once)
#
# The stored types are children of realm-scripture-vocabulary — BibleCanon a HolyBook, Book a
# ScriptureBook, Passage a ScriptureChapter, BibleVerse a Verse — so a question asked of every
# scripture (`MATCH (v:Verse)`) reaches the Bible, and the Quran beside it. Inside this realm, ask
# for BibleVerse: a bare Verse is every scripture installed. The vocabulary's contract is why every
# stored node carries `scripture: 'bible'` and every verse an `ordinal` and a `translation`.
#
# The stored graph is seeded from reference/ and never changes. Every verse carries the King James
# text (`text`, the default) and the World English Bible (`web`, the modern choice), because both
# must be searchable. People and the older translations are fetched on demand. People are one
# small published file, so BibleRoll reads all ~3,070 at once for questions over everyone; the
# translations are one API call per verse, so there is no such door for them — search the stored
# KJV and WEB, then read the hits in Darby.

- name: BibleCanon
  parents: [HolyBook]
  userAnchor: false
  description: "The Bible as one holy book: the 66 books of the Protestant canon, in the King James Version. A single node, `scripture: 'bible'`; every Book is IN it. Not called `Bible` because that is this realm's provenance label, and a type may not share it."
  properties:
    scripture:
      identity: true
      description: "Always `bible`. Identity."

- name: Book
  parents: [ScriptureBook]
  description: >-
    One of the 66 books of the Protestant canon, identified by its OSIS abbreviation `osis` (Gen,
    Judg, 1Kgs), in canonical order (`bookOrder`). IN the BibleCanon; its chapters (Passage) are IN
    it. Not the deuterocanon: Tobit, Sirach and the rest are DeuterocanonBook.
  userAnchor: false
  properties:
    osis:
      identity: true
      description: "OSIS book abbreviation, e.g. `Judg`. Identity."
    name: "The book's name as printed, e.g. `Judges`, `1 Kings`, `Song of Solomon`."
    bookOrder:
      type: int
      description: "Position in the Protestant canon, 1 (Genesis) to 66 (Revelation)."
    testament:
      values: ["Old Testament", "New Testament"]
      description: "`Old Testament` (39 books) or `New Testament` (27)."
    division:
      values: ["Pentateuch", "Historical", "Poetry-Wisdom", "Major Prophets", "Minor Prophets", "Gospels", "Acts", "Pauline Epistles", "General Epistles", "Revelation"]
      description: "Traditional grouping, exactly: Pentateuch, Historical, Poetry-Wisdom, Major Prophets, Minor Prophets, Gospels, Acts, Pauline Epistles, General Epistles or Revelation."

- name: Passage
  parents: [ScriptureChapter]
  description: >-
    One chapter of a book, identified by `osis` (`Judg.3`) and named `Judges 3` — the unit of
    reading, and the unit a question about a stretch of narrative is asked at. Reached from
    BibleVerse via IN; itself IN a Book. KJV chapter numbering.
  userAnchor: false
  properties:
    osis:
      identity: true
      description: "OSIS chapter reference, e.g. `Judg.3`. Identity."
    name: "Human reference, e.g. `Judges 3`."
    book: "OSIS book abbreviation, e.g. `Judg`."
    chapter:
      type: int
      description: "Chapter number."
    verseCount:
      type: int
      description: "Number of verses in the chapter."

- name: BibleVerse
  parents: [Verse]
  description: >-
    One verse of the Bible, identified by `osis` (`Judg.3.21`) and named `Judges 3:21`, with the
    King James text as `text` (the default) and the World English Bible as `web`. `people` lists the
    Theographic ids of the people it mentions; traverse MENTIONS to get them. Search with
    toLower(v.text) CONTAINS 'goat' — which also matches `goats` and `scapegoat`.
  examples:
    - q: "which verses mention a goat, in canonical order"
      cypher: |
        MATCH (b:Book)<-[:IN]-(:Passage)<-[:IN]-(v:BibleVerse)
        WHERE toLower(v.text) CONTAINS 'goat'
        RETURN v.name AS reference, v.text AS text
        ORDER BY b.bookOrder, v.chapter, v.verse
        LIMIT 50
    - q: "who is mentioned in Judges 3"
      cypher: |
        MATCH (:Passage {name: 'Judges 3'})<-[:IN]-(v:BibleVerse)-[:MENTIONS]->(p:BiblePerson)
        RETURN p.displayTitle AS person, count(v) AS verses
        ORDER BY verses DESC
  userAnchor: false
  properties:
    osis:
      identity: true
      description: "OSIS verse reference, e.g. `Judg.3.21`. Identity."
    name: "Human reference, e.g. `Judges 3:21`."
    apiRef: "The same reference with the spaces removed, e.g. `1Kings16:31` — the key every translation producer fetches by, because a key with whitespace cannot be a URL path segment."
    book: "OSIS book abbreviation, e.g. `Judg`."
    chapter:
      type: int
      description: "Chapter number."
    verse:
      type: int
      description: "Verse number."
    text:
      description: "The verse in the King James Version (public domain, from Theographic's text) — the DEFAULT translation every view shows unless asked for `web`."
    web:
      description: "The verse in the World English Bible — modern English, public domain. Absent on the two verses (Romans 16:26–27) the WEB numbers differently."
    people:
      cardinality: LIST
      description: "Theographic person ids mentioned in this verse, e.g. `ehud_1039`. The key MENTIONS joins on."
    event: "The Theographic event(s) this verse belongs to, comma-separated when several, e.g. `Deliverance by Ehud`; empty when none is recorded."

# ── People ────────────────────────────────────────────────────────────────────────────────────────

- name: BibleNameQuery
  visibility: internal
  userAnchor: false
  description: >-
    An anchor for one name being looked up among the people of the Bible. Pin a name to reach
    everyone who bore it: `MATCH (:BibleNameQuery {name:'Zechariah'})-[:NAMED]->(p:BiblePerson)`.
    A name is not a person — there are 26 Zechariahs — so expect several rows.
  properties:
    name:
      identity: true
      description: "The name to look up, matched case-insensitively against Theographic's `name`. Identity."

- name: BibleIdQuery
  visibility: internal
  userAnchor: false
  description: >-
    An anchor for one Theographic person id. It exists so a person can be found by id where the id
    comes from data — a verse's `people`, a parent column — as in
    `MATCH (p:BiblePerson {personLookup: pid})`: the engine writes this door, pinned to the id, by itself.
  properties:
    personLookup:
      identity: true
      description: "Theographic's id for one person, e.g. `moses_2108`. Identity."

- name: BibleRoll
  visibility: internal
  userAnchor: false
  description: >-
    The roll of everyone in Theographic's people list, as a door with one key: `scope`, always 'all'
    — so a bare MATCH (:BibleRoll)-[:PERSON]->(p:BiblePerson) means every person (about 3,070). For
    counting, ranking and filtering over everyone; to find one person, ask by name or id instead. It
    is not stored and does not need to exist.
  properties:
    scope:
      metadata: { identity: "true", default: "all" }
      description: "The roll's one key, always `all`: everyone in Theographic's file."

- name: BiblePerson
  description: >-
    One person in the Bible, from Theographic Bible Metadata (CC BY-SA 4.0), identified by
    `personLookup` (`moses_2108`) — never by `name`, which 26 Zechariahs share. Reached by name
    (BibleNameQuery NAMED, or `{name: …}`), from a verse that mentions them (MENTIONS), or from a
    child (FATHER, MOTHER). Years are scholarly estimates, not facts. Read live from Theographic's
    published file.
  examples:
    - q: "who was Jezebel's father"
      cypher: |
        MATCH (p:BiblePerson {name: 'Jezebel'})-[:FATHER]->(f:BiblePerson)
        RETURN p.displayTitle AS person, f.displayTitle AS father
    - q: "how many women are named in the Bible"
      cypher: |
        MATCH (:BibleRoll)-[:PERSON]->(p:BiblePerson)
        WHERE p.gender = 'Female'
        RETURN count(p) AS women
  virtualJoins:
    - anchorLabel: BibleNameQuery
      relationship: NAMED
      keyField: name
      recordKeyField: nameQueried
      # Every record this producer returns carries the name it was found by as `name`, so
      # `MATCH (p:BiblePerson {name: 'Moses'})` can be answered through this join without the
      # BibleNameQuery anchor being written out. Case is the query's own: Cypher matches exactly.
      materializedKeyField: name
      producer: biblePeopleByName
      description: "Everyone who bore this name. A lead, not an identification."
    - anchorLabel: BibleRoll
      relationship: PERSON
      keyField: scope
      recordKeyField: rollScope
      producer: biblePeopleAll
      description: "Everyone: `MATCH (:BibleRoll)-[:PERSON]->(p:BiblePerson)`. For questions over all people; find one by name or id."
    - anchorLabel: BibleIdQuery
      relationship: WITH_ID
      keyField: personLookup
      recordKeyField: lookupQueried
      # The door is identified by the very id it fetches with, so a pin on `personLookup` names exactly
      # one door — which is what lets `MATCH (p:BiblePerson {personLookup: pid})` be answered by id.
      # MENTIONS also declares personLookup, but its door is a stored Verse holding a LIST of ids: a pin
      # cannot name one BibleVerse, and the engine will not look a person up through it.
      materializedKeyField: personLookup
      producer: biblePeopleById
      description: "The one person with this Theographic id."
    - anchorLabel: BibleVerse
      relationship: MENTIONS
      keyField: people
      recordKeyField: lookupQueried
      # Every BiblePerson carries its id as `personLookup`, whichever producer fetched it. Declaring
      # that lets a query asked from the verse side — `(v:BibleVerse)-[:MENTIONS]-(p {name:'Moses'})` —
      # fetch the Moseses by NAME and link the verses that list them, instead of binding all 31,102
      # verses and being refused. `lookupQueried` is an echo only this producer writes.
      materializedKeyField: personLookup
      producer: biblePeopleById
      description: "The people a verse mentions, as Theographic tags them."
    - anchorLabel: BiblePerson
      relationship: FATHER
      keyField: father
      recordKeyField: lookupQueried
      producer: biblePeopleById
      description: "This person's father, where Theographic records one."
    - anchorLabel: BiblePerson
      relationship: MOTHER
      keyField: mother
      recordKeyField: lookupQueried
      producer: biblePeopleById
      description: "This person's mother, where Theographic records one."
    # FATHER and MOTHER read from the parent: keyed by the parent's own id, a record belongs to the
    # anchor when its `father` (or `mother`) names it. Declared TO_ANCHOR because the edge still runs
    # child→parent; the engine picks this join when the query walks the arrow backwards, as in
    # `(p:BiblePerson {name:'Moses'})<-[:FATHER|MOTHER*]-(a)`, so descendants need no other vocabulary.
    - anchorLabel: BiblePerson
      relationship: FATHER
      direction: TO_ANCHOR
      keyField: personLookup
      recordKeyField: father
      producer: biblePeopleByFather
      description: "The people whose father this is — the FATHER edge walked from the father's end."
    - anchorLabel: BiblePerson
      relationship: MOTHER
      direction: TO_ANCHOR
      keyField: personLookup
      recordKeyField: mother
      producer: biblePeopleByMother
      description: "The people whose mother this is — the MOTHER edge walked from the mother's end."
    - anchorLabel: BiblePerson
      relationship: CHILD
      keyField: childIds
      recordKeyField: lookupQueried
      producer: biblePeopleById
      description: "This person's children. The reverse of FATHER and MOTHER, so descendants can be walked."
  properties:
    personLookup:
      identity: true
      description: "Theographic id, e.g. `jezebel_1605`. Identity; the value a BibleVerse's `people` list holds."
    name:
      description: "The person's name as Theographic spells it, e.g. `Jezebel`; shared by every bearer — `displayTitle` tells them apart."
    displayTitle: "Name with a disambiguating note where one is needed, e.g. `Zechariah (son of Jehoiada)`."
    gender:
      values: ["Male", "Female"]
      description: "`Male` or `Female`, capitalised, as Theographic records it."
    birthYear:
      type: int
      description: "Estimated year of birth, a whole year; negative is BC, e.g. `-1526`. A scholarly estimate; empty when Theographic gives none."
    deathYear:
      type: int
      description: "Estimated year of death, a whole year; negative is BC. A scholarly estimate; empty when Theographic gives none."
    verseCount:
      type: int
      description: "How many verses mention this person, by Theographic's tagging."
    verses:
      description: "Comma-separated OSIS references of every verse that mentions this person, e.g. `Judg.3.15,Judg.3.16`."
    father: "Theographic id of the father, when recorded. The key FATHER joins on."
    mother: "Theographic id of the mother, when recorded. The key MOTHER joins on."
    partners:
      description: "Comma-separated Theographic ids of spouses; empty when none are recorded."
    children:
      description: "Comma-separated Theographic ids of children; empty when none are recorded. `childIds` is the same as a list."
    childIds: "The children's Theographic ids as a list, split from `children`. The key CHILD joins on."
    siblings:
      description: "Comma-separated Theographic ids of siblings; empty when none are recorded."
    dictionary:
      description: "Easton's Bible Dictionary entry (1897, public domain) for this person, where Theographic links one; empty otherwise."
    nameQueried:
      description: "The name this record was fetched for — set only on records reached by name (NAMED)."
    lookupQueried:
      description: "The Theographic id this record was fetched for — set on records reached by id (MENTIONS, FATHER, MOTHER, CHILD)."

# ── Other translations ────────────────────────────────────────────────────────────────────────────
#
# One TYPE per translation, not one type with a `translation` property. A type has exactly one
# identity property, and the only key a fetched verse carries is the reference it was fetched for.
# If the five shared a type, the ASV and the Darby renderings of Judges 3:21 would carry the same
# identity and MERGE into one node, and a side-by-side comparison would show one translation twice.
# The shared parent `Rendering` is what lets a query treat them alike.

- name: Rendering
  visibility: internal
  userAnchor: false
  description: >-
    One verse in one of the five fetched translations, identified by `key`, the reference it was
    fetched for (`Judges3:21`). Parent of AsvVerse, BbeVerse, DarbyVerse, DraVerse and YltVerse, so
    a query can treat them alike.
  properties:
    key:
      identity: true
      description: "The reference this rendering was fetched for, e.g. `Judges3:21`."
    text:
      description: "The verse in this translation, with the source's own whitespace (trim() it for display)."
    translation:
      values: ["asv", "bbe", "darby", "dra", "ylt"]
      description: "bible-api's translation id, lower case: asv, bbe, darby, dra or ylt."
    translationName:
      description: "The translation's full name as bible-api gives it, e.g. `American Standard Version (1901)`."

- name: AsvVerse
  parents: [Rendering]
  description: >-
    One verse in the American Standard Version (1901, public domain), identified by `key`, the
    reference fetched (`Judges3:21`). Reached from BibleVerse via RENDERED; fetched live from
    bible-api.com, one call per verse, cached forever.
  virtualJoins:
    - anchorLabel: BibleVerse
      relationship: RENDERED
      keyField: apiRef
      recordKeyField: key
      producer: asvVerse
      description: "This verse in the American Standard Version."
  properties:
    key:
      identity: true
      description: "The reference fetched, e.g. `Judges3:21`."
    text:
      description: "The verse in this translation, with the source's own whitespace (trim() it for display)."
    translation: "Always `asv`."
    translationName:
      description: "The translation's full name as bible-api gives it."

- name: BbeVerse
  parents: [Rendering]
  description: >-
    One verse in the Bible in Basic English (1949/1964, public domain) — an 850-word vocabulary, the
    plainest English here — identified by `key`, the reference fetched (`Judges3:21`). Reached from
    BibleVerse via RENDERED; fetched live, one call per verse, cached forever.
  virtualJoins:
    - anchorLabel: BibleVerse
      relationship: RENDERED
      keyField: apiRef
      recordKeyField: key
      producer: bbeVerse
      description: "This verse in the Bible in Basic English."
  properties:
    key:
      identity: true
      description: "The reference fetched, e.g. `Judges3:21`."
    text:
      description: "The verse in this translation, with the source's own whitespace (trim() it for display)."
    translation: "Always `bbe`."
    translationName:
      description: "The translation's full name as bible-api gives it."

- name: DarbyVerse
  parents: [Rendering]
  description: >-
    One verse in the Darby Bible (1890, public domain) — close to the source languages — identified
    by `key`, the reference fetched (`Judges3:21`). Reached from BibleVerse via RENDERED; fetched
    live, one call per verse, cached forever.
  virtualJoins:
    - anchorLabel: BibleVerse
      relationship: RENDERED
      keyField: apiRef
      recordKeyField: key
      producer: darbyVerse
      description: "This verse in the Darby Bible."
  properties:
    key:
      identity: true
      description: "The reference fetched, e.g. `Judges3:21`."
    text:
      description: "The verse in this translation, with the source's own whitespace (trim() it for display)."
    translation: "Always `darby`."
    translationName:
      description: "The translation's full name as bible-api gives it."

- name: DraVerse
  parents: [Rendering]
  description: >-
    One verse in the Douay-Rheims (1899 American edition, public domain) — the Catholic translation
    from the Vulgate — identified by `key`, the KJV-numbered reference fetched (`Psalms23:1`, which
    is the Vulgate's Psalm 22). Reached from BibleVerse via RENDERED; fetched live, one call per
    verse, cached forever.
  virtualJoins:
    - anchorLabel: BibleVerse
      relationship: RENDERED
      keyField: apiRef
      recordKeyField: key
      producer: draVerse
      description: "This verse in the Douay-Rheims."
  properties:
    key:
      identity: true
      description: "The reference fetched, e.g. `Judges3:21`."
    text:
      description: "The verse in this translation, with the source's own whitespace (trim() it for display)."
    translation: "Always `dra`."
    translationName:
      description: "The translation's full name as bible-api gives it."

- name: YltVerse
  parents: [Rendering]
  description: >-
    One verse in Young's Literal Translation (1898, public domain) — word-for-word, keeping the
    source tenses — identified by `key`, the reference fetched (`John3:16`). New Testament only: an
    Old Testament verse has none. Reached from BibleVerse via RENDERED; fetched live, cached
    forever.
  virtualJoins:
    - anchorLabel: BibleVerse
      relationship: RENDERED
      keyField: apiRef
      recordKeyField: key
      producer: yltVerse
      description: "This verse in Young's Literal Translation."
  properties:
    key:
      identity: true
      description: "The reference fetched, e.g. `Judges3:21`."
    text:
      description: "The verse in this translation, with the source's own whitespace (trim() it for display)."
    translation: "Always `ylt`."
    translationName:
      description: "The translation's full name as bible-api gives it."
